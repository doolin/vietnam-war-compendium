- month: 1
  day: 28
  year: 1969
  title: "RT New Mexico inserted north of the Dak Xou river"
  body: "<p>On January 28, 1969, a newly formed team, RT New Mexico, was inserted on a recon mission north of the Dak Xou river, a couple of kilometers east of the eastern border of Target Area Juliett-9, under the command of One-Zero Specialist 5 Larry A. Stephens.</p><p>SOG recon team missions were conducted in a \"target box,\" which on a map was a 6x6 kilometer area with an alpha-numeric designation. Juliett-9 had drawn earlier missions: on October 24, RT Colorado and One-Zero Sergeant Dennis Mack were inserted there to do an area recon, and on November 10, 1968, RT California set up an ambush there along a branch of Highway 96, a main artery of the Ho Chi Minh Trail.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Joe Parnar and Robert Dumont, SOG Kontum: Top Secret Missions in Vietnam, Laos, and Cambodia, 1968–1969, Kindle locations 222, 1635, 1928, 3547"
      url: https://openlibrary.org/works/OL27817833W
  status: approved
  source_text: "[loc 222] SOG recon team missions were conducted in a “target box” which on a map was a 6x6 kilometer area with an alpha-numeric designation. [loc 1635] On October 24, RT Colorado and One-Zero Sergeant Dennis Mack were inserted into Target Area Juliett-9 to do an area recon. [loc 1928] On November 10, 1968, the second day of a combat patrol mission in Target Area Juliett-9, RT California, led by One-Zero Staff Sergeant Joe Walker, had set up an ambush along a branch of Highway 96—a main artery of the Ho Chi Minh Trail. [loc 3547] On January 28, 1969, a newly formed team, RT New Mexico, was inserted on a recon mission north of the Dak Xou river, a couple of klicks east of the eastern border of Target Area Juliett-9, under the command of One-Zero Specialist 5 Larry A. Stephens."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:27:14Z"

- month: 3
  day: 3
  year: 1969
  title: "NVA attacks Ben Het with PT-76 tanks"
  body: "<p>On March 3, 1969, the isolated Special Forces Camp at Ben Het was attacked by the North Vietnamese Army using Russian PT-76 tanks and BMP-40 armored personnel carriers.</p><p>The book's chapter on Operation Nightcap (SLAM 9) opens with the attack. Nightcap got underway on March 15, 1969, when Company A was inserted by helicopter along with RT Arizona, which provided reconnaissance capabilities and served as the eyes and ears of the SLAM company.</p><p>The camp was still under siege in June. On June 16, 1969, Cobra pilot Mark Clotfelter and his co-pilot Warrant Officer Michael Mahowald were killed in action while flying convoy support near the camp during the siege.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Joe Parnar and Robert Dumont, SOG Kontum: Top Secret Missions in Vietnam, Laos, and Cambodia, 1968–1969, Kindle locations 3061, 3786, 3795"
      url: https://openlibrary.org/works/OL27817833W
  status: approved
  source_text: "[loc 3061] on June 16, 1969, Cobra pilot Mark Clotfelter and his co-pilot Warrant Officer Michael Mahowald were KIA while flying convoy support near the Special Forces Camp at Ben Het during the siege of that camp. [loc 3786] On March 3, 1969, the isolated Special Forces Camp at Ben Het, was attacked by the North Vietnamese Army using Russian PT-76 Tanks and BMP-40 Armored Personnel Carriers. [loc 3795] Operation Nightcap got underway when Company A was inserted by helicopter on March 15, 1969, along with RT Arizona which would provide reconnaissance capabilities and serve as the eyes and ears of the SLAM company."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:27:14Z"

