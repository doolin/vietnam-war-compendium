- month: 6
  day: 13
  year: 1968
  title: "Chase medic Parnar flies on Ghost 153"
  body: "<p>On June 13, 1968, Specialist 4 Joseph F. Parnar flew as chase medic aboard Ghost 153. The book records the flight, in a photograph credited to Bryon Loucks, in its chapter on the loss of John Kedenburg. Specialist 5 John J. Kedenburg had served as One-Two of ST Nevada in May 1968.</p><p>The following day a Bright Light rescue operation launched from the FOB to search for Kedenburg. Specialist 5 Thomas P. Cunningham went on the June 14 mission as a straphanger with ST Illinois.</p>"
