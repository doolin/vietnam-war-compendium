  year: 1968
  title: "Chase medic Dorff's Huey shot down during SLAM VII"
  body: "<p>On November 18, 1968, Staff Sergeant Anthony C. Dorff was serving as chase medic aboard a Huey when the helicopter was shot down. The book records the loss, with a photograph credited to Dorff himself, in a chapter on SLAM VII titled \"Shot Down on the LZ,\" which carries Carl Hoeck's account of the day.</p><p>SLAM VII was targeted against Base Area 613, a suspected Viet Cong/NVA base area and logistic complex. It was initiated in November and continued into early December. Thirteen recon teams, four independent platoons, and four companies were concentrated against the target area, and 112 tactical air and 42 helicopter gunship strikes were employed to exploit targets detected and fixed by ground elements.</p>"
