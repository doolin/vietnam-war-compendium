# Book: SOG Kontum: Top Secret Missions in Vietnam, Laos, and Cambodia, 1968–1969 (Joe Parnar and Robert Dumont)
# Highlights: /Users/daviddoolin/src/vietnam-war-compendium/kindle-highlights/sog-kontum.yaml
- month: 1
  day: 24
  year: 1964
  title: "Joint Chiefs create MACV-SOG"
  body: "<p>On January 24, 1964, the Joint Chiefs of Staff created SOG as a subsidiary command of the Military Assistance Command, Vietnam (MACV).</p><p>SOG recon team missions were conducted in a \"target box,\" which on a map was a 6x6 kilometer area with an alpha-numeric designation.</p><p>MACV-SOG was deactivated on April 30, 1972, and its personnel returned to Fort Bragg, North Carolina. The command's achievements came at a high cost: twelve recon teams disappeared entirely. Eight men assigned to SOG received the Congressional Medal of Honor, and a total of 23 received the Distinguished Service Cross, the nation's second-highest award for valor.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Joe Parnar and Robert Dumont, SOG Kontum: Top Secret Missions in Vietnam, Laos, and Cambodia, 1968–1969, Kindle locations 154, 222, 4487, 4490, 4493"
      url: https://openlibrary.org/works/OL27817833W
  status: approved
  source_text: "[loc 154] The Joint Chiefs of Staff created SOG on 24 January, 1964 as a subsidiary command of the Military Assistance Command, Vietnam (MACV). [loc 222] SOG recon team missions were conducted in a “target box” which on a map was a 6x6 kilometer area with an alpha-numeric designation. [loc 4487] personnel returned to Fort Bragg, North Carolina. MACV-SOG was deactivated on April 30, 1972. [loc 4490] The achievements of SOG were many, but came at a high cost. Twelve RTs disappeared entirely [loc 4493] Eight men assigned to SOG received the Congressional Medal of Honor. A total of 23 received the Distinguished Service Cross, the nation’s second-highest award for valor."
  summarized_by: "Claude Fable 5.1"
