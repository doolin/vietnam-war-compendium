- month: 6
  day: 16
  year: 1969
  title: "Cobra pilot Clotfelter and co-pilot Mahowald killed near Ben Het"
  body: "<p>On June 16, 1969, Cobra pilot Mark Clotfelter and his co-pilot Warrant Officer Michael Mahowald were killed in action while flying convoy support near the Special Forces Camp at Ben Het during the siege of that camp.</p><p>The isolated camp had been attacked on March 3, 1969, by the North Vietnamese Army using Russian PT-76 tanks and BMP-40 armored personnel carriers, and it was still under siege more than three months later when the two pilots died. The book notes their deaths in its chapter on the last days of SLAM VII.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Joe Parnar and Robert Dumont, SOG Kontum: Top Secret Missions in Vietnam, Laos, and Cambodia, 1968–1969, Kindle locations 3061, 3786"
      url: https://openlibrary.org/works/OL27817833W
  status: approved
  source_text: "[loc 3061] on June 16, 1969, Cobra pilot Mark Clotfelter and his co-pilot Warrant Officer Michael Mahowald were KIA while flying convoy support near the Special Forces Camp at Ben Het during the siege of that camp. [loc 3786] On March 3, 1969, the isolated Special Forces Camp at Ben Het, was attacked by the North Vietnamese Army using Russian PT-76 Tanks and BMP-40 Armored Personnel Carriers."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:27:14Z"

- month: 4
  day: 30
  year: 1972
  title: "MACV-SOG deactivated"
  body: "<p>On April 30, 1972, MACV-SOG was deactivated and its personnel returned to Fort Bragg, North Carolina. The Joint Chiefs of Staff had created SOG on January 24, 1964, as a subsidiary command of the Military Assistance Command, Vietnam.</p><p>The achievements of SOG were many, but came at a high cost. Twelve recon teams disappeared entirely. Eight men assigned to SOG received the Congressional Medal of Honor, and a total of 23 received the Distinguished Service Cross, the nation's second-highest award for valor.</p><p>Following the North Vietnamese victory in 1975, the Communists instituted what the book calls Cultural Leveling, a long-term ethnic cleansing, to eradicate all ethnic minority cultures in Vietnam.</p>"
