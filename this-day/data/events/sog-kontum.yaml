- month: 12
  day: 30
  year: 1968
  title: "Bright Light platoon searches for PFC Scherdin in Cambodia"
  body: "<p>On December 30, 1968, the day after RT Vermont's mission, a Bright Light recovery platoon was launched to search for Private First Class Robert Scherdin. Gerald Apperson, Team One-Zero of RT Vermont, gave a written statement on the loss dated January 2, 1969.</p><p>The search continued into the new year. A recon team inserted into Cambodia to search for Scherdin's body was picked up on January 8, 1969, after four days on the ground. Between November 13 and 15, 1993, a Joint U.S.–Cambodian Field Activity was conducted to search for his remains, recorded as Case #1351.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Joe Parnar and Robert Dumont, SOG Kontum: Top Secret Missions in Vietnam, Laos, and Cambodia, 1968–1969, Kindle locations 3165, 3241, 3327, 3491"
      url: https://openlibrary.org/works/OL27817833W
  status: approved
  source_text: "[loc 3165] Written statement: Gerald Apperson, Team One-Zero, RT Vermont, January 2, 1969: [loc 3241] The following day (after RT Vermont’s mission), December 30, 1968, a Bright Light recovery platoon was launched to search for Private First Class Robert Scherdin. [loc 3327] I was flying as chase medic when we picked up a recon team on January 8, 1969, in Cambodia that had been inserted four days previously to search for the body of Private Robert F. Scherdin, [loc 3491] Between November 13 and 15, 1993, a Joint U.S.–Cambodian Field Activity was conducted to search for the remains of Robert Scherdin (Case #1351)."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:27:14Z"

- month: 1
  day: 8
  year: 1969
  title: "Recon team extracted from Cambodia after Scherdin search"
  body: "<p>On January 8, 1969, a recon team was picked up in Cambodia after four days on the ground searching for the body of Private Robert F. Scherdin. The narrator of the account was flying as chase medic on the pickup.</p><p>Scherdin had been lost during RT Vermont's mission at the end of December. On December 30, 1968, the day after that mission, a Bright Light recovery platoon had been launched to search for him, and Gerald Apperson, Team One-Zero of RT Vermont, gave a written statement dated January 2, 1969. The search did not end with the war: between November 13 and 15, 1993, a Joint U.S.–Cambodian Field Activity was conducted to search for his remains, recorded as Case #1351.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Joe Parnar and Robert Dumont, SOG Kontum: Top Secret Missions in Vietnam, Laos, and Cambodia, 1968–1969, Kindle locations 3165, 3241, 3327, 3491"
      url: https://openlibrary.org/works/OL27817833W
  status: approved
  source_text: "[loc 3165] Written statement: Gerald Apperson, Team One-Zero, RT Vermont, January 2, 1969: [loc 3241] The following day (after RT Vermont’s mission), December 30, 1968, a Bright Light recovery platoon was launched to search for Private First Class Robert Scherdin. [loc 3327] I was flying as chase medic when we picked up a recon team on January 8, 1969, in Cambodia that had been inserted four days previously to search for the body of Private Robert F. Scherdin, [loc 3491] Between November 13 and 15, 1993, a Joint U.S.–Cambodian Field Activity was conducted to search for the remains of Robert Scherdin (Case #1351)."
