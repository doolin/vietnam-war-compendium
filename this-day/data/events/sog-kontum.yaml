- month: 11
  day: 10
  year: 1968
  title: "RT California sets ambush on Highway 96 during SLAM VII"
  body: "<p>On November 10, 1968, the second day of a combat patrol mission in Target Area Juliett-9, RT California, led by One-Zero Staff Sergeant Joe Walker, set up an ambush along a branch of Highway 96, a main artery of the Ho Chi Minh Trail.</p><p>The patrol was part of SLAM VII, which was targeted against Base Area 613, a suspected Viet Cong/NVA base area and logistic complex. SLAM VII was initiated in November and continued into early December. Thirteen recon teams, four independent platoons, and four companies were concentrated against the target area, and 112 tactical air and 42 helicopter gunship strikes were employed to exploit targets detected and fixed by ground elements.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Joe Parnar and Robert Dumont, SOG Kontum: Top Secret Missions in Vietnam, Laos, and Cambodia, 1968–1969, Kindle locations 1928, 2885"
      url: https://openlibrary.org/works/OL27817833W
  status: approved
  source_text: "[loc 1928] On November 10, 1968, the second day of a combat patrol mission in Target Area Juliett-9, RT California, led by One-Zero Staff Sergeant Joe Walker, had set up an ambush along a branch of Highway 96—a main artery of the Ho Chi Minh Trail. [loc 2885] SLAM VII, targeted against BA [Base Area] 613 was initiated in November and continued on into early December. Thirteen RTs, four independent platoons, and four companies were concentrated against the target area, a suspected Viet Cong/ NVA Base Area—Logistic Complex. There were 112 tac air and 42 helicopter gunship strikes employed to exploit targets detected and fixed by ground elements."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:27:14Z"

- month: 11
