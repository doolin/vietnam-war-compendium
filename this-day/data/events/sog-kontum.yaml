  source_text: "[loc 464] Specialist 5 John J. Kedenburg, One-Two of ST Nevada in May 1968. (Lou DeSeta) [loc 773] Specialist 4 Joseph F. Parnar, chase medic riding on Ghost 153 on June 13, 1968. (Bryon Loucks) [loc 894] Specialist 5 Thomas P. Cunningham, straphanger of ST Illinois on June 14, 1968 Bright Light mission. (Tony Love) [loc 896] The following day a Bright Light [rescue] operation launched from the FOB to search for John Kedenburg."
