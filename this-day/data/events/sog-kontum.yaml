- month: 3
  day: 15
  year: 1969
  title: "Operation Nightcap begins with Company A insertion"
  body: "<p>On March 15, 1969, Operation Nightcap got underway when Company A was inserted by helicopter along with RT Arizona, which provided reconnaissance capabilities and served as the eyes and ears of the SLAM company. The book records the operation as SLAM 9.</p><p>The chapter opens with the attack twelve days earlier on the isolated Special Forces Camp at Ben Het, which the North Vietnamese Army struck on March 3, 1969, using Russian PT-76 tanks and BMP-40 armored personnel carriers. The camp was still under siege in June, when Cobra pilot Mark Clotfelter and his co-pilot Warrant Officer Michael Mahowald were killed in action flying convoy support nearby.</p>"
