- month: 6
  day: 17
  year: 1967
  title: "C-130B crashes on takeoff at An Khe, killing 35"
  body: "<p>On June 17, 1967, a United States Air Force Lockheed C-130B Hercules, registration 60-0293, crashed on takeoff from An Khe Air Base in Vietnam. The transport was bound for Qui Nhon Airport, 63 km away. As it neared decision speed, the airplane drifted to the left off the side of the runway. The crew brought it back onto the runway, but it overshot the runway end, slid down an embankment, and burst into flames.</p>\n<p>Of the 56 people on board, 35 were killed, all of them passengers; none of the seven crew members died. The aircraft was destroyed and written off. The Aviation Safety Network ranked the crash as the third-worst accident involving the Lockheed C-130 at the time.</p>"
