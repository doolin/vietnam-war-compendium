- month: 6
  day: 25
  year: 1966
  title: "Marines open Operation Jay in Thua Thien"
  body: "<p>On June 25, 1966, the 4th Marines began Operation Jay, a helilift of two Marine battalions in Thua Thien Province. At 0800, the first wave of 19 CH-46s from MAG-16 started its descent into Landing Zone Raven carrying the lead elements of the 2d Battalion, 4th Marines. The 2d Battalion, 1st Marines landed at LZ Shrike at 1100 and set up blocking positions. To the north, two ARVN battalions were in position for the companion operation, Lam Son-284.</p>\n<p>The 2d Battalion, 4th Marines met heavy small arms fire from the fortified hamlet of Ap Chinh An, and the 2d Battalion, 1st Marines met strong enemy forces in My Phu. Fighting continued through the night; the destroyer Davis alone fired more than 530 rounds on the 25th. From June 25 to 28, the two Marine battalions lost 23 dead and 58 wounded, all but two of the deaths in the initial fighting of June 25. The Marines recovered 82 enemy bodies and estimated killing 200 more.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Shulimson, \"U.S. Marines in Vietnam: An Expanding War, 1966\", History and Museums Division, Headquarters, U.S. Marine Corps, 1982, pp. 150-154"
      url: "https://www.usmcu.edu/Portals/218/US%20Marines%20in%20Vietnam%20An%20Expanding%20War%201966%20%20PCN%2019000308600.pdf"
    - label: "Wikipedia, \"1966 in the Vietnam War\", revision 1380091905 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1966_in_the_Vietnam_War&oldid=1380091905"
  status: "draft"
  source_text: "[Shulimson, An Expanding War 1966, p. 150] Heavy Fighting in Thua Thien Provinc e ... the resulting pla n called for the helilift of two Marine battalions int o an area of operations bounded by the 0 Lau River o n the north and west, and Route 1 to the south . ... The 1st ARVN Division in the companion operation, Lam Son-284, was to establish blocking positions to the north of the Marine operation, across the 0 Lau River . ... By 0730 on the morning of 25 June, the operation, codenamed Jay, was ready to begin . ... To the north, two ARVN battalion s were in position across the 0 Lau . At 0800, unde r clear skies, the first wave of 19 CH-46s fro m MAG-16, carrying the lead elements of the 2d Battalion, 4th Marines, started their descent int o Landing Zone Raven, approximately 8,000 meter s north of the 4th Marines' command post .\n\n[Shulimson, An Expanding War 1966, p. 152] As the Marines renewed their advance , however, the enemy opened up with heavy small arms fire from Ap Chinh An, the same fortified hamlet that had caused such frustration for the 1s t Battalion, 4th Marines earlier in Operation Oregon . ... Lieutenant Colonel Hanifin 's 2d Battalion, 1s t Marines, meanwhile, had arrived at 1100 in it s landing zone, LZ Shrike, approximately 9,00 0 meters southeast from LZ Raven . As planned, th e battalion then established its blocking positions a t Phase Line Delta ... the Marines met strong enemy forces in the hamlet o f My Phu . ... Through the night and early morning hours of 25-26 June, both battalions continued to encounte r heavy resistance in the two hamlets . ... Marine aircraft and artillery reinforced by the guns of the destroye r Davis (DD 957) repeatedly bombarded the enem y positions in the two hamlets . The Davis alone fired more than 530 rounds on the 25th . ... Marines unload supplies from a helicopter during Operation Jay in June 1966 . In heavy fighting, the 4th Marines engaged three enemy battalions in northeastern Thua Thie n Province .\n\n[Shulimson, An Expanding War 1966, p. 154] From 25-28 June, the two Marine battalions too k casualties of 23 dead and 58 wounded, with all bu t two of the deaths and seven of the injuries having occurred in the initial fighting of 25 June . The Marine s recovered 82 bodies of the enemy and estimated killing 200 more .\n\n[Wikipedia, 1966_in_the_Vietnam_War, rev 1380091905] Operation Jay was a U.S. 4th Marine Regiment and ARVN 1st Division search and destroy operation on the Street Without Joy. The operation resulted in 475 PAVN and 24 Marines killed."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T17:00:00Z"
- month: 6
  day: 26
  year: 1971
  title: "3d Marine Amphibious Brigade headquarters leaves Da Nang"
  body: "<p>On June 26, 1971, the 3d Marine Amphibious Brigade Headquarters closed down. That day, Major General Armstrong left Da Nang with 10 members of his staff, 53 other MAB Marines, and about 2,000 pounds of records and files, boarding a Marine KC-130F tanker for the flight to Okinawa, the first leg of their trip to Hawaii. The brigade's movement reports were filed that day and carried to Armstrong's waiting aircraft.</p>\n<p>The following day, 3d MAB was formally deactivated. After its last elements departed, only 542 Marine officers and men remained in Vietnam, most of them members of Sub-Unit 1, 1st Air and Naval Gunfire Liaison Company. For the Marine Corps, the war reverted to an advisory effort.</p>"
