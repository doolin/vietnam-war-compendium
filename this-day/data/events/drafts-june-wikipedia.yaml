- month: 6
  day: 20
  year: 1972
  title: "3d Brigade, 1st Cavalry Division stands down"
  body: "<p>On June 20, 1972, the 3d Brigade, 1st Cavalry Division (Airmobile), stood down in a brief ceremony. GEN Creighton W. Abrams and LTG Nguyen Van Minh, Military Region 3 Commander, joined BG James F. Hamlet, the Brigade Commander, for the ceremony.</p>\n<p>On June 17, MACV had announced the standdown of major elements of the last two US infantry brigades in South Vietnam, the 196th at Da Nang/Phu Bai and the 3d Brigade at Bien Hoa. By June 30, US troop strength was reduced to 48,000 as Increment XII withdrawals were completed.</p>"
