  title: "Communists ambush passenger bus near Le Tri"
  body: "<p>On June 12, 1962, Communists ambushed a civilian passenger bus near Le Tri, An Giang province. The attackers killed the passengers, the driver, and the driver's helper, a total of five men and women.</p>\n"
