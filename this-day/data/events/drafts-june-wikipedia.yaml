  source_text: "[Cosmas, Vietnamization and Redeployment, p. 246] Armstrong and his staff left Da Nang on schedule , after a hectic, uncomfortable month of coping wit h the myriad final details of redeployment while thei r facilities were being dismantled around them . ... In spite of these last-minute difficulties, 3d Marin e Amphibious Brigade Headquarters closed down on 2 6 June . That day, Major General Armstrong, with 1 0 members of his staff, 53 other MAB Marines, an d about 2,000 pounds of records and files, including th e messages from Korat, boarded a Marine KC-130 F tanker for the flight to Okinawa, the first leg of their trip to Hawaii . The following day, 3d MAB was formally deactivated . ... Message traffic was picked u p and processed every two hours until Captain Fishero (Com m Center Officer) filed the Brigade Headquarters and CSC- 7 movement reports on 26 June . The final message pickup was made when the movement reports were filed and carrie d to General Armstrong's waiting aircraft.\n\n[Cosmas, Vietnamization and Redeployment, p. 247] After the departure of the last elements of the 3 d MAB, only 542 Marine officers and men remained i n Vietnam . Most were members of Sub-Unit 1, 1st Ai r and Naval Gunfire Liaison Company (ANGLICO) ; others comprised the Marine Advisory Unit (MAU) , serving with the Vietnamese Marine Corps, and th e U.S . Embassy security guard detachment at Saigon .\n\n[Cosmas, Vietnamization and Redeployment, p. 392] The last units o f the 3d MAB left Vietnam by sea and air on 25 an d 26 June . Only Sub-Unit One, 1st Air and Naval Gun fire Liaison Company ; the Marine Advisory Unit; the Embassy Marines ; a handful of technicians ; and Marines on the MACV staff remained, For the Marine Corps, the war reverted to an advisory effort .\n\n[Cosmas, Vietnamization and Redeployment, p. 449, Chronology] 26 June The 3d MAB closed its headquarters . 27 June The 3d MAB was deactivated .\n\n[Wikipedia, 1971_in_the_Vietnam_War, rev 1370279651] The last units of the 3rd Marine Amphibious Brigade left Da Nang."
