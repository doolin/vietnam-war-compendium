      url: "https://en.wikipedia.org/w/index.php?title=1968_in_the_Vietnam_War&oldid=1370342410"
  status: "draft"
  source_text: "[HQ MACV, Monthly Summary February 1969, p. 2 (PDF p. 2)] HEADQUARTERS\nUNITED STATES MILITARY ASSISTANCE COMMAND, VIETNAM\nOffic e of Inform ation\n[HQ MACV, Monthly Summary February 1969, p. 30 (PDF p. 32)] 16 February (Sunday)\n[HQ MACV, Monthly Summary February 1969, p. 31 (PDF p. 33)] TOAN THANG (III CTZ/II FFV): Phase II of the cont TOAN THAN OFFENSIVE,\nan ARVN III Corps, & US II Fld Force, VN, multi~iv op was terminated.\nPhase I of the campaign began S Apr 6S & terminated 31 May 6S res in\n11,397 en kd. Phase II began 1 Jun 6S. During Phase II, a total of\n25,42S en soldiers were kd, & 10,724 suspects were dtn by the comb .\nforces. In addition, 10,285 I/Wpns & 2,307 CSW were cptrd along with\n1,698 tons of rice. US cas were 1,79S kd & 10,465 wounded.\n[HQ MACV, Monthly Summary February 1969, p. 5 (PDF p. 7)] More than 100 individual and. crew-served weapons were captured.\n[Wikipedia, 1968_in_the_Vietnam_War, rev 1370342410] Operation Toan Thang II was designed to keep pressure on PAVN/VC forces in III Corps, the PAVN/VC lost 25,428 killed and 10,724 captured while the U.S. lost 1,798 killed.\n"
