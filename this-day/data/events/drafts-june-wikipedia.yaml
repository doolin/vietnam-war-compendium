- month: 6
  day: 1
  year: 1968
  title: "TOAN THANG offensive enters Phase II"
  body: "<p>On June 1, 1968, Phase II of the TOAN THANG offensive began. The campaign, an operation of the ARVN III Corps and the U.S. II Field Force, Vietnam, was designed to keep pressure on PAVN/VC forces in III Corps. Phase I had begun in April and ended on May 31 with 11,397 enemy killed.</p>\n<p>Headquarters, U.S. Military Assistance Command, Vietnam, reported Phase II terminated in its summary for February 16, 1969. During Phase II the combined forces detained 10,724 suspects and captured 10,285 individual weapons, 2,307 crew-served weapons, and 1,698 tons of rice. The command also reported 10,465 U.S. wounded.</p>\n"
  photo_url: null
  photo_alt: null
  references:
    - label: "Headquarters, United States Military Assistance Command, Vietnam, \"Monthly Summary, February 1969\", Office of Information, 22 June 1969, pp. 30–31 (Texas Tech Vietnam Center and Archive)"
