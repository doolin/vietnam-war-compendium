- month: 6
  day: 8
  year: 1973
  title: "Assault drives ARVN 44th Regiment out of Trung Nghia"
  body: "<p>On June 8, 1973, a tank-infantry assault drove the ARVN 44th Regiment, 23d Division, out of Trung Nghia. The South Vietnamese immediately tried to retake the position. Successive attempts failed to dislodge the deeply entrenched enemy, who had observation from the heights of Ngoc Bay Mountain, and casualties mounted on both sides. In early July the 44th gained a few meters and dug in on the eastern edge of the village of Ngoc Bay, despite massive artillery preparations and air strikes.</p>\n<p>The bombardment damaged the NVA 24B Regiment so severely that it was withdrawn and replaced by elements of the 66th and 28th Regiments, 10th Division. The 42d Regiment of the 22d Division replaced the 44th and eliminated enemy bunkers one by one with platoon-sized assaults. On September 1, 1973, the 42d began the final assault and found that, except for a few isolated riflemen, the enemy had withdrawn. Trung Nghia was cleared of all enemy by September 7.</p>\n"
  photo_url: null
  photo_alt: null
  references:
    - label: "William E. Le Gro, \"Vietnam from Cease-Fire to Capitulation\", U.S. Army Center of Military History, 1985, pp. 52–54"
      url: "https://history.army.mil/html/books/090/90-29/CMH_Pub_90-29.pdf"
    - label: "Wikipedia, \"1973 in the Vietnam War\", revision 1380647415 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1973_in_the_Vietnam_War&oldid=1380647415"
  status: "draft"
  source_text: "[Le Gro, Vietnam from Cease-Fire to Capitulation, p. 52 (PDF p. 60)] Trung Nghia\nWhen the ARVN 44th Regi ment. 23d Di vision.\nwas driven out of Trung Nghia by a tank-infalllry\nassault on 8 June 1973 the South Vietnamese immediately tried to retake the position. Casualties\nmounted on both sides as successive attempts failed\nto dislodge the deeply e ntre nched e nemy, who enjoyed the advantage of observation from the heights\nof Ngoc Bay Mountain . In early Jul y, the 44th\ngained a few meters and dug in on the eastern edge\nof the village of Ngoc Bay but could move no\nfarther. despite the e mployment of massive artil le ry\npreparations and air strikes. (Map 9)\n[Le Gro, Vietnam from Cease-Fire to Capitulation, p. 54 (PDF p. 62)] The NVA was nevertheless suffering from the\nbombardment at Trung Ngh ia . Damage to the NV A\n248 Regiment was so severe that it was withdrawn\nto the Oak To area for recuperation and replaced by\nelements of the 66th and 28th Regiments, 10th Division. The 28th. recently strengthened by replacements from the North, took up the defense ofTrung\nNghia whi le the 66th held Plei Djo Drap. (At this\ntime it became apparent that the 24B Regiment was\nattached to the 10th Division, while the 95B, the\nthird regiment of the 10th, was taking its direction\nfrom B3 Front.) Meanwhile, South Vietnam's tired\n44th Regiment was replaced in the attack by the 42d\nRegiment of the 22d Division, tlown to Kontum in\nel30s from Binh Dinh Province. This fresh regiment, and a small but important change in tactics,\nmade the difference. Rather than engage in large\ninfantry assaults. the 42d methodically el iminated\nenemy bunkers. one by one, using platoon-sized\nassaults supported by BI-mm. mortars firing delayed-fuze rounds which blew away overhead cover\nand killed or exposed the occupants.\n[Le Gro, Vietnam from Cease-Fire to Capitulation, p. 54 (PDF p. 62)] On I September 1973, the 42d Regiment began\nthe final assault on Trung Nghia, advancing cautiously to find that except for a few isolated riflemen\n\nthe enemy had withdrawn.\n[Le Gro, Vietnam from Cease-Fire to Capitulation, p. 54 (PDF p. 62)] Trung Nghia was cleared of all enemy\nby 7 September.\n[Wikipedia, 1973_in_the_Vietnam_War, rev 1380647415] The PAVN began the Battle of Trung Nghia by capturing the village of Trung Nghia in the Central Highlands. The ARVN would eventually recapture the area.\n"
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T17:00:00Z"
