- month: 6
  day: 22
  year: 1968
  title: "Front envoy in Budapest cites aid from the North"
  body: "<p>On June 22, 1968, the Central Intelligence Agency's President's Daily Brief reported that the Liberation Front representative in Budapest had echoed Hanoi's line proclaiming the right of \"all Vietnamese\" to join the struggle in the South. At a press conference on June 19, the representative, Dinh Ba Thi, had declared that it was \"the right of the Vietnamese people as a whole to fight against the enemy with united forces.\"</p>\n<p>Thi said that the Front, which \"fully supports\" Hanoi's position in the Paris talks, was relying primarily on its own strength. He acknowledged that the Viet Cong were receiving \"all-around\" assistance from their \"brothers in the North.\" The item appeared in the brief's Special Daily Report on North Vietnam, marked for the President's eyes only.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Central Intelligence Agency, \"The President's Daily Brief, 22 June 1968\", CIA Reading Room, 1968, Special Daily Report on North Vietnam, pp. 2-3"
      url: "https://www.cia.gov/library/readingroom/docs/DOC_0005976215.pdf"
    - label: "Wikipedia, \"1968 in the Vietnam War\", revision 1370342410 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1968_in_the_Vietnam_War&oldid=1370342410"
  status: "draft"
  source_text: "[CIA, The President's Daily Brief, 22 June 1968, cover] CENTRAL INTELLIGENCE AGENCY ... The President's Daily Brief ... 22 June 1968\n\n[CIA, The President's Daily Brief, 22 June 1968, \"Special Daily Report on North Vietnam for the President's Eyes Only\", pp. 2-3; transcribed from the scan, archived text file empty; line-break hyphens joined] More on the \"Right to Fight\": The Liberation Front representative in Budapest has echoed Hanoi's line proclaiming the right of \"all Vietnamese\" to join the struggle in the South. In a press conference on 19 June, Dinh Ba Thi, the Front representative, declared that it was \"the right of the Vietnamese people as a whole to fight against the enemy with united forces.\" Thi said that the Front, which \"fully supports\" Hanoi's position in the Paris talks, is relying primarily on its own strength, but acknowledged that the Viet Cong are receiving \"all-around\" assistance from their \"brothers in the North.\"\n\n[Wikipedia, 1968_in_the_Vietnam_War, rev 1370342410] In a complete reversal from previous statements, North Vietnam (through their representative in Budapest) admitted that it had troops stationed and fighting in South Vietnam."
  summarized_by: "Claude Opus 5.5"
