- month: 6
  day: 24
  year: 1965
  title: "Westmoreland asks for more troops and B-52 strikes"
  body: "<p>On June 24, 1965, Westmoreland advised Washington that he needed more soldiers than those previously approved. He also proposed that the US bomb the railroad from North Vietnam to China, mine Haiphong harbor, and carry out B-52 strikes.</p>"
