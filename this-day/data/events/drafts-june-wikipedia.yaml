- month: 6
  day: 4
  year: 1965
  title: "ARVN 9th Division storms VC position in Cai Nhum District"
  body: "<p>On June 4, 1965, the ARVN 9th Division mounted an operation to reestablish government control in Vĩnh Long province's Cai Nhum District. One Regional Forces battalion and three army battalions advanced along canals from the south, and a fourth army battalion advanced from the north. The 23rd River Assault Group, with a fifth infantry battalion aboard, blocked potential escape routes.</p>\n<p>At 13:30 the 1st Battalion, 14th Infantry, advancing from the north, encountered a strong VC position near a hamlet. After airstrikes by four B–57s, followed by US Army helicopter gunships, the soldiers fixed bayonets, charged, and captured the position. The battalion surrounded the hamlet overnight.</p>\n<p>VC losses were 46 killed, seven captured, and 31 weapons. The ARVN estimated the VC had carried off another 53 casualties during the night. ARVN losses were four dead and five wounded.</p>\n"
  photo_url: null
  photo_alt: null
  references:
    - label: "Wikipedia, \"1965 in the Vietnam War\", revision 1370279555 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1965_in_the_Vietnam_War&oldid=1370279555"
  status: "draft"
  source_text: "[Wikipedia, 1965_in_the_Vietnam_War, rev 1370279555] The ARVN 9th Division mounted an operation to reestablish government control in Vĩnh Long province's Cai Nhum District. One Regional Forces battalion and three army battalions advanced along canals from the south, while a fourth army battalion proceeded likewise from the north. The 23rd River Assault Group, with a fifth infantry battalion aboard, blocked potential escape routes. At 13:30, the 1st Battalion, 14th Infantry, which was advancing from the north, encountered a strong VC position near a hamlet. After airstrikes by four B–57s followed by US Army helicopter gunships, the soldiers fixed bayonets and charged the VC, capturing the position. The battalion then surrounded the hamlet overnight. VC losses were 46 killed and seven captured and 31 weapons. The ARVN estimated the VC had carried off another 53 casualties during the night. ARVN losses were four dead and five wounded.\n"
