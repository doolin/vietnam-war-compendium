- month: 6
  day: 3
  year: 1965
  title: "PAVN 18th Regiment twice ambushes ARVN battalion on Highway 7"
  body: "<p>On June 3, 1965, the PAVN 18th Regiment ambushed the 1st Battalion, 40th Infantry, on Highway 7 between Cheo Reo and the Le Bac bridge. After the battalion retreated 1.5km, the PAVN ambushed it again. The ARVN soldiers broke and fled in disorder.</p>\n<p>The battalion's wounded senior adviser called for medical evacuation for himself and two other injured Americans. Helicopter gunships covered the evacuation, then joined fixed-wing aircraft in bombarding the area for the rest of the day. South Vietnamese losses were described as heavy.</p>\n"
