- month: 11
  day: 4
  year: 1964
  title: "Trần Văn Hương installed as Prime Minister; VC overrun Long An posts"
  body: "<p>On November 4, 1964, Trần Văn Hương was installed as the new Prime Minister of South Vietnam as part of a civilian government selected by the nation's military leaders.</p><p>The same day, the VC launched coordinated attacks in Hau Nghia and Long An provinces. Most of the actions were diversionary to the true targets, three platoon bases protecting pacification operations along Highway 4 in Long An. The VC overran these in 30 minutes, but the 3rd Battalion, 50th Infantry, to whom the posts belonged, reacted quickly and drove off the VC. ARVN losses were ten dead and 14 wounded. The ARVN found 31 VC dead.</p>"
