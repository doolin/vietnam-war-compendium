- month: 11
  day: 17
  year: 1965
  title: "VC 1st Regiment overruns Hiệp Đức; Marines lift ARVN relief force"
  body: "<p>On November 17, 1965, the VC 1st Regiment overran Hiệp Đức District, leaving 174 Regional Force defenders missing and 315 weapons lost. The action continued over the following days: 30 Marine UH-34D helicopters, supported by fixed-wing attack aircraft, lifted 788 ARVN troops to relieve the garrison.</p><p>Two ARVN battalions killed 141 VC and captured 87 weapons while suffering 33 killed. American advisors with the ARVN estimated that Marine air support had accounted for another 300 VC killed. The ARVN then had to withdraw from the area to counter a VC attack on Thach Tru.</p>"
