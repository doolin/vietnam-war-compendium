- month: 11
  day: 3
  year: 1969
  title: "Nixon appeals to the \"silent majority\" in televised address"
  body: "<p>On November 3, 1969, Nixon addressed the nation on television and radio at 9:30 p.m., Washington time, to announce his plans to end American involvement in the war. He gave his reasons for rejecting the immediate removal of all troops, framing that option as the \"first defeat in our Nation's history\" that \"would result in a collapse of confidence in American leadership, not only in Asia but throughout the world.\"</p><p>Nixon instead reiterated his plan for Vietnamization, \"the complete withdrawal of all U.S. combat ground forces and their replacement by South Vietnamese forces on an orderly scheduled timetable,\" but added that he did not intend to announce details of the timetable. In closing, he described the people who would support his plan for a drawdown as \"the great silent majority of my fellow Americans,\" in contrast to a \"vocal minority\" of protesters.</p><p>A Gallup poll the next day showed that 77 percent of Americans supported Nixon's Vietnam policy.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Wikipedia, \"1969 in the Vietnam War\", revision 1370279610 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1969_in_the_Vietnam_War&oldid=1370279610"
    - label: "\"Richard Milhous Nixon: Vietnamization Speech, November 3, 1969\", University of Groningen U.S. History site"
      url: "http://www.let.rug.nl/usa/presidents/richard-milhous-nixon/vietnamization-speech-1969.php"
  status: "draft"
  source_text: "[Wikipedia, 1969_in_the_Vietnam_War, rev 1370279610] Nixon addressed the nation on television and radio at 9:30 p.m., Washington time, to announce his plans to end American involvement in the war. Nixon gave his reasons for rejecting immediately removing all troops, framing that option as the \"first defeat in our Nation's history\" that \"would result in a collapse of confidence in American leadership, not only in Asia but throughout the world.\" Nixon instead reiterated his plan for Vietnamization, \"the complete withdrawal of all U.S. combat ground forces and their replacement by South Vietnamese forces on an orderly scheduled timetable\" but added that he did not intend to announce details of the timetable. In closing, he described the people who would support his plan for a drawdown as \"the great silent majority of my fellow Americans\", in contrast to a \"vocal minority\" of protesters which, if their will prevailed \"over reason and the will of the majority\", would mean that the United States would have \"no future as a free society.\" A Gallup poll the next day showed that 77% of Americans supported Nixon's Vietnam policy."
  summarized_by: "Claude Fable 5.1"
