- month: 11
  day: 24
  year: 1963
  title: "VC overrun Special Forces camp at Hiep Hoa"
  body: "<p>On November 24, 1963, in the Battle of Hiep Hoa, a CIDG base was overrun in Hau Nghia on the Plain of Reeds west of Saigon. Five hundred VC attacked the base, which was manned by 5 U.S. Special Forces soldiers and 200 local militia. One of the Americans was wounded and the other four went missing; one of them, Isaac Camacho, became the first American to escape from VC captivity. Forty-one of the local militiamen were killed. This was the first U.S. Special Forces base to be captured by the VC.</p><p>The same day, the VC hit 24 U.S. and RVNAF aircraft and helicopters, destroying five, the highest number in the war to date.</p><p>President Johnson held his first meeting on Vietnam with senior advisers, the same group with whom former President Kennedy had often met. \"I am not going to lose Vietnam,\" he reportedly said, and he told Ambassador Lodge to tell the generals heading the government in South Vietnam that \"Lyndon Johnson intends to stand by our word.\"</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Wikipedia, \"1963 in the Vietnam War\", revision 1370279475 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1963_in_the_Vietnam_War&oldid=1370279475"
    - label: "Jacob Van Staaveren, \"USAF Plans and policies in South Vietnam 1961-1963\", USAF Historical Division Liaison Office, 1965"
      url: "https://media.defense.gov/2011/Mar/22/2001330192/-1/-1/0/AFD-110322-029.pdf"
  status: "draft"
  source_text: "[Wikipedia, 1963_in_the_Vietnam_War, rev 1370279475] In the Battle of Hiep Hoa, a CIDG base was overrun in Hau Nghia on the Plain of Reeds west of Saigon. Five hundred VC attacked the base, manned by 5 U.S. Special Forces soldiers and 200 local militia. One of the Americans was wounded and the other four went missing, one of whom, Isaac Camacho, became the first American to escape from VC captivity. Forty-one of the local militiamen were killed. This was the first U.S. Special Forces base to be captured by the VC.\n\nThe VC hit 24 U.S. and RVNAF aircraft and helicopters, destroying five, the highest number in the war to date.\n\nPresident Johnson held his first meeting on Vietnam with senior advisers, the same group with whom former President Kennedy had often met. According to accounts, Johnson was aggressive at the meeting. \"I am not going to lose Vietnam\" he reportedly said and told Ambassador Lodge to tell the generals heading the government in South Vietnam that \"Lyndon Johnson intends to stand by our word.\" He also reportedly said that he had \"never been happy with our operations in Vietnam\" and the \"serious dissension and divisions\" within the U.S. government."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:35:03Z"
- month: 11
  day: 27
  year: 1965
  title: "SANE march draws 35,000 to Washington; VC release two U.S. POWs"
  body: "<p>On November 27, 1965, the \"March on Washington for Peace in Vietnam\", organized by the \"Committee for a SANE Nuclear Policy\" (SANE), attracted a crowd of almost 35,000 demonstrators who picketed the White House. It was the largest public protest against U.S. involvement in Vietnam up to that time. The leaders of SANE, concerned about the public perception of the antiwar movement, asked that protesters carry only signs with \"authorized slogans\", not demand immediate withdrawal, and not burn the American flag.</p><p>In what it called a \"response to the friendly sentiments of the American people against the war in South Vietnam\", the VC released U.S. Army Sergeant George E. Smith and Specialist E-5 Claude E. McClure, both captured in November 1963. Vietnam Communist Party official Le Duc Tho escorted the two men across the border from North Vietnam into Cambodia, freeing them after two years as prisoners of war.</p><p>PAVN forces attacked the ARVN 7th Regiment, 5th Division in the Michelin Rubber Plantation, killing most of the Regiment and five U.S. advisers.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Wikipedia, \"1965 in the Vietnam War\", revision 1370279555 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1965_in_the_Vietnam_War&oldid=1370279555"
    - label: "\"Combat Operations: Stemming the Tide, May 1965 to October 1966\", Center of Military History United States Army, August 2000"
      url: "https://history.army.mil/html/books/091/91-5/index.html"
  status: "draft"
  source_text: "[Wikipedia, 1965_in_the_Vietnam_War, rev 1370279555] The \"March on Washington for Peace in Vietnam\", organized by the \"Committee for a SANE Nuclear Policy\" (SANE), attracted a crowd of almost 35,000 demonstrators who picketed the White House, then moved on toward the Washington Monument. It was the largest public protest against U.S. involvement in Vietnam up to that time. The leaders of SANE were concerned about the public perception of the antiwar movement, so they asked that protesters only carry signs with \"authorized slogans\", and not to demand immediate withdrawal, nor to burn the American flag.\n\nIn an act which it said was being done as a \"response to the friendly sentiments of the American people against the war in South Vietnam\", the VC released U.S. Army Sergeant George E. Smith and Specialist E-5 Claude E. McClure, who had both been captured on 24 November 1963. Vietnam Communist Party official Le Duc Tho escorted Smith and McClure across the border from North Vietnam into Cambodia, freeing both men after two years as prisoners of war. Smith and McClure would travel across neutral Cambodia on their own and would address a press conference in Phnom Penh on 30 November, praising their captors and American antiwar protesters, and criticizing the war effort. On 27 December the U.S. military announced that Smith and McClure would face court martial for aiding the enemy.\n\nPAVN forces attacked the ARVN 7th Regiment, 5th Division in the Michelin Rubber Plantation killing most of the Regiment and five U.S. advisers."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:35:03Z"
- month: 11
  day: 28
  year: 1971
  title: "CH-47 crash kills 33; Navy SEALs end combat role"
  body: "<p>On November 28, 1971, a US Army CH-47 carrying five crew and 28 soldiers from the 327th Infantry Regiment, on a flight from Da Nang to Phu Bai Combat Base, crashed into high ground, killing all on board.</p><p>The same day, the U.S. Navy announced that the United States Navy SEALs had ended their combat role in the war and would be withdrawn in the next month. The SEALs had been kept in South Vietnam as a contingency force for Bright Light POW recovery operations.</p>"
  photo_url: null
  photo_alt: null
  references:
