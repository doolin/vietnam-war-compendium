- month: 11
  day: 22
  year: 1963
  title: "Kennedy assassinated; Lê Duẩn urges offensive strategy in Hanoi"
  body: "<p>On November 22, 1963, President Kennedy was assassinated in Dallas, Texas, and Lyndon Johnson became President of the U.S.</p><p>The Central Committee of the Communist Party of Vietnam met in emergency session to consider the implications of the fall of the Diệm government. First Secretary Lê Duẩn made a speech saying \"We are strong, while the enemy is weak...the strategy of revolution should not be a defensive one.\" He said an offensive strategy should be adopted \"to smash one by one the war policies of imperialism heading by the United States until its war plans are completely smashed.\" Lê Duẩn's speech won the approval of the members of the Central Committee, who had previously been cautious about helping the VC and pursuing an aggressive policy in South Vietnam. Ho Chi Minh, a moderate, reportedly removed himself from the debate.</p><p>An AP report on the Honolulu conference said that U.S. officials believed it might take six \"months to tell whether the overthrow of the Diệm regime has brought victory in the anti-Communists war closer.\"</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Wikipedia, \"1963 in the Vietnam War\", revision 1370279475 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1963_in_the_Vietnam_War&oldid=1370279475"
    - label: "Associated Press Report on the Honolulu Conference"
      url: "http://mcadams.posc.mu.edu/viet17.htm"
  status: "draft"
  source_text: "[Wikipedia, 1963_in_the_Vietnam_War, rev 1370279475] President Kennedy was assassinated in Dallas, Texas. Lyndon Johnson become President of the U.S.\n\nThe Central Committee of the Communist Party of Vietnam met in emergency session to consider the implications of the fall of the Diệm government. First Secretary Lê Duẩn made a fiery speech saying \"We are strong, while the enemy is weak...the strategy of revolution should not be a defensive one.\" Rather an offensive strategy should be adopted \"to smash one by one the war policies of imperialism heading by the United States until its war plans are completely smashed.\" Lê Duẩn's speech won the approval of the members of the Central Committee who had previously been cautious about helping the VC and pursuing an aggressive policy in South Vietnam. Ho Chi Minh, a moderate, reportedly removed himself from the debate.\n\nAn AP report on the Honolulu conference said that U.S. officials believe it may take six \"months to tell whether the overthrow of the Diệm regime has brought victory in the anti-Communists war closer.\""
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:35:03Z"
- month: 11
  day: 23
  year: 1970
  title: "North Vietnamese and VC delegations boycott next Paris session"
  body: "<p>On November 23, 1970, the North Vietnamese and VC delegations announced they would not attend the next session of the Paris Peace Talks, in response to the U.S. attacks against North Vietnam.</p>"
