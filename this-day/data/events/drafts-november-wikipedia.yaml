- month: 11
  day: 2
  year: 1963
  title: "Diệm and Nhu killed after coup led by Dương Văn Minh"
  body: "<p>On November 2, 1963, the arrest and assassination of Ngô Đình Diệm and his younger brother Ngô Đình Nhu marked the culmination of a successful coup led by General Dương Văn Minh. Diệm and Nhu were arrested and then killed in an armoured personnel carrier by ARVN officers.</p><p>The same day, Ambassador Lodge was authorized by the State Department to release funds for aid projects to the new Government of South Vietnam. The United States had frozen the funding of those projects to pressure the Diệm government to undertake reforms.</p>"
