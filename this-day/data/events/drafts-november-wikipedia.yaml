- month: 11
  day: 16
  year: 1961
  title: "Farm Gate aircraft begin arriving in South Vietnam"
  body: "<p>On November 16, 1961, \"Farm Gate\" American aircraft began arriving in South Vietnam, in anticipation that Kennedy would soon decide to dispatch American combat soldiers there. The \"Jungle Jim\" 1st Air Commando Group was to train the RVNAF using older aircraft. The Air Commandos would also have a \"second mission of combat operations.\"</p>"
