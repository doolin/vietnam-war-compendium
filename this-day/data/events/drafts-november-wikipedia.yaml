  title: "Allies accept holiday ceasefires for Christmas, New Year and Tết"
  body: "<p>On November 30, 1966, the United States, South Vietnam and their other allies in the Vietnam War agreed to a proposal from the VC and North Vietnam for three ceasefires to coincide with holidays. All fighting would halt from 07:00 on 24 December until 07:00 on 26 December, and again from the morning of New Year's Eve until the morning of 2 January 1967. In addition, there would be a four-day ceasefire during the 1967 Tết holidays, celebrated in both North Vietnam and South Vietnam, which marked the traditional start of the Vietnamese new year, with a truce to last between 8 and 12 February 1967.</p><p>The same day, the VC shelled Tân Uyên market in Bien Hoa Province, killing three civilians and wounding seven.</p>"
