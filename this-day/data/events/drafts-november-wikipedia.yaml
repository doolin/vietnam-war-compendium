- month: 11
  day: 21
  year: 1965
  title: "Marines reinforce 37th Rangers at Thach Tru"
  body: "<p>On November 21, 1965, the 3rd Battalion, 7th Marines began reinforcing the 37th Ranger battalion, which had come under attack by the PAVN 18th Regiment at Thach Tru, about 20 miles south of Quang Ngai. The Rangers had lost 71 killed and two missing, while VC losses were 175 killed by U.S. body count and three VC captured.</p><p>The action continued into the following days. When the Marines landed, they secured the landing zones and occupied night defensive positions. Early the next morning they cleared the critical terrain, capturing 17 VC and killing three. Marine losses were two killed.</p>"
