  status: "draft"
  source_text: "[Wikipedia, 1961_in_the_Vietnam_War, rev 1370279448] Anticipating that Kennedy would soon decide to dispatch American combat soldiers to South Vietnam, \"Farm Gate\" American aircraft began arriving in South Vietnam. The \"Jungle Jim\" 1st Air Commando Group was to train the RVNAF using older aircraft. Air Commandos would have a \"second mission of combat operations.\""
