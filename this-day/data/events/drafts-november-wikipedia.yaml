  status: "draft"
  source_text: "[Wikipedia, 1971_in_the_Vietnam_War, rev 1370279651] A US Army CH-47 carrying five crew and 28 soldiers from the 327th Infantry Regiment on a flight from Da Nang to Phu Bai Combat Base crashed into high ground killing all on board.\n\nThe U.S. Navy announced that the United States Navy SEALs had ended their combat role in the war and would be withdrawn in the next month. The SEALs had been kept in South Vietnam as a contingency force for Bright Light POW recovery operations."
