  photo_alt: null
  references:
    - label: "Wikipedia, \"1967 in the Vietnam War\", revision 1370279584 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1967_in_the_Vietnam_War&oldid=1370279584"
    - label: "\"Capabilities of the Vietnamese Communists for fighting in South Vietnam\", United States State Department, 13 November 1967"
      url: "https://history.state.gov/historicaldocuments/frus1964-68v05/d397"
  status: "draft"
  source_text: "[Wikipedia, 1967_in_the_Vietnam_War, rev 1370279584] MACV told reporters that the estimated number of PAVN/VC forces in South Vietnam had declined to 242,000 men, following the previous announced assessment of 299,000 and explained that the decrease was due to \"heavy casualties and plummeting morale\"; in reality, the decrease came because MACV had decided in July that some categories of VC should be dropped from the total estimate, which had been tallied at 299,000 at the beginning of 1967 in order to maintain the public position that PAVN/VC forces were less than 300,000. In 1975, a former CIA employee, Samuel A. Adams, would reveal the falsifying of numbers in testimony before the U.S. House Intelligence Committee. Adams would also reveal that his review of CIA documents indicated that the strength of the enemy had actually been 600,000 during 1967. Although the difficulties in attempting to put together an educated estimate of PAVN/VC strength in South Vietnam was described in a CIA report on the subject as \"we lack precise basic data on population size, rates of growth, and age distribution for both North and South Vietnam\", \"Our data and conclusions are therefore subject to continuing review and revision, especially since capabilities do not remain static.\"\n\nA Gallup poll found that 59% of Americans favored continuing the war with 55% saying the U.S. should increase its military effort and involvement.\n\nThe VC handed over three U.S. prisoners of war to antiwar activist Tom Hayden in Phnom Penh."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:35:03Z"
- month: 11
  day: 15
  year: 1969
  title: "Half a million march on Washington in second Moratorium"
  body: "<p>On November 15, 1969, more than 500,000 protesters in Washington, D.C., staged \"the largest peace march on Washington in American history\" for the second \"Moratorium to End the War in Vietnam\". The event, which was also held on a smaller scale in other American cities, included a symbolic \"March Against Death\".</p>"
