  status: "draft"
  source_text: "[Wikipedia, 1965_in_the_Vietnam_War, rev 1370279555] The VC 1st Regiment overran Hiệp Đức District resulting in 174 Regional Force defenders missing and 315 weapons lost. 30 Marine UH-34D helicopters, supported by fixed-wing attack aircraft, lifted 788 ARVN troops to relieve the garrison. Two ARVN battalions killed 141 VC and captured 87 weapons while suffering 33 killed. American advisors with the ARVN estimated that Marine air support had accounted for another 300 VC killed. However the ARVN had to withdraw from the area to counter a VC attack on Thach Tru."
  summarized_by: "Claude Fable 5.1"
