  year: 1964
  title: "RVNAF strikes VC base in retaliation for Bien Hoa attack"
  body: "<p>On November 6, 1964, the RVNAF, led by Air Vice Marshal Kỳ, launched a 32-aircraft attack against a VC base area in retaliation for the attack on Bien Hoa Air Base. The RVNAF claimed to have killed 500 VC.</p>"
