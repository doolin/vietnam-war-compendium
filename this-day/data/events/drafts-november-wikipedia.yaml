- month: 11
  day: 11
  year: 1967
  title: "MACV lowers its estimate of PAVN/VC strength to 242,000"
  body: "<p>On November 11, 1967, MACV told reporters that the estimated number of PAVN/VC forces in South Vietnam had declined to 242,000 men, from a previously announced assessment of 299,000, and explained that the decrease was due to \"heavy casualties and plummeting morale.\" The decrease followed a MACV decision in July that some categories of VC should be dropped from the total estimate, which had been tallied at 299,000 at the beginning of 1967, in order to maintain the public position that PAVN/VC forces were less than 300,000. In 1975 a former CIA employee, Samuel A. Adams, would describe the falsifying of numbers in testimony before the U.S. House Intelligence Committee, and would state that his review of CIA documents indicated the enemy's strength had been 600,000 during 1967.</p><p>The same day, a Gallup poll found that 59 percent of Americans favored continuing the war, with 55 percent saying the U.S. should increase its military effort and involvement. In Phnom Penh, the VC handed over three U.S. prisoners of war to antiwar activist Tom Hayden.</p>"
