    - label: "Wikipedia, \"1962 in the Vietnam War\", revision 1374503779 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1962_in_the_Vietnam_War&oldid=1374503779"
  status: "draft"
  source_text: "[Fisher, Houston Chronicle, byline] By BINNIE FISHER , Special to the Chronicle Oct 28, 2001\n\n[Fisher, Houston Chronicle] The day had barely begun in Southeast Texas on May 30, 1962, but already it was evening in South Vietnam. Chaos reigned at the Ban Me Thuot Leprosarium, where Houston physician Ardel Vietti served as a missionary. Shrieking a gospel of terror, ransacking buildings, and waving bayonets in the faces of missionaries and patients, about a dozen armed men dressed in black invaded the leprosarium at dusk.\n\n[Fisher, Houston Chronicle] A headline in the New York Times that day read, \"3 U.S. Missionaries Kidnapped by Vietcong in Raid on Hospital.\" Photographs of Ardel Vietti and fellow missionaries Daniel Gerber and the Rev. Archie Mitchell accompanied the story.\n\n[Fisher, Houston Chronicle] After almost 40 years and the efforts of many people and organizations to find the missionaries, their fate remains the jungle's secret. To this day, Eleanor Ardel Vietti (she seldom used her first name) is the only American woman -- civilian or military -- still considered missing in Vietnam.\n\n[Fisher, Houston Chronicle] Since several days before, Ardel had been nursing a painful ulcer on her leg. By Wednesday evening, May 30, it was bothering her enough that she requested the weekly prayer meeting be moved from the Mitchell house, where it was usually conducted, to her quarters.\n\n[Fisher, Houston Chronicle] As she walked out of the bedroom, \"Archie was reading to the other three children. I heard a noise, and I told Archie, `You go ahead, because Ruth and Dan are coming back.' That's all I said, and suddenly they were cutting the window screens and coming into the house.\"\n\n[Fisher, Houston Chronicle] The Viet Cong ordered everyone out into the center of the compound. The children tried to hide, but they were dragged out with the others.\n\n[Fisher, Houston Chronicle] \"They cut ropes from the kids' swings and tied Archie,\" she says. Archie Mitchell was forced to stand near Gerber, who had been accosted as he and Wilting strolled outside the compound.\n\n[Fisher, Houston Chronicle] The leader then sent someone off to find the doctor. Limping, she was brought at bayonet point to join Archie Mitchell and Gerber.\n\n[Fisher, Houston Chronicle] The intruders took a Land Rover, medicine and equipment.\n\n[Fisher, Houston Chronicle] After lecturing the missionaries, the Viet Cong instructed them to leave the leprosarium at daylight and never return. The Viet Cong then left, taking Ardel Vietti, Archie Mitchell and Dan Gerber with them.\n\n[Fisher, Houston Chronicle] The remaining missionaries notified authorities in Ban Me Thuot. South Vietnamese marines joined U.S. military advisers the next day in a search. They found the Viet Cong force, but their ranks had been heavily reinforced. An attack would have met certain failure and heavy casualties. There was no sign of the three missionaries.\n\n[Wikipedia, 1962_in_the_Vietnam_War, rev 1374503779] Eleanor Ardel Vietti, Archie E. Mitchell and Daniel A. Gerber, missionaries working at the Buôn Ma Thuột leper colony were abducted by the VC. None have been seen since then and Vietti is the only American woman unaccounted for from the war.\n"
