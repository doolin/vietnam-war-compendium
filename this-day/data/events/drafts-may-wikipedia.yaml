  year: 1963
  title: "Bicycle bombs kill two in Saigon"
  body: "<p>On May 31, 1963, two powerful explosions set off by terrorists on bicycles killed two Vietnamese and wounded ten others in Saigon. Police believed the explosion was accidentally premature.</p>\n"
