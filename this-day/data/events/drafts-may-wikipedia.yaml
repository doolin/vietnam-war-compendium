  status: "draft"
  source_text: "[Wikipedia, 1964_in_the_Vietnam_War, rev 1370342430] The VC bombarded the village of Tam Bang in Kiên Giang province with firebombs shot from log troughs and large slingshots. Then, the VC 306th Battalion and some smaller elements attacked. The battalion failed to breach the town's mud wall, and the territorial soldiers, supported by aerial flares and artillery, repulsed the assault. The firebombs, however, burned the community to the ground. The defenders lost 14 killed and 24 wounded. Reports of civilian casualties ranged from 40 to 70. VC losses were estimated as three dead. However, a month later a VC who had participated in the attack was captured and he stated that the VC actually had lost 29 dead and 30 wounded."
