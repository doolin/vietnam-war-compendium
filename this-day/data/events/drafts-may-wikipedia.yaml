- month: 5
  day: 3
  year: 1967
  title: "House forms subcommittee to review the M16 rifle"
  body: "<p>On May 3, 1967, the House Committee on Armed Services established a subcommittee to review the development, history, distribution and adequacy of the M16 rifle. The rifle had drawn complaints about its reliability in combat, particularly during the Hill Fights.</p>\n<p>The report of the Special Subcommittee on the M-16 Rifle Program, dated October 19, 1967, ran to 52 pages and was published by the U.S. Government Printing Office. It found that a change in propellant powder and deficiencies in cleaning were the major causes of problems with the weapon. Improved cleaning procedures and the introduction of a chrome-plated chamber on the M16A1 overcame most of the reliability complaints.</p>"
