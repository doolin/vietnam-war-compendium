- month: 5
  day: 1
  year: 1964
  title: "VC firebomb and assault Tam Bang"
  body: "<p>On May 1, 1964, the VC bombarded the village of Tam Bang in Kiên Giang province with firebombs shot from log troughs and large slingshots. The VC 306th Battalion and some smaller elements then attacked. The battalion failed to breach the town's mud wall, and the territorial soldiers, supported by aerial flares and artillery, repulsed the assault.</p>\n<p>The firebombs burned the community to the ground. The defenders lost 14 killed and 24 wounded, and reports of civilian casualties ranged from 40 to 70. VC losses were estimated as three dead, but a month later a VC who had taken part in the attack was captured and stated that the VC had lost 29 dead and 30 wounded.</p>"
  photo_url: null
  photo_alt: null
  references:
