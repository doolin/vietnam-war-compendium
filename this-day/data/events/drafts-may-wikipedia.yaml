  title: "Terrorists kill sleeping canal workers in An Giang"
  body: "<p>On May 22, 1966, terrorists killed 18 sleeping men, a woman and four children during an attack on a housing center for canal workers in the Mekong Delta province of An Giang. \"We are doing this to teach you a lesson,\" a communist cadre was reported to have said just before he pulled the trigger.</p>\n"
