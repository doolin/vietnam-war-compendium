- month: 5
  day: 26
  year: 1967
  title: "TIME cover story examines black soldiers in Vietnam"
  body: "<p>On May 26, 1967, TIME's cover story took an in-depth look at the situation facing the African-American population in relation to the war in Vietnam. It appeared in the wake of Muhammad Ali's very public refusal to fight in Vietnam.</p>\n<p>The magazine reported that, though 70% of African-Americans who were drafted were rejected from the Army, the ratio of black combat troops to white ones was double that for the U.S. population as a whole, and their rate of combat death was likewise higher. African-Americans were 5% of the officers but 10% of all Army troops.</p>\n<p>Among the men TIME spoke to was Capt. Clifford Alexander Jr., who said, \"We are fighting over here against the Viet Cong and at home against discrimination,\" adding, \"together we can win in both places.\"</p>\n"
  photo_url: null
  photo_alt: null
  references:
    - label: "Lily Rothman, \"50 Years Ago This Week: Vietnam and the Black Soldier\", TIME, 2017"
      url: "https://time.com/4780493/1967-vietnam-race/"
    - label: "Wikipedia, \"1967 in the Vietnam War\", revision 1370279584 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1967_in_the_Vietnam_War&oldid=1370279584"
  status: "draft"
  source_text: "[Rothman, TIME, May 22, 2017] The May 26, 1967, cover of TIME\n\n[Rothman, TIME, May 22, 2017] Week 21: May 26, 1967\n\n[Rothman, TIME, May 22, 2017] In the wake of Muhammad Ali’s very public refusal to fight in Vietnam, TIME’s cover story took an in-depth look at the often paradoxical situation facing the African-American population in relation to the War in Vietnam.\n\n[Rothman, TIME, May 22, 2017] First, the numbers: Though 70% of African-Americans who were drafted were rejected from the Army, the ratio of black combat troops to white ones was double that for the U.S. population as a whole, the magazine reported. Their rate of combat death was likewise higher. At the same time, there were disproportionately fewer African-Americans serving as officers — they were 5% of the officers but 10% of all Army troops — and, in their off time, troops tended to congregate in de facto segregated areas in Saigon.\n\n[Rothman, TIME, May 22, 2017] For the men to whom TIME spoke, the numbers — which could also be read as the black man taking the brunt of the war’s burden — were evidence of inroads being made. “We are fighting over here against the Viet Cong and at home against discrimination,” said Capt. Clifford Alexander Jr., to TIME; “together we can win in both places.”\n\n[Wikipedia, 1967_in_the_Vietnam_War, rev 1370279584] Time magazine published a cover story The Negro in Vietnam profiling African-American participation in the war which claimed that the ratio of African-American to white combat troops was double that for the U.S. population as a whole, their combat death rate was therefore higher and there were disproportionately fewer African-American officers.\n"
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T17:00:00Z"
- month: 5
  day: 28
  year: 1970
  title: "POW/MIA families incorporate their national league"
  body: "<p>On May 28, 1970, the National League of Families of American Prisoners and Missing in Southeast Asia, also known legally as the National League of POW/MIA Families, was incorporated in the District of Columbia. The League originated on the west coast in the late 1960s, when the wife of a ranking POW initiated a loosely organized movement. She believed that U.S. Government policy of maintaining a low profile on the POW/MIA issue, while urging family members to refrain from publicly discussing the problem, was unjustified.</p>\n<p>After the first POW/MIA story was published in October 1968, the families began communicating with each other, and the group grew from 50 to 100, to 300. In May 1970, a special ad hoc meeting of the families at DAR Constitution Hall in Washington, DC, adopted the League's charter and by-laws. The League's stated mission was to obtain the release of all prisoners, the fullest possible accounting for the missing and repatriation of all recoverable remains.</p>\n"
  photo_url: null
  photo_alt: null
  references:
    - label: "National League of POW/MIA Families, \"The History of the League\", pow-miafamilies.org"
      url: "https://www.pow-miafamilies.org/about-the-league.html"
    - label: "Wikipedia, \"1970 in the Vietnam War\", revision 1377614479 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1970_in_the_Vietnam_War&oldid=1377614479"
  status: "draft"
  source_text: "[National League of POW/MIA Families, The History of the League] T he National League of Families of American Prisoners and Missing in Southeast Asia, also known legally as the National League of POW/MIA Families, was incorporated in the District of Columbia on May 28, 1970. Voting membership is comprised of wives, children, parents, siblings and other close blood and legal relatives of Americans who were or are listed as Prisoners of War (POW), Missing in Action (MIA), Killed in Action/Body not Recovered (KIA/BNR) and returned American Vietnam War POWs. Associate membership is comprised of veterans, other concerned citizens and extended family member POW/MIA and KIA/BNR relatives who do not meet voting membership requirements. As a nonprofit, tax-exempt, 501(c) 3 humanitarian organization (FEIN #23-7071242), the League is financed by donations from the families, veterans and others. The League&rsquo;s sole mission is to obtain the release of all prisoners, the fullest possible accounting for the missing and repatriation of all recoverable remains of those who died serving our nation during the Vietnam War.\n\n[National League of POW/MIA Families, The History of the League] T he League originated on the west coast in the late 1960s. Believing US Government policy of maintaining a low profile on the POW/MIA issue &ndash; while urging family members to refrain from publicly discussing the problem &ndash; was unjustified, the wife of a ranking POW initiated a loosely organized movement that evolved into the National League of POW/MIA Families. In October 1968, the first POW/MIA story was published.&nbsp; As a result of that publicity, the families began communicating with each other, and the group grew in strength from 50 to 100, to 300, and kept growing.\n\n[National League of POW/MIA Families, The History of the League] E ventually, the necessity for formal incorporation was recognized.&nbsp; In May 1970, a special ad hoc meeting of the families was held at DAR Constitution Hall in Washington, DC, at which time the League&rsquo;s charter and by-laws were adopted.\n\n[Wikipedia, 1970_in_the_Vietnam_War, rev 1377614479] The National League of POW/MIA Families was incorporated by a group of wives of American servicemen who were listed as prisoners of war or missing in action in the war.\n"
