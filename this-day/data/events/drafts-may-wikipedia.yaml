- month: 5
  day: 5
  year: 1968
  title: "NVA sappers attack LZ Peanuts"
  body: "<p>On May 5, 1968, in the pre-dawn hours, LZ Peanuts received incoming 120mm mortar rounds and B-40 rockets coupled with a ground and sapper attack. The position was held by A/1/77, a battery of the 1st Battalion, 77th Artillery, which was in direct support of the 2d Brigade, 1st Air Cavalry Division. The attack was repelled with thirty-two NVA killed inside the defensive wire. B Battery, 2d Battalion (Aerial Artillery), 20th Artillery, fired in defense of the position.</p>\n<p>The battery had been hit on May 4, when three 122mm rockets struck a helicopter pad amid about 2000 rounds of 105mm ammunition, and the cook-off continued through the next day. It suffered losses in equipment and personnel again on May 5. All personnel and equipment were extracted that day despite sporadic incoming rounds and moved to LZ Jane, the 2d Brigade base camp. By dusk the battery was in position to continue its fire support mission.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Headquarters, 1st Air Cavalry Division Artillery, \"Operational Report of the 1st Air Cavalry Division Artillery for Period Ending 31 July 1968\", Department of the Army, 1968, pp. 3-4 (DTIC AD 393815)"
      url: "http://www.dtic.mil/dtic/tr/fulltext/u2/393815.pdf"
    - label: "Wikipedia, \"1968 in the Vietnam War\", revision 1370342410 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1968_in_the_Vietnam_War&oldid=1370342410"
  status: "draft"
  source_text: "[ORLL, 1st Air Cavalry Division Artillery, period ending 31 July 1968, p. 3] (2) 1st Battalion, 77th Artillery: At the start of the reporting\nperiod the 1st Battalion, 77th Artillery plus A/1/30 Artillery (OPCON) was\nin direct support of the 2d Brigade which was OFCON to the 3d Marine Division. The battalion participated in Operations SCOTLAND II (16 April 7 May) and CONCORDIA SQUARE (8 - 17 May 68). On 4 May 1968 A/1/77, located\nat LZ Peanuts, (XD 809392), came under 120mm mortar and 122mm rocket fire.\nAt approximately 1630 hours throe 122mm rockets impacted on a helicopter\npad in the midst of approximately 2000 rounds of 105m ammunition that\nhad been delivered just prior to the attack. The resultant fire and\nexplosions, coupled with a direct hit on a 105mm gun section rendered portions of,the unit ineffective. Although the cook-off of howitzer ammunition\ncontinued on thru the next day two gun sections continued to function.\nHowever, in the pre-dawn hours of 5 May 1968 LZ Peanuts again received\nincoming 120mm mortar rounds and B-40 rockets coupled with a ground and\nsapper attack. The attack was repelled with thirty-two NVA killed inside\nthe defensive wire. Once again the battery suffered losses in both\nequipment and personnel. Upon notification of the serious losses in both\npersonnel and equipment that A/l/?7 had sustained, action was taken to\nhave the unit extracted and repositioned at IZ Jane (Base Camp of the 2d\nBde, 1ACD). On 5 May 1968 all personnel and equipment were extracted\nfrom LZ Peanuts in spite of sparadic incoming rounds and continuing\nammunition cook-off throughout the day. Simultaneous with the units\n«Detraction the 27th Maintenance Battalion (DS) and all other 1st Air Cav\nDiv Support Command elements assisted in reconstituting A/1/77 ttrough\nthe movement of required operable equipment into LZ Jane by road and CH-47\nhelicopters. By dusk, 5 May 1968, A/l/77 was in position with the necessary personnel, equipment, and ammunition to continue its mission of\nclose and continuous fire support while continuing to replace end refurnish lost and damaged equipment.\n[ORLL, 1st Air Cavalry Division Artillery, period ending 31 July 1968, p. 4] (1) 2d Battalion (Aerial Artillery), 20th Artillery: During the\nperiod 1-7 May 1968, the battalion was in general support of Opergtion\nDELAWARE, [...] B Battery\nwas placed in a general support-reinforcing role to the 1/77 Artillery\nin support of the 2d Brigade in the SCOTLAND II AO. [...]\nOn the night of 4-5 May, LZ Peanuts was assaulted by NVA forces. B Battery\npodded continuous fires in defense of the position and contributed\nsignificant^- U> repulsing the attack."
