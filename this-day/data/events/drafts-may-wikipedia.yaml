  year: 1962
  title: "Viet Cong abduct three missionaries at Ban Me Thuot leprosarium"
  body: "<p>On May 30, 1962, about a dozen armed men dressed in black invaded the Ban Me Thuot Leprosarium in South Vietnam at dusk. Houston physician Ardel Vietti served there as a missionary. The Viet Cong cut the window screens of the Mitchell house, ordered everyone out into the center of the compound, and tied the Rev. Archie Mitchell with ropes cut from the children's swings. Daniel Gerber was accosted as he strolled outside the compound, and Vietti, limping, was brought at bayonet point to join them.</p>\n<p>The intruders took a Land Rover, medicine and equipment. After lecturing the missionaries, the Viet Cong told them to leave the leprosarium at daylight and never return, then left, taking Vietti, Mitchell and Gerber with them. South Vietnamese marines and U.S. military advisers searched the next day but found no sign of the three. As of October 2001, Eleanor Ardel Vietti was the only American woman, civilian or military, still considered missing in Vietnam.</p>\n"
