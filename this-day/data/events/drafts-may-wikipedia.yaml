  status: "draft"
  source_text: "[Wikipedia, 1967_in_the_Vietnam_War, rev 1370279584] The House Committee on Armed Services established a subcommittee to review the development, history, distribution and adequacy of the M16 rifle after complaints about its reliability in combat, particularly during the Hill Fights. The subcommittee's report found that a change in propellant powder and deficiencies in cleaning were the major causes of problems with the weapon and improved cleaning procedures and the introduction of a chrome-plated chamber on the M16A1 overcame most of the reliability complaints.\n[Google Books catalog record, books.google.com/books?id=MQREAQAAMAAJ] Report of the Special Subcommittee on the M-16 Rifle Program of the Committee on Armed Services, House of Representatives, , Ninetieth Congress, First Session, October 19, 1967\n[Google Books catalog record, books.google.com/books?id=MQREAQAAMAAJ] U.S. Government Printing Office , 1967 - M-16 rifle - 52 pages"
