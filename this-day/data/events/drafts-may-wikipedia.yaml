- month: 5
  day: 9
  year: 1970
  title: "Nixon talks with students at the Lincoln Memorial before dawn"
  body: "<p>On May 9, 1970, in the early morning hours, President Richard Nixon made an impromptu visit to the Lincoln Memorial and talked with student protestors. The visit came shortly after the invasion of Cambodia and the killing of four students at Kent State University on May 4. After a press conference at 10 p.m. on May 8, Nixon went to bed at 2:15 a.m., woke shortly after 4 a.m., and told his valet, Manolo Sanchez, \"Get your clothes on, we'll go down to the Lincoln Memorial!\"</p>\n<p>Several of the students attended Syracuse University, and Nixon commented on the school's football team. On Vietnam, he said he told them he hoped their \"hatred of the war\" would not turn into \"a bitter hatred of our whole system.\" The crowd swelled to about 30 before Nixon walked back to his limousine at first light. His chief of staff, H. R. Haldeman, wrote in his diary hours later, \"I am concerned about his condition.\"</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Tom McNichol, \"I Am Not a Kook: Richard Nixon's Bizarre Visit to the Lincoln Memorial\", The Atlantic, 2011"
      url: "https://www.theatlantic.com/politics/archive/2011/11/i-am-not-a-kook-richard-nixons-bizarre-visit-to-the-lincoln-memorial/248443/"
    - label: "Wikipedia, \"1970 in the Vietnam War\", revision 1377614479 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1970_in_the_Vietnam_War&oldid=1377614479"
  status: "draft"
  source_text: "[McNichol, The Atlantic, 14 November 2011] But perhaps the most bizarre moment of the Nixon presidency took place in the early morning hours of May 9, 1970, during which Nixon, with his faithful White House butler in tow, made an impromptu visit to the Lincoln Memorial and engaged in a rambling dialogue with student protestors. The incident took place at a tumultuous time in the Nixon presidency, shortly after the invasion of Cambodia and the resulting explosion of outrage on college campuses, culminating in the killing of four students at Kent State University on May 4. Nixon's erratic behavior during the Lincoln Memorial visit would have even his closest aides wondering if the president was losing it. Nixon's Chief of Staff H. R. Haldeman would write in his diary hours after the Lincoln Memorial visit, \"I am concerned about his condition,\" and note that Nixon's behavior that morning constituted \"the weirdest day so far.\"\n[McNichol, The Atlantic] Nixon recounts the lead up to his predawn visit. After finishing a press conference at 10 p.m. on May 8 during which he faced tough questions about his decision to invade Cambodia and the campus furor it provoked, Nixon says he then fielded about 20 telephone calls \"from VIPs,\" went to bed at 2:15 a.m. and \"slept soundly\" until shortly after 4 a.m.\n[McNichol, The Atlantic] The loud music awakened White House valet Manolo Sanchez, and as Nixon looked out the window at a small knot of people gathering outside on the National Mall, he asked his valet if he had had ever been to the Lincoln Memorial at night. When Sanchez replied no, Nixon impulsively told him, \"Get your clothes on, we'll go down to the Lincoln Memorial!\"\n[McNichol, The Atlantic] \"To get the conversation going,\" Nixon continues, \"I asked how old they were, what they were studying, the usual questions.\" When several of the students said they attended Syracuse University, Nixon commented on how good the school's football team was.\n[McNichol, The Atlantic] When the discussion turned to Vietnam, Nixon says he told the students, \"I hope that (your) hatred of the war, which I could well understand, would not turn into a bitter hatred of our whole system, our country and everything that it stood for.\"\n[McNichol, The Atlantic] By this time, the small crowd of students had swelled to about 30.\n[McNichol, The Atlantic] Soon, the first light of dawn was breaking across the sky, and Nixon, having exhausted both himself and his welcome, began walking back to the presidential limousine."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T17:00:00Z"
- month: 5
  day: 11
  year: 1972
  title: "1st Lt. Michael Blassie shot down near An Loc"
  body: "<p>On May 11, 1972, the A-37B Dragonfly of First Lieutenant Michael Joseph Blassie, 24, of the 8th Special Operations Squadron, was shot down near An Loc, about 60 miles north of Saigon. He had crashed in an area controlled by enemy forces, and the crash site could not be examined. Five months later a South Vietnamese Army patrol recovered a pelvis, an upper arm bone, and some ribs, with remnants of a flight suit, a life raft, and pieces of a parachute.</p>\n<p>The remains went to the U.S. Army Central Identification Laboratory, Hawaii. First classified as Blassie's, they were designated \"Unknown\" and numbered \"X-26\" after analysis suggested they were not a compelling match to his age and height. On Memorial Day 1984 they were laid to rest in the Tomb of the Unknown at Arlington National Cemetery. In 1998 the tomb was opened, and mitochondrial DNA testing against samples from his mother and sister found a match. On July 11, 1998, Blassie was buried with full military honors in Jefferson National Cemetery, Missouri.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "National Library of Medicine, \"Michael Blassie: unknown no more\", Visible Proofs: Forensic Views of the Body, National Institutes of Health, 2006"
      url: "https://www.nlm.nih.gov/exhibition/visibleproofs/galleries/cases/blassie.html"
    - label: "Wikipedia, \"1972 in the Vietnam War\", revision 1372115736 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1972_in_the_Vietnam_War&oldid=1372115736"
  status: "draft"
  source_text: "[NLM, Visible Proofs, \"Michael Blassie unknown no more\"] On Memorial Day 1984, the remains of a soldier killed during the Vietnam War were laid to rest in the Tomb of the Unknown at Arlington National Cemetery. A decade later, however, questions began to arise about the identity of this unknown soldier.\n[NLM, Visible Proofs] First Lieutenant Michael Joseph Blassie, 24, was shot down over South Vietnam in 1972 and presumed dead. When family members received word that his remains might be buried in the Tomb of the Unknown, they petitioned the Department of Defense to open the site and conduct previously unavailable DNA testing. In 1998 the Tomb of the Unknown was opened and the remains of the Vietnam Unknown—identified as X-26—were removed.\n[NLM, Visible Proofs] Forensic anthropologists took the aged and damaged samples of bone for mitochondrial DNA (mtDNA) testing. Because mtDNA is passed along the maternal line, scientists compared the Unknown Soldier's DNA against two samples submitted by First Lieutenant Blassie's mother and sister and found a match.\n[NLM, Visible Proofs] On July 11, 1998, 1st Lt. Michael Blassie was buried with full military honors in Jefferson National Cemetery, Missouri, near his hometown, in the same cemetery as his father.\n[NLM, Visible Proofs] Michael Joseph Blassie, the oldest of five children of a St. Louis meat cutter, entered the Air Force Academy in 1966 and received his officer's commission in June 1970. During a tour of Vietnam, he served as a member of the 8th Special Operations Squadron. On May 11, 1972, at age 24, his A-37B Dragonfly aircraft was shot down near An Loc, about 60 miles north of Saigon.\n[NLM, Visible Proofs] Immediate recovery attempts were launched, but Blassie had crashed in an area controlled by enemy forces so it was impossible to examine the crash site. Five months later, during a sweep of the area, a South Vietnamese Army patrol recovered a pelvis, an upper arm bone, and some ribs, as well as the remnants of a flight suit, a life raft, pieces of a parachute, and part of a USAF holster. The remains and associated materials were eventually turned over to the U.S. Army Central Identification Laboratory, Hawaii for analysis and identification. They were initially classified as belonging to Lt. Blassie. However, analysis at the time suggested that the remains were not a compelling match to Blassie's age and height. With the conflicting information between the forensic analysis and the physical evidence, the remains were designated as \"Unknown\" and assigned the number \"X-26.\""
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T17:00:00Z"
