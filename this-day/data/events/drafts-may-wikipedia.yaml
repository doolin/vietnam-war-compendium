- month: 5
  day: 23
  year: 1972
  title: "Phantoms down two MIGs near Kep airfield"
  body: "<p>On May 23, 1972, a flight of F-4E's flew to the vicinity of Kep airfield as a chaff flight escort. Once the chaff aircraft had completed their activity, the Phantoms switched to MIGCAP. Passing a few miles north of Kep, they spotted four MIG-21's preparing to take off and two MIG-17's airborne. Capt. James M. Beatty feinted toward the MIG-17's, and they turned tail.</p>\n<p>Lt. Col. Lyle L. Beckers, with Capt. John Huwe, went after two MIG-19's south of the field. Beckers fired two AIM-7's in ripple, and the first guided to a direct hit. Meanwhile, Beatty and 1st Lt. James M. Sumner spotted two MIG-21's on their tail. Beatty started after them and destroyed one with 20-mm gunfire, putting an estimated 50-100 rounds into it. The two victories came in an engagement with eight MIG's.</p>\n"
  photo_url: null
  photo_alt: null
  references:
    - label: "Futrell et al., \"Aces and Aerial Victories: The United States Air Force in Southeast Asia 1965-1973\", Air University, Headquarters USAF, 1976, pp. 94-95"
      url: "https://media.defense.gov/2010/Sep/21/2001329821/-1/-1/0/AFD-100921-010.pdf"
    - label: "Wikipedia, \"1972 in the Vietnam War\", revision 1372115736 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1972_in_the_Vietnam_War&oldid=1372115736"
  status: "draft"
  source_text: "[Futrell, Aces and Aerial Victories, p. 94] A flight of F-4E’s on 23 May flew to the vicinity\nof Kep airfield as a chaff flight escort. Once the\nchaff aircraft had completed their activity, the F 4 ’ s\nswitched to MIGCAP. Lt. Col. Lyle L. Beckers and\nCapt. John Huwe. engaged and destroyed a MIG\nwith an AIM-7 missile, while another Phantom,\ncrewed by Capt. James M. Beatty and 1st Lt. James\nM. Sumner, destroyed a MIG-21 with 2@mm gunfire in the same engagement. These victories occurred during an engagement with eight MIG’s.\nAfter the chaff flight departed the atea, the F-4’s\npassed a few miles north of Kep airfield and spotted\nfour MIG-21’s preparing to take off and two MIG17’s airborne, at 8 o’clock low. Beatty feinted toward the MIG-lTs, and they turned tail. Meanwhile, Beckers spotted two MIG-19’s south of the\nfield and went after them.\n\n[Futrell, Aces and Aerial Victories, p. 95] I paused for settling time, then fired two\nAIM-7's in ripple. The first missile guided to a\ndirect hit with the second missile guiding within\n20 feet but failing to detonate.\n\n[Futrell, Aces and Aerial Victories, p. 95] Meanwhile, Beatty and Sumner set\nup cover for their flight leader and observed Beckers' MIG kill. Soon thereafter, while Beckers was\ntrying to get another MIG, Beatty spotted two\nMIG-21's on their tail. Beatty immediately started\nafter these North Vietnamese and was soon in a\nposition to use his 20-mm cannon.\n\n[Futrell, Aces and Aerial Victories, p. 95] I had enough time to let the gunsight settle, and\nwhen the pipper got about one airplane length in\nfront of him, I fired. The tracers helped me a great\ndeal. I thought I had missed him until I closed to\ninside a thousand feet, where I could see my\n20-mm was right on. I estimate that I put 50-100\nrounds in him, and his plane began to come apart\nand roll to the left.\n\n[Futrell, Aces and Aerial Victories, appendix table, p. 141] 23 May 72\n\n[Wikipedia, 1972_in_the_Vietnam_War, rev 1372115736] U.S. jets bombed power plants at Hongai and Nam Định and shot down five VPAF MiGs.\n"
  summarized_by: "Claude Opus 5.5"
