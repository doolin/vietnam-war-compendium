  title: "Two HMM-361 UH-34Ds shot down southwest of Da Nang"
  body: "<p>On October 8, 1962, two UH-34Ds of HMM-361 were shot down by the VC while on a search-and-rescue mission 38 mi southwest of Da Nang. The shootdowns killed four pilots, five Marine crewmen, the squadron's flight surgeon, and two Navy corpsmen.</p><p>The deaths were the largest one-day U.S. loss of life to that point in the war.</p>"
