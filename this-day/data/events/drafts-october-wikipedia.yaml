  year: 1970
  title: "Nixon proposes five-point truce in nationwide address"
  body: "<p>On October 7, 1970, Nixon delivered a nationwide address in which he announced a five-point proposal for a truce to halt the war. Under the proposal, all sides would begin a ceasefire and release all prisoners of war, in exchange for broader negotiations in the Paris Peace Talks.</p><p>The next day, the North Vietnamese and VC delegations to the Paris Peace Talks both denounced Nixon's proposal as \"a maneuver to deceive world opinion.\" They stopped short, however, of rejecting it entirely.</p>"
