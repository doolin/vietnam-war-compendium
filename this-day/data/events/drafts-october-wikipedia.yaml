- month: 10
  day: 25
  year: 1972
  title: "PAVN/VC launch 113 attacks ahead of expected ceasefire"
  body: "<p>On October 25, 1972, PAVN/VC forces conducted 113 attacks across South Vietnam in what was seen as an attempt to seize as much territory as possible before an imminent ceasefire. A rocket attack on Danang Air Base killed one U.S. civilian and nine South Vietnamese civilians outside the base. A rocket attack on Hội An killed four civilians and wounded 35, and a rocket attack on Tri Tam, 36 mi northwest of Saigon, killed ten civilians and one ARVN soldier and wounded 37 civilians.</p><p>The same day, North Vietnam publicly broadcast the terms of the draft peace agreement and accused the United States of negotiating in bad faith. It said that the terms of a ceasefire agreement had been agreed, but that the U.S. had backed off signing, \"claiming that it had difficulties in Saigon.\"</p><p>South Vietnam's Foreign Minister Trần Văn Lắm briefed the ambassadors from Australia, Japan, Laos, the Philippines, Thailand, and West Germany on the current peace proposals.</p>"
