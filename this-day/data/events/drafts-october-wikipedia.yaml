- month: 10
  day: 23
  year: 1971
  title: "Typhoon Hester batters Chu Lai and Da Nang"
  body: "<p>On October 23, 1971, Typhoon Hester made landfall over South Vietnam, causing severe damage that continued over the following days. At Chu Lai Base Area, Hester damaged or destroyed 75 percent of the structures in the base, with sustained winds and gusts estimated at 130 km/h (80 mph) and 160 km/h (105 mph). Four hangars collapsed at Chu Lai Air Base, and aircraft losses there totaled 36 destroyed and 87 damaged. The 91st Evacuation Hospital was mostly destroyed and transferred its patients to Qui Nhơn.</p><p>Heavy rains caused considerable flooding; approximately 370 km (230 mi) of coastline between Quảng Trị and Da Nang were inundated, and about 90 percent of homes in Da Nang were damaged. Twenty-two people were killed when an RVNAF C-47 transport crashed 5 mi west of Qui Nhơn. Three Americans were killed by flying debris during the storm and twenty-one others were injured. On 25 October, thunderstorms associated with Hester were blamed for a CH-47 crash near Nha Trang that killed 10 Americans.</p>"
