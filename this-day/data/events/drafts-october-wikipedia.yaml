- month: 10
  day: 29
  year: 1964
  title: "ARVN rangers uncover VC supply cache in Phuoc Thanh"
  body: "<p>On October 29, 1964, the ARVN 31st Rangers and two battalions of the 48th Infantry began a search of a VC base area in Phuoc Thanh province that continued over the following two days. When the VC fired on a UH–1B, one of the battalions diverted its course toward the gunfire and uncovered a large supply cache.</p><p>The following day, the infantry drove a VC battalion into the open, where armed helicopters, fighter-bombers, and artillery inflicted significant casualties. By the end of the operation the allies had killed 54 VC, wounded 63, and captured four. They had also captured 660 tons of rice, 200 mines, 1,000 uniforms, and large quantities of other supplies.</p>"
