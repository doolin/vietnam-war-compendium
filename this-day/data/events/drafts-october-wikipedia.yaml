- month: 10
  day: 11
  year: 1964
  title: "North Vietnam orders PAVN into the South; VC attack Tay Ninh hamlets"
  body: "<p>On October 11, 1964, the North Vietnamese Central Military Commission ordered the VC and PAVN to jointly \"annihilate a part of the enemy's main force units\" in South Vietnam between December 1964 and March 1965. PAVN units had not previously participated in the war in South Vietnam.</p><p>The same day, four VC battalions attacked two New Rural Life hamlets in Tay Ninh Province, 48km northwest of Saigon. At Phouc Thanh, defended by a rifle company and the headquarters of the ARVN 1st Battalion, 9th Infantry, the VC penetrated the hamlet, captured a 57mm recoilless rifle, and withdrew. They returned twenty minutes later, and the defenders repulsed the attack with the assistance of nearby artillery.</p><p>The 9th Infantry lost 30 dead, 34 wounded, 29 missing, a recoilless rifle, and 43 other weapons. The VC left 64 bodies, 12 prisoners, and 17 weapons. During the pursuit, a VC mine exploded under a jeep carrying the commander of the 1st Battalion, 43rd Infantry, and two US advisers, killing all three.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Wikipedia, \"1964 in the Vietnam War\", revision 1370342430 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1964_in_the_Vietnam_War&oldid=1370342430"
    - label: "Andrew Birtle, \"Advice and Support: The Middle Years, January 1964–June 1965\", Center of Military History, United States Army, 2024"
      url: "https://history.army.mil/Publications/Publications-Catalog-Sub/Publications-By-Title/Advice-and-Support-The-Middle-Years/"
  status: "draft"
  source_text: "[Wikipedia, 1964_in_the_Vietnam_War, rev 1370342430] The North Vietnamese Central Military Commission ordered the VC and PAVN to jointly \"annihilate a part of the enemy's main force units\" in South Vietnam between December 1964 and March 1965. Prior to this announcement, PAVN units had not participated in the war in South Vietnam.\n\nThe ARVN 14th Infantry pushed a VC company into a confined area in Vinh Binh province where it was hit by aircraft and artillery. The ARVN commander refused an order from his superior to advance to block the VC escape. The operation continued into the following day, with the ARVN losing four dead and 16 wounded and the VC losing 21 dead, one prisoner, and three weapons.\n\nFour VC battalions attacked two New Rural Life hamlets in Tay Ninh Province, 48km northwest of Saigon. The VC penetrated Phouc Thanh, which a rifle company and the headquarters of the ARVN 1st Battalion, 9th Infantry, defended. The VC captured a 57mm recoilless rifle and then withdrew. Twenty minutes later, they returned. This time the defenders repulsed the attack with the assistance of nearby artillery. At Ap Chanh, the VC dispersed two infantry companies from the 1/9th Infantry. The ARVN reoccupied the hamlet after dawn. The 9th Infantry lost 30 dead, 34 wounded, 29 missing, a recoilless rifle, and 43 other weapons lost. The VC left 64 bodies, 12 prisoners, and 17 weapons, with the allies estimating that the ARVN had caused another 100 casualties. Three civilians died in the fighting and five suffered injuries. Three battalions set off in pursuit of the VC. During this operation, the VC exploded a mine under a jeep bearing the commander of the 1st Battalion, 43rd Infantry, and two US advisers, killing all three."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:34:58Z"
- month: 10
  day: 13
  year: 1972
  title: "Captain Jeffrey Feinstein becomes fifth and last U.S. ace"
  body: "<p>On October 13, 1972, the JGS reported that at least 60 ARVN soldiers had been killed and more than 120 wounded at Ben Het, and that fighting continued in the jungle east of the base.</p><p>The same day, USAF weapon systems officer Captain Jeffrey Feinstein became the fifth and last U.S. ace of the war when he and his pilot shot down a MiG-21 near Hanoi.</p>"
