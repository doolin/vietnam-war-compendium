    - label: "United Press International, \"Typhoon Hester batters coast of S. Vietnam\", The Bulletin, 23 October 1971"
      url: "https://news.google.com/newspapers?id=onYzAAAAIBAJ&sjid=t_cDAAAAIBAJ&dq=hester&pg=1831%2C5643266"
  status: "draft"
  source_text: "[Wikipedia, 1971_in_the_Vietnam_War, rev 1370279651] Typhoon Hester made landfall over South Vietnam causing severe damage. At Chu Lai Base Area, Hester damaged or destroyed 75 percent of the structures in the base. Sustained winds and gusts in the base were estimated to have reached 130 km/h (80 mph) and 160 km/h (105 mph) respectively. Four hangars collapsed in the Chu Lai Air Base, with total aircraft losses amounting to 36 destroyed and 87 damaged. The 91st Evacuation Hospital was mostly destroyed and was forced to transfer patients to Qui Nhơn. Nearly 50 percent of the structures at the Marble Mountain Air Facility were damaged by the storm's high winds. Heavy rains accompanying the storm caused considerable flooding in the country, approximately 370 km (230 mi) of coastline between Quảng Trị and Da Nang were inundated. About 90 percent of homes in Da Nang were damaged. Twenty-two people were killed when an RVNAF C-47 transport crashed 5 mi west Qui Nhơn. Thee Americans were killed due to flying debris during the storm and twenty-one others were injured. On 25 October, thunderstorms associated with Hester were blamed for a CH-47 crash near Nha Trang that killed 10 Americans."
  summarized_by: "Claude Fable 5.1"
