  photo_alt: null
  references:
    - label: "Wikipedia, \"1972 in the Vietnam War\", revision 1372115736 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1972_in_the_Vietnam_War&oldid=1372115736"
    - label: "\"Memoirs v Tapes: President Nixon and the December Bombings\""
      url: "http://www.nixonlibrary.gov/exhibits/decbomb/chapter-ii.html"
  status: "draft"
  source_text: "[Wikipedia, 1972_in_the_Vietnam_War, rev 1372115736] Despite South Vietnamese opposition to the draft peace agreement and the charges by North Vietnam that the U.S. was negotiating in bad faith, Kissinger declared \"Peace is at hand\" in Vietnam and that a final agreement could be achieved after one more three-four day negotiating session.\n\nSouth Vietnam announced that it was \"ready to accept a cease-fire\" but \"would never accept a political settlement which goes against the interests and aspirations of the 17 million South Vietnamese people.\"\n\nXuân Thủy said that the U.S. and North Vietnam had resolved all outstanding points on 17 October, that a ceasefire agreement was scheduled to be signed on 31 October and called on the U.S. to honor that commitment.\n\nHeavy fighting was reported in Laos, particularly in the Plain of Jars area and near Saravane as each side sought to maximize their territory before any ceasefire."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:34:58Z"
- month: 10
  day: 27
  year: 1965
  title: "VC sappers destroy 19 aircraft at Marble Mountain"
  body: "<p>On October 27, 1965, and continuing into the next day, approximately 90 VC attacked Marble Mountain Air Facility near Da Nang under the cover of 60 mm mortar fire, using four demolition teams armed with Bangalore torpedoes and hand grenades. They destroyed 19 aircraft and damaged another 35. VMO-2 took the brunt of the attack, with 13 of its UH-1E Hueys destroyed. The attack killed two Marines and one Navy Corpsman, and another 91 were wounded. Seventeen Viet Cong were killed during the battle and four wounded VC were captured.</p><p>The VC also penetrated Chu Lai Air Base, destroying two A-4 Skyhawks and damaging a further six. Marines killed 15 of the 20-man VC sapper squad.</p>"
