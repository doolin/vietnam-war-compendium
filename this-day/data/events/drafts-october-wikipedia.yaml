- month: 10
  day: 3
  year: 1964
  title: "ARVN rangers trap VC company in Operation Dan Chi"
  body: "<p>On October 3, 1964, the ARVN 2nd Battalion, 33rd Infantry launched Operation Dan Chi in An Xuyên province. As the troops, riding M113s, advanced on the hamlet of Tan Duc, they flushed a VC company out into the open. Twelve US helicopters then landed 56 rangers to engage an estimated 150 VC.</p><p>The VC fought the rangers, who were supported by US Army gunships, until nightfall, when the VC withdrew. The allies found 46 VC dead, took 37 prisoners, and captured 24 weapons. The rangers suffered two wounded.</p><p>The operation continued for another two days but generated little contact.</p>"
