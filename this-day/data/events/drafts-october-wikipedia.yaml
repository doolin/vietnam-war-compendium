- month: 10
  day: 5
  year: 1963
  title: "State Department presses Diệm with Cable 534"
  body: "<p>On October 5, 1963, the Department of State sent Cable 534 to Ambassador Lodge in South Vietnam with instructions to press President Diệm on a number of issues. Pending favorable action by Diệm, some economic aid programs would be suspended, which in the State Department's view would not have an adverse impact on the war against the VC for two to four months. Diệm was to be enjoined to cease criticism of the United States and to focus on a serious military situation in the Mekong Delta, holding territory and protecting the rural population rather than having the ARVN undertake military sweeps of only temporary value.</p><p>The US also suspended the Commercial Import Program after the McNamara Taylor mission reported that Diệm was preoccupied with suppressing Buddhist protests rather than fighting the insurrection. One reason for the suspension was to signal to military officers that Washington was unhappy with Diệm, increasing the prospects of a coup; another was the chance, considered unlikely, that Diệm would change his policy direction in line with US wishes.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Wikipedia, \"1963 in the Vietnam War\", revision 1370279475 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1963_in_the_Vietnam_War&oldid=1370279475"
    - label: "\"Foreign Relations of the United States, 1961-1963\", Vol III, Vietnam, January–August 1963"
      url: "https://history.state.gov/historicaldocuments/frus1961-63v04/d181"
  status: "draft"
  source_text: "[Wikipedia, 1963_in_the_Vietnam_War, rev 1370279475] Cable 534 was sent to Ambassador Lodge in South Vietnam from the Department of State with instructions for Lodge to press President Diệm on a number of issues. Pending favorable action of the part of Diệm, some economic aid programs would be suspended which, in the view of the State Department, would not have an adverse impact on the war against the VC for two to four months. Among other things, Diệm was to be enjoined to cease criticism of the United States and to focus on a serious military situation in the Mekong Delta. His strategy should be to hold territory and protect the rural population rather than having the ARVN undertake military sweeps of only temporary value.\n\nThe Commercial Import Program was suspended by the US in the wake of the McNamara Taylor mission. The report concluded that Diệm was not concentrating on fighting the insurrection but was instead preoccupied with suppressing Buddhist protests. One of the reasons for the suspension was to give military officers a signal that Washington was unhappy with Diệm and therefore increase the prospects of a coup, as well as to try and foster urban resentment towards Diệm among those that had previously benefited from the CIP. Another was that Diệm might change his policy direction in accordance with US wishes, although they considered this to be unlikely."
  summarized_by: "Claude Fable 5.1"
