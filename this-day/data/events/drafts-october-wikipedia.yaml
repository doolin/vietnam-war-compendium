- month: 10
  day: 28
  year: 1963
  title: "General Đôn meets Conein on coup plans"
  body: "<p>On October 28, 1963, Vietnamese coup plotter General Trần Văn Đôn met with Colonel Lucien Conein of the U.S. Embassy to discuss plans for the coup. Đôn said that he had assurances from Ambassador Lodge that Conein was the proper channel to discuss coup plans.</p><p>Đôn said that he and his fellow Generals wished to do everything possible to avoid American involvement in the coup. He also stated emphatically that other Americans should quit talking about the coup with ARVN officers.</p>"
