- month: 10
  day: 18
  year: 1961
  title: "Taylor Mission arrives in Saigon"
  body: "<p>On October 18, 1961, the Taylor Mission arrived in Saigon during the morning. The mission had left Washington on the afternoon of October 15 and stopped at CINCPAC headquarters in Honolulu, where Admiral Harry D. Felt, Commander in Chief, Pacific, briefed it on the situation in Southeast Asia. Felt was convinced the situation in Viet-Nam was critical and needed prompt United States assistance. He favored introducing logistic units, including engineer and helicopter units, but withholding combat forces for the time being.</p><p>Besides Gen. Maxwell D. Taylor and Walt W. Rostow, the mission included Sterling Cottrell, Rear Admiral Luther C. Heinz, Brigadier General William H. Craig, Brigadier General Edward G. Lansdale, and members drawn from the JCS, ARPA, the Department of State's Policy Planning Council, the International Cooperation Agency, and the Central Intelligence Agency. Taylor, who planned to wear civilian clothes, asked that there be no military honors, social functions, press briefings, or interviews.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "\"Foreign Relations of the United States, 1961–1963, Volume I, Vietnam, 1961\", Document 169 (Editorial Note), Office of the Historian, U.S. Department of State, 1988"
      url: "https://history.state.gov/historicaldocuments/frus1961-63v01/d169"
    - label: "Wikipedia, \"1961 in the Vietnam War\", revision 1370279448 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1961_in_the_Vietnam_War&oldid=1370279448"
  status: "draft"
  source_text: "[FRUS 1961–1963, Vol. I, Doc. 169, Editorial Note] The Taylor Mission departed Washington on the afternoon of Sunday, October 15, 1961. In addition to Taylor and Rostow, the mission included Sterling Cottrell; Rear Admiral Luther C. Heinz; Brigadier General William H. Craig; Brigadier General Edward G. Lansdale; Colonel Robert M. Levy, USAF (J-3, JCS); Colonel Albert W. Campbell, USMC (J-4); Dr. George W. Rathjens (ARPA); William Jorden, Policy Planning Council, Department of State; James W. Howe, International Cooperation Agency; David R. Smith, Central Intelligence Agency; Lieutenant Colonel Thomas C. Steinhauser, USA (J-2); Lieutenant Commander Worth H. Bagley, USN, Naval Aide to General Taylor; and Major James W. Dingman, USA, Army Aide to General Taylor. ... Taylor, who planned to wear civilian clothes, asked that there be no military honors, social functions, press briefings, or interviews.\n\nThe mission arrived at CINCPAC headquarters in Honolulu on the evening of October 15. Taylor recalls that the following morning the mission received an exhaustive briefing on the situation in Southeast Asia from Admiral Harry D. Felt, Commander in Chief, Pacific. Admiral Felt was convinced the situation in Viet-Nam was critical and needed prompt United States assistance. ... Regarding the need for United States forces in South Vietnam, Felt was inclined to favor the introduction of logistic units, including engineer and helicopter units for selective assistance to the Vietnamese, but to withhold combat forces for the time being. ...\n\nThe mission left Honolulu the evening of October 16 and arrived in Saigon during the morning of October 18.\n\n[FRUS 1961–1963, Vol. I, Doc. 169, Persons] Rostow, Walt W. ... Taylor, Gen. Maxwell D."
  summarized_by: "Claude Opus 5.5"
