- month: 10
  day: 1
  year: 1972
  title: "Turret explosion on USS Newport News kills 20 sailors"
  body: "<p>On October 1, 1972, at about 0100, an 8-inch projectile in the bore of the center gun of Turret Two aboard the USS Newport News (CA-148) exploded prematurely, setting off several casings in the powder hoists. The ship, the only heavy cruiser left in the Navy, had been on the gun line off the coast of South Vietnam since 11 May 1972, providing gunfire support in the Quang Tri City vicinity.</p><p>A fire raged inside the turret. Captain William \"Zeke\" Zartman ordered the flooding of the magazines at 0126, and it took 30 minutes to put out the fire, by which time some 720 pounds of powder had burned. A total of 20 men died that night or later from smoke inhalation, and 36 others suffered serious injuries from toxic gases. The ship departed for repairs at Subic Bay at 0743.</p><p>An inquiry by retired Vice Admirals K. S. Masterson and L. M. Mustin identified the cause as a defective auxiliary detonating fuse that had fired prematurely.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Taylor Baldwin Kiland, \"'Fire in Turret Two!'\", Proceedings, Vol. 138/10/1,316, U.S. Naval Institute, October 2012"
      url: "https://www.usni.org/magazines/proceedings/2012/october/fire-turret-two"
    - label: "Wikipedia, \"1972 in the Vietnam War\", revision 1372115736 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1972_in_the_Vietnam_War&oldid=1372115736"
  status: "draft"
  source_text: "[Kiland, 'Fire in Turret Two!', Proceedings, Oct. 2012, subtitle] Forty years ago, 20 sailors were killed and 36 injured when a faulty projectile detonated on the USS Newport News.\n\n[Kiland, opening section] The crew of the USS Newport News (CA-148) had been “on the gun line” since 11 May 1972, on station off the coast of South Vietnam providing heavy gunfire support against enemy troops and bunker positions in the Quang Tri City vicinity. She was the only heavy cruiser left in the Navy, and she delivered more firepower at a greater range than any other ship at the time.\n\n[Kiland, 'Gunfire Slightly Off-Key'] Machinist’s Mate Second Class Charles Perkins was sleeping when he was awakened at almost exactly 0100 by one of the eight-inch guns. It just didn’t sound right. Then he heard the announcement on the 1MC: “Fire in Turret Two!” ... The commanding officer, Captain William “Zeke” Zartman, rushed to the bridge and arrived at 0104, according to the ship’s deck log. ... An 8-inch projectile in the bore of the center gun of Turret Two had exploded prematurely, setting off several casings in the powder hoists. ... It was clear a fire was raging inside the turret.\n\n[Kiland, 'Damage Control and Haunting Memories'] Captain Zartman ordered the flooding of the magazines at 0126, and Repair Party I personnel began directing hoses toward the center gun pit. ... It took 30 minutes to fully extinguish the fire and to clear the smoke using “red devil blowers” that were rigged to the top of the turret, but not before some 720 pounds of powder had burned.\n\n[Kiland, 'Death in a Greenish Fog'] A complete inquiry, conducted by retired Vice Admirals K. S. Masterson and L. M. Mustin a month later, identified the cause of the explosion to be a defective auxiliary detonating fuse, which had prematurely fired.\n\n[Kiland, 'She Was a Beautiful, Graceful Lady'] A total of 20 men died that night or later from smoke inhalation. All of the men in the upper and lower shell decks died instantly. Thirty-six others suffered serious injuries from the toxic gases—including chlorine, phosgene, and cordite—that spread throughout the ship as a result. ... The ship departed for repairs at Subic Bay at 0743, and damage-control operations were secured at 1200."
  summarized_by: "Claude Opus 5.5"
