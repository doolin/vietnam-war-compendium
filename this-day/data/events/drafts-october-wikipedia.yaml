- month: 10
  day: 10
  year: 1969
  title: "Nixon secretly orders Operation Giant Lance"
  body: "<p>On October 10, 1969, on the advice of Kissinger, Nixon issued secret orders to the Joint Chiefs of Staff to commence Operation Giant Lance. The operation would send bombers armed with nuclear weapons toward Moscow in an effort to convince the Soviet leaders that Nixon was not reluctant to launch a nuclear war in an effort to end the ongoing war in Vietnam.</p><p>Under the orders, a squadron of 18 B-52 bombers, each carrying nuclear bombs, would be sent out on 27 October.</p>"
