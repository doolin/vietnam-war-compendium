  title: "Turret explosion on USS Newport News kills 19 sailors"
  body: "<p>On October 1, 1972, a gun turret exploded aboard the USS Newport News while the ship was operating off the coast of South Vietnam. The explosion killed 19 sailors and injured ten other sailors.</p><p>The same day, U.S. jets conducted 320 strikes on targets in North Vietnam. The targets included Kép Air Base and railyards near Hanoi.</p><p>In South Vietnam, a U.S. helicopter gunship accidentally attacked a South Vietnamese position near Mộ Đức. Five ARVN soldiers and 15 civilians were wounded in the attack.</p>"
