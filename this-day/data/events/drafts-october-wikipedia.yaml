- month: 10
  day: 26
  year: 1972
  title: "Kissinger declares \"Peace is at hand\""
  body: "<p>On October 26, 1972, Kissinger declared that \"Peace is at hand\" in Vietnam and that a final agreement could be achieved after one more three-to-four-day negotiating session. He made the statement despite South Vietnamese opposition to the draft peace agreement and North Vietnam's charges that the U.S. was negotiating in bad faith.</p><p>South Vietnam announced that it was \"ready to accept a cease-fire\" but \"would never accept a political settlement which goes against the interests and aspirations of the 17 million South Vietnamese people.\" Xuân Thủy said that the U.S. and North Vietnam had resolved all outstanding points on 17 October, that a ceasefire agreement was scheduled to be signed on 31 October, and called on the U.S. to honor that commitment.</p><p>Heavy fighting was reported in Laos, particularly in the Plain of Jars area and near Saravane, as each side sought to maximize its territory before any ceasefire.</p>"
