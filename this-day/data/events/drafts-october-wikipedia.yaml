- month: 10
  day: 20
  year: 1962
  title: "Grenade kills six in Saigon holiday crowd"
  body: "<p>On October 20, 1962, a VC threw a grenade into a holiday crowd in downtown Saigon, killing six persons, including two children, and injuring 38 people.</p><p>The same day, journalist David Halberstam wrote in The New York Times that \"the closer one gets to the actual contact level of the war, the further one gets from official optimism.\"</p>"
