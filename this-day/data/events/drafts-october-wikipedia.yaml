- month: 10
  day: 30
  year: 1963
  title: "Lodge tells Washington the U.S. cannot delay a coup"
  body: "<p>On October 30, 1963, Ambassador Lodge responded to Washington's request for more information about coup plans by saying that the U.S. did \"not have the power to delay or discourage a coup.\" He agreed that \"a miscalculation could jeopardize\" the U.S. position in Southeast Asia but added, \"We also run tremendous risks by doing nothing.\" Lodge noted that General Harkins did not concur with his opinion; Harkins had previously expressed opposition to a coup against Diệm.</p><p>A telegram from Washington to Lodge took exception to his view that the U.S. could not delay or discourage a coup, but instructed him to discourage a coup unless in his judgment it had a good chance of success. The instruction stated that \"It is not in the interest of USG to be or appear to be either the instrument of the existing government or the instrument of coup...But once a coup under responsible leadership has begun, and within these restrictions, it is in the interest of the U.S. Government that it should succeed.\"</p>"
