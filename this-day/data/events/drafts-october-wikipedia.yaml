- month: 10
  day: 6
  year: 1961
  title: "Nolting advises against seeking an alternative to Diệm"
  body: "<p>On October 6, 1961, Nolting sent a message to Washington on Diệm and the government he led. Two of Nolting's closest colleagues, Embassy officers Joseph Mendenhall and Arthur Gardiner, believed that the country could not attain the required unity, total national dedication, and organizational efficiency necessary to win with Diệm at the helm.</p><p>Nolting wrote that this might be true. Diệm did not organize well, did not delegate sufficient responsibility to his subordinates, and did not appear to know how to cultivate large-scale political support. In Nolting's judgment, however, Diệm was right and sound in his objectives and completely forthright with the Americans. Nolting thought it would be a mistake to seek an alternative to Diệm at that time or in the foreseeable future, and called the existing policy of all-out support to the present government the only feasible alternative.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Wikipedia, \"1961 in the Vietnam War\", revision 1370279448 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1961_in_the_Vietnam_War&oldid=1370279448"
    - label: "\"Foreign Relations of the United States, 1961-63, Vol. 1, Vietnam, 1961\", Department of State"
      url: "https://history.state.gov/historicaldocuments/frus1961-63v01"
  status: "draft"
  source_text: "[Wikipedia, 1961_in_the_Vietnam_War, rev 1370279448] Nolting sent the following message to Washington: \"Two of my closest colleagues [Embassy officers Joseph Mendenhall and Arthur Gardiner] believe that this country cannot attain the required unity, total national dedication, and organizational efficiency necessary to win with Diệm at helm. This may be true. Diệm does not organize well, does not delegate sufficient responsibility to his subordinates and does not appear to know how to cultivate large-scale political support. In my judgment, he is right and sound in his objectives and completely forthright with us. I think it would be a mistake to seek an alternative to Diệm at this time or in the foreseeable future. Our present policy of all-out support to the present government here is, I think, our only feasible alternative.\""
  summarized_by: "Claude Fable 5.1"
