  year: 1964
  title: "VC ambush two ARVN battalions in Bình Dương Province"
  body: "<p>On October 4, 1964, more than 1,000 VC ambushed two ARVN 8th Infantry battalions as they moved between the hamlets of Phu Hoa Dong and Ap Dong Nhut in Bình Dương Province. The ambush killed 32 ARVN soldiers and one U.S. adviser. Another 53 were wounded, 13 were missing, and 37 weapons were lost. The allies found 13 VC dead and estimated that the VC had lost 80 dead and one hundred wounded, mostly from airstrikes.</p><p>The same day in Quang Ngai, the VC forced civilians into a Regional Forces ambush site and then fired on the Regional Forces troops. The troops returned fire, killing 16 civilians and wounding 17.</p>"
