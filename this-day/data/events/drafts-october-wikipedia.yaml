- month: 10
  day: 24
  year: 1964
  title: "Cambodia shoots down USAF C-123, killing eight"
  body: "<p>On October 24, 1964, Cambodia shot down a USAF C-123 aircraft that was flying over the Cambodian border village of Dak Dam in the Mondulkiri Province. All eight crew members on board the aircraft were killed.</p><p>The same day, Ambassador Taylor met with Sửu and expressed his displeasure that the action had been taken without first consulting with the United States. Taylor said that, in the future, \"We could not accept\" a failure of the government to consult with the U.S.</p>"
