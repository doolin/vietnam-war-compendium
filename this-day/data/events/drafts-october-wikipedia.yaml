- month: 10
  day: 16
  year: 1964
  title: "VC battalion ambushes ARVN column twice near Ben Cat"
  body: "<p>On October 16, 1964, the ARVN 2nd Battalion, 7th Infantry, accompanied by a Popular Forces platoon and a platoon of M24 tanks from the 1st Armored Cavalry Squadron, was ambushed by a VC battalion 3km south of Ben Cat on Highway 13. The ARVN overran the original ambush and continued for 1km, when they were ambushed again. Two M24s were destroyed by 57mm recoilless rifles and a third damaged before the vehicles could disengage. The VC then surged forward to surround the column.</p><p>US Army UH–1B gunships and RVNAF A-1s arrived and, together with artillery fire, helped the troops fall back to a position where a parallel column reinforced them. The combined force counterattacked, and the engagement lasted until the VC broke contact at 11:30. The ARVN lost 16 dead, 21 wounded, and four missing. Reported VC losses ranged from 19 to 70 dead and between 40 and 100 casualties evacuated; one VC and 11 weapons were captured.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Wikipedia, \"1964 in the Vietnam War\", revision 1370342430 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1964_in_the_Vietnam_War&oldid=1370342430"
    - label: "Andrew Birtle, \"Advice and Support: The Middle Years, January 1964–June 1965\", Center of Military History, United States Army, 2024"
      url: "https://history.army.mil/Publications/Publications-Catalog-Sub/Publications-By-Title/Advice-and-Support-The-Middle-Years/"
  status: "draft"
  source_text: "[Wikipedia, 1964_in_the_Vietnam_War, rev 1370342430] China conducted its first successful nuclear weapons test. China's possession of nuclear weapons was seen in both Peking and Hanoi as a deterrent to an American invasion of North Vietnam.\n\nĐức, Phát and 18 others were put on trial in a military court over the September coup attempt. The accused officers claimed to have only intended to make a show of force, rather than overthrow Khánh. Đức claimed that the objective of his actions was to \"emphasize my ideas\" and said his actions did not constitute a coup attempt and that he had decided to end what he regarded as a military protest demonstration when Khánh promised to consider his concerns. Asked why he had denounced Khánh as a \"traitor\" in a radio broadcast during the coup attempt, Phát said he had merely \"gotten excited\". One week later, on 24 October, the charges were dropped. Khánh then gave Đức and Phát two months of detention for indiscipline; their subordinates were incarcerated for shorter periods.\n\nTwo ranger battalions and the ARVN 21st Division's reconnaissance company were landed by US helicopters along the border of Bac Lieu and Ba Xuyen provinces to encircle a 200-man VC unit. The VC were forced into the open and hit by US Army helicopter gunships. The VC lost 89 killed, 13 captured and 37 weapons recovered. ARVN losses were six dead and 24 wounded.\n\nThe 2nd Battalion, 7th Infantry, accompanied by a Popular Forces platoon and a platoon of M24 tanks from the 1st Armored Cavalry Squadron was ambushed by a VC battalion 3km south of Ben Cat on Highway 13. The ARVN overran the original ambush and continued for 1km when they were ambushed again. Two M24s were destroyed by 57mm recoilless rifles and a third damaged before the vehicles could disengage. The VC then surged forward to surround the column. US Army UH–1B gunships and RVNAF A-1s arrived, and together with artillery fire helped the troops fall back to a position where a parallel column reinforced them. The combined force then counterattacked, with the engagement lasting until the VC broke contact at 11:30. The ARVN lost 16 dead, 21 wounded, and four missing. Reported VC losses ranged from 19 to 70 dead and between 40 and 100 casualties evacuated. One VC and 11 weapons were captured."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:34:58Z"
- month: 10
  day: 18
  year: 1961
  title: "Taylor mission arrives in Saigon"
  body: "<p>On October 18, 1961, Taylor arrived in Saigon as head of a mission sent by Kennedy to examine the feasibility of U.S. military intervention in Vietnam. Deputy National Security Adviser Walter Rostow and Lansdale were among the members of his delegation.</p><p>In the report written after the trip, Taylor proposed a new partnership between South Vietnam and the U.S. that would involve dispatching 8,000 to 10,000 American soldiers to South Vietnam. These soldiers would permit joint planning of military operations, improved intelligence, increased covert activities, more American advisers, trainers, and special forces, and the introduction of American helicopter and light aircraft squadrons. They would also \"conduct such combat operations as are necessary for self-defense and for the security of the area in which they are stationed.\"</p><p>During the visit Diệm met privately with Lansdale and later requested that he be assigned to South Vietnam. Instead, Kennedy gave Lansdale the job of attempting to depose or kill Cuban leader Fidel Castro.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Wikipedia, \"1961 in the Vietnam War\", revision 1370279448 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1961_in_the_Vietnam_War&oldid=1370279448"
  status: "draft"
  source_text: "[Wikipedia, 1961_in_the_Vietnam_War, rev 1370279448] Taylor arrived in Saigon as head of a mission sent by Kennedy to examine the feasibility of U.S. military intervention in Vietnam. Deputy National Security Adviser Walter Rostow and Lansdale, were among the members of his delegation. In their report written after the trip, Taylor proposed a new partnership between South Vietnam and the U.S. that would involve dispatching 8,000 to 10,000 American soldiers to South Vietnam. These soldiers would permit joint planning of military operations, improved intelligence, increased covert activities, more American advisers, trainers, and special forces and the introduction of American helicopter and light aircraft squadrons. Most significantly, they would also \"conduct such combat operations as are necessary for self-defense and for the security of the area in which they are stationed.\"\n\nDuring the Taylor visit Diệm met privately with Lansdale and later requested that he be assigned to South Vietnam. Instead, Kennedy gave Lansdale the job of attempting to depose or kill Cuban leader Fidel Castro. According to Rostow, the failure to send Lansdale to South Vietnam was due to jealousy by the State Department and the Defense Department of Lansdale's unique access and influence with Diệm."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:34:58Z"
- month: 10
  day: 19
  year: 1964
  title: "ARVN 13th Infantry flushes VC into the open in Vinh Binh"
  body: "<p>On October 19, 1964, two battalions of the ARVN 13th Infantry Regiment pursued an estimated 300 VC in Vinh Binh province. The battalions failed to make contact, but their movement flushed the VC into the open 2km north of the hamlet of Hoa Hung.</p><p>ARVN troops landed by US helicopters killed three VC and captured one, and US Army helicopter gunships killed another 31 VC.</p>"
