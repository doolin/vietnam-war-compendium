- month: 10
  day: 9
  year: 1962
  title: "Taylor curbs DOD visitors; armed UH-1A company arrives"
  body: "<p>On October 9, 1962, Taylor issued a directive to \"reduce the number of visitors...to those having actual business of pressing interest.\" In the previous month he had been deluged with more than 200 visitors from the DOD, all requiring food, housing, entertainment, and visits to the countryside to see the war. The directive only temporarily reduced the number of visitors.</p><p>The same day, the Utility Tactical Transport Helicopter Company, equipped with 15 armed UH-1A helicopters, arrived in South Vietnam. The company would make its combat debut ten days later, escorting troop-carrying helicopters.</p>"
