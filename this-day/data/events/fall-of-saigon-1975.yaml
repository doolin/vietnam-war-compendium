# Events from the final collapse of South Vietnam, 1975. Bodies rewritten 2026-10-25 from the archived copy of
# Edward Rasen, "Final Fiasco: The Fall of Saigon," HistoryNet, https://historynet.com/final-fiasco-the-fall-of-saigon/

- month: 1
  day: 6
  year: 1975
  title: "PAVN takes Phuoc Long after a monthlong battle"
  body: "<p>On January 6, 1975, People's Army of Vietnam (PAVN) units took Phuoc Long after a nearly monthlong battle. By early March the unraveling of South Vietnam was in full swing, and on March 12 the PAVN captured Buon Ma Thuot, a provincial capital on the southern edge of the Central Highlands.</p><p>Frank Snepp, the CIA's chief analyst in Vietnam during 1975, said that after the fall of Phuoc Long, President Nguyen Van Thieu realized the United States was not going to save him. Thieu decided to retrench, which Snepp called too little, too late. As of March 14 he conceived a strategy he called \"light at the top, heavy at the bottom,\" pulling forces out of northern South Vietnam and concentrating them around the palace, because he was concerned his military commanders might move against him.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Edward Rasen, \"Final Fiasco: The Fall of Saigon,\" HistoryNet"
      url: "https://historynet.com/final-fiasco-the-fall-of-saigon/"
  status: "approved"
  source_text: "In January 1975, after a nearly monthlong battle, People’s Army of Vietnam (PAVN) units took Phuoc Long, and by early March the complete unraveling of South Vietnam was in full swing. On March 12, the PAVN captured Buon Ma Thuot, a provincial capital on the southern edge of the strategic Central Highlands. … “After the fall of Phuoc Long, Thieu realized the United States was not going to save him,” recalled Snepp. “He decided to retrench, but it was too little, too late. He conceived a strategy as of March 14 called ‘light at the top, heavy at the bottom,’ pulling forces out of northern South Vietnam and concentrating them around the palace…because he was concerned his military commanders might move against him.”"
