- month: 6
  day: 2
  year: 1969
  title: First Lieutenant Robert Leslie Poxon earns Medal of Honor (posthumous)
  body: "<p>On June 2, 1969, First Lieutenant Robert Leslie Poxon, Armor, Troop B,
    was serving as a platoon leader on a reconnaissance mission. Landing by helicopter
    in an area suspected of being occupied by the enemy, the platoon came under intense
    fire from enemy soldiers in concealed positions and fortifications around the
    landing zone. A soldier fell, hit by the first burst of fire. Poxon dashed to
    his aid across 20 meters of open ground, drawing most of the enemy fire. The fallen
    soldier was beyond help, and Poxon was seriously wounded.</p><p>He refused medical
    aid and evacuation and marked a central enemy bunker as the key to the fight.
    Instructing his men to concentrate their fire on it, he crawled toward the bunker,
    readied a hand grenade and charged. He was hit again but continued the assault.
    After silencing the enemy guns in the bunker he was struck once more by enemy
    fire and fell, mortally wounded. His comrades followed him, pressed the attack
    and drove the enemy from their positions.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Robert Leslie Poxon (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. 1st Lt. Poxon, Armor, Troop B, distinguished
    himself while serving as a platoon leader on a reconnaissance mission. Landing
    by helicopter in an area suspected of being occupied by the enemy, the platoon
    came under intense fire from enemy soldiers in concealed positions and fortifications
    around the landing zone. A soldier fell, hit by the first burst of fire. 1st Lt.
    Poxon dashed to his aid, drawing the majority of the enemy fire as he crossed
    20 meters of open ground. The fallen soldier was beyond help and 1st Lt. Poxon
    was seriously and painfully wounded. 1st Lt. Poxon, with indomitable courage,
    refused medical aid and evacuation and turned his attention to seizing the initiative
    from the enemy. With sure instinct he marked a central enemy bunker as the key
    to success. Quickly instructing his men to concentrate their fire on the bunker,
    and in spite of his wound, 1st Lt. Poxon crawled toward the bunker, readied a
    hand grenade and charged. He was hit again but continued his assault. After succeeding
    in silencing the enemy guns in the bunker he was struck once again by enemy fire
    and fell, mortally wounded. 1st Lt. Poxon's comrades followed their leader, pressed
    the attack and drove the enemy from their positions. 1st Lt. Poxon's gallantry,
    indomitable will, and courage are in keeping with the highest traditions of the
    military service and reflect great credit upon himself, his unit, and the U.S.
    Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 6
  day: 2
  year: 1969
  title: Specialist Fourth Class Joseph G. Lapointe, Jr. earns Medal of Honor (posthumous)
  body: "<p>On June 2, 1969, Specialist Fourth Class Joseph G. Lapointe, Jr., of Headquarters
    and Headquarters Troop, 2d Squadron, was serving as a medical aidman during a
    combat helicopter assault mission. His patrol was advancing from the landing zone
    through an adjoining valley when it encountered heavy automatic weapons fire from
    a large enemy force entrenched in well fortified bunker positions. In the initial
    fire, 2 soldiers in the formation vanguard were seriously wounded.</p><p>Hearing
    a call for aid from one of them, Lapointe ran forward through heavy fire. To reach
    the wounded men he had to crawl directly in view of an enemy bunker. As his unit
    tried to provide covering fire, he administered first aid to one man while shielding
    the other with his body. A burst of fire from the bunker hit him while he was
    treating the soldier. Despite his wounds he continued until he was wounded again
    and knocked to the ground, then moved back into a shielding position to continue
    first aid. An exploding enemy grenade mortally wounded all 3 men.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Joseph G. Lapointe, Jr. (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sp4c. Lapointe, Headquarters and Headquarters
    Troop, 2d Squadron, distinguished himself while serving as a medical aidman during
    a combat helicopter assault mission. Sp4c. Lapointe's patrol was advancing from
    the landing zone through an adjoining valley when it suddenly encountered heavy
    automatic weapons fire from a large enemy force entrenched in well fortified bunker
    positions. In the initial hail of fire, 2 soldiers in the formation vanguard were
    seriously wounded. Hearing a call for aid from 1 of the wounded, Sp4c. Lapointe
    ran forward through heavy fire to assist his fallen comrades. To reach the wounded
    men, he was forced to crawl directly in view of an enemy bunker. As members of
    his unit attempted to provide covering fire, he administered first aid to 1 man,
    shielding the other with his body. He was hit by a burst of fire from the bunker
    while attending the wounded soldier. In spite of his painful wounds, Sp4c. Lapointe
    continued his lifesaving duties until he was again wounded and knocked to the
    ground. Making strenuous efforts, he moved back again into a shielding position
    to continue administering first aid. An exploding enemy grenade mortally wounded
    all 3 men. Sp4c. Lapointe's courageous actions at the cost of his life were an
    inspiration to his comrades. His gallantry and selflessness are in the highest
    traditions of the military service and reflect great credit on him, his unit,
    and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 6
  day: 15
  year: 1969
  title: Lieutenant Commander Thomas G. Kelley earns Medal of Honor
  body: "<p>On June 15, 1969, Lieutenant Commander (then Lieutenant) Thomas G. Kelley,
    commander of River Assault Division 152, was in charge of a column of 8 river
    assault craft extracting a company of U.S. Army infantry troops on the east bank
    of the Ong Muong Canal in Kien Hoa province. One of the armored troop carriers
    reported a mechanical failure of a loading ramp, and at about the same time Viet
    Cong forces opened fire from the opposite bank. Kelley ordered the crippled carrier
    to raise its ramp manually and the remaining boats to form a protective cordon
    around it, then maneuvered his monitor to the exposed side of the cordon, in direct
    line with the enemy's fire, and opened fire.</p><p>An enemy rocket scored a direct
    hit on the coxswain's flat, and Kelley was hurled to the deck with serious head
    wounds. Unable to speak clearly into the radio, he relayed his commands through
    one of his men until the enemy attack was silenced and the boats moved to safety.
    He was then medically evacuated by helicopter.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Thomas G. Kelley (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty in the afternoon while serving as commander of River
    Assault Division 152 during combat operations against enemy aggressor forces.
    Lt. Comdr. (then Lt.) Kelley was in charge of a column of 8 river assault craft
    which were extracting 1 company of U.S. Army infantry troops on the east bank
    of the Ong Muong Canal in Kien Hoa province, when 1 of the armored troop carriers
    reported a mechanical failure of a loading ramp. At approximately the same time,
    Viet Cong forces opened fire from the opposite bank of the canal. After issuing
    orders for the crippled troop carrier to raise its ramp manually, and for the
    remaining boats to form a protective cordon around the disabled craft, Lt. Comdr.
    Kelley realizing the extreme danger to his column and its inability to clear the
    ambush site until the crippled unit was repaired, boldly maneuvered the monitor
    in which he was embarked to the exposed side of the protective cordon in direct
    line with the enemy's fire, and ordered the monitor to commence firing. Suddenly,
    an enemy rocket scored a direct hit on the coxswain's flat, the shell penetrating
    the thick armor plate, and the explosion spraying shrapnel in all directions.
    Sustaining serious head wounds from the blast, which hurled him to the deck of
    the monitor, Lt. Cmdr. Kelley disregarded his severe injuries and attempted to
    continue directing the other boats. Although unable to move from the deck or to
    speak clearly into the radio, he succeeded in relaying his commands through 1
    of his men until the enemy attack was silenced and the boats were able to move
    to an area of safety. Lt. Comdr. Kelley's brilliant leadership, bold initiative,
    and resolute determination served to inspire his men and provide the impetus needed
    to carry out the mission after he was medically evacuated by helicopter. His extraordinary
    courage under fire, and his selfless devotion to duty sustain and enhance the
    finest traditions of the U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 6
  day: 27
  year: 1969
  title: Staff Sergeant Hammett L. Bowen, Jr. earns Medal of Honor (posthumous)
  body: "<p>On June 27, 1969, Staff Sergeant Hammett L. Bowen, Jr., was serving as
    a platoon sergeant during combat operations in Binh Duong Province, Republic of
    Vietnam. His platoon was advancing on a reconnaissance mission into enemy controlled
    terrain when it came under the crossfire of small arms and grenades from an enemy
    ambush force. Bowen placed heavy suppressive fire on the enemy positions and ordered
    his men to fall back.</p><p>As the platoon was moving back, an enemy grenade was
    thrown amid Bowen and 3 of his men. He shouted a warning to his men and hurled
    himself on the grenade, absorbing the explosion with his body and saving the lives
    of his fellow soldiers. The citation records that his actions came at the cost
    of his life.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Hammett L. Bowen, Jr. (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: S/Sergeant. Bowen distinguished himself while serving as a platoon
    sergeant during combat operations in Binh Duong Province, Republic of Vietnam.
    S/Sergeant. Bowen's platoon was advancing on a reconnaissance mission into enemy
    controlled terrain when it came under the withering crossfire of small arms and
    grenades from an enemy ambush force. S/Sergeant. Bowen placed heavy suppressive
    fire on the enemy positions and ordered his men to fall back. As the platoon was
    moving back, an enemy grenade was thrown amid S/Sergeant. Bowen and 3 of his men.
    Sensing the danger to his comrades, S/Sergeant. Bowen shouted a warning to his
    men and hurled himself on the grenade, absorbing the explosion with his body while
    saving the lives of his fellow soldiers. S/Sergeant. Bowen's extraordinary courage
    and concern for his men at the cost of his life served as an inspiration to his
    comrades and are in the highest traditions of the military service and the U.S.
    Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 7
  day: 3
  year: 1969
  title: Corporal Michael Fleming Folland earns Medal of Honor (posthumous)
  body: "<p>On July 3, 1969, Corporal Michael Fleming Folland, an ammunition bearer
    with the weapons platoon of Company D, was on a reconnaissance patrol in dense
    jungle when it was caught in crossfire from fortified and concealed enemy ambush
    positions. The heavy weapons could not be used in the cramped fighting area, so
    Folland dropped his recoilless rifle ammunition and ran forward to join his commander
    in an assault on the enemy bunkers. The assaulting force was pinned down by machine
    gun fire directly in front of the bunkers.</p><p>Folland stood up to draw enemy
    fire and place suppressive fire on the enemy positions while his commander tried
    to destroy the machine gun positions with grenades. An enemy grenade landed in
    the position; Folland alerted his comrades and his commander hurled it away. When
    a second enemy grenade landed in the position, Folland again shouted a warning.
    With no one able to reach it before it exploded, he threw himself on the grenade.
    He was mortally wounded by the explosion and saved the lives of his comrades.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Michael Fleming Folland (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Corporal. Folland distinguished himself
    while serving as an ammunition bearer with the weapons platoon of Company D, during
    a reconnaissance patrol mission. As the patrol was moving through a dense jungle
    area, it was caught in an intense crossfire from heavily fortified and concealed
    enemy ambush positions. As the patrol reacted to neutralize the ambush, it became
    evident that the heavy weapons could not be used in the cramped fighting area.
    Corporal. Folland dropped his recoilless rifle ammunition, and ran forward to
    join his commander in an assault on the enemy bunkers. The assaulting force moved
    forward until it was pinned down directly in front of the heavily fortified bunkers
    by machine gun fire. Corporal. Folland stood up to draw enemy fire on himself
    and to place suppressive fire on the enemy positions while his commander attempted
    to destroy the machine gun positions with grenades. Before the officer could throw
    a grenade, an enemy grenade landed in the position. Corporal. Folland alerted
    his comrades and his commander hurled the grenade from the position. When a second
    enemy grenade landed in the position, Corporal. Folland again shouted a warning
    to his fellow soldiers. Seeing that no one could reach the grenade and realizing
    that it was about to explode, Corporal. Folland, with complete disregard for his
    safety, threw himself on the grenade. By his dauntless courage, Corporal. Folland
    saved the lives of his comrades although he was mortally wounded by the explosion.
    Corporal. Folland's extraordinary heroism, at the cost of his life, was in keeping
    with the highest traditions of the military service and reflects great credit
    upon himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 7
  day: 3
  year: 1969
  title: Specialist Fourth Class Michael R. Blanchfield earns Medal of Honor (posthumous)
  body: "<p>On July 3, 1969, Specialist Fourth Class Michael R. Blanchfield, a rifleman
    in Company A, was on a combat patrol that surrounded a group of houses to search
    for suspects. During the search of one of the huts, a man ran out toward a nearby
    tree line. Blanchfield, on guard outside the hut, shouted for him to halt and
    began firing when the man ignored the warning and kept running. The suspect threw
    a grenade toward the hut and its occupants. The explosion severely wounded Blanchfield
    and several others, but he regained his feet to continue the pursuit.</p><p>The
    fleeing enemy threw a second grenade, which landed near Blanchfield and several
    members of his patrol. He shouted a warning to his comrades and threw himself
    on the grenade, absorbing the full and fatal impact of the explosion. The citation
    credits him with saving the lives of and preventing injury to 4 members of the
    patrol and several Vietnamese civilians in the immediate area.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Michael R. Blanchfield (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sp4c. Blanchfield distinguished himself
    while serving as a rifleman in Company A on a combat patrol. The patrol surrounded
    a group of houses to search for suspects. During the search of 1 of the huts,
    a man suddenly ran out toward a nearby tree line. Sp4c. Blanchfield, who was on
    guard outside the hut, saw the man, shouted for him to halt, and began firing
    at him as the man ignored the warning and continued to run. The suspect suddenly
    threw a grenade toward the hut and its occupants. Although the exploding grenade
    severely wounded Sp4c. Blanchfield and several others, he regained his feet to
    continue the pursuit of the enemy. The fleeing enemy threw a second grenade which
    landed near Sp4c. Blanchfield and several members of his patrol. Instantly realizing
    the danger, he shouted a warning to his comrades. Sp4c. Blanchfield unhesitatingly
    and with complete disregard for his safety, threw himself on the grenade, absorbing
    the full and fatal impact of the explosion. By his gallant action and self-sacrifice,
    he was able to save the lives and prevent injury to 4 members of the patrol and
    several Vietnamese civilians in the immediate area. Sp4c. Blanchfield's extraordinary
    courage and gallantry at the cost of his life above and beyond the call of duty
    are in keeping with the highest traditions of the military service and reflect
    great credit upon himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 7
  day: 11
  year: 1969
  title: Sergeant (then Sp4c.) Gordon R. Roberts earns Medal of Honor
  body: "<p>On July 11, 1969, Sergeant Gordon R. Roberts was serving as a rifleman
    in Company B during combat operations. His platoon was maneuvering along a ridge
    to attack heavily fortified enemy bunker positions that had pinned down an adjoining
    friendly company. As the platoon approached, it was pinned down by heavy automatic
    weapons and grenade fire from camouflaged fortifications atop the overlooking
    hill.</p><p>Roberts crawled toward the closest enemy bunker, then leaped to his
    feet and charged it, firing as he ran, and silenced the 2-man bunker. He continued
    alone against a second bunker; when a burst of enemy fire knocked his rifle from
    his hands, he picked up a rifle dropped by a comrade and silenced that bunker
    too. He destroyed a third bunker with hand grenades. Now cut off from his platoon,
    he assaulted a fourth enemy emplacement and fought through heavy fire to join
    elements of the adjoining company. While still exposed to hostile fire, he helped
    move wounded personnel from the hilltop to an evacuation area before returning
    to his unit.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Gordon R. Roberts (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sergeant. Roberts distinguished himself
    while serving as a rifleman in Company B, during combat operations. Sergeant.
    Roberts' platoon was maneuvering along a ridge to attack heavily fortified enemy
    bunker positions which had pinned down an adjoining friendly company. As the platoon
    approached the enemy positions, it was suddenly pinned down by heavy automatic
    weapons and grenade fire from camouflaged enemy fortifications atop the overlooking
    hill. Seeing his platoon immobilized and in danger of failing in its mission,
    Sergeant. Roberts crawled rapidly toward the closest enemy bunker. With complete
    disregard for his safety, he leaped to his feet and charged the bunker, firing
    as he ran. Despite the intense enemy fire directed at him, Sergeant. Roberts silenced
    the 2-man bunker. Without hesitation, Sergeant. Roberts continued his l-man assault
    on a second bunker. As he neared the second bunker, a burst of enemy fire knocked
    his rifle from his hands. Sergeant. Roberts picked up a rifle dropped by a comrade
    and continued his assault, silencing the bunker. He continued his charge against
    a third bunker and destroyed it with well-thrown hand grenades. Although Sergeant.
    Roberts was now cut off from his platoon, he continued his assault against a fourth
    enemy emplacement. He fought through a heavy hail of fire to join elements of
    the adjoining company which had been pinned down by the enemy fire. Although continually
    exposed to hostile fire, he assisted in moving wounded personnel from exposed
    positions on the hilltop to an evacuation area before returning to his unit. By
    his gallant and selfless actions, Sergeant. Roberts contributed directly to saving
    the lives of his comrades and served as an inspiration to his fellow soldiers
    in the defeat of the enemy force. Sergeant. Roberts' extraordinary heroism in
    action at the risk of his life were in keeping with the highest traditions of
    the military service and reflect great credit upon himself, his unit, and the
    U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 7
  day: 18
  year: 1969
  title: Sergeant Rodney J. Evans earns Medal of Honor (posthumous)
  body: "<p>On July 18, 1969, Sergeant Rodney J. Evans was serving as a squad leader
    in a reconnaissance sweep through heavy vegetation to reconnoiter a strong enemy
    position. As the force approached a well-defined trail, the platoon scout warned
    that the trail was booby-trapped, and Evans led his squad on a route parallel
    to it. The force had started to move forward when a nearby squad was hit by the
    blast of a concealed mine.</p><p>Looking to his right, Evans saw a second enemy
    device. He shouted a warning to his men, dived to the ground and crawled toward
    the mine. Just as he reached it, an enemy soldier detonated the explosive, and
    Evans absorbed the full impact with his body. He was killed. The citation states
    that his action saved his comrades from probable death or injury.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Rodney J. Evans (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sergeant. Evans distinguished himself
    by extraordinary heroism while serving as a squad leader in a reconnaissance sweep
    through heavy vegetation to reconnoiter a strong enemy position. As the force
    approached a well-defined trail, the platoon scout warned that the trail was booby-trapped.
    Sergeant. Evans led his squad on a route parallel to the trail. The force had
    started to move forward when a nearby squad was hit by the blast of a concealed
    mine. Looking to his right Sergeant. Evans saw a second enemy device. With complete
    disregard for his safety he shouted a warning to his men, dived to the ground
    and crawled toward the mine. Just as he reached it an enemy soldier detonated
    the explosive and Sergeant. Evans absorbed the full impact with his body. His
    gallant and selfless action saved his comrades from probable death or injury and
    served as an inspiration to his entire unit. Sergeant. Evans' gallantry in action
    at the cost of his life were in keeping with the highest traditions of the military
    service and reflect great credit upon himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 7
  day: 19
  year: 1969
  title: Staff Sergeant John G. Gertsch earns Medal of Honor (posthumous)
  body: "<p>On July 19, 1969, Staff Sergeant John G. Gertsch was serving as a platoon
    sergeant and platoon leader during combat operations in the A Shau Valley. Early
    in an operation to seize a strongly defended enemy position, his platoon leader
    was seriously wounded and lay exposed to intense enemy fire. Gertsch rushed to
    him, dragged him to a sheltered position, then assumed command of the heavily
    engaged platoon and led a counterattack that forced the enemy to withdraw. Later,
    when a small reconnoitering element of his unit was attacked, he moved forward
    and charged, firing as he advanced; the enemy withdrew in confusion and 2 wounded
    men were recovered.</p><p>Later the platoon was attacked with automatic weapons,
    grenade, and rocket fire. Gertsch was severely wounded but continued to command.
    Moving under fire, he saw an aidman treating a wounded officer from an adjacent
    unit and, with both in imminent danger, positioned himself between them and the
    enemy. While the wounded officer was being moved to safety, Gertsch was mortally
    wounded by enemy fire.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, John G. Gertsch (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: S/Sergeant. Gertsch distinguished himself while serving as a platoon
    sergeant and platoon leader during combat operations in the A Shau Valley. During
    the initial phase of an operation to seize a strongly defended enemy position,
    S/Sergeant. Gertsch's platoon leader was seriously wounded and lay exposed to
    intense enemy fire. Forsaking his own safety, without hesitation S/Sergeant. Gertsch
    rushed to aid his fallen leader and dragged him to a sheltered position. He then
    assumed command of the heavily engaged platoon and led his men in a fierce counterattack
    that forced the enemy to withdraw. Later, a small element of S/Sergeant. Gertsch's
    unit was reconnoitering when attacked again by the enemy. S/Sergeant. Gertsch
    moved forward to his besieged element and immediately charged, firing as he advanced.
    His determined assault forced the enemy troops to withdraw in confusion and made
    possible the recovery of 2 wounded men who had been exposed to heavy enemy fire.
    Sometime later his platoon came under attack by an enemy force employing automatic
    weapons, grenade, and rocket fire. S/Sergeant. Gertsch was severely wounded during
    the onslaught but continued to command his platoon despite his painful wound.
    While moving under fire and encouraging his men he sighted an aidman treating
    a wounded officer from an adjacent unit. Realizing that both men were in imminent
    danger of being killed, he rushed forward and positioned himself between them
    and the enemy nearby. While the wounded officer was being moved to safety S/Sergeant.
    Gertsch was mortally wounded by enemy fire. Without S/Sergeant. Gertsch's courage,
    ability to inspire others, and profound concern for the welfare of his men, the
    loss of life among his fellow soldiers would have been significantly greater.
    His conspicuous gallantry, extraordinary heroism, and intrepidity at the cost
    of his life, above and beyond the call of duty, are in the highest traditions
    of the U.S. Army and reflect great credit on him and the Armed Forces of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 8
  day: 7
  year: 1969
  title: Private First Class Bruce W. Carter earns Medal of Honor (posthumous)
  body: "<p>On August 7, 1969, Private First Class Bruce W. Carter, a grenadier with
    Company H, was with his unit maneuvering against the enemy during Operation Idaho
    Canyon when it came under a heavy volume of fire from a numerically superior hostile
    force. The lead element became separated from the main body of the squad by a
    brush fire. Carter and his fellow marines were pinned down by crossfire when he
    stood in full view of the North Vietnamese Army soldiers and delivered a heavy
    volume of fire at their positions, causing several enemy casualties and forcing
    the rest to retreat from the immediate area.</p><p>Shouting directions to the
    marines around him, Carter began leading them out of the path of the rapidly approaching
    brush fire when he saw a hostile grenade land between him and his companions.
    To protect the men following him, he threw himself over the grenade and absorbed
    the full effects of its detonation with his body. He was killed.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Bruce W. Carter (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as grenadier with Company H in connection
    with combat operations against the enemy. Private First Class Carter's unit was
    maneuvering against the enemy during Operation Idaho Canyon and came under a heavy
    volume of fire from a numerically superior hostile force. The lead element soon
    became separated from the main body of the squad by a brush fire. Private First
    Class Carter and his fellow marines were pinned down by vicious crossfire when,
    with complete disregard for his safety, he stood in full view of the North Vietnamese
    Army soldiers to deliver a devastating volume of fire at their positions. The
    accuracy and aggressiveness of his attack caused several enemy casualties and
    forced the remainder of the soldiers to retreat from the immediate area. Shouting
    directions to the marines around him, Private First Class Carter then commenced
    leading them from the path of the rapidly approaching brush fire when he observed
    a hostile grenade land between him and his companions. Fully aware of the probable
    consequences of his action but determined to protect the men following him, he
    unhesitatingly threw himself over the grenade, absorbing the full effects of its
    detonation with his body. Private First Class Carter's indomitable courage, inspiring
    initiative, and selfless devotion to duty upheld the highest traditions of the
    Marine Corps and the U.S. Naval Service. He gallantly gave his life in the service
    of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 8
  day: 12
  year: 1969
  title: Specialist Four Leonard L. Alvarado earns Medal of Honor (posthumous)
  body: "<p>On August 12, 1969, Specialist Four Leonard L. Alvarado, a Rifleman with
    Company D, 2d Battalion, 12th Cavalry, 1st Cavalry Division (Airmobile), was moving
    with a small reaction force through dense jungle in Phuoc Long Province, Republic
    of Vietnam, toward a beleaguered friendly platoon. He detected enemy movement
    and opened fire, but the hostile force soon pinned down the reaction force and
    blocked the path to the trapped platoon. Alvarado moved forward through machinegun
    fire to engage the enemy. An enemy grenade exploded nearby, wounding and stunning
    him; he killed the grenadier just as another barrage wounded him again.</p><p>He
    crawled forward through the fire to pull several comrades back inside the hastily
    formed perimeter. Realizing his element needed to break away from the hostile
    force, he advanced alone, firing as he went, though repeatedly thrown to the ground
    by exploding satchel charges. He silenced several emplacements, including an enemy
    machinegun position, and kept up suppressive fire from his forward position. After
    the enemy broke contact, his comrades found that he had died of his wounds.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Leonard L. Alvarado (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: 'For conspicuous gallantry and intrepidity at the risk of his life
    above and beyond the call of duty: Specialist Four Leonard L. Alvarado distinguished
    himself by acts of gallantry and intrepidity above and beyond the call of duty
    while serving as a Rifleman with Company D, 2d Battalion, 12th Cavalry, 1st Cavalry
    Division (Airmobile) during combat operations against an armed enemy in Phuoc
    Long Province, Republic of Vietnam on August 12, 1969. On that day, as Specialist
    Four Alvarado and a small reaction force moved through dense jungle en route to
    a beleaguered friendly platoon, Specialist Four Alvarado detected enemy movement
    and opened fire. Despite his quick reaction, Specialist Four Alvarado and his
    comrades were soon pinned down by the hostile force that blocked the path to the
    trapped platoon. Specialist Four Alvarado quickly moved forward through the hostile
    machinegun fire in order to engage the enemy troops. Suddenly, an enemy grenade
    exploded nearby, wounding and momentarily stunning him. Retaliating immediately,
    he killed the grenadier just as another enemy barrage wounded him again. Specialist
    Four Alvarado crawled forward through the fusillade to pull several comrades back
    within the hastily-formed perimeter. Realizing his element needed to break away
    from the hostile force, Specialist Four Alvarado began maneuvering forward alone.
    Though repeatedly thrown to the ground by exploding satchel charges, he continued
    advancing and firing, silencing several emplacements, including one enemy machinegun
    position. From his dangerous forward position, he persistently laid suppressive
    fire on the hostile forces, and after the enemy troops had broken contact, his
    comrades discovered that he had succumbed to his wounds. Specialist Four Alvarado’s
    extraordinary heroism and selflessness at the cost of his own life, above and
    beyond the call of duty, are in keeping with the highest traditions of military
    service and reflect great credit upon himself, his unit and the United States
    Army. Citation represents Soldier''s rank at time of action. For more information
    on Specialist Four Leonard L. Alvarado visit: www.army.mil/medalofhonor/valor24/recipients/alvarado/'
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 8
  day: 24
  year: 1969
  title: Lance Corporal Richard A. Anderson earns Medal of Honor (posthumous)
  body: "<p>On August 24, 1969, Lance Corporal Richard A. Anderson, an assistant team
    leader with Company E, was on a patrol in the early morning hours when his reconnaissance
    team came under a heavy volume of automatic weapons and machine gun fire from
    a numerically superior and well concealed enemy force. Wounded in both legs and
    knocked to the ground in the first moments of the fight, Anderson took a prone
    position and kept up intense suppressive fire to repulse the attackers. He was
    wounded a second time by an enemy soldier who had approached to within 8 feet
    of the team's position, and he continued firing at the assaulting unit while a
    companion treated his leg wounds.</p><p>When an enemy grenade landed between him
    and the other marine, Anderson rolled over and covered it with his body, absorbing
    the full effects of the detonation. He was killed. The citation credits him with
    saving several marines from serious injury or possible death.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Richard A. Anderson (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as an assistant team leader with Company
    E, in connection with combat operations against an armed enemy. While conducting
    a patrol during the early morning hours L/Corporal. Anderson's reconnaissance
    team came under a heavy volume of automatic weapons and machine gun fire from
    a numerically superior and well concealed enemy force. Although painfully wounded
    in both legs and knocked to the ground during the initial moments of the fierce
    fire fight, L/Corporal. Anderson assumed a prone position and continued to deliver
    intense suppressive fire in an attempt to repulse the attackers. Moments later
    he was wounded a second time by an enemy soldier who had approached to within
    8 feet of the team's position. Undaunted, he continued to pour a relentless stream
    of fire at the assaulting unit, even while a companion was treating his leg wounds.
    Observing an enemy grenade land between himself and the other marine, L/Corporal.
    Anderson immediately rolled over and covered the lethal weapon with his body,
    absorbing the full effects of the detonation. By his indomitable courage, inspiring
    initiative, and selfless devotion to duty, L/Corporal. Anderson was instrumental
    in saving several marines from serious injury or possible death. His actions were
    in keeping with the highest traditions of the Marine Corps and of the U.S. Naval
    Service. He gallantly gave his life in the service of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 8
  day: 28
  year: 1969
  title: Lance Corporal Jose Francisco Jimenez earns Medal of Honor (posthumous)
  body: "<p>On August 28, 1969, Lance Corporal Jose Francisco Jimenez, a fire team
    leader with Company K, was with his unit when it came under heavy attack by North
    Vietnamese soldiers concealed in well camouflaged emplacements. Jimenez seized
    the initiative and plunged forward toward the enemy positions, destroying several
    enemy personnel and silencing an antiaircraft weapon. Shouting encouragement to
    his companions, he kept moving forward and maneuvered to within 10 feet of hostile
    soldiers firing automatic weapons from a trench, then destroyed the position under
    heavy enemy fire.</p><p>By then he was the target of concentrated fire from hostile
    gunners trying to halt his assault, but he continued to press forward. As he moved
    to attack another enemy soldier, he was mortally wounded.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Jose Francisco Jimenez (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a fire team leader with Company K,
    in operations against the enemy. L/Corporal. Jimenez' unit came under heavy attack
    by North Vietnamese soldiers concealed in well camouflaged emplacements. L/Corporal.
    Jimenez reacted by seizing the initiative and plunging forward toward the enemy
    positions. He personally destroyed several enemy personnel and silenced an antiaircraft
    weapon. Shouting encouragement to his companions, L/Corporal. Jimenez continued
    his aggressive forward movement. He slowly maneuvered to within 10 feet of hostile
    soldiers who were firing automatic weapons from a trench and, in the face of vicious
    enemy fire, destroyed the position. Although he was by now the target of concentrated
    fire from hostile gunners intent upon halting his assault, L/Corporal. Jimenez
    continued to press forward. As he moved to attack another enemy soldier, he was
    mortally wounded. L/Corporal. Jimenez' indomitable courage, aggressive fighting
    spirit and unfaltering devotion to duty upheld the highest traditions of the Marine
    Corps and of the U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 9
  day: 1
  year: 1969
  title: Sergeant First Class Jose Rodela earns Medal of Honor
  body: "<p>On September 1, 1969, Sergeant First Class Jose Rodela was serving as
    company commander, Detachment B-36, Company A, 5th Special Forces Group (Airborne),
    1st Special Forces, in Phuoc Long Province, Republic of Vietnam. That afternoon
    his battalion came under an intense barrage of mortar, rocket, and machine gun
    fire. Under the enemy fire, Rodela began placing his men into defensive positions
    to prevent the enemy from overrunning the entire battalion.</p><p>Repeatedly exposing
    himself to enemy fire, he moved from position to position, providing suppressing
    fire and assisting the wounded. While recovering a wounded comrade he was himself
    wounded in the back and head by a B-40 rocket. Alone, he then assaulted and knocked
    out the B-40 rocket position before returning to the battalion's perimeter.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Jose Rodela (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: 'For conspicuous gallantry and intrepidity at the risk of his life
    above and beyond the call of duty: Sergeant First Class Jose Rodela distinguished
    himself by acts of gallantry and intrepidity above and beyond the call of duty
    while serving as the company commander, Detachment B-36, Company A, 5th Special
    Forces Group (Airborne), 1st Special Forces during combat operations against an
    armed enemy in Phuoc Long Province, Republic of Vietnam on September 1, 1969.
    That afternoon, Sergeant First Class Rodela’s battalion came under an intense
    barrage of mortar, rocket, and machine gun fire. Ignoring the withering enemy
    fire, Sergeant First Class Rodela immediately began placing his men into defensive
    positions to prevent the enemy from overrunning the entire battalion. Repeatedly
    exposing himself to enemy fire, Sergeant First Class Rodela moved from position
    to position, providing suppressing fire and assisting wounded, and was himself
    wounded in the back and head by a B-40 rocket while recovering a wounded comrade.
    Alone, Sergeant First Class Rodela assaulted and knocked out the B-40 rocket position
    before successfully returning to the battalion’s perimeter. Sergeant First Class
    Rodela’s extraordinary heroism and selflessness above and beyond the call of duty
    are in keeping with the highest traditions of military service and reflect great
    credit upon himself, his unit and the United States Army. Citation represents
    Soldier''s rank at time of action. For more information on Master Sergeant Jose
    Rodela visit: https://www.army.mil/medalofhonor/valor24/recipients/rodela/'
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 9
  day: 4
  year: 1969
  title: Rear Admiral (then Captain) James B. Stockdale earns Medal of Honor
  body: "<p>On September 4, 1969, Rear Admiral (then Captain) James B. Stockdale was
    the senior naval officer in the Prisoner of War camps of North Vietnam. His captors
    recognized him as the leader of the prisoners' resistance to interrogation and
    of their refusal to take part in propaganda exploitation, and after he was detected
    in a covert communications attempt he was singled out for interrogation and torture.
    His earlier efforts at self-disfiguration, meant to dissuade his captors from
    using him for propaganda, had brought cruel and agonizing punishment.</p><p>Sensing
    the start of another purge, Stockdale resolved to make himself a symbol of resistance
    regardless of personal sacrifice. He deliberately inflicted a near-mortal wound
    on himself to convince his captors that he would give up his life rather than
    capitulate. The North Vietnamese discovered and revived him and, convinced of
    his resolve, abated their excessive harassment and torture toward all of the Prisoners
    of War.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, James B. Stockdale (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while senior naval officer in the Prisoner of War
    camps of North Vietnam. Recognized by his captors as the leader in the Prisoners'
    of War resistance to interrogation and in their refusal to participate in propaganda
    exploitation, Rear Adm. Stockdale was singled out for interrogation and attendant
    torture after he was detected in a covert communications attempt. Sensing the
    start of another purge, and aware that his earlier efforts at self-disfiguration
    to dissuade his captors from exploiting him for propaganda purposes had resulted
    in cruel and agonizing punishment, Rear Adm. Stockdale resolved to make himself
    a symbol of resistance regardless of personal sacrifice. He deliberately inflicted
    a near-mortal wound to his person in order to convince his captors of his willingness
    to give up his life rather than capitulate. He was subsequently discovered and
    revived by the North Vietnamese who, convinced of his indomitable spirit, abated
    in their employment of excessive harassment and torture toward all of the Prisoners
    of War. By his heroic action, at great peril to himself, he earned the everlasting
    gratitude of his fellow prisoners and of his country. Rear Adm. Stockdale's valiant
    leadership and extraordinary courage in a hostile environment sustain and enhance
    the finest traditions of the U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 9
  day: 14
  year: 1969
  title: Sergeant Donald Sidney Skidgel earns Medal of Honor (posthumous)
  body: "<p>On September 14, 1969, Sergeant Donald Sidney Skidgel, a reconnaissance
    section leader in Troop D, was on a road near Song Be, acting with his troop as
    a convoy security and screening force, when contact occurred with an estimated
    enemy battalion concealed in tall grass and bunkers bordering the road. Skidgel
    moved off the road and placed machinegun fire on the enemy automatic weapons and
    rocket-propelled grenade positions. After silencing at least 1 position, he carried
    his machinegun 60 meters across bullet-swept ground and continued to rake the
    enemy, then returned to his vehicle for ammunition.</p><p>Alerted that the command
    element was under intense fire, he and his driver advanced along the fire-swept
    road toward the command group to draw the enemy fire onto himself, silencing several
    positions with his machinegun. A rocket-propelled grenade explosion knocked him
    onto the rear fender. He got back to his feet and fired on other enemy positions
    until he was mortally wounded by small arms fire. The command group withdrew to
    a better position without casualties.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Donald Sidney Skidgel (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sergeant. Skidgel distinguished himself
    while serving as a reconnaissance section leader in Troop D. On a road near Song
    Be in Binh Long Province, Sergeant. Skidgel and his section with other elements
    of his troop were acting as a convoy security and screening force when contact
    occurred with an estimated enemy battalion concealed in tall grass and in bunkers
    bordering the road. Sergeant.Skidgel maneuvered off the road and began placing
    effective machinegun fire on the enemy automatic weapons and rocket-propelled
    grenade positions. After silencing at least 1 position, he ran with his machinegun
    across 60 meters of bullet-swept ground to another location from which he continued
    to rake the enemy positions. Running low on ammunition, he returned to his vehicle
    over the same terrain. Moments later he was alerted that the command element was
    receiving intense automatic weapons, rocket-propelled grenade and mortar fire.
    Although he knew the road was saturated with enemy fire, Sergeant. Skidgel calmly
    mounted his vehicle and with his driver advanced toward the command group in an
    effort to draw the enemy fire onto himself. Despite the hostile fire concentrated
    on him, he succeeded in silencing several enemy positions with his machinegun.
    Moments later Sergeant. Skidgel was knocked down onto the rear fender by the explosion
    of an enemy rocket-propelled grenade. Ignoring his extremely painful wounds, he
    staggered back to his feet and placed effective fire on several other enemy positions
    until he was mortally wounded by hostile small arms fire. His selfless actions
    enabled the command group to withdraw to a better position without casualties
    and inspired the rest of his fellow soldiers to gain fire superiority and defeat
    the enemy. Sergeant. Skidgel's gallantry at the cost of his life were in keeping
    with the highest traditions of the military service and reflect great credit upon
    himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 9
  day: 17
  year: 1969
  title: Staff Sergeant Melvin Morris earns Medal of Honor
  body: "<p>On September 17, 1969, Staff Sergeant Melvin Morris was commanding a Strike
    Force drawn from Company D, 5th Special Forces Group (Airborne), 1st Special Forces,
    near Chi Lang, Republic of Vietnam. That afternoon his companies encountered an
    extensive enemy mine field and were engaged by a hostile force. Learning by radio
    that a fellow team commander had been killed near an enemy bunker, Morris reorganized
    his men for an assault, advanced, and split off with two men to recover the body.
    The hostile force concentrated its fire on the three-man element and wounded both
    men with him.</p><p>After helping the two wounded men back to his lines, Morris
    charged forward into the enemy fire with only his men's suppressive fire as cover.
    He destroyed enemy machine gun emplacements with hand grenades, eliminating four
    bunkers. Reaching the bunker nearest the fallen team commander, he repulsed the
    enemy, retrieved his comrade and began the trek back to friendly lines. He was
    wounded three times as he struggled forward but returned his fallen comrade to
    a friendly position.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Melvin Morris (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: 'For conspicuous gallantry and intrepidity at the risk of his life
    above and beyond the call of duty: Staff Sergeant Melvin Morris distinguished
    himself by acts of gallantry and intrepidity above and beyond the call of duty
    while serving as Commander of a Strike Force drawn from Company D, 5th Special
    Forces Group (Airborne), 1st Special Forces, during combat operations against
    an armed enemy in the vicinity of Chi Lang, Republic of Vietnam on September 17,
    1969. On that afternoon, Staff Sergeant Morris’ affiliated companies encountered
    an extensive enemy mine field and were subsequently engaged by a hostile force.
    Staff Sergeant Morris learned by radio that a fellow team commander had been killed
    near an enemy bunker and he immediately reorganized his men into an effective
    assault posture before advancing forward and splitting off with two men to recover
    the team commander’s body. Observing the maneuver, the hostile force concentrated
    its fire on Staff Sergeant Morris’ three-man element and successfully wounded
    both men accompanying him. After assisting the two wounded men back to his forces’
    lines, Staff Sergeant Morris charged forward into withering enemy fire with only
    his men’s suppressive fire as cover. While enemy machine gun emplacements continuously
    directed strafing fusillades against him, Staff Sergeant Morris destroyed the
    positions with hand grenades and continued his assault, ultimately eliminating
    four bunkers. Upon reaching the bunker nearest the fallen team commander, Staff
    Sergeant Morris repulsed the enemy, retrieved his comrade and began the arduous
    trek back to friendly lines. He was wounded three times as he struggled forward,
    but ultimately succeeded in returning his fallen comrade to a friendly position.
    Staff Sergeant Morris’ extraordinary heroism and selflessness above and beyond
    the call of duty are in keeping with the highest traditions of military service
    and reflect great credit upon himself, his unit, and the United States Army. Citation
    represents Soldier''s rank at time of action. For more information on Sergeant
    First Class Melvin Morris visit: https://www.army.mil/medalofhonor/valor24/recipients/morris/'
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 10
  day: 2
  year: 1969
  title: Chief Warrant Officer Michael J. Novosel earns Medal of Honor
  body: "<p>On October 2, 1969, Chief Warrant Officer Michael J. Novosel of the 82d
    Medical Detachment was commanding a medical evacuation helicopter. He flew into
    a heavily defended enemy training area where wounded Vietnamese soldiers were
    pinned down by a large enemy force. Without gunship or other cover and under intense
    machinegun fire, he located and rescued a wounded soldier. With communications
    to the troops lost, he circled the area at low level under heavy fire so the scattered
    friendly troops would assemble for evacuation. On 6 occasions he and his crew
    were forced out of the area by enemy fire, only to return from another direction
    to land and extract more troops.</p><p>Near the end of the mission he attempted
    to extract a wounded soldier close to an enemy bunker by hovering backward. As
    the man was pulled aboard, enemy automatic weapons opened fire at close range,
    damaged the aircraft and wounded Novosel. He momentarily lost control, recovered,
    and departed under fire. In all he made 15 extractions of wounded personnel, saving
    the lives of 29 soldiers.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Michael J. Novosel (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. CWO Novosel, 82d Medical Detachment,
    distinguished himself while serving as commander of a medical evacuation helicopter.
    He unhesitatingly maneuvered his helicopter into a heavily fortified and defended
    enemy training area where a group of wounded Vietnamese soldiers were pinned down
    by a large enemy force. Flying without gunship or other cover and exposed to intense
    machinegun fire, CWO Novosel was able to locate and rescue a wounded soldier.
    Since all communications with the beleaguered troops had been lost, he repeatedly
    circled the battle area, flying at low level under continuous heavy fire, to attract
    the attention of the scattered friendly troops. This display of courage visibly
    raised their morale, as they recognized this as a signal to assemble for evacuation.
    On 6 occasions he and his crew were forced out of the battle area by the intense
    enemy fire, only to circle and return from another direction to land and extract
    additional troops. Near the end of the mission, a wounded soldier was spotted
    close to an enemy bunker. Fully realizing that he would attract a hail of enemy
    fire, CWO Novosel nevertheless attempted the extraction by hovering the helicopter
    backward. As the man was pulled on aboard, enemy automatic weapons opened fire
    at close range, damaged the aircraft and wounded CWO Novosel. He momentarily lost
    control of the aircraft, but quickly recovered and departed under the withering
    enemy fire. In all, 15 extremely hazardous extractions were performed in order
    to remove wounded personnel. As a direct result of his selfless conduct, the lives
    of 29 soldiers were saved. The extraordinary heroism displayed by CWO Novosel
    was an inspiration to his comrades in arms and reflect great credit on him, his
    unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 11
  day: 12
  year: 1969
  title: Private First Class Ralph E. Dias earns Medal of Honor (posthumous)
  body: "<p>On November 12, 1969, Private First Class Ralph E. Dias was a member of
    a reaction force pinned down by enemy fire while assisting a platoon in the same
    circumstance. Seeing that both units were taking casualties, Dias began an assault
    on an enemy machine gun bunker that was the principal source of hostile fire.
    Severely wounded by enemy snipers while charging across the open area, he pulled
    himself to the shelter of a nearby rock. Moving into the fire a second time, he
    was wounded again.</p><p>Unable to walk, he crawled 15 meters to the protection
    of a rock near his objective and, repeatedly exposing himself to intense hostile
    fire, threw several hand grenades at the machine gun emplacement without destroying
    it. He moved into the open again and was wounded a third time by sniper fire.
    As he threw a last grenade, which destroyed the enemy position, he was mortally
    wounded by another enemy round.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Ralph E. Dias (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: As a member of a reaction force which was pinned down by enemy fire
    while assisting a platoon in the same circumstance, Private First Class Dias,
    observing that both units were sustaining casualties, initiated an aggressive
    assault against an enemy machine gun bunker which was the principal source of
    hostile fire. Severely wounded by enemy snipers while charging across the open
    area, he pulled himself to the shelter of a nearby rock. Braving enemy fire for
    a second time, Private First Class Dias was again wounded. Unable to walk, he
    crawled 15 meters to the protection of a rock located near his objective and,
    repeatedly exposing himself to intense hostile fire, unsuccessfully threw several
    hand grenades at the machine gun emplacement. Still determined to destroy the
    emplacement, Private First Class Dias again moved into the open and was wounded
    a third time by sniper fire. As he threw a last grenade which destroyed the enemy
    position, he was mortally wounded by another enemy round. Private First Class
    Dias' indomitable courage, dynamic initiative, and selfless devotion to duty upheld
    the highest traditions of the Marine Corps and the U.S. Naval Service. He gallantly
    gave his life in the service to his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 11
  day: 29
  year: 1969
  title: Staff Sergeant Robert J. Pruden earns Medal of Honor (posthumous)
  body: "<p>On November 29, 1969, Staff Sergeant Robert J. Pruden of Company G led
    a 6-man reconnaissance team inserted by helicopter into enemy controlled territory
    to establish an ambush and report enemy movements. Pruden deployed his men in
    2 groups on opposite sides of a well used trail. While the groups were setting
    up, one member of the team was trapped in the open by heavy fire from an enemy
    squad. With the ambush compromised, Pruden directed his team to open fire, and
    it then came under heavy fire from a second enemy element.</p><p>Pruden left his
    concealed position and, firing as he ran, advanced toward the enemy to draw the
    hostile fire. He was seriously wounded twice but continued his attack until he
    fell for a third time, in front of the enemy positions. His attack caused several
    enemy casualties and the withdrawal of the remaining enemy force. Though grievously
    wounded, he directed his men into defensive positions and called for evacuation
    helicopters, which withdrew the team. His wounds cost him his life.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Robert J. Pruden (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. S/Sergeant. Pruden, Company G, distinguished
    himself while serving as a reconnaissance team leader during an ambush mission.
    The 6-man team was inserted by helicopter into enemy controlled territory to establish
    an ambush position and to obtain information concerning enemy movements. As the
    team moved into the preplanned area, S/Sergeant. Pruden deployed his men into
    2 groups on the opposite sides of a well used trail. As the groups were establishing
    their defensive positions, 1 member of the team was trapped in the open by the
    heavy fire from an enemy squad. Realizing that the ambush position had been compromised,
    S/Sergeant. Pruden directed his team to open fire on the enemy force. Immediately,
    the team came under heavy fire from a second enemy element. S/Sergeant. Pruden,
    with full knowledge of the extreme danger involved, left his concealed position
    and, firing as he ran, advanced toward the enemy to draw the hostile fire. He
    was seriously wounded twice but continued his attack until he fell for a third
    time, in front of the enemy positions. S/Sergeant. Pruden's actions resulted in
    several enemy casualties and withdrawal of the remaining enemy force. Although
    grievously wounded, he directed his men into defensive positions and called for
    evacuation helicopters, which safely withdrew the members of the team. S/Sergeant.
    Pruden's outstanding courage, selfless concern for the welfare of his men, and
    intrepidity in action at the cost of his life were in keeping with the highest
    traditions of the military service and reflect great credit upon himself, his
    unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 12
  day: 2
  year: 1969
  title: Second Lieutenant Robert Ronald Leisy earns Medal of Honor (posthumous)
  body: "<p>On December 2, 1969, Second Lieutenant Robert Ronald Leisy, Infantry,
    Company B, was serving as platoon leader on a reconnaissance mission. One of his
    patrols became heavily engaged by fire from a numerically superior enemy force
    in a well-entrenched bunker complex. As Leisy deployed the rest of his platoon
    to rescue the patrol, the platoon came under intense fire from the front and both
    flanks. He moved from position to position deploying his men to engage the enemy.
    Accompanied by his radio operator, he moved to the front and spotted an enemy
    sniper in a tree in the act of firing a rocket-propelled grenade at them.</p><p>With
    no time to escape the grenade or shout a warning, Leisy shielded the radio operator
    with his body and absorbed the full impact of the explosion, saving the operator's
    life and protecting nearby men of his platoon from serious injury. Despite his
    mortal wounds, he continued to direct the platoon's fire, and when medical aid
    arrived he refused attention until the other seriously wounded were treated. The
    platoon withdrew without further casualties.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Robert Ronald Leisy (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. 2d Lt. Leisy, Infantry, Company B,
    distinguished himself while serving as platoon leader during a reconnaissance
    mission. One of his patrols became heavily engaged by fire from a numerically
    superior enemy force located in a well-entrenched bunker complex. As 2d Lt. Leisy
    deployed the remainder of his platoon to rescue the beleaguered patrol, the platoon
    also came under intense enemy fire from the front and both flanks. In complete
    disregard for his safety, 2d Lt. Leisy moved from position to position deploying
    his men to effectively engage the enemy. Accompanied by his radio operator he
    moved to the front and spotted an enemy sniper in a tree in the act of firing
    a rocket-propelled grenade at them. Realizing there was neither time to escape
    the grenade nor shout a warning, 2d Lt. Leisy unhesitatingly, and with full knowledge
    of the consequences, shielded the radio operator with his body and absorbed the
    full impact of the explosion. This valorous act saved the life of the radio operator
    and protected other men of his platoon who were nearby from serious injury. Despite
    his mortal wounds, 2d Lt. Leisy calmly and confidently continued to direct the
    platoon's fire. When medical aid arrived, 2d Lt. Leisy valiantly refused attention
    until the other seriously wounded were treated. His display of extraordinary courage
    and exemplary devotion to duty provided the inspiration and leadership that enabled
    his platoon to successfully withdraw without further casualties. 2d Lt. Leisy's
    gallantry at the cost of his life are in keeping with the highest traditions of
    the military service and reflect great credit on him, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 1
  day: 5
  year: 1970
  title: Staff Sergeant Franklin D. Miller earns Medal of Honor
  body: "<p>On January 5, 1970, Staff Sergeant Franklin D. Miller was team leader
    of an American-Vietnamese long-range reconnaissance patrol deep in enemy controlled
    territory. Soon after the helicopter insertion, a team member tripped a booby
    trap that wounded 4 soldiers. Miller gave first aid and placed the team across
    a small stream bed at the base of a steep hill. Within minutes he saw the lead
    element of an estimated platoon-size enemy force approaching. He sent the team
    up the hill to a more secure position and remained alone to meet the attack, repulsing
    2 attacks.</p><p>He rejoined his team, contacted a forward air controller and
    arranged evacuation from a bomb crater some 150 meters away, and led his men to
    it. As the helicopter hovered over the crater, the enemy attacked with automatic
    weapons and rocket-propelled grenades and drove it off. Miller led the defense
    and, although seriously wounded and with every man in his patrol a casualty, moved
    forward alone and repelled 2 more attacks before a friendly relief force reached
    the patrol.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Franklin D. Miller (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. S/Sergeant. Miller, 5th Special Forces
    Group, distinguished himself while serving as team leader of an American-Vietnamese
    long-range reconnaissance patrol operating deep within enemy controlled territory.
    Leaving the helicopter insertion point, the patrol moved forward on its mission.
    Suddenly, 1 of the team members tripped a hostile booby trap which wounded 4 soldiers.
    S/Sergeant. Miller, knowing that the explosion would alert the enemy, quickly
    administered first aid to the wounded and directed the team into positions across
    a small stream bed at the base of a steep hill. Within a few minutes, S/Sergeant.
    Miller saw the lead element of what he estimated to be a platoon-size enemy force
    moving toward his location. Concerned for the safety of his men, he directed the
    small team to move up the hill to a more secure position. He remained alone, separated
    from the patrol, to meet the attack. S/Sergeant. Miller single-handedly repulsed
    2 determined attacks by the numerically superior enemy force and caused them to
    withdraw in disorder. He rejoined his team, established contact with a forward
    air controller and arranged the evacuation of his patrol. However, the only suitable
    extraction location in the heavy jungle was a bomb crater some 150 meters from
    the team location. S/Sergeant. Miller reconnoitered the route to the crater and
    led his men through the enemy controlled jungle to the extraction site. As the
    evacuation helicopter hovered over the crater to pick up the patrol, the enemy
    launched a savage automatic weapon and rocket-propelled grenade attack against
    the beleaguered team, driving off the rescue helicopter. S/Sergeant. Miller led
    the team in a valiant defense which drove back the enemy in its attempt to overrun
    the small patrol. Although seriously wounded and with every man in his patrol
    a casualty, S/Sergeant. Miller moved forward to again single-handedly meet the
    hostile attackers. From his forward exposed position, S/Sergeant. Miller gallantly
    repelled 2 attacks by the enemy before a friendly relief force reached the patrol
    location. S/Sergeant. Miller's gallantry, intrepidity in action, and selfless
    devotion to the welfare of his comrades are in keeping with the highest traditions
    of the military service and reflect great credit on him, his unit, and the U.S.
    Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 1
  day: 9
  year: 1970
  title: Specialist Fourth Class Danny J. Petersen earns Medal of Honor (posthumous)
  body: "<p>On January 9, 1970, Specialist Fourth Class Danny J. Petersen was commanding
    an armored personnel carrier with Company B in a combat operation against an estimated
    North Vietnamese Army battalion. In the initial contact, another carrier was disabled
    and its crewmen pinned down by heavy small arms, automatic weapons and rocket-propelled
    grenade fire. Petersen placed his carrier between the disabled vehicle and the
    enemy and laid suppressive fire on the fortified position while the crew repaired
    their vehicle. He then moved under heavy fire to within 10 feet of the enemy emplacement.</p><p>After
    intense fighting his vehicle took a direct hit and the driver was wounded. Petersen
    carried his wounded comrade 45 meters to a secure area, then returned to his disabled
    carrier to cover the other vehicles and the dismounted personnel of his platoon
    as they withdrew. Under fire from 3 sides, he remained with the vehicle, alone
    and exposed. He was standing on top of it, firing his weapon, when he was mortally
    wounded. His actions prevented further loss of life in his platoon.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Danny J. Petersen (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: Sp4c. Petersen distinguished himself while serving as an armored personnel
    carrier commander with Company B during a combat operation against a North Vietnamese
    Army Force estimated to be of battalion size. During the initial contact with
    the enemy, an armored personnel carrier was disabled and the crewmen were pinned
    down by the heavy onslaught of enemy small arms, automatic weapons and rocket-propelled
    grenade fire. Sp4c. Petersen immediately maneuvered his armored personnel carrier
    to a position between the disabled vehicle and the enemy. He placed suppressive
    fire on the enemy's well-fortified position, thereby enabling the crewmembers
    of the disabled personnel carrier to repair their vehicle. He then maneuvered
    his vehicle, while still under heavy hostile fire to within 10 feet of the enemy's
    defensive emplacement. After a period of intense fighting, his vehicle received
    a direct hit and the driver was wounded. With extraordinary courage and selfless
    disregard for his own safety, Sp4c. Petersen carried his wounded comrade 45 meters
    across the bullet-swept field to a secure area. He then voluntarily returned to
    his disabled armored personnel carrier to provide covering fire for both the other
    vehicles and the dismounted personnel of his platoon as they withdrew. Despite
    heavy fire from 3 sides, he remained with his disabled vehicle, alone and completely
    exposed. Sp4c. Petersen was standing on top of his vehicle, firing his weapon,
    when he was mortally wounded. His heroic and selfless actions prevented further
    loss of life in his platoon. Sp4c. Petersen's conspicuous gallantry and extraordinary
    heroism are in the highest traditions of the service and reflect great credit
    on him, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 1
  day: 31
  year: 1970
  title: Private First Class Raymond M. Clausen earns Medal of Honor
  body: "<p>On January 31, 1970, Private First Class Raymond M. Clausen of Marine
    Medium Helicopter Squadron 263 took part in a helicopter rescue mission to extract
    elements of a platoon that had inadvertently entered a minefield while attacking
    enemy positions. Clausen guided the helicopter pilot to a landing in an area cleared
    by one of several mine explosions. With 11 marines wounded, 1 dead, and the remaining
    8 holding their positions for fear of detonating other mines, he leaped from the
    helicopter and, under enemy fire, moved across the mine laden area to help carry
    casualties to the waiting helicopter and place them aboard.</p><p>He left the
    comparative safety of the helicopter on 6 separate occasions to carry out his
    rescue efforts. On one occasion, while he was carrying one of the wounded, another
    mine detonated, killing a corpsman and wounding 3 other men. Only when he was
    certain that all marines were safely aboard did he signal the pilot to lift the
    helicopter.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Raymond M. Clausen (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving with Marine Medium Helicopter Squadron
    263 during operations against enemy forces. Participating in a helicopter rescue
    mission to extract elements of a platoon which had inadvertently entered a minefield
    while attacking enemy positions, Private First Class Clausen skillfully guided
    the helicopter pilot to a landing in an area cleared by 1 of several mine explosions.
    With 11 marines wounded, 1 dead, and the remaining 8 marines holding their positions
    for fear of detonating other mines, Private First Class Clausen quickly leaped
    from the helicopter and, in the face of enemy fire, moved across the extremely
    hazardous mine laden area to assist in carrying casualties to the waiting helicopter
    and in placing them aboard. Despite the ever-present threat of further mine explosions,
    he continued his valiant efforts, leaving the comparatively safe area of the helicopter
    on 6 separate occasions to carry out his rescue efforts. On 1 occasion while he
    was carrying 1 of the wounded, another mine detonated, killing a corpsman and
    wounding 3 other men. Only when he was certain that all marines were safely aboard
    did he signal the pilot to lift the helicopter. By the courageous, determined
    and inspiring efforts in the face of the utmost danger, Private First Class Clausen
    upheld the highest traditions of the Marine Corps and of the U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 1
  day: 31
  year: 1970
  title: Sergeant Richard A. Penry earns Medal of Honor
  body: "<p>On January 31, 1970, Sergeant Richard A. Penry, a rifleman in Company
    C, was on a night ambush mission when the platoon came under intense mortar, rocket,
    and automatic weapons fire that seriously wounded the company commander and most
    of the platoon. Penry worked his way through the fire to the company command post,
    gave first aid to the commander and others, and moved the post to a better protected
    position. With the company radio damaged, he ran outside the perimeter through
    hostile fire to retrieve a radio, found it inoperable, and went back for 2 more.</p><p>He
    retrieved ammunition and weapons for the wounded. During an assault by over 30
    enemy soldiers he held the most forward position, firing and throwing grenades,
    and single-handedly stopped the attack. He retrieved a fourth radio and reached
    battalion headquarters, led 5 isolated wounded soldiers to safety, set up a beacon
    for the evacuation helicopters, and carried 18 wounded men to the extraction site
    before joining another platoon in pursuit of the enemy.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Richard A. Penry (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sergeant. Penry, Company C, distinguished
    himself while serving as a rifleman during a night ambush mission. As the platoon
    was preparing the ambush position, it suddenly came under an intense enemy attack
    from mortar, rocket, and automatic weapons fire which seriously wounded the company
    commander and most of the platoon members, leaving small isolated groups of wounded
    men throughout the area. Sergeant. Penry, seeing the extreme seriousness of the
    situation, worked his way through the deadly enemy fire to the company command
    post where he administered first aid to the wounded company commander and other
    personnel. He then moved the command post to a position which provided greater
    protection and visual communication and control of other platoon elements. Realizing
    the company radio was damaged and recognizing the urgent necessity to reestablish
    communications with the battalion headquarters, he ran outside the defensive perimeter
    through a fusillade of hostile fire to retrieve a radio. Finding it inoperable,
    Sergeant. Penry returned through heavy fire to retrieve 2 more radios. Turning
    his attention to the defense of the area, he crawled to the edge of the perimeter,
    retrieved needed ammunition and weapons and resupplied the wounded men. During
    a determined assault by over 30 enemy soldiers, Sergeant. Penry occupied the most
    vulnerable forward position placing heavy, accurate fire on the attacking enemy
    and exposing himself several times to throw hand grenades into the advancing enemy
    troops. He succeeded virtually single-handedly in stopping the attack. Learning
    that none of the radios were operable, Sergeant. Penry again crawled outside the
    defensive perimeter, retrieved a fourth radio and established communications with
    higher headquarters. Sergeant. Penry then continued to administer first aid to
    the wounded and repositioned them to better repel further enemy attacks. Despite
    continuous and deadly sniper fire, he again left the defensive perimeter, moved
    to within a few feet of enemy positions, located 5 isolated wounded soldiers,
    and led them to safety. When evacuation helicopters approached, Sergeant. Penry
    voluntarily left the perimeter, set up a guiding beacon, established the priorities
    for evacuation and successively carried 18 wounded men to the extraction site.
    After all wounded personnel had been evacuated, Sergeant. Penry joined another
    platoon and assisted in the pursuit of the enemy. Sergeant. Penry's extraordinary
    heroism at the risk of his own life are in keeping with the highest traditions
    of the military service and reflect great credit on him, his unit, and the U.S.
    Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 2
  day: 1
  year: 1970
  title: First Lieutenant Russell A. Steindam earns Medal of Honor (posthumous)
  body: "<p>On February 1, 1970, First Lieutenant Russell A. Steindam of Troop B,
    serving as a platoon leader, led members of his platoon on a night ambush operation.
    On the way to the ambush site, suspected enemy movement was detected on one flank,
    and the platoon's temporary position came under intense small arms and automatic
    weapons fire along with a fusillade of hand and rocket-propelled grenades. After
    the initial barrage, Steindam ordered fire placed on the enemy position and had
    the wounded moved to a shallow bomb crater.</p><p>As he directed the return fire
    from an exposed position, a fragmentation grenade was thrown into the site occupied
    by his command group. Steindam shouted a warning to the soldiers around him, then
    threw himself on the grenade and absorbed the full force of the explosion. He
    was killed, and the nearby members of his command group survived.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Russell A. Steindam (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: for conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. 1st Lt. Steindam, Troop B, while serving
    as a platoon leader, led members of his platoon on a night ambush operation. On
    the way to the ambush site, suspected enemy movement was detected on 1 flank and
    the platoon's temporary position was subjected to intense small arms and automatic
    weapons fire as well as a fusillade of hand and rocket-propelled grenades. After
    the initial barrage, 1st Lt. Steindam ordered fire placed on the enemy position
    and the wounded men to be moved to a shallow bomb crater. As he directed the return
    fire against the enemy from his exposed position, a fragmentation grenade was
    thrown into the site occupied by his command group. Instantly realizing the extreme
    gravity of the situation, 1st Lt. Steindam shouted a warning to alert his fellow
    soldiers in the immediate vicinity. Then, unhesitatingly and with complete disregard
    for his safety, 1st Lt. Steindam deliberately threw himself on the grenade, absorbing
    the full and fatal force of the explosion as it detonated. By his gallant action
    and self-sacrifice, he was able to save the lives of the nearby members of his
    command group. The extraordinary courage and selflessness displayed by 1st Lt.
    Steindam were an inspiration to his comrades and are in the highest traditions
    of the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 2
  day: 10
  year: 1970
  title: Specialist Fourth Class John P. Baca earns Medal of Honor
  body: "<p>On February 10, 1970, Specialist Fourth Class John P. Baca of Company
    D was serving on a recoilless rifle team during a night ambush mission. A platoon
    from his company was sent to investigate the detonation of an automatic ambush
    device forward of the unit's main position and came under intense enemy fire from
    concealed positions along the trail. Hearing the heavy firing and judging that
    his recoilless rifle team could help the besieged patrol, Baca led the team through
    enemy fire to a firing position inside the patrol's defensive perimeter.</p><p>As
    they prepared to engage the enemy, a fragmentation grenade was thrown into the
    midst of the patrol. Baca covered the grenade with his steel helmet and fell on
    it as it exploded, absorbing the fragments and concussion with his body. The citation
    credits his action with saving eight men from serious injury or death.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, John P. Baca (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sp4c. Baca, Company D, distinguished
    himself while serving on a recoilless rifle team during a night ambush mission
    A platoon from his company was sent to investigate the detonation of an automatic
    ambush device forward of his unit's main position and soon came under intense
    enemy fire from concealed positions along the trail. Hearing the heavy firing
    from the platoon position and realizing that his recoilless rifle team could assist
    the members of the besieged patrol, Sp4c. Baca led his team through the hail of
    enemy fire to a firing position within the patrol's defensive perimeter. As they
    prepared to engage the enemy, a fragmentation grenade was thrown into the midst
    of the patrol. Fully aware of the danger to his comrades, Sp4c. Baca unhesitatingly,
    and with complete disregard for his own safety, covered the grenade with his steel
    helmet and fell on it as the grenade exploded, thereby absorbing the lethal fragments
    and concussion with his body. His gallant action and total disregard for his personal
    well-being directly saved 8 men from certain serious injury or death. The extraordinary
    courage and selflessness displayed by Sp4c. Baca, at the risk of his life, are
    in the highest traditions of the military service and reflect great credit on
    him, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 3
  day: 11
  year: 1970
  title: Gunnery Sergeant Allan Jay Kellogg, Jr. earns Medal of Honor
  body: "<p>On March 11, 1970, Gunnery Sergeant Allan Jay Kellogg, Jr., serving as
    a platoon sergeant with Company G, was leading a small unit evacuating a fallen
    comrade when it came under heavy small arms and automatic weapons fire from a
    numerically superior enemy force in well-concealed emplacements in the surrounding
    jungle. During the engagement an enemy soldier moved through the dense foliage
    to a position near the marines and threw a hand grenade into their midst; it glanced
    off Kellogg's chest.</p><p>Kellogg forced the grenade into the mud he was standing
    in, threw himself over it, and absorbed the detonation with his body, preventing
    serious injury or death to several of the marines around him. Despite multiple
    injuries to his chest, right shoulder, and arm, he continued to direct his men
    until all of them reached the relative safety of the company perimeter.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Allan Jay Kellogg, Jr. (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a platoon sergeant with Company G,
    in connection with combat operations against the enemy on the night of 11 March
    1970. Under the leadership of G/Sergeant. Kellogg, a small unit from Company G
    was evacuating a fallen comrade when the unit came under a heavy volume of small
    arms and automatic weapons fire from a numerically superior enemy force occupying
    well-concealed emplacements in the surrounding jungle. During the ensuing fierce
    engagement, an enemy soldier managed to maneuver through the dense foliage to
    a position near the marines, and hurled a hand grenade into their midst which
    glanced off the chest of G/Sergeant. Kellogg. Quick to act, he forced the grenade
    into the mud in which he was standing, threw himself over the lethal weapon and
    absorbed the full effects of its detonation with his body thereby preventing serious
    injury or possible death to several of his fellow marines. Although suffering
    multiple injuries to his chest and his right shoulder and arm, G/Sergeant. Kellogg
    resolutely continued to direct the efforts of his men until all were able to maneuver
    to the relative safety of the company perimeter. By his heroic and decisive action
    in risking his life to save the lives of his comrades, G/Sergeant. Kellogg reflected
    the highest credit upon himself and upheld the finest traditions of the Marine
    Corps and the U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 3
  day: 12
  year: 1970
  title: Sergeant Mitchell W. Stout earns Medal of Honor (posthumous)
  body: "<p>On March 12, 1970, Sergeant Mitchell W. Stout was in a bunker with members
    of a searchlight crew at Khe Gio Bridge when a North Vietnamese Army sapper company
    attacked his unit's firing position. The position came under heavy enemy mortar
    fire and ground attack. When the mortar fire subsided, an enemy grenade was thrown
    into the bunker.</p><p>Stout ran to the grenade, picked it up, and started out
    of the bunker. As he reached the door, the grenade exploded. By holding it close
    to his body and shielding its blast, he protected the soldiers in the bunker from
    further injury or death. He was killed by the explosion.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Mitchell W. Stout (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: Sergeant. Stout distinguished himself during an attack by a North Vietnamese
    Army Sapper company on his unit's firing position at Khe Gio Bridge. Sergeant.
    Stout was in a bunker with members of a searchlight crew when the position came
    under heavy enemy mortar fire and ground attack. When the intensity of the mortar
    attack subsided, an enemy grenade was thrown into the bunker. Displaying great
    courage, Sergeant. Stout ran to the grenade, picked it up, and started out of
    the bunker. As he reached the door, the grenade exploded. By holding the grenade
    close to his body and shielding its blast, he protected his fellow soldiers in
    the bunker from further injury or death. Sergeant. Stout's conspicuous gallantry
    and intrepidity in action, at the cost of his own life, are in keeping with the
    highest traditions of the military service and reflect great credit upon him,
    his unit and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 4
  day: 1
  year: 1970
  title: Sergeant Gary B. Beikirch earns Medal of Honor
  body: "<p>On April 1, 1970, Sergeant Gary B. Beikirch, a medical aidman with Detachment
    B-24, Company B, was at Camp Dak Seang when the enemy launched an intense attack
    from well-concealed positions surrounding the camp, and the allied defenders suffered
    a number of casualties. Beikirch moved through the enemy fire to his fallen comrades,
    applied first aid, and helped them to the medical aid station. Told that a seriously
    injured American officer was lying in an exposed position, he ran through the
    fire to reach him. Though seriously wounded by fragments from an enemy mortar
    shell, he carried the officer to the aid station.</p><p>Beikirch then left the
    medical bunker to search for and evacuate other wounded men. He was wounded again
    while dragging a critically injured Vietnamese soldier to the bunker and giving
    him mouth-to-mouth resuscitation at the same time. He again refused treatment
    and kept searching for casualties until he collapsed, and only then allowed himself
    to be treated.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Gary B. Beikirch (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sergeant. Beikirch, medical aidman,
    Detachment B-24, Company B, distinguished himself during the defense of Camp Dak
    Seang. The allied defenders suffered a number of casualties as a result of an
    intense, devastating attack launched by the enemy from well-concealed positions
    surrounding the camp. Sergeant. Beikirch, with complete disregard for his personal
    safety, moved unhesitatingly through the withering enemy fire to his fallen comrades,
    applied first aid to their wounds and assisted them to the medical aid station.
    When informed that a seriously injured American officer was lying in an exposed
    position, Sergeant. Beikirch ran immediately through the hail of fire. Although
    he was wounded seriously by fragments from an exploding enemy mortar shell, Sergeant.
    Beikirch carried the officer to a medical aid station. Ignoring his own serious
    injuries, Sergeant. Beikirch left the relative safety of the medical bunker to
    search for and evacuate other men who had been injured. He was again wounded as
    he dragged a critically injured Vietnamese soldier to the medical bunker while
    simultaneously applying mouth-to-mouth resuscitation to sustain his life. Sergeant.
    Beikirch again refused treatment and continued his search for other casualties
    until he collapsed. Only then did he permit himself to be treated. Sergeant. Beikirch's
    complete devotion to the welfare of his comrades, at the risk of his life are
    in keeping with the highest traditions of the military service and reflect great
    credit on him, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 4
  day: 1
  year: 1970
  title: Sergeant Peter C. Lemon earns Medal of Honor
  body: "<p>On April 1, 1970, Sergeant Peter C. Lemon, then a specialist fourth class
    serving as an assistant machine gunner with Company E, took part in the defense
    of Fire Support Base Illingworth. When the base came under heavy attack, Lemon
    engaged a numerically superior enemy with machine gun and rifle fire until both
    weapons malfunctioned, then held off the attack with hand grenades. After eliminating
    all but one of the enemy soldiers nearby, he pursued and disposed of the last
    in hand-to-hand combat.</p><p>Wounded by grenade fragments, Lemon carried a more
    seriously wounded comrade to an aid station and was wounded a second time as he
    returned. Seeing that his sector was in danger of being overrun, he assaulted
    the enemy with grenades and hand-to-hand fighting, was wounded a third time, and
    drove the enemy from the position. He then stood atop an embankment with a working
    machine gun, exposed to enemy fire, until he collapsed from his wounds and exhaustion.
    At the aid station he refused evacuation until the more seriously wounded had
    been taken out.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Peter C. Lemon (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sergeant. Lemon (then Sp4c.), Company
    E, distinguished himself while serving as an assistant machine gunner during the
    defense of Fire Support Base Illingworth. When the base came under heavy enemy
    attack, Sergeant. Lemon engaged a numerically superior enemy with machine gun
    and rifle fire from his defensive position until both weapons malfunctioned. He
    then used hand grenades to fend off the intensified enemy attack launched in his
    direction. After eliminating all but 1 of the enemy soldiers in the immediate
    vicinity, he pursued and disposed of the remaining soldier in hand-to-hand combat.
    Despite fragment wounds from an exploding grenade, Sergeant. Lemon regained his
    position, carried a more seriously wounded comrade to an aid station, and, as
    he returned, was wounded a second time by enemy fire. Disregarding his personal
    injuries, he moved to his position through a hail of small arms and grenade fire.
    Sergeant. Lemon immediately realized that the defensive sector was in danger of
    being overrun by the enemy and unhesitatingly assaulted the enemy soldiers by
    throwing hand grenades and engaging in hand-to-hand combat. He was wounded yet
    a third time, but his determined efforts successfully drove the enemy from the
    position. Securing an operable machine gun, Sergeant. Lemon stood atop an embankment
    fully exposed to enemy fire, and placed effective fire upon the enemy until he
    collapsed from his multiple wounds and exhaustion. After regaining consciousness
    at the aid station, he refused medical evacuation until his more seriously wounded
    comrades had been evacuated. Sergeant. Lemon's gallantry and extraordinary heroism,
    are in keeping with the highest traditions of the military service and reflect
    great credit on him, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 4
  day: 5
  year: 1970
  title: Sergeant Brian L. Buker earns Medal of Honor (posthumous)
  body: "<p>On April 5, 1970, Sergeant Brian L. Buker of Detachment B-55 was serving
    as platoon adviser to a Vietnamese mobile strike force company on an offensive
    mission. Buker led the platoon, cleared a well-guarded pass, and established the
    first foothold at the top of what had been an impenetrable mountain fortress.
    The platoon then came under intense fire from two heavily fortified enemy bunkers.
    Judging that withdrawal would cost heavy casualties, Buker charged through the
    fire and destroyed the first bunker with hand grenades.</p><p>While reorganizing
    his men to attack the second bunker, Buker was seriously wounded. He crawled forward
    and destroyed the second bunker as well. He refused medical attention and was
    reorganizing his men to continue the attack when he was mortally wounded. The
    citation states that his actions averted many casualties and that the assault
    on the enemy position succeeded.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Brian L. Buker (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    life above and beyond the call of duty. Sergeant. Buker, Detachment B-55, distinguished
    himself while serving as a platoon adviser of a Vietnamese mobile strike force
    company during an offensive mission. Sergeant. Buker personally led the platoon,
    cleared a strategically located well-guarded pass, and established the first foothold
    at the top of what had been an impenetrable mountain fortress. When the platoon
    came under the intense fire from a determined enemy located in 2 heavily fortified
    bunkers, and realizing that withdrawal would result in heavy casualties, Sergeant.
    Buker unhesitatingly, and with complete disregard for his personal safety, charged
    through the hail of enemy fire and destroyed the first bunker with hand grenades.
    While reorganizing his men for the attack on the second bunker, Sergeant. Buker
    was seriously wounded. Despite his wounds and the deadly enemy fire, he crawled
    forward and destroyed the second bunker. Sergeant. Buker refused medical attention
    and was reorganizing his men to continue the attack when he was mortally wounded.
    As a direct result of his heroic actions, many casualties were averted, and the
    assault of the enemy position was successful. Sergeant. Buker's extraordinary
    heroism at the cost of his life are in the highest traditions of the military
    service and reflect great credit on him, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 4
  day: 8
  year: 1970
  title: Sergeant First Class Gary Lee Littrell earns Medal of Honor
  body: "<p>On April 8, 1970, Sergeant First Class Gary Lee Littrell of Advisory Team
    21, U.S. Military Assistance Command, Vietnam, was in the fourth day of a siege
    while serving as Light Weapons Infantry Advisor with the 23d Battalion, 2d Ranger
    Group, Republic of Vietnam Army, near Dak Seang. After the battalion established
    a defensive perimeter on a hill on April 4, an intense enemy mortar attack killed
    the Vietnamese commander and one advisor and seriously wounded every other advisor
    except Littrell.</p><p>Over the following four days he directed artillery and
    air support by day and marked the unit's location by night under heavy enemy fire.
    He moved repeatedly to the points most threatened, redistributed ammunition, strengthened
    faltering defenses, cared for the wounded, and shouted encouragement to the Vietnamese
    in their own language as assault after assault was repulsed. When the battalion
    was ordered to withdraw, it met numerous ambushes, and Littrell held off disorder
    by directing air strikes to within 50 meters of its position.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Gary Lee Littrell (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sergeant. 1st Class. Littrell, U.S.
    Military Assistance Command, Vietnam, Advisory Team 21, distinguished himself
    while serving as a Light Weapons Infantry Advisor with the 23d Battalion, 2d Ranger
    Group, Republic of Vietnam Army, near Dak Seang. After establishing a defensive
    perimeter on a hill on April 4, the battalion was subjected to an intense enemy
    mortar attack which killed the Vietnamese commander, 1 advisor, and seriously
    wounded all the advisors except Sergeant. 1st Class. Littrell. During the ensuing
    4 days, Sergeant. 1st Class Littrell exhibited near superhuman endurance as he
    single-handedly bolstered the besieged battalion. Repeatedly abandoning positions
    of relative safety, he directed artillery and air support by day and marked the
    unit's location by night, despite the heavy, concentrated enemy fire. His dauntless
    will instilled in the men of the 23d Battalion a deep desire to resist. Assault
    after assault was repulsed as the battalion responded to the extraordinary leadership
    and personal example exhibited by Sergeant. 1st Class. Littrell as he continuously
    moved to those points most seriously threatened by the enemy, redistributed ammunition,
    strengthened faltering defenses, cared for the wounded and shouted encouragement
    to the Vietnamese in their own language. When the beleaguered battalion was finally
    ordered to withdraw, numerous ambushes were encountered. Sergeant. 1st Class.
    Littrell repeatedly prevented widespread disorder by directing air strikes to
    within 50 meters of their position. Through his indomitable courage and complete
    disregard for his safety, he averted excessive loss of life and injury to the
    members of the battalion. The sustained extraordinary courage and selflessness
    displayed by Sergeant. 1st Class. Littrell over an extended period of time were
    in keeping with the highest traditions of the military service and reflect great
    credit on him and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 4
  day: 11
  year: 1970
  title: Lance Corporal Emilio A. De La Garza, Jr. earns Medal of Honor (posthumous)
  body: "<p>On April 11, 1970, Lance Corporal Emilio A. De La Garza, Jr., a machine
    gunner with Company E, was returning with his squad from a night ambush operation
    when he joined his platoon commander and another marine in searching for two enemy
    soldiers who had been seen fleeing for cover toward a small pond. De La Garza
    located one of the soldiers hiding among the reeds and brush.</p><p>As the three
    marines tried to remove the resisting soldier from the pond, De La Garza saw him
    pull the pin on a grenade. He shouted a warning and placed himself between the
    other two marines and the blast. He was killed, and the two marines survived.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Emilio A. De La Garza, Jr. (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a machine gunner with Company E.
    Returning with his squad from a night ambush operation, L/Corporal. De La Garza
    joined his platoon commander and another marine in searching for 2 enemy soldiers
    who had been observed fleeing for cover toward a small pond. Moments later, he
    located 1 of the enemy soldiers hiding among the reeds and brush. As the 3 marines
    attempted to remove the resisting soldier from the pond, L/Corporal. De La Garza
    observed him pull the pin on a grenade. Shouting a warning, L/Corporal. De La
    Garza placed himself between the other 2 marines and the ensuing blast from the
    grenade, thereby saving the lives of his comrades at the sacrifice of his life.
    By his prompt and decisive action, and his great personal valor in the face of
    almost certain death, L/Corporal. De La Garza upheld and further enhanced the
    finest traditions of the Marine Corps and the U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 5
  day: 6
  year: 1970
  title: Lance Corporal James D. Howe earns Medal of Honor (posthumous)
  body: "<p>On May 6, 1970, in the early morning hours, Lance Corporal James D. Howe,
    a rifleman with Company I, and two other marines were occupying a defensive position
    in a sandy beach area fronted by bamboo thickets. Enemy sappers, using the cover
    of darkness, launched a grenade attack against the position. After the first grenades
    exploded, Howe and his two comrades moved to a better position from which to return
    suppressive fire.</p><p>When an enemy grenade landed in their midst, Howe shouted
    a warning and threw himself on it, protecting the two marines with him. He was
    killed by the explosion.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, James D. Howe (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a rifleman with Company I, during
    operations against enemy forces. In the early morning hours L/Corporal. Howe and
    2 other marines were occupying a defensive position in a sandy beach area fronted
    by bamboo thickets. Enemy sappers suddenly launched a grenade attack against the
    position, utilizing the cover of darkness to carry out their assault. Following
    the initial explosions of the grenades, L/Corporal. Howe and his 2 comrades moved
    to a more advantageous position in order to return suppressive fire. When an enemy
    grenade landed in their midst, L/Corporal. Howe immediately shouted a warning
    and then threw himself upon the deadly missile, thereby protecting the lives of
    the fellow marines. His heroic and selfless action was in keeping with the finest
    traditions of the Marine Corps and of the U.S. Naval Service. He valiantly gave
    his life in the service of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 5
  day: 7
  year: 1970
  title: Private First Class Kenneth Michael Kays earns Medal of Honor
  body: "<p>On May 7, 1970, Private First Class Kenneth Michael Kays, then a private,
    was serving as a medical aidman with Company D, 1st Battalion, 101st Airborne
    Division near Fire Support Base Maureen when a heavily armed force of enemy sappers
    and infantrymen assaulted the company's night defensive position, killing and
    wounding a number of its members. Kays started toward the perimeter to help the
    fallen and became the target of concentrated fire and explosive charges, one of
    which severed the lower part of his left leg.</p><p>After applying a tourniquet
    to his own leg, Kays moved to the perimeter, treated one of the wounded, and helped
    move him to relative safety. He returned to the perimeter, treated another wounded
    man, and shielded him with his body while moving him to safety. Weakened by blood
    loss, he then went beyond the company's perimeter into enemy held territory to
    treat a wounded American lying there. Only after the other wounded had been treated
    and evacuated did Kays allow his own wounds to be treated.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Kenneth Michael Kays (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry intrepidity in action at the risk of his
    life above and beyond the call of duty. Private First Class (then Pvt.) Kays distinguished
    himself while serving as a medical aidman with Company D, 1st Battalion, 101st
    Airborne Division near Fire Support Base Maureen. A heavily armed force of enemy
    sappers and infantrymen assaulted Company D's night defensive position, wounding
    and killing a number of its members. Disregarding the intense enemy fire and ground
    assault, Private First Class Kays began moving toward the perimeter to assist
    his fallen comrades. In doing so he became the target of concentrated enemy fire
    and explosive charges, 1 of which severed the lower portion of his left leg. After
    applying a tourniquet to his leg, Private First Class Kays moved to the fire-swept
    perimeter, administered medical aid to 1 of the wounded, and helped move him to
    an area of relative safety. Despite his severe wound and excruciating pain, Private
    First Class Kays returned to the perimeter in search of other wounded men. He
    treated another wounded comrade, and, using his own body as a shield against enemy
    bullets and fragments, moved him to safety. Although weakened from a great loss
    of blood, Private First Class Kays resumed his heroic lifesaving efforts by moving
    beyond the company's perimeter into enemy held territory to treat a wounded American
    lying there. Only after his fellow wounded soldiers had been treated and evacuated
    did Private First Class Kays allow his own wounds to be treated. These courageous
    acts by Private First Class Kays resulted in the saving of numerous lives and
    inspired others in his company to repel the enemy. Private First Class Kays' heroism
    at the risk of his life are in keeping with the highest traditions of the service
    and reflect great credit on him, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 5
  day: 8
  year: 1970
  title: Lance Corporal Miguel Keith earns Medal of Honor (posthumous)
  body: "<p>On May 8, 1970, during the early morning, Lance Corporal Miguel Keith,
    a machine gunner with Combined Action platoon 1-3-2, was seriously wounded when
    his platoon came under heavy ground attack by a greatly outnumbering enemy force.
    Despite his wounds he ran across the fire-swept terrain to check the security
    of vital defensive positions, then, fully exposed to view, delivered machine gun
    fire against the enemy. When five enemy soldiers approached the command post,
    he rushed forward firing, disposed of three and dispersed the other two.</p><p>A
    grenade then detonated near Keith, knocking him down and inflicting further severe
    wounds. Weak from loss of blood, he charged an estimated 25 enemy soldiers massing
    to attack; his fire eliminated four and the rest fled for cover. He was mortally
    wounded by an enemy soldier during this assault. The citation credits him with
    a large part in the platoon's rout of a numerically superior enemy force.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Miguel Keith (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a machine gunner with Combined Action
    platoon 1-3-2. During the early morning L/Corporal. Keith was seriously wounded
    when his platoon was subjected to a heavy ground attack by a greatly outnumbering
    enemy force. Despite his painful wounds, he ran across the fire-swept terrain
    to check the security of vital defensive positions and then, while completely
    exposed to view, proceeded to deliver a hail of devastating machine gun fire against
    the enemy. Determined to stop 5 of the enemy soldiers approaching the command
    post, he rushed forward, firing as he advanced. He succeeded in disposing of 3
    of the attackers and in dispersing the remaining 2. At this point, a grenade detonated
    near L/Corporal. Keith, knocking him to the ground and inflicting further severe
    wounds. Fighting pain and weakness from loss of blood, he again braved the concentrated
    hostile fire to charge an estimated 25 enemy soldiers who were massing to attack.
    The vigor of his assault and his well-placed fire eliminated 4 of the enemy soldiers
    while the remainder fled for cover. During this valiant effort, he was mortally
    wounded by an enemy soldier. By his courageous and inspiring performance in the
    face of almost overwhelming odds, L/Corporal. Keith contributed in large measure
    to the success of his platoon in routing a numerically superior enemy force, and
    upheld the finest traditions of the Marine Corps and of the U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 5
  day: 10
  year: 1970
  title: Specialist Four Leslie H. Sabo, Jr. earns Medal of Honor (posthumous)
  body: "<p>On May 10, 1970, Specialist Four Leslie H. Sabo, Jr., a rifleman in Company
    B, 3d Battalion, 506th Infantry, 101st Airborne Division, was on a reconnaissance
    patrol with his platoon in Se San, Cambodia, when the platoon was ambushed from
    all sides by a large enemy force. Sabo charged an enemy position, killing several
    enemy soldiers, then assaulted an enemy flanking force, drawing its fire away
    from friendly soldiers and forcing it to retreat. To resupply ammunition he sprinted
    across an open field to a wounded comrade. As he began to reload, an enemy grenade
    landed nearby; Sabo picked it up, threw it, and shielded his comrade with his
    own body, absorbing the brunt of the blast.</p><p>Seriously wounded, Sabo then
    charged an enemy bunker that had inflicted severe damage on the platoon, taking
    several serious wounds from automatic weapons fire. Mortally injured, he crawled
    toward the emplacement and threw a grenade into the bunker. The explosion silenced
    the enemy fire and killed Sabo. The citation credits him with saving the lives
    of many of his platoon.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Leslie H. Sabo, Jr. (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: 'For conspicuous gallantry and intrepidity at the risk of his life
    above and beyond the call of duty: Specialist Four Leslie H. Sabo, Jr. distinguished
    himself by conspicuous acts of gallantry and intrepidity above and beyond the
    call of duty at the cost of his own life while serving as a rifleman in Company
    B, 3d Battalion, 506th Infantry, 101st Airborne Division in Se San, Cambodia,
    on May 10, 1970. On that day, Specialist Four Sabo and his platoon were conducting
    a reconnaissance patrol when they were ambushed from all sides by a large enemy
    force. Without hesitation, Specialist Four Sabo charged an enemy position, killing
    several enemy soldiers. Immediately thereafter, he assaulted an enemy flanking
    force, successfully drawing their fire away from friendly soldiers and ultimately
    forcing the enemy to retreat. In order to re-supply ammunition, he sprinted across
    an open field to a wounded comrade. As he began to reload, an enemy grenade landed
    nearby. Specialist Four Sabo picked it up, threw it, and shielded his comrade
    with his own body, thus absorbing the brunt of the blast and saving his comrade''s
    life. Seriously wounded by the blast, Specialist Four Sabo nonetheless retained
    the initiative and then single-handedly charged an enemy bunker that had inflicted
    severe damage on the platoon, receiving several serious wounds from automatic
    weapons fire in the process. Now mortally injured, he crawled towards the enemy
    emplacement and, when in position, threw a grenade into the bunker. The resulting
    explosion silenced the enemy fire, but also ended Specialist Four Sabo''s life.
    His indomitable courage and complete disregard for his own safety saved the lives
    of many of his platoon members. Specialist Four Sabo’s extraordinary heroism and
    selflessness, above and beyond the call of duty, at the cost of his life, are
    in keeping with the highest traditions of military service and reflect great credit
    upon himself, Company B, 3d Battalion, 506th Infantry, 101st Airborne Division,
    and the United States Army.'
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 5
  day: 12
  year: 1970
  title: Specialist Four Ardie R. Copas earns Medal of Honor (posthumous)
  body: "<p>On May 12, 1970, Specialist Four Ardie R. Copas was serving as a machinegunner
    in Company C, 1st Battalion (Mechanized), 5th Infantry Regiment, 25th Infantry
    Division, near Ph Romeas Hek, Cambodia. That morning his company was suddenly
    attacked by a large hostile force firing recoilless rifles, rocket-propelled grenades,
    and automatic weapons. As Copas began returning fire, his armored car was struck
    by an enemy recoilless round, which knocked him to the ground and injured four
    American soldiers beside the vehicle.</p><p>Ignoring his own wounds, Copas remounted
    the burning vehicle and resumed firing his machinegun. Under enemy fire and with
    mortar rounds inside the track that might detonate, he kept up a heavy volume
    of suppressive fire while the wounded Americans were evacuated. He continued firing
    until another enemy round hit his vehicle and mortally wounded him. The citation
    states that his action resulted in the safe evacuation of his comrades.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Ardie R. Copas (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: 'For conspicuous gallantry and intrepidity at the risk of his life
    above and beyond the call of duty: Specialist Four Ardie R. Copas distinguished
    himself by acts of gallantry and intrepidity above and beyond the call of duty
    while serving as a Machinegunner in Company C, 1st Battalion (Mechanized), 5th
    Infantry Regiment, 25th Infantry Division during combat operations against an
    armed enemy near Ph Romeas Hek, Cambodia on May 12, 1970. That morning, Specialist
    Four Copas’ company was suddenly attacked by a large hostile force firing recoilless
    rifles, rocket-propelled grenades, and automatic weapons. As Specialist Four Copas
    began returning fire, his armored car was struck by an enemy recoilless round,
    knocking him to the ground and injuring four American Soldiers beside the vehicle.
    Ignoring his own wounds, Specialist Four Copas quickly remounted the burning vehicle
    and commenced firing his machinegun at the belligerents. Braving the hostile fire
    directed at him and the possible detonation of the mortar rounds inside the track,
    Specialist Four Copas maintained a heavy volume of suppressive fire on the foe
    while the wounded Americans were safely evacuated. Undaunted, Specialist Four
    Copas continued to place devastating volleys of fire upon the adversary until
    he was mortally wounded when another enemy round hit his vehicle. Specialist Four
    Copas’ daring action resulted in the safe evacuation of his comrades. Specialist
    Four Copas’ extraordinary heroism and selflessness at the cost of his own life,
    above and beyond the call of duty, are in keeping with the highest traditions
    of military service and reflect great credit upon himself, his unit and the United
    States Army. Citation represents Soldier''s rank at time of action. For more information
    on Specialist Four Ardie R. Copas visit: https://www.army.mil/medalofhonor/valor24/recipients/copas/'
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 5
  day: 13
  year: 1970
  title: Private First Class David F. Winder earns Medal of Honor (posthumous)
  body: "<p>On May 13, 1970, Private First Class David F. Winder, a senior medical
    aidman with Company A, was with his unit as it moved through freshly cut rice
    paddies in search of a suspected company-size enemy force. During a search of
    the area the unit was engaged with intense automatic weapons and rocket propelled
    grenade fire by a well entrenched enemy force. Several soldiers fell wounded in
    the first contact and the unit was pinned down.</p><p>Winder began working across
    approximately 100 meters of open, bullet-swept terrain toward the nearest casualty,
    unarmed and crawling most of the way. He was wounded before reaching his comrades,
    but reached the first casualty and treated him. Crawling toward a second wounded
    soldier, he was wounded again and forced to stop, then moved forward once more
    toward the injured man. He was mortally wounded within 10 meters of him. The citation
    states that his unit then launched a counterassault that defeated the enemy.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, David F. Winder (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: Private First Class Winder distinguished himself while serving in the
    Republic of Vietnam as a senior medical aidman with Company A. After moving through
    freshly cut rice paddies in search of a suspected company-size enemy force, the
    unit started a thorough search of the area. Suddenly they were engaged with intense
    automatic weapons and rocket propelled grenade fire by a well entrenched enemy
    force. Several friendly soldiers fell wounded in the initial contact and the unit
    was pinned down. Responding instantly to the cries of his wounded comrades, Private
    First Class Winder began maneuvering across approximately 100 meters of open,
    bullet-swept terrain toward the nearest casualty. Unarmed and crawling most of
    the distance, he was wounded by enemy fire before reaching his comrades. Despite
    his wounds and with great effort, Private First Class Winder reached the first
    casualty and administered medical aid. As he continued to crawl across the open
    terrain toward a second wounded soldier he was forced to stop when wounded a second
    time. Aroused by the cries of an injured comrade for aid, Private First Class
    Winder's great determination and sense of duty impelled him to move forward once
    again, despite his wounds, in a courageous attempt to reach and assist the injured
    man. After struggling to within 10 meters of the man, Private First Class Winder
    was mortally wounded. His dedication and sacrifice inspired his unit to initiate
    an aggressive counterassault which led to the defeat of the enemy. Private First
    Class Winder's conspicuous gallantry and intrepidity in action at the cost of
    his life were in keeping with the highest traditions of the military service and
    reflect great credit on him, his unit and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 5
  day: 24
  year: 1970
  title: Warrant Officer Louis R. Rocco earns Medal of Honor
  body: "<p>On May 24, 1970, Warrant Officer Louis R. Rocco volunteered to accompany
    a medical evacuation team on an urgent mission to evacuate eight critically wounded
    Army of the Republic of Vietnam personnel. As the helicopter approached the landing
    zone it came under intense enemy automatic weapons fire. Rocco identified the
    enemy positions and placed suppressive fire on them as the aircraft descended.
    The helicopter took major damage and crash landed, and Rocco suffered a fractured
    wrist and hip and a severely bruised back.</p><p>Rocco pulled the survivors from
    the burning wreckage, burning himself in the process, and under enemy fire carried
    each unconscious man across approximately 20 meters of exposed terrain to the
    Army of the Republic of Vietnam perimeter. Inside the friendly position he helped
    give first aid to his comrades until his wounds and burns caused him to collapse
    and lose consciousness. The citation credits him with saving three fellow soldiers
    from certain death.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Louis R. Rocco (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: WO Rocco distinguished himself when he volunteered to accompany a medical
    evacuation team on an urgent mission to evacuate 8 critically wounded Army of
    the Republic of Vietnam personnel. As the helicopter approached the landing zone,
    it became the target for intense enemy automatic weapons fire. Disregarding his
    own safety, WO Rocco identified and placed accurate suppressive fire on the enemy
    positions as the aircraft descended toward the landing zone. Sustaining major
    damage from the enemy fire, the aircraft was forced to crash land, causing WO
    Rocco to sustain a fractured wrist and hip and a severely bruised back. Ignoring
    his injuries, he extracted the survivors from the burning wreckage, sustaining
    burns to his own body. Despite intense enemy fire, WO Rocco carried each unconscious
    man across approximately 20 meters of exposed terrain to the Army of the Republic
    of Vietnam perimeter. On each trip, his severely burned hands and broken wrist
    caused excruciating pain, but the lives of the unconscious crash survivors were
    more important than his personal discomfort, and he continued his rescue efforts.
    Once inside the friendly position, WO Rocco helped administer first aid to his
    wounded comrades until his wounds and burns caused him to collapse and lose consciousness.
    His bravery under fire and intense devotion to duty were directly responsible
    for saving 3 of his fellow soldiers from certain death. His unparalleled bravery
    in the face of enemy fire, his complete disregard for his own pain and injuries,
    and his performance were far above and beyond the call of duty and were in keeping
    with the highest traditions of self-sacrifice and courage of the military service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 6
  day: 7
  year: 1970
  title: Staff Sergeant Robert C. Murray earns Medal of Honor (posthumous)
  body: "<p>On June 7, 1970, Staff Sergeant Robert C. Murray, a squad leader with
    Company B, was leading his squad in a search for an enemy mortar that had been
    threatening friendly positions. A member of the squad tripped an enemy grenade
    rigged as a booby trap and, realizing what he had done, shouted for everyone to
    take cover.</p><p>Murray assessed the danger to the men of his squad and threw
    himself on the grenade, absorbing the full impact of the explosion. He was killed,
    and the other members of his squad escaped death or injury.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Robert C. Murray (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: S/Sergeant. Murray distinguished himself while serving as a squad leader
    with Company B. S/Sergeant. Murray's squad was searching for an enemy mortar that
    had been threatening friendly positions when a member of the squad tripped an
    enemy grenade rigged as a booby trap. Realizing that he had activated the enemy
    booby trap, the soldier shouted for everybody to take cover. Instantly assessing
    the danger to the men of his squad, S/Sergeant. Murray unhesitatingly and with
    complete disregard for his own safety, threw himself on the grenade absorbing
    the full and fatal impact of the explosion. By his gallant action and self sacrifice,
    he prevented the death or injury of the other members of his squad. S/Sergeant.
    Murray's extraordinary courage and gallantry, at the cost of his life above and
    beyond the call of duty, are in keeping with the highest traditions of the military
    service and reflect great credit on him, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 7
  day: 23
  year: 1970
  title: Lieutenant Colonel Andre C. Lucas earns Medal of Honor (posthumous)
  body: "<p>On July 23, 1970, Lieutenant Colonel Andre C. Lucas, commanding officer
    of the 2d Battalion, was mortally wounded while directing the withdrawal of his
    battalion from a fire base that had been under constant heavy attack by a numerically
    superior enemy force over an extended period. Throughout that period Lucas directed
    the defense. On one occasion he flew in a helicopter at treetop level above an
    entrenched enemy for more than three hours, directing the fire of one of his companies;
    when the helicopter was heavily damaged he stayed until the company had used up
    its grenades, then transferred to another helicopter, dropped grenades to the
    troops, and resumed directing fire. The citation states that these actions kept
    the company from being encircled and destroyed.</p><p>On another occasion Lucas
    tried to rescue a crewman trapped in a burning helicopter. As the flames spread
    and enemy fire grew intense, he ordered the rest of the rescue party to safety
    and continued alone amid mortar fire, heat, and exploding ammunition until the
    aircraft was engulfed in flames.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Andre C. Lucas (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: Lt. Col. Lucas distinguished himself by extraordinary heroism while
    serving as the commanding officer of the 2d Battalion. Although the fire base
    was constantly subjected to heavy attacks by a numerically superior enemy force
    throughout this period, Lt. Col. Lucas, forsaking his own safety, performed numerous
    acts of extraordinary valor in directing the defense of the allied position. On
    1 occasion, he flew in a helicopter at treetop level above an entrenched enemy
    directing the fire of 1 of his companies for over 3 hours. Even though his helicopter
    was heavily damaged by enemy fire, he remained in an exposed position until the
    company expended its supply of grenades. He then transferred to another helicopter,
    dropped critically needed grenades to the troops, and resumed his perilous mission
    of directing fire on the enemy. These courageous actions by Lt. Col. Lucas prevented
    the company from being encircled and destroyed by a larger enemy force. On another
    occasion, Lt. Col. Lucas attempted to rescue a crewman trapped in a burning helicopter.
    As the flames in the. aircraft spread, and enemy fire became intense, Lt. Col.
    Lucas ordered all members of the rescue party to safety. Then, at great personal
    risk, he continued the rescue effort amid concentrated enemy mortar fire, intense
    heat, and exploding ammunition until the aircraft was completely engulfed in flames.
    Lt. Col. Lucas was mortally wounded while directing the successful withdrawal
    of his battalion from the fire base. His actions throughout this extended period
    inspired his men to heroic efforts, and were instrumental in saving the lives
    of many of his fellow soldiers while inflicting heavy casualties on the enemy.
    Lt. Col. Lucas' conspicuous gallantry and intrepidity in action, at the cost of
    his own life, were in keeping with the highest traditions of the military service
    and reflect great credit on him, his unit and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 8
  day: 19
  year: 1970
  title: Corporal Frank R. Fratellenico earns Medal of Honor (posthumous)
  body: "<p>On August 19, 1970, Corporal Frank R. Fratellenico, a rifleman with Company
    B, was with his squad when it was pinned down by intensive fire from two well-fortified
    enemy bunkers. Fratellenico maneuvered forward and, using hand grenades, neutralized
    the first bunker, which was occupied by a number of enemy soldiers. While attacking
    the second bunker he was struck by enemy fire, fell to the ground, and dropped
    a grenade he had been preparing to throw.</p><p>Fratellenico retrieved the grenade
    and fell on it an instant before it exploded. He was killed, and four comrades
    nearby were spared death or serious injury. His unit went on to overrun the enemy
    position.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Frank R. Fratellenico (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: Corporal. Fratellenico distinguished himself while serving as a rifleman
    with Company B. Corporal. Fratellenico's squad was pinned down by intensive fire
    from 2 well-fortified enemy bunkers. At great personal risk Corporal. Fratellenico
    maneuvered forward and, using hand grenades, neutralized the first bunker which
    was occupied by a number of enemy soldiers. While attacking the second bunker,
    enemy fire struck Corporal. Fratellenico, causing him to fall to the ground and
    drop a grenade which he was preparing to throw. Alert to the imminent danger to
    his comrades, Corporal. Fratellenico retrieved the grenade and fell upon it an
    instant before it exploded. His heroic actions prevented death or serious injury
    to 4 of his comrades nearby and inspired his unit which subsequently overran the
    enemy position. Corporal. Fratellenico's conspicuous gallantry, extraordinary
    heroism, and intrepidity at the cost of his life, above and beyond the call of
    duty, are in keeping with the highest traditions of the military service and reflect
    great credit on him, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 9
  day: 7
  year: 1970
  title: Staff Sergeant Glenn H. English, Jr. earns Medal of Honor (posthumous)
  body: "<p>On September 7, 1970, Staff Sergeant Glenn H. English, Jr. was riding
    in the lead armored personnel carrier of a four-vehicle column when an enemy mine
    exploded in front of his vehicle. As the vehicle swerved off the road, a concealed
    enemy force waiting in ambush opened fire with automatic weapons and anti-tank
    grenades, striking it several times and setting it on fire. English escaped from
    the disabled vehicle and, without stopping to put out the flames on his clothing,
    rallied his stunned unit and led it in an assault on the entrenched enemy position
    under heavy automatic weapons fire. The assault routed the enemy.</p><p>After
    the assault English heard the cries of three men still trapped inside the burning
    carrier. Disregarding warnings that its ammunition and fuel might explode at any
    moment, he ran to the vehicle and climbed inside. As he was lifting one of the
    men to safety, the vehicle exploded, mortally wounding English and the man he
    was trying to save.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Glenn H. English, Jr. (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: S/Sergeant. English was riding in the lead armored personnel carrier
    in a 4-vehicle column when an enemy mine exploded in front of his vehicle. As
    the vehicle swerved from the road, a concealed enemy force waiting in ambush opened
    fire with automatic weapons and anti-tank grenades, striking the vehicle several
    times and setting it on fire. S/Sergeant. English escaped from the disabled vehicle
    and, without pausing to extinguish the flames on his clothing, rallied his stunned
    unit. He then led it in a vigorous assault, in the face of heavy enemy automatic
    weapons fire, on the entrenched enemy position. This prompt and courageous action
    routed the enemy and saved his unit from destruction. Following the assault, S/Sergeant.
    English heard the cries of 3 men still trapped inside the vehicle. Paying no heed
    to warnings that the ammunition and fuel in the burning personnel carrier might
    explode at any moment, S/Sergeant. English raced to the vehicle and climbed inside
    to rescue his wounded comrades. As he was lifting 1 of the men to safety, the
    vehicle exploded, mortally wounding him and the man he was attempting to save.
    By his extraordinary devotion to duty, indomitable courage, and utter disregard
    for his own safety, S/Sergeant. English saved his unit from destruction and selflessly
    sacrificed his life in a brave attempt to save 3 comrades. S/Sergeant. English's
    conspicuous gallantry and intrepidity in action at the cost of his life were an
    inspiration to his comrades and are in the highest traditions of the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 9
  day: 14
  year: 1970
  title: Sergeant Gary M. Rose earns Medal of Honor (posthumous)
  body: "<p>On September 14, 1970, Sergeant Gary M. Rose, a Special Forces Medic with
    a company-sized exploitation force of the 5th Special Forces Group (Airborne),
    1st Special Forces, was in the fourth day of a continuous engagement, begun September
    11, with a numerically superior hostile force deep in enemy controlled territory.
    Over those days Rose had sprinted fifty meters under fire to a wounded soldier,
    shielded him while treating him, and carried him to cover; had kept working after
    a B-40 rocket injured his head, hand, and foot; and had treated wounded estimated
    at half the company.</p><p>During the helicopter extraction on September 14 the
    enemy launched a full scale offensive. Rose loaded wounded onto the first helicopters,
    returned to the perimeter under fire to carry casualties, and helped repel the
    enemy until the final helicopter arrived. When its Marine door gunner was shot
    in the neck, Rose treated him and saved his life. That helicopter crashed a few
    hundred meters away, injuring Rose further; he pulled the wounded from the burning
    wreckage and treated them until another helicopter arrived.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Gary M. Rose (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty, Sergeant Gary M. Rose distinguished himself by acts
    of gallantry and intrepidity while serving as a Special Forces Medic with a company-sized
    exploitation force, Special Operations Augmentation, Command and Control Central,
    5th Special Forces Group (Airborne), 1st Special Forces, Republic of Vietnam.
    Between 11 and 14 September 1970, Sergeant Rose’s company was continuously engaged
    by a well-armed and numerically superior hostile force deep in enemy controlled
    territory. Enemy B-40 rockets and mortar rounds rained down while the foe sprayed
    the area with small arms, automatic weapons, and machine gun fire, wounding many
    and forcing everyone to seek cover. Sergeant Rose, braving the hail of bullets,
    sprinted fifty meters to a wounded Soldier’s side. He then used his own body to
    protect the casualty from further injury while treating his wounds. After stabilizing
    the casualty, Sergeant Rose carried him through the bullet-ridden combat zone
    to protective cover. As the enemy accelerated their attack, Sergeant Rose continuously
    exposed himself to intense fire as he fearlessly moved from casualty to casualty,
    administering life-saving aid. A B-40 rocket impacted just meters from Sergeant
    Rose, knocking him from his feet and injuring his head, hand, and foot. Ignoring
    his wounds, Sergeant Rose struggled to his feet and continued to render aid to
    the other injured Soldiers. During the attempted Medevac, Sergeant Rose again
    exposed himself to enemy fire as he attempted to hoist wounded personnel up to
    the hovering helicopter, which was unable to land due to unsuitable terrain. The
    Medevac mission was aborted due to intense enemy fire and the helicopter crashed
    a few miles away due to the enemy fire sustained during the attempted extraction.
    Over the next two days, Sergeant Rose continued to expose himself to enemy fire
    in order to treat the wounded, which was estimated at half of the company’s personnel.
    On September 14, during the company’s helicopter extraction, the enemy launched
    a full scale offensive. Sergeant Rose, after loading wounded personnel on the
    first set of extraction helicopters, returned to the outer perimeter under enemy
    fire, carrying friendly casualties and moving wounded personnel to more secure
    positions until they could be evacuated. He then returned to the perimeter to
    help repel the enemy until the final extraction helicopter arrived. As the final
    helicopter was loaded, the enemy began to overrun their position and the Marine
    door gunner was shot in the neck. Sergeant Rose instantly administered critical
    medical treatment saving the Marine’s life. The extraction helicopter crashed
    a few hundred meters from the evacuation point, further injuring the personnel
    on board, including Sergeant Rose. Despite his numerous wounds from the past three
    days, Sergeant Rose continued to pull and carry unconscious and wounded personnel
    out of the burning wreckage and continued to administer aid to the wounded until
    another extraction helicopter arrived. Sergeant Rose’s extraordinary heroism and
    selflessness above and beyond the call of duty were critical to saving numerous
    lives over that four day time period. His actions are in keeping with the highest
    traditions of military service and reflect great credit upon himself, the 1st
    Special Forces, and the United States Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 2
  day: 18
  year: 1971
  title: Specialist Five Dennis M. Fujii earns Medal of Honor
  body: "<p>On February 18, 1971, Specialist Five Dennis M. Fujii, crew chief aboard
    a helicopter ambulance of the 237th Medical Detachment, 61st Medical Battalion,
    67th Medical Group, began a rescue operation in Laos that continued through February
    22. The mission was to evacuate seriously wounded Vietnamese military personnel
    from a raging battlefield. Enemy flak brought the aircraft down on its second
    landing attempt, injuring Fujii. Another helicopter extracted the rest of the
    crew, but Fujii could not board under the fire and waved it out, remaining as
    the only American on the battlefield.</p><p>Fujii secured a radio and treated
    allied casualties through the next day. When a reinforced enemy regiment assaulted
    the perimeter on the night of February 19, he called in helicopter gunships and
    for more than seventeen hours left his entrenchment to direct air strikes, at
    times firing his rifle at close quarters. A helicopter lifted him out on February
    20 but was hit and crash landed at a South Vietnamese Ranger base, where he stayed
    until another helicopter returned him to Phau Bai on February 22.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Dennis M. Fujii (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: 'For conspicuous gallantry and intrepidity at the risk of his life
    above and beyond the call of duty: Specialist Five Dennis M. Fujii distinguished
    himself by conspicuous gallantry and intrepidity beyond the call of duty while
    serving as crew chief aboard a helicopter ambulance during rescue operations in
    Laos, Republic of Vietnam, during the period of 18 to 22 February 1971. Specialist
    Five Fujii was serving with the 237th Medical Detachment, 61st Medical Battalion,
    67th Medical Group. The team''s mission was to evacuate seriously wounded Vietnamese
    military personnel from the midst of a raging battlefield. The aircraft''s primary
    approach to the bullet-infested landing zone was thwarted by heavy volumes of
    enemy fire directed at the specialist''s helicopter. As the pilot made a second
    landing attempt, the enemy concentrated a barrage of flak at the air ambulance
    which damaged the craft and caused it to crash in the conflict area, injuring
    Specialist Five Fujii. Moments later, another American helicopter successfully
    landed near the wreckage of the specialist''s airship and extracted all the downed
    crewmen except for Specialist Five Fujii, who was unable to board due to the intense
    enemy fire directed at him. Rather than further endanger the lives of his comrades
    aboard the second helicopter, Specialist Five Fujii waved the craft out of the
    combat area and remained behind as the only American on the battlefield. Subsequent
    attempts to rescue the specialist were aborted due to the violent anti­aircraft
    fire. Specialist Five Fujii finally secured a radio and informed the aviators
    in the area that the landing zone was too hot for further evacuation attempts.
    During the night and all through the next day, Specialist Five Fujii disregarded
    his own wounds as he administered first aid to the allied casualties. On the night
    of 19 February, the allied perimeter came under ruthless assault by a reinforced
    enemy regiment supported by heavy artillery. Once again obtaining a radio transmitter,
    Specialist Five Fujii called in American helicopter gunships to assist the small
    unit in repelling the attack. For a period of over seventeen consecutive hours,
    Specialist Five Fujii repeatedly exposed himself to hostile fire as he left the
    security of his entrenchment to better observe enemy troop positions and to direct
    air strikes against them. At times the fighting became so vicious that Specialist
    Five Fujii was forced to interrupt radio transmittal in order to place suppressive
    rifle fire on the enemy while at close quarters. Though wounded and severely fatigued
    by 20 February, the specialist bore the responsibility for the protection and
    defense of the friendly encampment until an American helicopter could land and
    attempt to airlift him from the area. As his air ambulance left the battlefield,
    it received numerous hits and was forced to crash land at another South Vietnamese
    Ranger base approximately four kilometers from the specialist''s original location.
    The totally exhausted Specialist Five Fujii remained at the allied camp for two
    more days until yet another helicopter could return him to Phau Bai for medical
    assistance on 22 February. Specialist Five Fujii''s extraordinary heroism and
    devotion to duty were in keeping with the highest traditions of military service
    and reflect great credit upon himself, his unit, and the United States Army'
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 2
  day: 23
  year: 1971
  title: Specialist Fourth Class Larry G. Dahl earns Medal of Honor (posthumous)
  body: "<p>On February 23, 1971, Specialist Fourth Class Larry G. Dahl was serving
    as a machine gunner on a gun truck near An Khe, Binh Dinh Province. His truck
    and two other gun trucks were sent to help defend a convoy that had been ambushed
    by an enemy force. The gun trucks entered the battle zone and engaged the attackers
    with heavy machine gun fire, causing a large number of casualties, and after a
    brief period of intense fighting the attack subsided.</p><p>As the gun trucks
    prepared to return to their normal escort duties, an enemy hand grenade was thrown
    into Dahl's truck. Dahl called a warning to his companions and threw himself directly
    onto the grenade. He was killed, and the other members of the truck crew survived.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Larry G. Dahl (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: Sp4c. Dahl distinguished himself by conspicuous gallantry and intrepidity
    while serving as a machine gunner on a gun truck near An Khe, Binh Dinh Province.
    The gun truck in which Sp4c. Dahl was riding was sent with 2 other gun trucks
    to assist in the defense of a convoy that had been ambushed by an enemy force.
    The gun trucks entered the battle zone and engaged the attacking enemy troops
    with a heavy volume of machine gun fire, causing a large number of casualties.
    After a brief period of intense fighting the attack subsided. As the gun trucks
    were preparing to return to their normal escort duties, an enemy hand grenade
    was thrown into the truck in which Sp4c. Dahl was riding. Instantly realizing
    the great danger, Sp4c. Dahl called a warning to his companions and threw himself
    directly onto the grenade. Through his indomitable courage, complete disregard
    for his safety, and profound concern for his fellow soldiers, Sp4c. Dahl saved
    the lives of the other members of the truck crew while sacrificing his own. Sp4c.
    Dahl's conspicuous gallantry, extraordinary heroism, and intrepidity at the cost
    of his life, above and beyond the call of duty, are in keeping with the highest
    traditions of the military service and reflect great credit on himself, his unit
    and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 2
  day: 26
  year: 1971
  title: Captain Jon E. Swanson earns Medal of Honor (posthumous)
  body: "<p>On February 26, 1971, Captain Jon E. Swanson was flying an OH-6A aircraft
    in support of ARVN Task Force 333 in the Kingdom of Cambodia, tasked with pinpointing
    the positions of two well-equipped enemy regiments known to be in the area. Flying
    at treetop level and slow airspeed, Swanson engaged enemy bunkers that had opened
    heavy automatic weapons fire on the advancing ARVN unit from 100 meters to its
    front, destroying five with concussion grenades and machine gun fire. Out of heavy
    ordnance, he marked a .51 caliber machine gun position with smoke and directed
    a Cobra gun ship attack, then killed an enemy soldier crawling over to man the
    still-intact weapon.</p><p>His aircraft took several hits from a second .51 caliber
    machine gun; Swanson engaged it, marked it, and directed another Cobra attack.
    Low on ammunition, his aircraft crippled, he volunteered to continue and was flying
    toward a third .51 caliber position when his aircraft exploded in the air and
    crashed, killing him. The citation credits him with at least eight enemy killed
    and three anti-aircraft weapons destroyed.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Jon E. Swanson (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: 'for conspicuous gallantry and intrepidity at the risk of his life
    above and beyond the call of duty: Captain Jon E. Swanson distinguished himself
    by acts of bravery on February 26, 1971, while flying an OH-6A aircraft in support
    of ARVN Task Force 333 in the Kingdom of Cambodia. With two well-equipped enemy
    regiments known to be in the area, Captain Swanson was tasked with pinpointing
    the enemy''s precise positions. Captain Swanson flew at treetop level at a slow
    airspeed, making his aircraft a vulnerable target. The advancing ARVN unit came
    under heavy automatic weapons fire from enemy bunkers 100 meters to their front.
    Exposing his aircraft to enemy anti-aircraft fire, Captain Swanson immediately
    engaged the enemy bunkers with concussion grenades and machine gun fire. After
    destroying five bunkers and evading intense ground-to-air fire, he observed a
    .51 caliber machine gun position. With all his heavy ordnance expended on the
    bunkers, he did not have sufficient explosives to destroy the position. Consequently,
    he marked the position with a smoke grenade and directed a Cobra gun ship attack.
    After completion of the attack, Captain Swanson found the weapon still intact
    and an enemy soldier crawling over to man it. He immediately engaged the individual
    and killed him. During this time, his aircraft sustained several hits from another
    .51 caliber machine gun. Captain Swanson engaged the position with his aircraft''s
    weapons, marked the target, and directed a second Cobra gun ship attack. He volunteered
    to continue the mission, despite the fact that he was now critically low on ammunition
    and his aircraft was crippled by enemy fire. As Captain Swanson attempted to fly
    toward another .51 caliber machine gun position, his aircraft exploded in the
    air and crashed to the ground, causing his death. Captain Swanson''s courageous
    actions resulted in at least eight enemy killed and the destruction of three enemy
    anti-aircraft weapons. Captain Swanson''s extraordinary heroism and devotion to
    duty are in keeping with the highest traditions of military service and reflect
    great credit upon himself, his unit, and the United States Army.'
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 3
  day: 23
  year: 1971
  title: Specialist Fourth Class Michael John Fitzmaurice earns Medal of Honor
  body: "<p>On March 23, 1971, Specialist Fourth Class Michael John Fitzmaurice of
    3d Platoon, Troop D, was occupying a bunker at Khe Sanh with three fellow soldiers
    when a company of North Vietnamese sappers infiltrated the area. At the start
    of the attack Fitzmaurice saw three explosive charges that had been thrown into
    the bunker. He hurled two of them out, then threw his flak vest and himself over
    the third, absorbing the blast and shielding the other soldiers.</p><p>Despite
    serious multiple wounds and partial loss of sight, Fitzmaurice charged out of
    the bunker and engaged the enemy until his rifle was damaged by the blast of an
    enemy hand grenade. While searching for another weapon he overcame an enemy sapper
    in hand-to-hand combat, then returned to his fighting position with a new weapon
    and inflicted more casualties on the attackers. Though seriously wounded, he refused
    medical evacuation and stayed at his post. The citation credits him with contributing
    to the successful defense of the position and saving the lives of a number of
    fellow soldiers.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Michael John Fitzmaurice (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sp4c. Fitzmaurice, 3d Platoon, Troop
    D, distinguished himself at Khe Sanh. Sp4c. Fitzmaurice and 3 fellow soldiers
    were occupying a bunker when a company of North Vietnamese sappers infiltrated
    the area. At the onset of the attack Sp4c. Fitzmaurice observed 3 explosive charges
    which had been thrown into the bunker by the enemy. Realizing the imminent danger
    to his comrades, and with complete disregard for his personal safety, he hurled
    2 of the charges out of the bunker. He then threw his flak vest and himself over
    the remaining charge. By this courageous act he absorbed the blast and shielded
    his fellow-soldiers. Although suffering from serious multiple wounds and partial
    loss of sight, he charged out of the bunker, and engaged the enemy until his rifle
    was damaged by the blast of an enemy hand grenade. While in search of another
    weapon, Sp4c. Fitzmaurice encountered and overcame an enemy sapper in hand-to-hand
    combat. Having obtained another weapon, he returned to his original fighting position
    and inflicted additional casualties on the attacking enemy. Although seriously
    wounded, Sp4c. Fitzmaurice refused to be medically evacuated, preferring to remain
    at his post. Sp4c. Fitzmaurice's extraordinary heroism in action at the risk of
    his life contributed significantly to the successful defense of the position and
    resulted in saving the lives of a number of his fellow soldiers. These acts of
    heroism go above and beyond the call of duty, are in keeping with the highest
    traditions of the military service, and reflect great credit on Sp4c. Fitzmaurice
    and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 3
  day: 31
  year: 1971
  title: First Lieutenant Brian Miles Thacker earns Medal of Honor
  body: "<p>On March 31, 1971, First Lieutenant Brian Miles Thacker, Field Artillery,
    Battery A, was team leader of an Integrated Observation System collocated with
    elements of two Army of the Republic of Vietnam units at Fire Base 6 when a numerically
    superior North Vietnamese Army force launched a dawn attack on the small, isolated,
    hilltop base. Using rockets, grenades, flame-throwers, and automatic weapons,
    the enemy penetrated the perimeter and fought the defenders hand to hand. Through
    the morning and early afternoon Thacker rallied the U.S. and Republic of Vietnam
    soldiers and spent four hours in an exposed observation position directing air
    strikes and artillery fire on the attackers.</p><p>By late afternoon the position
    was untenable, and Thacker organized the withdrawal of the remaining friendly
    forces. He stayed inside the perimeter alone, covering their escape with his M-16
    rifle, then called friendly artillery fire onto his own position to give his comrades
    more time to withdraw. Wounded and unable to get away, he eluded the enemy for
    eight days until friendly forces retook the fire base.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Brian Miles Thacker (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. 1st Lt. Thacker, Field Artillery,
    Battery A, distinguished himself while serving as the team leader of an Integrated
    Observation System collocated with elements of 2 Army of the Republic of Vietnam
    units at Fire Base 6. A numerically superior North Vietnamese Army force launched
    a well-planned, dawn attack on the small, isolated, hilltop fire base. Employing
    rockets, grenades, flame-throwers, and automatic weapons, the enemy forces penetrated
    the perimeter defenses and engaged the defenders in hand-to-hand combat. Throughout
    the morning and early afternoon, 1st Lt. Thacker rallied and encouraged the U.S.
    and Republic of Vietnam soldiers in heroic efforts to repulse the enemy. He occupied
    a dangerously exposed observation position for a period of 4 hours while directing
    friendly air strikes and artillery fire against the assaulting enemy forces. His
    personal bravery and inspired leadership enabled the outnumbered friendly forces
    to inflict a maximum of casualties on the attacking enemy forces and prevented
    the base from being overrun. By late afternoon, the situation had become untenable.
    1st Lt. Thacker organized and directed the withdrawal of the remaining friendly
    forces. With complete disregard for his personal safety, he remained inside the
    perimeter alone to provide covering fire with his M-16 rifle until all other friendly
    forces had escaped from the besieged fire base. Then, in an act of supreme courage,
    he called for friendly artillery fire on his own position to allow his comrades
    more time to withdraw safely from the area and, at the same time, inflict even
    greater casualties on the enemy forces. Although wounded and unable to escape
    from the area himself, he successfully eluded the enemy forces for 8 days until
    friendly forces regained control of the fire base. The extraordinary courage and
    selflessness displayed by 1st Lt. Thacker were an inspiration to his comrades
    and are in the highest traditions of the military service .
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 5
  day: 25
  year: 1971
  title: Major William E. Adams earns Medal of Honor (posthumous)
  body: "<p>On May 25, 1971, Major William E. Adams, a helicopter pilot in Kontum
    Province, volunteered to fly a lightly armed helicopter to evacuate three seriously
    wounded soldiers from a small fire base under attack by a large enemy force. He
    made the decision knowing that numerous antiaircraft weapons were positioned around
    the base and that clear weather would give the enemy gunners an unobstructed view
    of every route in. As he approached, the enemy opened fire with heavy machine
    guns, rocket-propelled grenades, and small arms. Adams continued the approach,
    directing the attacks of supporting gunships while flying the helicopter, and
    landed at the fire base despite the increasing fire. He waited until the wounded
    soldiers were placed on board.</p><p>As the aircraft left the fire base, enemy
    anti-aircraft fire struck and seriously damaged it and it began to descend. Adams
    regained control of the crippled aircraft and attempted a controlled landing,
    but the helicopter exploded, overturned, and fell to earth under enemy fire. Adams
    was killed.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, William E. Adams (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: Maj. Adams distinguished himself on 25 May 1971 while serving as a
    helicopter pilot in Kontum Province in the Republic of Vietnam. On that date,
    Maj. Adams volunteered to fly a lightly armed helicopter in an attempt to evacuate
    3 seriously wounded soldiers from a small fire base which was under attack by
    a large enemy force. He made the decision with full knowledge that numerous antiaircraft
    weapons were positioned around the base and that the clear weather would afford
    the enemy gunners unobstructed view of all routes into the base. As he approached
    the base, the enemy gunners opened fire with heavy machine guns, rocket-propelled
    grenades and small arms. Undaunted by the fusillade, he continued his approach
    determined to accomplish the mission. Displaying tremendous courage under fire,
    he calmly directed the attacks of supporting gunships while maintaining absolute
    control of the helicopter he was flying. He landed the aircraft at the fire base
    despite the ever-increasing enemy fire and calmly waited until the wounded soldiers
    were placed on board. As his aircraft departed from the fire base, it was struck
    and seriously damaged by enemy anti-aircraft fire and began descending. Flying
    with exceptional skill, he immediately regained control of the crippled aircraft
    and attempted a controlled landing. Despite his valiant efforts, the helicopter
    exploded, overturned, and plummeted to earth amid the hail of enemy fire. Maj.
    Adams' conspicuous gallantry, intrepidity, and humanitarian regard for his fellow
    man were in keeping with the most cherished traditions of the military service
    and reflected utmost credit on him and the U S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 6
  day: 5
  year: 1971
  title: Staff Sergeant Jon R. Cavaiani earns Medal of Honor
  body: "<p>On June 5, 1971, Staff Sergeant Jon R. Cavaiani, platoon leader of a security
    platoon guarding an isolated radio relay site in enemy-held territory, faced the
    second day of an attack by a superior size enemy force that had begun on the morning
    of June 4 with intense small arms, automatic weapons, rocket-propelled grenade,
    and mortar fire. That first day Cavaiani moved about the perimeter under fire,
    directing and rallying the platoon. When the platoon was ordered evacuated he
    volunteered to stay and direct the helicopters, getting a major portion of the
    platoon out on the first three before increased enemy fire forced him to remain
    overnight with the rest.</p><p>On the morning of June 5, under heavy ground fog,
    the enemy attacked in two ranks, one firing and the other throwing hand grenades.
    Unable to slow them, Cavaiani ordered the remaining men to escape while he covered
    them. He recovered a machine gun, stood up fully exposed, and fired in a sweeping
    motion along the advancing ranks. Most of the remaining platoon escaped. Cavaiani
    was wounded numerous times.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Jon R. Cavaiani (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: S/Sergeant. Cavaiani distinguished himself by conspicuous gallantry
    and intrepidity at the risk of life above and beyond the call of duty in action
    in the Republic of Vietnam on 4 and 5 June 1971 while serving as a platoon leader
    to a security platoon providing security for an isolated radio relay site located
    within enemy-held territory. On the morning of 4 June 1971, the entire camp came
    under an intense barrage of enemy small arms, automatic weapons, rocket-propelled
    grenade and mortar fire from a superior size enemy force. S/Sergeant. Cavaiani
    acted with complete disregard for his personal safety as he repeatedly exposed
    himself to heavy enemy fire in order to move about the camp's perimeter directing
    the platoon's fire and rallying the platoon in a desperate fight for survival.
    S/Sergeant. Cavaiani also returned heavy suppressive fire upon the assaulting
    enemy force during this period with a variety of weapons. When the entire platoon
    was to be evacuated, S/Sergeant. Cavaiani unhesitatingly volunteered to remain
    on the ground and direct the helicopters into the landing zone. S/Sergeant. Cavaiani
    was able to direct the first 3 helicopters in evacuating a major portion of the
    platoon. Due to intense increase in enemy fire, S/Sergeant. Cavaiani was forced
    to remain at the camp overnight where he calmly directed the remaining platoon
    members in strengthening their defenses. On the morning of S June, a heavy ground
    fog restricted visibility. The superior size enemy force launched a major ground
    attack in an attempt to completely annihilate the remaining small force. The enemy
    force advanced in 2 ranks, first firing a heavy volume of small arms automatic
    weapons and rocket-propelled grenade fire while the second rank continuously threw
    a steady barrage of hand grenades at the beleaguered force. S/Sergeant. Cavaiani
    returned a heavy barrage of small arms and hand grenade fire on the assaulting
    enemy force but was unable to slow them down. He ordered the remaining platoon
    members to attempt to escape while he provided them with cover fire. With 1 last
    courageous exertion, S/Sergeant. Cavaiani recovered a machine gun, stood up, completely
    exposing himself to the heavy enemy fire directed at him, and began firing the
    machine gun in a sweeping motion along the 2 ranks of advancing enemy soldiers.
    Through S/Sergeant. Cavaiani's valiant efforts with complete disregard for his
    safety, the majority of the remaining platoon members were able to escape. While
    inflicting severe losses on the advancing enemy force, S/Sergeant. Cavaiani was
    wounded numerous times. S/Sergeant. Cavaiani's conspicuous gallantry, extraordinary
    heroism and intrepidity at the risk of his life, above and beyond the call of
    duty, were in keeping with the highest traditions of the military service and
    reflect great credit upon himself and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 8
  day: 7
  year: 1971
  title: First Lieutenant Loren D. Hagen earns Medal of Honor (posthumous)
  body: "<p>On August 7, 1971, at approximately 0630 hours, First Lieutenant Loren
    D. Hagen was team leader of a small reconnaissance team operating deep within
    enemy-held territory when the team came under a fierce assault by a superior-sized
    enemy force using heavy small arms, automatic weapons, mortar, and rocket fire.
    Hagen returned fire and led the team in repelling the first onslaught, then moved
    his men into stronger defensive locations before the enemy struck again in an
    attempt to overrun the team. He moved constantly about the perimeter under fire,
    directing fire, rallying the members, resupplying ammunition, and returning small
    arms and hand grenade fire.</p><p>After an enemy rocket made a direct hit on one
    of the team's bunkers and destroyed it, Hagen crawled toward the wreckage to search
    for team members, though the enemy now controlled that area. Returning fire as
    he went, with rockets and grenades landing around him, he advanced on the destroyed
    bunker until he was fatally wounded by enemy small arms and automatic weapons
    fire.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Loren D. Hagen (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: 1st Lt. Hagen distinguished himself in action while serving as the
    team leader of a small reconnaissance team operating deep within enemy-held territory.
    At approximately 0630 hours on the morning of 7 August 1971 the small team came
    under a fierce assault by a superior-sized enemy force using heavy small arms,
    automatic weapons, mortar, and rocket fire. 1st Lt. Hagen immediately began returning
    small-arms fire upon the attackers and successfully led this team in repelling
    the first enemy onslaught. He then quickly deployed his men into more strategic
    defense locations before the enemy struck again in an attempt to overrun and annihilate
    the beleaguered team's members. 1st Lt. Hagen repeatedly exposed himself to- the
    enemy fire directed at him as he constantly moved about the team's perimeter,
    directing fire, rallying the members, and resupplying the team with ammunition,
    while courageously returning small arms and hand grenade fire in a valorous attempt
    to repel the advancing enemy force. The courageous actions and expert leadership
    abilities of 1st Lt. Hagen were a great source of inspiration and instilled confidence
    in the team members. After observing an enemy rocket make a direct hit on and
    destroy 1 of the team's bunkers, 1st Lt. Hagen moved toward the wrecked bunker
    in search for team members despite the fact that the enemy force now controlled
    the bunker area. With total disregard for his own personal safety, he crawled
    through the enemy fire while returning small-arms fire upon the enemy force. Undaunted
    by the enemy rockets and grenades impacting all around him, 1st Lt. Hagen desperately
    advanced upon the destroyed bunker until he was fatally wounded by enemy small
    arms and automatic weapons fire. With complete disregard for his personal safety,
    1st Lt. Hagen's courageous gallantry, extraordinary heroism, and intrepidity above
    and beyond the call of duty, at the cost of his own life, were in keeping with
    the highest traditions of the military service and reflect great credit upon him
    and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 4
  day: 13
  year: 1972
  title: Lieutenant Thomas R. Norris earns Medal of Honor
  body: "<p>On April 13, 1972, Lieutenant Thomas R. Norris completed a ground rescue
    of two downed pilots deep within heavily controlled enemy territory in Quang Tri
    Province, an operation that had begun on the night of April 10. That night Norris
    led a five-man patrol through 2,000 meters of enemy-controlled territory, found
    one of the pilots at daybreak, and returned to the Forward Operating Base (FOB).
    On April 11, after a devastating mortar and rocket attack on the small FOB, he
    led a three-man team on two unsuccessful attempts to reach the second pilot.</p><p>On
    the afternoon of April 12 a forward air controller located the pilot and notified
    Norris. Dressed as fishermen and using a sampan, Norris and one Vietnamese traveled
    through the night and found the injured pilot at dawn. They covered him with bamboo
    and vegetation and started back, evading a North Vietnamese patrol. Approaching
    the FOB they came under heavy machinegun fire; Norris called in an air strike
    that provided suppression fire and a smoke screen, and the rescue party reached
    the FOB.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Thomas R. Norris (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: Lt. Norris completed an unprecedented ground rescue of 2 downed pilots
    deep within heavily controlled enemy territory in Quang Tri Province. Lt. Norris,
    on the night of 10 April, led a 5-man patrol through 2,000 meters of heavily controlled
    enemy territory, located 1 of the downed pilots at daybreak, and returned to the
    Forward Operating Base (FOB). On 11 April, after a devastating mortar and rocket
    attack on the small FOB, Lt. Norris led a 3-man team on 2 unsuccessful rescue
    attempts for the second pilot. On the afternoon of the 12th, a forward air controller
    located the pilot and notified Lt. Norris. Dressed in fishermen disguises and
    using a sampan, Lt. Norris and 1 Vietnamese traveled throughout that night and
    found the injured pilot at dawn. Covering the pilot with bamboo and vegetation,
    they began the return journey, successfully evading a North Vietnamese patrol.
    Approaching the FOB, they came under heavy machinegun fire. Lt. Norris called
    in an air strike which provided suppression fire and a smoke screen, allowing
    the rescue party to reach the FOB. By his outstanding display of decisive leadership,
    undaunted courage, and selfless dedication in the face of extreme danger, Lt.
    Norris enhanced the finest traditions of the U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 4
  day: 14
  year: 1972
  title: Major John J. Duffy earns Medal of Honor
  body: "<p>On April 14, 1972, Major John J. Duffy, Senior Advisor to the 11th Airborne
    Battalion, 2d Brigade, Airborne Division, Army of the Republic of Vietnam, directed
    the defense of Fire Support Base Charlie, surrounded by a battalion-size enemy
    element, in an action that continued into April 15. In the two preceding days
    the battalion commander had been killed, the command post destroyed, and Duffy
    twice wounded. On April 14 he was wounded again while calling in airstrikes and
    again refused evacuation. Through repeated bombardments he stayed exposed to direct
    gunships, moved the wounded to safety, and distributed the remaining ammunition.</p><p>When
    a late-afternoon ground assault from all sides made the base untenable, Duffy
    organized a night evacuation and was the last man off, taking command when the
    acting battalion commander was wounded. In the early morning of April 15 the battalion
    was ambushed; Duffy organized defensive positions, led the evacuees to the exfiltration
    site under pursuit, marked a landing zone, and boarded last, bringing a wounded
    soldier with him and then treating a wounded door gunner.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, John J. Duffy (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: 'For conspicuous gallantry and intrepidity at the risk of his life
    above and beyond the call of duty: Major John J. Duffy distinguished himself by
    acts of gallantry and intrepidity above and beyond the call of duty while serving
    as the Senior Advisor to the 11th Airborne Battalion, 2d Brigade, Airborne Division,
    Army of the Republic of Vietnam in the Republic of Vietnam, during the period
    of 14 to 15 April 1972. In the two days preceding the events of 14 to 15 April
    1972, the commander of the 11th Airborne Battalion was killed, the battalion command
    post was destroyed, and Major Duffy was twice wounded but refused to be evacuated.
    Then on 14 April, Major Duffy directed the defense of Fire Support Base Charlie,
    which was surrounded by a battalion-size enemy element. In the morning hours,
    after a failed effort to establish a landing zone for resupply aircraft, he moved
    close to enemy anti-aircraft positions to call in airstrikes. At this time, Major
    Duffy was again wounded by fragments from a recoilless rifle round and again refused
    medical evacuation. Shortly thereafter, the enemy began an artillery bombardment
    on the base and he remained in an exposed position to direct gunships onto the
    enemy positions which eventually silenced the enemy fire. Following the bombardment,
    Major Duffy assessed the conditions on the base and personally ensured the wounded
    friendly foreign soldiers were moved to positions of relative safety and the remaining
    ammunition was appropriately distributed to the remaining defenders. Shortly thereafter,
    the enemy resumed indirect fire on the base, expending an estimated 300 rounds.
    Nevertheless, he remained in an exposed position to direct gunship fire on the
    enemy positions. In the late afternoon hours, the enemy began a ground assault
    from all sides of the firebase and Major Duffy moved from position to position
    to adjust fire, spot targets for artillery observers, and ultimately to direct
    gunship fire on a friendly position which had been compromised. As the evening
    wore on, it became clear that the defenders could not withstand the overwhelming
    enemy forces and he began to organize an evacuation of the firebase under the
    cover of night. With the goal of a complete withdrawal, Major Duffy was the last
    man off the base, remaining behind to adjust the covering fire from gunships until
    the last possible moment. When the acting battalion commander was wounded, he
    assumed command of the evacuation and maintained communication with the available
    air support to direct fire on the enemy. In the early morning hours of 15 April,
    the enemy ambushed the Battalion inflicting additional casualties and scattering
    some of the able-bodied soldiers. Major Duffy organized defensive positions during
    the ambush and ensured the friendly foreign forces could successfully repulse
    the enemy. After withstanding the ambush, he led the evacuees, many of whom were
    significantly wounded, to an established evacuation area, despite being continually
    pursued by the enemy. Upon reaching the exfiltration site, Major Duffy directed
    gunship fire on enemy positions and marked a landing zone for the helicopters.
    Only after ensuring all of the evacuees were aboard, did Major Duffy board while
    also assisting a wounded friendly foreign soldier in with him. Once on board,
    he administered aid to a helicopter door gunner who had been wounded during the
    evacuation. Major Duffy''s extraordinary heroism and selflessness above and beyond
    the call of duty were in keeping with the highest traditions of military service
    and reflect great credit upon himself, his unit, and the United States Army'
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:26Z'
- month: 6
  day: 29
  year: 1972
  title: Captain Steven L. Bennett earns Medal of Honor (posthumous)
  body: "<p>On June 29, 1972, Captain Steven L. Bennett was piloting a light aircraft
    on an artillery adjustment mission along a heavily defended route when a large
    concentration of enemy troops was seen massing to attack a friendly unit. Tactical
    air support was unavailable, and artillery support was denied because friendly
    troops were too close to the target. Bennett strafed the hostile positions himself,
    and after four passes the enemy began to retreat. On his fifth pass a surface-to-air
    missile struck the aircraft, damaging the left engine and landing gear.</p><p>With
    fire spreading in the engine, Bennett judged that recovery at a friendly airfield
    was impossible and told his observer to prepare to eject. The observer's parachute
    had been shredded by the missile. Bennett had a good parachute, but ejecting would
    have left the observer no chance of survival, so he ditched in the Gulf of Tonkin,
    knowing no pilot of that type of aircraft had survived a ditching. The impact
    cartwheeled the aircraft and crushed the front cockpit, trapping Bennett, who
    died. The observer got out and was rescued.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Steven L. Bennett (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: Capt. Bennett was the pilot of a light aircraft flying an artillery
    adjustment mission along a heavily defended segment of route structure. A large
    concentration of enemy troops was massing for an attack on a friendly unit. Capt.
    Bennett requested tactical air support but was advised that none was available.
    He also requested artillery support but this too was denied due to the close proximity
    of friendly troops to the target. Capt. Bennett was determined to aid the endangered
    unit and elected to strafe the hostile positions. After 4 such passes, the enemy
    force began to retreat. Capt. Bennett continued the attack, but, as he completed
    his fifth strafing pass, his aircraft was struck by a surface-to-air missile,
    which severely damaged the left engine and the left main landing gear. As fire
    spread in the left engine, Capt. Bennett realized that recovery at a friendly
    airfield was impossible. He instructed his observer to prepare for an ejection,
    but was informed by the observer that his parachute had been shredded by the force
    of the impacting missile. Although Capt. Bennett had a good parachute, he knew
    that if he ejected, the observer would have no chance of survival. With complete
    disregard for his own life, Capt. Bennett elected to ditch the aircraft into the
    Gulf of Tonkin, even though he realized that a pilot of this type aircraft had
    never survived a ditching. The ensuing impact upon the water caused the aircraft
    to cartwheel and severely damaged the front cockpit, making escape for Capt. Bennett
    impossible. The observer successfully made his way out of the aircraft and was
    rescued. Capt. Bennett's unparalleled concern for his companion, extraordinary
    heroism and intrepidity above and beyond the call of duty, at the cost of his
    life, were in keeping with the highest traditions of the military service and
    reflect great credit upon himself and the U.S. Air Force.
  summarized_by: Claude Fable 5.1
