- month: 5
  day: 4
  year: 1968
  title: First Lieutenant Douglas B. Fournet earns Medal of Honor (posthumous)
  body: "<p>On May 4, 1968, 1st Lt. Douglas B. Fournet was leading the 2d Platoon,
    Company B, uphill against fortified enemy positions in the A Shau Valley. Intense
    sniper fire made movement difficult. The right flank man discovered an enemy claymore
    mine covering the route of advance and shouted a warning to the others. Knowing
    the enemy would also be alerted, 1st Lt. Fournet ordered his men to take cover
    and ran uphill toward the mine, drawing a sheath knife as he approached it. He
    placed his body in front of the mine as a shield and tried to cut the control
    wires leading back to the enemy positions. As he reached for the wire, the mine
    was detonated, killing him instantly. The five men nearest the mine were slightly
    wounded; the citation credits his act with sparing his men serious injury or death.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Douglas B. Fournet (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. 1st Lt. Fournet, Infantry, distinguished
    himself in action while serving as rifle platoon leader of the 2d Platoon, Company
    B. While advancing uphill against fortified enemy positions in the A Shau Valley,
    the platoon encountered intense sniper fire, making movement very difficult. The
    right flank man suddenly discovered an enemy claymore mine covering the route
    of advance and shouted a warning to his comrades. Realizing that the enemy would
    also be alerted, 1st Lt. Fournet ordered his men to take cover and ran uphill
    toward the mine, drawing a sheath knife as he approached it. With complete disregard
    for his safety and realizing the imminent danger to members of his command, he
    used his body as a shield in front of the mine as he attempted to slash the control
    wires leading from the enemy positions to the mine. As he reached for the wire
    the mine was detonated, killing him instantly. Five men nearest the mine were
    slightly wounded, but 1st Lt. Fournet's heroic and unselfish act spared his men
    of serious injury or death. His gallantry and willing self-sacrifice are in keeping
    with the highest traditions of the military service and reflect great credit upon
    himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 5
  day: 6
  year: 1968
  title: Sergeant Robert Martin Patterson earns Medal of Honor
  body: "<p>On May 6, 1968, Sergeant Robert Martin Patterson (then Sp4c.) was a fire
    team leader in the 3d Platoon, Troop B, during an assault on a North Vietnamese
    Army battalion entrenched in a heavily fortified position. The platoon's leading
    squad was pinned down by interlocking automatic weapon and rocket propelled grenade
    fire from two enemy bunkers. Sergeant Patterson and the two other members of his
    assault team moved forward under fire and destroyed the bunkers with grenades
    and machinegun fire. Seeing his comrades fired on from a third bunker covered
    by gunners in one-man spider holes, and ignoring warnings that he was moving into
    a bunker complex, he assaulted and destroyed that position as well, then kept
    attacking the bunkers blocking his unit's advance. Working alone, he destroyed
    five enemy bunkers by rifle and grenade fire, killed eight enemy soldiers, and
    captured seven weapons. His platoon resumed the attack and penetrated the enemy
    defensive position.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Robert Martin Patterson (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sergeant. Patterson (then Sp4c.) distinguished
    himself while serving as a fire team leader of the 3d Platoon, Troop B, during
    an assault against a North Vietnamese Army battalion which was entrenched in a
    heavily fortified position. When the leading squad of the 3d Platoon was pinned
    down by heavy interlocking automatic weapon and rocket propelled grenade fire
    from 2 enemy bunkers, Sergeant. Patterson and the 2 other members of his assault
    team moved forward under a hail of enemy fire to destroy the bunkers with grenade
    and machinegun fire. Observing that his comrades were being fired on from a third
    enemy bunker covered by enemy gunners in l-man spider holes, Sergeant. Patterson,
    with complete disregard for his safety and ignoring the warning of his comrades
    that he was moving into a bunker complex, assaulted and destroyed the position.
    Although exposed to intensive small arm and grenade fire from the bunkers and
    their mutually supporting emplacements. Sergeant. Patterson continued his assault
    upon the bunkers which were impeding the advance of his unit. Sergeant. Patterson
    single-handedly destroyed by rifle and grenade fire 5 enemy bunkers, killed 8
    enemy soldiers and captured 7 weapons. His dauntless courage and heroism inspired
    his platoon to resume the attack and to penetrate the enemy defensive position.
    Sergeant. Patterson's action at the risk of his life has reflected great credit
    upon himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 5
  day: 12
  year: 1968
  title: Lieutenant Colonel Joe M. Jackson earns Medal of Honor
  body: "<p>On May 12, 1968, Lt. Col. Joe M. Jackson, piloting a C-123, volunteered
    to attempt the rescue of a three-man USAF Combat Control Team from the special
    forces camp at Kham Duc. Hostile forces had overrun the forward outpost and set
    up gun positions on the airstrip, raking the camp with small arms, mortars, light
    and heavy automatic weapons, and recoilless rifle fire. The camp was in flames,
    exploding ammunition dumps were littering the runway with debris, eight aircraft
    had been destroyed, and one aircraft still on the runway cut its usable length
    to 2,200 feet. Deteriorating weather allowed only one air strike before his landing.</p><p>Lt.
    Col. Jackson landed near the point where the team was reported to be hiding. On
    the ground his aircraft drew intense fire; a rocket landed in front of the nose
    but failed to explode. Once the combat control team was aboard, he got airborne
    through hostile fire directed across the runway in front of his aircraft.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Joe M. Jackson (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Lt. Col. Jackson distinguished himself
    as pilot of a C-123 aircraft. Lt. Col. Jackson volunteered to attempt the rescue
    of a 3-man USAF Combat Control Team from the special forces camp at Kham Duc.
    Hostile forces had overrun the forward outpost and established gun positions on
    the airstrip. They were raking the camp with small arms, mortars, light and heavy
    automatic weapons, and recoilless rifle fire. The camp was engulfed in flames
    and ammunition dumps were continuously exploding and littering the runway with
    debris. In addition, 8 aircraft had been destroyed by the intense enemy fire and
    1 aircraft remained on the runway reducing its usable length to only 2,200 feet.
    To further complicate the landing, the weather was deteriorating rapidly, thereby
    permitting only 1 air strike prior to his landing. Although fully aware of the
    extreme danger and likely failure of such an attempt. Lt. Col. Jackson elected
    to land his aircraft and attempt to rescue. Displaying superb airmanship and extraordinary
    heroism, he landed his aircraft near the point where the combat control team was
    reported to be hiding. While on the ground, his aircraft was the target of intense
    hostile fire. A rocket landed in front of the nose of the aircraft but failed
    to explode. Once the combat control team was aboard, Lt. Col. Jackson succeeded
    in getting airborne despite the hostile fire directed across the runway in front
    of his aircraft. Lt. Col. Jackson's profound concern for his fellowmen, at the
    risk of his life above and beyond the call of duty are in keeping with the highest
    traditions of the U.S. Air Force and reflect great credit upon himself, and the
    Armed Forces of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 5
  day: 13
  year: 1968
  title: Specialist Fourth Class Kenneth L. Olson earns Medal of Honor (posthumous)
  body: "<p>On May 13, 1968, Sp4c. Kenneth L. Olson, a team leader with Company A,
    was on a mission to reinforce a reconnaissance platoon heavily engaged with a
    well-entrenched Viet Cong force. After his platoon moved into the area of contact
    and overran the first line of enemy bunkers, Sp4c. Olson and another soldier moved
    ahead of the platoon to investigate a second suspected line of bunkers. Automatic
    weapons fire from an enemy position 10 meters to their front pinned them down.
    Sp4c. Olson exposed himself and threw a hand grenade into the Viet Cong position.
    When that failed to silence the fire, he rose again to assault the position. As
    he prepared to throw a second grenade he was wounded and dropped the armed grenade
    inside his own position. He threw himself on it and pulled it to his body, taking
    the full force of the explosion and dying to protect the men around him. His fellow
    soldiers renewed their efforts and defeated the enemy force.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Kenneth L. Olson (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sp4c. Olson distinguished himself
    at the cost of his life while serving as a team leader with Company A. Sp4c. Olson
    was participating in a mission to reinforce a reconnaissance platoon which was
    heavily engaged with a well-entrenched Viet Cong force. When his platoon moved
    into the area of contact and had overrun the first line of enemy bunkers, Sp4c.
    Olson and a fellow soldier moved forward of the platoon to investigate another
    suspected line of bunkers. As the 2 men advanced they were pinned down by intense
    automatic weapons fire from an enemy position 10 meters to their front. With complete
    disregard for his safety, Sp4c. Olson exposed himself and hurled a hand grenade
    into the Viet Cong position. Failing to silence the hostile fire, he again exposed
    himself to the intense fire in preparation to assault the enemy position. As he
    prepared to hurl the grenade, he was wounded, causing him to drop the activated
    device within his own position. Realizing that it would explode immediately, Sp4c.
    Olson threw himself upon the grenade and pulled it in to his body to take the
    full force of the explosion. By this unselfish action Sp4c. Olson sacrificed his
    own life to save the lives of his fellow comrades-in-arms. His extraordinary heroism
    inspired his fellow soldiers to renew their efforts and totally defeat the enemy
    force. Sp4c. Olson's profound courage and intrepidity were in keeping with the
    highest traditions of the military service and reflect great credit upon himself,
    his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 5
  day: 14
  year: 1968
  title: Platoon Sergeant Finnis D. McCleery earns Medal of Honor
  body: "<p>On May 14, 1968, Platoon Sergeant Finnis D. McCleery was leading the 1st
    platoon of Company A as part of a combined force assaulting a reinforced company
    of North Vietnamese Army regulars entrenched on Hill 352, 17 miles west of Tam
    Ky. As the platoon moved up the hill and across open ground, heavy fire from the
    fortified positions pinned it and the other friendly elements down. Platoon Sergeant
    McCleery rose from cover and began a one-man assault on the bunker complex, crossing
    60 meters of open ground under fire. Within 30 meters of the key bunker he fired
    from the hip and threw hand grenades. Wounded by shrapnel, he kept going, killed
    all the bunker's occupants, then climbed on top of it in full view of the enemy
    and shouted for his men to follow. As they moved forward he attacked along the
    bunker line, destroying each position in turn, and was wounded a second time as
    he drove the enemy from the hill. The assault he led gained control of Hill 352.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Finnis D. McCleery (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. P/Sergeant. McCleery, U.S. Army, distinguished
    himself while serving as platoon leader of the 1st platoon of Company A. A combined
    force was assigned the mission of assaulting a reinforced company of North Vietnamese
    Army regulars, well entrenched on Hill 352, 17 miles west of Tam Ky. As P/Sergeant.
    McCleery led his men up the hill and across an open area to close with the enemy,
    his platoon and other friendly elements were pinned down by tremendously heavy
    fire coming from the fortified enemy positions. Realizing the severe damage that
    the enemy could inflict on the combined force in the event that their attack was
    completely halted, P/Sergeant. McCleery rose from his sheltered position and began
    a 1-man assault on the bunker complex. With extraordinary courage, he moved across
    60 meters of open ground as bullets struck all around him and rockets and grenades
    literally exploded at his feet. As he came within 30 meters of the key enemy bunker,
    P/Sergeant. McCleery began firing furiously from the hip and throwing hand grenades.
    At this point in his assault, he was painfully wounded by shrapnel, but, with
    complete disregard for his wound, he continued his advance on the key bunker and
    killed all of its occupants. Having successfully and single-handedly breached
    the enemy perimeter, he climbed to the top of the bunker he had just captured
    and, in full view of the enemy, shouted encouragement to his men to follow his
    assault. As the friendly forces moved forward, P/Sergeant. McCleery began a lateral
    assault on the enemy bunker line. He continued to expose himself to the intense
    enemy fire as he moved from bunker to bunker, destroying each in turn. He was
    wounded a second time by shrapnel as he destroyed and routed the enemy from the
    hill. P/Sergeant. McCleery is personally credited with eliminating several key
    enemy positions and inspiring the assault that resulted in gaining control of
    Hill 352. His extraordinary heroism at the risk of his life, above and beyond
    the call of duty, was in keeping with the highest standards of the military service,
    and reflects great credit on him, the Americal Division, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 5
  day: 14
  year: 1968
  title: Private First Class James W. Fous earns Medal of Honor (posthumous)
  body: "<p>On May 14, 1968, Private First Class James W. Fous, a rifleman with Company
    E, was on a reconnaissance-in-force mission when his unit set up its perimeter
    defense for the night. He and three other American soldiers held a position in
    thick vegetation facing a woodline. Private First Class Fous detected three Viet
    Cong maneuvering toward the position, alerted the other men, and directed fire
    on the enemy soldiers, silencing two of them. The third threw a hand grenade into
    the position and escaped into the vegetation. Private First Class Fous shouted
    a warning to his comrades and leaped on the grenade, absorbing the blast with
    his body. He was killed; the three men with him survived.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, James W. Fous (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Private First Class Fous distinguished
    himself at the risk of his life while serving as a rifleman with Company E. Private
    First Class Fous was participating in a reconnaissance-in-force mission when his
    unit formed its perimeter defense for the night. Private First Class Fous, together
    with 3 other American soldiers, occupied a position in a thickly vegetated area
    facing a woodline. Private First Class Fous detected 3 Viet Cong maneuvering toward
    his position and, after alerting the other men, directed accurate fire upon the
    enemy soldiers, silencing 2 of them. The third Viet Cong soldier managed to escape
    in the thick vegetation after throwing a hand grenade into Private First Class
    Fous' position. Without hesitation, Private First Class Fous shouted a warning
    to his comrades and leaped upon the lethal explosive, absorbing the blast with
    his body to save the lives of the 3 men in the area at the sacrifice of his life.
    Private First Class Fous' extraordinary heroism at the cost of his life were in
    keeping with the highest traditions of the military service and reflect great
    credit upon himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 5
  day: 16
  year: 1968
  title: Hospital Corpsman Second Class Donald E. Ballard earns Medal of Honor
  body: "<p>On May 16, 1968, Company M was moving during the afternoon to join the
    rest of the 3d Battalion in Quang Tri Province. Hospital Corpsman Second Class
    Donald E. Ballard had treated and evacuated two heat casualties and was returning
    from the evacuation landing zone to his platoon when a North Vietnamese Army unit
    ambushed the company with automatic weapons and mortars, causing numerous casualties.
    Seeing a wounded marine, HC2c. Ballard crossed the fire-swept ground, treated
    him, and directed four marines to carry him to a position of relative safety.
    As the four prepared to move the casualty, an enemy soldier left his concealed
    position, threw a hand grenade that landed near the wounded man, and opened fire
    on the group. HC2c. Ballard shouted a warning and threw himself on the grenade
    to shield the others. It failed to detonate. He got up from it and went on treating
    other marine casualties.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Donald E. Ballard (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life and
    beyond the call of duty while serving as a HC2c. with Company M, in connection
    with operations against enemy aggressor forces. During the afternoon hours, Company
    M was moving to join the remainder of the 3d Battalion in Quang Tri Province.
    After treating and evacuating 2 heat casualties, HC2c. Ballard was returning to
    his platoon from the evacuation landing zone when the company was ambushed by
    a North Vietnamese Army unit employing automatic weapons and mortars, and sustained
    numerous casualties. Observing a wounded marine, HC2c. Ballard unhesitatingly
    moved across the fire swept terrain to the injured man and swiftly rendered medical
    assistance to his comrade. HC2c. Ballard then directed 4 marines to carry the
    casualty to a position of relative safety. As the 4 men prepared to move the wounded
    marine, an enemy soldier suddenly left his concealed position and, after hurling
    a hand grenade which landed near the casualty, commenced firing upon the small
    group of men. Instantly shouting a warning to the marines, HC2c. Ballard fearlessly
    threw himself upon the lethal explosive device to protect his comrades from the
    deadly blast. When the grenade failed to detonate, he calmly arose from his dangerous
    position and resolutely continued his determined efforts in treating other marine
    casualties. HC2c. Ballard's heroic actions and selfless concern for the welfare
    of his companions served to inspire all who observed him and prevented possible
    injury or death to his fellow marines. His courage, daring initiative, and unwavering
    devotion to duty in the face of extreme personal danger, sustain and enhance the
    finest traditions of the U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 5
  day: 16
  year: 1968
  title: Sergeant Anund C. Roark earns Medal of Honor (posthumous)
  body: "<p>On May 16, 1968, Sergeant Anund C. Roark of Company C was point squad
    leader of a small force sent to rescue 11 men in a hilltop observation post under
    heavy attack by a company-size enemy force, about 1,000 meters from the battalion
    perimeter. As the lead elements of the relief force reached the post, automatic
    weapons fire from enemy-occupied bunkers halted them. Sergeant Roark maneuvered
    his squad, repeatedly exposing himself to throw grenades and direct his men's
    fire, until they gained fire superiority and covered the withdrawal of the outpost
    and the evacuation of its casualties. Unable to overrun the position, the enemy
    swept the hilltop with small arms fire and volleys of grenades. When a grenade
    landed among his men, Sergeant Roark threw himself on it and absorbed the blast
    with his body. He was killed; the citation credits him with saving many of his
    comrades and with the successful relief of the outpost.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Anund C. Roark (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sergeant. Roark distinguished himself
    by extraordinary gallantry while serving with Company C. Sergeant. Roark was the
    point squad leader of a small force which had the mission of rescuing 11 men in
    a hilltop observation post under heavy attack by a company-size force, approximately
    1,000 meters from the battalion perimeter. As lead elements of the relief force
    reached the besieged observation post, intense automatic weapons fire from enemy
    occupied bunkers halted their movement. Without hesitation, Sergeant. Roark maneuvered
    his squad, repeatedly exposing himself to withering enemy fire to hurl grenades
    and direct the fire of his squad to gain fire superiority and cover the withdrawal
    of the outpost and evacuation of its casualties. Frustrated in their effort to
    overrun the position, the enemy swept the hilltop with small arms and volleys
    of grenades. Seeing a grenade land in the midst of his men, Sergeant. Roark, with
    complete disregard for his safety, hurled himself upon the grenade, absorbing
    its blast with his body. Sergeant. Roark's magnificent leadership and dauntless
    courage saved the lives of many of his comrades and were the inspiration for the
    successful relief of the outpost. His actions which culminated in the supreme
    sacrifice of his life were in keeping with the highest traditions of the military
    service, and reflect great credit on himself and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 5
  day: 17
  year: 1968
  title: Private First Class Robert C. Burke earns Medal of Honor (posthumous)
  body: "<p>On May 17, 1968, during Operation ALLEN BROOK, Company 1 was approaching
    a dry river bed bordered by a heavily wooded treeline near the hamlet of Le Nam
    (1) when a large, well concealed enemy force opened fire with mortars, rocket
    propelled grenades, automatic weapons, and small arms, halting the advance and
    wounding several marines. Private First Class Robert C. Burke, a machine gunner,
    seized his gun and began a series of one-man assaults on the fortified emplacements.
    He put suppressive fire on several bunkers, which let his comrades advance and
    move the wounded to safer positions. He located an automatic weapons emplacement
    and poured fire into it, killing three North Vietnamese soldiers as they tried
    to flee, then moved from position to position until his weapon malfunctioned.
    Taking a casualty's rifle and hand grenades, he attacked another pocket of resistance
    and killed two more of the enemy. When a fellow marine cleared his machine gun,
    he took it back, moved into an exposed area, and fired into the treeline until
    he fell mortally wounded.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Robert C. Burke (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty for service as a machine gunner with Company 1. While
    on Operation ALLEN BROOK, Company 1 was approaching a dry river bed with a heavily
    wooded treeline that borders the hamlet of Le Nam (1), when they suddenly came
    under intense mortar, rocket propelled grenades, automatic weapons and small-arms
    fire from a large, well concealed enemy force which halted the company's advance
    and wounded several marines. Realizing that key points of resistance had to be
    eliminated to allow the units to advance and casualties to be evacuated, Private
    First Class Burke, without hesitation, seized his machine gun and launched a series
    of 1-man assaults against the fortified emplacements. As he aggressively maneuvered
    to the edge of the steep river bank, he delivered accurate suppressive fire upon
    several enemy bunkers, which enabled his comrades to advance and move the wounded
    marines to positions of relative safety. As he continued his combative actions,
    he located an opposing automatic weapons emplacement and poured intense fire into
    the position, killing 3 North Vietnamese soldiers as they attempted to flee. Private
    First Class Burke then fearlessly moved from one position to another, quelling
    the hostile fire until his weapon malfunctioned. Obtaining a casualty's rifle
    and hand grenades, he advanced further into the midst of the enemy fire in an
    assault against another pocket of resistance, killing 2 more of the enemy. Observing
    that a fellow marine had cleared his malfunctioning machine gun he grasped his
    weapon and moved into a dangerously exposed area and saturated the hostile treeline
    until he fell mortally wounded. Private First Class Burke's gallant actions upheld
    the highest traditions of the Marine Corps and the U.S. Naval Service. He gallantly
    gave his life for his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 5
  day: 18
  year: 1968
  title: Specialist Fourth Class Peter M. Guenette earns Medal of Honor (posthumous)
  body: "<p>On May 18, 1968, Sp4c. Peter M. Guenette was a machine gunner with Company
    D as his platoon swept a suspected enemy base camp. The platoon came under light
    harassing fire from a well equipped, entrenched squad of North Vietnamese Army
    regulars serving as a delaying force at the entrance to the camp. When the platoon
    closed to within 10 meters of the fortified positions, the fire became intense.
    Sp4c. Guenette and his assistant gunner put down a base of suppressive fire, pausing
    only so the assistant could throw a grenade into a bunker. Seconds later an enemy
    grenade landed on Sp4c. Guenette's right flank. Judging that it would kill or
    wound at least four men and destroy the machine gun, he shouted a warning and
    smothered the grenade with his body, absorbing its blast. He was killed; at least
    three men were spared death or injury and his comrades kept their fire superiority.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Peter M. Guenette (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sp4c. Guenette distinguished himself
    while serving as a machine gunner with Company D, during combat operations. While
    Sp4c. Guenette's platoon was sweeping a suspected enemy base camp, it came under
    light harassing fire from a well equipped and firmly entrenched squad of North
    Vietnamese Army regulars which was serving as a delaying force at the entrance
    to their base camp. As the platoon moved within 10 meters of the fortified positions,
    the enemy fire became intense. Sp4c. Guenette and his assistant gunner immediately
    began to provide a base of suppressive fire, ceasing momentarily to allow the
    assistant gunner time to throw a grenade into a bunker. Seconds later, an enemy
    grenade was thrown to Sp4c. Guenette's right flank. Realizing that the grenade
    would kill or wound at least 4 men and destroy the machine gun, he shouted a warning
    and smothered the grenade with his body, absorbing its blast. Through his actions,
    he prevented loss of life or injury to at least 3 men and enabled his comrades
    to maintain their fire superiority. By his gallantry at the cost of his life in
    keeping with the highest traditions of the military service, Sp4c. Guenette has
    reflected great credit on himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 6
  day: 7
  year: 1968
  title: Private First Class Phill G. McDonald earns Medal of Honor (posthumous)
  body: "<p>On June 7, 1968, Private First Class Phill G. McDonald, a team leader
    with the 1st platoon of Company A, was on a combat mission when his platoon came
    under a heavy barrage of automatic weapons fire from a well concealed company-size
    enemy force. He volunteered to escort two wounded comrades to an evacuation point
    and, crawling through intense fire, destroyed with a grenade an enemy automatic
    weapon that threatened the evacuation. Back with his platoon, he volunteered again
    to provide covering fire while the platoon moved out of its exposed position.
    Enemy gunners concentrated their fire on him and seriously wounded him. Despite
    his wounds he picked up the weapon of a wounded machine gunner and covered that
    man's evacuation. When other soldiers were pinned down by a hostile machine gun
    to his front, Private First Class McDonald crawled toward it to destroy it with
    grenades, and was mortally wounded in the attempt.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Phill G. McDonald (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Private First Class McDonald distinguished
    himself while serving as a team leader with the 1st platoon of Company A. While
    on a combat mission his platoon came under heavy barrage of automatic weapons
    fire from a well concealed company-size enemy force. Volunteering to escort 2
    wounded comrades to an evacuation point, Private First Class McDonald crawled
    through intense fire to destroy with a grenade an enemy automatic weapon threatening
    the safety of the evacuation. Returning to his platoon, he again volunteered to
    provide covering fire for the maneuver of the platoon from its exposed position.
    Realizing the threat he posed, enemy gunners concentrated their fire on Private
    First Class McDonald's position, seriously wounding him. Despite his painful wounds,
    Private First Class McDonald recovered the weapon of a wounded machine gunner
    to provide accurate covering fire for the gunner's evacuation. When other soldiers
    were pinned down by a heavy volume of fire from a hostile machine gun to his front,
    Private First Class McDonald crawled toward the enemy position to destroy it with
    grenades. He was mortally wounded in this intrepid action. Private First Class
    McDonald's gallantry at the risk of his life which resulted in the saving of the
    lives of his comrades, is in keeping with the highest traditions of the military
    service and reflects great credit upon himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 6
  day: 13
  year: 1968
  title: Specialist Fifth Class John J. Kedenburg earns Medal of Honor (posthumous)
  body: "<p>On June 13, 1968, Sp5c. John J. Kedenburg was advisor to a long-range
    reconnaissance team of South Vietnamese irregular troops operating deep in enemy-held
    territory. The team was attacked and encircled by a battalion-size North Vietnamese
    Army force. Sp5c. Kedenburg took command and the team fought its way out. As it
    moved toward a helicopter extraction point, he fought a rear guard action, called
    for tactical air support and rescue helicopters, and brought the team to a preselected
    landing zone with one man unaccounted for. There he set up a perimeter defense
    and directed air strikes so helicopters could hover and drop extraction slings.</p><p>After
    half the team was lifted out, Sp5c. Kedenburg and the three remaining members
    harnessed themselves to a second helicopter's sling. As it was about to lift,
    the missing South Vietnamese team member appeared in the landing zone. Sp5c. Kedenburg
    gave the man his place in the sling, directed the pilot to leave, and kept fighting
    the enemy swarming into the landing zone, killing six before he was overpowered.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, John J. Kedenburg (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sp5c. Kedenburg, U.S. Army, Command
    and Control Detachment North, Forward Operating Base 2, 5th Special Forces Group
    (Airborne), distinguished himself while serving as advisor to a long-range reconnaissance
    team of South Vietnamese irregular troops. The team's mission was to conduct counter-guerrilla
    operations deep within enemy-held territory. prior to reaching the day's objective,
    the team was attacked and encircled by a battalion-size North Vietnamese Army
    force. Sp5c. Kedenburg assumed immediate command of the team which succeeded,
    after a fierce fight, in breaking out of the encirclement. As the team moved through
    thick jungle to a position from which it could be extracted by helicopter, Sp5c.
    Kedenburg conducted a gallant rear guard fight against the pursuing enemy and
    called for tactical air support and rescue helicopters. His withering fire against
    the enemy permitted the team to reach a preselected landing zone with the loss
    of only 1 man, who was unaccounted for. Once in the landing zone, Sp5c. Kedenburg
    deployed the team into a perimeter defense against the numerically superior enemy
    force. When tactical air support arrived, he skillfully directed air strikes against
    the enemy, suppressing their fire so that helicopters could hover over the area
    and drop slings to be used in the extraction of the team. After half of the team
    was extracted by helicopter, Sp5c. Kedenburg and the remaining 3 members of the
    team harnessed themselves to the sling on a second hovering helicopter. Just as
    the helicopter was to lift them out of the area, the South Vietnamese team member
    who had been unaccounted for after the initial encounter with the enemy appeared
    in the landing zone. Sp5c. Kedenburg unhesitatingly gave up his place in the sling
    to the man and directed the helicopter pilot to leave the area. He then continued
    to engage the enemy who were swarming into the landing zone, killing 6 enemy soldiers
    before he was overpowered. Sp5c. Kedenburg's inspiring leadership, consummate
    courage and willing self-sacrifice permitted his small team to inflict heavy casualties
    on the enemy and escape almost certain annihilation. His actions reflect great
    credit upon himself and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 6
  day: 18
  year: 1968
  title: First Lieutenant Larry L. Taylor earns Medal of Honor
  body: "<p>On June 18, 1968, First Lieutenant Larry L. Taylor commanded a light fire
    team of two Cobra helicopter gunships sent at night to support a four-man long
    range patrol team near the village of Ap Go Cong. He found the patrol surrounded
    by a larger Viet Cong force. For about 45 minutes he and his wingman made low-level,
    danger-close rocket and machine gun runs under intense ground fire, and he had
    artillery illumination rounds fired low over the village so they ignited the enemy
    positions. Nearly out of ammunition, he found the patrol's ground evacuation route
    blocked by heavy fire and circled the team, making fake gun runs with his search
    light.</p><p>Low on fuel, he decided to extract the team with his two-man Cobra,
    which had never been done. The two gunships fired their last mini-gun rounds to
    open a path to the east. The team moved 100 yards to an extraction point, where
    he landed under fire and the four men climbed onto the rocket pods and skids.
    He flew them to the nearest friendly location.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Larry L. Taylor (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: 'For conspicuous gallantry and intrepidity at the risk of his life
    above and beyond the call of duty: First Lieutenant Larry L. Taylor distinguished
    himself by acts of gallantry and intrepidity above and beyond the call of duty
    while serving with Troop D (Air), 1st Squadron, 4th Cavalry, 1st Infantry Division,
    on June 18, 1968, near the village of Ap Go Cong, Republic of Vietnam.On this
    date, First Lieutenant Taylor commanded a light fire team of two Cobra helicopter
    gunships scrambled on a nighttime mission in response to an urgent call for aerial
    fire support from a four-man long range patrol team. Upon arrival, First Lieutenant
    Taylor found the patrol team surrounded and heavily engaged by a larger Viet Cong
    force. He immediately requested illumination rounds from supporting artillery
    to assist with identifying the enemy positions. Despite intense enemy ground fire,
    he flew at a perilously low altitude placing a devastating volume of aerial rocket
    and machine gun fire on the enemy forces encircling the friendly patrol. For approximately
    45 minutes, First Lieutenant Taylor and his wingman continued to make low-level
    danger-close attack runs on the surrounding enemy positions. When enemy fire increased
    from the village of Ap Go Cong, he requested artillery rounds with lower illumination
    altitudes be fired on that portion of the village so that the burning rounds ignited
    the enemy positions. With both Cobra gunships nearly out of ammunition and the
    enemy still closing in on the patrol team, First Lieutenant Taylor flew the patrol
    team''s potential ground evacuation route, finding it unviable based on the heavy
    enemy fire encountered. Returning to the patrol team''s location, he continued
    to circle it at a low level under intense enemy fire, employing his search light
    to make fake gun runs on the enemy positions to distract them from the patrol
    team.Running low on fuel and with the patrol team nearly out of ammunition, First
    Lieutenant Taylor decided to extract the team with his two-man Cobra helicopter
    gunship, a feat never before accomplished. He directed his wingman to fire their
    remaining mini-gun rounds on the patrol team''s east flank. First Lieutenant Taylor
    then fired his own last mini-gun rounds on the enemy positions, opening an avenue
    of movement to the east for the patrol team. He directed the patrol team to move
    100 yards towards the extraction point where First Lieutenant Taylor, still under
    enemy fire, landed his helicopter and instructed the patrol team to climb aboard
    anywhere they could. With the four-man long range patrol team seated on rocket-pods
    and skids, he evacuated them to the nearest friendly location, undoubtedly saving
    their lives. First Lieutenant Taylor''s conspicuous gallantry, his profound concern
    for his fellow soldiers, and his intrepidity at the risk of his life above and
    beyond the call of duty are in keeping with the highest traditions of military
    service and reflect great credit upon himself, his unit, and the United States
    Army.For more information on First Lieutenant Larry L. Taylor , visit: www.army.mil/medalofhonor/taylor/'
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 6
  day: 19
  year: 1968
  title: Lieutenant Clyde Everett Lassen earns Medal of Honor
  body: "<p>On June 19, 1968, Lt. Clyde Everett Lassen, flying a Helicopter Support
    Squadron 7 search and rescue helicopter, launched shortly after midnight to rescue
    two downed aviators in North Vietnam. He flew over hostile terrain to the steep,
    tree-covered hill where the survivors were. Under enemy fire he landed first in
    a clear area near the base of the hill, but dense undergrowth kept the survivors
    from reaching him. With flare illumination he hovered between two trees at their
    position; when the last flares burned out, the helicopter struck a tree and began
    a sharp descent. He righted the aircraft and stayed in the area, waiting for more
    flares. After another unsuccessful illuminated attempt, with fuel low and the
    aircraft damaged, he began a further approach under continuing enemy fire. When
    illumination was lost again he turned on his landing lights and completed the
    landing, and the survivors reached the helicopter. En route to the coast he evaded
    more antiaircraft fire and landed aboard U.S.S. Jouett (DLG-29) with fuel for
    five minutes of flight remaining.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Clyde Everett Lassen (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty as pilot and aircraft commander of a search and rescue
    helicopter, attached to Helicopter Support Squadron 7, during operations against
    enemy forces in North Vietnam. Launched shortly after midnight to attempt the
    rescue of 2 downed aviators, Lt. (then Lt. (J.G.)) Lassen skillfully piloted his
    aircraft over unknown and hostile terrain to a steep, tree-covered hill on which
    the survivors had been located. Although enemy fire was being directed at the
    helicopter, he initially landed in a clear area near the base of the hill, but,
    due to the dense undergrowth, the survivors could not reach the helicopter. With
    the aid of flare illumination, Lt. Lassen successfully accomplished a hover between
    2 trees at the survivors' position Illumination was abruptly lost as the last
    of the flares were expended, and the helicopter collided with a tree, commencing
    a sharp descent. Expertly righting his aircraft and maneuvering clear, Lt. Lassen
    remained in the area, determined to make another rescue attempt, and encouraged
    the downed aviators while awaiting resumption of flare illumination. After another
    unsuccessful, illuminated rescue attempt, and with his fuel dangerously low and
    his aircraft significantly damaged, he launched again and commenced another approach
    in the face of the continuing enemy opposition. When flare illumination was again
    lost, Lt. Lassen, fully aware of the dangers in clearly revealing his position
    to the enemy, turned on his landing lights and completed the landing. On this
    attempt, the survivors were able to make their way to the helicopter. En route
    to the coast he encountered and successfully evaded additional hostile antiaircraft
    fire and, with fuel for only 5 minutes of flight remaining, landed safely aboard
    U.S.S. Jouett (DLG-29).
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 6
  day: 28
  year: 1968
  title: Specialist Fourth Class Hector Santiago-Colon earns Medal of Honor (posthumous)
  body: "<p>On June 28, 1968, Sp4c. Hector Santiago-Colon, a gunner in the mortar
    platoon of Company B, was on perimeter sentry duty when he heard movement in the
    heavily wooded area to his front and flanks. He alerted the other sentries to
    move to their foxholes and watch for enemy probes. Heavy automatic weapons and
    small-arms fire then broke out from the woods; in the darkness only muzzle flashes
    showed where the enemy was. Sp4c. Santiago-Colon and the men in his position fought
    back with hand grenades, antipersonnel mines, and small-arms fire. Under cover
    of the heavy fire and exploding grenades, a North Vietnamese soldier crawled undetected
    to the position and lobbed a hand grenade into the foxhole. With no time to throw
    it out, Sp4c. Santiago-Colon pulled the grenade to his stomach and turned away
    from his comrades, absorbing the full blast. He was killed; the men who shared
    his foxhole survived and fought on until the enemy withdrew from the perimeter.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Hector Santiago-Colon (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sp4c. Santiago-Colon distinguished
    himself at the cost of his life while serving as a gunner in the mortar platoon
    of Company B. While serving as a perimeter sentry, Sp4c. Santiago-Colon heard
    distinct movement in the heavily wooded area to his front and flanks. Immediately
    he alerted his fellow sentries in the area to move to their foxholes and remain
    alert for any enemy probing forces. From the wooded area around his position heavy
    enemy automatic weapons and small-arms fire suddenly broke out, but extreme darkness
    rendered difficult the precise location and identification of the hostile force.
    Only the muzzle flashes from enemy weapons indicated their position. Sp4c. Santiago-Colon
    and the other members of his position immediately began to repel the attackers,
    utilizing hand grenades, antipersonnel mines and small-arms fire. Due to the heavy
    volume of enemy fire and exploding grenades around them, a North Vietnamese soldier
    was able to crawl, undetected, to their position. Suddenly, the enemy soldier
    lobbed a hand grenade into Sp4c. Santiago-Colon's foxhole. Realizing that there
    was no time to throw the grenade out of his position, Sp4c. Santiago-Colon retrieved
    the grenade, tucked it in to his stomach and, turning away from his comrades,
    absorbed the full impact of the blast. His heroic self-sacrifice saved the lives
    of those who occupied the foxhole with him, and provided them with the inspiration
    to continue fighting until they had forced the enemy to retreat from the perimeter.
    By his gallantry at the cost of his life and in the highest traditions of the
    military service, Sp4c. Santiago-Colon has reflected great credit upon himself,
    his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 6
  day: 29
  year: 1968
  title: Specialist Fourth Class Frank A. Herda earns Medal of Honor
  body: "<p>On June 29, 1968, Sp4c. Frank A. Herda (then Private First Class), a grenadier
    with Company A, was in a battalion-size night defensive perimeter when a large
    enemy force attacked. While other enemy elements fired diversionary and indirect
    fire from the west, a sapper force of about 30 men armed with hand grenades and
    small charges attacked Company A's perimeter from the east. In their last, violent
    assault, five sappers charged the position held by Sp4c. Herda and two comrades,
    one of whom lay wounded and helpless in the bottom of the foxhole. Sp4c. Herda
    fired at the attackers until they were within 10 feet and one of their grenades
    landed in the foxhole. He fired a last round from his grenade launcher, hitting
    one of the enemy soldiers in the head, and then covered the grenade with his body.
    The explosion wounded him grievously, but his two comrades escaped serious injury
    and the remaining defender killed the other sappers.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Frank A. Herda (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sp4c. Herda (then Private First Class)
    distinguished himself while serving as a grenadier with Company A. Company A was
    part of a battalion-size night defensive perimeter when a large enemy force initiated
    an attack on the friendly units. While other enemy elements provided diversionary
    fire and indirect weapons fire to the west, a sapper force of approximately 30
    men armed with hand grenades and small charges attacked Company A's perimeter
    from the east. As the sappers were making a last, violent assault, 5 of them charged
    the position defended by Sp4c. Herda and 2 comrades, 1 of whom was wounded and
    lay helpless in the bottom of the foxhole. Sp4c. Herda fired at the aggressors
    until they were within 10 feet of his position and 1 of their grenades landed
    in the foxhole. He fired 1 last round from his grenade launcher, hitting 1 of
    the enemy soldiers in the head, and then, with no concern for his safety, Sp4c.
    Herda immediately covered the blast of the grenade with his body. The explosion
    wounded him grievously, but his selfless action prevented his 2 comrades from
    being seriously injured or killed and enabled the remaining defender to kill the
    other sappers. By his gallantry at the risk of his life in the highest traditions
    of the military service, Sp4c. Herda has reflected great credit on himself, his
    unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 7
  day: 28
  year: 1968
  title: Hospital Corpsman Third Class Wayne Maurice Caron earns Medal of Honor (posthumous)
  body: "<p>On July 28, 1968, Hospital Corpsman Third Class Wayne Maurice Caron was
    platoon corpsman with Company K on a sweep through an open rice field when the
    unit began receiving enemy small arms fire. Seeing two marines fall, he ran forward
    to give first aid and found them dead. The platoon then came under intense small-arms
    and automatic weapons fire and took more casualties. Moving toward the wounded,
    HC3c. Caron was hit in the arm and knocked to the ground. He got up and reached
    the first marine, who was grievously wounded, and treated him; the citation credits
    that aid with saving the man's life. Running toward a second wounded marine, he
    was hit again, in the leg, crawled the rest of the way, and treated that man as
    well. As he started toward a third wounded marine he was struck again by small-arms
    fire. He kept trying to reach the third man until an enemy rocket round killed
    him.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Wayne Maurice Caron (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as platoon corpsman with Company K,
    during combat operations against enemy forces. While on a sweep through an open
    rice field HC3c. Caron's unit started receiving enemy small arms fire. Upon seeing
    2 marine casualties fall, he immediately ran forward to render first aid, but
    found that they were dead. At this time, the platoon was taken under intense small-arms
    and automatic weapons fire, sustaining additional casualties. As he moved to the
    aid of his wounded comrades, HC3c. Caron was hit in the arm by enemy fire. Although
    knocked to the ground, he regained his feet and continued to the injured marines.
    He rendered medical assistance to the first marine he reached, who was grievously
    wounded, and undoubtedly was instrumental in saving the man's life. HC3c. Caron
    then ran toward the second wounded marine, but was again hit by enemy fire, this
    time in the leg. Nonetheless, he crawled the remaining distance and provided medical
    aid for this severely wounded man. HC3c. Caron started to make his way to yet
    another injured comrade, when he was again struck by enemy small-arms fire. Courageously
    and with unbelievable determination, HC3c. Caron continued his attempt to reach
    the third marine until he was killed by an enemy rocket round. His inspiring valor,
    steadfast determination and selfless dedication in the face of extreme danger,
    sustain and enhance the finest traditions of the U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 8
  day: 12
  year: 1968
  title: Lance Corporal Kenneth L. Worley earns Medal of Honor (posthumous)
  body: "<p>On August 12, 1968, Lance Corporal Kenneth L. Worley, a machine gunner
    with Company L, 3d Battalion, was with a patrol that had set up a night ambush
    position in a house in the Bo Ban hamlet of Quang Nam Province. Security was posted
    and the rest of the patrol slept until their watches. In the early morning hours
    the platoon leader's warning that grenades had landed in the house woke the marines.
    Lance Corporal Worley threw himself on the grenade nearest him and his comrades
    and absorbed the full force of its explosion with his body. He was killed. Five
    of his fellow marines received minor wounds as the other grenades exploded; the
    citation credits him with saving the others from serious injury and possible loss
    of life.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Kenneth L. Worley (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a machine gunner with Company L,
    3d Battalion, in action against enemy forces. After establishing a night ambush
    position in a house in the Bo Ban, Hamlet of Quang Nam Province, security was
    set up and the remainder of the patrol members retired until their respective
    watch. During the early morning hours the marines were abruptly awakened by the
    platoon leader's warning that "grenades" had landed in the house. Fully realizing
    the inevitable result of his actions, L/Corporal. Worley, in a valiant act of
    heroism, instantly threw himself upon the grenade nearest him and his comrades,
    absorbing with his body, the full and tremendous force of the explosion. Through
    his extraordinary initiative and inspiring valor in the face of almost certain
    death, he saved his comrades from serious injury and possible loss of life although
    5 of his fellow marines incurred minor wounds as the other grenades exploded.
    L/Corporal. Worley's gallant actions upheld the highest traditions of the Marine
    Corps and the U.S. Naval Service. He gallantly gave his life for his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 8
  day: 20
  year: 1968
  title: Staff Sergeant Paul Ronald Lambers earns Medal of Honor
  body: "<p>On August 20, 1968, the 3d platoon, Company A, had set up a night defensive
    position across a suspected enemy infiltration route when an estimated Viet Cong
    battalion attacked. The platoon leader fell seriously wounded in the first onslaught
    and Staff Sergeant Paul Ronald Lambers (then Sergeant) took command. He got the
    platoon radio and moved to the command post to direct the defense. When that radio
    was knocked out, he crossed the fire-swept position for the 90mm recoilless rifle
    crew's radio. He helped repair the recoilless rifle and directed canister fire
    at point-blank range into attackers who had breached the defensive wire. When
    that weapon was knocked out, he repulsed a penetration alone with claymore mines
    and grenades, killing four more Viet Cong. Over the five-hour battle he moved
    from position to position, directed artillery and helicopter fire to within 5
    meters of the perimeter, redistributed ammunition, and moved the seriously wounded
    to shelter. The platoon's defense virtually annihilated a far larger enemy force
    and helped thwart an enemy offensive against Tay Ninh City.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Paul Ronald Lambers (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. S/Sergeant. (then Sergeant.) Lambers
    distinguished himself in action while serving with the 3d platoon, Company A.
    The unit had established a night defensive position astride a suspected enemy
    infiltration route, when it was attacked by an estimated Viet Cong battalion.
    During the initial enemy onslaught, the platoon leader fell seriously wounded
    and S/Sergeant. Lambers assumed command of the platoon. Disregarding the intense
    enemy fire, S/Sergeant. Lambers left his covered position, secured the platoon
    radio and moved to the command post to direct the defense. When his radio became
    inoperative due to enemy action, S/Sergeant. Lambers crossed the fire swept position
    to secure the 90mm recoilless rifle crew's radio in order to re-establish communications.
    Upon discovering that the 90mm recoilless rifle was not functioning, S/Sergeant.
    Lambers assisted in the repair of the weapon and directed canister fire at point-blank
    range against the attacking enemy who had breached the defensive wire of the position.
    When the weapon was knocked out by enemy fire, he single-handedly repulsed a penetration
    of the position by detonating claymore mines and throwing grenades into the midst
    of the attackers, killing 4 more of the Viet Cong with well aimed hand grenades.
    S/Sergeant. Lambers maintained command of the platoon elements by moving from
    position to position under the hail of enemy fire, providing assistance where
    the assault was the heaviest and by his outstanding example inspiring his men
    to the utmost efforts of courage. He displayed great skill and valor throughout
    the 5-hour battle by personally directing artillery and helicopter fire, placing
    them at times within 5 meters of the defensive position. He repeatedly exposed
    himself to hostile fire at great risk to his own life in order to redistribute
    ammunition and to care for seriously wounded comrades and to move them to sheltered
    positions. S/Sergeant. Lambers' superb leadership, professional skill and magnificent
    courage saved the lives of his comrades, resulted in the virtual annihilation
    of a vastly superior enemy force and were largely instrumental in thwarting an
    enemy offensive against Tay Ninh City. His gallantry at the risk of his life is
    in keeping with the highest traditions of the military service and reflects great
    credit upon himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 8
  day: 21
  year: 1968
  title: Staff Sergeant Marvin R. Young earns Medal of Honor (posthumous)
  body: "<p>On August 21, 1968, Company C was on a reconnaissance mission in the vicinity
    of Ben Cui when an estimated regimental-size North Vietnamese Army force engaged
    it. The first volley pinned down the point element of the 1st Platoon, caused
    several casualties, and killed the acting platoon leader. Staff Sergeant Marvin
    R. Young, a squad leader, took command of the platoon and organized a defensive
    position. As a human wave attack advanced, he moved from position to position,
    encouraging his men and directing their fire. Ordered to withdraw to a better
    position, he stayed behind to cover the withdrawal. Seeing part of the point squad
    unable to pull back, he moved toward it, firing, and was critically wounded in
    the head halfway there. He ordered the element to withdraw and stayed with it
    as it fought to the rear, taking serious wounds to his arm and leg. His leg badly
    shattered, he refused help that would slow his comrades, ordered them on, and
    covered their withdrawal until the enemy engulfed his position. He was killed.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Marvin R. Young (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. S/Sergeant. Young distinguished himself
    at the cost of his life while serving as a squad leader with Company C. While
    conducting a reconnaissance mission in the vicinity of Ben Cui, Company C was
    suddenly engaged by an estimated regimental-size force of the North Vietnamese
    Army. During the initial volley of fire the point element of the 1st Platoon was
    pinned down, sustaining several casualties, and the acting platoon leader was
    killed. S/Sergeant. Young unhesitatingly assumed command of the platoon and immediately
    began to organize and deploy his men into a defensive position in order to repel
    the attacking force. As a human wave attack advanced on S/Sergeant. Young's platoon,
    he moved from position to position, encouraging and directing fire on the hostile
    insurgents while exposing himself to the hail of enemy bullets. After receiving
    orders to withdraw to a better defensive position, he remained behind to provide
    covering fire for the withdrawal. Observing that a small element of the point
    squad was unable to extract itself from its position, and completely disregarding
    his personal safety, S/Sergeant. Young began moving toward their position, firing
    as he maneuvered. When halfway to their position he sustained a critical head
    injury, yet he continued his mission and ordered the element to withdraw. Remaining
    with the squad as it fought its way to the rear, he was twice seriously wounded
    in the arm and leg. Although his leg was badly shattered, S/Sergeant. Young refused
    assistance that would have slowed the retreat of his comrades, and he ordered
    them to continue their withdrawal while he provided protective covering fire.
    With indomitable courage and heroic self-sacrifice, he continued his self-assigned
    mission until the enemy force engulfed his position. By his gallantry at the cost
    of his life are in the highest traditions of the military service, S/Sergeant.
    Young has reflected great credit upon himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 8
  day: 25
  year: 1968
  title: Sergeant William W. Seay earns Medal of Honor (posthumous)
  body: "<p>On August 25, 1968, Sergeant William W. Seay was a driver in a 62d Transportation
    Company convoy carrying ammunition and supplies from Long Binh to Tay Ninh when
    a reinforced North Vietnamese Army battalion ambushed it. When the convoy was
    forced to stop, he took cover behind the wheels of a vehicle loaded with high-explosive
    ammunition. As the assault came within 10 meters of the road he killed two of
    the enemy, then killed a sniper in a tree 75 meters away. When an enemy grenade
    landed under an ammunition trailer near him, he left cover, picked it up, and
    threw it back, killing four more. He threw back a second grenade that landed about
    3 meters away. Wounded in the right wrist, he kept directing and encouraging the
    men around him. He then saw three enemy soldiers inside the position preparing
    to fire on his comrades. Weak from loss of blood, his right hand immobilized,
    he stood and killed all three with his rifle fired left-handed. A sniper's bullet
    then mortally wounded him.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, William W. Seay (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sergeant. Seay distinguished himself
    while serving as a driver with the 62d Transportation Company, on a resupply mission.
    The convoy with which he was traveling, carrying critically needed ammunition
    and supplies from Long Binh to Tay Ninh, was ambushed by a reinforced battalion
    of the North Vietnamese Army. As the main elements of the convoy entered the ambush
    killing zone, they were struck by intense rocket, machinegun and automatic weapon
    fire from the well concealed and entrenched enemy force. When his convoy was forced
    to stop, Sergeant. Seay immediately dismounted and took a defensive position behind
    the wheels of a vehicle loaded with high-explosive ammunition. As the violent
    North Vietnamese assault approached to within 10 meters of the road, Sergeant.
    Seay opened fire, killing 2 of the enemy. He then spotted a sniper in a tree approximately
    75 meters to his front and killed him. When an enemy grenade was thrown under
    an ammunition trailer near his position, without regard for his own safety he
    left his protective cover, exposing himself to intense enemy fire, picked up the
    grenade, and threw it back to the North Vietnamese position, killing 4 more of
    the enemy and saving the lives of the men around him. Another enemy grenade landed
    approximately 3 meters from Sergeant. Seay's position. Again Sergeant. Seay left
    his covered position and threw the armed grenade back upon the assaulting enemy.
    After returning to his position he was painfully wounded in the right wrist; however,
    Sergeant. Seay continued to give encouragement and direction to his fellow soldiers.
    After moving to the relative cover of a shallow ditch, he detected 3 enemy soldiers
    who had penetrated the position and were preparing to fire on his comrades. Although
    weak from loss of blood and with his right hand immobilized, Sergeant. Seay stood
    up and fired his rifle with his left hand, killing all 3 and saving the lives
    of the other men in his location. As a result of his heroic action, Sergeant.
    Seay was mortally wounded by a sniper's bullet. Sergeant. Seay, by his gallantry
    in action at the cost of his life, has reflected great credit upon himself, his
    unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 8
  day: 26
  year: 1968
  title: Staff Sergeant Nicky Daniel Bacon earns Medal of Honor
  body: "<p>On August 26, 1968, Staff Sergeant Nicky Daniel Bacon was a squad leader
    with the 1st Platoon, Company B, on an operation west of Tam Ky. When the company
    came under fire from an enemy bunker line to its front, he organized his men and
    led them forward in an assault, destroying a bunker with grenades. As he did so,
    several soldiers, including the 1st Platoon leader, were hit by machine gun fire
    and fell wounded in the open ahead of the platoon. Staff Sergeant Bacon took command
    of the platoon and assaulted the gun position alone, killing its crew. When the
    3d Platoon reached his location and its leader was also wounded, he took charge
    of that platoon too and continued the fight, killing four more enemy soldiers
    and silencing an antitank weapon. He then climbed onto the exposed deck of a tank
    and directed fire into the enemy position while several wounded men were evacuated.
    The company was able to move forward, eliminate the enemy positions, and rescue
    the men trapped to the front.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Nicky Daniel Bacon (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. S/Sergeant. Bacon distinguished himself
    while serving as a squad leader with the 1st Platoon, Company B, during an operation
    west of Tam Ky. When Company B came under fire from an enemy bunker line to the
    front, S/Sergeant. Bacon quickly organized his men and led them forward in an
    assault. He advanced on a hostile bunker and destroyed it with grenades. As he
    did so, several fellow soldiers including the 1st Platoon leader, were struck
    by machine gun fire and fell wounded in an exposed position forward of the rest
    of the platoon. S/Sergeant. Bacon immediately assumed command of the platoon and
    assaulted the hostile gun position, finally killing the enemy gun crew in a single-handed
    effort. When the 3d Platoon moved to S/Sergeant. Bacon's location, its leader
    was also wounded. Without hesitation S/Sergeant. Bacon took charge of the additional
    platoon and continued the fight. In the ensuing action he personally killed 4
    more enemy soldiers and silenced an antitank weapon. Under his leadership and
    example, the members of both platoons accepted his authority without question.
    Continuing to ignore the intense hostile fire, he climbed up on the exposed deck
    of a tank and directed fire into the enemy position while several wounded men
    were evacuated. As a result of S/Sergeant. Bacon's extraordinary efforts, his
    company was able to move forward, eliminate the enemy positions, and rescue the
    men trapped to the front. S/Sergeant. Bacon's bravery at the risk of his life
    was in the highest traditions of the military service and reflects great credit
    upon himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 9
  day: 1
  year: 1968
  title: Colonel William A. Jones, III earns Medal of Honor (posthumous)
  body: "<p>On September 1, 1968, Col. William A. Jones, III, piloting an A-1H Skyraider,
    was on-scene commander in the attempted rescue of a downed U.S. pilot near Dong
    Hoi, North Vietnam. After an explosion beneath his aircraft filled the cockpit
    with smoke, he continued the search and sighted the survivor and a multiple-barrel
    gun position atop a karst formation. Holding fire on that pass to protect the
    pilot, he attacked the gun on two more. On the second, rounds ignited the Yankee
    Extraction System rocket behind his headrest and flames engulfed the cockpit.
    He pulled the extraction handle, but the burned-out rocket motor did not pull
    him from the aircraft.</p><p>With severe burns to his arms, hands, neck, shoulders,
    and face, Col. Jones climbed and tried to radio the positions of the survivor
    and the gun. Other aircraft's calls to bail out blocked his transmissions; then
    his transmitters failed. He flew the damaged aircraft back to base, landed, and
    passed the information to a debriefing officer while on the operating table. The
    downed pilot was rescued later that day.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, William A. Jones, III (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Col. Jones distinguished himself as
    the pilot of an A-1H Skyraider aircraft near Dong Hoi, North Vietnam. On that
    day, as the on-scene commander in the attempted rescue of a downed U.S. pilot,
    Col. Jones' aircraft was repeatedly hit by heavy and accurate antiaircraft fire.
    On one of his low passes, Col. Jones felt an explosion beneath his aircraft and
    his cockpit rapidly filled with smoke. With complete disregard of the possibility
    that his aircraft might still be burning, he unhesitatingly continued his search
    for the downed pilot. On this pass, he sighted the survivor and a multiple-barrel
    gun position firing at him from near the top of a karst formation. He could not
    attack the gun position on that pass for fear he would endanger the downed pilot.
    Leaving himself exposed to the gun position, Col. Jones attacked the position
    with cannon and rocket fire on 2 successive passes. On his second pass, the aircraft
    was hit with multiple rounds of automatic weapons fire. One round impacted the
    Yankee Extraction System rocket mounted directly behind the headrest, igniting
    the rocket. His aircraft was observed to burst into flames in the center fuselage
    section, with flames engulfing the cockpit area. He pulled the extraction handle,
    jettisoning the canopy. The influx of fresh air made the fire burn with greater
    intensity for a few moments, but since the rocket motor had already burned, the
    extraction system did not pull Col. Jones from the aircraft. Despite searing pains
    from severe burns sustained on his arms, hands, neck, shoulders, and face, Col.
    Jones pulled his aircraft into a climb and attempted to transmit the location
    of the downed pilot and the enemy gun position to the other aircraft in the area.
    His calls were blocked by other aircraft transmissions repeatedly directing him
    to bail out and within seconds his transmitters were disabled and he could receive
    only on 1 channel. Completely disregarding his injuries, he elected to fly his
    crippled aircraft back to his base and pass on essential information for the rescue
    rather than bail out. Col. Jones successfully landed his heavily damaged aircraft
    and passed the information to a debriefing officer while on the operating table.
    As a result of his heroic actions and complete disregard for his personal safety,
    the downed pilot was rescued later in the day. Col. Jones' profound concern for
    his fellow man at the risk of his life, above and beyond the call of duty, are
    in keeping with the highest traditions of the U.S. Air Force and reflect great
    credit upon himself and the Armed Forces of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 9
  day: 18
  year: 1968
  title: Private First Class Dewayne T. Williams earns Medal of Honor (posthumous)
  body: "<p>On September 18, 1968, Private First Class Dewayne T. Williams, a rifleman
    with the 1st Platoon, Company H, was on a combat patrol sent to set up positions
    from which to intercept and destroy enemy sniper teams in the company's area of
    operations. That night, as the patrol prepared to move from its daylight position
    to a preselected night position, an enemy squad ambushed it with small arms and
    hand grenades. Severely wounded in the back by the close fire, Private First Class
    Williams began crawling forward toward a good firing position. Under the continuing
    fire he heard a patrol member call out that an enemy grenade had landed in their
    position. Seeing that it lay close to him, he rolled on top of it as it exploded
    and absorbed the full impact with his body. He was killed; the rest of the patrol
    escaped serious injury, defeated the attackers, and held their position until
    assistance arrived.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Dewayne T. Williams (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a rifleman with the 1st Platoon,
    Company H, in action against communist insurgent forces. Private First Class Williams
    was a member of a combat patrol sent out from the platoon with the mission of
    establishing positions in the company's area of operations, from which it could
    intercept and destroy enemy sniper teams operating in the area. In the night as
    the patrol was preparing to move from its daylight position to a preselected night
    position, it was attacked from ambush by a squad of enemy using small arms and
    hand grenades. Although severely wounded in the back by the close intense fire,
    Private First Class Williams, recognizing the danger to the patrol, immediately
    began to crawl forward toward a good firing position. While he was moving under
    the continuing intense fire, he heard one of the members of the patrol sound the
    alert that an enemy grenade had landed in their position. Reacting instantly to
    the alert, he saw that the grenade had landed close to where he was Lying and
    without hesitation, in a valiant act of heroism, rolled on top of the grenade
    as it exploded, absorbing the full and tremendous impact of the explosion with
    his body. Through his extraordinary initiative and inspiring valor in the face
    of certain death, he saved the other members of his patrol from serious injury
    and possible loss of life, and enabled them to successfully defeat the attackers
    and hold their position until assistance arrived. His personal heroism and devotion
    to duty upheld the highest traditions of the Marine Corps and the U.S. Naval Service.
    He gallantly gave his life for his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 11
  day: 1
  year: 1968
  title: Lieutenant Colonel Charles Calvin Rogers earns Medal of Honor
  body: "<p>On November 1, 1968, Lt. Col. Charles Calvin Rogers was commanding the
    1st Battalion in the defense of a forward fire support base. Early that morning
    the base came under heavy mortar, rocket, and rocket propelled grenade fire while
    a human wave assault, led by sappers who breached the barriers with bangalore
    torpedoes, penetrated the perimeter. He moved through the bursting rounds, rallied
    the dazed artillery crewmen to their howitzers, and directed their fire. Knocked
    down and wounded by an exploding round, he led a small counterattack against an
    enemy element inside the howitzer positions, was wounded a second time, and drove
    the enemy out. Refusing treatment, he reestablished the defenses.</p><p>When a
    second human wave attack struck another sector, he led a second counterattack
    that repulsed it. At dawn a third assault came. He joined the surviving crew of
    a howitzer to return it to action. A heavy mortar round exploding on the gun position's
    parapet seriously wounded him. Too badly hurt to lead in person, he kept directing
    his men until the attack failed.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Charles Calvin Rogers (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Lt. Col. Rogers, Field Artillery,
    distinguished himself in action while serving as commanding officer, 1st Battalion,
    during the defense of a forward fire support base. In the early morning hours,
    the fire support base was subjected to a concentrated bombardment of heavy mortar,
    rocket and rocket propelled grenade fire. Simultaneously the position was struck
    by a human wave ground assault, led by sappers who breached the defensive barriers
    with bangalore torpedoes and penetrated the defensive perimeter. Lt. Col. Rogers
    with complete disregard for his safety moved through the hail of fragments from
    bursting enemy rounds to the embattled area. He aggressively rallied the dazed
    artillery crewmen to man their howitzers and he directed their fire on the assaulting
    enemy. Although knocked to the ground and wounded by an exploding round, Lt. Col.
    Rogers sprang to his feet and led a small counterattack force against an enemy
    element that had penetrated the howitzer positions. Although painfully wounded
    a second time during the assault, Lt. Col. Rogers pressed the attack killing several
    of the enemy and driving the remainder from the positions. Refusing medical treatment,
    Lt. Col. Rogers reestablished and reinforced the defensive positions. As a second
    human wave attack was launched against another sector of the perimeter, Lt. Col.
    Rogers directed artillery fire on the assaulting enemy and led a second counterattack
    against the charging forces. His valorous example rallied the beleaguered defenders
    to repulse and defeat the enemy onslaught. Lt. Col. Rogers moved from position
    to position through the heavy enemy fire, giving encouragement and direction to
    his men. At dawn the determined enemy launched a third assault against the fire
    base in an attempt to overrun the position. Lt. Col. Rogers moved to the threatened
    area and directed lethal fire on the enemy forces. Seeing a howitzer inoperative
    due to casualties, Lt. Col. Rogers joined the surviving members of the crew to
    return the howitzer to action. While directing the position defense, Lt. Col.
    Rogers was seriously wounded by fragments from a heavy mortar round which exploded
    on the parapet of the gun position. Although too severely wounded to physically
    lead the defenders, Lt. Col. Rogers continued to give encouragement and direction
    to his men in the defeating and repelling of the enemy attack. Lt. Col. Rogers'
    dauntless courage and heroism inspired the defenders of the fire support base
    to the heights of valor to defeat a determined and numerically superior enemy
    force. His relentless spirit of aggressiveness in action are in the highest traditions
    of the military service and reflects great credit upon himself, his unit, and
    the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 11
  day: 13
  year: 1968
  title: Staff Sergeant Laszlo Rabel earns Medal of Honor (posthumous)
  body: "<p>On November 13, 1968, Staff Sergeant Laszlo Rabel was leading Team Delta,
    74th Infantry Detachment, which at 1000 hours was in a defensive perimeter conducting
    reconnaissance of enemy trail networks. A member of the team detected enemy movement
    to the front. As Staff Sergeant Rabel and a comrade prepared to clear the area,
    he heard an incoming grenade land in the midst of the team's perimeter. He threw
    himself on the grenade and covered it with his body, taking the full impact of
    the explosion. He was killed; the other members of Team Delta were spared death
    or injury.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Laszlo Rabel (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. S/Sergeant. Rabel distinguished himself
    while serving as leader of Team Delta, 74th Infantry Detachment. At 1000 hours
    on this date, Team Delta was in a defensive perimeter conducting reconnaissance
    of enemy trail networks when a member of the team detected enemy movement to the
    front. As S/Sergeant. Rabel and a comrade prepared to clear the area, he heard
    an incoming grenade as it landed in the midst of the team's perimeter. With complete
    disregard for his life, S/Sergeant. Rabel threw himself on the grenade and, covering
    it with his body, received the complete impact of the immediate explosion. Through
    his indomitable courage, complete disregard for his safety and profound concern
    for his fellow soldiers, S/Sergeant. Rabel averted the loss of life and injury
    to the other members of Team Delta. By his gallantry at the cost of his life in
    the highest traditions of the military service, S/Sergeant. Rabel has reflected
    great credit upon himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 11
  day: 20
  year: 1968
  title: Corporal Michael J. Crescenz earns Medal of Honor (posthumous)
  body: "<p>On November 20, 1968, Corporal Michael J. Crescenz, a rifleman with Company
    A, was with his unit when it engaged a large, well-entrenched North Vietnamese
    Army force in the morning. The enemy's first burst of fire pinned down the lead
    squad, killed the two point men, and halted the company's advance. Corporal Crescenz
    left his position, seized a nearby machine gun, and charged 100 meters up a slope
    toward the enemy bunkers, silencing them and killing the two occupants of each.
    Under heavy machine gun fire he moved on to a third bunker, silenced it, and killed
    two more of the enemy, clearing the route of advance for his comrades. Intense
    machine gun fire then erupted from an unseen, camouflaged bunker. Corporal Crescenz
    advanced on it with his machine gun and was within 5 meters when its fire mortally
    wounded him. The company was then able to maneuver freely, complete its mission,
    and defeat the enemy.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Michael J. Crescenz (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: Corporal. Crescenz distinguished himself by conspicuous gallantry and
    intrepidity in action while serving as a rifleman with Company A. In the morning
    his unit engaged a large, well-entrenched force of the North Vietnamese Army whose
    initial burst of fire pinned down the lead squad and killed the 2 point men, halting
    the advance of Company A. Immediately, Corporal. Crescenz left the relative safety
    of his own position, seized a nearby machine gun and, with complete disregard
    for his safety, charged 100 meters up a slope toward the enemy's bunkers which
    he effectively silenced, killing the 2 occupants of each. Undaunted by the withering
    machine gun fire around him, Corporal. Crescenz courageously moved forward toward
    a third bunker which he also succeeded in silencing, killing 2 more of the enemy
    and momentarily clearing the route of advance for his comrades. Suddenly, intense
    machine gun fire erupted from an unseen, camouflaged bunker. Realizing the danger
    to his fellow soldiers, Corporal. Crescenz disregarded the barrage of hostile
    fire directed at him and daringly advanced toward the position. Assaulting with
    his machine gun, Corporal. Crescenz was within 5 meters of the bunker when he
    was mortally wounded by the fire from the enemy machine gun. As a direct result
    of his heroic actions, his company was able to maneuver freely with minimal danger
    and to complete its mission, defeating the enemy. Corporal. Crescenz's bravery
    and extraordinary heroism at the cost of his life are in the highest traditions
    of the military service and reflect great credit on himself, his unit, and the
    U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 11
  day: 26
  year: 1968
  title: Captain James P. Fleming earns Medal of Honor
  body: "<p>On November 26, 1968, Capt. James P. Fleming (then 1st Lt.), aircraft
    commander of a UH-1F transport helicopter, went to the aid of a six-man special
    forces long range reconnaissance patrol in danger of being overrun by a large,
    heavily armed hostile force. Knowing that one helicopter had already been downed
    by the intense fire, Capt. Fleming descended and balanced his helicopter on a
    river bank with the tail boom hanging over open water. The patrol could not get
    through to the landing site and he was forced to withdraw. Though dangerously
    low on fuel, he repeated the landing maneuver and held the exposed position. Hostile
    fire crashed through his windscreen as the patrol boarded. Capt. Fleming took
    off through a barrage of fire and recovered safely at a forward base.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, James P. Fleming (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Capt. Fleming (then 1st Lt.) distinguished
    himself as the Aircraft Commander of a UH-1F transport Helicopter. Capt. Fleming
    went to the aid of a 6-man special forces long range reconnaissance patrol that
    was in danger of being overrun by a large, heavily armed hostile force. Despite
    the knowledge that 1 helicopter had been downed by intense hostile fire, Capt.
    Fleming descended, and balanced his helicopter on a river bank with the tail boom
    hanging over open water. The patrol could not penetrate to the landing site and
    he was forced to withdraw. Dangerously low on fuel, Capt. Fleming repeated his
    original landing maneuver. Disregarding his own safety, he remained in this exposed
    position. Hostile fire crashed through his windscreen as the patrol boarded his
    helicopter. Capt. Fleming made a successful takeoff through a barrage of hostile
    fire and recovered safely at a forward base. Capt. Fleming's profound concern
    for his fellowmen, and at the risk of his life above and beyond the call of duty
    are in keeping with the highest traditions of the U.S. Air Force and reflect great
    credit upon himself and the Armed Forces of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 12
  day: 3
  year: 1968
  title: Sergeant John Noble Holcomb earns Medal of Honor (posthumous)
  body: "<p>On December 3, 1968, Sergeant John Noble Holcomb was a squad leader in
    Company D, which had landed by helicopter and taken up a hasty defensive position
    when a battalion-size enemy force attacked from three sides, his squad directly
    in the path of the main attack. Under heavy fire he moved among his men, directing
    their fire. When his machine gunner was knocked out, he took the weapon to the
    forward edge of the position and fired until the enemy withdrew. He carried his
    wounded to safety and reorganized his sector despite a grass fire set off by enemy
    rounds. He broke a second assault from the forward machine gun.</p><p>During the
    enemy withdrawal a rocket hit his position, destroying the gun and severely wounding
    him. He crawled through the grass fire to move his squad, every man of it wounded,
    to safer positions. As the last surviving leader of his platoon, he crawled to
    the platoon radio and reported a third enemy assault; the supporting fires it
    brought broke the attack. He died of his wounds.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, John Noble Holcomb (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sergeant. Holcomb distinguished himself
    while serving as a squad leader in Company D during a combat assault mission.
    Sergeant. Holcomb's company assault had landed by helicopter and deployed into
    a hasty defensive position to organize for a reconnaissance-in-force mission when
    it was attacked from 3 sides by an estimated battalion-size enemy force. Sergeant.
    Holcomb's squad was directly in the path of the main enemy attack. With complete
    disregard for the heavy fire, Sergeant. Holcomb moved among his men giving encouragement
    and directing fire on the assaulting enemy. When his machine gunner was knocked
    out, Sergeant. Holcomb seized the weapon, ran to a forward edge of the position,
    and placed withering fire on the enemy. His gallant actions caused the enemy to
    withdraw. Sergeant. Holcomb treated and carried his wounded to a position of safety
    and reorganized his defensive sector despite a raging grass fire ignited by the
    incoming enemy mortar and rocket rounds. When the enemy assaulted the position
    a second time, Sergeant. Holcomb again manned the forward machine gun, devastating
    the enemy attack and forcing the enemy to again break contact and withdraw. During
    the enemy withdrawal an enemy rocket hit Sergeant. Holcomb's position, destroying
    his machine gun and severely wounding him. Despite his painful wounds, Sergeant.
    Holcomb crawled through the grass fire and exploding mortar and rocket rounds
    to move the members of his squad, everyone of whom had been wounded, to more secure
    positions. Although grievously wounded and sustained solely by his indomitable
    will and courage, Sergeant. Holcomb as the last surviving leader of his platoon
    organized his men to repel the enemy, crawled to the platoon radio and reported
    the third enemy assault on his position. His report brought friendly supporting
    fires on the charging enemy and broke the enemy attack. Sergeant. Holcomb's inspiring
    leadership, fighting spirit, in action at the cost of his life were in keeping
    with the highest traditions of the military service and reflect great credit on
    himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 12
  day: 8
  year: 1968
  title: Sergeant Candelario Garcia earns Medal of Honor
  body: "<p>On December 8, 1968, Sergeant Candelario Garcia was acting team leader
    for Company B, 1st Battalion, 2d Infantry, 1st Brigade, 1st Infantry Division,
    during combat operations in Lai Khe. While on reconnaissance, his platoon found
    communication wire and other signs of an enemy base camp leading into a densely
    vegetated area. As the men advanced they came under intense fire; several were
    hit and trapped in the open. Sergeant Garcia crawled to within ten meters of a
    machinegun bunker, got to his feet, and ran straight at it, firing his rifle as
    he charged. He jammed two hand grenades into the gun port and then put the muzzle
    of his weapon inside, killing all four occupants. Still under intense fire, he
    ran fifteen meters to a second bunker and killed its three defenders with hand
    grenades and rifle fire. After braving the enemy barrage again to rescue two casualties,
    he joined his company in an assault that overran the remaining enemy positions.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Candelario Garcia (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: 'For conspicuous gallantry and intrepidity at the risk of his life
    above and beyond the call of duty: Sergeant Candelario Garcia distinguished himself
    by acts of gallantry and intrepidity above and beyond the call of duty while serving
    as an acting Team Leader for Company B, 1st Battalion, 2d Infantry, 1st Brigade,1st
    Infantry Division during combat operations against an armed enemy in Lai Khe,
    Republic of Vietnam on December 8, 1968. On that day, while conducting reconnaissance,
    Sergeant Garcia and his platoon discovered communication wire and other signs
    of an enemy base camp leading into a densely vegetated area. As the men advanced,
    they came under intense fire. Several men were hit and trapped in the open. Ignoring
    a hail of hostile bullets, Sergeant Garcia crawled to within ten meters of a machinegun
    bunker, leaped to his feet and ran directly at the fortification, firing his rifle
    as he charged. Sergeant Garcia jammed two hand grenades into the gun port and
    then placed the muzzle of his weapon inside, killing all four occupants. Continuing
    to expose himself to intense enemy fire, Sergeant Garcia raced fifteen meters
    to another bunker and killed its three defenders with hand grenades and rifle
    fire. After again braving the enemies’ barrage in order to rescue two casualties,
    he joined his company in an assault which overran the remaining enemy positions.
    Sergeant Garcia’s extraordinary heroism and selflessness above and beyond the
    call of duty are in keeping with the highest traditions of military service and
    reflect great credit upon himself, his unit and the United States Army. Citation
    represents Soldier''s rank at time of action. For more information on Sergeant
    Candelario Garcia visit: https://www.army.mil/medalofhonor/valor24/recipients/garcia/'
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 12
  day: 8
  year: 1968
  title: Sergeant Ray McKibben earns Medal of Honor (posthumous)
  body: "<p>On December 8, 1968, Sergeant Ray McKibben was leading the point element
    of a Troop B reconnaissance patrol along a well-traveled trail when heavy automatic
    weapons fire from a fortified bunker forced the patrol to take cover. He charged
    through the brush to the bunker, killed the gunner, secured the weapon, and sent
    his element forward. Spotting enemy movement on the patrol's flank, he called
    in helicopter gunships. As the lead element rounded a river bend it came under
    fire from camouflaged bunkers. Seeing one of his men fall wounded, he ran to him
    under fire, pulled him behind a rock emplacement, and gave first aid.</p><p>With
    his comrades pinned down, he assaulted the bunkers alone again, killing the occupants
    of the first with rifle fire, then emptying his rifle and a captured weapon into
    the second before silencing it with hand grenades. He reloaded and covered his
    men's advance. Attacking a third bunker, he was mortally wounded as he closed
    on it but fired a final burst that killed the enemy and let the patrol continue.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Ray McKibben (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty, Sergeant. McKibben distinguished himself
    in action while serving as team leader of the point element of a reconnaissance
    patrol of Troop B, operating in enemy territory. Sergeant. McKibben was leading
    his point element in a movement to contact along a well-traveled trail when the
    lead element came under heavy automatic weapons fire from a fortified bunker position,
    forcing the patrol to take cover. Sergeant. McKibben, appraising the situation
    and without regard for his own safety, charged through bamboo and heavy brush
    to the fortified position, killed the enemy gunner, secured the weapon and directed
    his patrol element forward. As the patrol moved out, Sergeant. McKibben observed
    enemy movement to the flank of the patrol. Fire support from helicopter gunships
    was requested and the area was effectively neutralized. The patrol again continued
    its mission and as the lead element rounded the bend of a river it came under
    heavy automatic weapons fire from camouflaged bunkers. As Sergeant. McKibben was
    deploying his men to covered positions, he observed one of his men fall wounded.
    Although bullets were hitting all around the wounded man, Sergeant. McKibben,
    with complete disregard for his safety, sprang to his comrade's side and under
    heavy enemy fire pulled him to safety behind the cover of a rock emplacement where
    he administered hasty first aid. Sergeant. McKibben, seeing that his comrades
    were pinned down and were unable to deliver effective fire against the enemy bunkers,
    again undertook a single-handed assault of the enemy defenses. He charged through
    the brush and hail of automatic weapons fire closing on the first bunker, killing
    the enemy with accurate rifle fire and securing the enemy's weapon. He continued
    his assault against the next bunker, firing his rifle as he charged. As he approached
    the second bunker his rifle ran out of ammunition; however, he used the captured
    enemy weapon until it too was empty, at that time he silenced the bunker with
    well placed hand grenades. He reloaded his weapon and covered the advance of his
    men as they moved forward. Observing the fire of another bunker impeding the patrol's
    advance, Sergeant. McKibben again single-handedly assaulted the new position.
    As he neared the bunker he was mortally wounded but was able to fire a final burst
    from his weapon killing the enemy and enabling the patrol to continue the assault.
    Sergeant. McKibben's indomitable courage, extraordinary heroism, profound concern
    for the welfare of his fellow soldiers and disregard for his personal safety saved
    the lives of his comrades and enabled the patrol to accomplish its mission. Sergeant.
    McKibben's gallantry in action at the cost of his life above and beyond the call
    of duty are in the highest traditions of the military service and reflect great
    credit upon himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 12
  day: 8
  year: 1968
  title: Staff Sergeant Karl G. Taylor, Sr. earns Medal of Honor (posthumous)
  body: "<p>On December 8, 1968, during Operation MEADE RIVER, Staff Sergeant Karl
    G. Taylor, Sr., serving at night as company gunnery sergeant, learned that the
    commander of the lead platoon had been mortally wounded and the platoon pinned
    down by heavy enemy fire. With another marine he crawled forward through the fire
    to the platoon, shouted encouragement and instructions, and moved the men into
    covered positions. The two then crossed an open area repeatedly to bring back
    marines too badly wounded to move on their own. Learning that more seriously wounded
    men lay in another open area near an enemy machinegun position, Staff Sergeant
    Taylor led four comrades across the fire-swept ground toward them. When devastating
    fire halted the group, he sent his companions back to the company command post,
    took his grenade launcher, and charged alone across the open rice paddy at the
    machinegun position, firing as he ran. Wounded several times, he reached the bunker
    and silenced its fire moments before he was mortally wounded. The citation credits
    him with saving the lives of several marines.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Karl G. Taylor, Sr. (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving at night as a company gunnery sergeant
    during Operation MEADE RIVER. Informed that the commander of the lead platoon
    had been mortally wounded when his unit was pinned down by a heavy volume of enemy
    fire, S/Sergeant. Taylor along with another marine, crawled forward to the beleaguered
    unit through a hail of hostile fire, shouted encouragement and instructions to
    the men, and deployed them to covered positions. With his companion, he then repeatedly
    maneuvered across an open area to rescue those marines who were too seriously
    wounded to move by themselves. Upon learning that there were still other seriously
    wounded men Lying in another open area, in proximity to an enemy machinegun position,
    S/Sergeant. Taylor, accompanied by 4 comrades, led his men forward across the
    fire-swept terrain in an attempt to rescue the marines. When his group was halted
    by devastating fire, he directed his companions to return to the company command
    post; whereupon he took his grenade launcher and in full view of the enemy, charged
    across the open rice paddy toward the machinegun position, firing his weapon as
    he ran. Although wounded several times, he succeeded in reaching the machinegun
    bunker and silencing the fire from that sector, moments before he was mortally
    wounded. Directly instrumental in saving the lives of several of his fellow marines,
    S/Sergeant. Taylor, by his indomitable courage, inspiring leadership, and selfless
    dedication, upheld the highest traditions of the Marine Corps and of the U.S.
    Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 12
  day: 29
  year: 1968
  title: Private First Class David P. Nash earns Medal of Honor (posthumous)
  body: "<p>On December 29, 1968, Private First Class David P. Nash was serving as
    a grenadier with Company B on an ambush patrol in Giao Duc District. Before the
    patrol reached its destination it came under intense attack, and Nash was the
    first to return fire. From an exposed location he fired a rapid series of rounds
    from his grenade launcher, suppressing the enemy and allowing artillery fire to
    be adjusted on them.</p><p>After the enemy was routed, his small element continued
    to the ambush site, where he set up a position with three other soldiers on a
    narrow dike. Shortly past midnight, while Nash and one comrade kept watch and
    the other two slept, an enemy grenade wounded two soldiers in the adjacent position.
    Seconds later Nash saw another grenade land a few feet from his own. He could
    have rolled down the far side of the dike; he shouted a warning and leaped on
    the grenade, absorbing the blast with his body. He was killed, and the three men
    with him lived.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, David P. Nash (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Private First Class Nash distinguished
    himself while serving as a grenadier with Company B, in Giao Duc District. When
    an ambush patrol of which he was a member suddenly came under intense attack before
    reaching its destination, he was the first to return the enemy fire. Taking an
    exposed location, Private First Class Nash suppressed the hostile fusillade with
    a rapid series of rounds from his grenade launcher, enabling artillery fire to
    be adjusted on the enemy. After the foe had been routed, his small element continued
    to the ambush site where he established a position with 3 fellow soldiers on a
    narrow dike. Shortly past midnight, while Private First Class Nash and a comrade
    kept watch and the 2 other men took their turn sleeping, an enemy grenade wounded
    2 soldiers in the adjacent position. Seconds later, Private First Class Nash saw
    another grenade land only a few feet from his own position. Although he could
    have escaped harm by rolling down the other side of the dike, he shouted a warning
    to his comrades and leaped upon the lethal explosive. Absorbing the blast with
    his body, he saved the lives of the 3 men in the area at the sacrifice of his
    life. By his gallantry at the cost of his life are in the highest traditions of
    the military service, Private First Class Nash has reflected great credit on himself,
    his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 12
  day: 30
  year: 1968
  title: First Lieutenant Robert L. Howard earns Medal of Honor
  body: "<p>On December 30, 1968, Robert L. Howard, then a Sergeant First Class, was
    platoon sergeant of an American-Vietnamese platoon sent to rescue a missing American
    soldier in enemy-controlled territory. The platoon had left its helicopter landing
    zone and was moving out when an estimated two-company force attacked. In the first
    exchange Howard was wounded and his weapon was destroyed by a grenade. Seeing
    his platoon leader seriously wounded and exposed to fire, Howard, unable to walk
    and without a weapon, crawled through the fire to reach him. While he was giving
    first aid, a bullet struck an ammunition pouch on the officer's belt and detonated
    several magazines. Howard took cover briefly, then dragged the officer back toward
    the platoon.</p><p>He rallied the disorganized platoon into a defense, crawling
    from position to position to treat the wounded and direct fire on the encircling
    enemy. For three and a half hours his small force and supporting aircraft repulsed
    attacks until rescue helicopters could land. Howard supervised the loading of
    his men and left the landing zone only after all were aboard.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Robert L. Howard (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. 1st Lt. Howard (then Sergeant. 1st
    Class .), distinguished himself while serving as platoon sergeant of an American-Vietnamese
    platoon which was on a mission to rescue a missing American soldier in enemy controlled
    territory in the Republic of Vietnam. The platoon had left its helicopter landing
    zone and was moving out on its mission when it was attacked by an estimated 2-company
    force. During the initial engagement, 1st Lt. Howard was wounded and his weapon
    destroyed by a grenade explosion. 1st Lt. Howard saw his platoon leader had been
    wounded seriously and was exposed to fire. Although unable to walk, and weaponless,
    1st Lt. Howard unhesitatingly crawled through a hail of fire to retrieve his wounded
    leader. As 1st Lt. Howard was administering first aid and removing the officer's
    equipment, an enemy bullet struck 1 of the ammunition pouches on the lieutenant's
    belt, detonating several magazines of ammunition. 1st Lt. Howard momentarily sought
    cover and then realizing that he must rejoin the platoon, which had been disorganized
    by the enemy attack, he again began dragging the seriously wounded officer toward
    the platoon area. Through his outstanding example of indomitable courage and bravery,
    1st Lt. Howard was able to rally the platoon into an organized defense force.
    With complete disregard for his safety, 1st Lt. Howard crawled from position to
    position, administering first aid to the wounded, giving encouragement to the
    defenders and directing their fire on the encircling enemy. For 3 1/2 hours 1st
    Lt. Howard's small force and supporting aircraft successfully repulsed enemy attacks
    and finally were in sufficient control to permit the landing of rescue helicopters.
    1st Lt. Howard personally supervised the loading of his men and did not leave
    the bullet-swept landing zone until all were aboard safely. 1st Lt. Howard's gallantry
    in action, his complete devotion to the welfare of his men at the risk of his
    life were in keeping with the highest traditions of the military service and reflect
    great credit on himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 1
  day: 1
  year: 1969
  title: Sergeant First Class Rodney J. T. Yano earns Medal of Honor (posthumous)
  body: "<p>On January 1, 1969, Sergeant First Class Rodney J. T. Yano was crew chief
    aboard the Air Cavalry Troop's command-and-control helicopter during action against
    enemy forces entrenched in dense jungle. From an exposed position, under intense
    small arms and antiaircraft fire, he delivered suppressive fire and marked enemy
    positions with smoke and white phosphorous grenades so that his troop commander
    could direct artillery onto the emplacements.</p><p>A grenade exploded prematurely,
    covering Yano with burning phosphorous and severely wounding him. Flaming fragments
    inside the helicopter set off supplies and ammunition, and dense white smoke filled
    the aircraft, blinding the pilot and causing him to lose control. With the use
    of only one arm and partially blinded by the explosion, Yano began throwing the
    blazing ammunition out of the helicopter. He wounded himself further in doing
    so but kept at it until the danger had passed. His action averted loss of life
    and further injury to the rest of the crew. He died of his wounds.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Rodney J. T. Yano (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: Sergeant. 1st Class. Yano distinguished himself while serving with
    the Air Cavalry Troop. Sergeant. 1st Class. Yano was performing the duties of
    crew chief aboard the troop's command-and-control helicopter during action against
    enemy forces entrenched in dense jungle. From an exposed position in the face
    of intense small arms and antiaircraft fire he delivered suppressive fire upon
    the enemy forces and marked their positions with smoke and white phosphorous grenades,
    thus enabling his troop commander to direct accurate and effective artillery fire
    against the hostile emplacements. A grenade, exploding prematurely, covered him
    with burning phosphorous, and left him severely wounded. Flaming fragments within
    the helicopter caused supplies and ammunition to detonate. Dense white smoke filled
    the aircraft, obscuring the pilot's vision and causing him to lose control. Although
    having the use of only 1 arm and being partially blinded by the initial explosion,
    Sergeant. 1st Class. Yano completely disregarded his welfare and began hurling
    blazing ammunition from the helicopter. In so doing he inflicted additional wounds
    upon himself, yet he persisted until the danger was past. Sergeant. 1st Class.
    Yano's indomitable courage and profound concern for his comrades averted loss
    of life and additional injury to the rest of the crew. By his conspicuous gallantry
    at the cost of his life, in the highest traditions of the military service, Sergeant.
    1st Class. Yano has reflected great credit on himself, his unit, and the U.S.
    Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 1
  day: 6
  year: 1969
  title: Staff Sergeant Don J. Jenkins earns Medal of Honor
  body: "<p>On January 6, 1969, Don J. Jenkins, then a Private First Class, was a
    machine gunner with Company A on a reconnaissance mission when the company came
    under heavy crossfire from an enemy complex. Jenkins moved forward to an exposed
    position and opened suppressive fire. When his machine gun jammed he fired a rifle
    into the bunkers until his assistant had the gun working again. He ran and crawled
    across open ground repeatedly for ammunition until none was left, then took two
    antitank weapons alone to within 20 meters of an enemy bunker and destroyed it,
    went back for a grenade launcher, and fired from an unprotected position until
    that ammunition too was gone. He was seriously wounded by shrapnel.</p><p>He then
    moved 100 meters forward to a friendly element pinned down near the enemy, where
    earlier rescue attempts had failed at the cost of one life. In darkness and under
    fire he made three trips, each time pulling a wounded man back to safety. The
    company repulsed the attack and defeated the larger force.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Don J. Jenkins (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. S/Sergeant. Jenkins (then Private
    First Class), Company A, distinguished himself while serving as a machine gunner
    on a reconnaissance mission. When his company came under heavy crossfire from
    an enemy complex, S/Sergeant. Jenkins unhesitatingly maneuvered forward to a perilously
    exposed position and began placing suppressive fire on the enemy. When his own
    machine gun jammed, he immediately obtained a rifle and continued to fire into
    the enemy bunkers until his machine gun was made operative by his assistant. He
    exposed himself to extremely heavy fire when he repeatedly both ran and crawled
    across open terrain to obtain resupplies of ammunition until he had exhausted
    all that was available for his machine gun. Displaying tremendous presence of
    mind, he then armed himself with 2 antitank weapons and, by himself, maneuvered
    through the hostile fusillade to within 20 meters of an enemy bunker to destroy
    that position. After moving back to the friendly defensive perimeter long enough
    to secure yet another weapon, a grenade launcher, S/Sergeant. Jenkins moved forward
    to a position providing no protection and resumed placing accurate fire on the
    enemy until his ammunition was again exhausted. During this time he was seriously
    wounded by shrapnel. Undaunted and displaying great courage, he moved forward
    100 meters to aid a friendly element that was pinned down only a few meters from
    the enemy. This he did with complete disregard for his own wound and despite having
    been advised that several previous rescue attempts had failed at the cost of the
    life of 1 and the wounding of others. Ignoring the continuing intense fire and
    his painful wounds, and hindered by darkness, he made 3 trips to the beleaguered
    unit, each time pulling a wounded comrade back to safety. S/Sergeant. Jenkins'
    extraordinary valor, dedication, and indomitable spirit inspired his fellow soldiers
    to repulse the determined enemy attack and ultimately to defeat the larger force.
    S/Sergeant. Jenkins risk of his life reflect great credit upon himself, his unit,
    and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 1
  day: 11
  year: 1969
  title: Captain Harold A. Fritz earns Medal of Honor
  body: "<p>On January 11, 1969, Harold A. Fritz, then a First Lieutenant and platoon
    leader with Troop A, was leading a seven-vehicle armored column along Highway
    13 near Quan Loi to escort a truck convoy when a reinforced enemy company in ambush
    opened crossfire on the column. His vehicle was hit at once and he was seriously
    wounded. With the platoon surrounded and outnumbered, Fritz climbed onto his burning
    vehicle to direct the positioning of the remaining vehicles, then ran from vehicle
    to vehicle in view of the enemy gunners to reposition men, help the wounded, distribute
    ammunition, and direct fire.</p><p>When a strong enemy force assaulted, Fritz
    manned a machine gun and the platoon's fire broke the attack. A second force closed
    to within two meters; armed with a pistol and bayonet, Fritz led a small group
    in a charge that routed it. When a relief force arrived and deployed poorly, he
    moved through the fire to direct it, forcing the enemy to abandon the ambush site.
    He refused medical attention until all his wounded had been treated and evacuated.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Harold A. Fritz (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Capt. (then 1st Lt.) Fritz, Armor,
    U.S. Army, distinguished himself while serving as a platoon leader with Troop
    A, near Quan Loi. Capt. Fritz was leading his 7-vehicle armored column along Highway
    13 to meet and escort a truck convoy when the column suddenly came under intense
    crossfire from a reinforced enemy company deployed in ambush positions. In the
    initial attack, Capt. Fritz' vehicle was hit and he was seriously wounded. Realizing
    that his platoon was completely surrounded, vastly outnumbered, and in danger
    of being overrun, Capt. Fritz leaped to the top of his burning vehicle and directed
    the positioning of his remaining vehicles and men. With complete disregard for
    his wounds and safety, he ran from vehicle to vehicle in complete view of the
    enemy gunners in order to reposition his men, to improve the defenses, to assist
    the wounded, to distribute ammunition, to direct fire, and to provide encouragement
    to his men. When a strong enemy force assaulted the position and attempted to
    overrun the platoon, Capt. Fritz manned a machine gun and through his exemplary
    action inspired his men to deliver intense and deadly fire which broke the assault
    and routed the attackers. Moments later a second enemy force advanced to within
    2 meters of the position and threatened to overwhelm the defenders. Capt. Fritz,
    armed only with a pistol and bayonet, led a small group of his men in a fierce
    and daring charge which routed the attackers and inflicted heavy casualties. When
    a relief force arrived, Capt. Fritz saw that it was not deploying effectively
    against the enemy positions, and he moved through the heavy enemy fire to direct
    its deployment against the hostile positions. This deployment forced the enemy
    to abandon the ambush site and withdraw. Despite his wounds, Capt. Fritz returned
    to his position, assisted his men, and refused medical attention until all of
    his wounded comrades had been treated and evacuated. The extraordinary courage
    and selflessness displayed by Capt. Fritz, at the repeated risk of his own life
    above and beyond the call of duty, were in keeping with the highest traditions
    of the U.S. Army and reflect the greatest credit upon himself, his unit, and the
    Armed Forces.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 1
  day: 14
  year: 1969
  title: First Lieutenant John E. Warren, Jr. earns Medal of Honor (posthumous)
  body: "<p>On January 14, 1969, First Lieutenant John E. Warren, Jr., a platoon leader
    with Company C, was moving with his company through a rubber plantation to reinforce
    another friendly unit when the company came under intense fire from a well-fortified
    enemy force. Warren and several of his men began working forward through the fire
    toward the enemy positions.</p><p>He had closed to within six feet of one of the
    bunkers and was preparing to throw a hand grenade into it when an enemy grenade
    landed in the middle of his small group. Warren fell toward the grenade, shielding
    the men around him from the blast. He was killed, and three men were spared serious
    or fatal injury.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, John E. Warren, Jr. (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. 1st Lt. Warren, distinguished himself
    at the cost of his life while serving as a platoon leader with Company C. While
    moving through a rubber plantation to reinforce another friendly unit, Company
    C came under intense fire from a well-fortified enemy force. Disregarding his
    safety, 1st Lt. Warren with several of his men began maneuvering through the hail
    of enemy fire toward the hostile positions. When he had come to within 6 feet
    of one of the enemy bunkers and was preparing to toss a hand grenade into it,
    an enemy grenade was suddenly thrown into the middle of his small group. Thinking
    only of his men, 1st Lt. Warren fell in the direction of the grenade, thus shielding
    those around him from the blast. His action, performed at the cost of his life,
    saved 3 men from serious or mortal injury. First Lt. Warren's ultimate action
    of sacrifice to save the lives of his men was in keeping with the highest traditions
    of the military service and reflects great credit on him, his unit, and the U.S.
    Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 1
  day: 15
  year: 1969
  title: Private First Class Garfield M. Langhorn earns Medal of Honor (posthumous)
  body: "<p>On January 15, 1969, Private First Class Garfield M. Langhorn was a radio
    operator with Troop C near Plei Djereng in Pleiku province. His platoon was inserted
    to rescue two pilots of a Cobra helicopter shot down on a heavily timbered slope.
    Langhorn kept radio contact with the command-and-control aircraft while the troops
    cut through dense undergrowth to the wreckage, where both aviators were found
    dead. As the men carried the bodies toward a pickup site, North Vietnamese soldiers
    in camouflaged bunkers opened intense fire, and within minutes the platoon was
    surrounded.</p><p>Langhorn radioed the orbiting gunships, which put minigun and
    rocket fire on the attackers. He then lay beside the platoon leader, working the
    radio and covering the wounded in the center of the small perimeter. After dark
    the gunships could no longer support accurately and the enemy began probing. A
    grenade landed in front of Langhorn, a few feet from the wounded. He threw himself
    on it, pulled it beneath his body, and absorbed the blast. He was killed and his
    comrades lived.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Garfield M. Langhorn (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Private First Class Langhorn distinguished
    himself while serving as a radio operator with Troop C, near Plei Djereng in Pleiku
    province. Private First Class Langhorn's platoon was inserted into a landing zone
    to rescue 2 pilots of a Cobra helicopter shot down by enemy fire on a heavily
    timbered slope. He provided radio coordination with the command-and-control aircraft
    overhead while the troops hacked their way through dense undergrowth to the wreckage,
    where both aviators were found dead. As the men were taking the bodies to a pickup
    site, they suddenly came under intense fire from North Vietnamese soldiers in
    camouflaged bunkers to the front and right flank, and within minutes they were
    surrounded. Private First Class Langhorn immediately radioed for help from the
    orbiting gunships, which began to place minigun and rocket fire on the aggressors.
    He then lay between the platoon leader and another man, operating the radio and
    providing covering fire for the wounded who had been moved to the center of the
    small perimeter. Darkness soon fell, making it impossible for the gunships to
    give accurate support, and the aggressors began to probe the perimeter. An enemy
    hand grenade landed in front of Private First Class Langhorn and a few feet from
    personnel who had become casualties. Choosing to protect these wounded, he unhesitatingly
    threw himself on the grenade, scooped it beneath his body and absorbed the blast.
    By sacrificing himself, he saved the lives of his comrades. Private First Class
    Langhorn's extraordinary heroism at the cost of his life was in keeping with the
    highest traditions of the military service and reflect great credit on himself,
    his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 2
  day: 5
  year: 1969
  title: Lance Corporal Thomas P. Noonan, Jr. earns Medal of Honor (posthumous)
  body: "<p>On February 5, 1969, Lance Corporal Thomas P. Noonan, Jr., a fire team
    leader with Company G, was in Quang Tri Province as the company moved from a position
    southeast of the Vandergrift Combat Base to an alternate location. As the marines
    made a slow descent down a hillside made slippery by heavy rains, the leading
    element came under heavy fire from a North Vietnamese Army unit in concealed positions
    among the rocks. Four men were wounded, and repeated attempts to recover them
    failed under the fire.</p><p>Noonan left his position of relative security, worked
    down the slope to a spot near the wounded, and took cover behind rocks. Calling
    encouragement to the wounded men, he dashed across the open ground and began dragging
    the most seriously wounded man out of the fire-swept area. An enemy round wounded
    him and knocked him down; he recovered and resumed dragging the man toward the
    cover of a rock. He was mortally wounded before he reached it. His fellow marines
    then assaulted the enemy and forced them to withdraw.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Thomas P. Noonan, Jr. (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a fire team leader with Company G,
    in operations against the enemy in Quang Tri Province. Company G was directed
    to move from a position which they had been holding southeast of the Vandergrift
    Combat Base to an alternate location. As the marines commenced a slow and difficult
    descent down the side of the hill made extremely slippery by the heavy rains,
    the leading element came under a heavy fire from a North Vietnamese Army unit
    occupying well concealed positions in the rocky terrain. Four men were wounded,
    and repeated attempts to recover them failed because of the intense hostile fire.
    L/Corporal. Noonan moved from his position of relative security and, maneuvering
    down the treacherous slope to a location near the injured men, took cover behind
    some rocks. Shouting words of encouragement to the wounded men to restore their
    confidence, he dashed across the hazardous terrain and commenced dragging the
    most seriously wounded man away from the fire-swept area. Although wounded and
    knocked to the ground by an enemy round, L/Corporal. Noonan recovered rapidly
    and resumed dragging the man toward the marginal security of a rock. He was, however,
    mortally wounded before he could reach his destination. His heroic actions inspired
    his fellow marines to such aggressiveness that they initiated a spirited assault
    which forced the enemy soldiers to withdraw. L/Corporal. Noonan's indomitable
    courage, inspiring initiative, and selfless devotion to duty upheld the highest
    traditions of the Marine Corps and the U.S. Naval Service. He gallantly gave his
    life for his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 2
  day: 9
  year: 1969
  title: Lance Corporal William R. Prom earns Medal of Honor (posthumous)
  body: "<p>On February 9, 1969, Lance Corporal William R. Prom was a machinegun squad
    leader with Company 1 during Operation TAYLOR COMMON. As two platoons returned
    from a reconnaissance operation, they came under intense automatic weapons fire
    and a grenade attack from a well concealed North Vietnamese Army force in fortified
    positions. The leading element was cut off and several marines were wounded. Prom
    took control of one of his machineguns and returned fire, then advanced to cover
    the men while the wounded were treated. Since the enemy had to be destroyed before
    the wounded could be evacuated, he moved forward again and fired with such accuracy
    that the enemy was routed and his men could regroup and resume their march.</p><p>Shortly
    afterward the platoon came under heavy fire again and one man was critically wounded.
    Prom moved forward to protect him. Too badly wounded to fire, he advanced to within
    a few yards of the enemy and, standing in full view, directed his supporting elements'
    fire until he was mortally wounded. The marines then assaulted and destroyed the
    enemy.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, William R. Prom (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a machinegun squad leader with Company
    1, in action against the enemy. While returning from a reconnaissance operation
    during Operation TAYLOR COMMON, 2 platoons of Company 1 came under an intense
    automatic weapons fire and grenade attack from a well concealed North Vietnamese
    Army force in fortified positions. The leading. element of the platoon was isolated
    and several marines were wounded. L/Corporal. Prom immediately assumed control
    of 1 of his machineguns and began to deliver return fire. Disregarding his safety
    he advanced to a position from which he could more effectively deliver covering
    fire while first aid was administered to the wounded men. Realizing that the enemy
    would have to be destroyed before the injured marines could be evacuated, L/Corporal.
    Prom again moved forward and delivered a heavy volume of fire with such accuracy
    that he was instrumental in routing the enemy, thus permitting his men to regroup
    and resume their march. Shortly thereafter, the platoon again came under heavy
    fire in which 1 man was critically wounded. Reacting instantly, L/Corporal. Prom
    moved forward to protect his injured comrade. Unable to continue his fire because
    of his severe wounds, he continued to advance to within a few yards to the enemy
    positions. There, standing in full view of the enemy, he accurately directed the
    fire of his support elements until he was mortally wounded. Inspired by his heroic
    actions, the marines launched an assault that destroyed the enemy. L/Corporal.
    Prom's indomitable courage, inspiring initiative and selfless devotion to duty
    upheld the highest traditions of the Marine Corps and the U.S. Naval Service.
    He gallantly gave his life for his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 2
  day: 11
  year: 1969
  title: Corporal Thomas W. Bennett earns Medal of Honor (posthumous)
  body: "<p>On February 11, 1969, Corporal Thomas W. Bennett, a platoon medical aidman
    with the 2d Platoon, Company B, was killed on the third day of a reconnaissance-in-force
    mission. The citation dates the action from 9 February, when the platoon, moving
    to assist the 1st Platoon of Company D after a North Vietnamese ambush, was itself
    engaged by small arms, automatic weapons, mortar and rocket fire from a well fortified
    and larger enemy unit. Three point men fell wounded in the first barrage. Bennett
    ran through the fire to them, gave first aid, and carried them to positions from
    which they could be evacuated. He crossed open ground repeatedly to treat the
    wounded and retrieve the bodies of the dead, and through that night and the following
    day he moved from position to position treating the wounded.</p><p>On 11 February
    Company B assaulted the positions again and five men fell wounded. Bennett treated
    one and ran toward another lying forward of the company under grazing fire. Warned
    that the man could not be reached, he went anyway and was mortally wounded.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Thomas W. Bennett (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Corporal. Bennett distinguished himself
    while serving as a platoon medical aidman with the 2d Platoon, Company B, during
    a reconnaissance-in-force mission. On 9 February the platoon was moving to assist
    the 1st Platoon of Company D which had run into a North Vietnamese ambush when
    it became heavily engaged by the intense small arms, automatic weapons, mortar
    and rocket fire from a well fortified and numerically superior enemy unit. In
    the initial barrage of fire, 3 of the point members of the platoon fell wounded.
    Corporal. Bennett, with complete disregard for his safety, ran through the heavy
    fire to his fallen comrades, administered life-saving first aid under fire and
    then made repeated trips carrying the wounded men to positions of relative safety
    from which they would be medically evacuated from the battle position. Corporal.
    Bennett repeatedly braved the intense enemy fire moving across open areas to give
    aid and comfort to his wounded comrades. He valiantly exposed himself to the heavy
    fire in order to retrieve the bodies of several fallen personnel. Throughout the
    night and following day, Corporal. Bennett moved from position to position treating
    and comforting the several personnel who had suffered shrapnel and gunshot wounds.
    On 11 February, Company B again moved in an assault on the well fortified enemy
    positions and became heavily engaged with the numerically superior enemy force.
    Five members of the company fell wounded in the initial assault. Corporal. Bennett
    ran to their aid without regard to the heavy fire. He treated 1 wounded comrade
    and began running toward another seriously wounded man. Although the wounded man
    was located forward of the company position covered by heavy enemy grazing fire
    and Corporal. Bennett was warned that it was impossible to reach the position,
    he leaped forward with complete disregard for his safety to save his comrade's
    life. In attempting to save his fellow soldier, he was mortally wounded. Corporal.
    Bennett's undaunted concern for his comrades at the cost of his life above and
    beyond the call of duty are in keeping with the highest traditions of the military
    service and reflect great credit upon himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 2
  day: 13
  year: 1969
  title: Lance Corporal Thomas E. Creek earns Medal of Honor (posthumous)
  body: "<p>On February 13, 1969, Lance Corporal Thomas E. Creek, a rifleman with
    Company 1, was with his squad providing security for a convoy moving to resupply
    the Vandegrift Command Base when an enemy command-detonated mine destroyed one
    of the vehicles and halted the convoy near the Cam Lo Resettlement Village. Almost
    at once the marines came under heavy mortar fire, followed by intense small-arms
    fire from a well-concealed enemy force. As his squad deployed, Creek moved to
    a fighting position and joined the fire fight.</p><p>Spotting a position from
    which he could fire on the enemy more effectively, he dashed across the open terrain
    and was seriously wounded. At the same moment an enemy grenade was thrown into
    the gully where he had fallen, landing between him and several companions. Creek
    rolled onto the grenade and absorbed the full force of the explosion with his
    body, saving the lives of five fellow marines. His men went on to defeat the enemy,
    and the convoy continued its mission. He was killed.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Thomas E. Creek (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a rifleman with Company 1 in action
    against enemy forces. L/Corporal. Creek's squad was providing security for a convoy
    moving to resupply the Vandegrift Command Base when an enemy command detonated
    mine destroyed 1 of the vehicles and halted the convoy near the Cam Lo Resettlement
    Village. Almost immediately, the marines came under a heavy volume of hostile
    mortar fire followed by intense small-arms fire from a well-concealed enemy force.
    As his squad deployed to engage the enemy, L/Corporal. Creek quickly moved to
    a fighting position and aggressively engaged in the fire fight. Observing a position
    from which he could more effectively deliver fire against the hostile forces.
    he completely disregarded his own safety as he fearlessly dashed across the fire-swept
    terrain and was seriously wounded by enemy fire. At the same time, an enemy grenade
    was thrown into the gully where he had fallen, landing between him and several
    companions. Fully realizing the inevitable results of his action, L/Corporal.
    Creek rolled on the grenade and absorbed the full force of the explosion with
    his body, thereby saving the lives of 5 of his fellow marines. As a result of
    his heroic action, his men were inspired to such aggressive action that the enemy
    was defeated and the convoy was able to continue its vital mission. L/Corporal.
    Creek's indomitable courage, inspired the Marine Corps and the U.S. Naval Service.
    He gallantly gave his life for his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 2
  day: 16
  year: 1969
  title: First Lieutenant Gary L. Miller earns Medal of Honor (posthumous)
  body: "<p>On February 16, 1969, First Lieutenant Gary L. Miller, a platoon leader
    with Company A, was in position at night when his company ambushed a hostile force
    infiltrating from Cambodian sanctuaries. After contact was broken, Miller led
    a reconnaissance patrol out from the prepared positions through the early evening
    darkness and dense tropical growth to search the area for enemy casualties.</p><p>As
    the patrol advanced it was attacked, and Miller was seriously wounded. The group
    fought back with telling effect. Then an enemy grenade was thrown into the midst
    of the patrol. Everyone took cover except Miller, who found the grenade in the
    dim light and threw himself on it, absorbing the explosion with his body. He was
    killed, and the members of his patrol nearby were spared almost certain serious
    injury.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Gary L. Miller (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous intrepidity and gallantry in action at the risk of
    his life above and beyond the call of duty. First Lt. Miller, Infantry, Company
    A, was serving as a platoon leader at night when his company ambushed a hostile
    force infiltrating from Cambodian sanctuaries. After contact with the enemy was
    broken, 1st Lt. Miller led a reconnaissance patrol from their prepared positions
    through the early evening darkness and dense tropical growth to search the area
    for enemy casualties. As the group advanced they were suddenly attacked. First
    Lt. Miller was seriously wounded. However, the group fought back with telling
    effect on the hostile force. An enemy grenade was thrown into the midst of the
    friendly patrol group and all took cover except 1st Lt. Miller. who in the dim
    light located the grenade and threw himself on it, absorbing the force of the
    explosion with his body. His action saved nearby members of his patrol from almost
    certain serious injury. The extraordinary courage and selflessness displayed by
    this officer were an inspiration to his comrades and are in the highest traditions
    of the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 2
  day: 22
  year: 1969
  title: Captain Wesley L. Fox earns Medal of Honor
  body: "<p>On February 22, 1969, Wesley L. Fox, then a First Lieutenant commanding
    Company A, was in the northern A Shau Valley when his company came under intense
    fire from a large, well concealed enemy force. Fox moved to a position from which
    he could assess the situation and confer with his platoon leaders. As they left
    to carry out his plan, the enemy attacked, wounding Fox and every other member
    of the command group except the executive officer.</p><p>Fox kept directing the
    company. Advancing through heavy fire, he personally neutralized one enemy position
    and ordered an assault on the emplacements, then moved through the area coordinating
    aircraft support with his men's movements. When his executive officer was mortally
    wounded, Fox reorganized the company and directed its fire as the marines threw
    grenades and drove the enemy into retreat. Wounded again in the final assault,
    he refused medical attention, set up a defensive position, and supervised the
    preparation of casualties for evacuation. His company overcame the resistance
    and destroyed a large bunker complex.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Wesley L. Fox (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as commanding officer of Company A,
    in action against the enemy in the northern A Shau Valley. Capt. (then 1st Lt.)
    Fox's company came under intense fire from a large well concealed enemy force.
    Capt. Fox maneuvered to a position from which he could assess the situation and
    confer with his platoon leaders. As they departed to execute the plan he had devised,
    the enemy attacked and Capt. Fox was wounded along with all of the other members
    of the command group, except the executive officer. Capt. Fox continued to direct
    the activity of his company. Advancing through heavy enemy fire, he personally
    neutralized 1 enemy position and calmly ordered an assault against the hostile
    emplacements. He then moved through the hazardous area coordinating aircraft support
    with the activities of his men. When his executive officer was mortally wounded,
    Capt. Fox reorganized the company and directed the fire of his men as they hurled
    grenades against the enemy and drove the hostile forces into retreat. Wounded
    again in the final assault, Capt. Fox refused medical attention, established a
    defensive posture, and supervised the preparation of casualties for medical evacuation.
    His indomitable courage, inspiring initiative, and unwavering devotion to duty
    in the face of grave personal danger inspired his marines to such aggressive action
    that they overcame all enemy resistance and destroyed a large bunker complex.
    Capt. Fox's heroic actions reflect great credit upon himself and the Marine Corps,
    and uphold the highest traditions of the U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 2
  day: 22
  year: 1969
  title: Specialist Fourth Class George C. Lang earns Medal of Honor
  body: "<p>On February 22, 1969, Specialist Fourth Class George C. Lang was a squad
    leader with Company A on a reconnaissance-in-force mission when his unit met intense
    fire from a well fortified enemy bunker complex. Lang saw the emplacement the
    heavy fire was coming from, assaulted it, and destroyed it with hand grenades
    and rifle fire. Seeing a second emplacement about 15 meters ahead, he jumped across
    a canal, moved through heavy fire to within a few feet of it, and destroyed it
    the same way. Nearby he found a large cache of enemy ammunition. As he brought
    his squad forward to secure the cache, a third bunker opened fire; Lang assaulted
    it and destroyed it with the rest of his grenades.</p><p>Back at the arms cache,
    the squad came under heavy rocket and automatic weapons fire from three sides
    and took six casualties. Lang was among the seriously wounded. Immobilized and
    in great pain, he kept directing his men until his evacuation was ordered over
    his protests.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, George C. Lang (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sp4c. Lang, Company A, was serving
    as a squad leader when his unit, on a reconnaissance-in-force mission, encountered
    intense fire from a well fortified enemy bunker complex. Sp4c. Lang observed an
    emplacement from which heavy fire was coming. Unhesitatingly, he assaulted the
    position and destroyed it with hand grenades and rifle fire. Observing another
    emplacement approximately 15 meters to his front, Sp4c. Lang jumped across a canal,
    moved through heavy enemy fire to within a few feet of the position, and eliminated
    it, again using hand grenades and rifle fire. Nearby, he discovered a large cache
    of enemy ammunition. As he maneuvered his squad forward to secure the cache, they
    came under fire from yet a third bunker. Sp4c. Lang immediately reacted, assaulted
    his position, and destroyed it with the remainder of his grenades. After returning
    to the area of the arms cache, his squad again came under heavy enemy rocket and
    automatic weapons fire from 3 sides and suffered 6 casualties. Sp4c. Lang was
    1 of those seriously wounded. Although immobilized and in great pain, he continued
    to direct his men until his evacuation was ordered over his protests. The sustained
    extraordinary courage and selflessness exhibited by this soldier over an extended
    period of time were an inspiration to his comrades and are in keeping with the
    highest traditions of the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 2
  day: 22
  year: 1969
  title: Specialist Fourth Class Robert D. Law earns Medal of Honor (posthumous)
  body: "<p>On February 22, 1969, Specialist Fourth Class Robert D. Law of Company
    1 was on a long-range reconnaissance patrol in Tinh Phuoc Thanh province with
    five comrades when the team made contact with a small enemy patrol. As the two
    sides exchanged intense fire, Law moved to an exposed position on his comrades'
    flank and began putting suppressive fire on the enemy. The team was short of ammunition
    and was suffering from an unidentified irritating gas in the air, but Law's defense
    and counterassault rallied his fellow soldiers against the well-equipped enemy.</p><p>When
    an enemy grenade landed in the team's position, Law had a stream directly behind
    him into which he could have dived. He threw himself on the grenade instead and
    was killed, saving the lives of the men with him.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Robert D. Law (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sp4c. Law distinguished himself while
    serving with Company 1. While on a long-range reconnaissance patrol in Tinh Phuoc
    Thanh province, Sp4c. Law and 5 comrades made contact with a small enemy patrol.
    As the opposing elements exchanged intense fire, he maneuvered to a perilously
    exposed position flanking his comrades and began placing suppressive fire on the
    hostile troops. Although his team was hindered by a low supply of ammunition and
    suffered from an unidentified irritating gas in the air, Sp4c. Law's spirited
    defense and challenging counterassault rallied his fellow soldiers against the
    well-equipped hostile troops. When an enemy grenade landed in his team's position,
    Sp4c. Law, instead of diving into the safety of a stream behind him, threw himself
    on the grenade to save the lives of his comrades. Sp4c. Law's extraordinary courage
    and profound concern for his fellow soldiers were in keeping with the highest
    traditions of the military service and reflect great credit on himself, his unit,
    and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 2
  day: 23
  year: 1969
  title: Lance Corporal Lester W. Weber earns Medal of Honor (posthumous)
  body: "<p>On February 23, 1969, Lance Corporal Lester W. Weber, a machinegun squad
    leader with Company M, was with the 2d Platoon when it was sent to the Bo Ban
    area of Hieu Duc District to assist a squad from another platoon that was heavily
    engaged with a well entrenched enemy battalion. Moving through a rice paddy covered
    in tall grass, the platoon came under heavy attack from concealed soldiers. Weber
    plunged into the grass, attacked one enemy soldier and forced eleven others to
    break contact. He met a second North Vietnamese Army soldier and overcame him
    in hand-to-hand combat.</p><p>Seeing two more soldiers firing on his comrades
    from behind a dike, Weber ran across the open ground under their fire and dived
    into their position, wrestling the weapons from both men and overcoming them.
    By now the target of concentrated rifle fire, he stayed in an exposed position
    shouting encouragement to his companions. As he moved forward to attack a fifth
    enemy soldier, he was mortally wounded.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Lester W. Weber (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a machinegun squad leader with Company
    M, in action against the enemy. The 2d Platoon of Company M was dispatched to
    the Bo Ban area of Hieu Duc District to assist a squad from another platoon which
    had become heavily engaged with a well entrenched enemy battalion. While moving
    through a rice paddy covered with tall grass L/Corporal. Weber's platoon came
    under heavy attack from concealed hostile soldiers. He reacted by plunging into
    the tall grass, successfully attacking 1 enemy and forcing 11 others to break
    contact. Upon encountering a second North Vietnamese Army soldier he overwhelmed
    him in fierce hand-to-hand combat. Observing 2 other soldiers firing upon his
    comrades from behind a dike, L/Corporal. Weber ignored the frenzied firing of
    the enemy and racing across the hazardous area, dived into their position. He
    neutralized the position by wrestling weapons from the hands of the 2 soldiers
    and overcoming them. Although by now the target for concentrated fire from hostile
    riflemen, L/Corporal. Weber remained in a dangerously exposed position to shout
    words of encouragement to his emboldened companions. As he moved forward to attack
    a fifth enemy soldier, he was mortally wounded. L/Corporal. Weber's indomitable
    courage, aggressive fighting spirit and unwavering devotion to duty upheld the
    highest traditions of the Marine Corps and of the U.S. Naval Service. He gallantly
    gave his life for his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 2
  day: 23
  year: 1969
  title: Private First Class Oscar P. Austin earns Medal of Honor (posthumous)
  body: "<p>On February 23, 1969, Private First Class Oscar P. Austin, an assistant
    machine gunner with Company E, was at an observation post that came under a fierce
    ground attack in the early morning hours by a large North Vietnamese Army force
    using hand grenades, satchel charges, and small arms fire. Austin saw that one
    of his wounded companions had fallen unconscious in a position exposed to the
    fire. He left his fighting hole and ran across the open ground to move the marine
    to cover.</p><p>As he neared the man, he saw an enemy grenade land nearby and
    leaped between the wounded marine and the grenade, taking the force of its detonation.
    Ignoring his own injuries, he turned to examine the wounded man and saw a North
    Vietnamese soldier aiming a weapon at his unconscious companion. Austin threw
    himself between the two and was mortally wounded.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Oscar P. Austin (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as an assistant machine gunner with
    Company E, in connection with operations against enemy forces. During the early
    morning hours Private First Class Austin's observation post was subjected to a
    fierce ground attack by a large North Vietnamese Army force supported by a heavy
    volume of hand grenades, satchel charges, and small arms fire. Observing that
    1 of his wounded companions had fallen unconscious in a position dangerously exposed
    to the hostile fire, Private First Class Austin unhesitatingly left the relative
    security of his fighting hole and, with complete disregard for his safety, raced
    across the fire-swept terrain to assist the marine to a covered location. As he
    neared the casualty, he observed an enemy grenade land nearby and, reacting instantly,
    leaped between the injured marine and the lethal object, absorbing the effects
    of its detonation. As he ignored his painful injuries and turned to examine the
    wounded man, he saw a North Vietnamese Army soldier aiming a weapon at his unconscious
    companion. With full knowledge of the probable consequences and thinking only
    to protect the marine, Private First Class Austin resolutely threw himself between
    the casualty and the hostile soldier, and, in doing, was mortally wounded. Private
    First Class Austin's indomitable courage, inspiring initiative and selfless devotion
    to duty upheld the highest traditions of the Marine Corps and the U.S. Naval Service.
    He gallantly gave his life for his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 2
  day: 23
  year: 1969
  title: Staff Sergeant Robert W. Hartsock earns Medal of Honor (posthumous)
  body: "<p>On February 23, 1969, Staff Sergeant Robert W. Hartsock, a section leader
    with the 44th Infantry Platoon, was at the Dau Tieng Base Camp when it came under
    heavy enemy rocket and mortar attack. Hartsock and his platoon commander spotted
    an enemy sapper squad that had infiltrated the camp undetected and was heading
    for the brigade tactical operations center and the nearby prisoner compound. Though
    heavily outnumbered, the two men concealed themselves and waited for the sappers
    to approach, then opened fire when the enemy was almost upon them.</p><p>As one
    wounded enemy soldier fell, he managed to detonate the satchel charge he was carrying.
    Hartsock threw himself on the charge and was gravely wounded. He then crawled
    about five meters to a ditch and put down heavy suppressive fire that pinned the
    enemy and let his commander reach shelter. He kept firing until he died of his
    wounds.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Robert W. Hartsock (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. S/Sergeant. Hartsock, distinguished
    himself in action while serving as section leader with the 44th Infantry Platoon.
    When the Dau Tieng Base Camp came under a heavy enemy rocket and mortar attack,
    S/Sergeant. Hartsock and his platoon commander spotted an enemy sapper squad which
    had infiltrated the camp undetected. Realizing the enemy squad was heading for
    the brigade tactical operations center and nearby prisoner compound, they concealed
    themselves and, although heavily outnumbered, awaited the approach of the hostile
    soldiers. When the enemy was almost upon them, S/Sergeant. Hartsock and his platoon
    commander opened fire on the squad. As a wounded enemy soldier fell, he managed
    to detonate a satchel charge he was carrying. S/Sergeant. Hartsock, with complete
    disregard for his life, threw himself on the charge and was gravely wounded. In
    spite of his wounds, S/Sergeant. Hartsock crawled about 5 meters to a ditch and
    provided heavy suppressive fire, completely pinning down the enemy and allowing
    his commander to seek shelter. S/Sergeant. Hartsock continued his deadly stream
    of fire until he succumbed to his wounds. S/Sergeant. Hartsock's extraordinary
    heroism and profound concern for the lives of his fellow soldiers were in keeping
    with the highest traditions of the military service and reflect great credit on
    him, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 2
  day: 24
  year: 1969
  title: Sergeant John L. Levitow earns Medal of Honor
  body: "<p>On February 24, 1969, John L. Levitow, then an Airman First Class, was
    loadmaster aboard an AC-47 flying a night mission in support of Long Binh Army
    post. A hostile mortar round struck the aircraft, tearing a two-foot hole in the
    wing and putting more than 3,500 fragment holes in the fuselage. Everyone in the
    cargo compartment was wounded, and the blast tore an activated flare from the
    hands of a crewmember who had been launching flares to light the ground fight
    for Army troops.</p><p>Stunned, with more than 40 fragment wounds in his back
    and legs, Levitow got to his feet and began moving a bleeding comrade away from
    the open cargo door. He then saw the smoking flare rolling in the aisle of the
    partially uncontrolled aircraft. Unable to grip it, he threw himself on the flare,
    hugged it to his body, dragged himself to the rear of the aircraft, and hurled
    it out the cargo door. It ignited in the air, clear of the aircraft. The aircraft
    and its crew were saved.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, John L. Levitow (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sergeant. Levitow (then A1c.), U.S.
    Air Force, distinguished himself by exceptional heroism while assigned as a loadmaster
    aboard an AC-47 aircraft flying a night mission in support of Long Binh Army post.
    Sergeant. Levitow's aircraft was struck by a hostile mortar round. The resulting
    explosion ripped a hole 2 feet in diameter through the wing and fragments made
    over 3,500 holes in the fuselage. All occupants of the cargo compartment were
    wounded and helplessly slammed against the floor and fuselage. The explosion tore
    an activated flare from the grasp of a crewmember who had been launching flares
    to provide illumination for Army ground troops engaged in combat. Sergeant. Levitow,
    though stunned by the concussion of the blast and suffering from over 40 fragment
    wounds in the back and legs, staggered to his feet and turned to assist the man
    nearest to him who had been knocked down and was bleeding heavily. As he was moving
    his wounded comrade forward and away from the opened cargo compartment door, he
    saw the smoking flare ahead of him in the aisle. Realizing the danger involved
    and completely disregarding his own wounds, Sergeant. Levitow started toward the
    burning flare. The aircraft was partially out of control and the flare was rolling
    wildly from side to side. Sergeant. Levitow struggled forward despite the loss
    of blood from his many wounds and the partial loss of feeling in his right leg.
    Unable to grasp the rolling flare with his hands, he threw himself bodily upon
    the burning flare. Hugging the deadly device to his body, he dragged himself back
    to the rear of the aircraft and hurled the flare through the open cargo door.
    At that instant the flare separated and ignited in the air, but clear of the aircraft.
    Sergeant. Levitow, by his selfless and heroic actions, saved the aircraft and
    its entire crew from certain death and destruction. Sergeant. Levitow's gallantry,
    his profound concern for his fellowmen, at the risk of his life above and beyond
    the call of duty are in keeping with the highest traditions of the U.S. Air Force
    and reflect great credit upon himself and the Armed Forces of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 2
  day: 25
  year: 1969
  title: Corporal William D. Morgan earns Medal of Honor (posthumous)
  body: "<p>On February 25, 1969, Corporal William D. Morgan, a squad leader with
    Company H, was taking part in Operation DEWEY CANYON southeast of Vandergrift
    Combat Base. One of the squads in his platoon, attacking a North Vietnamese Army
    force in a heavily fortified bunker complex, was pinned down and took several
    casualties. Two of the wounded marines lay in a position exposed to the enemy
    fire, and every attempt to bring them out was stopped by automatic weapons fire
    and rocket-propelled grenades.</p><p>Morgan worked through the dense jungle undergrowth
    to a road that ran in front of the emplacement that was the main source of the
    fire. Shouting encouragement to the wounded men, he charged across the open road
    toward the bunker. The enemy soldiers turned their fire on him and he was mortally
    wounded, but his diversion let the rest of his squad recover the casualties and
    overrun the position. His action saved the lives of the two marines.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, William D. Morgan (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a squad leader with Company H, in
    operations against the enemy. While participating in Operation DEWEY CANYON southeast
    of Vandergrift Combat Base, 1 of the squads of Corporal. Morgan's platoon was
    temporarily pinned down and sustained several casualties while attacking a North
    Vietnamese Army force occupying a heavily fortified bunker complex. Observing
    that 2 of the wounded marines had fallen in a position dangerously exposed to
    the enemy fire and that all attempts to evacuate them were halted by a heavy volume
    of automatic weapons fire and rocket-propelled grenades. Corporal. Morgan unhesitatingly
    maneuvered through the dense jungle undergrowth to a road that passed in front
    of a hostile emplacement which was the principal source of enemy fire. Fully aware
    of the possible consequences of his valiant action, but thinking only of the welfare
    of his injured companions, Corporal. Morgan shouted words of encouragement to
    them as he initiated an aggressive assault against the hostile bunker. While charging
    across the open road, he was clearly visible to the hostile soldiers who turned
    their fire in his direction and mortally wounded him, but his diversionary tactic
    enabled the remainder of his squad to retrieve their casualties and overrun the
    North Vietnamese Army position. His heroic and determined actions saved the lives
    of 2 fellow marines and were instrumental in the subsequent defeat of the enemy.
    Corporal. Morgan's indomitable courage, inspiring initiative and selfless devotion
    to duty upheld the highest traditions of the Marine Corps and of the U.S. Naval
    Services. He gallantly gave his life for his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 3
  day: 1
  year: 1969
  title: Private First Class Daniel D. Bruce earns Medal of Honor (posthumous)
  body: "<p>On March 1, 1969, Private First Class Daniel D. Bruce, a mortar man with
    Headquarters and Service Company, 3d Battalion, was on watch early in the morning
    in his night defensive position at Fire Support Base Tomahawk when he heard movement
    ahead of him. An enemy explosive charge was thrown toward his position. Bruce
    caught the device and shouted to alert his companions.</p><p>Aware of the danger
    to the adjacent position and its two occupants, he held the charge against his
    body and tried to carry it away from the entrenched marines. As he moved off,
    the charge detonated and he absorbed the full force of the explosion. He was killed,
    and the lives of three fellow marines were saved.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Daniel D. Bruce (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a mortar man with Headquarters and
    Service Company 3d Battalion, against the enemy. Early in the morning Private
    First Class Bruce was on watch in his night defensive position at fire support
    base tomahawk when he heard movements ahead of him. An enemy explosive charge
    was thrown toward his position and he reacted instantly, catching the device and
    shouting to alert his companions. Realizing the danger to the adjacent position
    with its 2 occupants, Private First Class Bruce held the device to his body and
    attempted to carry it from the vicinity of the entrenched marines. As he moved
    away, the charge detonated and he absorbed the full force of the explosion. Private
    First Class Bruce's indomitable courage, inspiring valor and selfless devotion
    to duty saved the lives of 3 of his fellow marines and upheld the highest traditions
    of the Marine Corps and the U.S. Naval Service. He gallantly gave his life for
    his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 3
  day: 3
  year: 1969
  title: Private First Class Alfred M. Wilson earns Medal of Honor (posthumous)
  body: "<p>On March 3, 1969, Private First Class Alfred M. Wilson, a rifleman with
    Company M, was returning with the 1st Platoon from a reconnaissance-in-force mission
    near Fire Support Base Cunningham when the platoon came under intense automatic
    weapons fire and a grenade attack from a well concealed enemy force. With the
    center of the column pinned down, the leading squad moved to outflank the enemy.
    Wilson, acting as leader of the rear squad, positioned his men to form a base
    of fire and a blocking force.</p><p>In the fire fight both his machine gunner
    and assistant machine gunner were seriously wounded and could not work their weapon.
    Wilson and another marine ran across the open ground to recover the gun. As they
    reached it, an enemy soldier stepped out from behind a tree and threw a grenade
    toward them. Seeing it fall between him and the other marine, Wilson shouted to
    his companion and threw himself on the grenade, taking the full force of the explosion.
    He was killed. His platoon then attacked and defeated the enemy.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Alfred M. Wilson (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a rifleman with Company M in action
    against hostile forces. While returning from a reconnaissance-in-force mission
    in the vicinity of Fire Support Base Cunningham, the 1st Platoon of Company M
    came under intense automatic weapons fire and a grenade attack from a well concealed
    enemy force. As the center of the column was pinned down, the leading squad moved
    to outflank the enemy. Private First Class Wilson, acting as squad leader of the
    rear squad, skillfully maneuvered his men to form a base of fire and act as a
    blocking force. In the ensuing fire fight, both his machine gunner and assistant
    machine gunner were seriously wounded and unable to operate their weapons. Realizing
    the urgent need to bring the weapon into operation again, Private First Class
    Wilson, followed by another marine and with complete disregard for his safety,
    fearlessly dashed across the fire-swept terrain to recover the weapon. As they
    reached the machinegun, an enemy soldier stepped from behind a tree and threw
    a grenade toward the 2 marines. Observing the grenade fall between himself and
    the other marine, Private First Class Wilson, fully realizing the inevitable result
    of his actions, shouted to his companion and unhesitating threw himself on the
    grenade, absorbing the full force of the explosion with his own body. His heroic
    actions inspired his platoon members to maximum effort as they aggressively attacked
    and defeated the enemy. Private First Class Wilson's indomitable courage, inspiring
    valor and selfless devotion to duty upheld the highest traditions of the Marine
    Corps and the U.S. Naval Service. He gallantly gave his life for his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 3
  day: 3
  year: 1969
  title: Sergeant Lester R. Stone, Jr. earns Medal of Honor (posthumous)
  body: "<p>On March 3, 1969, Sergeant Lester R. Stone, Jr., a squad leader in the
    1st Platoon, was on a combat patrol just west of Landing Zone Liz when the platoon
    came under intense automatic weapons and grenade fire from a well concealed company-size
    force of North Vietnamese regulars. When the platoon machinegunner fell critically
    wounded, Stone stayed in the open to provide covering fire while another member
    of the platoon pulled the wounded man to safety. With enemy fire landing all around
    him, the machinegun malfunctioned and would no longer fire automatically. Stone
    repaired it and kept up suppressive fire on the enemy positions until the rescue
    was complete.</p><p>An enemy force then left its cover and charged his position
    in an attempt to overrun it. Stone rose to his knees and fired into the attackers
    at point-blank range, killing six of them before he was mortally wounded. His
    stand saved the lives of a number of his fellow soldiers.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Lester R. Stone, Jr. (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sergeant. Stone, distinguished himself
    while serving as squad leader of the 1st Platoon. The 1st Platoon was on a combat
    patrol mission just west of Landing Zone Liz when it came under intense automatic
    weapons and grenade fire from a well concealed company-size force of North Vietnamese
    regulars. Observing the platoon machinegunner fall critically wounded, Sergeant.
    Stone remained in the exposed area to provide cover fire for the wounded soldier
    who was being pulled to safety by another member of the platoon. With enemy fire
    impacting all around him, Sergeant. Stone had a malfunction in the machinegun,
    preventing him from firing the weapon automatically. Displaying extraordinary
    courage under the most adverse conditions, Sergeant. Stone repaired the weapon
    and continued to place on the enemy positions effective suppressive fire which
    enabled the rescue to be completed. In a desperate attempt to overrun his position,
    an enemy force left its cover and charged Sergeant. Stone. Disregarding the danger
    involved, Sergeant. Stone rose to his knees and began placing intense fire on
    the enemy at pointblank range, killing 6 of the enemy before falling mortally
    wounded. His actions of unsurpassed valor were a source of inspiration to his
    entire unit, and he was responsible for saving the lives of a number of his fellow
    soldiers. His actions were in keeping with the highest traditions of the military
    profession and reflect great credit on him, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 3
  day: 5
  year: 1969
  title: Private First Class Robert H. Jenkins, Jr. earns Medal of Honor (posthumous)
  body: "<p>On March 5, 1969, Private First Class Robert H. Jenkins, Jr., a machine
    gunner with Company C, 3d Reconnaissance Battalion, was with his 12-man reconnaissance
    team in a defensive position at Fire Support Base Argonne, south of the Demilitarized
    Zone. Early in the morning a North Vietnamese Army platoon assaulted the marines
    with mortars, automatic weapons, and hand grenades. Jenkins and another marine
    moved into a two-man fighting emplacement and opened accurate machine gun fire
    on the enemy.</p><p>A North Vietnamese soldier threw a hand grenade into their
    emplacement. Jenkins seized his comrade, pushed him to the ground, and leaped
    on top of him to shield him from the explosion. He took the full impact of the
    detonation, was seriously injured, and later died of his wounds. The marine he
    covered was saved from serious injury or death.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Robert H. Jenkins, Jr. (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a machine gunner with Company C,
    3d Reconnaissance Battalion, in connection with operations against enemy forces.
    Early in the morning Private First Class Jenkins' 12-man reconnaissance team was
    occupying a defensive position at Fire Support Base Argonne south of the Demilitarized
    Zone. Suddenly, the marines were assaulted by a North Vietnamese Army platoon
    employing mortars, automatic weapons, and hand grenades. Reacting instantly, Private
    First Class Jenkins and another marine quickly moved into a 2-man fighting emplacement,
    and as they boldly delivered accurate machine gun fire against the enemy, a North
    Vietnamese soldier threw a hand grenade into the friendly emplacement. Fully realizing
    the inevitable results of his actions, Private First Class Jenkins quickly seized
    his comrade, and pushing the man to the ground, he leaped on top of the marine
    to shield him from the explosion. Absorbing the full impact of the detonation,
    Private First Class Jenkins was seriously injured and subsequently succumbed to
    his wounds. His courage, inspiring valor and selfless devotion to duty saved a
    fellow marine from serious injury or possible death and upheld the highest traditions
    of the Marine Corps and the U.S. Naval Service. He gallantly gave his life for
    his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 3
  day: 14
  year: 1969
  title: Lieutenant Joseph R. Kerrey earns Medal of Honor
  body: "<p>On March 14, 1969, Lieutenant (Junior Grade) Joseph R. Kerrey, a SEAL
    team leader, led his team on a mission to capture important members of the enemy's
    area political cadre, who intelligence placed on an island in the bay of Nha Trang.
    To surprise the enemy, the team scaled a 350-foot sheer cliff to get above the
    ledge where the enemy was located. Kerrey split the team into two elements and
    led the descent toward the camp. Near the bottom, intense fire was directed at
    them, and a grenade exploded at Kerrey's feet, inflicting massive injuries and
    throwing him onto the jagged rocks.</p><p>Bleeding heavily, Kerrey directed his
    element's fire into the heart of the camp and, through his radioman, called in
    the second element's fire, catching the Viet Cong in a crossfire. With the enemy
    fire suppressed and himself immobilized by his wounds, he ordered his team to
    secure and defend an extraction site and kept directing his men, near unconsciousness,
    until he was evacuated by helicopter. The enemy soldiers captured in the raid
    provided critical intelligence.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Joseph R. Kerrey (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a SEAL team leader during action
    against enemy aggressor (Viet Cong) forces. Acting in response to reliable intelligence,
    Lt. (J.G..) Kerrey led his SEAL team on a mission to capture important members
    of the enemy's area political cadre known to be located on an island in the bay
    of Nha Trang. In order to surprise the enemy, he and his team scaled a 350-foot
    sheer cliff to place themselves above the ledge on which the enemy was located.
    Splitting his team in 2 elements and coordinating both, Lt. (J.G..) Kerrey led
    his men in the treacherous downward descent to the enemy's camp. Just as they
    neared the end of their descent, intense enemy fire was directed at them, and
    Lt. (J.G.) Kerrey received massive injuries from a grenade which exploded at his
    feet and threw him backward onto the jagged rocks. Although bleeding profusely
    and suffering great pain, he displayed outstanding courage and presence of mind
    in immediately directing his element's fire into the heart of the enemy camp.
    Utilizing his radioman, Lt. (J.G.) Kerrey called in the second element's fire
    support which caught the confused Viet Cong in a devastating crossfire. After
    successfully suppressing the enemy's fire, and although immobilized by his multiple
    wounds, he continued to maintain calm, superlative control as he ordered his team
    to secure and defend an extraction site. Lt. (J.G.) Kerrey resolutely directed
    his men, despite his near unconscious state, until he was eventually evacuated
    by helicopter. The havoc brought to the enemy by this very successful mission
    cannot be over-estimated. The enemy soldiers who were captured provided critical
    intelligence to the allied effort. Lt. (J.G.) Kerrey's courageous and inspiring
    leadership, valiant fighting spirit, and tenacious devotion to duty in the face
    of almost overwhelming opposition sustain and enhance the finest traditions of
    the U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 3
  day: 19
  year: 1969
  title: Hospital Corpsman Second Class David Robert Ray earns Medal of Honor (posthumous)
  body: "<p>On March 19, 1969, Hospital Corpsman Second Class David Robert Ray was
    serving with Battery D, 2d Battalion, at Phu Loc 6 near An Hoa when, in the early
    morning hours, an estimated battalion-sized enemy force assaulted the battery's
    position and broke through the barbed-wire perimeter. The opening burst of fire
    caused numerous casualties among the marines who had manned their howitzers during
    the rocket and mortar attack. Ray moved from parapet to parapet under intense
    fire, treating the wounded. He was seriously wounded himself while treating a
    marine, refused aid, and continued working.</p><p>While bandaging another wounded
    marine, Ray was attacked by two enemy soldiers; he killed one and wounded the
    other. Weakening from his wounds, he moved through the fire to other casualties
    and held off oncoming enemy troops while treating them until he ran out of ammunition,
    at which point he was fatally wounded. His last act was to throw himself over
    the marine he was treating when an enemy grenade exploded nearby, saving the man's
    life. Battery D went on to defeat the attack.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, David Robert Ray (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a HC2c. with Battery D, 2d Battalion,
    at Phu Loc 6, near An Hoa. During the early morning hours, an estimated battalion-sized
    enemy force launched a determined assault against the battery's position, and
    succeeded in effecting a penetration of the barbed-wire perimeter. The initial
    burst of enemy fire caused numerous casualties among the marines who had immediately
    manned their howitzers during the rocket and mortar attack. Undaunted by the intense
    hostile fire, HC2c. Ray moved from parapet to parapet, rendering emergency medical
    treatment to the wounded. Although seriously wounded himself while administering
    first aid to a marine casualty, he refused medical aid and continued his lifesaving
    efforts. While he was bandaging and attempting to comfort another wounded marine,
    HC2c. Ray was forced to battle 2 enemy soldiers who attacked his position, personally
    killing 1 and wounding the other. Rapidly losing his strength as a result of his
    severe wounds, he nonetheless managed to move through the hail of enemy fire to
    other casualties. Once again, he was faced with the intense fire of oncoming enemy
    troops and, despite the grave personal danger and insurmountable odds, succeeded
    in treating the wounded and holding off the enemy until he ran out of ammunition,
    at which time he sustained fatal wounds. HC2c. Ray's final act of heroism was
    to protect the patient he was treating. He threw himself upon the wounded marine,
    thus saving the man's life when an enemy grenade exploded nearby. By his determined
    and persevering actions, courageous spirit, and selfless devotion to the welfare
    of his marine comrades, HC2c. Ray served to inspire the men of Battery D to heroic
    efforts in defeating the enemy. His conduct throughout was in keeping with the
    finest traditions of the U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 3
  day: 19
  year: 1969
  title: Specialist Fourth Class Thomas J. McMahon earns Medal of Honor (posthumous)
  body: "<p>On March 19, 1969, Specialist Fourth Class Thomas J. McMahon was serving
    as medical aid man with Company A when the lead elements of the company came under
    heavy fire from well-fortified enemy positions and three soldiers fell seriously
    wounded. McMahon left his covered position and ran through the fire to one of
    the wounded, gave him first aid, and carried him to safety. He went back through
    the fire to a second wounded man.</p><p>While returning this man to a secure position,
    McMahon was painfully wounded by an exploding mortar round. He refused medical
    attention and ran back through the heavy fire toward the third wounded soldier.
    He was mortally wounded before he could reach him.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Thomas J. McMahon (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sp4c. McMahon distinguished himself
    while serving as medical aid man with Company A. When the lead elements of his
    company came under heavy fire from well-fortified enemy positions, 3 soldiers
    fell seriously wounded. Sp4c. McMahon, with complete disregard for his safety,
    left his covered position and ran through intense enemy fire to the side of 1
    of the wounded, administered first aid and then carried him to safety. He returned
    through the hail of fire to the side of a second wounded man. Although painfully
    wounded by an exploding mortar round while returning the wounded man to a secure
    position, Sp4c. McMahon refused medical attention and heroically ran back through
    the heavy enemy fire toward his remaining wounded comrade. He fell mortally wounded
    before he could rescue the last man. Sp4c. McMahon's undaunted concern for the
    welfare of his comrades at the cost of his life are in keeping with the highest
    traditions of the military service and reflect great credit on himself, his unit,
    and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 3
  day: 20
  year: 1969
  title: Corporal Terry Teruo Kawamura earns Medal of Honor (posthumous)
  body: "<p>On March 20, 1969, Corporal Terry Teruo Kawamura, a member of the 173d
    Engineer Company, was in the unit quarters area when an enemy demolition team
    infiltrated it and opened fire with automatic weapons. Kawamura ran for his weapon.
    At that moment a violent explosion tore a hole in the roof and stunned the men
    in the room. Kawamura got to his feet, secured his weapon, and was running for
    the door to return fire when he saw that a second explosive charge had been thrown
    through the hole in the roof onto the floor.</p><p>Two stunned soldiers were in
    immediate danger. Kawamura shouted a warning and, although he was in a position
    to escape, turned around and threw himself on the charge. He was killed, and several
    members of his unit were spared serious injury or death.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Terry Teruo Kawamura (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Corporal. Kawamura distinguished himself
    by heroic action while serving as a member of the 173d Engineer Company. An enemy
    demolition team infiltrated the unit quarters area and opened fire with automatic
    weapons. Disregarding the intense fire, Corporal. Kawamura ran for his weapon.
    At that moment, a violent explosion tore a hole in the roof and stunned the occupants
    of the room. Corporal. Kawamura jumped to his feet, secured his weapon and, as
    he ran toward the door to return the enemy fire, he observed that another explosive
    charge had been thrown through the hole in the roof to the floor. He immediately
    realized that 2 stunned fellow soldiers were in great peril and shouted a warning.
    Although in a position to escape, Corporal. Kawamura unhesitatingly wheeled around
    and threw himself on the charge. In completely disregarding his safety, Corporal.
    Kawamura prevented serious injury or death to several members of his unit. The
    extraordinary courage and selflessness displayed by Corporal. Kawamura are in
    the highest traditions of the military service and reflect great credit upon himself,
    his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 3
  day: 21
  year: 1969
  title: Specialist Fourth Class Donald R. Johnston earns Medal of Honor (posthumous)
  body: "<p>On March 21, 1969, Specialist Fourth Class Donald R. Johnston, a mortarman
    with Company D, was at a fire support base in Tay Ninh Province when the company,
    in its defensive positions, came under a heavy rocket and mortar attack. Under
    cover of the bombardment, enemy sappers broke through the perimeter and began
    throwing explosive charges into the main defensive bunkers. Johnston and six comrades
    left their exposed positions for one of the bunkers to keep fighting the attackers.</p><p>As
    they fired from the bunker, an enemy soldier threw three explosive charges into
    their position. Johnston hurled himself onto the charges, smothering the detonations
    with his body and shielding the other men from the blast. He was killed, and the
    six soldiers with him lived.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Donald R. Johnston (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sp4c. Johnston distinguished himself
    while serving as a mortarman with Company D, at a fire support base in Tay Ninh
    Province. Sp4c. Johnston's company was in defensive positions when it came under
    a devastating rocket and mortar attack. Under cover of the bombardment, enemy
    sappers broke through the defensive perimeter and began hurling explosive charges
    into the main defensive bunkers. Sp4c. Johnston and 6 of his comrades had moved
    from their exposed positions to 1 of the bunkers to continue their fight against
    the enemy attackers. As they were firing from the bunker, an enemy soldier threw
    3 explosive charges into their position. Sensing the danger to his comrades, Sp4c.
    Johnston, with complete disregard for his safety, hurled himself onto the explosive
    charges, smothering the detonations with his body and shielding his fellow soldiers
    from the blast. His heroic action saved the lives of 6 of his comrades. Sp4c.
    Johnston's concern for his fellow men at the cost of his life were in the highest
    traditions of the military service and reflect great credit upon himself, his
    unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 3
  day: 24
  year: 1969
  title: Private First Class Ronald L. Coker earns Medal of Honor (posthumous)
  body: "<p>On March 24, 1969, Private First Class Ronald L. Coker, a rifleman with
    Company M, was walking point for the 2d Platoon on patrol when he met five enemy
    soldiers on a narrow jungle trail. His squad pursued them to a cave. As the squad
    neared it, intense fire seriously wounded one marine and forced the others to
    take cover. Coker moved across the open ground toward the wounded man. Hit by
    small-arms fire, he kept crawling, threw a hand grenade into the enemy positions,
    and reached the marine.</p><p>As he began dragging the man toward safety, an enemy
    grenade landed on the wounded marine. Coker grabbed it with both hands and turned
    away from his companion, but it exploded before he could throw it clear. Severely
    wounded, he would not leave the man. Two more grenades exploded near him as he
    moved toward friendly lines, and he kept crawling and pulling the marine along.
    The fire was suppressed enough for others to reach him and carry him to a safer
    area, where he died of his wounds.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Ronald L. Coker (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a rifleman with Company M in action
    against enemy forces. While serving as point man for the 2d Platoon, Private First
    Class Coker was leading his patrol when he encountered 5 enemy soldiers on a narrow
    jungle trail. Private First Class Coker's squad aggressively pursued them to a
    cave. As the squad neared the cave, it came under intense hostile fire, seriously
    wounding 1 marine and forcing the others to take cover. Observing the wounded
    man lying exposed to continuous enemy fire, Private First Class Coker disregarded
    his safety and moved across the fire-swept terrain toward his companion. Although
    wounded by enemy small-arms fire, he continued to crawl across the hazardous area
    and skillfully threw a hand grenade into the enemy positions, suppressing the
    hostile fire sufficiently to enable him to reach the wounded man. As he began
    to drag his injured comrade toward safety, a grenade landed on the wounded marine.
    Unhesitatingly, Private First Class Coker grasped it with both hands and turned
    away from his wounded companion, but before he could dispose of the grenade it
    exploded. Severely wounded, but undaunted, he refused to abandon his comrade.
    As he moved toward friendly lines, 2 more enemy grenades exploded near him, inflicting
    still further injuries. Concerned only for the safety of his comrade, Private
    First Class Coker, with supreme effort continued to crawl and pull the wounded
    marine with him. His heroic deeds inspired his fellow marines to such aggressive
    action that the enemy fire was suppressed sufficiently to enable others to reach
    him and carry him to a relatively safe area where he succumbed to his extensive
    wounds. Private First Class Coker's indomitable courage, inspiring initiative
    and selfless devotion to duty upheld the highest traditions of the Marine Corps
    and of the U.S. Naval Service. He gallantly gave his life for his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 3
  day: 24
  year: 1969
  title: Sergeant First Class William Maud Bryant earns Medal of Honor (posthumous)
  body: "<p>On March 24, 1969, Sergeant First Class William Maud Bryant of Company
    A was commanding Civilian Irregular Defense Group Company 321, 2d Battalion, 3d
    Mobile Strike Force Command, when the battalion came under heavy fire and was
    surrounded by elements of three enemy regiments. The attack continued for 34 hours.
    Throughout it Bryant moved about the position under fire, building up the perimeter,
    directing fire, distributing ammunition, and tending the wounded. When a helicopter
    dropped ammunition, he ran through the fire to gather the scattered boxes. During
    a lull he led a patrol outside the perimeter; it was pinned down, and Bryant alone
    repulsed one attack before leading the patrol back.</p><p>As the siege went on,
    Bryant led a patrol to break the encirclement. After 200 meters of heavy fighting
    it was pinned down by fire from fortified bunkers and he was severely wounded.
    He rallied his men, called in helicopter gunships, then charged an automatic weapons
    position and destroyed its three defenders. While regrouping for the final assault,
    he was killed by an enemy rocket.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, William Maud Bryant (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sergeant. 1st Class. Bryant, assigned
    to Company A, distinguished himself while serving as commanding officer of Civilian
    Irregular Defense Group Company 321, 2d Battalion, 3d Mobile Strike Force Command,
    during combat operations. The battalion came under heavy fire and became surrounded
    by the elements of 3 enemy regiments. Sergeant. 1st Class. Bryant displayed extraordinary
    heroism throughout the succeeding 34 hours of incessant attack as he moved throughout
    the company position heedless of the intense hostile fire while establishing and
    improving the defensive perimeter, directing fire during critical phases of the
    battle, distributing ammunition, assisting the wounded, and providing the leadership
    and inspirational example of courage to his men. When a helicopter drop of ammunition
    was made to re-supply the beleaguered force, Sergeant. 1st Class. Bryant with
    complete disregard for his safety ran through the heavy enemy fire to retrieve
    the scattered ammunition boxes and distributed needed ammunition to his men. During
    a lull in the intense fighting, Sergeant. 1st Class. Bryant led a patrol outside
    the perimeter to obtain information of the enemy. The patrol came under intense
    automatic weapons fire and was pinned down. Sergeant. 1st Class. Bryant single-handedly
    repulsed 1 enemy attack on his small force and by his heroic action inspired his
    men to fight off other assaults. Seeing a wounded enemy soldier some distance
    from the patrol location, Sergeant. 1st Class. Bryant crawled forward alone under
    heavy fire to retrieve the soldier for intelligence purposes. Finding that the
    enemy soldier had expired, Sergeant. 1st Class. Bryant crawled back to his patrol
    and led his men back to the company position where he again took command of the
    defense. As the siege continued, Sergeant. 1st Class. Bryant organized and led
    a patrol in a daring attempt to break through the enemy encirclement. The patrol
    had advanced some 200 meters by heavy fighting when it was pinned down by the
    intense automatic weapons fire from heavily fortified bunkers and Sergeant. 1st
    Class. Bryant was severely wounded. Despite his wounds he rallied his men, called
    for helicopter gunship support, and directed heavy suppressive fire upon the enemy
    positions. Following the last gunship attack, Sergeant. 1st Class. Bryant fearlessly
    charged an enemy automatic weapons position, overrunning it, and single-handedly
    destroying its 3 defenders. Inspired by his heroic example, his men renewed their
    attack on the entrenched enemy. While regrouping his small force for the final
    assault against the enemy, Sergeant. 1st Class. Bryant fell mortally wounded by
    an enemy rocket. Sergeant. 1st Class. Bryant's selfless concern for his comrades,
    at the cost of his life above and beyond the call of duty are in keeping with
    the highest traditions of the military service and reflect great credit upon himself,
    his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 3
  day: 25
  year: 1969
  title: First Lieutenant Stephen Holden Doane earns Medal of Honor (posthumous)
  body: "<p>On March 25, 1969, First Lieutenant Stephen Holden Doane was serving as
    a platoon leader when his company, on a tactical operation, ran into an enemy
    force concealed in protected bunkers and trenches. Three of the leading soldiers
    were pinned down by crossfire, one of them seriously wounded. After one platoon's
    attempt to rescue them failed, it was clear that only a small group could get
    close enough to destroy the enemy position and reach the trapped men.</p><p>Doane
    crawled to the nearest bunker and silenced it. He was wounded but continued to
    a second bunker, where he was wounded again as he prepared to throw a grenade.
    He pulled the pin and lunged into the bunker with the grenade, destroying the
    last obstacle. He was killed. His company rescued the trapped men without further
    casualties.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Stephen Holden Doane (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. First Lt. Doane was serving as a platoon
    leader when his company, engaged in a tactical operation, abruptly contacted an
    enemy force concealed in protected bunkers and trenches. Three of the leading
    soldiers were pinned down by enemy crossfire. One was seriously wounded. After
    efforts of 1 platoon to rescue these men had failed, it became obvious that only
    a small group could successfully move close enough to destroy the enemy position
    and rescue or relieve the trapped soldiers, 1st Lt. Doane, although fully aware
    of the danger of such an action, crawled to the nearest enemy bunker and silenced
    it. He was wounded but continued to advance to a second enemy bunker. As he prepared
    to throw a grenade, he was again wounded. Undaunted, he deliberately pulled the
    pin on the grenade and lunged with it into the enemy bunker, destroying this final
    obstacle. 1st Lt. Doane's supreme act enabled his company to rescue the trapped
    men without further casualties. The extraordinary courage and selflessness displayed
    by this officer were an inspiration to his men and are in the highest traditions
    of the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 4
  day: 4
  year: 1969
  title: Staff Sergeant Felix M. Conde-Falcon earns Medal of Honor (posthumous)
  body: "<p>On April 4, 1969, Staff Sergeant Felix M. Conde-Falcon was acting Platoon
    Leader in Company D, 1st Battalion, 505th Infantry Regiment, 3d Brigade, 82d Airborne
    Division, at Ap Tan Hoa. Entering a heavily wooded section, his company encountered
    an extensive enemy bunker complex, later identified as a battalion command post.
    After artillery and air strikes, his platoon was selected to clear the bunkers.
    Moving out ahead, Conde-Falcon charged the first bunker throwing grenades, crawled
    to its blind side, jumped onto the roof, and dropped a grenade through the aperture.
    He destroyed two more bunkers the same way.</p><p>Rejoining his platoon, he advanced
    about one hundred meters before coming under intense fire. He picked three men
    and worked toward the enemy flank. Carrying a machinegun, he assaulted the nearest
    fortification alone and killed the enemy inside before running out of ammunition.
    He returned to his men, took up an M-16 rifle, and moved on the next bunker. Within
    ten meters of it he was shot by an unseen enemy and soon died of his wounds.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Felix M. Conde-Falcon (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: 'For conspicuous gallantry and intrepidity at the risk of his life
    above and beyond the call of duty: Staff Sergeant Felix M. Conde-Falcon distinguished
    himself by acts of gallantry and intrepidity above and beyond the call of duty
    while serving as an acting Platoon Leader in Company D, 1st Battalion, 505th Infantry
    Regiment, 3d Brigade, 82d Airborne Division during combat operations against an
    armed enemy in Ap Tan Hoa, Republic of Vietnam on April 4, 1969. While entering
    a heavily wooded section on the route of advance, Staff Sergeant Conde-Falcon
    and his company encountered an extensive enemy bunker complex, later identified
    as a battalion command post. Following tactical artillery and air strikes on the
    heavily-secured enemy position, Staff Sergeant Conde-Falcon’s platoon was selected
    to assault and clear the bunker fortifications. Moving out ahead of his platoon,
    Staff Sergeant Conde-Falcon charged the first bunker, heaving grenades as he went.
    As the hostile fire increased, he crawled to the blind side of an entrenchment
    position, jumped to the roof, and tossed a grenade into the bunker aperture. Without
    hesitating, he proceeded to two additional bunkers, both of which he destroyed
    in the same manner as the first. Rejoining his platoon, Staff Sergeant Conde-Falcon
    advanced about one hundred meters through the trees before coming under intense
    hostile fire. Selecting three men to accompany him, he maneuvered toward the enemy’s
    flank position. Carrying a machinegun, he single-handedly assaulted the nearest
    fortification, killing the enemy inside before running out of ammunition. After
    returning to the three men with his empty weapon and taking up an M-16 rifle,
    he concentrated on the next bunker. Within ten meters of his goal, Staff Sergeant
    Conde-Falcon was shot by an unseen assailant and soon died of his wounds. Staff
    Sergeant Conde-Falcon’s extraordinary heroism and selflessness at the cost of
    his own life, above and beyond the call of duty, are in keeping with the highest
    traditions of military service and reflect great credit upon himself, his unit
    and the United States Army. Citation represents Soldier''s rank at time of action.
    For more information on Staff Sergeant Felix M. Conde-Falcon visit: https://www.army.mil/medalofhonor/valor24/recipients/conde-falcon/'
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:57Z'
- month: 4
  day: 10
  year: 1969
  title: Specialist Four Jesus S. Duran earns Medal of Honor
  body: "<p>On April 10, 1969, Specialist Four Jesus S. Duran was serving as an acting
    M-60 machinegunner in Company E, 2d Battalion, 5th Cavalry, 1st Cavalry Division
    (Airmobile), in the Republic of Vietnam. That afternoon the reconnaissance platoon
    was moving into an elaborate enemy bunker complex when the lead elements began
    taking concentrated ambush fire from every side, and the command post was in danger
    of being overrun.</p><p>Duran rushed forward firing the M-60 from his hip and
    took a defensive position near the command post. As hostile forces stormed forward
    he stood in the dust raised by impacting rounds and bursting grenades and held
    them off with streams of machinegun fire. Learning that two seriously wounded
    troopers lay pinned down under harassing fire, he assaulted the enemy positions,
    firing on the run. Mounting a log, he fired directly into the enemy's foxholes,
    eliminating four and cutting down several others as they fled, then continued
    to fire on the disorganized and fleeing enemy.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Jesus S. Duran (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: 'For conspicuous gallantry and intrepidity at the risk of his life
    above and beyond the call of duty: Specialist Four Jesus S. Duran distinguished
    himself by acts of gallantry and intrepidity above and beyond the call of duty
    while serving as an acting M-60 machinegunner in Company E, 2d Battalion, 5th
    Cavalry, 1st Cavalry Division (Airmobile) during combat operations against an
    armed enemy in the Republic of Vietnam on April 10, 1969. That afternoon, the
    reconnaissance platoon was moving into an elaborate enemy bunker complex when
    the lead elements began taking concentrated ambush fire from every side. The command
    post was in imminent danger of being overrun. With an M-60 machinegun blazing
    from his hip, Specialist Four Duran rushed forward and assumed a defensive position
    near the command post. As hostile forces stormed forward, Specialist Four Duran
    stood tall in a cloud of dust raised by the impacting rounds and bursting grenades
    directed towards him and thwarted the enemy with devastating streams of machinegun
    fire. Learning that two seriously wounded troopers lay helplessly pinned down
    under harassing fire, Specialist Four Duran assaulted the suppressive enemy positions,
    firing deadly bursts on the run. Mounting a log, he fired directly into the enemy’s
    foxholes, eliminating four and cutting down several others as they fled. Specialist
    Four Duran then continued to pour effective fire on the disorganized and fleeing
    enemy. Specialist Four Duran’s extraordinary heroism and selflessness above and
    beyond the call of duty are in keeping with the highest traditions of military
    service and reflect great credit upon himself, his unit and the United States
    Army. Citation represents Soldier''s rank at time of action. For more information
    on Sergeant Jesus S. Duran visit: https://www.army.mil/medalofhonor/valor24/recipients/duran/'
  summarized_by: Claude Fable 5.1
