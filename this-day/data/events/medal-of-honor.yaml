- month: 1
  day: 10
  year: 1968
  title: Specialist Fifth Class (then Private First Class) Clarence Eugene Sasser
    earns Medal of Honor
  body: "<p>On January 10, 1968, Specialist Fifth Class Clarence Eugene Sasser, a
    medical aidman assigned to Headquarters and Headquarters Company, 3d Battalion,
    was serving with Company A on a reconnaissance in force operation. As the company
    made an air assault it came under heavy small arms, recoilless rifle, machinegun
    and rocket fire from fortified enemy positions on 3 sides of the landing zone,
    and over 30 casualties were sustained in the first few minutes. Sasser ran across
    an open rice paddy to help the wounded. After bringing 1 man to safety he was
    wounded in the left shoulder by rocket fragments. Refusing treatment, he ran through
    rocket and automatic weapons fire to treat casualties of the initial attack and
    kept searching for others.</p><p>Two more wounds immobilized his legs. He dragged
    himself through the mud to a soldier 100 meters away, treated him, and then encouraged
    another group of soldiers to crawl 200 meters to relative safety, where he tended
    their wounds for 5 hours until they were evacuated.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Clarence Eugene Sasser (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sp5c. Sasser distinguished himself
    while assigned to Headquarters and Headquarters Company, 3d Battalion. He was
    serving as a medical aidman with Company A, 3d Battalion, on a reconnaissance
    in force operation. His company was making an air assault when suddenly it was
    taken under heavy small arms, recoilless rifle, machinegun and rocket fire from
    well fortified enemy positions on 3 sides of the landing zone. During the first
    few minutes, over 30 casualties were sustained. Without hesitation, Sp5c. Sasser
    ran across an open rice paddy through a hail of fire to assist the wounded. After
    helping 1 man to safety, was painfully wounded in the left shoulder by fragments
    of an exploding rocket. Refusing medical attention, he ran through a barrage of
    rocket and automatic weapons fire to aid casualties of the initial attack and,
    after giving them urgently needed treatment, continued to search for other wounded.
    Despite 2 additional wounds immobilizing his legs, he dragged himself through
    the mud toward another soldier 100 meters away. Although in agonizing pain and
    faint from loss of blood, Sp5c. Sasser reached the man, treated him, and proceeded
    on to encourage another group of soldiers to crawl 200 meters to relative safety.
    There he attended their wounds for 5 hours until they were evacuated. Sp5c. Sasser's
    extraordinary heroism is in keeping with the highest traditions of the military
    service and reflects great credit upon himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 1
  day: 12
  year: 1968
  title: Sergeant (then Private First Class) William D. Port earns Medal of Honor
    (posthumous)
  body: <p>On January 12, 1968, Sergeant William D. Port (then Private First Class)
    was serving as a rifleman with Company C in combat operations in the Que Son Valley.
    His platoon was moving to cut off a reported movement of enemy soldiers when it
    came under heavy fire from an entrenched enemy force and was forced to withdraw.
    Although wounded in the hand as the withdrawal began, Port ran through the fire
    to help a wounded comrade back to the platoon perimeter.</p><p>As the enemy assaulted
    the perimeter, Port and 3 comrades were behind an embankment when an enemy grenade
    landed among them. He shouted the warning "Grenade" and threw himself toward it
    to shield the others from the explosion. The citation states that he saved the
    lives of his fellow soldiers and that his action gave the platoon the inspiration
    needed to hold its position.</p>
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, William D. Port (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. Sergeant. Port distinguished himself while serving
    as a rifleman with Company C, which was conducting combat operations against an
    enemy force in the Que Son Valley. As Sergeant. Port's platoon was moving to cut
    off a reported movement of enemy soldiers, the platoon came under heavy fire from
    an entrenched enemy force. The platoon was forced to withdraw due to the intensity
    and ferocity of the fire. Although wounded in the hand as the withdrawal began,
    Sergeant. Port, with complete disregard for his safety, ran through the heavy
    fire to assist a wounded comrade back to the safety of the platoon perimeter.
    As the enemy forces assaulted in the perimeter, Sergeant. Port and 3 comrades
    were in position behind an embankment when an enemy grenade landed in their midst.
    Sergeant. Port, realizing the danger to his fellow soldiers, shouted the warning,
    "Grenade," and unhesitatingly hurled himself towards the grenade to shield his
    comrades from the explosion. Through his exemplary courage and devotion he saved
    the lives of his fellow soldiers and gave the members of his platoon the inspiration
    needed to hold their position. Sergeant. Port's selfless concern for his comrades,
    at the risk of his life above and beyond the call of duty are in keeping with
    the highest tradition of the military service and reflect great credit on himself,
    his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 1
  day: 15
  year: 1968
  title: Specialist Fifth Class Dwight H. Johnson earns Medal of Honor
  body: "<p>On January 15, 1968, Specialist Fifth Class Dwight H. Johnson, a tank
    driver with Company B, was part of a reaction force moving to aid other elements
    of his platoon, which was in heavy contact with a battalion size North Vietnamese
    force. At the point of contact his tank threw a track and was immobilized. He
    climbed out armed only with a .45 caliber pistol and killed several enemy soldiers
    before running out of ammunition. He returned to his tank through heavy fire for
    a sub-machine gun and went back to the center of the ambush site, killing more
    of the enemy; when that ammunition was spent he killed an enemy soldier with the
    stock of the weapon.</p><p>Weaponless, Johnson climbed into his platoon sergeant's
    tank, pulled out a wounded crewmember, and carried him to an armored personnel
    carrier. He helped fire that tank's main gun until it jammed, then engaged nearby
    North Vietnamese troops with his pistol. He remounted his own tank and, fully
    exposed, fired its externally-mounted .50 caliber machine gun until the situation
    was brought under control.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Dwight H. Johnson (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. Sp5c. Johnson, a tank driver with Company B, was
    a member of a reaction force moving to aid other elements of his platoon, which
    was in heavy contact with a battalion size North Vietnamese force. Sp5c. Johnson's
    tank, upon reaching the point of contact, threw a track and became immobilized.
    Realizing that he could do no more as a driver, he climbed out of the vehicle,
    armed only with a .45 caliber pistol. Despite intense hostile fire, Sp5c. Johnson
    killed several enemy soldiers before he had expended his ammunition. Returning
    to his tank through a heavy volume of antitank rocket, small arms and automatic
    weapons fire, he obtained a sub-machine gun with which to continue his fight against
    the advancing enemy. Armed with this weapon, Sp5c. Johnson again braved deadly
    enemy fire to return to the center of the ambush site where he courageously eliminated
    more of the determined foe. Engaged in extremely close combat when the last of
    his ammunition was expended, he killed an enemy soldier with the stock end of
    his submachine gun. Now weaponless, Sp5c. Johnson ignored the enemy fire around
    him, climbed into his platoon sergeant's tank, extricated a wounded crewmember
    and carried him to an armored personnel carrier. He then returned to the same
    tank and assisted in firing the main gun until it jammed. In a magnificent display
    of courage, Sp5c. Johnson exited the tank and again armed only with a .45 caliber
    pistol, engaged several North Vietnamese troops in close proximity to the vehicle.
    Fighting his way through devastating fire and remounting his own immobilized tank,
    he remained fully exposed to the enemy as he bravely and skillfully engaged them
    with the tank's externally-mounted .50 caliber machine gun; where he remained
    until the situation was brought under control. Sp5c. Johnson's profound concern
    for his fellow soldiers, at the risk of his life above and beyond the call of
    duty are in keeping with the highest traditions of the military service and reflect
    great credit upon himself and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 1
  day: 18
  year: 1968
  title: Sergeant Gordon Douglas Yntema earns Medal of Honor (posthumous)
  body: "<p>On January 18, 1968, Sergeant Gordon Douglas Yntema, assigned to Detachment
    A-431, Company D, was with 2 platoons of civilian irregulars from Camp Cai Cai
    at a blocking position east of the village of Thong Binh, heavily engaged with
    the Viet Cong. When the Vietnamese commander was seriously wounded, Yntema took
    control and advanced the force to within 50 meters of the enemy bunkers. After
    a 30 minute fire fight he pulled his men back to a trench. About 1 company of
    Viet Cong then pinned the platoons down from 3 sides, and a mortar barrage and
    dwindling ammunition caused many of the irregulars to withdraw.</p><p>Seriously
    wounded and ordered to withdraw, Yntema refused to leave his fallen comrades.
    He carried the wounded Vietnamese commander and a mortally wounded American Special
    Forces advisor to a gully 50 meters away and kept fighting until, out of ammunition
    and surrounded, he was offered the chance to surrender. He refused and used his
    rifle as a club against the approximately 15 Viet Cong trying to capture him,
    until they shot him.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Gordon Douglas Yntema (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life and above and beyond the call of duty. Sergeant. Yntema, U.S. Army, distinguished
    himself while assigned to Detachment A-431, Company D. As part of a larger force
    of civilian irregulars from Camp Cai Cai, he accompanied 2 platoons to a blocking
    position east of the village of Thong Binh, where they became heavily engaged
    in a small-arms fire fight with the Viet Cong. Assuming control of the force when
    the Vietnamese commander was seriously wounded, he advanced his troops to within
    50 meters of the enemy bunkers. After a fierce 30 minute fire fight, the enemy
    forced Sergeant. Yntema to withdraw his men to a trench in order to afford them
    protection and still perform their assigned blocking mission. Under cover of machinegun
    fire, approximately 1 company of Viet Cong maneuvered into a position which pinned
    down the friendly platoons from 3 sides. A dwindling ammunition supply, coupled
    with a Viet Cong mortar barrage which inflicted heavy losses on the exposed friendly
    troops, caused many of the irregulars to withdraw. Seriously wounded and ordered
    to withdraw himself, Sergeant. Yntema refused to leave his fallen comrades. Under
    withering small arms and machinegun fire, he carried the wounded Vietnamese commander
    and a mortally wounded American Special Forces advisor to a small gully 50 meters
    away in order to shield them from the enemy fire. Sergeant. Yntema then continued
    to repulse the attacking Viet Cong attempting to overrun his position until, out
    of ammunition and surrounded, he was offered the opportunity to surrender. Refusing,
    Sergeant. Yntema stood his ground, using his rifle as a club to fight the approximately
    15 Viet Cong attempting his capture. His resistance was so fierce that the Viet
    Cong were forced to shoot in order to overcome him. Sergeant. Yntema's personal
    bravery in the face of insurmountable odds and supreme self-sacrifice were in
    keeping with the highest traditions of the military service and reflect the utmost
    credit upon himself, the 1st Special Forces, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 1
  day: 31
  year: 1968
  title: Chief Warrant Officer Frederick Edgar Ferguson earns Medal of Honor
  body: "<p>On January 31, 1968, Chief Warrant Officer Frederick Edgar Ferguson of
    Company C was commanding a resupply helicopter when he monitored an emergency
    call from the wounded passengers and crewmen of a downed helicopter under heavy
    attack inside the enemy controlled city of Hue. He volunteered to attempt the
    evacuation. Despite warnings from all aircraft to stay clear because of heavy
    antiaircraft fire, he flew a low-level route at maximum airspeed along the Perfume
    River toward the small, isolated South Vietnamese Army compound where the crash
    survivors had taken refuge.</p><p>Holding his course through short range fire
    from enemy occupied buildings and boats, Ferguson landed in a confined area in
    a blinding dust cloud under mortar and small-arms fire. Mortar fragments severely
    damaged the helicopter while the wounded were loaded. He took off through the
    continuing mortar fire, flew the damaged aircraft back along the same route, and
    returned the wounded to friendly control. The citation credits him with saving
    the lives of 5 of his comrades.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Frederick Edgar Ferguson (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. CWO Ferguson, U.S. Army distinguished
    himself while serving with Company C. CWO Ferguson, commander of a resupply helicopter
    monitoring an emergency call from wounded passengers and crewmen of a downed helicopter
    under heavy attack within the enemy controlled city of Hue, unhesitatingly volunteered
    to attempt evacuation. Despite warnings from all aircraft to stay clear of the
    area due to heavy antiaircraft fire, CWO Ferguson began a low-level night at maximum
    airspeed along the Perfume River toward the tiny, isolated South Vietnamese Army
    compound in which the crash survivors had taken refuge. Coolly and skillfully
    maintaining his course in the face of intense, short range fire from enemy occupied
    buildings and boats, he displayed superior flying skill and tenacity of purpose
    by landing his aircraft in an extremely confined area in a blinding dust cloud
    under heavy mortar and small-arms fire. Although the helicopter was severely damaged
    by mortar fragments during the loading of the wounded, CWO Ferguson disregarded
    the damage and, taking off through the continuing hail of mortar fire, he flew
    his crippled aircraft on the return route through the rain of fire that he had
    experienced earlier and safely returned his wounded passengers to friendly control.
    CWO Ferguson's extraordinary determination saved the lives of 5 of his comrades.
    His actions are in the highest traditions of the military service and reflect
    great credit on himself and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 1
  day: 31
  year: 1968
  title: Specialist Five Dwight W. Birdwell earns Medal of Honor (posthumous)
  body: "<p>On January 31, 1968, Specialist Five Dwight W. Birdwell was serving with
    C Troop, 3d Squadron, 4th Cavalry, 25th Infantry Division, which was ordered south
    to help repel an enemy attack on Tan Son Nhut Airbase. Nearing the west gate,
    the column of tanks and armored personnel carriers drove into an enemy force of
    three battalions; the lead tank, crippled by a rocket-propelled grenade, blocked
    the road. When his tank commander was wounded, Birdwell moved him to safety and
    took his place in the hatch, firing the .50 caliber machine gun and 90mm main
    gun until the main gun ammunition was gone and the machine gun overheated, then
    his M-16 rifle.</p><p>When a U.S. helicopter crashed nearby, Birdwell retrieved
    two M-60 machine guns and ammunition from it, gave one to another soldier, and
    fired the other until it was hit. Wounded in the face, neck, chest, and arms,
    he refused evacuation, rallied soldiers to a defensive position by a large tree,
    and as the fire lessened gathered ammunition from disabled vehicles and moved
    wounded soldiers to safety.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Dwight W. Birdwell (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: 'For conspicuous gallantry and intrepidity at the risk of his life
    above and beyond the call of duty: Specialist Five Dwight W. Birdwell distinguished
    himself by acts of gallantry and intrepidity above and beyond the call of duty
    while serving with C Troop, 3d Squadron, 4th Cavalry, 25th Infantry Division in
    the Republic of Vietnam on 31 January, 1968. On this date, C Troop was ordered
    to move south to help repel an enemy attack on Tan Son Nhut Airbase. As the C
    Troop column of tanks and armored personnel carriers approached the west gate
    of Tan Son Nhut Airbase, it came under intense enemy fire from a building to its
    right. Unbeknown to C Troop, it had driven directly into an enemy force consisting
    of three battalions. The column tried to push through the initial attack but the
    lead tank, crippled by a rocket-propelled grenade explosion, was blocking the
    way forward. C Troop immediately came under heavy enemy fire from both sides of
    the road. Specialist Five Birdwell, upon seeing that his tank commander was wounded
    by enemy fire, immediately went to his aid. Under intense enemy fire, he lowered
    the injured tank commander to the ground, and moved him to safety. Specialist
    Five Birdwell then, with complete disregard for his own safety, mounted the tank
    and assumed the tank commander''s position. Standing in the tank commander''s
    hatch with the upper half of his body exposed to heavy enemy fire, Specialist
    Five Birdwell used the tank''s .50 caliber machine gun and 90mm main gun to suppress
    the enemy attack. With the ammunition for the 90mm main gun exhausted, he continued
    to fire the .50 caliber machine gun until it overheated. At this point, Specialist
    Five Birdwell, rather than abandoning his position, continued to engage the enemy
    with his M-16 rifle, sometimes exposing his entire body to enemy fire in order
    to engage the enemy from a better vantage point. When a U.S. helicopter crashed
    nearby, Specialist Five Birdwell, under withering enemy fire, dismounted and moved
    to the helicopter where he retrieved two M-60 machine guns and ammunition. After
    giving one M-60 and ammunition to a fellow soldier, he remounted his tank and
    used the other M-60 to again engage the enemy. Specialist Five Birdwell continued
    to engage the enemy with complete disregard for his own safety until the M-60
    he was firing was hit by enemy fire. Specialist Five Birdwell, now wounded in
    the face, neck, chest, and arms, dismounted the tank but refused to be medically
    evacuated. Instead, Specialist Five Birdwell, under enemy fire, rallied fellow
    soldiers to advance toward the front of the armored column where they set up a
    defensive position by a large tree. From this position, he and the other soldiers
    engaged the enemy with M-16 fire and grenades. As the enemy fire lessened, Specialist
    Five Birdwell gathered ammunition from disabled vehicles and helped wounded soldiers
    move to safer positions. His leadership and tenacity under fire inspired the other
    C Troop soldiers to continue fighting against the superior enemy force, and directly
    contributed to the enemy''s ultimate defeat. Specialist Five Birdwell''s extraordinary
    heroism and selflessness above and beyond the call of duty were in keeping with
    the highest traditions of military service and reflect great credit upon himself,
    his unit, and the United States Army'
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 2
  day: 1
  year: 1968
  title: Staff Sergeant Drew Dennis Dix earns Medal of Honor
  body: "<p>On February 1, 1968, Staff Sergeant Drew Dennis Dix, serving as a unit
    adviser, completed two days of fighting in Chau Phu, the Province capital city,
    which two heavily armed Viet Cong battalions had attacked, breaking down its defenses.
    Recalled with a patrol of Vietnamese soldiers to help defend the city, Dix organized
    a relief force that rescued a nurse trapped in a house near the city center. He
    then led another force to rescue 8 civilian employees from a building under mortar
    and small-arms fire, and assaulted a building held by Viet Cong, killing 6 and
    rescuing 2 Filipinos.</p><p>The following day Dix assembled a 20-man force and
    cleared the Viet Cong from the hotel, theater, and adjacent buildings; Army Republic
    of Vietnam soldiers rallied and joined the firing. He captured 20 prisoners, including
    a high ranking Viet Cong official, and rescued the wife and children of the Deputy
    Province Chief. The citation credits him with 14 confirmed Viet Cong killed, 20
    prisoners, 15 weapons, and the rescue of 14 United States and free world civilians.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Drew Dennis Dix (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. S/Sergeant. Dix distinguished himself
    by exceptional heroism while serving as a unit adviser. Two heavily armed Viet
    Cong battalions attacked the Province capital city of Chau Phu resulting in the
    complete breakdown and fragmentation of the defenses of the city. S/Sergeant.
    Dix, with a patrol of Vietnamese soldiers, was recalled to assist in the defense
    of Chau Phu. Learning that a nurse was trapped in a house near the center of the
    city, S/Sergeant. Dix organized a relief force, successfully rescued the nurse,
    and returned her to the safety of the Tactical Operations Center. Being informed
    of other trapped civilians within the city, S/Sergeant. Dix voluntarily led another
    force to rescue 8 civilian employees located in a building which was under heavy
    mortar and small-arms fire. S/Sergeant. Dix then returned to the center of the
    city. Upon approaching a building, he was subjected to intense automatic rifle
    and machine gun fire from an unknown number of Viet Cong. He personally assaulted
    the building, killing 6 Viet Cong, and rescuing 2 Filipinos. The following day
    S/Sergeant. Dix, still on his own volition, assembled a 20-man force and though
    under intense enemy fire cleared the Viet Cong out of the hotel, theater, and
    other adjacent buildings within the city. During this portion of the attack, Army
    Republic of Vietnam soldiers inspired by the heroism and success of S/Sergeant.
    Dix, rallied and commenced firing upon the Viet Cong. S/Sergeant. Dix captured
    20 prisoners, including a high ranking Viet Cong official. He then attacked enemy
    troops who had entered the residence of the Deputy Province Chief and was successful
    in rescuing the official's wife and children. S/Sergeant. Dix's personal heroic
    actions resulted in 14 confirmed Viet Cong killed in action and possibly 25 more,
    the capture of 20 prisoners, 15 weapons, and the rescue of the 14 United States
    and free world civilians. The heroism of S/Sergeant. Dix was in the highest tradition
    and reflects great credit upon the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 2
  day: 2
  year: 1968
  title: Corporal Larry Leonard Maxam earns Medal of Honor (posthumous)
  body: "<p>On February 2, 1968, Corporal Larry Leonard Maxam, a fire team leader
    with Company D, was at the Cam Lo District Headquarters when it came under heavy
    rocket, artillery, mortar, and recoilless rifle fire from a numerically superior
    enemy force, which destroyed part of the defensive perimeter. Seeing the enemy
    massing to assault across the remaining wire, Maxam handed his fire team to his
    assistant and ran to an abandoned machine gun position in the weakened section,
    taking multiple fragmentation wounds from grenades on the way. He opened fire
    on the advancing enemy.</p><p>A rocket propelled grenade hit his position, wounding
    his face and right eye; he resumed firing and was hit again by small-arms fire.
    His machine gun fire drove the enemy back through the wire to cover. The North
    Vietnamese threw grenades and directed recoilless rifle fire at him, wounding
    him twice more. Too weak to reload the machine gun, he lay prone and fired his
    rifle. After 11/2 hours of repeated wounds he died, having defended nearly half
    the perimeter alone.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Larry Leonard Maxam (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a fire team leader with Company D.
    The Cam Lo District Headquarters came under extremely heavy rocket, artillery,
    mortar, and recoilless rifle fire from a numerically superior enemy force, destroying
    a portion of the defensive perimeter. Corporal. Maxam, observing the enemy massing
    for an assault into the compound across the remaining defensive wire, instructed
    his assistant fire team leader to take charge of the fire team, and unhesitatingly
    proceeded to the weakened section of the perimeter. Completely exposed to the
    concentrated enemy fire, he sustained multiple fragmentation wounds from exploding
    grenades as he ran to an abandoned machine gun position. Reaching the emplacement,
    he grasped the machine gun and commenced to deliver effective fire on the advancing
    enemy. As the enemy directed maximum firepower against the determined marine,
    Corporal. Maxam's position received a direct hit from a rocket propelled grenade,
    knocking him backwards and inflicting severe fragmentation wounds to his face
    and right eye. Although momentarily stunned and in intense pain, Corporal. Maxam
    courageously resumed his firing position and subsequently was struck again by
    small-arms fire. With resolute determination, he gallantly continued to deliver
    intense machine gun fire, causing the enemy to retreat through the defensive wire
    to positions of cover. In a desperate attempt to silence his weapon, the North
    Vietnamese threw hand grenades and directed recoilless rifle fire against him
    inflicting 2 additional wounds. Too weak to reload his machine gun, Corporal.
    Maxam fell to a prone position and valiantly continued to deliver effective fire
    with his rifle. After 11/2 hours, during which he was hit repeatedly by fragments
    from exploding grenades and concentrated small-arms fire, he succumbed to his
    wounds, having successfully defended nearly half of the perimeter single-handedly.
    Corporal. Maxam's aggressive fighting spirit, inspiring valor and selfless devotion
    to duty reflected great credit upon himself and the Marine Corps and upheld the
    highest traditions of the U.S. Naval Service. He gallantly gave his life for his
    country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 2
  day: 4
  year: 1968
  title: Sergeant Alfredo Gonzalez earns Medal of Honor (posthumous)
  body: "<p>On February 4, 1968, Sergeant Alfredo Gonzalez, platoon commander of 3d
    Platoon, Company A, was mortally wounded in a fight that had begun on 31 January
    1968. On that day, during the initial phase of Operation Hue City, his unit moved
    by truck convoy along Route No. 1 to relieve Hue. Near the village of Lang Van
    Lrong the marines came under heavy fire; Gonzalez directed his platoon's fire
    until the snipers were cleared. South of Hue the column was hit again, and he
    ran through the fire to carry a wounded marine to cover, receiving fragmentation
    wounds. When a fortified machine gun bunker halted the company, he moved his platoon
    along a rice paddy dike opposite the bunker and destroyed it with hand grenades.</p><p>Wounded
    again on 3 February, Gonzalez refused treatment and continued to lead. On 4 February,
    with the company pinned down by automatic weapons and rocket fire, he moved from
    position to position firing light antitank assault weapons, knocked out a rocket
    position, and suppressed much of the enemy fire before he fell.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Alfredo Gonzalez (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as platoon commander, 3d Platoon, Company
    A. On 31 January 1968, during the initial phase of Operation Hue City, Sergeant.
    Gonzalez' unit was formed as a reaction force and deployed to Hue to relieve the
    pressure on the beleaguered city. While moving by truck convoy along Route No.
    1, near the village of Lang Van Lrong, the marines received a heavy volume of
    enemy fire. Sergeant. Gonzalez aggressively maneuvered the marines in his platoon,
    and directed their fire until the area was cleared of snipers. Immediately after
    crossing a river south of Hue, the column was again hit by intense enemy fire.
    One of the marines on top of a tank was wounded and fell to the ground in an exposed
    position. With complete disregard for his safety, Sergeant. Gonzalez ran through
    the fire-swept area to the assistance of his injured comrade. He lifted him up
    and though receiving fragmentation wounds during the rescue, he carried the wounded
    marine to a covered position for treatment. Due to the increased volume and accuracy
    of enemy fire from a fortified machine gun bunker on the side of the road, the
    company was temporarily halted. Realizing the gravity of the situation, Sergeant.
    Gonzalez exposed himself to the enemy fire and moved his platoon along the east
    side of a bordering rice paddy to a dike directly across from the bunker. Though
    fully aware of the danger involved, he moved to the fire-swept road and destroyed
    the hostile position with hand grenades. Although seriously wounded again on 3
    February, he steadfastly refused medical treatment and continued to supervise
    his men and lead the attack. On 4 February, the enemy had again pinned the company
    down, inflicting heavy casualties with automatic weapons and rocket fire. Sergeant.
    Gonzalez, utilizing a number of light antitank assault weapons, fearlessly moved
    from position to position firing numerous rounds at the heavily fortified enemy
    emplacements. He successfully knocked out a rocket position and suppressed much
    of the enemy fire before falling mortally wounded. The heroism, courage, and dynamic
    leadership displayed by Sergeant. Gonzalez reflected great credit upon himself
    and the Marine Corps, and were in keeping with the highest traditions of the U.S.
    Naval Service. He gallantly gave his life for his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 2
  day: 6
  year: 1968
  title: Sergeant First Class Eugene Ashley, Jr. earns Medal of Honor (posthumous)
  body: "<p>On February 6, 1968, Sergeant First Class Eugene Ashley, Jr., of Detachment
    A-101, Company C, was the senior special forces advisor of a hastily organized
    force assembled to rescue U.S. special forces advisors trapped at Camp Lang Vei.
    During the initial North Vietnamese army attack he supported the camp with high
    explosive and illumination mortar rounds, and when communications with the main
    camp were lost he took over directing air strikes and artillery. He organized
    a small assault force of local friendly personnel and led it in 5 assaults through
    grenades, machine gun and automatic weapons fire, past booby-trapped satchel charges
    in the bunkers along his approach.</p><p>On the fifth assault he adjusted air
    strikes nearly on top of his own element, forcing the enemy to withdraw and giving
    friendly forces the summit of the hill. Seriously wounded by machine gun fire,
    he continued until he lost consciousness and was carried from the summit, where
    an enemy artillery round killed him. The citation states that his assaults opened
    a channel through which the survivors of Camp Lang Vei escaped.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Eugene Ashley, Jr. (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: Sergeant. 1st Class. Ashley, distinguished himself by conspicuous gallantry
    and intrepidity while serving with Detachment A-101, Company C. Sergeant. 1st
    Class. Ashley was the senior special forces Advisor of a hastily organized assault
    force whose mission was to rescue entrapped U.S. special forces advisors at Camp
    Lang Vei. During the initial attack on the special forces camp by North Vietnamese
    army forces, Sergeant. 1st Class. Ashley supported the camp with high explosive
    and illumination mortar rounds. When communications were lost with the main camp,
    he assumed the additional responsibility of directing air strikes and artillery
    support. Sergeant. 1st Class. Ashley organized and equipped a small assault force
    composed of local friendly personnel. During the ensuing battle, Sergeant. 1st
    Class. Ashley led a total of 5 vigorous assaults against the enemy, continuously
    exposing himself to a voluminous hail of enemy grenades, machine gun and automatic
    weapons fire. Throughout these assaults, he was plagued by numerous booby-trapped
    satchel charges in all bunkers on his avenue of approach. During his fifth and
    final assault, he adjusted air strikes nearly on top of his assault element, forcing
    the enemy to withdraw and resulting in friendly control of the summit of the hill.
    While exposing himself to intense enemy fire, he was seriously wounded by machine
    gun fire but continued his mission without regard for his personal safety. After
    the fifth assault he lost consciousness and was carried from the summit by his
    comrades only to suffer a fatal wound when an enemy artillery round landed in
    the area. Sergeant. 1st Class. Ashley displayed extraordinary heroism in risking
    his life in an attempt to save the lives of his entrapped comrades and commanding
    officer. His total disregard for his personal safety while exposed to enemy observation
    and automatic weapons fire was an inspiration to all men committed to the assault.
    The resolute valor with which he led 5 gallant charges placed critical diversionary
    pressure on the attacking enemy and his valiant efforts carved a channel in the
    overpowering enemy forces and weapons positions through which the survivors of
    Camp Lang Vei eventually escaped to freedom. Sergeant. 1st Class. Ashley's bravery
    at the cost of his life was in the highest traditions of the military service,
    and reflects great credit upon himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 2
  day: 6
  year: 1968
  title: Specialist Fourth Class Thomas James Kinsman earns Medal of Honor
  body: "<p>On February 6, 1968, Specialist Fourth Class Thomas James Kinsman (then
    Private First Class) was serving as a rifleman with Company B on a reconnaissance-in-force
    mission. In the afternoon, as the company moved up a narrow canal in armored troop
    carriers, it came under sudden rocket, automatic weapons and small-arms fire from
    a well entrenched Viet Cong force. The company beached and assaulted the enemy
    bunker complex. In undergrowth so dense that visibility was limited to 10 meters,
    a group of 8 men was cut off from the main body.</p><p>As the group moved through
    heavy fire to rejoin the company, a concealed enemy soldier threw a grenade into
    their midst. Kinsman warned his comrades, then threw himself on the grenade and
    blocked the explosion with his body, suffering severe head and chest wounds. The
    citation states that his action averted loss of life and injury to the other 7
    men of his element.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Thomas James Kinsman (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty Sp4c. Kinsman (then Private First Class)
    distinguished himself in action in the afternoon while serving as a rifleman with
    Company B, on a reconnaissance-in-force mission. As his company was proceeding
    up a narrow canal in armored troops carriers, it came under sudden and intense
    rocket, automatic weapons and small-arms fire from a well entrenched Viet Cong
    force. The company immediately beached and began assaulting the enemy bunker complex.
    Hampered by exceedingly dense undergrowth which limited visibility to 10 meters,
    a group of 8 men became cut off from the main body of the company. As they were
    moving through heavy enemy fire to effect a link-up, an enemy soldier in a concealed
    position hurled a grenade into their midst. Sp4c. Kinsman immediately alerted
    his comrades of the danger, then unhesitatingly threw himself on the grenade and
    blocked the explosion with his body. As a result of his courageous action, he
    received severe head and chest wounds. Through his indomitable courage, complete
    disregard for his personal safety and profound concern for his fellow soldiers,
    Sp4c. Kinsman averted loss of life and injury to the other 7 men of his element.
    Sp4c. Kinsman's extraordinary heroism at the risk of his life, above and beyond
    the call of duty, are in keeping with the highest traditions of the military service
    and reflect great credit upon himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 2
  day: 16
  year: 1968
  title: Second Lieutenant Terrence Collinson Graves earns Medal of Honor (posthumous)
  body: "<p>On February 16, 1968, Second Lieutenant Terrence Collinson Graves, a platoon
    commander with the 3d Force Reconnaissance Company, was leading an 8-man patrol
    on a long-range reconnaissance mission when it saw 7 enemy soldiers approaching
    and engaged them. Searching the area afterward with 2 patrol members, he came
    under heavy fire from a numerically superior enemy force. When 1 of his men was
    hit, Graves moved through the fire to his radio, requested air support, and adjusted
    artillery and gunship fire on the enemy, then returned with another marine to
    eliminate the enemy still alive.</p><p>Moving toward a landing zone, the patrol
    was hit again; 2 more marines and Graves were wounded. He refused medical attention,
    directed air strikes and artillery, guided the aircraft into a new landing site,
    and boarded his men under fire. Finding that 1 wounded man had not embarked, he
    sent the aircraft off and went to the casualty with another marine, directing
    supporting arms until a second helicopter arrived. Enemy fire hit that helicopter
    and it crashed shortly after liftoff. All aboard were killed.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Terrence Collinson Graves (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty as a platoon commander with the 3d Force Reconnaissance
    Company. While on a long-range reconnaissance mission, 2d Lt. Graves' 8-man patrol
    observed 7 enemy soldiers approaching their position. Reacting instantly, he deployed
    his men and directed their fire on the approaching enemy. After the fire had ceased,
    he and 2 patrol members commenced a search of the area, and suddenly came under
    a heavy volume of hostile small arms and automatic weapons fire from a numerically
    superior enemy force. When 1 of his men was hit by the enemy fire, 2d Lt. Graves
    moved through the fire-swept area to his radio and, while directing suppressive
    fire from his men, requested air support and adjusted a heavy volume of artillery
    and helicopter gunship fire upon the enemy. After attending the wounded, 2d Lt.
    Graves, accompanied by another marine, moved from his relatively safe position
    to confirm the results of the earlier engagement. Observing that several of the
    enemy were still alive, he launched a determined assault, eliminating the remaining
    enemy troops. He then began moving the patrol to a landing zone for extraction,
    when the unit again came under intense fire which wounded 2 more marines and 2d
    Lt. Graves. Refusing medical attention, he once more adjusted air strikes and
    artillery fire upon the enemy while directing the fire of his men. He led his
    men to a new landing site into which he skillfully guided the incoming aircraft
    and boarded his men while remaining exposed to the hostile fire. Realizing that
    1 of the wounded had not em barked, he directed the aircraft to depart and, along
    with another marine, moved to the side of the casualty. Confronted with a shortage
    of ammunition, 2d Lt. Graves utilized supporting arms and directed fire until
    a second helicopter arrived. At this point, the volume of enemy fire intensified,
    hitting the helicopter and causing it to crash shortly after liftoff. All aboard
    were killed. 2d Lt. Graves' outstanding courage, superb leadership and indomitable
    fighting spirit throughout the day were in keeping with the highest traditions
    of the Marine Corps and the U.S. Naval Service. He gallantly gave his life for
    his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 2
  day: 19
  year: 1968
  title: Sergeant First Class (then S/Sergeant.) Fred William Zabitosky earns Medal
    of Honor
  body: "<p>On February 19, 1968, Sergeant First Class Fred William Zabitosky was
    assistant team leader of a 9-man Special Forces long-range reconnaissance patrol
    operating deep in enemy-controlled territory when a numerically superior North
    Vietnamese Army unit attacked. He rallied the team into defensive positions, then
    ordered the patrol to a landing zone for helicopter extraction while he covered
    the withdrawal with rifle fire and grenades. Rejoining them, he set each man in
    a tight perimeter and controlled their fire until tactical air support and an
    extraction team arrived.</p><p>Zabitosky exposed himself to adjust gunship fire
    around the landing zone, then fired from the door of a rescue helicopter as it
    lifted off. The helicopter was hit, spun out of control, and crashed, throwing
    him clear. He went back to the burning wreckage, pulled the severely wounded pilot
    from the fire, and tried repeatedly to reach his patrol members before the heat
    drove him back. With serious burns and crushed ribs, he dragged the unconscious
    pilot through enemy fire to within 10 feet of a hovering rescue helicopter before
    collapsing.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Fred William Zabitosky (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sergeant. 1st Class. Zabitosky, U.S.
    Army, distinguished himself while serving as an assistant team leader of a 9-man
    Special Forces long-range reconnaissance patrol. Sergeant. 1st Class. Zabitosky's
    patrol was operating deep within enemy-controlled territory when they were attacked
    by a numerically superior North Vietnamese Army unit. Sergeant. 1st Class. Zabitosky
    rallied his team members, deployed them into defensive positions, and, exposing
    himself to concentrated enemy automatic weapons fire, directed their return fire.
    Realizing the gravity of the situation, Sergeant. 1st Class. Zabitosky ordered
    his patrol to move to a landing zone for helicopter extraction while he covered
    their withdrawal with rifle fire and grenades. Rejoining the patrol under increasing
    enemy pressure, he positioned each man in a tight perimeter defense and continually
    moved from man to man, encouraging them and controlling their defensive fire.
    Mainly due to his example, the outnumbered patrol maintained its precarious position
    until the arrival of tactical air support and a helicopter extraction team. As
    the rescue helicopters arrived, the determined North Vietnamese pressed their
    attack. Sergeant. 1st Class. Zabitosky repeatedly exposed himself to their fire
    to adjust suppressive helicopter gunship fire around the landing zone. After boarding
    1 of the rescue helicopters, he positioned himself in the door delivering fire
    on the enemy as the ship took off. The helicopter was engulfed in a hail of bullets
    and Sergeant. 1st Class. Zabitosky was thrown from the craft as it spun out of
    control and crashed. Recovering consciousness, he ignored his extremely painful
    injuries and moved to the flaming wreckage. Heedless of the danger of exploding
    ordnance and fuel, he pulled the severely wounded pilot from the searing blaze
    and made repeated attempts to rescue his patrol members but was driven back by
    the intense heat. Despite his serious burns and crushed ribs, he carried and dragged
    the unconscious pilot through a curtain of enemy fire to within 10 feet of a hovering
    rescue helicopter before collapsing. Sergeant. 1st Class. Zabitosky's extraordinary
    heroism and devotion to duty were in keeping with the highest traditions of the
    military service and reflect great credit upon himself, his unit, and the U.S.
    Army. Back to Campaign Index   Top of page
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 2
  day: 21
  year: 1968
  title: Staff Sergeant Clifford Chester Sims earns Medal of Honor (posthumous)
  body: "<p>On February 21, 1968, Staff Sergeant Clifford Chester Sims was a squad
    leader with Company D as it assaulted a heavily fortified enemy position in a
    dense wooded area under strong defensive fire. Inside the woodline, Sims led his
    squad against an enemy force that had pinned down the 1st Platoon and threatened
    to overrun it, giving the platoon freedom of movement and letting it regain the
    initiative. He was then ordered to cover the company command group and link up
    with the 3d Platoon. After moving about 30 meters he saw that a brick structure
    holding ammunition was on fire and moved his squad away; 2 of his men were injured
    when it exploded, but the citation states his action prevented more serious casualties.</p><p>Continuing
    through the woods under heavy fire, Sims and his squad were approaching a bunker
    when they heard a concealed booby trap being triggered directly in front of them.
    He warned his comrades and threw himself on the device as it exploded, taking
    the full blast and losing his life.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Clifford Chester Sims (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. S/Sergeant. Sims distinguished himself
    while serving as a squad leader with Company D. Company D was assaulting a heavily
    fortified enemy position concealed within a dense wooded area when it encountered
    strong enemy defensive fire. Once within the woodline, S/Sergeant. Sims led his
    squad in a furious attack against an enemy force which had pinned down the 1st
    Platoon and threatened to overrun it. His skillful leadership provided the platoon
    with freedom of movement and enabled it to regain the initiative. S/Sergeant.
    Sims was then ordered to move his squad to a position where he could provide covering
    fire for the company command group and to link up with the 3d Platoon, which was
    under heavy enemy pressure. After moving no more than 30 meters S/Sergeant. Sims
    noticed that a brick structure in which ammunition was stocked was on fire. Realizing
    the danger, S/Sergeant. Sims took immediate action to move his squad from this
    position. Though in the process of leaving the area 2 members of his squad were
    injured by the subsequent explosion of the ammunition, S/Sergeant. Sims' prompt
    actions undoubtedly prevented more serious casualties from occurring. While continuing
    through the dense woods amidst heavy enemy fire, S/Sergeant. Sims and his squad
    were approaching a bunker when they heard the unmistakable noise of a concealed
    booby trap being triggered immediately to their front. S/Sergeant. Sims warned
    his comrades of the danger and unhesitatingly hurled himself upon the device as
    it exploded, taking the full impact of the blast. In so protecting his fellow
    soldiers, he willingly sacrificed his life. S/Sergeant. Sims' extraordinary heroism
    at the cost of his life is in keeping with the highest traditions of the military
    service and reflects great credit upon himself and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 2
  day: 21
  year: 1968
  title: Staff Sergeant Joe R. Hooper earns Medal of Honor
  body: "<p>On February 21, 1968, Staff Sergeant Joe R. Hooper (then Sergeant) was
    a squad leader with Company D as it assaulted a heavily defended enemy position
    along a river bank under heavy fire. Hooper rallied several men, stormed across
    the river, and overran several bunkers on the far shore; the rest of the company
    followed. He went back into the fire to pull wounded men to safety, was seriously
    wounded, refused aid, and returned to his men. He stormed 3 bunkers alone, shot
    2 enemy soldiers who had wounded the Chaplain, destroyed 3 buildings holding enemy
    riflemen, killed a North Vietnamese officer with his bayonet, and cleared a house.</p><p>When
    his squad met fire from 4 bunkers on its left flank, Hooper ran down a trench
    along the bunker line throwing grenades into each. He crossed an open field to
    rescue a wounded man from a trench, killing an armed enemy soldier with a pistol,
    and fatally wounded 3 North Vietnamese officers to end the resistance. He reorganized
    his men before accepting treatment.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Joe R. Hooper (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Staff Sergeant (then Sergeant.) Hooper,
    U.S. Army, distinguished himself while serving as squad leader with Company D.
    Company D was assaulting a heavily defended enemy position along a river bank
    when it encountered a withering hail of fire from rockets, machine guns and automatic
    weapons. S/Sergeant. Hooper rallied several men and stormed across the river,
    overrunning several bunkers on the opposite shore. Thus inspired, the rest of
    the company moved to the attack. With utter disregard for his own safety, he moved
    out under the intense fire again and pulled back the wounded, moving them to safety.
    During this act S/Sergeant. Hooper was seriously wounded, but he refused medical
    aid and returned to his men. With the relentless enemy fire disrupting the attack,
    he single-handedly stormed 3 enemy bunkers, destroying them with hand grenade
    and rifle fire, and shot 2 enemy soldiers who had attacked and wounded the Chaplain.
    Leading his men forward in a sweep of the area, S/Sergeant. Hooper destroyed 3
    buildings housing enemy riflemen. At this point he was attacked by a North Vietnamese
    officer whom he fatally wounded with his bayonet. Finding his men under heavy
    fire from a house to the front, he proceeded alone to the building, killing its
    occupants with rifle fire and grenades. By now his initial body wound had been
    compounded by grenade fragments, yet despite the multiple wounds and loss of blood,
    he continued to lead his men against the intense enemy fire. As his squad reached
    the final line of enemy resistance, it received devastating fire from 4 bunkers
    in line on its left flank. S/Sergeant. Hooper gathered several hand grenades and
    raced down a small trench which ran the length of the bunker line, tossing grenades
    into each bunker as he passed by, killing all but 2 of the occupants. With these
    positions destroyed, he concentrated on the last bunkers facing his men, destroying
    the first with an incendiary grenade and neutralizing 2 more by rifle fire. He
    then raced across an open field, still under enemy fire, to rescue a wounded man
    who was trapped in a trench. Upon reaching the man, he was faced by an armed enemy
    soldier whom he killed with a pistol. Moving his comrade to safety and returning
    to his men, he neutralized the final pocket of enemy resistance by fatally wounding
    3 North Vietnamese officers with rifle fire. S/Sergeant. Hooper then established
    a final line and reorganized his men, not accepting treatment until this was accomplished
    and not consenting to evacuation until the following morning. His supreme valor,
    inspiring leadership and heroic self-sacrifice were directly responsible for the
    company's success and provided a lasting example in personal courage for every
    man on the field. S/Sergeant. Hooper's actions were in keeping with the highest
    traditions of the military service and reflect great credit upon himself and the
    U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 3
  day: 2
  year: 1968
  title: Specialist Fourth Class Nicholas J. Cutinha earns Medal of Honor (posthumous)
  body: "<p>On March 2, 1968, Specialist Fourth Class Nicholas J. Cutinha, a machine
    gunner with Company C, was on a combat mission near Gia Dinh when his company
    came under small arms, automatic weapons, mortar and rocket propelled grenade
    fire from a battalion size enemy unit. Communication with the battalion was lost,
    and the company commander and many others became casualties. Seeing the company
    pinned down and disorganized, Cutinha moved to the front firing his machine gun
    at the charging enemy, drawing fire and taking a serious leg wound.</p><p>With
    half the company killed or wounded, Cutinha took command of the survivors in his
    area and began a withdrawal, covering the evacuation of the wounded. He killed
    several enemy soldiers and was wounded again in the leg when his machine gun was
    destroyed. He crawled through fire to a working machine gun and kept defending
    the wounded as they were treated, refusing help, until he fell mortally wounded.
    The citation credits him with killing 15 enemy soldiers and saving the lives of
    at least 9 men of his unit.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Nicholas J. Cutinha (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. While serving as a machine gunner
    with Company C, Sp4c. Cutinha accompanied his unit on a combat mission near Gia
    Dinh. Suddenly his company came under small arms, automatic weapons, mortar and
    rocket propelled grenade fire, from a battalion size enemy unit. During the initial
    hostile attack, communication with the battalion was lost and the company commander
    and numerous members of the company became casualties. When Sp4c. Cutinha observed
    that his company was pinned down and disorganized, he moved to the front with
    complete disregard for his safety, firing his machine gun at the charging enemy.
    As he moved forward he drew fire on his own position and was seriously wounded
    in the leg. As the hostile fire intensified and half of the company was killed
    or wounded, Sp4c. Cutinha assumed command of all the survivors in his area and
    initiated a withdrawal while providing covering fire for the evacuation of the
    wounded. He killed several enemy soldiers but sustained another leg wound when
    his machine gun was destroyed by incoming rounds. Undaunted, he crawled through
    a hail of enemy fire to an operable machine gun in order to continue the defense
    of his injured comrades who were being administered medical treatment. Sp4c. Cutinha
    maintained this position, refused assistance, and provided defensive fire for
    his comrades until he fell mortally wounded. He was solely responsible for killing
    15 enemy soldiers while saving the lives of at least 9 members of his own unit.
    Sp4c. Cutinha's gallantry and extraordinary heroism were in keeping with the highest
    traditions of the military service and reflect great credit upon himself, his
    unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 3
  day: 5
  year: 1968
  title: Private First Class Ralph H. Johnson earns Medal of Honor (posthumous)
  body: "<p>On March 5, 1968, Private First Class Ralph H. Johnson, a reconnaissance
    scout with Company A, was one of a 15-man reconnaissance patrol manning an observation
    post on Hill 146 overlooking the Quan Duc Valley, deep in enemy controlled territory,
    during Operation ROCK. In the early morning hours a platoon-size North Vietnamese
    Army and Viet Cong force attacked the post with automatic weapons, satchel charges
    and hand grenades.</p><p>A hand grenade landed in the 3-man fighting hole Johnson
    shared with 2 other marines. He shouted a warning and threw himself on the grenade,
    absorbing the blast; he was killed instantly. The citation states that his act
    saved the life of 1 marine and prevented the enemy from penetrating his sector
    of the patrol's perimeter.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Ralph H. Johnson (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a reconnaissance scout with Company
    A, in action against the North Vietnamese Army and Viet Cong forces. In the early
    morning hours during Operation ROCK, Private First Class Johnson was a member
    of a 15-man reconnaissance patrol manning an observation post on Hill 146 overlooking
    the Quan Duc Valley deep in enemy controlled territory. They were attacked by
    a platoon-size hostile force employing automatic weapons, satchel charges and
    hand grenades. Suddenly, a hand grenade landed in the 3-man fighting hole occupied
    by Private First Class Johnson and 2 fellow marines. Realizing the inherent danger
    to his 2 comrades, he shouted a warning and unhesitatingly hurled himself upon
    the explosive device. When the grenade exploded, Private First Class Johnson absorbed
    the tremendous impact of the blast and was killed instantly. His prompt and heroic
    act saved the life of 1 marine at the cost of his life and undoubtedly prevented
    the enemy from penetrating his sector of the patrol's perimeter. Private First
    Class Johnson's courage, inspiring valor and selfless devotion to duty were in
    keeping with the highest traditions of the Marine Corps and the U.S. Naval Service.
    He gallantly gave his life for his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 3
  day: 9
  year: 1968
  title: Captain Jack H. Jacobs earns Medal of Honor
  body: "<p>On March 9, 1968, Captain Jack H. Jacobs (then 1st Lt.) was assistant
    battalion advisor to the 2d Battalion, 16th Infantry, 9th Infantry Division, Army
    of the Republic of Vietnam, which was advancing to contact when it came under
    heavy machine gun and mortar fire from a Viet Cong battalion in fortified bunkers.
    Jacobs, with the command element of the lead company, called in and directed air
    strikes. Heavy casualties in the command group, including the company commander,
    stopped the attack and left the troops disorganized. Wounded by mortar fragments,
    Jacobs took command of the company, ordered a withdrawal, and set up a defensive
    perimeter.</p><p>Bleeding from head wounds that impaired his vision, he went back
    under fire to evacuate a seriously wounded advisor and gave first aid, then returned
    for the wounded company commander. He made repeated trips across the open rice
    paddies for wounded men and their weapons, and on 3 occasions drove off Viet Cong
    squads searching for allied wounded, killing 3. The citation credits him with
    saving 1 U.S. advisor and 13 allied soldiers.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Jack H. Jacobs (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Capt. Jacobs (then 1st Lt.), Infantry,
    distinguished himself while serving as assistant battalion advisor, 2d Battalion,
    16th Infantry, 9th Infantry Division, Army of the Republic of Vietnam. The 2d
    Battalion was advancing to contact when it came under intense heavy machine gun
    and mortar fire from a Viet Cong battalion positioned in well fortified bunkers.
    As the 2d Battalion deployed into attack formation its advance was halted by devastating
    fire. Capt. Jacobs, with the command element of the lead company, called for and
    directed air strikes on the enemy positions to facilitate a renewed attack. Due
    to the intensity of the enemy fire and heavy casualties to the command group,
    including the company commander, the attack stopped and the friendly troops became
    disorganized. Although wounded by mortar fragments, Capt. Jacobs assumed command
    of the allied company, ordered a withdrawal from the exposed position and established
    a defensive perimeter. Despite profuse bleeding from head wounds which impaired
    his vision, Capt. Jacobs, with complete disregard for his safety, returned under
    intense fire to evacuate a seriously wounded advisor to the safety of a wooded
    area where he administered lifesaving first aid. He then returned through heavy
    automatic weapons fire to evacuate the wounded company commander. Capt. Jacobs
    made repeated trips across the fire-swept open rice paddies evacuating wounded
    and their weapons. On 3 separate occasions, Capt. Jacobs contacted and drove off
    Viet Cong squads who were searching for allied wounded and weapons, single-handedly
    killing 3 and wounding several others. His gallant actions and extraordinary heroism
    saved the lives of 1 U.S. advisor and 13 allied soldiers. Through his effort the
    allied company was restored to an effective fighting unit and prevented defeat
    of the friendly forces by a strong and determined enemy. Capt. Jacobs, by his
    gallantry and bravery in action in the highest traditions of the military service,
    has reflected great credit upon himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 3
  day: 11
  year: 1968
  title: Chief Master Sergeant Richard L. Etchberger earns Medal of Honor (posthumous)
  body: "<p>On March 11, 1968, Chief Master Sergeant Richard L. Etchberger, Ground
    Radar Superintendent of Detachment 1, 1043d Radar Evaluation Squadron, was with
    his team of technicians at a top secret defensive position at Lima Site 85 in
    Laos when an enemy ground force overran the base. Sustained heavy artillery fire
    on the unit's position left his entire crew dead or severely wounded. Although
    he had little or no combat training, Etchberger held off the enemy alone with
    an M-16 while directing air strikes into the area and calling for air rescue,
    denying the enemy his position.</p><p>When the rescue aircraft arrived, he repeatedly
    exposed himself to enemy fire to place three surviving wounded comrades into rescue
    slings hanging from the hovering helicopter. With his crew aboard, Etchberger
    climbed into a sling himself and was fatally wounded by enemy ground fire as he
    was raised into the aircraft.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Richard L. Etchberger (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Chief Master Sergeant Richard L. Etchberger
    distinguished himself by extraordinary heroism on March 11, 1968, in the country
    of Laos, while assigned as Ground Radar Superintendent, Detachment 1, 1043d Radar
    Evaluation Squadron. On that date, Chief Etchberger and his team of technicians
    were manning a top secret defensive position at Lima Site 85 when the base was
    overrun by an enemy ground force. Receiving sustained and withering heavy artillery
    attacks directly upon his unit's position, Chief Etchberger's entire crew lay
    dead or severely wounded. Despite having received little or no combat training,
    Chief Etchberger single-handedly held off the enemy with an M-16, while simultaneously
    directing air strikes into the area and calling for air rescue. Because of his
    fierce defense and heroic and selfless actions, he was able to deny the enemy
    access to his position and save the lives of his remaining crew. With the arrival
    of the rescue aircraft, Chief Etchberger, without hesitation, repeatedly and deliberately
    risked his own life, exposing himself to heavy enemy fire in order to place three
    surviving wounded comrades into rescue slings hanging from the hovering helicopter
    waiting to airlift them to safety. With his remaining crew safely aboard, Chief
    Etchberger finally climbed into an evacuation sling himself, only to be fatally
    wounded by enemy ground fire as he was being raised into the aircraft. Chief Etchberger's
    bravery and determination in the face of persistent enemy fire and overwhelming
    odds are in keeping with the highest standards of performance and traditions of
    military service. Chief Etchberger's gallantry, self-sacrifice, and profound concern
    for his fellow men at risk of his life, above and beyond the call of duty, reflect
    the highest credit upon himself and the United States Air Force.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 3
  day: 17
  year: 1968
  title: Specialist Fourth Class Edward A. DeVore, Jr. earns Medal of Honor (posthumous)
  body: "<p>On March 17, 1968, Specialist Fourth Class Edward A. DeVore, Jr., a machine
    gunner with Company B, was on a reconnaissance-in-force mission about 5 kilometers
    south of Saigon when his platoon, the company's lead element, came under intense
    fire from automatic weapons, Claymore mines, rockets and grenades from concealed
    bunkers in a nipa palm swamp. One man was killed and 3 wounded about 20 meters
    from the bunkers. DeVore ran through the fire to set up a base of fire with his
    machine gun, letting the point element move the wounded back to friendly lines.</p><p>After
    artillery, gunships and air strikes hit the enemy positions, a squad sent forward
    to retrieve the fallen was pinned down in the kill zone by frontal and enfilading
    fire. DeVore assaulted the enemy positions. Hit in the shoulder and knocked down
    about 35 meters short of his objective, he got up and continued, and though mortally
    wounded kept placing accurate suppressive fire on the entrenched enemy. By drawing
    fire on himself, he enabled the trapped squad to rejoin the platoon.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Edward A. DeVore, Jr. (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sp4c. DeVore, distinguished himself
    by exceptionally valorous actions on the afternoon of 17 March 1968, while serving
    as a machine gunner with Company B, on a reconnaissance-in-force mission approximately
    5 kilometers south of Saigon. Sp4c. DeVore's platoon, the company's lead element,
    abruptly came under intense fire from automatic weapons, Claymore mines, rockets
    and grenades from well-concealed bunkers in a nipa palm swamp. One man was killed
    and 3 wounded about 20 meters from the bunker complex. Sp4c. DeVore raced through
    a hail of fire to provide a base of fire with his machine gun, enabling the point
    element to move the wounded back to friendly lines. After supporting artillery,
    gunships and air strikes had been employed on the enemy positions, a squad was
    sent forward to retrieve their fallen comrades. Intense enemy frontal and enfilading
    automatic weapons fire pinned down this element in the kill zone. With complete
    disregard for his personal safety, Sp4c. DeVore assaulted the enemy positions.
    Hit in the shoulder and knocked down about 35 meters short of his objectives,
    Sp4c. DeVore, ignoring his pain and the warnings of his fellow soldiers, jumped
    to his feet and continued his assault under intense hostile fire. Although mortally
    wounded during this advance, he continued to place highly accurate suppressive
    fire upon the entrenched insurgents. By drawing the enemy fire upon himself, Sp4c.
    DeVore enabled the trapped squad to rejoin the platoon in safety. Sp4c. DeVore's
    extraordinary heroism and devotion to duty in close combat were in keeping with
    the highest traditions of the military service and reflect great credit upon himself,
    the 39th Infantry, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 3
  day: 19
  year: 1968
  title: Captain Paul William Bucha earns Medal of Honor
  body: "<p>On March 19, 1968, at daybreak, Captain Paul William Bucha, commanding
    officer of Company D, led a rescue party to recover the dead and wounded of an
    element ambushed the day before, closing a night of fighting near Phuoc Vinh.
    The company had been inserted by helicopter into a suspected enemy stronghold
    on a reconnaissance-in-force mission. On 18 March its lead elements met heavy
    fire from an estimated battalion-size force. Bucha ordered reinforcements forward
    and crawled through the fire to destroy a concealed machine gun bunker with grenades,
    taking a shrapnel wound.</p><p>Judging that his unit could not hold against the
    human wave assaults, he ordered a withdrawal to a company perimeter and covered
    it. When 1 element retrieving casualties was cut off, he ordered them to feign
    death and directed artillery around them. Through the night he distributed ammunition,
    directed artillery and gunship fire, and used flashlights in view of enemy snipers
    to bring in 3 air-ambulance loads of wounded and resupply. The citation states
    the enemy left 156 dead on the battlefield.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Paul William Bucha (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Capt. Bucha distinguished himself
    while serving as commanding officer, Company D, on a reconnaissance-in-force mission
    against enemy forces near Phuoc Vinh, The company was inserted by helicopter into
    the suspected enemy stronghold to locate and destroy the enemy. During this period
    Capt. Bucha aggressively and courageously led his men in the destruction of enemy
    fortifications and base areas and eliminated scattered resistance impeding the
    advance of the company. On 18 March while advancing to contact, the lead elements
    of the company became engaged by the heavy automatic weapon, heavy machine gun,
    rocket propelled grenade, Claymore mine and small-arms fire of an estimated battalion-size
    force. Capt. Bucha, with complete disregard for his safety, moved to the threatened
    area to direct the defense and ordered reinforcements to the aid of the lead element.
    Seeing that his men were pinned down by heavy machine gun fire from a concealed
    bunker located some 40 meters to the front of the positions, Capt. Bucha crawled
    through the hail of fire to single-handedly destroy the bunker with grenades.
    During this heroic action Capt. Bucha received a painful shrapnel wound. Returning
    to the perimeter, he observed that his unit could not hold its positions and repel
    the human wave assaults launched by the determined enemy. Capt. Bucha ordered
    the withdrawal of the unit elements and covered the withdrawal to positions of
    a company perimeter from which he could direct fire upon the charging enemy. When
    1 friendly element retrieving casualties was ambushed and cut off from the perimeter,
    Capt. Bucha ordered them to feign death and he directed artillery fire around
    them. During the night Capt. Bucha moved throughout the position, distributing
    ammunition, providing encouragement and insuring the integrity of the defense.
    He directed artillery, helicopter gunship and Air Force gunship fire on the enemy
    strong points and attacking forces, marking the positions with smoke grenades.
    Using flashlights in complete view of enemy snipers, he directed the medical evacuation
    of 3 air-ambulance loads of seriously wounded personnel and the helicopter supply
    of his company. At daybreak Capt. Bucha led a rescue party to recover the dead
    and wounded members of the ambushed element. During the period of intensive combat,
    Capt. Bucha, by his extraordinary heroism, inspirational example, outstanding
    leadership and professional competence, led his company in the decimation of a
    superior enemy force which left 156 dead on the battlefield. His bravery and gallantry
    at the risk of his life are in the highest traditions of the military service,
    Capt. Bucha has reflected great credit on himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 4
  day: 25
  year: 1968
  title: Captain (then 1st Lt.) James M. Sprayberry earns Medal of Honor
  body: "<p>On April 25, 1968, Captain James M. Sprayberry, executive officer of Company
    D, learned that his company commander and many of the men were wounded and cut
    off from the main body, and that a daylight rescue attempt had been driven back
    by entrenched enemy. He organized and led a volunteer night patrol to clear the
    enemy bunkers in between and relieve the surrounded element. When the patrol came
    under machinegun fire, he moved his men to cover, crawled close to the bunker,
    and silenced the gun with a hand grenade. He attacked several nearby 1-man positions
    with grenades, charged a bunker whose occupants had thrown 2 grenades at his men,
    and neutralized 3 more bunkers. He shot an enemy soldier who charged him from
    concealment.</p><p>Sprayberry then reached the isolated men by radio, guided them
    to his position, and organized litter parties to carry out the wounded, silencing
    one more machinegun as the evacuation finished. The operation lasted about 71/2
    hours. The citation credits him with killing 12 enemy soldiers, eliminating 2
    machineguns, and destroying numerous bunkers.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, James M. Sprayberry (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Capt. Sprayberry, Armor, U.S. Army,
    distinguished himself by exceptional bravery while serving as executive officer
    of Company D. His company commander and a great number of the men were wounded
    and separated from the main body of the company. A daylight attempt to rescue
    them was driven back by the well entrenched enemy's heavy fire. Capt. Sprayberry
    then organized and led a volunteer night patrol to eliminate the intervening enemy
    bunkers and to relieve the surrounded element. The patrol soon began receiving
    enemy machinegun fire. Capt. Sprayberry quickly moved the men to protective cover
    and without regard for his own safety, crawled within close range of the bunker
    from which the fire was coming. He silenced the machinegun with a hand grenade.
    Identifying several l-man enemy positions nearby, Capt. Sprayberry immediately
    attacked them with the rest of his grenades. He crawled back for more grenades
    and when 2 grenades were thrown at his men from a position to the front, Capt.
    Sprayberry, without hesitation, again exposed himself and charged the enemy-held
    bunker killing its occupants with a grenade. Placing 2 men to cover his advance,
    he crawled forward and neutralized 3 more bunkers with grenades. Immediately thereafter,
    Capt. Sprayberry was surprised by an enemy soldier who charged from a concealed
    position. He killed the soldier with his pistol and with continuing disregard
    for the danger neutralized another enemy emplacement. Capt. Sprayberry then established
    radio contact with the isolated men, directing them toward his position. When
    the 2 elements made contact he organized his men into litter parties to evacuate
    the wounded. As the evacuation was nearing completion, he observed an enemy machinegun
    position which he silenced with a grenade. Capt. Sprayberry returned to the rescue
    party, established security, and moved to friendly lines with the wounded. This
    rescue operation, which lasted approximately 71/2 hours, saved the lives of many
    of his fellow soldiers. Capt. Sprayberry personally killed 12 enemy soldiers,
    eliminated 2 machineguns, and destroyed numerous enemy bunkers. Capt. Sprayberry's
    indomitable spirit and gallant action at great personal risk to his life are in
    keeping with the highest traditions of the military service and reflect great
    credit upon himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 4
  day: 26
  year: 1968
  title: Private First Class Milton A. Lee earns Medal of Honor (posthumous)
  body: "<p>On April 26, 1968, Private First Class Milton A. Lee was the radio telephone
    operator with the 3d platoon, Company B, near the city of Phu Bai in the province
    of Thua Thien. As the company's lead element, the platoon took surprise fire from
    North Vietnamese Army regulars in concealed bunkers and suffered 50 percent casualties.
    While the platoon moved to cover, Lee moved through the fire giving first aid.
    In the assault that followed he kept radio contact with the company commander
    and relayed orders to his platoon leader.</p><p>Advancing with the front rank,
    Lee saw 4 North Vietnamese soldiers with automatic weapons and a rocket launcher
    waiting for the lead element. He handed his radio to another soldier and charged,
    overrunning the position, killing its occupants, and capturing the weapons. He
    continued alone against a second position through heavy automatic weapons fire.
    Grievously wounded, he crawled into a firing position and delivered covering fire
    that let his platoon destroy the position, then succumbed to his wounds. The citation
    states his actions saved the lives of the lead element.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Milton A. Lee (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Private First Class Lee distinguished
    himself near the city of Phu Bai in the province of Thua Thien. Private First
    Class Lee was serving as the radio telephone operator with the 3d platoon, Company
    B. As lead element for the company, the 3d platoon received intense surprise hostile
    fire from a force of North Vietnamese Army regulars in well-concealed bunkers.
    With 50 percent casualties, the platoon maneuvered to a position of cover to treat
    their wounded and reorganize, while Private First Class Lee moved through the
    heavy enemy fire giving lifesaving first aid to his wounded comrades. During the
    subsequent assault on the enemy defensive positions, Private First Class Lee continuously
    kept close radio contact with the company commander, relaying precise and understandable
    orders to his platoon leader. While advancing with the front rank toward the objective,
    Private First Class Lee observed 4 North Vietnamese soldiers with automatic weapons
    and a rocket launcher Lying in wait for the lead element of the platoon. As the
    element moved forward, unaware of the concealed danger, Private First Class Lee
    immediately and with utter disregard for his own personal safety, passed his radio
    to another soldier and charged through the murderous fire. Without hesitation
    he continued his assault, overrunning the enemy position, killing all occupants
    and capturing 4 automatic weapons and a rocket launcher. Private First Class Lee
    continued his 1-man assault on the second position through a heavy barrage of
    enemy automatic weapons fire. Grievously wounded, he continued to press the attack,
    crawling forward into a firing position and delivering accurate covering fire
    to enable his platoon to maneuver and destroy the position. Not until the position
    was overrun did Private First Class Lee falter in his steady volume of fire and
    succumb to his wounds. Private First Class Lee's heroic actions saved the lives
    of the lead element and were instrumental in the destruction of the key position
    of the enemy defense. Private First Class Lee's gallantry at the risk of life
    above and beyond the call of duty are in keeping with the highest traditions of
    the military service and reflect great credit on himself, the 502d Infantry, and
    the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 5
  day: 2
  year: 1968
  title: Captain James E. Livingston earns Medal of Honor
  body: "<p>On May 2, 1968, Company E, commanded by Capt. James E. Livingston, assaulted
    the fortified village of Dai Do, which the enemy had seized the evening before,
    cutting off a marine company from the rest of the battalion. Capt. Livingston
    moved his men across 500 meters of open rice paddy under intense fire and led
    the attack on the enemy emplacements in the village, adjusting supporting arms
    fire and moving to the points of heaviest resistance. Wounded twice by grenade
    fragments, he refused treatment while his company destroyed more than 100 mutually
    supporting bunkers and relieved the stranded company.</p><p>As the two companies
    consolidated and evacuated casualties, a third company attacked the adjacent village
    of Dinh To and was stopped by an enemy battalion's counterattack. Capt. Livingston
    brought his remaining effective men forward, joined the engaged marines, and halted
    the counterattack. Wounded a third time and unable to walk, he stayed in the exposed
    area, moved his men to better positions, and supervised casualty evacuation until
    assured of their safety, then allowed himself to be evacuated.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, James E. Livingston (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as Commanding Officer, Company E, in
    action against enemy forces. Company E launched a determined assault on the heavily
    fortified village of Dai Do, which had been seized by the enemy on the preceding
    evening isolating a marine company from the remainder of the battalion. Skillfully
    employing screening agents, Capt. Livingston maneuvered his men to assault positions
    across 500 meters of dangerous open rice paddy while under intense enemy fire.
    Ignoring hostile rounds impacting near him, he fearlessly led his men in a savage
    assault against enemy emplacements within the village. While adjusting supporting
    arms fire, Capt. Livingston moved to the points of heaviest resistance, shouting
    words of encouragement to his marines, directing their fire, and spurring the
    dwindling momentum of the attack on repeated occasions. Although twice painfully
    wounded by grenade fragments, he refused medical treatment and courageously led
    his men in the destruction of over 100 mutually supporting bunkers, driving the
    remaining enemy from their positions, and relieving the pressure on the stranded
    marine company. As the 2 companies consolidated positions and evacuated casualties,
    a third company passed through the friendly lines launching an assault on the
    adjacent village of Dinh To, only to be halted by a furious counterattack of an
    enemy battalion. Swiftly assessing the situation and disregarding the heavy volume
    of enemy fire, Capt. Livingston boldly maneuvered the remaining effective men
    of his company forward, joined forces with the heavily engaged marines, and halted
    the enemy's counterattack Wounded a third time and unable to walk, he steadfastly
    remained in the dangerously exposed area, deploying his men to more tenable positions
    and supervising the evacuation of casualties. Only when assured of the safety
    of his men did he allow himself to be evacuated. Capt. Livingston's gallant actions
    uphold the highest traditions of the Marine Corps and the U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:41Z'
- month: 5
  day: 2
  year: 1968
  title: Major (then Capt.) M. Sando Vargas, Jr. earns Medal of Honor
  body: "<p>On May 2, 1968, Major M. Sando Vargas, Jr., commanding officer of Company
    G, was wounded for the third time in a 3-day battle at Dai Do that the citation
    covers from 30 April to 2 May 1968. Wounded on 30 April while relocating his unit
    under fire, on 1 May he combined Company G with two other companies and attacked
    the fortified village, moving his marines across 700 meters of open rice paddy
    under heavy fire to a foothold in 2 hedgerows. When part of his company was pinned
    down, he brought up his reserve platoon and renewed the advance. Wounded again
    by grenade fragments, he refused aid and organized a perimeter at the edge of
    the village, which held through a night of counterattacks.</p><p>Reinforced the
    next morning, the marines attacked toward Dinh To and met a massive counterattack
    with hand-to-hand combat. Vargas stayed in the open with his men and was hit a
    third time. Seeing his battalion commander seriously wounded, he carried him to
    cover, then resumed directing his men and helping organize the battalion's defense.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, M. Sando Vargas, Jr. (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as commanding officer, Company G, in
    action against enemy forces from 30 April to 2 May 1968. On 1 May 1968, though
    suffering from wounds he had incurred while relocating his unit under heavy enemy
    fire the preceding day, Maj. Vargas combined Company G with two other companies
    and led his men in an attack on the fortified village of Dai Do. Exercising expert
    leadership, he maneuvered his marines across 700 meters of open rice paddy while
    under intense enemy mortar, rocket and artillery fire and obtained a foothold
    in 2 hedgerows on the enemy perimeter, only to have elements of his company become
    pinned down by the intense enemy fire. Leading his reserve platoon to the aid
    of his beleaguered men, Maj. Vargas inspired his men to renew their relentless
    advance, while destroying a number of enemy bunkers. Again wounded by grenade
    fragments, he refused aid as he moved about the hazardous area reorganizing his
    unit into a strong defense perimeter at the edge of the village. Shortly after
    the objective was secured the enemy commenced a series of counterattacks and probes
    which lasted throughout the night but were unsuccessful as the gallant defenders
    of Company G stood firm in their hard-won enclave. Reinforced the following morning,
    the marines launched a renewed assault through Dai Do on the village of Dinh To,
    to which the enemy retaliated with a massive counterattack resulting in hand-to-hand
    combat. Maj. Vargas remained in the open, encouraging and rendering assistance
    to his marines when he was hit for the third time in the 3-day battle. Observing
    his battalion commander sustain a serious wound, he disregarded his excruciating
    pain, crossed the fire-swept area and carried his commander to a covered position,
    then resumed supervising and encouraging his men while simultaneously assisting
    in organizing the battalion's perimeter defense. His gallant actions uphold the
    highest traditions of the Marine Corps and the U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
