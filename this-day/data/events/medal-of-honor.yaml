- month: 7
  day: 6
  year: 1964
  title: Captain Roger Hugh C. Donlon earns Medal of Honor
  body: "<p>On July 6, 1964, Capt. Roger Hugh C. Donlon was commanding U.S. Army Special
    Forces Detachment A-726 at Camp Nam Dong when a reinforced Viet Cong battalion
    launched a full-scale predawn attack. In the 5-hour battle, Donlon ordered ammunition
    pulled from a blazing building, ran to the main gate to stop a breach, and killed
    a 3-man enemy demolition team on the way. He took a severe stomach wound near
    a 60mm mortar pit, directed the wounded crew's withdrawal, covered their movement,
    and dragged his team sergeant out of the pit, taking a second wound in the left
    shoulder from a mortar round.</p><p>He carried the mortar to a new position, retrieved
    a 57mm recoilless rifle, and was wounded a third time, in the leg, crawling back
    for ammunition. He crawled 175 meters to an 81mm mortar position and directed
    fire that protected the camp's east sector. Moving around the perimeter, he was
    wounded again in the face and body. At daylight the enemy retreated, leaving 54
    dead; Donlon reorganized the defenses and treated the wounded.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Roger Hugh C. Donlon (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while defending a U.S. military installation against
    a fierce attack by hostile forces. Capt. Donlon was serving as the commanding
    officer of the U.S. Army Special Forces Detachment A-726 at Camp Nam Dong when
    a reinforced Viet Cong battalion suddenly launched a full-scale, predawn attack
    on the camp. During the violent battle that ensued, lasting 5 hours and resulting
    in heavy casualties on both sides, Capt. Donlon directed the defense operations
    in the midst of an enemy barrage of mortar shells, falling grenades, and extremely
    heavy gunfire. Upon the initial onslaught, he swiftly marshaled his forces and
    ordered the removal of the needed ammunition from a blazing building. He then
    dashed through a hail of small arms and exploding hand grenades to abort a breach
    of the main gate. En route to this position he detected an enemy demolition team
    of 3 in the proximity of the main gate and quickly annihilated them. Although
    exposed to the intense grenade attack, he then succeeded in reaching a 60mm mortar
    position despite sustaining a severe stomach wound as he was within 5 yards of
    the gun pit. When he discovered that most of the men in this gunpit were also
    wounded, he completely disregarded his own injury, directed their withdrawal to
    a location 30 meters away, and again risked his life by remaining behind and covering
    the movement with the utmost effectiveness. Noticing that his team sergeant was
    unable to evacuate the gun pit he crawled toward him and, while dragging the fallen
    soldier out of the gunpit, an enemy mortar exploded and inflicted a wound in Capt.
    Donlon's left shoulder. Although suffering from multiple wounds, he carried the
    abandoned 60mm mortar weapon to a new location 30 meters away where he found 3
    wounded defenders. After administering first aid and encouragement to these men,
    he left the weapon with them, headed toward another position, and retrieved a
    57mm recoilless rifle. Then with great courage and coolness under fire, he returned
    to the abandoned gun pit, evacuated ammunition for the 2 weapons, and while crawling
    and dragging the urgently needed ammunition, received a third wound on his leg
    by an enemy hand grenade. Despite his critical physical condition, he again crawled
    175 meters to an 81mm mortar position and directed firing operations which protected
    the seriously threatened east sector of the camp. He then moved to an eastern
    60mm mortar position and upon determining that the vicious enemy assault had weakened,
    crawled back to the gun pit with the 60mm mortar, set it up for defensive operations,
    and turned it over to 2 defenders with minor wounds. Without hesitation, he left
    this sheltered position, and moved from position to position around the beleaguered
    perimeter while hurling hand grenades at the enemy and inspiring his men to superhuman
    effort. As he bravely continued to move around the perimeter, a mortar shell exploded,
    wounding him in the face and body. As the long awaited daylight brought defeat
    to the enemy forces and their retreat back to the jungle leaving behind 54 of
    their dead, many weapons, and grenades, Capt. Donlon immediately reorganized his
    defenses and administered first aid to the wounded. His dynamic leadership, fortitude,
    and valiant efforts inspired not only the American personnel but the friendly
    Vietnamese defenders as well and resulted in the successful defense of the camp.
    Capt. Donlon's extraordinary heroism, at the risk of his life above and beyond
    the call of duty are in the highest traditions of the U.S. Army and reflect great
    credit upon himself and the Armed Forces of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 6
  day: 10
  year: 1965
  title: Construction Mechanic Third Class Marvin G. Shields earns Medal of Honor
    (posthumous)
  body: "<p>On June 10, 1965, Construction Mechanic Third Class Marvin G. Shields
    was at the compound of Detachment A342, 5th Special Forces Group (Airborne), 1st
    Special Forces, when it came under intense fire from an estimated reinforced Viet
    Cong regiment using machineguns, heavy weapons and small arms. Although wounded,
    Shields resupplied his fellow Americans with ammunition and returned fire for
    about 3 hours, until the Viet Cong attacked at close range with flame-throwers,
    hand grenades and small arms. Wounded a second time, he helped carry a more critically
    wounded man to safety and then resumed firing for 4 more hours.</p><p>When the
    commander asked for a volunteer to help knock out an enemy machinegun emplacement
    whose fire endangered everyone in the compound, Shields volunteered. The two advanced
    with a 3.5-inch rocket launcher and destroyed the emplacement. Shields was mortally
    wounded by hostile fire while returning to his defensive position.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Marvin G. Shields (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. Although wounded when the compound of Detachment
    A342, 5th Special Forces Group (Airborne), 1st Special Forces, came under intense
    fire from an estimated reinforced Viet Cong regiment employing machineguns, heavy
    weapons and small arms, Shields continued to resupply his fellow Americans who
    needed ammunition and to return the enemy fire for a period of approximately 3
    hours, at which time the Viet Cong launched a massive attack at close range with
    flame-throwers, hand grenades and small-arms fire. Wounded a second time during
    this attack, Shields nevertheless assisted in carrying a more critically wounded
    man to safety, and then resumed firing at the enemy for 4 more hours. When the
    commander asked for a volunteer to accompany him in an attempt to knock out an
    enemy machinegun emplacement which was endangering the lives of all personnel
    in the compound because of the accuracy of its fire, Shields unhesitatingly volunteered
    for this extremely hazardous mission. Proceeding toward their objective with a
    3.5-inch rocket launcher, they succeeded in destroying the enemy machinegun emplacement,
    thus undoubtedly saving the lives of many of their fellow servicemen in the compound.
    Shields was mortally wounded by hostile fire while returning to his defensive
    position. His heroic initiative and great personal valor in the face of intense
    enemy fire sustain and enhance the finest traditions of the U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 6
  day: 10
  year: 1965
  title: First Lieutenant (then 2d Lt.) Charles Q. Williams earns Medal of Honor
  body: "<p>On June 10, 1965, 1st Lt. Charles Q. Williams was executive officer of
    a Special Forces Detachment when an estimated Vietcong reinforced regiment struck
    the camp and the adjacent district headquarters in an attack that lasted 14 hours.
    He organized the personnel on the south and west walls, was wounded in the right
    leg by shrapnel while trying to reach his commanding officer in another compound,
    then rallied retreating Vietnamese defenders. Wounded again in the thigh and left
    leg, and told his commanding officer was seriously wounded, he took charge of
    both compounds and took grenade fragments in the stomach and right arm.</p><p>He
    consolidated the Americans in the district building and used descending flares
    to adjust air strikes. At daylight, with a 3.5 rocket launcher and a volunteer
    loader, he crossed open ground and hit a Vietcong machinegun 150 meters away despite
    a faulty sight. Both men were wounded returning; Williams pulled the loader to
    cover and sent others for him. When helicopters could land, he directed the evacuation
    of all personnel under renewed Vietcong fire.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Charles Q. Williams (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: 1st Lt. Williams distinguished himself by conspicuous gallantry and
    intrepidity at the risk of his life above and beyond the call of duty while defending
    the Special Forces Camp against a violent attack by hostile forces that lasted
    for 14 hours. 1st Lt. Williams was serving as executive officer of a Special Forces
    Detachment when an estimated Vietcong reinforced regiment struck the camp and
    threatened to overrun it and the adjacent district headquarters. He awoke personnel,
    organized them, determined the source of the insurgents' main effort and led the
    troops to their defensive positions on the south and west walls. Then, after running
    to the District Headquarters to establish communications, he found that there
    was no radio operational with which to communicate with his commanding officer
    in another compound. To reach the other compound, he traveled through darkness
    but was halted in this effort by a combination of shrapnel in his right leg and
    the increase of the Vietcong gunfire. Ignoring his wound, he returned to the district
    headquarters and directed the defense against the first assault. As the insurgents
    attempted to scale the walls and as some of the Vietnamese defenders began to
    retreat, he dashed through a barrage of gunfire, succeeded in rallying these defenders,
    and led them back to their positions. Although wounded in the thigh and left leg
    during this gallant action, he returned to his position and, upon being told that
    communications were reestablished and that his commanding officer was seriously
    wounded, 1st Lt. Williams took charge of actions in both compounds. Then, in an
    attempt to reach the communications bunker, he sustained wounds in the stomach
    and right arm from grenade fragments. As the defensive positions on the walls
    had been held for hours and casualties were mounting, he ordered the consolidation
    of the American personnel from both compounds to establish a defense in the district
    building. After radio contact was made with a friendly air controller, he disregarded
    his wounds and directed the defense from the District building, using descending
    flares as reference points to adjust air strikes. By his courage, he inspired
    his team to hold out against the insurgent force that was closing in on them and
    throwing grenades into the windows of the building. As daylight arrived and the
    Vietcong continued to besiege the stronghold, firing a machinegun directly south
    of the district building, he was determined to eliminate this menace that threatened
    the lives of his men. Taking a 3.5 rocket launcher and a volunteer to load it,
    he worked his way across open terrain, reached the berm south of the district
    headquarters, and took aim at the Vietcong machinegun 150 meters away. Although
    the sight was faulty, he succeeded in hitting the machinegun. While he and the
    loader were trying to return to the district headquarters, they were both wounded.
    With a fourth wound, this time in the right arm and leg, and realizing he was
    unable to carry his wounded comrade back to the district building, 1st Lt. Williams
    pulled him to a covered position and then made his way back to the district building
    where he sought the help of others who went out and evacuated the injured soldier.
    Although seriously wounded and tired, he continued to direct the air strikes closer
    to the defensive position. As morning turned to afternoon and the Vietcong pressed
    their effort with direct recoilless rifle fire into the building, he ordered the
    evacuation of the seriously wounded to the safety of the communications bunker.
    When informed that helicopters would attempt to land as the hostile gunfire had
    abated, he led his team from the building to the artillery position, making certain
    of the timely evacuation of the wounded from the communications area, and then
    on to the pickup point. Despite resurgent Vietcong gunfire, he directed the rapid
    evacuation of all personnel. Throughout the long battle, he was undaunted by the
    vicious Vietcong assault and inspired the defenders in decimating the determined
    insurgents. 1st Lt. Williams' extraordinary heroism, are in the highest traditions
    of the U.S. Army and reflect great credit upon himself and the Armed Forces of
    his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 7
  day: 12
  year: 1965
  title: First Lieutenant Frank S. Reasoner earns Medal of Honor (posthumous)
  body: "<p>On July 12, 1965, 1st Lt. Frank S. Reasoner was leading a reconnaissance
    patrol deep in enemy-controlled territory when it came under heavy fire from an
    estimated 50 to 100 Viet Cong insurgents in concealed positions. Reasoner was
    with the 5-man advance party and point, cut off from the main body, and organized
    a base of fire for an assault on the enemy positions. Viet Cong machinegun and
    automatic weapons fire kept the main body from moving forward. Repeatedly exposing
    himself, he provided covering fire, killed at least 2 Viet Cong and silenced an
    automatic weapons position while trying to evacuate a wounded man.</p><p>When
    his radio operator was wounded, Reasoner moved to his side and tended his wounds.
    The operator was hit a second time while trying to reach cover, and Reasoner,
    running to his aid through grazing machinegun fire, was mortally wounded. The
    patrol completed its mission without further casualties.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Frank S. Reasoner (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. The reconnaissance patrol led by 1st Lt. Reasoner
    had deeply penetrated heavily controlled enemy territory when it came under extremely
    heavy fire from an estimated 50 to 100 Viet Cong insurgents. Accompanying the
    advance party and the point that consisted of 5 men, he immediately deployed his
    men for an assault after the Viet Cong had opened fire from numerous concealed
    positions. Boldly shouting encouragement, and virtually isolated from the main
    body, he organized a base of fire for an assault on the enemy positions. The slashing
    fury of the Viet Cong machinegun and automatic weapons fire made it impossible
    for the main body to move forward. Repeatedly exposing himself to the devastating
    attack he skillfully provided covering fire, killing at least 2 Viet Cong and
    effectively silencing an automatic weapons position in a valiant attempt to effect
    evacuation of a wounded man. As casualties began to mount his radio operator was
    wounded and 1st Lt. Reasoner immediately moved to his side and tended his wounds.
    When the radio operator was hit a second time while attempting to reach a covered
    position, 1st Lt. Reasoner courageously running to his aid through the grazing
    machinegun fire fell mortally wounded. His indomitable fighting spirit, valiant
    leadership and unflinching devotion to duty provided the inspiration that was
    to enable the patrol to complete its mission without further casualties. In the
    face of almost certain death he gallantly gave his life in the service of his
    country. His actions upheld the highest traditions of the Marine Corps and the
    U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 8
  day: 18
  year: 1965
  title: Lance Corporal Joe C. Paul earns Medal of Honor (posthumous)
  body: "<p>On August 18, 1965, Lance Corporal Joe C. Paul's platoon was temporarily
    pinned down by mortar, recoilless rifle, automatic weapons, and rifle fire from
    Viet Cong forces in well entrenched positions, and sustained 5 casualties. The
    wounded marines could not move from their exposed positions forward of the rest
    of the platoon, and they came under a barrage of white phosphorous rifle grenades.
    Paul dashed across the fire-swept rice paddies, placed himself between the wounded
    and the enemy, and fired his automatic weapon to divert the attack long enough
    for the casualties to be evacuated.</p><p>Critically wounded during the battle,
    he stayed in his exposed position and kept firing until he collapsed and was evacuated.
    The citation states that he saved the lives of several of his fellow marines and
    that he gave his life.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Joe C. Paul (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. In violent battle, L/Corporal. Paul's platoon sustained
    5 casualties as it was temporarily pinned down, by devastating mortar, recoilless
    rifle, automatic weapons, and rifle fire delivered by insurgent communist (Viet
    Cong) forces in well entrenched positions. The wounded marines were unable to
    move from their perilously exposed positions forward of the remainder of their
    platoon, and were suddenly subjected to a barrage of white phosphorous rifle grenades.
    L/Corporal. Paul, fully aware that his tactics would almost certainly result in
    serious injury or death to himself, chose to disregard his safety and boldly dashed
    across the fire-swept rice paddies, placed himself between his wounded comrades
    and the enemy, and delivered effective suppressive fire with his automatic weapon
    in order to divert the attack long enough to allow the casualties to be evacuated.
    Although critically wounded during the course of the battle, he resolutely remained
    in his exposed position and continued to fire his rifle until he collapsed and
    was evacuated. By his fortitude and gallant spirit of self-sacrifice in the face
    of almost certain death, he saved the lives of several of his fellow marines.
    His heroic action served to inspire all who observed him and reflect the highest
    credit upon himself, the Marine Corps and the U.S. Naval Service. He gallantly
    gave his life in the cause of freedom.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 8
  day: 18
  year: 1965
  title: Sergeant (then Corporal) Robert E. O'Malley earns Medal of Honor
  body: "<p>On August 18, 1965, Sergeant Robert E. O'Malley was leading his squad
    in an assault against a strongly entrenched Viet Cong force when the unit came
    under intense small-arms fire. He raced across an open rice paddy to the enemy
    trench line, jumped in, and killed 8 of the enemy with his rifle and grenades.
    He then led his squad to help an adjacent marine unit taking heavy casualties,
    fired into the enemy emplacement, assisted in evacuating several wounded marines,
    and returned with the remnants of his squad to the heaviest fighting.</p><p>Ordered
    to an evacuation point, he gathered his wounded squad and led them under fire
    to a helicopter. Wounded 3 times, he refused evacuation and covered his squad's
    boarding from an exposed position, firing at the enemy until his wounded men were
    out. Only then did he allow himself to be removed from the battlefield.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Robert E. O'Malley (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action against the communist
    (Viet Cong) forces at the risk of his life above and beyond the call of duty.
    While leading his squad in the assault against a strongly entrenched enemy force,
    his unit came under intense small-arms fire. With complete disregard for his personal
    safety, Sergeant. O'Malley raced across an open rice paddy to a trench line where
    the enemy forces were located. Jumping into the trench, he attacked the Viet Cong
    with his rifle and grenades, and singly killed 8 of the enemy. He then led his
    squad to the assistance of an adjacent marine unit which was suffering heavy casualties.
    Continuing to press forward, he reloaded his weapon and fired with telling effect
    into the enemy emplacement. He personally assisted in the evacuation of several
    wounded marines, and again regrouping the remnants of his squad, he returned to
    the point of the heaviest fighting. Ordered to an evacuation point by an officer,
    Sergeant. O'Malley gathered his besieged and badly wounded squad, and boldly led
    them under fire to a helicopter for withdrawal. Although 3 times wounded in this
    encounter, and facing imminent death from a fanatic and determined enemy, he steadfastly
    refused evacuation and continued to cover his squad's boarding of the helicopters
    while, from an exposed position, he delivered fire against the enemy until his
    wounded men were evacuated. Only then, with his last mission accomplished, did
    he permit himself to be removed from the battlefield. By his valor, leadership,
    and courageous efforts in behalf of his comrades, he served as an inspiration
    to all who observed him, and reflected the highest credit upon the Marine Corps
    and the U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 9
  day: 20
  year: 1965
  title: Sergeant Larry S. Pierce earns Medal of Honor (posthumous)
  body: "<p>On September 20, 1965, Sergeant Larry S. Pierce was a squad leader in
    a reconnaissance platoon when his patrol was ambushed by hostile forces. Under
    his leadership the squad eliminated an enemy machinegun and routed the opposing
    force. While pursuing the fleeing enemy, the squad came to a dirt road, and as
    the main body of his men entered it, Pierce discovered an antipersonnel mine in
    the road bed. Realizing the mine could destroy most of his squad, he threw himself
    onto it as it exploded. He was killed, and the citation states that his act averted
    loss of life and injury to the members of his squad.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Larry S. Pierce (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of life above
    and beyond the call of duty. Sergeant. Pierce was serving as squad leader in a
    reconnaissance platoon when his patrol was ambushed by hostile forces. Through
    his inspiring leadership and personal courage, the squad succeeded in eliminating
    an enemy machinegun and routing the opposing force. While pursuing the fleeing
    enemy, the squad came upon a dirt road and, as the main body of his men entered
    the road, Sergeant. Pierce discovered an antipersonnel mine emplaced in the road
    bed. Realizing that the mine could destroy the majority of his squad, Sergeant.
    Pierce saved the lives of his men at the sacrifice of his life by throwing himself
    directly onto the mine as it exploded. Through his indomitable courage, complete
    disregard for his safety, and profound concern for his fellow soldiers, he averted
    loss of life and injury to the members of his squad. Sergeant. Pierce's extraordinary
    heroism, at the cost of his life, are in the highest traditions of the U.S. Army
    and reflect great credit upon himself and the Armed Forces of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 9
  day: 26
  year: 1965
  title: Captain Humbert R. Versace earns Medal of Honor (posthumous)
  body: "<p>On September 26, 1965, Captain Humbert R. Versace was executed by the
    Viet Cong while a prisoner of war. His citation covers the period from 29 October
    1963 to 26 September 1965, while he served as S-2 Advisor, Military Assistance
    Advisory Group, Detachment 52, Ca Mau, Republic of Vietnam. Accompanying a Civilian
    Irregular Defense Group patrol in Thoi Binh District, An Xuyen Province, he and
    the patrol came under mortar, automatic weapons, and small arms fire from a heavily
    armed enemy battalion. Severely wounded in the knee and back, he kept engaging
    enemy targets and resisted capture until his strength and ammunition were gone.</p><p>As
    a prisoner, he assumed command of his fellow American soldiers, refused the enemy's
    interrogation and indoctrination efforts, and made three unsuccessful escape attempts
    despite his wounds. He was held in an isolated cage, manacled in irons for prolonged
    periods, and placed on reduced rations before his execution.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Humbert R. Versace (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: 'for conspicuous gallantry and intrepidity at the risk of his life
    above and beyond the call of duty: Captain Humbert R. Versace distinguished himself
    by extraordinary heroism during the period of 29 October 1963 to 26 September
    1965, while serving as S-2 Advisor, Military Assistance Advisory Group, Detachment
    52, Ca Mau, Republic of Vietnam. While accompanying a Civilian Irregular Defense
    Group patrol engaged in combat operations in Thoi Binh District, An Xuyen Province,
    Captain Versace and the patrol came under sudden and intense mortar, automatic
    weapons, and small arms fire from elements of a heavily armed enemy battalion.
    As the battle raged, Captain Versace, although severely wounded in the knee and
    back by hostile fire, fought valiantly and continued to engage enemy targets.
    Weakened by his wounds and fatigued by the fierce firefight, Captain Versace stubbornly
    resisted capture by the over-powering Viet Cong force with the last full measure
    of his strength and ammunition. Taken prisoner by the Viet Cong, he exemplified
    the tenets of the Code of Conduct from the time he entered into Prisoner of War
    status. Captain Versace assumed command of his fellow American soldiers, scorned
    the enemy''s exhaustive interrogation and indoctrination efforts, and made three
    unsuccessful attempts to escape, despite his weakened condition which was brought
    about by his wounds and the extreme privation and hardships he was forced to endure.
    During his captivity, Captain Versace was segregated in an isolated prisoner of
    war cage, manacled in irons for prolonged periods of time, and placed on extremely
    reduced ration. The enemy was unable to break his indomitable will, his faith
    in God, and his trust in the United States of America. Captain Versace, an American
    fighting man who epitomized the principles of his country and the Code of Conduct,
    was executed by the Viet Cong on 26 September 1965. Captain Versace''s gallant
    actions in close contact with an enemy force and unyielding courage and bravery
    while a prisoner of war are in the highest traditions of the military service
    and reflect the utmost credit upon himself and the United States Army.'
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 10
  day: 22
  year: 1965
  title: Private First Class Milton L. Olive III earns Medal of Honor (posthumous)
  body: "<p>On October 22, 1965, Private First Class Milton L. Olive III was a member
    of the 3d Platoon of Company B as it moved through the jungle to find the Viet
    Cong operating in the area. The platoon came under a heavy volume of enemy gunfire
    and was pinned down temporarily, then assaulted the Viet Cong positions and caused
    the enemy to flee. As the platoon pursued the insurgents, Olive and 4 other soldiers
    were moving through the jungle together when a grenade was thrown into their midst.
    Olive saw it, grabbed it in his hand, and fell on it to absorb the blast with
    his body. He was killed, and the citation states that his action prevented additional
    loss of life or injury to the members of his platoon.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Milton L. Olive III (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. Private First Class Olive was a member of the 3d
    Platoon of Company B, as it moved through the jungle to find the Viet Cong operating
    in the area. Although the platoon was subjected to a heavy volume of enemy gunfire
    and pinned down temporarily, it retaliated by assaulting the Viet Cong positions,
    causing the enemy to flee. As the platoon pursued the insurgents, Private First
    Class Olive and 4 other soldiers were moving through the jungle together with
    a grenade was thrown into their midst. Private First Class Olive saw the grenade,
    and then saved the lives of his fellow soldiers at the sacrifice of his by grabbing
    the grenade in his hand and falling on it to absorb the blast with his body. Through
    his bravery, unhesitating actions, and complete disregard for his safety, he prevented
    additional loss of life or injury to the members of his platoon. Private First
    Class Olive's extraordinary heroism, at the risk of his life above and beyond
    the call of duty are in the highest traditions of the U.S. Army and reflect great
    credit upon himself and the Armed Forces of his country.
  summarized_by: Claude Fable 5.1
