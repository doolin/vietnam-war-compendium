- month: 11
  day: 8
  year: 1965
  title: Specialist Sixth Class (then Sp5c) Lawrence Joel earns Medal of Honor
  body: "<p>On November 8, 1965, Sp6c. Lawrence Joel was serving as a medical aidman
    when a numerically superior and well-concealed Viet Cong element attacked and
    wounded or killed nearly every man in his company's lead squad. After treating
    the men hit in the first burst, he moved forward to help others and was shot in
    the right leg by machine gun fire. He bandaged the wound, gave himself morphine,
    and kept going, shouting encouragement and holding plasma bottles high while kneeling
    under fire. Struck a second time, with a bullet lodged in his thigh, he dragged
    himself across the battlefield and treated 13 more men before his supplies ran
    out, saving one man by sealing a chest wound with a plastic bag.</p><p>When a
    platoon pursuing the Viet Cong was hit again, he crawled through gunfire with
    new supplies to reach the wounded. The battle lasted 24 hours and left 410 Viet
    Cong dead. Joel continued treating the wounded until his own evacuation was ordered.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Lawrence Joel (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of life above
    and beyond the call of duty. Sp6c. Joel demonstrated indomitable courage, determination,
    and professional skill when a numerically superior and well-concealed Viet Cong
    element launched a vicious attack which wounded or killed nearly every man in
    the lead squad of the company. After treating the men wounded by the initial burst
    of gunfire, he bravely moved forward to assist others who were wounded while proceeding
    to their objective. While moving from man to man, he was struck in the right leg
    by machine gun fire. Although painfully wounded his desire to aid his fellow soldiers
    transcended all personal feeling. He bandaged his own wound and self-administered
    morphine to deaden the pain enabling him to continue his dangerous undertaking.
    Through this period of time, he constantly shouted words of encouragement to all
    around him. Then, completely ignoring the warnings of others, and his pain, he
    continued his search for wounded, exposing himself to hostile fire; and, as bullets
    dug up the dirt around him, he held plasma bottles high while kneeling completely
    engrossed in his life saving mission. Then, after being struck a second time and
    with a bullet lodged in his thigh, he dragged himself over the battlefield and
    succeeded in treating 13 more men before his medical supplies ran out. Displaying
    resourcefulness, he saved the life of 1 man by placing a plastic bag over a severe
    chest wound to congeal the blood. As 1 of the platoons pursued the Viet Cong,
    an insurgent force in concealed positions opened fire on the platoon and wounded
    many more soldiers. With a new stock of medical supplies, Sp6c. Joel again shouted
    words of encouragement as he crawled through an intense hail of gunfire to the
    wounded men. After the 24 hour battle subsided and the Viet Cong dead numbered
    410, snipers continued to harass the company. Throughout the long battle, Sp6c.
    Joel never lost sight of his mission as a medical aidman and continued to comfort
    and treat the wounded until his own evacuation was ordered. His meticulous attention
    to duty saved a large number of lives and his unselfish, daring example under
    most adverse conditions was an inspiration to all. Sp6c. Joel's profound concern
    for his fellow soldiers, at the risk of his life above and beyond the call of
    duty are in the highest traditions of the U.S. Army and reflect great credit upon
    himself and the Armed Forces of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 11
  day: 14
  year: 1965
  title: Captain Ed W. Freeman earns Medal of Honor
  body: "<p>On November 14, 1965, Captain Ed W. Freeman was flight leader and second
    in command of a 16-helicopter lift unit of Company A, 229th Assault Helicopter
    Battalion, 1st Cavalry Division (Airmobile), supporting an American infantry battalion
    heavily engaged at Landing Zone X-Ray in the Ia Drang Valley. The battalion was
    nearly out of ammunition after taking some of the heaviest casualties of the war.
    When the infantry commander closed the landing zone because of direct enemy fire,
    Freeman flew his unarmed helicopter through enemy fire time after time to deliver
    ammunition, water and medical supplies.</p><p>After medical evacuation helicopters
    refused to fly into the area, Freeman flew 14 separate rescue missions and evacuated
    an estimated 30 seriously wounded soldiers, some of whom the citation states would
    not otherwise have survived. All flights went into a small emergency landing zone
    within 100 to 200 meters of the defensive perimeter.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Ed W. Freeman (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: for conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty:Captain Ed W. Freeman, United States Army, distinguished
    himself by numerous acts of conspicuous gallantry and extraordinary intrepidity
    on 14 November 1965 while serving with Company A, 229th Assault Helicopter Battalion,
    1st Cavalry Division (Airmobile). As a flight leader and second in command of
    a 16-helicopter lift unit, he supported a heavily engaged American infantry battalion
    at Landing Zone X-Ray in the Ia Drang Valley, Republic of Vietnam. The unit was
    almost out of ammunition after taking some of the heaviest casualties of the war,
    fighting off a relentless attack from a highly motivated, heavily armed enemy
    force. When the infantry commander closed the helicopter landing zone due to intense
    direct enemy fire, Captain Freeman risked his own life by flying his unarmed helicopter
    through a gauntlet of enemy fire time after time, delivering critically needed
    ammunition, water and medical supplies to the besieged battalion. His flights
    had a direct impact on the battle's outcome by providing the engaged units with
    timely supplies of ammunition critical to their survival, without which they would
    almost surely have gone down, with much greater loss of life. After medical evacuation
    helicopters refused to fly into the area due to intense enemy fire, Captain Freeman
    flew 14 separate rescue missions, providing life-saving evacuation of an estimated
    30 seriously wounded soldiers -- some of whom would not have survived had he not
    acted. All flights were made into a small emergency landing zone within 100 to
    200 meters of the defensive perimeter where heavily committed units were perilously
    holding off the attacking elements. Captain Freeman's selfless acts of great valor,
    extraordinary perseverance and intrepidity were far above and beyond the call
    of duty or mission and set a superb example of leadership and courage for all
    of his peers. Captain Freeman's extraordinary heroism and devotion to duty are
    in keeping with the highest traditions of military service and reflect great credit
    upon himself, his unit and the United States Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 11
  day: 14
  year: 1965
  title: First Lieutenant (then 2d Lt.) Walter Joseph Marm, Jr. earns Medal of Honor
  body: "<p>On November 14, 1965, 1st Lt. Walter Joseph Marm, Jr., was a platoon leader
    in the 1st Cavalry Division (Airmobile) as his company moved through the valley
    to relieve a friendly unit surrounded by an enemy force of estimated regimental
    size. He led his platoon through heavy fire until it was forced to take cover.
    Seeing four enemy soldiers moving into his position, he killed all 4. When a concealed
    machine gun pinned his platoon down, he deliberately exposed himself to draw its
    fire and locate it, then tried to destroy it with an antitank weapon, inflicting
    casualties without silencing it.</p><p>He charged 30 meters across open ground
    and threw grenades into the position, killing some of the 8 insurgents manning
    it. Severely wounded and out of grenades, he continued the assault with his rifle
    and killed the rest. His actions reduced the fire on his platoon, broke the enemy
    assault, and let his unit continue toward its mission.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Walter Joseph Marm, Jr. (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of life above
    and beyond the call of duty. As a platoon leader in the 1st Cavalry Division (Airmobile),
    1st Lt. Marm demonstrated indomitable courage during a combat operation. His company
    was moving through the valley to relieve a friendly unit surrounded by an enemy
    force of estimated regimental size. 1st Lt. Marm led his platoon through withering
    fire until they were finally forced to take cover. Realizing that his platoon
    could not hold very long, and seeing four enemy soldiers moving into his position,
    he moved quickly under heavy fire and annihilated all 4. Then, seeing that his
    platoon was receiving intense fire from a concealed machine gun, he deliberately
    exposed himself to draw its fire. Thus locating its position, he attempted to
    destroy it with an antitank weapon. Although he inflicted casualties, the weapon
    did not silence the enemy fire. Quickly, disregarding the intense fire directed
    on him and his platoon, he charged 30 meters across open ground, and hurled grenades
    into the enemy position, killing some of the 8 insurgents manning it. Although
    severely wounded, when his grenades were expended, armed with only a rifle, he
    continued the momentum of his assault on the position and killed the remainder
    of the enemy. 1st Lt. Marm's selfless actions reduced the fire on his platoon,
    broke the enemy assault, and rallied his unit to continue toward the accomplishment
    of this mission. 1st Lt. Marm's gallantry on the battlefield and his extraordinary
    intrepidity at the risk of his life are in the highest traditions of the U.S.
    Army and reflect great credit upon himself and the Armed Forces of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
