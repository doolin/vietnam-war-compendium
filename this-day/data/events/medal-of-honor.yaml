  body: "<p>On October 31, 1972, Petty Officer Michael Edwin Thornton, Assistant U.S.
    Navy Advisor, and a U.S. Navy lieutenant serving as Senior Advisor accompanied
    a three-man Vietnamese Navy SEAL patrol on an intelligence gathering and prisoner
    capture operation against an enemy-occupied naval river base. Launched from a
    Vietnamese Navy junk in a rubber boat, the patrol reached land and was moving
    on foot toward its objective when it came under heavy fire from a numerically
    superior force. The patrol called in naval gunfire support, fought a fierce firefight
    that inflicted many enemy casualties, and fell back to the waterline to avoid
    encirclement.</p><p>Learning that the Senior Advisor had been hit and was believed
    dead, Thornton went back through the fire to the lieutenant's last position, disposed
    of two enemy soldiers about to overrun it, and carried the seriously wounded,
    unconscious officer to the water's edge. He inflated the lieutenant's lifejacket
    and towed him seaward for approximately two hours until support craft picked them
    up. All patrol members were extracted, and the citation credits Thornton with
    saving his superior officer's life.</p>"
