- month: 12
  day: 18
  year: 1965
  title: Captain (then Lt.) Harvey C. Barnum, Jr. earns Medal of Honor
  body: "<p>On December 18, 1965, Lt. Harvey C. Barnum, Jr., was with Company H when
    it was pinned down by accurate enemy fire and separated from the rest of the battalion
    by over 500 meters of open ground, with casualties mounting. Barnum reconnoitered
    the area for artillery targets. Finding the rifle company commander mortally wounded
    and the radio operator killed, he aided the dying commander, strapped the radio
    to himself, and took command of the rifle company. Moving through heavy fire,
    he rallied and reorganized the units to replace lost key personnel and led their
    attack on the enemy positions.</p><p>With 2 armed helicopters, he controlled the
    air attack on the entrenched enemy while directing 1 platoon in a counterattack
    on the key enemy positions. Having cleared a small area, he requested and directed
    the landing of 2 transport helicopters to evacuate the dead and wounded, then
    assisted in the final seizure of the battalion's objective.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Harvey C. Barnum, Jr. (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. When the company was suddenly pinned down by a hail
    of extremely accurate enemy fire and was quickly separated from the remainder
    of the battalion by over 500 meters of open and fire-swept ground, and casualties
    mounted rapidly. Lt. Barnum quickly made a hazardous reconnaissance of the area,
    seeking targets for his artillery. Finding the rifle company commander mortally
    wounded and the radio operator killed, he, with complete disregard for his safety,
    gave aid to the dying commander, then removed the radio from the dead operator
    and strapped it to himself. He immediately assumed command of the rifle company,
    and moving at once into the midst of the heavy fire, rallying and giving encouragement
    to all units, reorganized them to replace the loss of key personnel and led their
    attack on enemy positions from which deadly fire continued to come. His sound
    and swift decisions and his obvious calm served to stabilize the badly decimated
    units and his gallant example as he stood exposed repeatedly to point out targets
    served as an inspiration to all. Provided with 2 armed helicopters, he moved fearlessly
    through enemy fire to control the air attack against the firmly entrenched enemy
    while skillfully directing 1 platoon in a successful counterattack on the key
    enemy positions. Having thus cleared a small area, he requested and directed the
    landing of 2 transport helicopters for the evacuation of the dead and wounded.
    He then assisted in the mopping up and final seizure of the battalion's objective.
    His gallant initiative and heroic conduct reflected great credit upon himself
    and were in keeping with the highest traditions of the Marine Corps and the U.S.
    Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 2
  day: 7
  year: 1966
  title: First Lieutenant James A. Gardner earns Medal of Honor (posthumous)
  body: "<p>On February 7, 1966, 1st Lt. James A. Gardner's platoon was advancing
    to relieve a company of the 1st Battalion that had been pinned down for several
    hours by a numerically superior enemy force in the village of My Canh, Vietnam.
    The enemy held a series of fortified, mutually supporting bunkers covered by automatic
    weapons, machine guns and mortars; air strikes and artillery had little effect.
    Leading the assault across an open rice paddy, Gardner destroyed the first bunker
    with a grenade, the second by tossing a grenade inside, and at the third killed
    the enemy gunner at a distance of 6 feet.</p><p>After reorganizing the platoon,
    he charged a machine gun bunker that had pinned it down again, dropped a grenade
    inside, and moved toward a new source of fire. He was gravely wounded just before
    reaching that bunker but staggered forward and destroyed it and its defenders
    with a grenade, falling dead on its rim. His platoon resumed the attack and routed
    the enemy.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, James A. Gardner (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. 1st Lt. Gardner's platoon was advancing
    to relieve a company of the 1st Battalion that had been pinned down for several
    hours by a numerically superior enemy force in the village of My Canh, Vietnam.
    The enemy occupied a series of strongly fortified bunker positions which were
    mutually supporting and expertly concealed. Approaches to the position were well
    covered by an integrated pattern of fire including automatic weapons, machine
    guns and mortars. Air strikes and artillery placed on the fortifications had little
    effect. 1st Lt. Gardner's platoon was to relieve the friendly company by encircling
    and destroying the enemy force. Even as it moved to begin the attack, the platoon
    was under heavy enemy fire. During the attack, the enemy fire intensified. Leading
    the assault and disregarding his own safety, 1st Lt. Gardner charged through a
    withering hail of fire across an open rice paddy. On reaching the first bunker
    he destroyed it with a grenade and without hesitation dashed to the second bunker
    and eliminated it by tossing a grenade inside. Then, crawling swiftly along the
    dike of a rice paddy, he reached the third bunker. Before he could arm a grenade,
    the enemy gunner leaped forth, firing at him. 1st Lt. Gardner instantly returned
    the fire and killed the enemy gunner at a distance of 6 feet. Following the seizure
    of the main enemy position, he reorganized the platoon to continue the attack.
    Advancing to the new assault position, the platoon was pinned down by an enemy
    machine gun emplaced in a fortified bunker. 1st Lt. Gardner immediately collected
    several grenades and charged the enemy position, firing his rifle as he advanced
    to neutralize the defenders. He dropped a grenade into the bunker and vaulted
    beyond. As the bunker blew up, he came under fire again. Rolling into a ditch
    to gain cover, he moved toward the new source of fire. Nearing the position, he
    leaped from the ditch and advanced with a grenade in one hand and firing his rifle
    with the other. He was gravely wounded just before he reached the bunker, but
    with a last valiant effort he staggered forward and destroyed the bunker, and
    its defenders with a grenade. Although he fell dead on the rim of the bunker,
    his extraordinary actions so inspired the men of his platoon that they resumed
    the attack and completely routed the enemy. 1st Lt. Gardner's conspicuous gallantry
    were in the highest traditions of the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 2
  day: 18
  year: 1966
  title: Specialist Fourth Class Daniel Fernandez earns Medal of Honor (posthumous)
  body: "<p>On February 18, 1966, Sp4c. Daniel Fernandez's patrol was ambushed by
    a Viet Cong rifle company and driven back by automatic weapons fire before it
    could evacuate an American soldier wounded in the attack. Fernandez, a sergeant
    and 2 other volunteers fought through fire and exploding grenades to reach the
    fallen soldier. When the sergeant was hit in the knee by machine gun fire and
    immobilized, Fernandez took charge, rallied the left flank of the patrol, and
    began helping to recover the wounded sergeant. A sudden increase in enemy fire
    forced the group to take cover, and an enemy grenade landed among them. Seeing
    there was no time for the wounded sergeant or the others to protect themselves,
    Fernandez vaulted over the sergeant and threw himself on the grenade as it exploded.
    He was killed and saved the lives of his 4 comrades.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Daniel Fernandez (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. Sp4c. Fernandez demonstrated indomitable courage
    when the patrol was ambushed by a Viet Cong rifle company and driven back by the
    intense enemy automatic weapons fire before it could evacuate an American soldier
    who had been wounded in the Viet Cong attack. Sp4c. Fernandez, a sergeant and
    2 other volunteers immediately fought their way through devastating fire and exploding
    grenades to reach the fallen soldier. Upon reaching their fallen comrade the sergeant
    was struck in the knee by machine gun fire and immobilized. Sp4c. Fernandez took
    charge, rallied the left flank of his patrol and began to assist in the recovery
    of the wounded sergeant. While first aid was being administered to the wounded
    man, a sudden increase in the accuracy and intensity of enemy fire forced the
    volunteer group to take cover. As they did, an enemy grenade landed in the midst
    of the group, although some men did not see it. Realizing there was no time for
    the wounded sergeant or the other men to protect themselves from the grenade blast,
    Sp4c. Fernandez vaulted over the wounded sergeant and threw himself on the grenade
    as it exploded, saving the lives of his 4 comrades at the sacrifice of his life.
    Sp4c. Fernandez' profound concern for his fellow soldiers, at the risk of his
    life above and beyond the call of duty are in the highest traditions of the U.S.
    Army and reflect great credit upon himself and the Armed Forces of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 2
  day: 25
  year: 1966
  title: Staff Sergeant Peter S. Connor earns Medal of Honor (posthumous)
  body: "<p>On February 25, 1966, S/Sergeant Peter S. Connor was leading his platoon
    on a search and destroy operation in an area of extensive cave and tunnel complexes,
    moving forward under intermittent enemy small-arms fire. He spotted an enemy spider
    hole about 15 meters to his front and pulled the pin on a fragmentation grenade,
    intending to charge the hole and drop the grenade in. On pulling the pin he found
    the firing mechanism was faulty: the fuse was already burning even with the safety
    lever held in place. He judged that he could not reach the hole in time and that
    throwing the grenade in any direction would kill or injure comrades deployed near
    him. He held the grenade against his body to absorb the explosion. He was mortally
    wounded, and the citation states that his act spared many of his fellow marines
    from death or injury.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Peter S. Connor (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action against enemy Viet
    Cong forces at the risk of his life above and beyond the call of duty. Leading
    his platoon on a search and destroy operation in an area made particularly hazardous
    by extensive cave and tunnel complexes, S/Sergeant. Connor maneuvered his unit
    aggressively forward under intermittent enemy small-arms fire. Exhibiting particular
    alertness and keen observation, he spotted an enemy spider hole emplacement approximately
    15 meters to his front. He pulled the pin from a fragmentation grenade intending
    to charge the hole boldly and drop the missile into its depths. Upon pulling the
    pin he realized that the firing mechanism was faulty, and that even as he held
    the safety device firmly in place, the fuse charge was already activated. With
    only precious seconds to decide, he further realized that he could not cover the
    distance to the small opening of the spider hole in sufficient time, and that
    to hurl the deadly bomb in any direction would result in death or injury to some
    of his comrades tactically deployed near him. Manifesting extraordinary gallantry
    and with utter disregard for his personal safety, he chose to hold the grenade
    against his body in order to absorb the terrific explosion and spare his comrades.
    His act of extreme valor and selflessness in the face of virtually certain death,
    although leaving him mortally wounded, spared many of his fellow marines from
    death or injury. His gallant action in giving his life in the cause of freedom
    reflects the highest credit upon the Marine Corps and the Armed Forces of the
    United States.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 3
  day: 5
  year: 1966
  title: Second Lieutenant Robert John Hibbs earns Medal of Honor (posthumous)
  body: "<p>On March 5, 1966, 2d Lt. Robert John Hibbs commanded a 15-man ambush patrol
    when it saw a Viet Cong company advancing along the road toward the battalion.
    He radioed his command post, placed 2 mines in the enemy's path, and fired them
    at 20 feet, killing or wounding half the company. To cover the patrol's withdrawal
    he threw grenades, stepped onto the open road, and fired on the remaining force
    of about 50 men. Returning toward the battalion perimeter, the patrol met the
    rear of another Viet Cong company; Hibbs led a charge through it that disrupted
    its attack.</p><p>Learning that a wounded patrol member was wandering between
    the forces, Hibbs, wounded in the leg, went back with a sergeant through the fire
    of 2 Viet Cong machine guns. The sergeant dragged the dazed soldier toward friendly
    lines while Hibbs covered them. He then charged the 2 machine gun emplacements
    with an M-16 rifle and a pistol and was struck down. Before dying he destroyed
    his rifle's starlight telescopic sight to keep it from the Viet Cong.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Robert John Hibbs (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of life above
    and beyond the call of duty. 2d Lt. Hibbs was in command of a 15-man ambush patrol
    of the 2d Battalion, when his unit observed a company of Viet Cong advancing along
    the road toward the 2d Battalion's position. Informing his command post by radio
    of the impending attack, he prepared his men for the oncoming Viet Cong, emplaced
    2 mines in their path and, when the insurgents were within 20 feet of the patrol's
    position, he fired the 2 antipersonnel mines, wounding or killing half of the
    enemy company. Then, to cover the withdrawal of his patrol, he threw hand grenades,
    stepped onto the open road, and opened fire on the remainder of the Viet Cong
    force of approximately 50 men. Having rejoined his men, he was leading them toward
    the battalion perimeter when the patrol encountered the rear elements of another
    Viet Cong company deployed to attack the battalion. With the advantage of surprise,
    he directed a charge against the Viet Cong, which carried the patrol through the
    insurgent force, completely disrupting its attack. Learning that a wounded patrol
    member was wandering in the area between the 2 opposing forces and although moments
    from safety and wounded in the leg himself, he and a sergeant went back to the
    battlefield to recover the stricken man. After they maneuvered through the withering
    fire of 2 Viet Cong machine guns, the sergeant grabbed the dazed soldier and dragged
    him back toward the friendly lines while 2d Lt. Hibbs remained behind to provide
    covering fire. Armed with only an M-16 rifle and a pistol, but determined to destroy
    the enemy positions, he then charged the 2 machine gun emplacements and was struck
    down. Before succumbing to his mortal wounds, he destroyed the starlight telescopic
    sight attached to his rifle to prevent its capture and use by the Viet Cong. 2d
    Lt. Hibb's profound concern for his fellow soldiers, and his intrepidity at the
    risk of his life above and beyond the call of duty are in the highest traditions
    of the U.S. Army and reflect great credit upon himself and the Armed Forces of
    his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 3
  day: 10
  year: 1966
  title: Major Bernard Francis Fisher earns Medal of Honor
  body: "<p>On March 10, 1966, the special forces camp at A Shau was under attack
    by 2,000 North Vietnamese Army regulars, who had positioned themselves between
    the airstrip and the camp and were raking the camp with automatic weapons fire
    from the surrounding hills. An 800 foot ceiling obscured the tops of the 1,500-foot
    hills, forcing pilots to operate within range of hostile guns that could fire
    down on them. During the battle Maj. Bernard Francis Fisher saw a fellow airman
    crash land on the airstrip. Believing the downed pilot was seriously injured and
    about to be captured, he announced he would land to rescue him.</p><p>Directing
    his own air cover, Fisher landed and taxied almost the full length of the runway,
    which was littered with debris and parts of an exploded aircraft. He picked up
    the downed pilot under heavy ground fire that put 19 bullets into his aircraft,
    then applied power and lifted off at the overrun of the airstrip.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Bernard Francis Fisher (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. On that date, the special forces camp at A Shau was
    under attack by 2,000 North Vietnamese Army regulars. Hostile troops had positioned
    themselves between the airstrip and the camp. Other hostile troops had surrounded
    the camp and were continuously raking it with automatic weapons fire from the
    surrounding hills. The tops of the 1,500-foot hills were obscured by an 800 foot
    ceiling, limiting aircraft maneuverability and forcing pilots to operate within
    range of hostile gun positions, which often were able to fire down on the attacking
    aircraft. During the battle, Maj. Fisher observed a fellow airman crash land on
    the battle-torn airstrip. In the belief that the downed pilot was seriously injured
    and in imminent danger of capture, Maj. Fisher announced his intention to land
    on the airstrip to effect a rescue. Although aware of the extreme danger and likely
    failure of such an attempt, he elected to continue. Directing his own air cover,
    he landed his aircraft and taxied almost the full length of the runway, which
    was littered with battle debris and parts of an exploded aircraft. While effecting
    a successful rescue of the downed pilot, heavy ground fire was observed, with
    19 bullets striking his aircraft. In the face of the withering ground fire, he
    applied power and gained enough speed to lift-off at the overrun of the airstrip.
    Maj. Fisher's profound concern for his fellow airman, and at the risk of his life
    above and beyond the call of duty are in the highest traditions of the U.S. Air
    Force and reflect great credit upon himself and the Armed Forces of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 3
  day: 16
  year: 1966
  title: Specialist Fourth Class Alfred V. Rascon earns Medal of Honor
  body: "<p>On March 16, 1966, Specialist Four Alfred V. Rascon was a medic with the
    Reconnaissance Platoon, Headquarters Company, 1st Battalion (Airborne), 503rd
    Infantry, 173d Airborne Brigade (Separate), when the platoon, moving to reinforce
    its sister battalion, came under heavy fire from a numerically superior enemy
    force. Several point squad soldiers were severely wounded. Ignoring directions
    to wait for covering fire, Rascon went forward, reached the wounded point machine-gunner
    on an open trail, shielded him with his own body, took shrapnel wounds and a serious
    hip wound, and dragged him off the trail. He then crawled back to strip the wounded
    man's ammunition bandoleers for the second machine-gunner, and recovered the abandoned
    machine gun, its ammunition and spare barrel, taking grenade fragments in the
    face and torso.</p><p>He covered the point grenadier and then the point squad
    leader with his body as grenades exploded, absorbing the blasts and taking more
    wounds. After the enemy broke contact he treated the wounded and directed their
    evacuation, accepting aid only once he was aboard the evacuation helicopter.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Alfred V. Rascon (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: Specialist Four Alfred Rascon, distinguished himself by a series of
    extraordinarily courageous acts on 16 March 1966, while assigned as a medic to
    the Reconnaissance Platoon, Headquarters Company, 1st Battalion (Airborne), 503rd
    Infantry, 173d Airborne Brigade (Separate). While moving to reinforce its sister
    battalion under intense enemy attack, the Reconnaissance Platoon came under heavy
    fire from a numerically superior enemy force. The intense enemy fire from crew-served
    weapons and grenades severely wounded several point squad soldiers. Specialist
    Rascon, ignoring directions to stay behind shelter until covering fire could be
    provided, made his way forward. He repeatedly tried to reach the severely wounded
    point machine-gunner laying on an open enemy trail, but was driven back each time
    by the withering fire. Disregarding his personal safety, he jumped to his feet,
    ignoring flying bullets and exploding grenades to reach his comrade. To protect
    him from further wounds, he intentionally placed his body between the soldier
    and enemy machine guns, sustaining numerous shrapnel injuries and a serious wound
    to the hip. Disregarding his serious wounds he dragged the larger soldier from
    the fire-raked trail. Hearing the second machine-gunner yell that he was running
    out of ammunition, Specialist Rascon, under heavy enemy fire crawled back to the
    wounded machine-gunner stripping him of his bandoleers of ammunition, giving them
    to the machine-gunner who continued his suppressive fire. Specialist Rascon fearing
    the abandoned machine gun, its ammunition and spare barrel could fall into enemy
    hands made his way to retrieve them. On the way, he was wounded in the face and
    torso by grenade fragments, but disregarded these wounds to recover the abandoned
    machine gun, ammunition and spare barrel items, enabling another soldier to provide
    added suppressive fire to the pinned-down squad. In searching for the wounded,
    he saw the point grenadier being wounded by small arms fire and grenades being
    thrown at him. Disregarding his own life and his numerous wounds, Specialist Rascon
    reached and covered him with his body absorbing the blasts from the exploding
    grenades, and saving the soldier's life, but sustaining additional wounds to his
    body. While making his way to the wounded point squad leader, grenades were hurled
    at the sergeant. Again, in complete disregard for his own life, he reached and
    covered the sergeant with his body, absorbing the full force of the grenade explosions.
    Once more Specialist Rascon was critically wounded by shrapnel, but disregarded
    his own wounds to continue to search and aid the wounded. Severely wounded, he
    remained on the battlefield, inspiring his fellow soldiers to continue the battle.
    After the enemy broke contact, he disregarded aid for himself, instead treating
    the wounded and directing their evacuation. Only after being placed on the evacuation
    helicopter did he allow aid to be given to him. Specialist Rascon's extraordinary
    valor in the face of deadly enemy fire, his heroism in rescuing the wounded, and
    his gallantry by repeatedly risking his own life for his fellow soldiers are in
    keeping with the highest traditions of military service and reflect great credit
    upon himself, his unit, and the United States Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 3
  day: 28
  year: 1966
  title: Petty Officer Robert R. Ingram earns Medal of Honor
  body: "<p>On March 28, 1966, Petty Officer Robert R. Ingram was serving as Corpsman
    with Company C, First Battalion, Seventh Marines, in Quang Ngai Province against
    elements of a North Vietnam Aggressor (NVA) battalion. He accompanied the point
    platoon as it took an NVA outpost and pushed down a tree covered slope toward
    a small paddy and a village. The village tree line opened with automatic rifle
    fire from about 100 North Vietnamese regulars, and the platoon ranks were decimated.
    Ingram crawled across the terrain to reach a downed Marine; as he gave aid, a
    bullet went through the palm of his hand.</p><p>Bleeding, he moved across the
    fire swept landscape collecting ammunition from the dead and treating the wounded,
    taking two more wounds and answering each call for corpsman. He reached the right
    flank of the platoon and took a fourth bullet wound while dressing another corpsman's
    head wound. From sixteen hundred hours until just before sunset he kept treating
    his Marines, and the citation states that his actions saved many lives that day.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Robert R. Ingram (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as Corpsman with Company C, First Battalion,
    Seventh Marines against elements of a North Vietnam Aggressor (NVA) battalion
    in Quang Ngai Province Republic of Vietnam on 28 March 1966. Petty Officer Ingram
    accompanied the point platoon as it aggressively dispatched an outpost of an NVA
    battalion. The momentum of the attack rolled off a ridge line down a tree covered
    slope to a small paddy and a village beyond. Suddenly, the village tree line exploded
    with an intense hail of automatic rifle fire from approximately 100 North Vietnamese
    regulars. In mere moments, the platoon ranks were decimated. Oblivious to the
    danger, Petty Officer Ingram crawled across the bullet spattered terrain to reach
    a downed Marine. As he administered aid, a bullet went through the palm of his
    hand. Calls for "CORPSMAN" echoed across the ridge. Bleeding, he edged across
    the fire swept landscape, collecting ammunition from the dead and administering
    aid to the wounded. Receiving two more wounds before realizing the third wound
    was life-threatening, he looked for a way off the face of the ridge, but again
    he heard the call for corpsman and again, he resolutely answered. Though severely
    wounded three times, he rendered aid to those incapable until he finally reached
    the right flank of the platoon. While dressing the head wound of another corpsman,
    he sustained his fourth bullet wound. From sixteen hundred hours until just prior
    to sunset, Petty Officer Ingram pushed, pulled, cajoled, and doctored his Marines.
    Enduring the pain from his many wounds and disregarding the probability of his
    demise, Petty Officer Ingram's intrepid actions saved many lives that day. By
    his indomitable fighting spirit, daring initiative, and unfaltering dedications
    to duty, Petty Officer Ingram reflected great credit upon himself and upheld the
    highest traditions of the United States Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 4
  day: 11
  year: 1966
  title: Airman First Class William H. Pitsenbarger earns Medal of Honor (posthumous)
  body: "<p>On April 11, 1966, Airman First Class William H. Pitsenbarger, a Pararescue
    Crew Member of Detachment 6, 38th Aerospace Rescue and Recovery Squadron, was
    aboard a rescue helicopter sent to evacuate casualties from a firefight between
    the United States Army's 1st Infantry Division and a sizeable enemy force near
    Cam My, 35 miles east of Saigon. He volunteered to ride a hoist more than one
    hundred feet through the jungle to the ground, where he organized the rescue effort,
    cared for the wounded, and prepared casualties for evacuation, refusing evacuation
    himself as each of the nine casualties lifted out that day was recovered.</p><p>When
    one of the two rescue helicopters was hit by ground fire and forced to leave,
    Pitsenbarger stayed to perform medical duties. The area came under sniper and
    mortar fire, then a heavy assault by a large Viet Cong force. He took up arms
    with the infantrymen, distributed ammunition, and kept treating the wounded, being
    wounded three times himself. The American forces suffered 80 percent casualties
    as their perimeter was breached, and Pitsenbarger was fatally wounded.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, William H. Pitsenbarger (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. Airman First Class Pitsenbarger distinguished himself
    by extreme valor on 11 April 1966 near Cam My, Republic of Vietnam, while assigned
    as a Pararescue Crew Member, Detachment 6, 38th Aerospace Rescue and Recovery
    Squadron. On that date, Airman Pitsenbarger was aboard a rescue helicopter responding
    to a call for evacuation of casualties incurred in an ongoing firefight between
    elements of the United States Army's 1st Infantry Division and a sizeable enemy
    force approximately 35 miles east of Saigon. With complete disregard for personal
    safety, Airman Pitsenbarger volunteered to ride a hoist more than one hundred
    feet through the jungle, to the ground. On the ground, he organized and coordinated
    rescue efforts, cared for the wounded, prepared casualties for evacuation, and
    insured that the recovery operation continued in a smooth and orderly fashion.
    Through his personal efforts, the evacuation of the wounded was greatly expedited.
    As each of the nine casualties evacuated that day was recovered, Airman Pitsenbarger
    refused evacuation in order to get more wounded soldiers to safety. After several
    pick-ups, one of the two rescue helicopters involved in the evacuation was struck
    by heavy enemy ground fire and was forced to leave the scene for an emergency
    landing. Airman Pitsenbarger stayed behind on the ground to perform medical duties.
    Shortly thereafter, the area came under sniper and mortar fire. During a subsequent
    attempt to evacuate the site, American forces came under heavy assault by a large
    Viet Cong force. When the enemy launched the assault, the evacuation was called
    off and Airman Pitsenbarger took up arms with the besieged infantrymen. He courageously
    resisted the enemy, braving intense gunfire to gather and distribute vital ammunition
    to American defenders. As the battle raged on, he repeatedly exposed himself to
    enemy fire to care for the wounded, pull them out of the line of fire, and return
    fire whenever he could, during which time he was wounded three times. Despite
    his wounds, he valiantly fought on, simultaneously treating as many wounded as
    possible. In the vicious fighting that followed, the American forces suffered
    80 percent casualties as their perimeter was breached, and Airman Pitsenbarger
    was fatally wounded. Airman Pitsenbarger exposed himself to almost certain death
    by staying on the ground, and perished while saving the lives of wounded infantrymen.
    His bravery and determination exemplify the highest professional standards and
    traditions of military service and reflect great credit upon himself, his unit,
    and the United States Air Force.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 4
  day: 11
  year: 1966
  title: Sergeant James W. Robinson, Jr. earns Medal of Honor (posthumous)
  body: "<p>On April 11, 1966, Company C was in fierce combat with a Viet Cong battalion.
    Sergeant James W. Robinson, Jr., moved among the men of his fire team under heavy
    fire, placing them in advantageous positions. Enemy snipers in nearby trees were
    inflicting heavy casualties; Robinson located the sniper taking the heaviest toll
    and killed him with a grenade launcher. When a medic was hit while treating a
    wounded sergeant in front of his position, Robinson charged through fire, dragged
    both men to safety, and gave first aid. As casualties mounted he collected weapons
    and ammunition from the wounded and redistributed them to able-bodied soldiers.</p><p>Rescuing
    another wounded man, he was wounded in the shoulder and leg but dragged the soldier
    to shelter and treated him. His rifle ammunition spent, he took 2 grenades and
    charged an enemy machinegun. A tracer round hit his leg and set his clothing on
    fire; he tore it off and kept going. Sustaining 2 chest wounds, he threw both
    grenades, destroyed the gun position, and fell dead.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, James W. Robinson, Jr. (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Company C was engaged in fierce combat
    with a Viet Cong battalion. Despite the heavy fire, Sergeant. Robinson moved among
    the men of his fire team, instructing and inspiring them, and placing them in
    advantageous positions. Enemy snipers located in nearby trees were inflicting
    heavy casualties on forward elements of Sergeant. Robinson's unit. Upon locating
    the enemy sniper whose fire was taking the heaviest toll, he took a grenade launcher
    and eliminated the sniper. Seeing a medic hit while administering aid to a wounded
    sergeant in front of his position and aware that now the 2 wounded men were at
    the mercy of the enemy, he charged through a withering hail of fire and dragged
    his comrades to safety, where he rendered first aid and saved their lives. As
    the battle continued and casualties mounted, Sergeant. Robinson moved about under
    intense fire to collect from the wounded their weapons and ammunition and redistribute
    them to able-bodied soldiers. Adding his fire to that of his men, he assisted
    in eliminating a major enemy threat. Seeing another wounded comrade in front of
    his position, Sergeant. Robinson again defied the enemy's fire to effect a rescue.
    In so doing he was himself wounded in the shoulder and leg. Despite his painful
    wounds, he dragged the soldier to shelter and saved his life by administering
    first aid. While patching his own wounds, he spotted an enemy machinegun which
    had inflicted a number of casualties on the American force. His rifle ammunition
    expended, he seized 2 grenades and, in an act of unsurpassed heroism, charged
    toward the entrenched enemy weapon. Hit again in the leg, this time with a tracer
    round which set fire to his clothing, Sergeant. Robinson ripped the burning clothing
    from his body and staggered indomitably through the enemy fire, now concentrated
    solely on him, to within grenade range of the enemy machinegun position. Sustaining
    2 additional chest wounds, he marshaled his fleeting physical strength and hurled
    the 2 grenades, thus destroying the enemy gun position, as he fell dead upon the
    battlefield. His magnificent display of leadership and bravery saved several lives
    and inspired his soldiers to defeat the numerically superior enemy force. Sergeant.
    Robinson's conspicuous gallantry and intrepidity, at the cost of his life, are
    in keeping with the finest traditions of the U.S. Army and reflect great credit
    upon the 1st Infantry Division and the U.S. Armed Forces.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 5
  day: 18
  year: 1966
  title: Staff Sergeant Jimmy G. Stewart earns Medal of Honor (posthumous)
  body: "<p>On May 18, 1966, early in the morning, a reinforced North Vietnamese company
    attacked Company B at its defensive perimeter in Vietnam. The attack wounded 5
    members of a 6-man squad in its direct path, leaving S/Sergeant Jimmy G. Stewart
    the lone defender of vital terrain against a hostile platoon. Refusing to withdraw
    during a lull, he held his ground to protect his fallen comrades and prevent a
    penetration of the company perimeter, emptying magazine after magazine at the
    charging enemy and throwing their grenades back at them. When his ammunition ran
    out he crawled under fire to his wounded team members and collected the ammunition
    they could not use.</p><p>He held the position for 4 hours through 3 assaults,
    and the company position held until a reinforcing platoon arrived and counterattacked.
    His body was found afterward in a shallow enemy hole, where he had advanced to
    add his fire to the counterattack. Eight enemy dead lay around his position, with
    signs that 15 others had been dragged away. The wounded he protected were recovered
    and evacuated.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Jimmy G. Stewart (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Early in the morning a reinforced
    North Vietnamese company attacked Company B, which was manning a defensive perimeter
    in Vietnam. The surprise onslaught wounded 5 members of a 6-man squad caught in
    the direct path of the enemy's thrust. S/Sergeant. Stewart became a lone defender
    of vital terrain--virtually 1 man against a hostile platoon. Refusing to take
    advantage of a lull in the firing which would have permitted him to withdraw,
    S/Sergeant. Stewart elected to hold his ground to protect his fallen comrades
    and prevent an enemy penetration of the company perimeter. As the full force of
    the platoon-sized man attack struck his lone position, he fought like a man possessed;
    emptying magazine after magazine at the determined, on-charging enemy. The enemy
    drove almost to his position and hurled grenades, but S/Sergeant. Stewart decimated
    them by retrieving and throwing the grenades back. Exhausting his ammunition,
    he crawled under intense fire to his wounded team members and collected ammunition
    that they were unable to use. Far past the normal point of exhaustion, he held
    his position for 4 harrowing hours and through 3 assaults, annihilating the enemy
    as they approached and before they could get a foothold. As a result of his defense,
    the company position held until the arrival of a reinforcing platoon which counterattacked
    the enemy, now occupying foxholes to the left of S/Sergeant. Stewart's position.
    After the counterattack, his body was found in a shallow enemy hole where he had
    advanced in order to add his fire to that of the counterattacking platoon. Eight
    enemy dead were found around his immediate position, with evidence that 15 others
    had been dragged away. The wounded whom he gave his life to protect, were recovered
    and evacuated. S/Sergeant. Stewart's indomitable courage, in the face of overwhelming
    odds, stands as a tribute to himself and an inspiration to all men of his unit.
    His actions were in the highest traditions of the U.S. Army and the Armed Forces
    of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 5
  day: 21
  year: 1966
  title: Sergeant David Charles Dolby earns Medal of Honor
  body: "<p>On May 21, 1966, Sergeant David Charles Dolby's platoon, advancing tactically,
    came under intense fire from an enemy on a ridge to its front. Six men were killed
    instantly and others wounded, including the platoon leader. Dolby moved the wounded
    to safety and deployed the rest of the platoon to engage the enemy. On the dying
    platoon leader's order, he positioned able-bodied men to cover the forward elements'
    withdrawal, helped the wounded to the new position, and alone attacked enemy positions
    until his ammunition was gone. After resupplying, he returned to the heaviest
    action and killed 3 enemy machine gunners, letting friendly elements on the flank
    advance on the enemy redoubt.</p><p>He carried a seriously wounded soldier to
    safety, then crawled to within 50 meters of the enemy bunkers and threw smoke
    grenades to mark them for air strikes. Under sniper and automatic weapons fire
    at close range, he directed artillery that silenced several enemy weapons and
    stayed in his exposed position until his comrades had moved to more secure ground.
    The combat lasted 4 hours.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, David Charles Dolby (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of life above
    and beyond the call of duty, when his platoon, while advancing tactically, suddenly
    came under intense fire from the enemy located on a ridge immediately to the front.
    Six members of the platoon were killed instantly and a number were wounded, including
    the platoon leader. Sergeant. Dolby's every move brought fire from the enemy.
    However, aware that the platoon leader was critically wounded, and that the platoon
    was in a precarious situation, Sergeant. Dolby moved the wounded men to safety
    and deployed the remainder of the platoon to engage the enemy. Subsequently, his
    dying platoon leader ordered Sergeant. Dolby to withdraw the forward elements
    to rejoin the platoon. Despite the continuing intense enemy fire and with utter
    disregard for his own safety, Sergeant. Dolby positioned able-bodied men to cover
    the withdrawal of the forward elements, assisted the wounded to the new position,
    and he, alone, attacked enemy positions until his ammunition was expended. Replenishing
    his ammunition, he returned to the area of most intense action, single-handedly
    killed 3 enemy machine gunners and neutralized the enemy fire, thus enabling friendly
    elements on the flank to advance on the enemy redoubt. He defied the enemy fire
    to personally carry a seriously wounded soldier to safety where he could be treated
    and, returning to the forward area, he crawled through withering fire to within
    50 meters of the enemy bunkers and threw smoke grenades to mark them for air strikes.
    Although repeatedly under fire at close range from enemy snipers and automatic
    weapons, Sergeant. Dolby directed artillery fire on the enemy and succeeded in
    silencing several enemy weapons. He remained in his exposed location until his
    comrades had displaced to more secure positions. His actions of unsurpassed valor
    during 4 hours of intense combat were a source of inspiration to his entire company,
    contributed significantly to the success of the overall assault on the enemy position,
    and were directly responsible for saving the lives of a number of his fellow soldiers.
    Sergeant. Dolby's heroism was in the highest tradition of the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 6
  day: 16
  year: 1966
  title: Gunnery Sergeant (then S/Sergeant) Jimmie E. Howard earns Medal of Honor
  body: "<p>On June 16, 1966, G/Sergeant Jimmie E. Howard and his 18-man platoon were
    occupying an observation post deep in enemy-controlled territory when, shortly
    after midnight, a Viet Cong force of estimated battalion size attacked with small
    arms, automatic weapons, and mortar fire. Howard organized the platoon into a
    tight perimeter defense and moved from position to position directing fire through
    repeated assaults during the night. When fragments from an enemy grenade severely
    wounded him and he could no longer move his legs, he distributed his ammunition
    to the rest of the platoon, kept up radio communications, and directed air strikes
    on the enemy.</p><p>At dawn, with 5 men killed and all but 1 wounded, the platoon
    still held its position. When evacuation helicopters approached, Howard warned
    them away and called for more air strikes and small-arms fire against enemy automatic
    weapons positions to secure the landing zone. The citation credits him with preventing
    the loss of his entire platoon.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Jimmie E. Howard (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his own life
    above and beyond the call of duty. G/Sergeant. Howard and his 18-man platoon were
    occupying an observation post deep within enemy-controlled territory. Shortly
    after midnight a Viet Cong force of estimated battalion size approached the marines'
    position and launched a vicious attack with small arms, automatic weapons, and
    mortar fire. Reacting swiftly and fearlessly in the face of the overwhelming odds,
    G/Sergeant. Howard skillfully organized his small but determined force into a
    tight perimeter defense and calmly moved from position to position to direct his
    men's fire. Throughout the night, during assault after assault, his courageous
    example and firm leadership inspired and motivated his men to withstand the unrelenting
    fury of the hostile fire in the seemingly hopeless situation. He constantly shouted
    encouragement to his men and exhibited imagination and resourcefulness in directing
    their return fire. When fragments of an exploding enemy grenade wounded him severely
    and prevented him from moving his legs, he distributed his ammunition to the remaining
    members of his platoon and proceeded to maintain radio communications and direct
    air strikes on the enemy with uncanny accuracy. At dawn, despite the fact that
    5 men were killed and all but 1 wounded, his beleaguered platoon was still in
    command of its position. When evacuation helicopters approached his position,
    G/Sergeant. Howard warned them away and called for additional air strikes and
    directed devastating small-arms fire and air strikes against enemy automatic weapons
    positions in order to make the landing zone as secure as possible. Through his
    extraordinary courage and resolute fighting spirit, G/Sergeant. Howard was largely
    responsible for preventing the loss of his entire platoon. His valiant leadership
    and courageous fighting spirit served to inspire the men of his platoon to heroic
    endeavor in the face of overwhelming odds, and reflect the highest credit upon
    G/Sergeant. Howard, the Marine Corps, and the U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 6
  day: 19
  year: 1966
  title: Captain (then 1st Lt.) Ronald Eric Ray earns Medal of Honor
  body: "<p>On June 19, 1966, Capt. Ronald Eric Ray was a platoon leader with Company
    A when 1 of his ambush patrols was attacked by an estimated reinforced Viet Cong
    company. He organized a reaction force, moved through 2 kilometers of mountainous
    jungle, broke through the hostile lines to reach the patrol, and began directing
    the reinforcement of the site. When an enemy position pinned down 3 of his men
    with automatic weapons fire, he silenced it with a grenade and killed 4 Viet Cong
    with his rifle. As medics moving a casualty came under fire, he got close enough
    to silence that position with another grenade.</p><p>Moments later he saw an enemy
    grenade land unnoticed near 2 of his men and dove between it and them, taking
    wounds in his feet and legs. An enemy machinegun then wounded him again in the
    legs, but he silenced it with a grenade. In pain, he kept directing his men and
    led them out of their surrounded position, allowing his own evacuation only after
    the platoon was out of immediate danger.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Ronald Eric Ray (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Capt. Ray distinguished himself while
    serving as a platoon leader with Company A. When 1 of his ambush patrols was attacked
    by an estimated reinforced Viet Cong company, Capt. Ray organized a reaction force
    and quickly moved through 2 kilometers of mountainous jungle terrain to the contact
    area. After breaking through the hostile lines to reach the beleaguered patrol,
    Capt. Ray began directing the reinforcement of the site. When an enemy position
    pinned down 3 of his men with a heavy volume of automatic weapons fire, he silenced
    the emplacement with a grenade and killed 4 Viet Cong with his rifle fire. As
    medics were moving a casualty toward a sheltered position, they began receiving
    intense hostile fire. While directing suppressive fire on the enemy position,
    Capt. Ray moved close enough to silence the enemy with a grenade. A few moments
    later Capt. Ray saw an enemy grenade land, unnoticed, near 2 of his men. Without
    hesitation or regard for his safety he dove between the grenade and the men, thus
    shielding them from the explosion while receiving wounds in his exposed feet and
    legs. He immediately sustained additional wounds in his legs from an enemy machinegun,
    but nevertheless he silenced the emplacement with another grenade. Although suffering
    great pain from his wounds, Capt. Ray continued to direct his men, providing the
    outstanding courage and leadership they vitally needed, and prevented their annihilation
    by successfully leading them from their surrounded position. Only after assuring
    that his platoon was no longer in immediate danger did he allow himself to be
    evacuated for medical treatment. By his gallantry at the risk of his life in the
    highest traditions of the military service, Capt. Ray has reflected great credit
    on himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 6
  day: 29
  year: 1966
  title: Staff Sergeant (then Sergeant) Charles B. Morris earns Medal of Honor
  body: "<p>On June 29, 1966, S/Sergeant Charles B. Morris, seeing signs of the enemy,
    deployed his squad and went forward alone to reconnoiter. He crawled unknowingly
    within 20 meters of an enemy machinegun and was shot in the chest. Morris killed
    the gunner with return fire and the crew with a grenade, then reported to the
    platoon leader as the platoon came under heavy fire. Refusing medical attention,
    he positioned his men for an 8-hour fight against a larger enemy force, with withdrawal
    impossible without abandoning the wounded and dead.</p><p>With the medic dead,
    Morris treated himself and the wounded, was wounded again, and kept throwing grenades
    after an enemy grenade shattered his left hand. When an enemy machinegun got behind
    the platoon, he crawled toward it with another man; his comrade was killed and
    Morris wounded once more, but he silenced the gun firing his rifle with 1 hand.
    He dragged wounded to cover and led his men until relief arrived. Documents on
    the enemy dead revealed a planned ambush of a Republic of Vietnam battalion, which
    was prevented.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Charles B. Morris (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. Seeing indications of the enemy's presence in the
    area, S/Sergeant. Morris deployed his squad and continued forward alone to make
    a reconnaissance. He unknowingly crawled within 20 meters of an enemy machinegun,
    whereupon the gunner fired, wounding him in the chest. S/Sergeant. Morris instantly
    returned the fire and killed the gunner. Continuing to crawl within a few feet
    of the gun, he hurled a grenade and killed the remainder of the enemy crew. Although
    in pain and bleeding profusely, S/Sergeant. Morris continued his reconnaissance.
    Returning to the platoon area, he reported the results of his reconnaissance to
    the platoon leader. As he spoke, the platoon came under heavy fire. Refusing medical
    attention for himself, he deployed his men in better firing positions confronting
    the entrenched enemy to his front. Then for 8 hours the platoon engaged the numerically
    superior enemy force. Withdrawal was impossible without abandoning many wounded
    and dead. Finding the platoon medic dead, S/Sergeant. Morris administered first
    aid to himself and was returning to treat the wounded members of his squad with
    the medic's first aid kit when he was again wounded. Knocked down and stunned,
    he regained consciousness and continued to treat the wounded, reposition his men,
    and inspire and encourage their efforts. Wounded again when an enemy grenade shattered
    his left hand, nonetheless he personally took up the fight and armed and threw
    several grenades which killed a number of enemy soldiers. Seeing that an enemy
    machinegun had maneuvered behind his platoon and was delivering the fire upon
    his men, S/Sergeant. Morris and another man crawled toward the gun to knock it
    out. His comrade was killed and S/Sergeant. Morris sustained another wound, but,
    firing his rifle with 1 hand, he silenced the enemy machinegun. Returning to the
    platoon, he courageously exposed himself to the devastating enemy fire to drag
    the wounded to a protected area, and with utter disregard for his personal safety
    and the pain he suffered, he continued to lead and direct the efforts of his men
    until relief arrived. Upon termination of the battle, important documents were
    found among the enemy dead revealing a planned ambush of a Republic of Vietnam
    battalion. Use of this information prevented the ambush and saved many lives.
    S/Sergeant. Morris' gallantry was instrumental in the successful defeat of the
    enemy, saved many lives, and was in the highest traditions of the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 6
  day: 30
  year: 1966
  title: Sergeant Donald Russell Long earns Medal of Honor (posthumous)
  body: "<p>On June 30, 1966, Troops B and C were on a reconnaissance mission along
    a road when a Viet Cong regiment, supported by mortars, recoilless rifles and
    machine guns, attacked from concealed positions astride the road. Sergeant Donald
    Russell Long left his armored personnel carrier under heavy fire to carry wounded
    men to evacuation helicopters. As the platoon fought forward to resupply its advanced
    elements, he repeatedly exposed himself at point blank range to deliver supplies,
    and during the assault on the Viet Cong position he stood unprotected on his carrier,
    using rifle fire and grenades to repel enemy soldiers trying to climb aboard.</p><p>When
    the enemy threatened to overrun a disabled carrier nearby, Long helped its severely
    wounded crew to safety. As he handed arms to the less seriously wounded, an enemy
    grenade landed on the carrier deck. He shouted a warning, pushed to safety one
    man who had not heard him, and then threw himself over the grenade. He was killed
    and saved the lives of 8 of his comrades.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Donald Russell Long (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Troops B and C, while conducting a
    reconnaissance mission along a road were suddenly attacked by a Viet Cong regiment,
    supported by mortars, recoilless rifles and machine guns, from concealed positions
    astride the road. Sergeant. Long abandoned the relative safety of his armored
    personnel carrier and braved a withering hail of enemy fire to carry wounded men
    to evacuation helicopters. As the platoon fought its way forward to resupply advanced
    elements, Sergeant. Long repeatedly exposed himself to enemy fire at point blank
    range to provide the needed supplies. While assaulting the Viet Cong position,
    Sergeant. Long inspired his comrades by fearlessly standing unprotected to repel
    the enemy with rifle fire and grenades as they attempted to mount his carrier.
    When the enemy threatened to overrun a disabled carrier nearby, Sergeant. Long
    again disregarded his own safety to help the severely wounded crew to safety.
    As he was handing arms to the less seriously wounded and reorganizing them to
    press the attack, an enemy grenade was hurled onto the carrier deck. Immediately
    recognizing the imminent danger, he instinctively shouted a warning to the crew
    and pushed to safety one man who had not heard his warning over the roar of battle.
    Realizing that these actions would not fully protect the exposed crewmen from
    the deadly explosion, he threw himself over the grenade to absorb the blast and
    thereby saved the lives of 8 of his comrades at the expense of his life. Throughout
    the battle, Sergeant. Long's extraordinary heroism, courage and supreme devotion
    to his men were in the finest tradition of the military service, and reflect great
    credit upon himself and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 7
  day: 18
  year: 1966
  title: Major (then Capt.) Robert J. Modrzejewski earns Medal of Honor
  body: "<p>On July 18, 1966, Company K was attacked by a regimental-size enemy force,
    the last day of an action that began on 15 July during Operation HASTINGS, when
    the company landed in enemy-infested jungle to block a major enemy trail network.
    Shortly after landing, Maj. Robert J. Modrzejewski led his men in seizing a reinforced
    enemy platoon's defensive position, which held large quantities of ammunition
    and supplies. That evening a larger enemy force counterattacked to retake the
    area, setting the pattern for the next 2 1/2 days. The second night the enemy
    struck in battalion strength and Modrzejewski was wounded in close-quarters fighting.
    Despite his wounds he crawled 200 meters to bring ammunition to an exposed element
    of his command and directed artillery fire to within a few meters of his position.</p><p>On
    18 July, with his unit outnumbered and weakened by the previous fighting, Modrzejewski
    reorganized his men and again called in air and artillery strikes at close range.
    Together with the company's fighting, the strikes repulsed the attack of the larger
    North Vietnamese force.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Robert J. Modrzejewski (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. On 15 July, during Operation HASTINGS, Company K
    was landed in an enemy-infested jungle area to establish a blocking position at
    a major enemy trail network. Shortly after landing, the company encountered a
    reinforced enemy platoon in a well-organized, defensive position. Maj. Modrzejewski
    led his men in the successful seizure of the enemy redoubt, which contained large
    quantities of ammunition and supplies. That evening, a numerically superior enemy
    force counterattacked in an effort to retake the vital supply area, thus setting
    the pattern of activity for the next 2 1/2 days. In the first series of attacks,
    the enemy assaulted repeatedly in overwhelming numbers but each time was repulsed
    by the gallant marines. The second night, the enemy struck in battalion strength,
    and Maj. Modrzejewski was wounded in this intensive action which was fought at
    close quarters. Although exposed to enemy fire, and despite his painful wounds,
    he crawled 200 meters to provide critically needed ammunition to an exposed element
    of his command and was constantly present wherever the fighting was heaviest,
    despite numerous casualties, a dwindling supply of ammunition and the knowledge
    that they were surrounded, he skillfully directed artillery fire to within a few
    meter* of his position and courageously inspired the efforts of his company in
    repelling the aggressive enemy attack. On 18 July, Company K was attacked by a
    regimental-size enemy force. Although his unit was vastly outnumbered and weakened
    by the previous fighting, Maj. Modrzejewski reorganized his men and calmly moved
    among them to encourage and direct their efforts to heroic limits as they fought
    to overcome the vicious enemy onslaught. Again he called in air and artillery
    strikes at close range with devastating effect on the enemy, which together with
    the bold and determined fighting of the men of Company K, repulsed the fanatical
    attack of the larger North Vietnamese force. His unparalleled personal heroism
    and indomitable leadership inspired his men to a significant victory over the
    enemy force and reflected great credit upon himself, the Marine Corps, and the
    U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 7
  day: 18
  year: 1966
  title: Second Lieutenant (then S/Sergeant) John J. McGinty III earns Medal of Honor
  body: "<p>On July 18, 1966, 2d Lt. John J. McGinty III's 32-man platoon was providing
    rear security for the withdrawal of the battalion from a position that had been
    under attack for 3 days when it came under heavy small arms, automatic weapons
    and mortar fire from an estimated enemy regiment. Through successive human wave
    assaults over a 4-hour battle, McGinty rallied his men. When 2 squads became separated
    from the platoon, he charged through automatic weapons and mortar fire to reach
    them, found 20 men wounded and the corpsman killed, reloaded magazines and weapons
    for the wounded, and directed their fire. Painfully wounded while caring for them,
    he kept shouting encouragement and directing fire until the attackers were beaten
    off.</p><p>When the enemy tried to outflank his position, he killed 5 at point-blank
    range with his pistol. As they again seemed about to overrun the small force,
    he adjusted artillery and air strikes to within 50 yards of his position. The
    enemy was routed and left an estimated 500 bodies on the battlefield.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, John J. McGinty III (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. 2d Lt. McGinty's platoon, which was providing rear
    security to protect the withdrawal of the battalion from a position which had
    been under attack for 3 days, came under heavy small arms, automatic weapons and
    mortar fire from an estimated enemy regiment. With each successive human wave
    which assaulted his 32-man platoon during the 4-hour battle, 2d Lt. McGinty rallied
    his men to beat off the enemy. In 1 bitter assault, 2 of the squads became separated
    from the remainder of the platoon. With complete disregard for his safety, 2d
    Lt. McGinty charged through intense automatic weapons and mortar fire to their
    position. Finding 20 men wounded and the medical corpsman killed, he quickly reloaded
    ammunition magazines and weapons for the wounded men and directed their fire upon
    the enemy. Although he was painfully wounded as he moved to care for the disabled
    men, he continued to shout encouragement to his troops and to direct their fire
    so effectively that the attacking hordes were beaten off. When the enemy tried
    to out-flank his position, he killed 5 of them at point-blank range with his pistol.
    When they again seemed on the verge of overrunning the small force, he skillfully
    adjusted artillery and air strikes within 50 yards of his position. This destructive
    firepower routed the enemy, who left an estimated 500 bodies on the battlefield.
    2d Lt. McGinty's personal heroism, indomitable leadership, selfless devotion to
    duty, and bold fighting spirit inspired his men to resist the repeated attacks
    by a fanatical enemy, reflected great credit upon himself, and upheld the highest
    traditions of the Marine Corps and the U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 7
  day: 24
  year: 1966
  title: Sergeant (then L/Corporal) Richard A. Pittman earns Medal of Honor
  body: "<p>On July 24, 1966, Company 1 was moving along a narrow jungle trail when
    its leading elements came under heavy fire from a well concealed and numerically
    superior enemy force and suffered numerous casualties. Hearing the engaged marines
    call for more firepower, Sergeant Richard A. Pittman exchanged his rifle for a
    machinegun and several belts of ammunition and rushed forward from his platoon.
    Taken under small-arms fire at point blank range, he returned fire and silenced
    the position, then destroyed 2 automatic weapons that fired on him as he pressed
    on. Learning of more wounded marines 50 yards further along the trail, he continued
    through mortar and small-arms fire.</p><p>At the position where the leading marines
    had fallen, he met a frontal attack by 30 to 40 enemy. He set up in the middle
    of the trail and raked them with machinegun fire. When his weapon failed, he fired
    an enemy submachinegun and a pistol taken from a fallen comrade until the enemy
    withdrew, threw his last grenade at them, and rejoined his platoon.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Richard A. Pittman (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. While Company 1 was conducting an operation along
    the axis of a narrow jungle trail, the leading company elements suffered numerous
    casualties when they suddenly came under heavy fire from a well concealed and
    numerically superior enemy force. Hearing the engaged marines' calls for more
    firepower, Sergeant. Pittman quickly exchanged his rifle for a machinegun and
    several belts of ammunition, left the relative safety of his platoon, and unhesitatingly
    rushed forward to aid his comrades. Taken under intense enemy small-arms fire
    at point blank range during his advance, he returned the fire, silencing the enemy
    position. As Sergeant. Pittman continued to forge forward to aid members of the
    leading platoon, he again came under heavy fire from 2 automatic weapons which
    he promptly destroyed. Learning that there were additional wounded marines 50
    yards further along the trail, he braved a withering hail of enemy mortar and
    small-arms fire to continue onward. As he reached the position where the leading
    marines had fallen, he was suddenly confronted with a bold frontal attack by 30
    to 40 enemy. Totally disregarding his safety, he calmly established a position
    in the middle of the trail and raked the advancing enemy with devastating machinegun
    fire. His weapon rendered ineffective, he picked up an enemy submachinegun and,
    together with a pistol seized from a fallen comrade, continued his lethal fire
    until the enemy force had withdrawn. Having exhausted his ammunition except for
    a grenade which he hurled at the enemy, he then rejoined his platoon. Sergeant.
    Pittman's daring initiative, bold fighting spirit and selfless devotion to duty
    inflicted many enemy casualties, disrupted the enemy attack and saved the lives
    of many of his wounded comrades. His personal valor at grave risk to himself reflects
    the highest credit upon himself, the Marine Corps, and the U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 8
  day: 9
  year: 1966
  title: Major Howard V. Lee earns Medal of Honor
  body: "<p>On August 9, 1966, a platoon of Maj. Howard V. Lee's company, on an operation
    deep in enemy territory, was attacked and surrounded by a large Vietnamese force.
    With the platoon's leadership lost to casualties and the unit under heavy attack,
    Lee took 7 men by helicopter to reinforce it. He landed with 2 of his men, led
    them through enemy fire into the perimeter, and moved from position to position
    directing and encouraging the troops. The enemy then launched a massive attack
    with the full weight of their forces. Wounded in several parts of his body, including
    his eye, by fragments from an enemy grenade, Lee directed the defense through
    the night, coordinated supporting fire, and kept higher headquarters informed
    of the platoon's situation.</p><p>The next morning he collapsed from his wounds
    and gave up command. The marines held their position through repeated enemy attacks
    for 6 hours until they were evacuated the following morning. The citation states
    that his actions saved his men from capture and minimized the loss of lives.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Howard V. Lee (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. A platoon of Maj. (then Capt.) Lee's company, while
    on an operation deep in enemy territory, was attacked and surrounded by a large
    Vietnamese force. Realizing that the unit had suffered numerous casualties, depriving
    it of effective leadership, and fully aware that the platoon was even then under
    heavy attack by the enemy, Maj Lee took 7 men and proceeded by helicopter to reinforce
    the beleaguered platoon. Maj. Lee disembarked from the helicopter with 2 of his
    men and, braving withering enemy fire, led them into the perimeter, where he fearlessly
    moved from position to position, directing and encouraging the overtaxed troops.
    The enemy then launched a massive attack with the full might of their forces.
    Although painfully wounded by fragments from an enemy grenade in several areas
    of his body, including his eye, Maj. Lee continued undauntedly throughout the
    night to direct the valiant defense, coordinate supporting fire, and apprise higher
    headquarters of the plight of the platoon. The next morning he collapsed from
    his wounds and was forced to relinquish command. However the small band of marines
    had held their position and repeatedly fought off many vicious enemy attacks for
    a grueling 6 hours until their evacuation was effected the following morning.
    Maj. Lee's actions saved his men from capture, minimized the loss of lives, and
    dealt the enemy a severe defeat. His indomitable fighting spirit, superb leadership,
    and great personal valor in the face of tremendous odds, reflect great credit
    upon himself and are in keeping with the highest traditions of the Marine Corps
    and the U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:36Z'
- month: 9
  day: 21
  year: 1966
  title: Private First Class Billy Lane Lauffer earns Medal of Honor (posthumous)
  body: "<p>On September 21, 1966, Private First Class Lauffer's squad, part of Company
    C, was struck at close range by machine gun crossfire from two concealed bunkers
    astride its route. Lauffer, second man in the column, saw the lead man fall and
    the rest of the squad unable to move. Two comrades, already wounded and being
    carried on litters, lay helpless in the beaten zone of the enemy fire.</p><p>Lauffer
    engaged both bunkers with his rifle, but when the other squad members tried to
    maneuver under his covering fire the enemy fire increased and stopped every attempt.
    He rose to his feet and charged the machine gun positions, firing his weapon and
    drawing the enemy's attention. His one-man assault gave the wounded point man
    time to crawl to a covered position, the squad time to move the litter patients
    to safety, and his comrades time to gain better positions. Lauffer was fatally
    wounded during the charge.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Billy Lane Lauffer (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Private First Class Lauffer's squad,
    a part of Company C, was suddenly struck at close range by an intense machine
    gun crossfire from 2 concealed bunkers astride the squad's route. Private First
    Class Lauffer, the second man in the column, saw the lead man fall and noted that
    the remainder of the squad was unable to move. Two comrades, previously wounded
    and being carried on litters, were Lying helpless in the beaten zone of the enemy
    fire. Reacting instinctively, Private First Class Lauffer quickly engaged both
    bunkers with fire from his rifle, but when the other squad members attempted to
    maneuver under his covering fire, the enemy fusillade increased in volume and
    thwarted every attempt to move. Seeing this and his wounded comrades helpless
    in the open, Private First Class Lauffer rose to his feet and charged the enemy
    machine gun positions, firing his weapon and drawing the enemy's attention. Keeping
    the enemy confused and off balance, his 1-man assault provided the crucial moments
    for the wounded point man to crawl to a covered position, the squad to move the
    exposed litter patients to safety, and his comrades to gain more advantageous
    positions. Private First Class Lauffer was fatally wounded during his selfless
    act of courage and devotion to his fellow soldiers. His gallantry at the cost
    of his life served as an inspiration to his comrades and saved the lives of an
    untold number of his companions. His actions are in keeping with the highest traditions
    of military service and reflect great credit upon himself, his unit, and the U.S.
    Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 10
  day: 31
  year: 1966
  title: Boatswain's Mate First Class (PO1c.) James E. Williams earns Medal of Honor
  body: "<p>On October 31, 1966, PO1c. Williams was serving as Boat Captain and Patrol
    Officer aboard River Patrol Boat (PBR) 105 when his two-boat patrol was taken
    under fire by two enemy sampans. Williams ordered the fire returned, killing the
    crew of one boat and driving the other into a nearby river inlet. Pursuing it,
    the patrol met heavy small-arms fire from concealed positions along the river
    bank, then confronted two enemy junks and eight sampans backed by automatic weapons
    fire from ashore.</p><p>Williams deployed his patrol to await armed helicopters,
    discovered a larger concentration of enemy boats, and led the patrol through the
    fire without waiting, damaging or destroying 50 sampans and 7 junks. When the
    helicopters arrived he directed the attack on the remaining force. Near dark,
    he ordered the boats' search lights turned on and moved close to shore to press
    the attack despite dwindling ammunition. Over the three-hour battle the patrol
    accounted for the destruction or loss of 65 enemy boats and inflicted numerous
    casualties.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, James E. Williams (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. PO1c. Williams was serving as Boat Captain and Patrol
    Officer aboard River Patrol Boat (PBR) 105 accompanied by another patrol boat
    when the patrol was suddenly taken under fire by 2 enemy sampans. PO1c. Williams
    immediately ordered the fire returned, killing the crew of 1 enemy boat and causing
    the other sampan to take refuge in a nearby river inlet. Pursuing the fleeing
    sampan, the U.S. patrol encountered a heavy volume of small-arms fire from enemy
    forces, at close range, occupying well-concealed positions along the river bank.
    Maneuvering through this fire, the patrol confronted a numerically superior enemy
    force aboard 2 enemy junks and 8 sampans augmented by heavy automatic weapons
    fire from ashore. In the savage battle that ensued, PO1c. Williams, with utter
    disregard for his safety exposed himself to the withering hail of enemy fire to
    direct counter-fire and inspire the actions of his patrol. Recognizing the overwhelming
    strength of the enemy force, PO1c. Williams deployed his patrol to await the arrival
    of armed helicopters. In the course of his movement his discovered an even larger
    concentration of enemy boats. Not waiting for the arrival of the armed helicopters,
    he displayed great initiative and boldly led the patrol through the intense enemy
    fire and damaged or destroyed 50 enemy sampans and 7 junks. This phase of the
    action completed, and with the arrival of the armed helicopters, PO1c. Williams
    directed the attack on the remaining enemy force. Now virtually dark, and although
    PO1c. Williams was aware that his boats would become even better targets, he ordered
    the patrol boats' search lights turned on to better illuminate the area and moved
    the patrol perilously close to shore to press the attack. Despite a waning supply
    of ammunition the patrol successfully engaged the enemy ashore and completed the
    rout of the enemy force. Under the leadership of PO 1 c. Williams, who demonstrated
    unusual professional skill and indomitable courage throughout the 3 hour battle,
    the patrol accounted for the destruction or loss of 65 enemy boats and inflicted
    numerous casualties on the enemy personnel. His extraordinary heroism and exemplary
    fighting spirit in the face of grave risks inspired the efforts of his men to
    defeat a larger enemy force, and are in keeping with the finest traditions of
    the U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 11
  day: 5
  year: 1966
  title: Captain Robert F. Foley earns Medal of Honor
  body: "<p>On November 5, 1966, Capt. Foley's company was ordered to extricate another
    company of the battalion. Moving through dense jungle, Company A met a strong
    enemy force in well concealed defensive positions, and its leading element took
    several casualties. Foley ran forward to the point of heaviest action, deployed
    one platoon on the flank, and led the other two in an attack. When both his radio
    operators were wounded he helped them to where they could receive medical care.
    When a machine gun crew was wounded he took the weapon and charged forward firing
    it, then continued alone until the wounded were evacuated and the attack resumed.</p><p>When
    the other flank stalled, Foley moved there to direct the fight. He was blown off
    his feet and wounded by a grenade, refused medical aid, and stayed at the front
    of the assault on the enemy redoubt, single-handedly destroying three gun emplacements.
    The battle lasted several hours, and the citation credits his leadership with
    the success of the operation.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Robert F. Foley (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Capt. Foley's company was ordered
    to extricate another company of the battalion. Moving through the dense jungle
    to aid the besieged unit, Company A encountered a strong enemy force occupying
    well concealed, defensive positions, and the company's leading element quickly
    sustained several casualties. Capt. Foley immediately ran forward to the scene
    of the most intense action to direct the company's efforts. Deploying 1 platoon
    on the flank, he led the other 2 platoons in an attack on the enemy in the face
    of intense fire. During this action both radio operators accompanying him were
    wounded. At grave risk to himself he defied the enemy's murderous fire, and helped
    the wounded operators to a position where they could receive medical care. As
    he moved forward again 1 of his machine gun crews was wounded. Seizing the weapon,
    he charged forward firing the machine gun, shouting orders and rallying his men,
    thus maintaining the momentum of the attack. Under increasingly heavy enemy fire
    he ordered his assistant to take cover and, alone, Capt. Foley continued to advance
    firing the machine gun until the wounded had been evacuated and the attack in
    this area could be resumed. When movement on the other flank was halted by the
    enemy's fanatical defense, Capt. Foley moved to personally direct this critical
    phase of the battle. Leading the renewed effort he was blown off his feet and
    wounded by an enemy grenade. Despite his painful wounds he refused medical aid
    and persevered in the forefront of the attack on the enemy redoubt. He led the
    assault on several enemy gun emplacements and, single-handedly, destroyed 3 such
    positions. His outstanding personal leadership under intense enemy fire during
    the fierce battle which lasted for several hours, inspired his men to heroic efforts
    and was instrumental in the ultimate success of the operation. Capt. Foley's magnificent
    courage, selfless concern for his men and professional skill reflect the utmost
    credit upon himself and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 11
  day: 5
  year: 1966
  title: Sergeant (then Private First Class) John F. Baker, Jr. earns Medal of Honor
  body: "<p>On November 5, 1966, Company A was en route to assist another unit engaged
    with the enemy when it came under intense fire and the lead man was killed. Sergeant
    Baker moved to the head of the column and with another soldier knocked out two
    enemy bunkers. When his comrade was mortally wounded, Baker killed four Viet Cong
    snipers, evacuated the fallen soldier, and returned to lead repeated assaults,
    killing several more Viet Cong.</p><p>Attacking two more bunkers, he was blown
    from his feet by a grenade, recovered, and destroyed one bunker alone before the
    soldier with him was wounded. He took his comrade's machine gun and charged through
    the fire to silence the other bunker, then evacuated the man, replenished his
    ammunition, and returned to the fight. When the forward element was ordered to
    withdraw, he carried one wounded man to the rear, killed snipers who fired on
    him as he returned for another, and after his ammunition ran out dragged two more
    fallen comrades to safety.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, John F. Baker, Jr. (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. En route to assist another unit that
    was engaged with the enemy, Company A came under intense enemy fire and the lead
    man was killed instantly. Sergeant. Baker immediately moved to the head of the
    column and together with another soldier knocked out 2 enemy bunkers. When his
    comrade was mortally wounded, Sergeant. Baker, spotting 4 Viet Cong snipers, killed
    all of them, evacuated the fallen soldier and returned to lead repeated assaults
    against the enemy positions, killing several more Viet Cong. Moving to attack
    2 additional enemy bunkers, he and another soldier drew intense enemy fire and
    Sergeant. Baker was blown from his feet by an enemy grenade. He quickly recovered
    and single-handedly destroyed 1 bunker before the other soldier was wounded. Seizing
    his fallen comrade's machine gun, Sergeant. Baker charged through the deadly fusillade
    to silence the other bunker. He evacuated his comrade, replenished his ammunition
    and returned to the forefront to brave the enemy fire and continue the fight.
    When the forward element was ordered to withdraw, he carried 1 wounded man to
    the rear. As he returned to evacuate another soldier, he was taken under fire
    by snipers, but raced beyond the friendly troops to attack and kill the snipers.
    After evacuating the wounded man, he returned to cover the deployment of the unit.
    His ammunition now exhausted, he dragged 2 more of his fallen comrades to the
    rear. Sergeant. Baker's selfless heroism, indomitable fighting spirit, and extraordinary
    gallantry were directly responsible for saving the lives of several of his comrades,
    and inflicting serious damage on the enemy. His acts were in keeping with the
    highest traditions of the U.S. Army and reflect great credit upon himself and
    the Armed Forces of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 11
  day: 8
  year: 1966
  title: Captain Euripides Rubio earns Medal of Honor (posthumous)
  body: "<p>On November 8, 1966, Capt. Rubio was serving as communications officer
    of the 1st Battalion when a numerically superior enemy force launched a massive
    attack on the battalion defense position under machinegun, mortar, and rifle grenade
    fire. Rubio left his post and went to the area of heaviest action, where he was
    wounded twice while distributing ammunition, re-establishing positions, and aiding
    the wounded. When a rifle company commander was evacuated, Rubio took command.
    He was wounded a third time moving among his men.</p><p>While helping evacuate
    the wounded he saw that a smoke grenade meant to mark the Viet Cong position for
    air strikes had fallen close to the friendly lines. He ran to reposition it and
    was knocked to his knees by enemy fire. He picked up the grenade, ran to within
    20 meters of the enemy position, and threw it into their midst before he fell
    for the final time. Air strikes directed on the repositioned marker destroyed
    the hostile positions.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Euripides Rubio (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Capt. Rubio, Infantry, was serving
    as communications officer, 1st Battalion, when a numerically superior enemy force
    launched a massive attack against the battalion defense position. Intense enemy
    machinegun fire raked the area while mortar rounds and rifle grenades exploded
    within the perimeter. Leaving the relative safety of his post, Capt. Rubio received
    2 serious wounds as he braved the withering fire to go to the area of most intense
    action where he distributed ammunition, re-established positions and rendered
    aid to the wounded. Disregarding the painful wounds, he unhesitatingly assumed
    command when a rifle company commander was medically evacuated. Capt. Rubio was
    wounded a third time as he selflessly exposed himself to the devastating enemy
    fire to move among his men to encourage them to fight with renewed effort. While
    aiding the evacuation of wounded personnel, he noted that a smoke grenade which
    was intended to mark the Viet Cong position for air strikes had fallen dangerously
    close to the friendly lines. Capt. Rubio ran to reposition the grenade but was
    immediately struck to his knees by enemy fire. Despite his several wounds, Capt.
    Rubio scooped up the grenade, ran through the deadly hail of fire to within 20
    meters of the enemy position and hurled the already smoking grenade into the midst
    of the enemy before he fell for the final time. Using the repositioned grenade
    as a marker, friendly air strikes were directed to destroy the hostile positions.
    Capt. Rubio's singularly heroic act turned the tide of battle, and his extraordinary
    leadership and valor were a magnificent inspiration to his men. His remarkable
    bravery and selfless concern for his men are in keeping with the highest traditions
    of the military service and reflect great credit on Capt. Rubio and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 11
  day: 13
  year: 1966
  title: Captain (then 1st Lt.) Joseph Xavier Grant earns Medal of Honor (posthumous)
  body: <p>On November 13, 1966, Company A was on a search and destroy operation when
    its leading platoon made contact with the enemy. Capt. Grant was ordered to disengage
    the two remaining platoons and maneuver them to envelop the enemy. The platoons
    met automatic weapons and mortar fire and were ordered into a defensive position,
    where the enemy attacked with "human wave" assaults. Grant moved along the line,
    repositioning soldiers to fill gaps left by mounting casualties. He moved a wounded
    platoon leader to safety and was wounded in the shoulder.</p><p>Refusing treatment,
    he returned to the perimeter's forward edge. Pinned down by a machine gun while
    trying to evacuate a wounded soldier, he crawled forward with hand grenades, knocked
    out the gun and killed its crew, then moved the man to safety. He led five men
    across open ground to rescue several more wounded men pinned forward of the position.
    After they returned to the perimeter, a concentration of mortar fire landed among
    them and Grant was killed instantly. The task force repulsed the assaults.</p>
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Joseph Xavier Grant (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Company A was participating in a search
    and destroy operation when the leading platoon made contact with the enemy and
    a fierce fire-fight ensued. Capt. Grant was ordered to disengage the 2 remaining
    platoons and to maneuver them to envelop and destroy the enemy. After beginning
    their movement, the platoons encountered intense enemy automatic weapons and mortar
    fire from the front and flank. Capt. Grant was ordered to deploy the platoons
    in a defensive position. As this action was underway, the enemy attacked, using
    "human wave'' assaults, in an attempt to literally overwhelm Capt. Grant's force.
    In a magnificent display of courage and leadership, Capt. Grant moved under intense
    fire along the hastily formed defensive line repositioning soldiers to fill gaps
    created by the mounting casualties and inspiring and directing the efforts of
    his men to successfully repel the determined enemy onslaught. Seeing a platoon
    leader wounded, Capt. Grant hastened to his aid, in the face of the mass of fire
    of the entire enemy force, and moved him to a more secure position. During this
    action, Capt. Grant was wounded in the shoulder. Refusing medical treatment, he
    returned to the forward part of the perimeter, where he continued to lead and
    to inspire his men by his own indomitable example. While attempting to evacuate
    a wounded soldier, he was pinned down by fire from an enemy machine gun. With
    a supply of hand grenades, he crawled forward under a withering hail of fire and
    knocked out the machine gun, killing the crew, after which he moved the wounded
    man to safety. Learning that several other wounded men were pinned down by enemy
    fire forward of his position, Capt. Grant disregarded his painful wound and led
    5 men across the fire-swept open ground to effect a rescue. Following return of
    the wounded men to the perimeter, a concentration of mortar fire landed in their
    midst and Capt. Grant was killed instantly. His heroic actions saved the lives
    of a number of his comrades and enabled the task force to repulse the vicious
    assaults and defeat the enemy. Capt. Grant's actions reflect great credit upon
    himself and were in keeping with the finest traditions of the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 11
  day: 19
  year: 1966
  title: Sergeant Ted Belcher earns Medal of Honor (posthumous)
  body: "<p>On November 19, 1966, Sergeant Belcher's unit was on a search and destroy
    mission with Company B, 1st Battalion, 14th Infantry, the Battalion Reconnaissance
    Platoon, and a special forces company of civilian irregular defense group personnel.
    As a squad leader in the 2d Platoon of Company C, Belcher was leading his men
    when they encountered a bunker complex. The reconnaissance platoon, a few hundred
    meters to the northwest, came under heavy fire from camouflaged snipers, and the
    2d Platoon moved forward to assist.</p><p>Advancing a short distance through dense
    jungle, Belcher's squad met heavy and accurate automatic weapons and sniper fire
    and was momentarily stopped. He ordered his men to return fire and resume the
    advance. As he moved up with them, a hand grenade landed in the midst of the squad.
    Belcher lunged forward and covered the grenade with his body, absorbing the blast.
    He was killed, and his squad members escaped becoming casualties.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Ted Belcher (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: Distinguishing himself by conspicuous gallantry and intrepidity at
    the risk of his life. Sergeant. Belcher's unit was engaged in a search and destroy
    mission with Company B, 1st Battalion, 14th Infantry, the Battalion Reconnaissance
    Platoon and a special forces company of civilian irregular defense group personnel.
    As a squad leader of the 2d Platoon of Company C, Sergeant. Belcher was leading
    his men when they encountered a bunker complex. The reconnaissance platoon, located
    a few hundred meters northwest of Company C, received a heavy volume of fire from
    well camouflaged snipers. As the 2d Platoon moved forward to assist the unit under
    attack, Sergeant. Belcher and his squad, advancing only a short distance through
    the dense jungle terrain, met heavy and accurate automatic weapons and sniper
    fire. Sergeant. Belcher and his squad were momentarily stopped by the deadly volume
    of enemy fire. He quickly gave the order to return fire and resume the advance
    toward the enemy. As he moved up with his men, a hand grenade landed in the midst
    of the sergeant's squad. Instantly realizing the immediate danger to his men,
    Sergeant. Belcher, unhesitatingly and with complete disregard for his safety,
    lunged forward, covering the grenade with his body. Absorbing the grenade blast
    at the cost of his life, he saved his comrades from becoming casualties. Sergeant.
    Belcher's profound concern for his fellow soldiers, at the risk of his life above
    and beyond the call of duty are in keeping with the highest traditions of the
    U.S. Army and reflect credit upon himself and the Armed Forces of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 12
  day: 1
  year: 1966
  title: Private First Class Lewis Albanese earns Medal of Honor (posthumous)
  body: "<p>On December 1, 1966, Private First Class Albanese's platoon was advancing
    through densely covered terrain to establish a blocking position when it received
    automatic weapons fire from close range. As other members maneuvered to assault
    the enemy position, Albanese was ordered to provide security for the platoon's
    left flank. The flank then came under fire from enemy in a well-concealed ditch.
    Albanese fixed his bayonet and moved into the ditch, silencing the sniper fire
    and letting the platoon resume its advance on the main position.</p><p>The ditch
    was a well-organized complex of enemy defenses built to bring flanking fire on
    forces attacking the main position. Albanese advanced 100 meters along the trench
    and killed six snipers armed with automatic weapons. With his ammunition exhausted,
    he killed two more enemy soldiers in hand-to-hand combat and was mortally wounded.
    The platoon advanced against a numerically superior enemy force without falling
    to the fire from the ditch.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Lewis Albanese (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life and beyond the call of duty. Private First Class Albanese's platoon,
    while advancing through densely covered terrain to establish a blocking position,
    received intense automatic weapons fire from close range. As other members maneuvered
    to assault the enemy position, Private First Class Albanese was ordered to provide
    security for the left flank of the platoon. Suddenly, the left flank received
    fire from enemy located in a well-concealed ditch. Realizing the imminent danger
    to his comrades from this fire, Private First Class Albanese fixed his bayonet
    and moved aggressively into the ditch. His action silenced the sniper fire, enabling
    the platoon to resume movement toward the main enemy position. As the platoon
    continued to advance, the sound of heavy firing emanated from the left flank from
    a pitched battle that ensued in the ditch which Private First Class Albanese had
    entered. The ditch was actually a well-organized complex of enemy defenses designed
    to bring devastating flanking fire on the forces attacking the main position.
    Private First Class Albanese, disregarding the danger to himself, advanced 100
    meters along the trench and killed 6 of the snipers, who were armed with automatic
    weapons. Having exhausted his ammunition, Private First Class Albanese was mortally
    wounded when he engaged and killed 2 more enemy soldiers in fierce hand-to-hand
    combat. His unparalleled actions saved the lives of many members of his platoon
    who otherwise would have fallen to the sniper fire from the ditch, and enabled
    his platoon to successfully advance against an enemy force of overwhelming numerical
    superiority. Private First Class Albanese's extraordinary heroism and supreme
    dedication to his comrades were commensurate with the finest traditions of the
    military service and remain a tribute to himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 12
  day: 1
  year: 1966
  title: Staff Sergeant Edward N. Kaneshiro earns Medal of Honor (posthumous)
  body: "<p>On December 1, 1966, Staff Sergeant Kaneshiro was serving as an Infantry
    Squad Leader with Troop C, 1st Squadron, 9th Cavalry, near Phu Huu 2, Kim Son
    Valley. Two squads of his platoon had moved into the center of a village, not
    knowing it held a bunkered and concealed trench system garrisoned by a superior
    North Vietnamese force, while Kaneshiro's squad scouted the open terrain to the
    east. The enemy opened fire on the two squads, killing the platoon leader and
    the point man, wounding four others, and pinning the survivors.</p><p>Kaneshiro
    moved his men toward the firing, put them under cover, and crawled forward alone.
    He threw a grenade through the bunker aperture, killing the machine gunner, then
    jumped into the trench and worked about 35 meters of its length alone, destroying
    one enemy group with rifle fire and two others with grenades. By the end of his
    sweep the survivors of the two squads were standing and preparing to move the
    dead and wounded. The platoon reorganized and withdrew from the village.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Edward N. Kaneshiro (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty Staff Sergeant Edward N. Kaneshiro distinguished himself
    by acts of gallantry and intrepidity above and beyond the call of duty while serving
    as an Infantry Squad Leader with Troop C, 1st Squadron, 9th Cavalry, 1st Cavalry
    Division near Phu Huu 2, Kim Son Valley, Republic of Vietnam, on 1 December 1966.
    Not knowing that the village was heavily fortified with a fully bunkered and concealed
    trench system and garrisoned by North Vietnamese troops in vastly superior force,
    two squads of the platoon had deployed to its center, while Staff Sergeant Kaneshiro
    and his squad scouted the more open terrain to the east of the village. Sensing
    the opportunity to ambush the Infantry squads, the entrenched enemy force erupted
    with machine gun and small arms fire against the two squads at the center of the
    village, killing the platoon leader and the point man, wounding four others, then
    successfully suppressing the surviving soldiers. Staff Sergeant Kaneshiro moved
    with his men to the sounds of the fire. Swiftly reading the situation, seeing
    that the fire from the trench had to be stopped if anyone was to survive, he first
    deployed his men to cover, then crawled forward to attack the enemy force alone.
    He began by throwing grenades from the parapet while flattened to the ground,
    successfully throwing the first grenade through the aperture of the bunker, eliminating
    the machine gunner who had opened the action. With five grenades remaining and
    his rifle to sustain his assault, Staff Sergeant Kaneshiro jumped into the trench
    to sweep its length where it fronted the two pinned squads. Over the distance
    of about 35 meters, he worked the ditch alone, destroying one enemy group with
    rifle fire and two others with grenades. By the end of his sweep, the able-bodied
    survivors of the two squads were again standing and preparing to move the dead
    and wounded. Staff Sergeant Kaneshiro's actions enabled the orderly extrication
    and reorganization of the platoon which ultimately led to a successful withdrawal
    from the village. Staff Sergeant Kaneshiro's conspicuous gallantry and uncommon
    heroism under fire were in keeping with the highest traditions of the military
    service and reflect great credit upon himself, his unit, and the United States
    Army
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 12
  day: 27
  year: 1966
  title: Staff Sergeant Delbert O. Jennings earns Medal of Honor
  body: "<p>On December 27, 1966, part of Company C was defending an artillery position
    when a North Vietnamese Army regiment attacked with mortar, recoilless-rifle,
    and machine gun support. S/Sergeant Jennings ran to his bunker astride the main
    attack route and slowed the enemy wave with machine gun fire, killing at least
    12 before his squad was forced to the rear. He covered the squad's withdrawal,
    rejoined his men, destroyed an enemy demolition crew about to blow up a howitzer,
    and killed three enemy soldiers at his first bunker. He ordered his men into a
    secondary position and covered them again, killing one enemy with the butt of
    his weapon.</p><p>He crossed a fire-swept area to warn defenders of an enemy force
    behind them and lead them into the secondary perimeter. He marked the landing
    zone for reinforcements with white phosphorous grenades, silhouetting himself
    in the light. After the final assaults were repulsed, he led volunteers beyond
    friendly lines through sniper fire and booby traps to recover eight seriously
    wounded men.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Delbert O. Jennings (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of life above
    and beyond the call of duty. Part of Company C was defending an artillery position
    when attacked by a North Vietnamese Army regiment supported by mortar, recoilless-rifle,
    and machine gun fire. At the outset, S/Sergeant. Jennings sprang to his bunker,
    astride the main attack route, and slowed the on-coming enemy wave with highly
    effective machine gun fire. Despite a tenacious defense in which he killed at
    least 12 of the enemy, his squad was forced to the rear. After covering the withdrawal
    of the squad, he rejoined his men, destroyed an enemy demolition crew about to
    blow up a nearby howitzer, and killed 3 enemy soldiers at his initial bunker position.
    Ordering his men back into a secondary position, he again covered their withdrawal,
    killing 1 enemy with the butt of his weapon. Observing that some of the defenders
    were unaware of an enemy force in their rear, he raced through a fire-swept area
    to warn the men, turn their fire on the enemy, and lead them into the secondary
    perimeter. Assisting in the defense of the new position, he aided the air-landing
    of reinforcements by throwing white phosphorous grenades on the landing zone despite
    dangerously silhouetting himself with the light. After helping to repulse the
    final enemy assaults, he led a group of volunteers well beyond friendly lines
    to an area where 8 seriously wounded men lay. Braving enemy sniper fire and ignoring
    the presence of booby traps in the area, they recovered the 8 men who would have
    probably perished without early medical treatment. S/Sergeant. Jenning's extraordinary
    heroism and inspirational leadership saved the lives of many of his comrades and
    contributed greatly to the defeat of a superior enemy force. His actions stand
    with the highest traditions of the military profession and reflect great credit
    upon himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 1
  day: 27
  year: 1967
  title: Specialist Fourth Class Donald W. Evans, Jr. earns Medal of Honor (posthumous)
  body: "<p>On January 27, 1967, Sp4c. Evans left the relative safety of his platoon,
    which had not yet been committed to the battle, to answer calls for medical aid
    from the wounded of another platoon heavily engaged with the enemy. He crossed
    100 meters of open ground under fire and exploding grenades, treated one man,
    and moved from one wounded man to the next under continued fire. He dragged one
    soldier whose wounds needed immediate attention back across the open area to a
    secure position for evacuation, then returned to the forward location.</p><p>While
    treating the wounded he was struck by fragments from an enemy grenade. He evacuated
    another comrade, rejoined his platoon as it was committed to battle, and was soon
    treating more wounded. Carrying another man across the field, he was severely
    wounded. He refused medical attention, moved yet another wounded comrade to safety,
    and, weakened from bleeding, continued his medical aid until he was killed while
    treating another wounded soldier. The citation credits him with saving several
    of his fellow soldiers.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Donald W. Evans, Jr. (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. He left his position of relative safety
    with his platoon which had not yet been committed to the battle to answer the
    calls for medical aid from the wounded men of another platoon which was heavily
    engaged with the enemy force. Dashing across 100 meters of open area through a
    withering hail of enemy fire and exploding grenades, he administered lifesaving
    treatment to 1 individual and continued to expose himself to the deadly enemy
    fire as he moved to treat each of the other wounded men and to offer them encouragement.
    Realizing that the wounds of 1 man required immediate attention, Sp4c. Evans dragged
    the injured soldier back across the dangerous fire-swept area, to a secure position
    from which he could be further evacuated Miraculously escaping the enemy fusillade,
    Sp4c. Evans returned to the forward location. As he continued the treatment of
    the wounded, he was struck by fragments from an enemy grenade. Despite his serious
    and painful injury he succeeded in evacuating another wounded comrade, rejoined
    his platoon as it was committed to battle and was soon treating other wounded
    soldiers. As he evacuated another wounded man across the fire covered field, he
    was severely wounded. Continuing to refuse medical attention and ignoring advice
    to remain behind, he managed with his waning strength to move yet another wounded
    comrade across the dangerous open area to safety. Disregarding his painful wounds
    and seriously weakened from profuse bleeding, he continued his lifesaving medical
    aid and was killed while treating another wounded comrade. Sp4c. Evan's extraordinary
    valor, dedication and indomitable spirit saved the lives of several of his fellow
    soldiers, served as an inspiration to the men of his company, were instrumental
    in the success of their mission, and reflect great credit upon himself and the
    Armed Forces of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 2
  day: 7
  year: 1967
  title: First Lieutenant George K. Sisler earns Medal of Honor (posthumous)
  body: "<p>On February 7, 1967, 1st Lt. Sisler was platoon leader and adviser to
    a Special United States/Vietnam exploitation force on patrol deep in enemy dominated
    territory when his platoon was attacked from three sides by a company sized enemy
    force. Sisler rallied his men, moved them to a better position, called for air
    strikes, and directed their efforts. Learning that two wounded men could not pull
    back to the perimeter, he went out through intense fire to reach them.</p><p>While
    carrying one of the wounded back he came under heavier fire. He laid the man down,
    killed three enemy soldiers with his rifle, and silenced an enemy machinegun with
    a grenade, then brought the wounded man to the perimeter. When the left flank
    came under heavy attack and several more of his men were wounded, Sisler took
    up grenades and charged alone into the assault. The attack broke up and the enemy
    began withdrawing. Despite continuing enemy fire, Sisler kept moving about the
    battlefield directing his force as more of his men were wounded.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, George K. Sisler (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life and
    above and beyond the call of duty. 1st Lt. Sisler was the platoon leader/adviser
    to a Special United States/Vietnam exploitation force. While on patrol deep within
    enemy dominated territory, 1st Lt. Sisler's platoon was attacked from 3 sides
    by a company sized enemy force. 1st Lt. Sisler quickly rallied his men, deployed
    them to a better defensive position, called for air strikes, and moved among his
    men to encourage and direct their efforts. Learning that 2 men had been wounded
    and were unable to pull back to the perimeter, 1st Lt. Sisler charged from the
    position through intense enemy fire to assist them. He reached the men and began
    carrying 1 of them back to the perimeter, when he was taken under more intensive
    weapons fire by the enemy. Laying down his wounded comrade, he killed 3 onrushing
    enemy soldiers by firing his rifle and silenced the enemy machinegun with a grenade.
    As he returned the wounded man to the perimeter, the left flank of the position
    came under extremely heavy attack by the superior enemy force and several additional
    men of his platoon were quickly wounded. Realizing the need for instant action
    to prevent his position from being overrun, 1st Lt. Sisler picked up some grenades
    and charged single-handedly into the enemy onslaught, firing his weapon and throwing
    grenades. This singularly heroic action broke up the vicious assault and forced
    the enemy to begin withdrawing. Despite the continuing enemy fire, 1st Lt. Sisler
    was moving about the battlefield directing force and several additional men of
    his platoon were quickly wounded. His extraordinary leadership, infinite courage,
    and selfless concern for his men saved the lives of a number of his comrades.
    His actions reflect great credit upon himself and uphold the highest traditions
    of the military service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 2
  day: 15
  year: 1967
  title: Private First Class Louis E. Willett earns Medal of Honor (posthumous)
  body: "<p>On February 15, 1967, Private First Class Willett was serving as a rifleman
    in Company C when his squad, conducting a security sweep, made contact with a
    large enemy force. The squad was pinned to the ground by heavy automatic weapons
    fire. Willett rose to his feet, fired rapid bursts from his weapon, and moved
    to a position from which he placed effective fire on the enemy, allowing the rest
    of the squad to begin withdrawing toward the company perimeter.</p><p>Covering
    the withdrawal, his position drew heavy machinegun fire and he received multiple
    wounds, which let the enemy pin down the squad again. Willett struggled upright
    and engaged the enemy with his rifle so that the squad could keep moving and evacuate
    several comrades who were now wounded. Moving from position to position, he fought
    at close range until he was mortally wounded. His squad reached the company position.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Louis E. Willett (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. Private First Class Willett distinguished himself
    while serving as a rifleman in Company C, during combat operations. His squad
    was conducting a security sweep when it made contact with a large enemy force.
    The squad was immediately engaged with a heavy volume of automatic weapons fire
    and pinned to the ground. Despite the deadly fusillade, Private First Class Willett
    rose to his feet firing rapid bursts from his weapon and moved to a position from
    which he placed highly effective fire on the enemy. His action allowed the remainder
    of his squad to begin to withdraw from the superior enemy force toward the company
    perimeter. Private First Class Willett covered the squad's withdrawal, but his
    position drew heavy enemy machinegun fire, and he received multiple wounds enabling
    the enemy again to pin down the remainder of the squad. Private First Class Willett
    struggled to an upright position, and, disregarding his painful wounds, he again
    engaged the enemy with his rifle to allow his squad to continue its movement and
    to evacuate several of his comrades who were by now wounded. Moving from position
    to position, he engaged the enemy at close range until he was mortally wounded.
    By his unselfish acts of bravery, Private First Class Willett insured the withdrawal
    of his comrades to the company position, saving their lives at the cost of his
    life. Private First Class Willett's valorous actions were in keeping with the
    highest traditions of the U.S. Army and reflect great credit upon himself and
    the Armed Forces of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 2
  day: 16
  year: 1967
  title: Platoon Sergeant (then S/Sergeant.) Elmelindo R. Smith earns Medal of Honor
    (posthumous)
  body: "<p>On February 16, 1967, P/Sergeant Smith's platoon was on a reconnaissance
    patrol when it was engaged by intense machinegun fire that hemmed it in on three
    sides. A defensive perimeter was hastily set up, but the enemy added mortar and
    rocket fire and assaulted from several directions. Smith moved along the line
    under fire, positioning soldiers, distributing ammunition, and encouraging his
    men. Knocked down by a severe shoulder wound, he regained his feet, killed the
    enemy soldier, and kept moving about the perimeter.</p><p>Wounded again in the
    shoulder and stomach, he continued on his knees. Seeing the enemy massing at a
    weak point, he crawled into the open and fired into their ranks until he was struck
    by a rocket. He regained consciousness and crawled from man to man until he could
    move no farther, then stayed in the open where he could alert the perimeter to
    the approaching enemy. Smith died there. The remaining members of his platoon
    beat back the enemy assaults.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Elmelindo R. Smith (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. During a reconnaissance patrol. his platoon was suddenly
    engaged by intense machinegun fire hemming in the platoon on 3 sides. A defensive
    perimeter was hastily established, but the enemy added mortar and rocket fire
    to the deadly fusillade and assaulted the position from several directions. With
    complete disregard for his safety, P/Sergeant. Smith moved through the deadly
    fire along the defensive line, positioning soldiers, distributing ammunition and
    encouraging his men to repeal the enemy attack. Struck to the ground by enemy
    fire which caused a severe shoulder wound, he regained his feet, killed the enemy
    soldier and continued to move about the perimeter. He was again wounded in the
    shoulder and stomach but continued moving on his knees to assist in the defense.
    Noting the enemy massing at a weakened point on the perimeter, he crawled into
    the open and poured deadly fire into the enemy ranks. As he crawled on, he was
    struck by a rocket. Moments later, he regained consciousness, and drawing on his
    fast dwindling strength, continued to crawl from man to man. When he could move
    no farther, he chose to remain in the open where he could alert the perimeter
    to the approaching enemy. P/Sergeant. Smith perished, never relenting in his determined
    effort against the enemy. The valorous acts and heroic leadership of this outstanding
    soldier inspired those remaining members of his platoon to beat back the enemy
    assaults. P/Sergeant. Smith's gallant actions were in keeping with the highest
    traditions of the U.S. Army and they reflect great credit upon him and the Armed
    Forces of his country .
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 2
  day: 16
  year: 1967
  title: Private First Class James H. Monroe earns Medal of Honor (posthumous)
  body: "<p>On February 16, 1967, Private First Class Monroe's platoon was deployed
    in a night ambush when the position came under an intense and accurate grenade
    attack and one foxhole was hit immediately. Monroe moved forward through heavy
    small-arms fire to the foxhole in answer to calls for help, but found all of the
    men there dead. He crawled back through the fire toward other calls for aid and
    reached the platoon sergeant's position, where the radio operator was bleeding
    heavily from fragmentation and bullet wounds.</p><p>As Monroe began treating the
    wounded man, a live grenade fell directly in front of the position. He shouted
    a warning, pushed the radio operator and the platoon sergeant to one side, and
    lunged forward to smother the blast with his body. His action saved the lives
    of two comrades and prevented the probable injury of several others.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, James H. Monroe (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. His platoon was deployed in a night
    ambush when the position was suddenly subjected to an intense and accurate grenade
    attack, and 1 foxhole was hit immediately. Responding without hesitation to the
    calls for help from the wounded men Private First Class Monroe moved forward through
    heavy small-arms fire to the foxhole but found that all of the men had expired.
    He turned immediately and crawled back through the deadly hail of fire toward
    other calls for aid. He moved to the platoon sergeant's position where he found
    the radio operator bleeding profusely from fragmentation and bullet wounds. Ignoring
    the continuing enemy attack, Private First Class Monroe began treating the wounded
    man when he saw a live grenade fall directly in front of the position. He shouted
    a warning to all those nearby, pushed the wounded radio operator and the platoon
    sergeant to one side, and lunged forward to smother the grenade's blast with his
    body. Through his valorous actions, performed in a flash of inspired selflessness,
    Private First Class Monroe saved the lives of 2 of his comrades and prevented
    the probable injury of several others. His gallantry and intrepidity were in the
    highest traditions of the U.S. Army, and reflect great credit upon himself and
    the Armed Forces of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 2
  day: 24
  year: 1967
  title: Captain Hilliard A. Wilbanks earns Medal of Honor (posthumous)
  body: "<p>On February 24, 1967, Capt. Wilbanks, a forward air controller, was piloting
    an unarmed light aircraft on visual reconnaissance ahead of a South Vietnam Army
    Ranger Battalion when he found a well-concealed and numerically superior hostile
    force poised to ambush the advancing rangers. The Viet Cong, their position compromised,
    fired on the aircraft with everything available and then advanced on the exposed
    forward elements of the ranger force, which were pinned down. Wilbanks judged
    that close support aircraft could not arrive in time.</p><p>He took on a covering
    role himself. Flying at treetop level through the fire, he passed directly over
    the advancing enemy and inflicted many casualties by firing his rifle out of the
    side window of his aircraft. Despite increasing antiaircraft fire he made repeated
    low passes to draw fire away from the rangers, interrupting the enemy advance
    and allowing the rangers to withdraw. On his final pass to protect the withdrawing
    forces, Wilbanks was mortally wounded and his bullet-riddled aircraft crashed
    between the opposing forces.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Hilliard A. Wilbanks (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. As a forward air controller Capt.
    Wilbanks was pilot of an unarmed, light aircraft flying visual reconnaissance
    ahead of a South Vietnam Army Ranger Battalion. His intensive search revealed
    a well-concealed and numerically superior hostile force poised to ambush the advancing
    rangers. The Viet Cong, realizing that Capt. Wilbanks' discovery had compromised
    their position and ability to launch a surprise attack, immediately fired on the
    small aircraft with all available firepower. The enemy then began advancing against
    the exposed forward elements of the ranger force which were pinned down by devastating
    fire. Capt. Wilbanks recognized that close support aircraft could not arrive in
    time to enable the rangers to withstand the advancing enemy, onslaught. With full
    knowledge of the limitations of his unarmed, unarmored, light reconnaissance aircraft,
    and the great danger imposed by the enemy's vast firepower, he unhesitatingly
    assumed a covering, close support role. Flying through a hail of withering fire
    at treetop level, Capt. Wilbanks passed directly over the advancing enemy and
    inflicted many casualties by firing his rifle out of the side window of his aircraft.
    Despite increasingly intense antiaircraft fire, Capt. Wilbanks continued to completely
    disregard his own safety and made repeated low passes over the enemy to divert
    their fire away from the rangers. His daring tactics successfully interrupted
    the enemy advance, allowing the rangers to withdraw to safety from their perilous
    position. During his final courageous attack to protect the withdrawing forces,
    Capt. Wilbanks was mortally wounded and his bullet-riddled aircraft crashed between
    the opposing forces. Capt. Wilbanks' magnificent action saved numerous friendly
    personnel from certain injury or death. His unparalleled concern for his fellow
    man and his extraordinary heroism were in the highest traditions of the military
    service, and have reflected great credit upon himself and the U.S. Air Force.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 2
  day: 26
  year: 1967
  title: First Sergeant Maximo Yabes earns Medal of Honor (posthumous)
  body: "<p>On February 26, 1967, Company A was providing security for a land clearing
    operation when it came under automatic weapons and mortar fire followed by a battalion
    sized assault from three sides. The enemy penetrated the perimeter and advanced
    on the company command post bunker. When several grenades landed inside the command
    post, 1st Sergeant Yabes shouted a warning and shielded the others with his body.
    Wounded by numerous fragments, he stayed to provide covering fire while the command
    group relocated.</p><p>Yabes then moved through heavy fire to another bunker 50
    meters away, took a grenade launcher from a fallen comrade, and fired point blank
    into the attacking Viet Cong, stopping further penetration of the perimeter. He
    moved two wounded men to a safer position for treatment and resumed firing, killing
    several enemy soldiers and forcing others away from the command post. Seeing an
    enemy machinegun inside the perimeter, he dashed across the open area, assaulted
    it, killed the crew, destroyed the weapon, and fell mortally wounded. The company
    repelled the assault.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Maximo Yabes (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. 1st Sergeant. Yabes distinguished himself with Company
    A, which was providing security for a land clearing operation. Early in the morning
    the company suddenly came under intense automatic weapons and mortar fire followed
    by a battalion sized assault from 3 sides. Penetrating the defensive perimeter
    the enemy advanced on the company command post bunker. The command post received
    increasingly heavy fire and was in danger of being overwhelmed. When several enemy
    grenades landed within the command post, 1st Sergeant. Yabes shouted a warning
    and used his body as a shield to protect others in the bunker. Although painfully
    wounded by numerous grenade fragments, and despite the vicious enemy fire on the
    bunker, he remained there to provide covering fire and enable the others in the
    command group to relocate. When the command group had reached a new position,
    1st Sergeant. Yabes moved through a withering hail of enemy fire to another bunker
    50 meters away. There he secured a grenade launcher from a fallen comrade and
    fired point blank into the attacking Viet Cong stopping further penetration of
    the perimeter. Noting 2 wounded men helpless in the fire swept area, he moved
    them to a safer position where they could be given medical treatment. He resumed
    his accurate and effective fire killing several enemy soldiers and forcing others
    to withdraw from the vicinity of the command post. As the battle continued, he
    observed an enemy machinegun within the perimeter which threatened the whole position.
    On his own, he dashed across the exposed area, assaulted the machinegun, killed
    the crew, destroyed the weapon, and fell mortally wounded. 1st Sergeant. Yabes'
    valiant and selfless actions saved the lives of many of his fellow soldiers and
    inspired his comrades to effectively repel the enemy assault. His indomitable
    fighting spirit, extraordinary courage and intrepidity at the cost of his life
    are in the highest military traditions and reflect great credit upon himself and
    the Armed Forces of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 2
  day: 28
  year: 1967
  title: Platoon Sergeant Matthew Leonard earns Medal of Honor (posthumous)
  body: "<p>On February 28, 1967, P/Sergeant Leonard's platoon was attacked by a large
    enemy force using small arms, automatic weapons, and hand grenades. With the platoon
    leader and other key leaders among the first wounded, Leonard rallied his men
    to throw back the initial assaults, then organized a defensive perimeter and redistributed
    ammunition. He dragged a wounded man from outside the perimeter to safety and
    was struck by a sniper's bullet that shattered his left hand. Refusing medical
    attention, he moved from position to position directing fire as the enemy assaulted
    again.</p><p>Under cover of the main attack the enemy moved a machine gun to where
    it could sweep the whole perimeter, and the platoon machine gun there malfunctioned.
    Leonard crawled to the gun and was helping clear it when the gunner and nearby
    men were wounded by the enemy gun. He rose, charged the enemy gun, and destroyed
    its crew despite being hit several times. He propped himself against a tree and
    kept firing until he died of his wounds. The platoon held until assistance arrived.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Matthew Leonard (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. His platoon was suddenly attacked
    by a large enemy force employing small arms, automatic weapons, and hand grenades.
    Although the platoon leader and several other key leaders were among the first
    wounded, P/Sergeant. Leonard quickly rallied his men to throw back the initial
    enemy assaults. During the short pause that followed, he organized a defensive
    perimeter, redistributed ammunition, and inspired his comrades through his forceful
    leadership and words of encouragement. Noticing a wounded companion outside the
    perimeter, he dragged the man to safety but was struck by a sniper's bullet which
    shattered his left hand. Refusing medical attention and continuously exposing
    himself to the increasing fire as the enemy again assaulted the perimeter, P/Sergeant.
    Leonard moved from position to position to direct the fire of his men against
    the well camouflaged foe. Under the cover of the main attack, the enemy moved
    a machine gun into a location where it could sweep the entire perimeter. This
    threat was magnified when the platoon machine gun in this area malfunctioned.
    P/Sergeant. Leonard quickly crawled to the gun position and was helping to clear
    the malfunction when the gunner and other men in the vicinity were wounded by
    fire from the enemy machine gun. P/Sergeant. Leonard rose to his feet, charged
    the enemy gun and destroyed the hostile crew despite being hit several times by
    enemy fire. He moved to a tree, propped himself against it, and continued to engage
    the enemy until he succumbed to his many wounds. His fighting spirit, heroic leadership,
    and valiant acts inspired the remaining members of his platoon to hold back the
    enemy until assistance arrived. P/Sergeant. Leonard's profound courage and devotion
    to his men are in keeping with the highest traditions of the military service,
    and his gallant actions reflect great credit upon himself and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 2
  day: 28
  year: 1967
  title: Private First Class James Anderson, Jr. earns Medal of Honor (posthumous)
  body: "<p>On February 28, 1967, Company F was advancing through dense jungle northwest
    of Cam Lo to extract a heavily besieged reconnaissance patrol. Private First Class
    Anderson's platoon was the lead element and had advanced only about 200 meters
    when it came under intense enemy small-arms and automatic weapons fire. The platoon
    got on line as best it could in the thick terrain and returned fire. Anderson
    found himself tightly bunched with the other members of the platoon only 20 meters
    from the enemy positions, and several of the men were wounded as the fire fight
    continued.</p><p>An enemy grenade landed in the midst of the marines and rolled
    alongside Anderson's head. He reached out, grasped the grenade, pulled it to his
    chest, and curled around it as it went off. Several marines received shrapnel,
    but his body absorbed the major force of the explosion. He was killed, and his
    comrades were spared serious injury and possible death.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, James Anderson, Jr. (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. Company F was advancing in dense jungle northwest
    of Cam Lo in an effort to extract a heavily besieged reconnaissance patrol. Private
    First Class Anderson's platoon was the lead element and had advanced only about
    200 meters when they were brought under extremely intense enemy small-arms and
    automatic weapons fire. The platoon reacted swiftly, getting on line as best they
    could in the thick terrain, and began returning fire. Private First Class Anderson
    found himself tightly bunched together with the other members of the platoon only
    20 meters from the enemy positions. As the fire fight continued several of the
    men were wounded by the deadly enemy assault. Suddenly, an enemy grenade landed
    in the midst of the marines and rolled alongside Private First Class Anderson's
    head. Unhesitatingly and with complete disregard for his personal safety, he reached
    out, grasped the grenade, pulled it to his chest and curled around it as it went
    off. Although several marines received shrapnel from the grenade, his body absorbed
    the major force of the explosion. In this singularly heroic act, Private First
    Class Anderson saved his comrades from serious injury and possible death. His
    personal heroism, extraordinary valor, and inspirational supreme self-sacrifice
    reflected great credit upon himself and the Marine Corps and upheld the highest
    traditions of the U.S. Naval Service. He gallantly gave his life for his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 3
  day: 6
  year: 1967
  title: Seaman David G. Ouellet earns Medal of Honor (posthumous)
  body: "<p>On March 6, 1967, Seaman Ouellet was the forward machine gunner on River
    Patrol Boat (PBR) 124, on patrol in the early evening, when he observed suspicious
    activity near the river bank, alerted his boat captain, and recommended moving
    the boat in to investigate. As the PBR made a high-speed run along the bank, Ouellet
    spotted an enemy grenade falling toward the boat. He left the protection of his
    gun mount and ran aft the full length of the speeding boat, shouting to the crew
    to take cover.</p><p>Seeing the boat captain standing unprotected, Ouellet bounded
    onto the engine compartment cover and pushed him down to safety. In the split
    second after the grenade landed, Ouellet placed himself between it and his shipmates
    and absorbed most of the blast fragments with his body. He died, and his shipmates
    were protected from injury and death.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, David G. Ouellet (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. As the forward machine gunner on River Patrol Boat
    (PBR) 124, which was on patrol during the early evening hours, Seaman Ouellet
    observed suspicious activity near the river bank, alerted his boat captain, and
    recommended movement of the boat to the area to investigate. While the PBR was
    making a high-speed run along the river bank, Seaman Ouellet spotted an incoming
    enemy grenade falling toward the boat. He immediately left the protected position
    of his gun mount and ran aft for the full length of the speeding boat, shouting
    to his fellow crewmembers to take cover. Observing the boat captain standing unprotected
    on the boat, Seaman Ouellet bounded on to the engine compartment cover, and pushed
    the boat captain down to safety. In the split second that followed the grenade's
    landing, and in the face of certain death, Seaman Ouellet fearlessly placed himself
    between the deadly missile and his shipmates, courageously absorbing most of the
    blast fragments with his body in order to protect his shipmates from injury and
    death. His extraordinary heroism and his selfless and courageous actions on behalf
    of his comrades at the expense of his life were in the finest traditions of the
    U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 3
  day: 10
  year: 1967
  title: Major (then Capt.) Merlyn Hans Dethlefsen earns Medal of Honor
  body: "<p>On March 10, 1967, Maj. Dethlefsen was one of a flight of F-105 aircraft
    on a fire suppression mission against a key antiaircraft defensive complex containing
    surface-to-air missiles (SAM), a heavy concentration of antiaircraft artillery,
    and other automatic weapons. The complex protected an important North Vietnam
    industrial center that fighter bombers were to attack immediately after the strike
    by Dethlefsen's flight. In the initial attack the lead aircraft was crippled and
    Dethlefsen's aircraft was extensively damaged.</p><p>With the fighter bomber attack
    now depending on his ability to suppress the defensive fire, Dethlefsen pressed
    on despite the damage to his aircraft. Through continuing antiaircraft fire, surface-to-air
    missiles, and counterattacks by MIG interceptors, he flew repeated close range
    strikes with bombs and cannon fire until the SAM and antiaircraft artillery sites
    were ineffective. The fighter bombers that followed struck the industrial target
    without loss or damage to their aircraft.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Merlyn Hans Dethlefsen (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: Maj. Dethlefsen was 1 of a flight of F-105 aircraft engaged in a fire
    suppression mission designed to destroy a key antiaircraft defensive complex containing
    surface-to-air missiles (SAM), an exceptionally heavy concentration of antiaircraft
    artillery, and other automatic weapons. The defensive network was situated to
    dominate the approach and provide protection to an important North Vietnam industrial
    center that was scheduled to be attacked by fighter bombers immediately after
    the strike by Maj. Dethlefsen's flight. In the initial attack on the defensive
    complex the lead aircraft was crippled, and Maj. Dethlefsen's aircraft was extensively
    damaged by the intense enemy fire. Realizing that the success of the impending
    fighter bomber attack on the center now depended on his ability to effectively
    suppress the defensive fire, Maj. Dethlefsen ignored the enemy's overwhelming
    firepower and the damage to his aircraft and pressed his attack. Despite a continuing
    hail of antiaircraft fire, deadly surface-to-air missiles, and counterattacks
    by MIG interceptors, Maj. Dethlefsen flew repeated close range strikes to silence
    the enemy defensive positions with bombs and cannon fire. His action in rendering
    ineffective the defensive SAM and antiaircraft artillery sites enabled the ensuing
    fighter bombers to strike successfully the important industrial target without
    loss or damage to their aircraft, thereby appreciably reducing the enemy's ability
    to provide essential war material. Maj. Dethlefsen's consummate skill and selfless
    dedication to this significant mission were in keeping with the highest traditions
    of the U.S. Air Force and reflect great credit upon himself and the Armed Forces
    of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 3
  day: 12
  year: 1967
  title: First Lieutenant Stephen Edward Karopczyc earns Medal of Honor (posthumous)
  body: "<p>On March 12, 1967, 1st Lt. Karopczyc was leading the 3d Platoon, Company
    A, on a flanking maneuver against a superior enemy force when his lead element
    engaged a small enemy unit along the route. To push through to the main enemy
    force and relieve a hard-pressed friendly platoon, he ran into the open under
    fire, threw colored smoke grenades to mark the enemy for helicopter gunships,
    and marked enemy locations with bursts from his own weapon. The platoon closed
    with the main hostile force. A sniper's shot struck him above the heart; he refused
    aid and plugged the wound with his finger.</p><p>As enemy strength grew, he organized
    a defense in and around abandoned bunkers. After several hours a North Vietnamese
    soldier threw a grenade to within a few feet of Karopczyc and two wounded men.
    He leaped up and covered the grenade with a steel helmet. Fragments drove into
    his legs but the two wounded men were spared further injury. He continued directing
    his men until he died two hours later.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Stephen Edward Karopczyc (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. While leading the 3d Platoon, Company
    A, on a flanking maneuver against a superior enemy force, 1st Lt. Karopczyc observed
    that his lead element was engaged with a small enemy unit along his route. Aware
    of the importance of quickly pushing through to the main enemy force in order
    to provide relief for a hard-pressed friendly platoon, he dashed through the intense
    enemy fire into the open and hurled colored smoke grenades to designate the foe
    for attack by helicopter gunships. He moved among his men to embolden their advance,
    and he guided their attack by marking enemy locations with bursts of fire from
    his own weapon. His forceful leadership quickened the advance, forced the enemy
    to retreat, and allowed his unit to close with the main hostile force. Continuing
    the deployment of his platoon, he constantly exposed himself as he ran from man
    to man to give encouragement and to direct their efforts. A shot from an enemy
    sniper struck him above the heart but he refused aid for this serious injury,
    plugging the bleeding wound with his finger until it could be properly dressed.
    As the enemy strength mounted, he ordered his men to organize a defensive position
    in and around some abandoned bunkers where he conducted a defense against the
    increasingly strong enemy attacks. After several hours, a North Vietnamese soldier
    hurled a hand grenade to within a few feet of 1st Lt. Karopczyc and 2 other wounded
    men. Although his position protected him, he leaped up to cover the deadly grenade
    with a steel helmet. It exploded to drive fragments into 1st Lt. Karopczyc's legs,
    but his action prevented further injury to the 2 wounded men. Severely weakened
    by his multiple wounds, he continued to direct the actions of his men until he
    succumbed 2 hours later. 1st Lt. Karopczyc's heroic leadership, unyielding perseverance,
    and selfless devotion to his men were directly responsible for the successful
    and spirited action of his platoon throughout the battle and are in keeping with
    the highest traditions of the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 3
  day: 15
  year: 1967
  title: First Lieutenant Ruppert L. Sargent earns Medal of Honor (posthumous)
  body: "<p>On March 15, 1967, 1st Lt. Sargent was leading a platoon of Company B
    in investigating a reported Viet Cong meeting house and weapons cache. A tunnel
    entrance he observed was booby trapped. He tried to destroy the booby trap and
    blow the cover from the tunnel with hand grenades without success, then moved
    in with his demolition man to destroy them. This flushed a Viet Cong soldier from
    the tunnel, who was killed by the nearby platoon sergeant.</p><p>Sargent, the
    platoon sergeant, and a forward observer moved toward the tunnel entrance. As
    they approached, another Viet Cong emerged and threw two hand grenades that landed
    in the midst of the group. Sargent fired three shots at the enemy, then turned
    and threw himself over the two grenades. He was mortally wounded when they exploded;
    his two companions were lightly wounded. His act saved the platoon sergeant and
    forward observer and prevented the injury or death of several other nearby comrades.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Ruppert L. Sargent (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. While leading a platoon of Company
    B, 1st Lt. Sargent was investigating a reported Viet Cong meeting house and weapons
    cache. A tunnel entrance which 1st Lt. Sargent observed was booby trapped. He
    tried to destroy the booby trap and blow the cover from the tunnel using hand
    grenades, but this attempt was not successful. He and his demolition man moved
    in to destroy the booby trap and cover which flushed a Viet Cong soldier from
    the tunnel, who was immediately killed by the nearby platoon sergeant. 1st Lt.
    Sargent, the platoon sergeant, and a forward observer moved toward the tunnel
    entrance. As they approached, another Viet Cong emerged and threw 2 hand grenades
    that landed in the midst of the group. 1st Lt. Sargent fired 3 shots at the enemy
    then turned and unhesitatingly threw himself over the 2 grenades. He was mortally
    wounded, and his 2 companions were lightly wounded when the grenades exploded.
    By his courageous and selfless act of exceptional heroism, he saved the lives
    of the platoon sergeant and forward observer and prevented the injury or death
    of several other nearby comrades. 1st Lt. Sargent's actions were in keeping with
    the highest traditions of the military services and reflect great credit upon
    himself and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 3
  day: 20
  year: 1967
  title: Specialist Fifth Class (then Sp4c.) Charles Chris Hagemeister earns Medal
    of Honor
  body: "<p>On March 20, 1967, Sp5c. Hagemeister's platoon came under heavy attack
    from three sides by an enemy in well concealed, fortified positions supported
    by machine guns and mortars. Seeing two comrades seriously wounded in the initial
    action, Hagemeister ran through the fire to give them medical aid. Learning that
    the platoon leader and several other soldiers were also wounded, he crawled forward
    under fire to treat them.</p><p>While trying to evacuate the seriously wounded,
    he was fired on at close range by a sniper. He took a rifle from a fallen comrade,
    killed the sniper and three other enemy soldiers attempting to encircle his position,
    and silenced an enemy machine gun covering the area. Unable to move the wounded
    to a less exposed spot, and aware the enemy was trying to isolate his unit, he
    dashed through the fire to get help from a nearby platoon. He returned with help,
    placed men to cover his advance, and evacuated the wounded forward of his location,
    then moved to the other flank and evacuated more wounded men.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Charles Chris Hagemeister (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. While conducting combat operations
    against a hostile force, Sp5c. Hagemeister's platoon suddenly came under heavy
    attack from 3 sides by an enemy force occupying well concealed, fortified positions
    and supported by machine guns and mortars. Seeing 2 of his comrades seriously
    wounded in the initial action, Sp5c. Hagemeister unhesitatingly and with total
    disregard for his safety, raced through the deadly hail of enemy fire to provide
    them medical aid. Upon learning that the platoon leader and several other soldiers
    also had been wounded, Sp5c. Hagemeister continued to brave the withering enemy
    fire and crawled forward to render lifesaving treatment and to offer words of
    encouragement. Attempting to evacuate the seriously wounded soldiers, Sp5c. Hagemeister
    was taken under fire at close range by an enemy sniper. Realizing that the lives
    of his fellow soldiers depended on his actions, Sp5c. Hagemeister seized a rifle
    from a fallen comrade, killed the sniper, 3 other enemy soldiers who were attempting
    to encircle his position and silenced an enemy machine gun that covered the area
    with deadly fire. Unable to remove the wounded to a less exposed location and
    aware of the enemy's efforts to isolate his unit, he dashed through the fusillade
    of fire to secure help from a nearby platoon. Returning with help, he placed men
    in positions to cover his advance as he moved to evacuate the wounded forward
    of his location. These efforts successfully completed, he then moved to the other
    flank and evacuated additional wounded men despite the fact that his every move
    drew fire from the enemy. Sp5c. Hagemeister's repeated heroic and selfless actions
    at the risk of his life saved the lives of many of his comrades and inspired their
    actions in repelling the enemy assault. Sp5c. Hagemeister's indomitable courage
    was in the highest traditions of the U.S. Armed Forces and reflect great credit
    upon himself.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 3
  day: 21
  year: 1967
  title: Master Sergeant Charles Ernest Hosking, Jr. earns Medal of Honor (posthumous)
  body: <p>On March 21, 1967, M/Sergeant Hosking (then Sergeant 1st Class) of Detachment
    A-302, Company A, was serving as company advisor in the III Corps Civilian Irregular
    Defense Group Reaction Battalion during combat operations in Don Luan District.
    A Viet Cong suspect had been apprehended and identified as a Viet Cong sniper.
    While Hosking was preparing the prisoner for movement back to the base camp, the
    man grabbed a hand grenade from Hosking's belt, armed it, and ran toward the company
    command group, two Americans and two Vietnamese standing a few feet away.</p><p>Hosking
    leaped onto the Viet Cong's back, grasped him in a "Bear Hug" that forced the
    grenade against the man's chest, wrestled him to the ground, and covered him with
    his own body until the grenade detonated. The blast killed Hosking and the Viet
    Cong instantly. The other members of the command group were saved from death or
    serious injury.</p>
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Charles Ernest Hosking, Jr. (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. M/Sergeant. Hosking (then Sergeant.
    1st Class.), Detachment A-302, Company A, greatly distinguished himself while
    serving as company advisor in the III Corps Civilian Irregular Defense Group Reaction
    Battalion during combat operations in Don Luan District. A Viet Cong suspect was
    apprehended and subsequently identified as a Viet Cong sniper. While M/Sergeant.
    Hosking was preparing the enemy for movement back to the base camp, the prisoner
    suddenly grabbed a hand grenade from M/Sergeant. Hosking's belt, armed the grenade,
    and started running towards the company command group which consisted of 2 Americans
    and 2 Vietnamese who were standing a few feet away. Instantly realizing that the
    enemy intended to kill the other men, M/Sergeant. Hosking immediately leaped upon
    the Viet Cong's back. With utter disregard for his personal safety, he grasped
    the Viet Cong in a "Bear Hug" forcing the grenade against the enemy soldier's
    chest. He then wrestled the Viet Cong to the ground and covered the enemy's body
    with his body until the grenade detonated. The blast instantly killed both M/Sergeant.
    Hosking and the Viet Cong. By absorbing the full force of the exploding grenade
    with his body and that of the enemy, he saved the other members of his command
    group from death or serious injury. M/Sergeant. Hosking's risk of his life above
    and beyond the call of duty are in the highest tradition of the U.S. Army and
    reflect great credit upon himself and the Armed Forces of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 3
  day: 22
  year: 1967
  title: First Sergeant David H. McNerney earns Medal of Honor
  body: "<p>On March 22, 1967, 1st Sergeant McNerney's unit was attacked by a North
    Vietnamese battalion near polei Doc. Running to the area of heaviest contact,
    he killed several enemy at close range and was blown from his feet and injured
    by a grenade. He then destroyed a machinegun position that had pinned down five
    comrades beyond the defensive line. When his commander and artillery forward observer
    were killed, he took command of the company and adjusted artillery fire to within
    20 meters of the position.</p><p>When the smoke grenades ran out, he stood exposed
    in a clearing until friendly aircraft spotted the position, then climbed a tree
    and tied an identification panel to its highest branches. As the assaults slackened
    he began clearing a landing zone for the wounded, crawling outside the perimeter
    under fire to collect explosives from abandoned rucksacks. Refusing medical evacuation,
    McNerney remained with his unit until the next day, when a new commander arrived.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, David H. McNerney (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: 1st Sergeant. McNerney distinguished himself when his unit was attacked
    by a North Vietnamese battalion near polei Doc. Running through the hail of enemy
    fire to the area of heaviest contact, he was assisting in the development of a
    defensive perimeter when he encountered several enemy at close range. He killed
    the enemy but was painfully injured when blown from his feet by a grenade. In
    spite of this injury, he assaulted and destroyed an enemy machinegun position
    that had pinned down 5 of his comrades beyond the defensive line. Upon learning
    his commander and artillery forward observer had been killed, he assumed command
    of the company. He adjusted artillery fire to within 20 meters of the position
    in a daring measure to repulse ??enemy assaults. When the smoke grenades used
    to mark the position were gone, he moved into a nearby clearing to designate the
    location to friendly aircraft. In spite of enemy fire he remained exposed until
    he was certain the position was spotted and then climbed into a tree and tied
    the identification panel to its highest branches. Then he moved among his men
    readjusting their position, encouraging the defenders and checking the wounded.
    As the hostile assaults slackened, he began clearing a helicopter landing site
    to evacuate the wounded. When explosives were needed to remove large trees, he
    crawled outside the relative safety of his perimeter to collect demolition material
    from abandoned rucksacks. Moving through a fusillade of fire he returned with
    the explosives that were vital to the clearing of the landing zone. Disregarding
    the pain of his injury and refusing medical evacuation 1st Sergeant. McNerney
    remained with his unit until the next day when the new commander arrived. First
    Sergeant. McNerney's outstanding heroism and leadership were inspirational to
    his comrades. His actions were in keeping with the highest traditions of the U.S.
    Army and reflect great credit upon himself and the Armed Forces of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 3
  day: 24
  year: 1967
  title: Sergeant Walter K. Singleton earns Medal of Honor (posthumous)
  body: "<p>On March 24, 1967, Sergeant Singleton's company was conducting combat
    operations when its lead platoon received intense small arms, automatic weapons,
    rocket, and mortar fire from a well entrenched enemy force. As the company fought
    forward, the heavy fire caused numerous casualties. Singleton left his relatively
    safe position in the rear of the advance and made numerous trips through the enemy
    killing zone to move the injured men out of the danger area.</p><p>Noting that
    much of the enemy fire came from a hedgerow, he seized a machinegun and assaulted
    it, firing as he advanced, and forced his way through the hedgerow directly into
    the enemy strong point. He was mortally wounded, but his attack killed eight of
    the enemy and drove the rest from the hedgerow, disorganizing the enemy defense.
    The citation credits him with saving the lives of many of his comrades.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Walter K. Singleton (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. Sergeant. Singleton's company was conducting combat
    operations when the lead platoon received intense small arms, automatic weapons,
    rocket, and mortar fire from a well entrenched enemy force. As the company fought
    its way forward, the extremely heavy enemy fire caused numerous friendly casualties.
    Sensing the need for early treatment of the wounded, Sergeant. Singleton quickly
    moved from his relatively safe position in the rear of the foremost point of the
    advance and made numerous trips through the enemy killing zone to move the injured
    men out of the danger area. Noting that a large part of the enemy fire was coming
    from a hedgerow, he seized a machinegun and assaulted the key enemy location,
    delivering devastating fire as he advanced. He forced his way through the hedgerow
    directly into the enemy strong point. Although he was mortally wounded, his fearless
    attack killed 8 of the enemy and drove the remainder from the hedgerow. Sergeant.
    Singleton's bold actions completely disorganized the enemy defense and saved the
    lives of many of his comrades. His daring initiative selfless devotion to duty
    and indomitable fighting spirit reflected great credit upon himself and the Marine
    Corps, and his performance upheld the highest traditions of the U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 3
  day: 26
  year: 1967
  title: Private First Class Douglas E. Dickey earns Medal of Honor (posthumous)
  body: "<p>On March 26, 1967, during Operation Beacon Hill 1, the 2d Platoon was
    in a close-range fight with the Viet Cong in dense jungle foliage. Private First
    Class Dickey had come forward to replace a radio operator who had been wounded
    and was being treated by a medical corpsman. An enemy grenade landed in the midst
    of a group of marines that included the immobilized radio operator.</p><p>Knowing
    what the result would be, Dickey threw himself on the grenade and absorbed the
    full force of the explosion with his body. He was killed, and a number of his
    comrades were spared certain injury and possible death.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Douglas E. Dickey (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. While participating in Operation Beacon Hill 1, the
    2d Platoon was engaged in a fierce battle with the Viet Cong at close range in
    dense jungle foliage. Private First Class Dickey had come forward to replace a
    radio operator who had been wounded in this intense action and was being treated
    by a medical corpsman. Suddenly an enemy grenade landed in the midst of a group
    of marines, which included the wounded radio operator who was immobilized. Fully
    realizing the inevitable result of his actions, Private First Class Dickey, in
    a final valiant act, quickly and unhesitatingly threw himself upon the deadly
    grenade, absorbing with his body the full and complete force of the explosion.
    Private First Class Dickey's personal heroism, extraordinary valor and selfless
    courage saved a number of his comrades from certain injury and possible death
    at the cost of his life. His actions reflected great credit upon himself, the
    Marine Corps and the U.S. Naval Service. He gallantly gave his life for his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 3
  day: 30
  year: 1967
  title: Second Lieutenant John P. Bobo earns Medal of Honor (posthumous)
  body: "<p>On March 30, 1967, Company 1 was establishing night ambush sites when
    the command group was attacked by a reinforced North Vietnamese company supported
    by heavy automatic weapons and mortar fire. 2d Lt. Bobo organized a hasty defense
    and moved from position to position encouraging the outnumbered marines. Recovering
    a rocket launcher from among the casualties, he organized a new launcher team
    and directed its fire into the enemy machine gun positions.</p><p>When an exploding
    mortar round severed Bobo's right leg below the knee, he refused evacuation and
    insisted on being placed in a firing position to cover the command group's move
    to a better location. With a web belt around his leg as a tourniquet and the leg
    jammed into the dirt to slow the bleeding, he fired into the ranks of the enemy
    attempting to overrun the marines. He was mortally wounded while firing into the
    main point of the attack. His stand let the command group reach a protected position
    from which it repulsed the assault.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, John P. Bobo (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. Company 1 was establishing night ambush sites when
    the command group was attacked by a reinforced North Vietnamese company supported
    by heavy automatic weapons and mortar fire. 2d Lt. Bobo immediately organized
    a hasty defense and moved from position to position encouraging the outnumbered
    marines despite the murderous enemy fire. Recovering a rocket launcher from among
    the friendly casualties, he organized a new launcher team and directed its fire
    into the enemy machine gun positions. When an exploding enemy mortar round severed
    2d Lt. Bobo's right leg below the knee, he refused to be evacuated and insisted
    upon being placed in a firing position to cover the movement of the command group
    to a better location. With a web belt around his leg serving as a tourniquet and
    with his leg jammed into the dirt to curtain the bleeding, he remained in this
    position and delivered devastating fire into the ranks of the enemy attempting
    to overrun the marines. 2d Lt. Bobo was mortally wounded while firing his weapon
    into the main point of the enemy attack but his valiant spirit inspired his men
    to heroic efforts, and his tenacious stand enabled the command group to gain a
    protective position where it repulsed the enemy onslaught. 2d Lt. Bobo's superb
    leadership, dauntless courage, and bold initiative reflected great credit upon
    himself and upheld the highest traditions of the Marine Corps and the U.S. Naval
    Service. He gallantly gave his life for his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 4
  day: 8
  year: 1967
  title: Specialist Fourth Class Don Leslie Michael earns Medal of Honor (posthumous)
  body: "<p>On April 8, 1967, Sp4c. Michael of Company C was part of a platoon moving
    through an area of suspected enemy activity. While the rest of the platoon stopped
    to provide security, his squad moved forward about 125 meters and encountered
    a single Viet Cong soldier. When the squad's machine gunner fired on him, other
    Viet Cong opened fire with automatic weapons from a well-concealed bunker to the
    squad's right front, pinning down the whole squad.</p><p>Michael exposed himself
    to throw two grenades, which failed to eliminate the position. From the left flank
    he worked forward to within 20 meters of the bunkers and threw two more grenades,
    which failed to detonate. He went back to friendly positions for more grenades
    and again moved toward the bunker, now under friendly artillery fire. An enemy
    soldier attacked him from concealment; Michael killed him with his rifle and,
    through the enemy fire and exploding artillery, destroyed the enemy positions.
    He pursued the retreating remnants, and when his comrades reached him he had been
    mortally wounded.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Don Leslie Michael (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. Sp4c. Michael, U.S. Army, distinguished himself while
    serving with Company C. Sp4c. Michael was part of a platoon which was moving through
    an area of suspected enemy activity. While the rest of the platoon stopped to
    provide security, the squad to which Sp4c. Michael was assigned moved forward
    to investigate signs of recent enemy activity. After moving approximately 125
    meters, the squad encountered a single Viet Cong soldier. When he was fired upon
    by the squad's machine gunner, other Viet Cong opened fire with automatic weapons
    from a well-concealed bunker to the squad's right front. The volume of enemy fire
    was so withering as to pin down the entire squad and halt all forward movement.
    Realizing the gravity of the situation, Sp4c. Michael exposed himself to throw
    2 grenades, but failed to eliminate the enemy position. From his position on the
    left flank, Sp4c. Michael maneuvered forward with 2 more grenades until he was
    within 20 meters of the enemy bunkers, when he again exposed himself to throw
    2 grenades, which failed to detonate. Undaunted, Sp4c. Michael made his way back
    to the friendly positions to obtain more grenades. With 2 grenades in hand, he
    again started his perilous move towards the enemy bunker, which by this time was
    under intense artillery fire from friendly positions. As he neared the bunker,
    an enemy soldier attacked him from a concealed position. Sp4c. Michael killed
    him with his rifle and, in spite of the enemy fire and the exploding artillery
    rounds, was successful in destroying the enemy positions. Sp4c. Michael took up
    pursuit of the remnants of the retreating enemy. When his comrades reached Sp4c.
    Michael, he had been mortally wounded. His inspiring display of determination
    and courage saved the lives of many of his comrades and successfully eliminated
    a destructive enemy force. Sp4c. Michael's actions were in keeping with the highest
    traditions of the military service and reflect the utmost credit upon himself
    and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 4
  day: 16
  year: 1967
  title: Specialist Fourth Class George Alan Ingalls earns Medal of Honor (posthumous)
  body: "<p>On April 16, 1967, Sp4c. Ingalls of Company A accompanied his squad on
    a night ambush mission. Shortly after the ambush was set, an enemy soldier entered
    the killing zone and was shot when he tried to evade capture. Expecting more enemy
    soldiers, the squad kept the ambush in place. Two quiet hours passed, then a hand
    grenade was thrown from the dense undergrowth nearby into the center of the squad's
    position. It did not explode, but a second grenade landed directly between Ingalls
    and a nearby comrade.</p><p>Although he could have jumped to safety, Ingalls threw
    himself on the grenade and absorbed its full blast. He was mortally wounded, and
    the remaining members of his squad survived.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, George Alan Ingalls (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sp4c. Ingalls, a member of Company
    A, accompanied his squad on a night ambush mission. Shortly after the ambush was
    established, an enemy soldier entered the killing zone and was shot when he tried
    to evade capture. Other enemy soldiers were expected to enter the area, and the
    ambush was maintained in the same location. Two quiet hours passed without incident,
    then suddenly a hand grenade was thrown from the nearby dense undergrowth into
    the center of the squad's position. The grenade did not explode, but shortly thereafter
    a second grenade landed directly between Sp4c. Ingalls and a nearby comrade. Although
    he could have jumped to a safe position, Sp4c. Ingalls, in a spontaneous act of
    great courage, threw himself on the grenade and absorbed its full blast. The explosion
    mortally wounded Sp4c. Ingalls, but his heroic action saved the lives of the remaining
    members of his squad. His gallantry and selfless devotion to his comrades are
    in keeping with the highest traditions of the military service and reflects great
    credit upon Sp4c. Ingalls, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 4
  day: 19
  year: 1967
  title: Lieutenant Colonel (then Maj.) Leo K. Thorsness earns Medal of Honor
  body: "<p>On April 19, 1967, Lt. Col. Thorsness was piloting an F-105 on a surface-to-air
    missile suppression mission over North Vietnam. He and his wingman silenced one
    missile site with air-to-ground missiles and destroyed a second with bombs. In
    the second attack his wingman was shot down and its two crewmembers abandoned
    the aircraft. Thorsness circled the parachutes to keep the crew in sight and relay
    their position to the Search and Rescue Center. When a MIG-17 appeared, he attacked
    and destroyed it, then left to find a tanker because his fuel was low.</p><p>Told
    that two helicopters were orbiting over the downed crew and that hostile MIGs
    in the area threatened them, Thorsness returned alone through missile and antiaircraft
    defenses despite his fuel state. He spotted four MIG-17s, attacked, damaged one,
    and drove the others away from the rescue scene. When another aircraft in the
    area was critically low on fuel, Thorsness, himself critically short, recovered
    at a forward operating base so the other aircraft could reach a tanker and refuel
    safely.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Leo K. Thorsness (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. As pilot of an F- 105 aircraft, Lt.
    Col. Thorsness was on a surface-to-air missile suppression mission over North
    Vietnam. Lt. Col. Thorsness and his wingman attacked and silenced a surface-to-air
    missile site with air-to-ground missiles, and then destroyed a second surface-to-air
    missile site with bombs. In tile attack on the second missile site, Lt. Col. Thorsness'
    wingman was shot down by intensive antiaircraft fire, and the 2 crewmembers abandoned
    their aircraft. Lt. Col. Thorsness circled the descending parachutes to keep the
    crewmembers in sight and relay their position to the Search and Rescue Center.
    During this maneuver, a MIG-17 was sighted in the area. Lt. Col. Thorsness immediately
    initiated an attack and destroyed the MIG. Because his aircraft was low on fuel,
    he was forced to depart the area in search of a tanker. Upon being advised that
    2 helicopters were orbiting over the downed crew's position and that there were
    hostile MlGs in the area posing a serious threat to the helicopters, Lt. Col.
    Thorsness, despite his low fuel condition, decided to return alone through a hostile
    environment of surface-to-air missile and antiaircraft defenses to the downed
    crew's position. As he approached the area, he spotted 4 MIG-17 aircraft and immediately
    initiated an attack on the MlGs, damaging 1 and driving the others away from the
    rescue scene. When it became apparent that an aircraft in the area was critically
    low on fuel and the crew would have to abandon the aircraft unless they could
    reach a tanker, Lt. Col. Thorsness, although critically short on fuel himself,
    helped to avert further possible loss of life and a friendly aircraft by recovering
    at a forward operating base, thus allowing the aircraft in emergency fuel condition
    to refuel safely. Lt. Col. Thorsness' extraordinary heroism, self-sacrifice, and
    personal bravery involving conspicuous risk of life were in the highest traditions
    of the military service, and have reflected great credit upon himself and the
    U.S. Air Force.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 4
  day: 21
  year: 1967
  title: Private First Class Gary W. Martini earns Medal of Honor (posthumous)
  body: "<p>On April 21, 1967, during Operation UNION, elements of Company F conducting
    offensive operations at Binh Son encountered a firmly entrenched enemy force.
    Private First Class Martini's platoon assaulted across an open rice paddy to within
    20 meters of the enemy trench line, where enemy fire killed 14 marines and wounded
    18, pinning the rest behind a low paddy dike. Martini crawled over the dike to
    within 15 meters of the enemy and threw hand grenades, killing several, then crawled
    back to his platoon in a trench line.</p><p>Seeing wounded comrades lying in the
    paddy, and knowing one man had been killed trying to help them, Martini ran out
    and dragged a comrade back. Seriously wounded in that rescue, he went out again
    for a man lying 20 meters from the enemy trench. Mortally wounded as he reached
    him, he dragged the marine toward the platoon, told men who tried to come out
    for him to stay under cover, and moved his comrade to where he could be pulled
    to safety before he died.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Gary W. Martini (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. On 21 April 1967, during Operation UNION* elements
    of Company F, conducting offensive operations at Binh Son, encountered a firmly
    entrenched enemy force and immediately deployed to engage them. The marines in
    Private First Class Martini's platoon assaulted across an open rice paddy to within
    20 meters of the enemy trench line where they were suddenly struck by hand grenades,
    intense small arms, automatic weapons, and mortar fire. The enemy onslaught killed
    14 and wounded 18 marines, pinning the remainder of the platoon down behind a
    low paddy dike. In the face of imminent danger, Private First Class Martini immediately
    crawled over the dike to a forward open area within 15 meters of the enemy position
    where, continuously exposed to the hostile fire, he hurled hand grenades, killing
    several of the enemy. Crawling back through the intense fire, he rejoined his
    platoon which had moved to the relative safety of a trench line. From this position
    he observed several of his wounded comrades Lying helpless in the fire-swept paddy.
    Although he knew that 1 man had been killed attempting to assist the wounded,
    Private First Class Martini raced through the open area and dragged a comrade
    back to a friendly position. In spite of a serious wound received during this
    first daring rescue, he again braved the unrelenting fury of the enemy fire to
    aid another companion Lying wounded only 20 meters in front of the enemy trench
    line. As he reached the fallen marine, he received a mortal wound, but disregarding
    his own condition, he began to drag the marine toward his platoon's position.
    Observing men from his unit attempting to leave the security of their position
    to aid him, concerned only for their safety, he called to them to remain under
    cover, and through a final supreme effort, moved his injured comrade to where
    he could be pulled to safety, before he fell, succumbing to his wounds. Stouthearted
    and indomitable, Private First Class Martini unhesitatingly yielded his life to
    save 2 of his comrades and insure the safety of the remainder of his platoon.
    His outstanding courage, valiant fighting spirit and selfless devotion to duty
    reflected the highest credit upon himself, the Marine Corps, and the U.S. Naval
    Service. He gallantly gave his life for his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:21:51Z'
- month: 4
  day: 25
  year: 1967
  title: Staff Sergeant (then Sp4c.) Kenneth E. Stumpf earns Medal of Honor
  body: "<p>On April 25, 1967, Staff Sergeant Kenneth E. Stumpf was leading a squad
    of the 3d Platoon, Company C, on a search and destroy mission when the company
    approached a village and met a North Vietnamese rifle company in a well fortified
    bunker complex. Three men of his squad fell wounded in front of a machinegun emplacement,
    and the enemy fire kept the unit from reaching them. Stumpf left his secure position
    in a deep trench, ran through the incoming rounds, and carried one man back. He
    went out twice more under automatic weapons and machinegun fire and brought back
    the other two.</p><p>He then led his squad against the bunkers and destroyed two.
    A third, in front of the advancing platoon, remained. Carrying extra grenades,
    Stumpf crossed open ground under fire and threw one through the aperture; the
    occupants threw it back. He pulled the pins on two more, held them for a few seconds,
    and threw them in, destroying the emplacement. With that position gone, the unit
    assaulted and overran the enemy.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Kenneth E. Stumpf (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. S/Sergeant. Stumpf distinguished himself
    while serving as a squad leader of the 3d Platoon, Company C, on a search and
    destroy mission. As S/Sergeant. Stumpf's company approached a village, it encountered
    a North Vietnamese rifle company occupying a well fortified bunker complex. During
    the initial contact, 3 men from his squad fell wounded in front of a hostile machinegun
    emplacement. The enemy's heavy volume of fire prevented the unit from moving to
    the aid of the injured men, but S/Sergeant. Stumpf left his secure position in
    a deep trench and ran through the barrage of incoming rounds to reach his wounded
    comrades. He picked up 1 of the men and carried him back to the safety of the
    trench. Twice more S/Sergeant. Stumpf dashed forward while the enemy turned automatic
    weapons and machineguns upon him, yet he managed to rescue the remaining 2 wounded
    squad members. He then organized his squad and led an assault against several
    enemy bunkers from which continuously heavy fire was being received He and his
    squad successfully eliminated 2 of the bunker positions, but one to the front
    of the advancing platoon remained a serious threat. Arming himself with extra
    hand grenades, S/Sergeant. Stumpf ran over open ground, through a volley of fire
    directed at him by a determined enemy, toward the machinegun position. As he reached
    the bunker, he threw a hand grenade through the aperture. It was immediately returned
    by the occupants, forcing S/Sergeant. Stumpf to take cover. Undaunted, he pulled
    the pins on 2 more grenades, held them for a few seconds after activation, then
    hurled them into the position, this time successfully destroying the emplacement.
    With the elimination of this key position, his unit was able to assault and overrun
    the enemy. S/Sergeant. Stumpf's relentless spirit of aggressiveness, intrepidity,
    and ultimate concern for the lives of his men, are in the highest traditions of
    the military service and reflect great credit upon himself and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 4
  day: 26
  year: 1967
  title: Captain Michael J. Estocin earns Medal of Honor (posthumous)
  body: "<p>On April 26, 1967, Captain Michael J. Estocin, a pilot in Attack Squadron
    192 embarked in USS Ticonderoga (CVA-14), led an attack on a threatening surface-to-air
    missile site during a coordinated strike against the fuel facilities in Haiphong,
    North Vietnam. An exploding SAM seriously damaged his aircraft. He regained control
    of the burning plane and launched his SHRIKE missiles before leaving the area.</p><p>The
    citation also covers his action six days earlier, on April 20, 1967. Leading a
    three-plane group in a strike against two thermal power plants in Haiphong, he
    gave continuous warnings of SAM threats to the strike group leaders and neutralized
    three SAM sites. After an exploding missile severely damaged his aircraft, he
    reentered the target area and pressed a SHRIKE attack through intense antiaircraft
    fire. With less than five minutes of fuel remaining he left the target and refueled
    in flight for over 100 miles. Three miles aft of Ticonderoga, without fuel for
    a second approach, he left the tanker and made an arrested landing with his aircraft
    on fire.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Michael J. Estocin (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty on 20 and 26 April 1967 as a pilot in Attack Squadron
    192, embarked in USS Ticonderoga (CVA-14). Leading a 3-plane group of aircraft
    in support of a coordinated strike against two thermal power plants in Haiphong,
    North Vietnam, on 20 April 1967, Capt. Estocin provided continuous warnings to
    the strike group leaders of the surface-to-air missile (SAM) threats, and personally
    neutralized 3 SAM sites. Although his aircraft was severely damaged by an exploding
    missile, he reentered the target area and relentlessly prosecuted a SHRIKE attack
    in the face of intense antiaircraft fire. With less than 5 minutes of fuel remaining
    he departed the target area and commenced in-flight refueling which continued
    for over 100 miles. Three miles aft of Ticonderoga, and without enough fuel for
    a second approach, he disengaged from the tanker and executed a precise approach
    to a fiery arrested landing. On 26 April 1967, in support of a coordinated strike
    against the vital fuel facilities in Haiphong, he led an attack on a threatening
    SAM site, during which his aircraft was seriously damaged by an exploding SAM;
    nevertheless, he regained control of his burning aircraft and courageously launched
    his SHRIKE missiles before departing the area. By his inspiring courage and unswerving
    devotion to duty in the face of grave personal danger, Captain Estocin upheld
    the highest traditions of the U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 5
  day: 2
  year: 1967
  title: Sergeant Leonard B. Keller earns Medal of Honor
  body: "<p>On May 2, 1967, Sergeant Leonard B. Keller's unit, Company A, was sweeping
    an area where an enemy ambush had occurred earlier when it came under automatic
    weapons and small-arms fire from a number of bunkers and from snipers in nearby
    trees. Keller moved to where he could fire on one bunker and killed a Viet Cong
    who tried to escape. He and another soldier then leaped onto a dike and charged
    the bunkers. With a light machine gun, Keller suppressed the first bunker while
    his comrade threw in a grenade and killed its occupant. The two charged a second
    bunker, then a third, which held an automatic rifleman who had pinned down much
    of the platoon, killing the enemy in each. They assaulted four more bunkers under
    sniper fire and pushed into the treeline, driving the snipers away from the unit.</p><p>When
    his ammunition ran out, Keller returned to the platoon to help evacuate the wounded.
    The citation credits the two-man assault with driving an enemy platoon from a
    well prepared position and preventing further friendly casualties.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Leonard B. Keller (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sweeping through an area where an
    enemy ambush had occurred earlier, Sergeant. Keller's unit suddenly came under
    Intense automatic weapons and small-arms fire from a number of enemy bunkers and
    numerous snipers in nearby trees. Sergeant. Keller quickly moved to a position
    where he could fire at a bunker from which automatic fire was received, killing
    1 Viet Cong who attempted to escape. Leaping to the top of a dike, he and a comrade
    charged the enemy bunkers, dangerously exposing themselves to the enemy fire.
    Armed with a light machine gun, Sergeant. Keller and his comrade began a systematic
    assault on the enemy bunkers. While Sergeant. Keller neutralized the fire from
    the first bunker with his machine gun, the other soldier threw in a hand grenade
    killing its occupant. Then he and the other soldier charged a second bunker, killing
    its occupant. A third bunker contained an automatic rifleman who had pinned down
    much of the friendly platoon. Again, with utter disregard for the fire directed
    to them, the 2 men charged, killing the enemy within. Continuing their attack,
    Sergeant. Keller and his comrade assaulted 4 more bunkers, killing the enemy within.
    During their furious assault, Sergeant. Keller and his comrade had been almost
    continuously exposed to intense sniper fire as the enemy desperately sought to
    stop their attack. The ferocity of their assault had carried the soldiers beyond
    the line of bunkers into the treeline, forcing snipers to flee. The 2 men gave
    immediate chase, driving the enemy away from the friendly unit. When his ammunition
    was exhausted, Sergeant. Keller returned to the platoon to assist in the evacuation
    of the wounded. The 2-man assault had driven an enemy platoon from a well prepared
    position, accounted for numerous enemy dead, and prevented further friendly casualties.
    Sergeant. Keller's selfless heroism and indomitable fighting spirit saved the
    lives of many of his comrades and inflicted serious damage on the enemy. His acts
    were in keeping with the highest traditions of the military service and reflect
    great credit upon himself and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 5
  day: 2
  year: 1967
  title: Specialist Fourth Class Raymond R. Wright earns Medal of Honor
  body: "<p>On May 2, 1967, Specialist Fourth Class Raymond R. Wright, a rifleman
    with Company A, was on a combat patrol in an area where an enemy ambush had occurred
    earlier when his unit came under automatic weapons and small-arms fire from a
    bunker system protected by snipers in nearby trees. Wright and another soldier
    leaped onto a dike to assault the position. Wright ran to the nearest bunker and
    killed its occupant with a grenade. The two ran through fire to a second bunker;
    while his comrade covered him with a machinegun, Wright killed its occupant with
    a grenade. A third held an automatic rifleman who had pinned down much of the
    platoon; again under machinegun cover, Wright charged and killed him. The two
    knocked out four more bunkers, then advanced into the treeline, forcing the snipers
    to retreat so the unit crossed the open area without further casualty.</p><p>When
    his ammunition was exhausted, Wright returned to help evacuate the wounded. The
    citation credits the two-man assault with driving an enemy platoon from a well
    prepared position.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Raymond R. Wright (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. While serving as a rifleman with Company A, Sp4c.
    Wright distinguished himself during a combat patrol in an area where an enemy
    ambush had occurred earlier. Sp4c. Wright's unit suddenly came under intense automatic
    weapons and small-arms fire from an enemy bunker system protected by numerous
    snipers in nearby trees. Despite the heavy enemy fire, Sp4c. Wright and another
    soldier leaped to the top of a dike to assault the position. Armed with a rifle
    and several grenades, he and his comrade exposed themselves to intense fire from
    the bunkers as they charged the nearest one. Sp4c. Wright raced to the bunker,
    threw in a grenade, killing its occupant. The 2 soldiers then ran through a hail
    of fire to the second bunker. While his comrade covered him with his machinegun,
    Sp4c. Wright charged the bunker and succeeded in killing its occupant with a grenade.
    A third bunker contained an automatic rifleman who had pinned down much of the
    friendly platoon. While his comrade again covered him with machinegun fire, Sp4c.
    Wright charged in and killed the enemy rifleman with a grenade. The 2 soldiers
    worked their way through the remaining bunkers, knocking out 4 of them. Throughout
    their furious assault, Sp4c. Wright and his comrade had been almost continuously
    exposed to intense sniper fire from the treeline as the enemy desperately sought
    to stop their attack. Overcoming stubborn resistance from the bunker system, the
    men advanced into the treeline forcing the snipers to retreat, giving immediate
    chase, and driving the enemy away from the friendly unit so that it advanced across
    the open area without further casualty. When his ammunition was exhausted, Sp4c.
    Wright returned to his unit to assist in the evacuation of the wounded. This 2-man
    assault had driven an enemy platoon from a well prepared position, accounted for
    numerous enemy casualties, and averted further friendly casualties. Sp4c. Wright's
    extraordinary heroism, courage, and indomitable fighting spirit saved the lives
    of many of his comrades and inflicted serious damage on the enemy. His acts were
    in keeping with the highest traditions of the military service and reflect great
    credit upon himself and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 5
  day: 15
  year: 1967
  title: Major Charles Kettles earns Medal of Honor
  body: "<p>On May 15, 1967, Major Charles Kettles, Flight Commander of the 176th
    Aviation Company near Duc Pho, volunteered to lead six UH-1D helicopters carrying
    reinforcements to an airborne infantry unit that had taken casualties in a firefight
    and to evacuate its wounded. Enemy fire raked the landing zone and damaged the
    helicopters, but Kettles refused to depart until all were loaded. He returned
    with more reinforcements; his gunner was seriously wounded and his aircraft damaged,
    and he flew it back to base leaking fuel.</p><p>Later that day the Infantry Battalion
    Commander asked for emergency extraction of the remaining 40 troops, including
    four of Kettles' men whose helicopter had been destroyed. Kettles led six evacuation
    helicopters into the landing zone a third time. Once airborne, he was told eight
    troops had been left behind. He passed the lead to another aircraft and went back
    alone, without gunship or artillery support. A mortar round shattered both windshields
    and the chin bubble and small arms fire raked the aircraft, but he held it until
    the eight soldiers boarded and flew them to safety.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Charles Kettles (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: 'For conspicuous gallantry and intrepidity at the risk of his life
    above and beyond the call of duty: Major Charles S. Kettles distinguished himself
    by conspicuous gallantry and intrepidity while serving as Flight Commander, 176th
    Aviation Company (Airmobile) (Light), 14th Combat Aviation Battalion, Americal
    Division near Duc Pho, Republic of Vietnam. On 15 May 1967, Major Kettles, upon
    learning that an airborne infantry unit had suffered casualties during an intense
    firefight with the enemy, immediately volunteered to lead a flight of six UH-1D
    helicopters to carry reinforcements to the embattled force and to evacuate wounded
    personnel. Enemy small arms, automatic weapons, and mortar fire raked the landing
    zone, inflicting heavy damage to the helicopters; however, Major Kettles refused
    to depart until all helicopters were loaded to capacity. He then returned to the
    battlefield, with full knowledge of the intense enemy fire awaiting his arrival,
    to bring more reinforcements, landing in the midst of enemy mortar and automatic
    weapons fire that seriously wounded his gunner and severely damaged his aircraft.
    Upon departing, Major Kettles was advised by another helicopter crew that he had
    fuel streaming out of his aircraft. Despite the risk posed by the leaking fuel,
    he nursed the damaged aircraft back to base. Later that day, the Infantry Battalion
    Commander requested immediate, emergency extraction of the remaining 40 troops,
    including four members of Major Kettles’ unit who were stranded when their helicopter
    was destroyed by enemy fire. With only one flyable UH-1 helicopter remaining,
    Major Kettles volunteered to return to the deadly landing zone for a third time,
    leading a flight of six evacuation helicopters, five of which were from the 161st
    Aviation Company. During the extraction, Major Kettles was informed by the last
    helicopter that all personnel were onboard, and departed the landing zone accordingly.
    Army gunships supporting the evacuation also departed the area. Once airborne,
    Major Kettles was advised that eight troops had been unable to reach the evacuation
    helicopters due to the intense enemy fire. With complete disregard for his own
    safety, Major Kettles passed the lead to another helicopter and returned to the
    landing zone to rescue the remaining troops. Without gunship, artillery, or tactical
    aircraft support, the enemy concentrated all firepower on his lone aircraft, which
    was immediately damaged by a mortar round that shattered both front windshields
    and the chin bubble and was further raked by small arms and machine gun fire.
    Despite the intense enemy fire, Major Kettles maintained control of the aircraft
    and situation, allowing time for the remaining eight soldiers to board the aircraft.
    In spite of the severe damage to his helicopter, Major Kettles once more skillfully
    guided his heavily damaged aircraft to safety. Without his courageous actions
    and superior flying skills, the last group of soldiers and his crew would never
    have made it off the battlefield. Major Kettles'' selfless acts of repeated valor
    and determination are in keeping with the highest traditions of military service
    and reflect great credit upon himself and the United States Army.'
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 5
  day: 18
  year: 1967
  title: Platoon Sergeant Bruce Alan Grandstaff earns Medal of Honor (posthumous)
  body: "<p>On May 18, 1967, Platoon Sergeant Bruce Alan Grandstaff was leading the
    Weapons Platoon, Company B, on a reconnaissance mission near the Cambodian border
    when heavy small arms and automatic weapons fire struck the platoon from three
    sides. He saw several of his men down, ran 30 meters through the fire to help
    them, and could save only one. Unable to maneuver, he adjusted artillery to within
    45 meters of his position. When gunships arrived he crawled outside the perimeter
    to mark it with smoke, but the smoke did not penetrate the foliage. Wounded in
    the leg, he refused aid and brought the artillery closer. He then fired tracer
    ammunition through the canopy to mark the position for the gunships and was wounded
    in the other leg.</p><p>Bleeding heavily, he crawled to within 10 meters of an
    enemy machine gun and destroyed it with grenades, taking more wounds. As his position
    was overrun, he called artillery directly onto his own location and fought until
    an enemy rocket killed him. Every man in the platoon was a casualty.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Bruce Alan Grandstaff (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. P/Sergeant. Grandstaff distinguished
    himself while leading the Weapons Platoon, Company B, on a reconnaissance mission
    near the Cambodian border. His platoon was advancing through intermittent enemy
    contact when it was struck by heavy small arms and automatic weapons fire from
    3 sides. As he established a defensive perimeter, P/Sergeant. Grandstaff noted
    that several of his men had been struck down. He raced 30 meters through the intense
    fire to aid them but could only save 1. Denied freedom to maneuver his unit by
    the intensity of the enemy onslaught, he adjusted artillery to within 45 meters
    of his position. When helicopter gunships arrived, he crawled outside the defensive
    position to mark the location with smoke grenades. Realizing his first marker
    was probably ineffective, he crawled to another location and threw his last smoke
    grenade but the smoke did not penetrate the jungle foliage. Seriously wounded
    in the leg during this effort he returned to his radio and, refusing medical aid,
    adjusted the artillery even closer as the enemy advanced on his position. Recognizing
    the need for additional firepower, he again braved the enemy fusillade, crawled
    to the edge of his position and fired several magazines of tracer ammunition through
    the jungle canopy. He succeeded in designating the location to the gunships but
    this action again drew the enemy fire and he was wounded in the other leg. Now
    enduring intense pain and bleeding profusely, he crawled to within 10 meters of
    an enemy machine gun which had caused many casualties among his men. He destroyed
    the position with hand grenades but received additional wounds. Rallying his remaining
    men to withstand the enemy assaults, he realized his position was being overrun
    and asked for artillery directly on his location. He fought until mortally wounded
    by an enemy rocket. Although every man in the platoon was a casualty, survivors
    attest to the indomitable spirit and exceptional courage of this outstanding combat
    leader who inspired his men to fight courageously against overwhelming odds and
    cost the enemy heavy casualties. P/Sergeant. Grandstaff's selfless gallantry,
    above and beyond the call of duty, are in the highest traditions of the U.S. Army
    and reflect great credit upon himself and the Armed Forces of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 5
  day: 18
  year: 1967
  title: Specialist Fourth Class Dale Eugene Wayrynen earns Medal of Honor (posthumous)
  body: "<p>On May 18, 1967, Specialist Fourth Class Dale Eugene Wayrynen's platoon
    of Company B was helping with the night evacuation of wounded from an earlier
    contact near Duc Pho when the lead man met a Viet Cong soldier face to face on
    the trail. The lead man's shouted warning also alerted the enemy, who swept the
    area with automatic weapons fire from a bunker close to the trail and threw grenades
    from another fortified position nearby. The lead man was wounded and knocked down.
    Wayrynen, second in the formation, leaped past him, killed another enemy soldier
    who appeared on the trail, and dragged the wounded man back to where the point
    squad had taken cover.</p><p>A live enemy grenade then landed among the tightly
    grouped men. Wayrynen shouted a warning, pushed one soldier out of the way, and
    threw himself on the grenade as it exploded. He was mortally wounded. The citation
    states that his act preserved the lives of his comrades, including his platoon
    leader nearby.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Dale Eugene Wayrynen (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sp4c. Wayrynen distinguished himself
    with Company B, during combat operations near Duc Pho. His platoon was assisting
    in the night evacuation of the wounded from an earlier enemy contact when the
    lead man of the unit met face to face with a Viet Cong soldier. The American's
    shouted warning also alerted the enemy who immediately swept the area with automatic
    weapons fire from a strongly built bunker close to the trail and threw hand grenades
    from another nearby fortified position. Almost immediately, the lead man was wounded
    and knocked from his feet. Sp4c. Wayrynen, the second man in the formation, leaped
    beyond his fallen comrade to kill another enemy soldier who appeared on the trail,
    and he dragged his injured companion back to where the point squad had taken cover.
    Suddenly, a live enemy grenade landed in the center of the tightly grouped men.
    Sp4c. Wayrynen, quickly assessing the danger to the entire squad as well as to
    his platoon leader who was nearby, shouted a warning, pushed one soldier out of
    the way, and threw himself on the grenade at the moment it exploded. He was mortally
    wounded. His deep and abiding concern for his fellow soldiers was significantly
    reflected in his supreme and courageous act that preserved the lives of his comrades.
    Sp4c. Wayrynen's heroic actions are in keeping with the highest traditions of
    the service, and they reflect great credit upon himself and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 5
  day: 20
  year: 1967
  title: Private First Class Leslie Allen Bellrichard earns Medal of Honor (posthumous)
  body: "<p>On May 20, 1967, Private First Class Leslie Allen Bellrichard, a fire
    team leader with Company C, was in a foxhole on his unit's perimeter with four
    other soldiers when a massive enemy attack began. After a 30-minute mortar barrage,
    the enemy launched a strong ground assault. Bellrichard rose to face a group of
    charging soldiers and threw hand grenades into them, killing several and forcing
    the rest to withdraw. The enemy repeated the mortar and rocket bombardment, then
    charged again to overrun the position, and Bellrichard resumed throwing grenades.</p><p>As
    he was about to throw one, a mortar round exploded just in front of his position,
    knocking him into the foxhole and loosening his grip on the armed grenade. He
    threw himself on it, shielding his four comrades from the blast. Severely wounded,
    he struggled upright in the foxhole and fired his rifle at the enemy until he
    died of his wounds. The citation credits him with saving the lives of several
    comrades and contributing to the successful defense of the position.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Leslie Allen Bellrichard (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Acting as a fire team leader with
    Company C, during combat operations Private First Class Bellrichard was with 4
    fellow soldiers in a foxhole on their unit's perimeter when the position came
    under a massive enemy attack. Following a 30-minute mortar barrage, the enemy
    launched a strong ground assault. Private First Class Bellrichard rose in face
    of a group of charging enemy soldiers and threw hand grenades into their midst,
    eliminating several of the foe and forcing the remainder to withdraw. Failing
    in their initial attack, the enemy repeated the mortar and rocket bombardment
    of the friendly perimeter, then once again charged against the defenders in a
    concerted effort to overrun the position. Private First Class Bellrichard resumed
    throwing hand grenades at the onrushing attackers. As he was about to hurl a grenade,
    a mortar round exploded just in front of his position, knocking him into the foxhole
    and causing him to lose his grip on the already armed grenade. Recovering instantly,
    Private First Class Bellrichard recognized the threat to the lives of his 4 comrades
    and threw himself upon the grenade, shielding his companions from the blast that
    followed. Although severely wounded, Private First Class Bellrichard struggled
    into an upright position in the foxhole and fired his rifle at the enemy until
    he succumbed to his wounds. His selfless heroism contributed greatly to the successful
    defense of the position, and he was directly responsible for saving the lives
    of several of his comrades. His acts are in keeping with the highest traditions
    of the military service and reflect great credit upon himself and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 5
  day: 20
  year: 1967
  title: Staff Sergeant Frankie Zoly Molnar earns Medal of Honor (posthumous)
  body: "<p>On May 20, 1967, Staff Sergeant Frankie Zoly Molnar was a squad leader
    with Company B when, shortly after the battalion set up its defensive perimeter,
    intense mortar fire opened a massive enemy night attack. Molnar left his sheltered
    position to check his squad's readiness and found a group of enemy soldiers closing
    on his squad area. His rifle fire killed five and drove off the rest. When the
    mortar fire stopped, the enemy attacked in a human wave with grenades, rockets,
    automatic weapons, and small arms. After helping repel the first assault, Molnar
    found his squad nearly out of ammunition and grenades and crawled through enemy
    fire to get more. He rejoined his men to beat back the renewed assault, then gave
    medical aid and helped evacuate the wounded.</p><p>As he and several men prepared
    to move a severely wounded soldier, an enemy grenade landed in the group. Molnar
    saw it first and threw himself on it, absorbing the blast. The citation credits
    his leadership as a major factor in the successful defense of the position.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Frankie Zoly Molnar (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. S/Sergeant. Molnar distinguished himself
    while serving as a squad leader with Company B, during combat operations. Shortly
    after the battalion's defensive perimeter was established, it was hit by intense
    mortar fire as the prelude to a massive enemy night attack. S/Sergeant. Molnar
    immediately left his sheltered location to insure the readiness of his squad to
    meet the attack. As he crawled through the position, he discovered a group of
    enemy soldiers closing in on his squad area. His accurate rifle fire killed 5
    of the enemy and forced the remainder to flee. When the mortar fire stopped, the
    enemy attacked in a human wave supported by grenades, rockets, automatic weapons,
    and small-arms fire. After assisting to repel the first enemy assault, S/Sergeant.
    Molnar found that his squad's ammunition and grenade supply was nearly expended.
    Again leaving the relative safety of his position, he crawled through intense
    enemy fire to secure additional ammunition and distribute it to his squad. He
    rejoined his men to beat back the renewed enemy onslaught, and he moved about
    his area providing medical aid and assisting in the evacuation of the wounded.
    With the help of several men, he was preparing to move a severely wounded soldier
    when an enemy hand grenade was thrown into the group. The first to see the grenade,
    S/Sergeant. Molnar threw himself on it and absorbed the deadly blast to save his
    comrades. His demonstrated selflessness and inspirational leadership on the battlefield
    were a major factor in the successful defense of the American position and are
    in keeping with the finest traditions of the U.S. Army. S/Sergeant. Molnar's actions
    reflect great credit upon himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 6
  day: 2
  year: 1967
  title: Captain James A. Graham earns Medal of Honor (posthumous)
  body: "<p>On June 2, 1967, during Operation Union 11, the 1st Battalion, 5th Marines,
    with Captain James A. Graham's Company F attached, attacked an enemy-occupied
    position with two companies assaulting and one in reserve. Company F, a leading
    company, was crossing a clear paddy area 1,000 meters wide when mortar and small
    arms fire inflicted many casualties. Its 2d platoon was pinned down in the open
    paddy by two concealed machine guns. Graham formed an assault unit from his small
    company headquarters and led it through the second platoon's position, forcing
    the enemy to abandon the first machine gun and allowing the wounded to be evacuated.
    His small force then held its position against the second machine gun through
    the afternoon. Graham took two minor wounds and personally accounted for an estimated
    15 enemy killed.</p><p>When each attempt to withdraw to friendly lines failed,
    Graham chose to remain with one man too badly wounded to be moved. His last radio
    transmission reported that 25 enemy soldiers were assaulting him. He died protecting
    the wounded man he would not abandon.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, James A. Graham (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. During Operation Union 11, the 1st Battalion, 5th
    Marines, consisting of Companies A and D, with Capt. Graham's company attached
    launched an attack against an enemy occupied position with 2 companies assaulting
    and 1 in reserve. Company F, a leading company, was proceeding across a clear
    paddy area 1,000 meters wide, attacking toward the assigned objective, when it
    came under fire from mortars and small arms which immediately inflicted a large
    number of casualties. Hardest hit by the enemy fire was the 2d platoon of Company
    F, which was pinned down in the open paddy area by intense fire from 2 concealed
    machine guns. Forming an assault unit from members of his small company headquarters,
    Capt. Graham boldly led a fierce assault through the second platoon's position,
    forcing the enemy to abandon the first machine gun position, thereby relieving
    some of the pressure on his second platoon, and enabling evacuation of the wounded
    to a more secure area. Resolute to silence the second machine gun, which continued
    its devastating fire, Capt. Graham's small force stood steadfast in its hard won
    enclave. Subsequently, during the afternoon's fierce fighting, he suffered 2 minor
    wounds while personally accounting for an estimated 15 enemy killed. With the
    enemy position remaining invincible upon each attempt to withdraw to friendly
    lines, and although knowing that he had no chance of survival, he chose to remain
    with 1 man who could not be moved due to the seriousness of his wounds. The last
    radio transmission from Capt. Graham reported that he was being assaulted by a
    force of 25 enemy soldiers; he died while protecting himself and the wounded man
    he chose not to abandon. Capt. Graham's actions throughout the day were a series
    of heroic achievements. His outstanding courage, superb leadership and indomitable
    fighting spirit undoubtedly saved the second platoon from annihilation and reflected
    great credit upon himself, the Marine Corps, and the U.S. Naval Service. He gallantly
    gave his life for his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 6
  day: 9
  year: 1967
  title: Captain (then Comdr.) William L. McGonagle earns Medal of Honor
  body: "<p>On June 9, 1967, Captain William L. McGonagle, commanding the Liberty
    in international waters in the Eastern Mediterranean, was severely wounded in
    the first of a series of attacks by jet fighter aircraft and motor torpedo boats
    that struck the ship without warning, inflicted many casualties among the crew,
    and caused extreme damage. McGonagle remained at his battle station on the badly
    damaged bridge, refused any treatment that would take him from his post, and continued
    to command. Under continuous fire he maneuvered the ship, directed its defense,
    supervised the control of flooding and fire, and saw to the care of the casualties.</p><p>After
    the attack, in great pain and weak from loss of blood, he remained at his station
    and commanded the ship for more than 17 hours. He gave up personal control of
    the Liberty only after rendezvous with a U.S. destroyer, and refused medical attention
    until convinced that the seriously wounded among his crew had been treated. The
    citation notes that the action took place in the Eastern Mediterranean rather
    than in Vietnam.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, William L. McGonagle (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. Sailing in international waters, the Liberty was
    attacked without warning by jet fighter aircraft and motor torpedo boats which
    inflicted many casualties among the crew and caused extreme damage to the ship.
    Although severely wounded during the first air attack, Capt. McGonagle remained
    at his battle station on the badly damaged bridge and, with full knowledge of
    the seriousness of his wounds, subordinated his own welfare to the safety and
    survival of his command. Steadfastly refusing any treatment which would take him
    away from his post, he calmly continued to exercise firm command of his ship.
    Despite continuous exposure to fire, he maneuvered his ship, directed its defense,
    supervised the control of flooding and fire, and saw to the care of the casualties.
    Capt. McGonagle's extraordinary valor under these conditions inspired the surviving
    members of the Liberty's crew, many of them seriously wounded, to heroic efforts
    to overcome the battle damage and keep the ship afloat. Subsequent to the attack,
    although in great pain and weak from the loss of blood, Captain McGonagle remained
    at his battle station and continued to command his ship for more than 17 hours.
    It was only after rendezvous with a U.S. destroyer that he relinquished personal
    control of the Liberty and permitted himself to be removed from the bridge. Even
    then, he refused much needed medical attention until convinced that the seriously
    wounded among his crew had been treated. Capt. McGonagle's superb professionalism,
    courageous fighting spirit, and valiant leadership saved his ship and many lives.
    His actions sustain and enhance the finest traditions of the U.S. Naval Service.
    (Captain McGonagle earned the Medal of Honor for actions that took place in international
    waters in the Eastern Mediterranean rather than in Vietnam.)
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 6
  day: 21
  year: 1967
  title: Specialist Fifth Class Edgar Lee McWethy, Jr. earns Medal of Honor (posthumous)
  body: "<p>On June 21, 1967, Specialist Fifth Class Edgar Lee McWethy, Jr., a medical
    aidman with Company B, went with his platoon to the site of a downed helicopter.
    Shortly after the platoon set a defensive perimeter around the aircraft, a large
    enemy force attacked from three sides with automatic weapons fire and grenades.
    The platoon leader and his radio operator were wounded almost at once, and McWethy
    crossed the fire-swept area to them. He could not help the mortally wounded radio
    operator, but his first aid let the platoon leader keep command. Answering another
    call for aid, he started across the open, was wounded in the head and knocked
    down, got up, and was hit again in the leg. He reached the injured men and treated
    them.</p><p>Seeing another rifleman lying exposed to enemy fire, McWethy moved
    toward him and was wounded a third time. Weakened and in extreme pain, he gave
    the man artificial respiration until a fourth wound killed him. The citation credits
    him with contributing to the platoon's successful defense and the rout of the
    enemy force.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Edgar Lee McWethy, Jr. (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Serving as a medical aidman with Company
    B, Sp5c. McWethy accompanied his platoon to the site of a downed helicopter. Shortly
    after the platoon established a defensive perimeter around the aircraft, a large
    enemy force attacked the position from 3 sides with a heavy volume of automatic
    weapons fire and grenades. The platoon leader and his radio operator were wounded
    almost immediately, and Sp5c. McWethy rushed across the fire-swept area to their
    assistance. Although he could not help the mortally wounded radio operator, Sp5c.
    McWethy's timely first aid enabled the platoon leader to retain command during
    this critical period. Hearing a call for aid, Sp5c. McWethy started across the
    open toward the injured men, but was wounded in the head and knocked to the ground.
    He regained his feet and continued on but was hit again, this time in the leg.
    Struggling onward despite his wounds, he gained the side of his comrades and treated
    their injuries. Observing another fallen rifleman Lying in an exposed position
    raked by enemy fire, Sp5c. McWethy moved toward him without hesitation. Although
    the enemy fire wounded him a third time, Sp5c. McWethy reached his fallen companion.
    Though weakened and in extreme pain, Sp5c. McWethy gave the wounded man artificial
    respiration but suffered a fourth and fatal wound. Through his indomitable courage,
    complete disregard for his safety, and demonstrated concern for his fellow soldiers,
    Sp5c. McWethy inspired the members of his platoon and contributed in great measure
    to their successful defense of the position and the ultimate rout of the enemy
    force. Sp5c. McWethy's profound sense of duty, bravery, and his willingness to
    accept extraordinary risks in order to help the men of his unit are characteristic
    of the highest traditions of the military service and reflect great credit upon
    himself and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 6
  day: 21
  year: 1967
  title: Specialist Fourth Class Carmel Bernon Harvey, Jr. earns Medal of Honor (posthumous)
  body: "<p>On June 21, 1967, Specialist Fourth Class Carmel Bernon Harvey, Jr., a
    fire team leader with Company B, was with his platoon securing a downed helicopter.
    The platoon had set a defensive perimeter around the aircraft when a large enemy
    force attacked from three sides. Harvey and two members of his squad were directly
    in the path of the attack and took the brunt of fire from an enemy machine gun.
    Both companions were soon wounded, and Harvey made up for the loss by increasing
    his rifle fire. The machine gun concentrated on him, and one round hit and armed
    a grenade on his belt. He could not remove it.</p><p>Seeing the danger to his
    comrades if he stayed, he jumped up, shouted a challenge at the enemy, and ran
    toward the machine gun. He had nearly reached it when the grenade exploded, mortally
    wounding him and stunning the gun crew. The pause in enemy fire let the wounded
    men be moved out of the danger area, and the platoon went on to beat back the
    attack.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Carmel Bernon Harvey, Jr. (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sp4c. Harvey distinguished himself
    as a fire team leader with Company B, during combat operations. Ordered to secure
    a downed helicopter, his platoon established a defensive perimeter around the
    aircraft, but shortly thereafter a large enemy force attacked the position from
    3 sides. Sp4c. Harvey and 2 members of his squad were in a position directly in
    the path of the enemy onslaught, and their location received the brunt of the
    fire from an enemy machine gun. In short order, both of his companions were wounded,
    but Sp4c. Harvey covered this loss by increasing his deliberate rifle fire at
    the foe. The enemy machine gun seemed to concentrate on him and the bullets struck
    the ground all around his position. One round hit and armed a grenade attached
    to his belt. Quickly, he tried to remove the grenade but was unsuccessful. Realizing
    the danger to his comrades if he remained and despite the hail of enemy fire,
    he jumped to his feet, shouted a challenge at the enemy, and raced toward the
    deadly machine gun. He nearly reached the enemy position when the grenade on his
    belt exploded, mortally wounding Sp4c. Harvey, and stunning the enemy machine
    gun crew. His final act caused a pause in the enemy fire, and the wounded men
    were moved from the danger area. Sp4c. Harvey's dedication to duty, high sense
    of responsibility, and heroic actions inspired the others in his platoon to decisively
    beat back the enemy attack. His acts are in keeping with the highest traditions
    of the military service and reflect great credit upon himself and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 7
  day: 4
  year: 1967
  title: Private First Class Melvin Earl Newlin earns Medal of Honor (posthumous)
  body: "<p>On July 4, 1967, Private First Class Melvin Earl Newlin, a machine gunner
    with the 1st Platoon, Company F, 2d Battalion, was manning a key position on the
    perimeter of the Nong Son outpost with four other marines; the citation dates
    the action to July 3 and 4. A coordinated enemy mortar and infantry assault seriously
    wounded Newlin and killed his four comrades. Propping himself against his machinegun,
    he fired into the charging Viet Cong and twice drove off attempts to overrun his
    position. On the third attempt a grenade knocked him unconscious, and the enemy,
    believing him dead, bypassed him.</p><p>Newlin came to, crawled back to his weapon,
    and fired into the enemy's rear. When he saw them trying to turn a captured 106
    recoilless weapon on other marine positions, he shifted his fire and stopped them,
    then fired on the main force, which again attacked his gun. He fought off two
    more assaults and held his ground until mortally wounded. The citation credits
    him with breaking up the enemy assault.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Melvin Earl Newlin (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a machine gunner attached to the
    1st Platoon, Company F, 2d Battalion, on 3 and 4 July 1967. Private First Class
    Newlin, with 4 other marines, was manning a key position on the perimeter of the
    Nong Son outpost when the enemy launched a savage and well coordinated mortar
    and infantry assault, seriously wounding him and killing his 4 comrades. Propping
    himself against his machinegun, he poured a deadly accurate stream of fire into
    the charging ranks of the Viet Cong. Though repeatedly hit by small-arms fire,
    he twice repelled enemy attempts to overrun his position. During the third attempt,
    a grenade explosion wounded him again and knocked him to the ground unconscious.
    The Viet Cong guerrillas, believing him dead, bypassed him and continued their
    assault on the main force. Meanwhile, Private First Class Newlin regained consciousness,
    crawled back to his weapon, and brought it to bear on the rear of the enemy, causing
    havoc and confusion among them. Spotting the enemy attempting to bring a captured
    106 recoilless weapon to bear on other marine positions, he shifted his fire,
    inflicting heavy casualties on the enemy and preventing them from firing the captured
    weapon. He then shifted his fire back to the primary enemy force, causing the
    enemy to stop their assault on the marine bunkers and to once again attack his
    machinegun position. Valiantly fighting off 2 more enemy assaults, he firmly held
    his ground until mortally wounded. Private First Class Newlin had single-handedly
    broken up and disorganized the entire enemy assault force, causing them to lose
    momentum and delaying them long enough for his fellow marines to organize a defense
    and beat off their secondary attack. His indomitable courage, fortitude, and unwavering
    devotion to duty in the face of almost certain death reflect great credit upon
    himself and the Marine Corps and upheld the highest traditions of the U.S. Naval
    Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 8
  day: 11
  year: 1967
  title: Lance Corporal Roy M. Wheat earns Medal of Honor (posthumous)
  body: "<p>On August 11, 1967, Lance Corporal Roy M. Wheat and two other marines
    were assigned to provide security for a Navy construction battalion crane and
    crew working along Liberty Road in the vicinity of the Dien Ban District, Quang
    Nam Province. After the marines set up security positions in a tree line next
    to the work site, Wheat reconnoitered the area behind their location for guerrillas.
    Returning to within 10 feet of the friendly position, he unintentionally triggered
    a well concealed bounding antipersonnel mine. The three marines heard a hissing
    sound and recognized it as a burning time fuse.</p><p>Wheat shouted a warning
    to his comrades and threw himself on the mine, taking the force of the explosion
    with his body. He was killed. The citation states that his act saved his fellow
    marines from certain injury and possible death.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Roy M. Wheat (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. L/Corporal. Wheat and 2 other marines were assigned
    the mission of providing security for a Navy construction battalion crane and
    crew operating along Liberty Road in the vicinity of the Dien Ban District, Quang
    Nam Province. After the marines had set up security positions in a tree line adjacent
    to the work site, L/Corporal. Wheat reconnoitered the area to the rear of their
    location for the possible presence of guerrillas. He then returned to within 10
    feet of the friendly position, and here unintentionally triggered a well concealed,
    bounding type, antipersonnel mine. Immediately, a hissing sound was heard which
    was identified by the 3 marines as that of a burning time fuse. Shouting a warning
    to his comrades, L/Corporal. Wheat in a valiant act of heroism hurled himself
    upon the mine, absorbing the tremendous impact of the explosion with his body.
    The inspirational personal heroism and extraordinary valor of his unselfish action
    saved his fellow marines from certain injury and possible death, reflected great
    credit upon himself, and upheld the highest traditions of the Marine Corps and
    the U.S. Naval Service. He gallantly gave his life for his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 8
  day: 19
  year: 1967
  title: Major (then Capt.) Stephen W. Pless earns Medal of Honor
  body: "<p>On August 19, 1967, Major Stephen W. Pless, a helicopter gunship pilot
    with Marine Observation Squadron 6, was flying an escort mission when he monitored
    an emergency call that four American soldiers stranded on a nearby beach were
    being overwhelmed by a large Viet Cong force. He flew to the scene and found 30
    to 50 enemy soldiers in the open, some bayoneting and beating the downed Americans.
    Pless attacked with rockets and machineguns at such low level that the aircraft
    flew through debris from its own rockets, killing or wounding many of the enemy
    and driving the rest into a treeline.</p><p>When one of the wounded soldiers gestured
    for help, Pless put his helicopter between the wounded men and the enemy as a
    shield while his crew retrieved them. The enemy fired on the helicopter and rushed
    it again and again, closing to within a few feet before being beaten back. With
    the wounded aboard, Pless flew out to sea; the overloaded aircraft settled into
    the water four times before he got it airborne.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Stephen W. Pless (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a helicopter gunship pilot attached
    to Marine Observation Squadron 6 in action against enemy forces. During an escort
    mission Maj. Pless monitored an emergency call that 4 American soldiers stranded
    on a nearby beach were being overwhelmed by a large Viet Cong force. Maj. Pless
    flew to the scene and found 30 to 50 enemy soldiers in the open. Some of the enemy
    were bayoneting and beating the downed Americans. Maj. Pless displayed exceptional
    airmanship as he launched a devastating attack against the enemy force, killing
    or wounding many of the enemy and driving the remainder back into a treeline.
    His rocket and machinegun attacks were made at such low levels that the aircraft
    flew through debris created by explosions from its rockets. Seeing 1 of the wounded
    soldiers gesture for assistance, he maneuvered his helicopter into a position
    between the wounded men and the enemy, providing a shield which permitted his
    crew to retrieve the wounded. During the rescue the enemy directed intense fire
    at the helicopter and rushed the aircraft again and again, closing to within a
    few feet before being beaten back. When the wounded men were aboard, Maj. Pless
    maneuvered the helicopter out to sea. Before it became safely airborne, the overloaded
    aircraft settled 4 times into the water. Displaying superb airmanship, he finally
    got the helicopter aloft. Major Pless' extraordinary heroism coupled with his
    outstanding flying skill prevented the annihilation of the tiny force. His courageous
    actions reflect great credit upon himself and uphold the highest traditions of
    the Marine Corps and the U.S. Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 8
  day: 26
  year: 1967
  title: Colonel (then Major) George E. Day earns Medal of Honor
  body: "<p>On August 26, 1967, Colonel George E. Day (then a Major) was forced to
    eject over North Vietnam when ground fire hit his aircraft. His right arm was
    broken in three places and his left knee badly sprained. He was captured at once,
    taken to a prison camp, interrogated, and severely tortured. After causing his
    guards to relax their vigilance, Day escaped into the jungle toward South Vietnam.
    Despite new injuries from bomb or rocket fragments, he kept moving south on a
    few berries and uncooked frogs and reached the Ben Hai River, where he came under
    U.S. artillery barrages. With a bamboo log as a float, he swam the river into
    the demilitarized zone.</p><p>Delirious, he lost his sense of direction and wandered
    for several days. After several failed attempts to signal U.S. aircraft, he was
    ambushed and recaptured by the Viet Cong, shot in the left hand and thigh. He
    was returned to the same prison and later moved to Hanoi. Unable to perform the
    simplest task for himself, he continued to offer maximum resistance.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, George E. Day (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: On 26 August 1967, Col. Day was forced to eject from his aircraft over
    North Vietnam when it was hit by ground fire. His right arm was broken in 3 places,
    and his left knee was badly sprained. He was immediately captured by hostile forces
    and taken to a prison camp where he was interrogated and severely tortured. After
    causing the guards to relax their vigilance, Col. Day escaped into the jungle
    and began the trek toward South Vietnam. Despite injuries inflicted by fragments
    of a bomb or rocket, he continued southward surviving only on a few berries and
    uncooked frogs. He successfully evaded enemy patrols and reached the Ben Hai River,
    where he encountered U.S. artillery barrages. With the aid of a bamboo log float,
    Col. Day swam across the river and entered the demilitarized zone. Due to delirium,
    he lost his sense of direction and wandered aimlessly for several days. After
    several unsuccessful attempts to signal U.S. aircraft, he was ambushed and recaptured
    by the Viet Cong, sustaining gunshot wounds to his left hand and thigh. He was
    returned to the prison from which he had escaped and later was moved to Hanoi
    after giving his captors false information to questions put before him. Physically,
    Col. Day was totally debilitated and unable to perform even the simplest task
    for himself. Despite his many injuries, he continued to offer maximum resistance.
    His personal bravery in the face of deadly enemy pressure was significant in saving
    the lives of fellow aviators who were still flying against the enemy. Col. Day's
    conspicuous gallantry and intrepidity at the risk of his life above and beyond
    the call of duty are in keeping with the highest traditions of the U.S. Air Force
    and reflect great credit upon himself and the U.S. Armed Forces.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 9
  day: 4
  year: 1967
  title: Lieutenant Vincent R. Capodanno earns Medal of Honor (posthumous)
  body: "<p>On September 4, 1967, Lieutenant Vincent R. Capodanno, Chaplain of the
    3d Battalion, learned that the 2d Platoon of M Company was in danger of being
    overrun by a massed enemy assault. He left the company command post and ran through
    an open area raked with fire to reach the platoon. Under small-arms, automatic-weapons,
    and mortar fire, he moved about the battlefield administering last rites to the
    dying and giving medical aid to the wounded. An exploding mortar round inflicted
    multiple wounds to his arms and legs and severed a portion of his right hand.
    He refused all medical aid, directed the corpsmen to help their wounded comrades,
    and continued to move among the marines, encouraging them by voice and example.</p><p>Coming
    upon a wounded corpsman in the direct line of fire of an enemy machine gunner
    about 15 yards away, Capodanno rushed to help him. Only inches from the mortally
    wounded corpsman, he was struck down by a burst of machine gun fire and killed.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Vincent R. Capodanno (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty as Chaplain of the 3d Battalion, in connection with
    operations against enemy forces. In response to reports that the 2d Platoon of
    M Company was in danger of being overrun by a massed enemy assaulting force, Lt.
    Capodanno left the relative safety of the company command post and ran through
    an open area raked with fire, directly to the beleaguered platoon. Disregarding
    the intense enemy small-arms, automatic-weapons, and mortar fire, he moved about
    the battlefield administering last rites to the dying and giving medical aid to
    the wounded. When an exploding mortar round inflicted painful multiple wounds
    to his arms and legs, and severed a portion of his right hand, he steadfastly
    refused all medical aid. Instead, he directed the corpsmen to help their wounded
    comrades and, with calm vigor, continued to move about the battlefield as he provided
    encouragement by voice and example to the valiant marines. Upon encountering a
    wounded corpsman in the direct line of fire of an enemy machine gunner positioned
    approximately 15 yards away, Lt. Capodanno rushed a daring attempt to aid and
    assist the mortally wounded corpsman. At that instant, only inches from his goal,
    he was struck down by a burst of machine gun fire. By his heroic conduct on the
    battlefield, and his inspiring example, Lt. Capodanno upheld the finest traditions
    of the U.S. Naval Service. He gallantly gave his life in the cause of freedom.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 9
  day: 4
  year: 1967
  title: Sergeant Lawrence David Peters earns Medal of Honor (posthumous)
  body: "<p>On September 4, 1967, during Operation SWIFT, Sergeant Lawrence David
    Peters was a squad leader in the 2d Platoon of Company M when the platoon came
    under intense mortar, machinegun, and small arms fire from an entrenched enemy
    force. As the company rallied, Peters led his squad in an assault on an enemy-defended
    knoll. Standing in the open to point out enemy positions, he was wounded in the
    leg; he moved forward and kept leading his men. When the enemy fire pinned the
    squad down, he exposed himself to consolidate the position and direct the base
    of fire, and was wounded a second time in the face and neck by an exploding mortar
    round.</p><p>As the enemy tried to infiltrate an adjacent platoon's position,
    Peters stood erect in full view of them and fired burst after burst, forcing them
    to disclose their camouflaged positions. He took two more wounds and continued
    to direct and encourage his squad until he lost consciousness and died. The squad
    regained fire superiority and carried the assault to the enemy.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Lawrence David Peters (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a squad leader with Company M. During
    Operation SWIFT, the marines of the 2d Platoon of Company M were struck by intense
    mortar, machinegun, and small arms fire from an entrenched enemy force. As the
    company rallied its forces, Sergeant. Peters maneuvered his squad in an assault
    on any enemy defended knoll. Disregarding his safety, as enemy rounds hit all
    about him, he stood in the open, pointing out enemy positions until he was painfully
    wounded in the leg. Disregarding his wound, he moved forward and continued to
    lead his men. As the enemy fire increased in accuracy and volume, his squad lost
    its momentum and was temporarily pinned down. Exposing himself to devastating
    enemy fire, he consolidated his position to render more effective fire. While
    directing the base of fire, he was wounded a second time in the face and neck
    from an exploding mortar round. As the enemy attempted to infiltrate the position
    of an adjacent platoon, Sergeant. Peters stood erect in the full view of the enemy
    firing burst after burst forcing them to disclose their camouflaged positions.
    Sergeant. Peters steadfastly continued to direct his squad in spite of 2 additional
    wounds, persisted in his efforts to encourage and supervise his men until he lost
    consciousness and succumbed. Inspired by his selfless actions, the squad regained
    fire superiority and once again carried the assault to the enemy. By his outstanding
    valor, indomitable fighting spirit and tenacious determination in the face of
    overwhelming odds, Sergeant. Peters upheld the highest traditions of the Marine
    Corps and the U.S. Naval Service. He gallantly gave his life for his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 9
  day: 6
  year: 1967
  title: Sergeant Rodney Maxwell Davis earns Medal of Honor (posthumous)
  body: "<p>On September 6, 1967, Sergeant Rodney Maxwell Davis was serving as right
    guide of the 2d Platoon, Company B, when elements of the platoon were pinned down
    by a numerically superior force of attacking North Vietnamese Army Regulars. The
    remnants of the platoon held a trench line, where Davis directed his men's fire
    in an attempt to repel the attack. Under enemy hand grenades and a high volume
    of small arms and mortar fire, he moved from man to man shouting encouragement
    to each while firing and throwing grenades at the onrushing enemy.</p><p>When
    an enemy grenade landed in the trench among his men, Davis threw himself on it
    and absorbed the full force of the explosion with his body. He was killed. The
    citation states that his act saved his comrades from injury and possible loss
    of life and enabled the platoon to hold its position.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Rodney Maxwell Davis (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as the right guide of the 2d Platoon,
    Company B, in action against enemy forces. Elements of the 2d Platoon were pinned
    down by a numerically superior force of attacking North Vietnamese Army Regulars.
    Remnants of the platoon were located in a trench line where Sergeant. Davis was
    directing the fire of his men in an attempt to repel the enemy attack. Disregarding
    the enemy hand grenades and high volume of small arms and mortar fire, Sergeant.
    Davis moved from man to man shouting words of encouragement to each of them while
    firing and throwing grenades at the onrushing enemy. When an enemy grenade landed
    in the trench in the midst of his men, Sergeant. Davis, realizing the gravity
    of the situation, and in a final valiant act of complete self-sacrifice, instantly
    threw himself upon the grenade, absorbing with his body the full and terrific
    force of the explosion. Through his extraordinary initiative and inspiring valor
    in the face of almost certain death, Sergeant. Davis saved his comrades from injury
    and possible loss of life, enabled his platoon to hold its vital position, and
    upheld the highest traditions of the Marine Corps and the U.S. Naval Service.
    He gallantly gave his life for his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 9
  day: 21
  year: 1967
  title: Lance Corporal Jedh Colby Barker earns Medal of Honor (posthumous)
  body: "<p>On September 21, 1967, Lance Corporal Jedh Colby Barker, a machine gunner
    with Company F, was on a reconnaissance operation when his squad came under enemy
    sniper fire. The squad deployed into combat formation and advanced on a strongly
    fortified enemy position, where small arms and automatic weapons fire struck it
    again and caused numerous casualties. Wounded by the first burst, Barker stayed
    in the open and delivered accurate fire on the numerically superior force. The
    enemy, intent on annihilating the small marine force and recognizing him as a
    threat, concentrated their fire on him. He was wounded again, in the right hand,
    and could no longer operate his machine gun.</p><p>An enemy grenade then landed
    among the few surviving marines. Barker threw himself on it and absorbed the force
    of the explosion with his body. He then crawled to a wounded comrade and gave
    first aid before dying of his wounds. The citation states that his act saved his
    comrades from further injury or possible death.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Jedh Colby Barker (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a machine gunner with Company F.
    During a reconnaissance operation L/Corporal. Barker's squad was suddenly hit
    by enemy sniper fire. The squad immediately deployed to a combat formation and
    advanced to a strongly fortified enemy position, when it was again struck by small
    arms and automatic weapons fire, sustaining numerous casualties. Although wounded
    by the initial burst of fire, L/Corporal. Barker boldly remained in the open,
    delivering a devastating volume of accurate fire on the numerically superior force.
    The enemy was intent upon annihilating the small marine force and, realizing that
    L/Corporal. Barker was a threat to their position, directed the preponderance
    of their fire on his position. He was again wounded, this time in the right hand,
    which prevented him from operating his vitally needed machine gun. Suddenly and
    without warning, an enemy grenade landed in the midst of the few surviving marines.
    Unhesitatingly and with complete disregard for his personal safety, L/Corporal.
    Barker threw himself upon the deadly grenade, absorbing with his body the full
    and tremendous force of the explosion. In a final act of bravery, he crawled to
    the side of a wounded comrade and administered first aid before succumbing to
    his grievous wounds. His bold initiative, intrepid fighting spirit and unwavering
    devotion to duty in the face of almost certain death undoubtedly saved his comrades
    from further injury or possible death and reflected great credit upon himself,
    the Marine Corps, and the U.S. Naval Service. He gallantly gave his life for his
    country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 10
  day: 12
  year: 1967
  title: Corporal William Thomas Perkins, Jr. earns Medal of Honor (posthumous)
  body: <p>On October 12, 1967, Corporal William Thomas Perkins, Jr., a combat photographer
    attached to Company C, was with the company during Operation MEDINA, a major reconnaissance
    in force southwest of Quang Tri, when it made heavy contact with a North Vietnamese
    Army force estimated at two to three companies. The fighting centered on a helicopter
    landing zone that also served as the Command Post of Company C. During a strong
    enemy attack, a grenade landed in the area occupied by Perkins and three other
    marines.</p><p>Perkins shouted the warning "Incoming Grenade" to his fellow marines
    and threw himself on the grenade, absorbing the impact of the explosion with his
    body. He was killed, and the citation states that his act saved the lives of the
    three marines with him.</p>
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, William Thomas Perkins, Jr. (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a combat photographer attached to
    Company C. During Operation MEDINA, a major reconnaissance in force southwest
    of Quang Tri, Company C made heavy combat contact with a numerically superior
    North Vietnamese Army force estimated at from 2 to 3 companies. The focal point
    of the intense fighting was a helicopter landing zone which was also serving as
    the Command Post of Company C. In the course of a strong hostile attack, an enemy
    grenade landed in the immediate area occupied by Corporal. Perkins and 3 other
    marines. Realizing the inherent danger, he shouted the warning, "Incoming Grenade"
    to his fellow marines, and in a valiant act of heroism, hurled himself upon the
    grenade absorbing the impact of the explosion with his body, thereby saving the
    lives of his comrades at the cost of his life. Through his exceptional courage
    and inspiring valor in the face of certain death, Corporal. Perkins reflected
    great credit upon himself and the Marine Corps and upheld the highest traditions
    of the U.S. Naval Service. He gallantly gave his life for his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 10
  day: 14
  year: 1967
  title: Sergeant Paul Hellstrom Foster earns Medal of Honor (posthumous)
  body: "<p>On October 14, 1967, in the early morning hours, Sergeant Paul Hellstrom
    Foster was artillery liaison operations chief with the 2d Battalion, which was
    holding a defensive position protecting a bridge on the road from Con Thien to
    Cam Lo. The position came under heavy mortar and artillery fire followed by an
    enemy ground assault. The enemy penetrated the perimeter and brought small arms,
    automatic weapons, and rocket fire on the battalion command post. Foster's position
    in the fire support coordination center was exposed to this fire, and he was wounded
    when a grenade exploded near him, but he continued to direct mortar and artillery
    fire on the advancing North Vietnamese troops.</p><p>As the attack went on, a
    hand grenade landed among Foster and his five companions. He shouted a warning,
    threw his armored vest over the grenade, and placed his body over the vest. He
    absorbed the entire blast and was mortally wounded. The citation states that his
    act saved his comrades from further injury or possible death.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Paul Hellstrom Foster (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as an artillery liaison operations chief
    with the 2d Battalion. In the early morning hours the 2d Battalion was occupying
    a defensive position which protected a bridge on the road leading from Con Thien
    to Cam Lo. Suddenly, the marines' position came under a heavy volume of mortar
    and artillery fire, followed by an aggressive enemy ground assault. In the ensuing
    engagement, the hostile force penetrated the perimeter and brought a heavy concentration
    of small arms, automatic weapons, and rocket fire to bear on the battalion command
    post. Although his position in the fire support coordination center was dangerously
    exposed to enemy fire and he was wounded when an enemy hand grenade exploded near
    his position, Sergeant. Foster resolutely continued to direct accurate mortar
    and artillery fire on the advancing North Vietnamese troops. As the attack continued,
    a hand grenade landed in the midst of Sergeant. Foster and his 5 companions. Realizing
    the danger, he shouted a warning, threw his armored vest over the grenade, and
    unhesitatingly placed his body over the armored vest. When the grenade exploded,
    Sergeant. Foster absorbed the entire blast with his body and was mortally wounded.
    His heroic actions undoubtedly saved his comrades from further injury or possible
    death. Sergeant. Foster's courage, extraordinary heroism, and unfaltering devotion
    to duty reflected great credit upon himself and the Marine Corps and upheld the
    highest traditions of the U.S. Naval Service. He gallantly gave his life for his
    country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 10
  day: 15
  year: 1967
  title: Sergeant First Class Webster Anderson earns Medal of Honor
  body: "<p>On October 15, 1967, in the early morning hours, Sergeant First Class
    Webster Anderson, chief of section in Battery A, was at his howitzer position
    when a North Vietnamese Army infantry unit attacked the battery's defensive position
    with heavy mortar, recoilless rifle, rocket propelled grenade, and automatic weapon
    fire. The first onslaught breached the perimeter. Anderson mounted the exposed
    parapet of his howitzer position and directed direct howitzer fire on the assaulting
    enemy while firing his rifle and throwing grenades at soldiers trying to overrun
    his gun section. Two enemy grenades exploded at his feet, knocking him down and
    severely wounding him in the legs. Unable to stand, he propped himself on the
    parapet and continued to direct howitzer fire and encourage his men.</p><p>When
    an enemy grenade landed in the gun pit near a wounded crewman, Anderson seized
    it and tried to throw it over the parapet. It exploded as it left the position,
    wounding him again. Only partially conscious, he refused medical evacuation and
    continued to encourage his men. The section held its position and defeated the
    attack.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Webster Anderson (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: Sergeant. 1st Class. Anderson (then S/Sergeant.), distinguished himself
    by conspicuous gallantry and intrepidity in action while serving as chief of section
    in Battery A, against a hostile force. During the early morning hours Battery
    A's defensive position was attacked by a determined North Vietnamese Army infantry
    unit supported by heavy mortar, recoilless rifle, rocket propelled grenade and
    automatic weapon fire. The initial enemy onslaught breached the battery defensive
    perimeter. Sergeant. 1st Class. Anderson, with complete disregard for his personal
    safety, mounted the exposed parapet of his howitzer position and became the mainstay
    of the defense of the battery position. Sergeant. 1st Class. Anderson directed
    devastating direct howitzer fire on the assaulting enemy while providing rifle
    and grenade defensive fire against enemy soldiers attempting to overrun his gun
    section position. While protecting his crew and directing their fire against the
    enemy from his exposed position, 2 enemy grenades exploded at his feet knocking
    him down and severely wounding him in the legs. Despite the excruciating pain
    and though not able to stand, Sergeant. 1st Class. Anderson valorously propped
    himself on the parapet and continued to direct howitzer fire upon the closing
    enemy and to encourage his men to fight on. Seeing an enemy grenade land within
    the gun pit near a wounded member of his gun crew, Sergeant. 1st Class. Anderson
    heedless of his own safety, seized the grenade and attempted to throw it over
    the parapet to save his men. As the grenade was thrown from the position it exploded
    and Sergeant. 1st Class. Anderson was again grievously wounded. Although only
    partially conscious and severely wounded, Sergeant. 1st Class. Anderson refused
    medical evacuation and continued to encourage his men in the defense of the position.
    Sergeant. 1st Class. Anderson by his inspirational leadership, professionalism,
    devotion to duty and complete disregard for his welfare was able to maintain the
    defense of his section position and to defeat a determined attack. Sergeant. 1st
    Class. Anderson's gallantry and extraordinary heroism at the risk of his life
    above and beyond the call of duty are in the highest traditions of the military
    service and reflect great credit upon himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 10
  day: 17
  year: 1967
  title: Second Lieutenant Harold Bascom Durham, Jr. earns Medal of Honor (posthumous)
  body: "<p>On October 17, 1967, Second Lieutenant Harold Bascom Durham, Jr., was
    serving as forward observer with Company D, 2d Battalion, 28th Infantry, on a
    battalion reconnaissance-in-force mission. At approximately 1015 hours the battalion
    met an enemy force in well-camouflaged positions and fortified bunkers. Durham
    moved into an exposed position to adjust the supporting artillery fire, and in
    a lull gave first aid to the wounded. When Company A lost its forward observer,
    Durham moved to replace him. The enemy detonated a Claymore mine, wounding him
    severely in the head and impairing his vision. He kept directing artillery, calling
    fire almost directly onto his own position, and the enemy was driven back twice.</p><p>Moved
    to a secondary defensive position, Durham continued to call artillery fire from
    a small clearing that gave a better vantage point. Enemy machine gun fire wounded
    him a second time. Near death, he saw two Viet Cong approaching and shooting the
    defenseless wounded, and shouted a warning to a nearby soldier, who killed them.
    Durham died moments later, still grasping the radio handset.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Harold Bascom Durham, Jr. (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: 2d Lt. Durham, Artillery, distinguished himself by conspicuous gallantry
    and intrepidity at the cost of his life above and beyond the call of duty while
    assigned to Battery C. 2d Lt. Durham was serving as a forward observer with Company
    D, 2d Battalion, 28th Infantry during a battalion reconnaissance-in-force mission.
    At approximately 1015 hours contact was made with an enemy force concealed in
    well-camouflaged positions and fortified bunkers. 2d Lt. Durham immediately moved
    into an exposed position to adjust the supporting artillery fire onto the insurgents.
    During a brief lull in the battle he administered emergency first aid to the wounded
    in spite of heavy enemy sniper fire directed toward him. Moments later, as enemy
    units assaulted friendly positions, he learned that Company A, bearing the brunt
    of the attack, had lost its forward observer. While he was moving to replace the
    wounded observer, the enemy detonated a Claymore mine, severely wounding him in
    the head and impairing his vision. In spite of the intense pain, he continued
    to direct the supporting artillery fire and to employ his individual weapon in
    support of the hard pressed infantrymen. As the enemy pressed their attack, 2d
    Lt. Durham called for supporting fire to be placed almost directly on his position.
    Twice the insurgents were driven back, leaving many dead and wounded behind. 2d
    Lt. Durham was then taken to a secondary defensive position. Even in his extremely
    weakened condition, he continued to call artillery fire onto the enemy. He refused
    to seek cover and instead positioned himself in a small clearing which offered
    a better vantage point from which to adjust the fire. Suddenly, he was severely
    wounded a second time by enemy machine gun fire. As he lay on the ground near
    death, he saw two Viet Cong approaching, shooting the defenseless wounded men.
    With his last effort, 2d Lt. Durham shouted a warning to a nearby soldier who
    immediately killed the insurgents. 2d Lt. Durham died moments later, still grasping
    the radio handset. 2d Lt. Durham's gallant actions in close combat with an enemy
    force are in keeping with the highest traditions of the military service and reflect
    great credit upon himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 10
  day: 31
  year: 1967
  title: Captain Riley L. Pitts earns Medal of Honor (posthumous)
  body: "<p>On October 31, 1967, Captain Riley L. Pitts, commanding Company C, led
    his company in an airmobile assault. After landing, the company took automatic
    weapons fire from several Viet Cong, and Pitts led an assault that overran their
    positions. He was then ordered north to reinforce another company heavily engaged.
    As his company moved forward, it received fire from three directions, including
    from four bunkers, two within 15 meters of Pitts, and could not maneuver. With
    rifle fire ineffective in the dense jungle, Pitts took up an M-79 grenade launcher
    to pinpoint targets. He lobbed a Chinese Communist grenade at a bunker to his
    front; it rebounded off the foliage, and Pitts threw himself on top of it. It
    failed to explode.</p><p>Pitts repositioned the company so artillery could be
    fired, then led his men toward the enemy again, personally killing at least one
    more Viet Cong. With the jungle still blocking fire on the bunkers, he moved to
    a position from which he could fire on them and kept firing, urging his men forward,
    until he was mortally wounded.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Riley L. Pitts (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: Distinguishing himself by exceptional heroism while serving as company
    commander during an airmobile assault. Immediately after his company landed in
    the area, several Viet Cong opened fire with automatic weapons. Despite the enemy
    fire, Capt. Pitts forcefully led an assault which overran the enemy positions.
    Shortly thereafter, Capt. Pitts was ordered to move his unit to the north to reinforce
    another company heavily engaged against a strong enemy force. As Capt. Pitts'
    company moved forward to engage the enemy, intense fire was received from 3 directions,
    including fire from 4 enemy bunkers, 2 of which were within 15 meters of Capt.
    Pitts' position. The severity of the incoming fire prevented Capt. Pitts from
    maneuvering his company. His rifle fire proving ineffective against the enemy
    due to the dense jungle foliage, he picked up an M-79 grenade launcher and began
    pinpointing the targets. Seizing a Chinese Communist grenade which had been taken
    from a captured Viet Cong's web gear, Capt. Pitts lobbed the grenade at a bunker
    to his front, but it hit the dense jungle foliage and rebounded. Without hesitation,
    Capt. Pitts threw himself on top of the grenade which, fortunately, failed to
    explode. Capt. Pitts then directed the repositioning of the company to permit
    friendly artillery to be fired. Upon completion of the artillery fire mission,
    Capt. Pitts again led his men toward the enemy positions, personally killing at
    least 1 more Viet Cong. The jungle growth still prevented effective fire to be
    placed on the enemy bunkers. Capt. Pitts, displaying complete disregard for his
    life and personal safety, quickly moved to a position which permitted him to place
    effective fire on the enemy. He maintained a continuous fire, pinpointing the
    enemy's fortified positions, while at the same time directing and urging his men
    forward, until he was mortally wounded. Capt. Pitts' conspicuous gallantry, extraordinary
    heroism, and intrepidity at the cost of his life, above and beyond the call of
    duty, are in the highest traditions of the U.S. Army and reflect great credit
    upon himself, his unit, and the Armed Forces of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 11
  day: 7
  year: 1967
  title: Specialist Fourth Class Robert F. Stryker earns Medal of Honor (posthumous)
  body: "<p>On November 7, 1967, Specialist Fourth Class Robert F. Stryker was serving
    as a grenadier with Company C in a multicompany reconnaissance in force near Loc
    Ninh. As his unit moved through dense underbrush, enemy forces concealed in fortified
    bunkers and in the surrounding trees opened a hail of rocket, automatic weapons,
    and small arms fire. Stryker fired into the enemy positions with his grenade launcher.
    During the exchange he detected enemy elements trying to encircle his company
    and cut it off from the main body of the friendly force. Under machinegun and
    small-arms fire, he repeatedly fired grenades into the trees, killing enemy snipers
    and enabling his comrades to break the attempted encirclement.</p><p>As the battle
    continued, Stryker saw several wounded members of his squad in the killing zone
    of an enemy claymore mine. He threw himself on the mine as it was detonated and
    was mortally wounded, his body shielding his comrades from the blast. The citation
    credits him with saving the lives of at least six of his fellow soldiers.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Robert F. Stryker (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. Sp4c. Stryker, U.S. Army, distinguished himself while
    serving with Company C. Sp4c. Stryker was serving as a grenadier in a multicompany
    reconnaissance in force near Loc Ninh. As his unit moved through the dense underbrush,
    it was suddenly met with a hail of rocket, automatic weapons and small arms fire
    from enemy forces concealed in fortified bunkers and in the surrounding trees.
    Reacting quickly, Sp4c. Stryker fired into the enemy positions with his grenade
    launcher. During the devastating exchange of fire, Sp4c. Stryker detected enemy
    elements attempting to encircle his company and isolate it from the main body
    of the friendly force. Undaunted by the enemy machinegun and small-arms fire,
    Sp4c. Stryker repeatedly fired grenades into the trees, killing enemy snipers
    and enabling his comrades to sever the attempted encirclement. As the battle continued,
    Sp4c. Stryker observed several wounded members of his squad in the killing zone
    of an enemy claymore mine. With complete disregard for his safety, he threw himself
    upon the mine as it was detonated. He was mortally wounded as his body absorbed
    the blast and shielded his comrades from the explosion. His unselfish actions
    were responsible for saving the lives of at least 6 of his fellow soldiers. Sp4c.
    Stryker's great personal bravery was in keeping with the highest traditions of
    the military service and reflects great credit upon himself, his unit, and the
    U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 11
  day: 9
  year: 1967
  title: Captain (then 1st Lt.) James Allen Taylor earns Medal of Honor
  body: "<p>On November 9, 1967, Captain James Allen Taylor was executive officer
    of Troop B, 1st Squadron, when the troop attacked a fortified position west of
    Que Son and came under recoilless rifle, mortar, and automatic weapons fire from
    an enemy strong point to its front. Recoilless rifle fire hit one armored cavalry
    assault vehicle at once, wounding all five crewmen. Taylor rushed forward through
    enemy fire and exploding ammunition and pulled the wounded to safety. Within minutes
    a second vehicle was hit; Taylor went forward on foot and removed all the crewmen
    from the burning vehicle to a nearby dike moments before it exploded.</p><p>Returning
    to his own vehicle, Taylor was wounded by a mortar round, yet he drove to relocate
    the medical evacuation landing zone closer to the front. On the way, a machinegun
    opened fire from not 50 yards away, and Taylor killed its three-man crew with
    his own machinegun. At the new site another vehicle was struck. Taylor again rushed
    forward, pulled the wounded out, and brought them to the evacuation site on his
    vehicle.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, James Allen Taylor (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: Capt. Taylor, Armor, was serving as executive officer of Troop B, 1st
    Squadron. His troop was engaged in an attack on a fortified position west of Que
    Son when it came under intense enemy recoilless rifle, mortar, and automatic weapons
    fire from an enemy strong point located immediately to its front. One armored
    cavalry assault vehicle was hit immediately by recoilless rifle fire and all 5
    crewmembers were wounded. Aware that the stricken vehicle was in grave danger
    of exploding, Capt. Taylor rushed forward and personally extracted the wounded
    to safety despite the hail of enemy fire and exploding ammunition. Within minutes
    a second armored cavalry assault vehicle was hit by multiple recoilless rifle
    rounds. Despite the continuing intense enemy fire, Capt. Taylor moved forward
    on foot to rescue the wounded men from the burning vehicle and personally removed
    all the crewmen to the safety of a nearby dike. Moments later the vehicle exploded.
    As he was returning to his vehicle, a bursting mortar round painfully wounded
    Capt. Taylor, yet he valiantly returned to his vehicle to relocate the medical
    evacuation landing zone to an area closer to the front lines. As he was moving
    his vehicle, it came under machinegun fire from an enemy position not 50 yards
    away. Capt. Taylor engaged the position with his machinegun, killing the 3-man
    crew. Upon arrival at the new evacuation site, still another vehicle was struck.
    Once again Capt. Taylor rushed forward and pulled the wounded from the vehicle,
    loaded them aboard his vehicle, and returned them safely to the evacuation site.
    His actions of unsurpassed valor were a source of inspiration to his entire troop,
    contributed significantly to the success of the overall assault on the enemy position,
    and were directly responsible for saving the lives of a number of his fellow soldiers.
    His actions were in keeping with the highest traditions of the military profession
    and reflect great credit upon himself, his unit, and the U.S. Army
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 11
  day: 9
  year: 1967
  title: Captain Gerald O. Young earns Medal of Honor
  body: "<p>On November 9, 1967, Captain Gerald O. Young, a helicopter rescue crew
    commander, was flying escort for another helicopter attempting the night rescue
    of an Army ground reconnaissance team in imminent danger of death or capture.
    Earlier attempts had cost two helicopters to ground fire, and the team was on
    a steep slope. Heavy fire severely damaged one rescue helicopter, which extracted
    three of the team; its commander recommended abandoning further attempts. With
    the supporting gunships low on fuel and ordnance, Young hovered under intense
    fire until the remaining survivors were aboard. As he maneuvered for takeoff,
    the enemy raked the aircraft at point-blank range. It crashed, inverted, and burst
    into flames.</p><p>Young escaped through a window of the burning aircraft. Despite
    serious burns, he aided one of the wounded men and tried to lead the hostile forces
    away from his position. He later declined rescue because he had seen the enemy
    setting up automatic weapons to trap any rescue aircraft, and he evaded them for
    more than 17 hours until rescue aircraft could be brought in.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Gerald O. Young (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty. Capt. Young distinguished himself while serving as
    a helicopter rescue crew commander. Capt. Young was flying escort for another
    helicopter attempting the night rescue of an Army ground reconnaissance team in
    imminent danger of death or capture. Previous attempts had resulted in the loss
    of 2 helicopters to hostile ground fire. The endangered team was positioned on
    the side of a steep slope which required unusual airmanship on the part of Capt.
    Young to effect pickup. Heavy automatic weapons fire from the surrounding enemy
    severely damaged 1 rescue helicopter, but it was able to extract 3 of the team.
    The commander of this aircraft recommended to Capt. Young that further rescue
    attempts be abandoned because it was not possible to suppress the concentrated
    fire from enemy automatic weapons. With full knowledge of the danger involved,
    and the fact that supporting helicopter gunships were low on fuel and ordnance,
    Capt. Young hovered under intense fire until the remaining survivors were aboard.
    As he maneuvered the aircraft for takeoff, the enemy appeared at point-blank range
    and raked the aircraft with automatic weapons fire. The aircraft crashed, inverted,
    and burst into flames. Capt. Young escaped through a window of the burning aircraft.
    Disregarding serious burns, Capt. Young aided one of the wounded men and attempted
    to lead the hostile forces away from his position. Later, despite intense pain
    from his burns, he declined to accept rescue because he had observed hostile forces
    setting up automatic weapons positions to entrap any rescue aircraft. For more
    than 17 hours he evaded the enemy until rescue aircraft could be brought into
    the area. Through his extraordinary heroism, aggressiveness, and concern for his
    fellow man, Capt. Young reflected the highest credit upon himself, the U.S. Air
    Force, and the Armed Forces of his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 11
  day: 9
  year: 1967
  title: Captain Lance P. Sijan earns Medal of Honor (posthumous)
  body: "<p>On November 9, 1967, Captain Lance P. Sijan ejected from his disabled
    aircraft on a flight over North Vietnam. He evaded capture for more than six weeks,
    seriously injured and suffering from shock and extreme weight loss from lack of
    food. After North Vietnamese soldiers captured him, he was taken to a holding
    point for transfer to a prisoner of war camp. Emaciated and crippled, he overpowered
    one of his guards and crawled into the jungle, and was recaptured after several
    hours.</p><p>Sijan was then moved to another prison camp, kept in solitary confinement,
    interrogated at length, and severely tortured. He gave his captors no information.
    He lapsed into delirium and was placed in the care of another prisoner. In his
    intermittent periods of consciousness until his death, he never complained of
    his physical condition and on several occasions spoke of future escape attempts.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Lance P. Sijan (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: While on a flight over North Vietnam, Capt. Sijan ejected from his
    disabled aircraft and successfully evaded capture for more than 6 weeks. During
    this time, he was seriously injured and suffered from shock and extreme weight
    loss due to lack of food. After being captured by North Vietnamese soldiers, Capt.
    Sijan was taken to a holding point for subsequent transfer to a prisoner of war
    camp. In his emaciated and crippled condition, he overpowered 1 of his guards
    and crawled into the jungle, only to be recaptured after several hours. He was
    then transferred to another prison camp where he was kept in solitary confinement
    and interrogated at length. During interrogation, he was severely tortured; however,
    he did not divulge any information to his captors. Capt. Sijan lapsed into delirium
    and was placed in the care of another prisoner. During his intermittent periods
    of consciousness until his death, he never complained of his physical condition
    and, on several occasions, spoke of future escape attempts. Capt. Sijan's extraordinary
    heroism and intrepidity above and beyond the call of duty at the cost of his life
    are in keeping with the highest traditions of the U.S. Air Force and reflect great
    credit upon himself and the U.S. Armed Forces.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 11
  day: 12
  year: 1967
  title: Private First Class John Andrew Barnes III earns Medal of Honor (posthumous)
  body: "<p>On November 12, 1967, Private First Class John Andrew Barnes III was serving
    as a grenadier when his unit was attacked by a North Vietnamese force estimated
    to be a battalion. Seeing the crew of a machine gun team killed, Barnes dashed
    through the bullet swept area, manned the machine gun, and killed nine enemy soldiers
    as they assaulted his position. Pausing only long enough to retrieve more ammunition,
    he saw an enemy grenade thrown into the midst of severely wounded men close to
    his position.</p><p>Judging that the grenade could kill or further injure most
    of the wounded, Barnes threw himself directly onto it as it exploded and was killed.
    The citation states that his act averted probable loss of life and injury to the
    wounded members of his unit.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, John Andrew Barnes III (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Private First Class Barnes distinguished
    himself by exceptional heroism while engaged in combat against hostile forces.
    Private First Class Barnes was serving as a grenadier when his unit was attacked
    by a North Vietnamese force, estimated to be a battalion. Upon seeing the crew
    of a machine gun team killed, Private First Class Barnes, without hesitation,
    dashed through the bullet swept area, manned the machine gun, and killed 9 enemy
    soldiers as they assaulted his position. While pausing just long enough to retrieve
    more ammunition, Private First Class Barnes observed an enemy grenade thrown into
    the midst of some severely wounded personnel close to his position. Realizing
    that the grenade could further injure or kill the majority of the wounded personnel,
    he sacrificed his life by throwing himself directly onto the hand grenade as it
    exploded. Through his indomitable courage, complete disregard for his own safety,
    and profound concern for his fellow soldiers, he averted a probable loss of life
    and injury to the wounded members of his unit. Private First Class Barnes' extraordinary
    heroism, and intrepidity at the cost of his life, above and beyond the call of
    duty, are in the highest traditions of military service and reflect great credit
    upon himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 11
  day: 18
  year: 1967
  title: Sergeant Sammy L. Davis earns Medal of Honor
  body: "<p>On November 18, 1967, at approximately 0200 hours, Sergeant Sammy L. Davis,
    then a Private First Class and a cannoneer with Battery C at a remote fire support
    base, was under heavy mortar attack when an estimated reinforced Viet Cong battalion
    assaulted the base across a river, driving to within 25 meters of the friendly
    positions. Davis seized a machine gun and covered his guncrew. A recoilless rifle
    round hit the howitzer, hurling the crew from the gun and blowing Davis into a
    foxhole. He returned to the burning howitzer, ignored warnings to seek cover,
    and fired it; the recoil knocked him down. A mortar round wounded him. He fired
    again, was knocked down again, and fired three more shells.</p><p>Wounded and
    unable to swim, Davis crossed the deep river on an air mattress to three wounded
    comrades, stood and fired into the vegetation to hold off the Viet Cong, and brought
    them across to the base. He refused medical attention and joined another howitzer
    crew, which fired on the Viet Cong until they broke contact and fled.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Sammy L. Davis (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life and beyond the call of duty. Sergeant. Davis (then Private First Class)
    distinguished himself during the early morning hours while serving as a cannoneer
    with Battery C, at a remote fire support base. At approximately 0200 hours, the
    fire support base was under heavy enemy mortar attack. Simultaneously, an estimated
    reinforced Viet Cong battalion launched a fierce ground assault upon the fire
    support base. The attacking enemy drove to within 25 meters of the friendly positions.
    Only a river separated the Viet Cong from the fire support base. Detecting a nearby
    enemy position, Sergeant. Davis seized a machine gun and provided covering fire
    for his guncrew, as they attempted to bring direct artillery fire on the enemy.
    Despite his efforts, an enemy recoilless rifle round scored a direct hit upon
    the artillery piece. The resultant blast hurled the guncrew from their weapon
    and blew Sergeant. Davis into a foxhole. He struggled to his feet and returned
    to the howitzer, which was burning furiously. Ignoring repeated warnings to seek
    cover, Sergeant. Davis rammed a shell into the gun. Disregarding a withering hail
    of enemy fire directed against his position, he aimed and fired the howitzer which
    rolled backward, knocking Sergeant. Davis violently to the ground. Undaunted,
    he returned to the weapon to fire again when an enemy mortar round exploded within
    20 meters of his position, injuring him painfully. Nevertheless, Sergeant. Davis
    loaded the artillery piece, aimed and fired. Again he was knocked down by the
    recoil. In complete disregard for his safety, Sergeant. Davis loaded and fired
    3 more shells into the enemy. Disregarding his extensive injuries and his inability
    to swim, Sergeant. Davis picked up an air mattress and struck out across the deep
    river to rescue 3 wounded comrades on the far side. Upon reaching the 3 wounded
    men, he stood upright and fired into the dense vegetation to prevent the Viet
    Cong from advancing. While the most seriously wounded soldier was helped across
    the river, Sergeant. Davis protected the 2 remaining casualties until he could
    pull them across the river to the fire support base. Though suffering from painful
    wounds, he refused medical attention, joining another howitzer crew which fired
    at the large Viet Cong force until it broke contact and fled. Sergeant. Davis'
    extraordinary heroism, at the risk of his life, are in keeping with the highest
    traditions of the military service and reflect great credit upon himself and the
    U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 11
  day: 19
  year: 1967
  title: Chaplain (Maj.) Charles Joseph Watters earns Medal of Honor (posthumous)
  body: "<p>On November 19, 1967, Chaplain (Maj.) Charles Joseph Watters was moving
    with one of the companies in an assault in the vicinity of Dak To when it engaged
    a heavily armed enemy battalion. As casualties mounted, Watters, unarmed and exposed,
    moved among and in front of the advancing troops, aiding the wounded, encouraging
    the men, and giving last rites to the dying. When a wounded paratrooper stood
    in shock in front of the assaulting forces, Watters lifted him onto his shoulders
    and carried him to safety. At the first enemy entrenchment he ran through fire
    to aid a fallen comrade, and when the paratroopers pulled back for a second assault,
    he went between the two forces to recover two wounded soldiers.</p><p>After the
    battalion withdrew into a perimeter, Watters saw wounded soldiers lying outside
    it. Ignoring attempts to restrain him, he left the perimeter three times under
    fire to bring the injured to safety. He then helped the medics, bandaged wounds,
    and carried food and water from position to position. He was mortally wounded
    while giving aid to the wounded.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Charles Joseph Watters (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Chaplain Watters distinguished himself
    during an assault in the vicinity of Dak To. Chaplain Watters was moving with
    one of the companies when it engaged a heavily armed enemy battalion. As the battle
    raged and the casualties mounted, Chaplain Watters, with complete disregard for
    his safety, rushed forward to the line of contact. Unarmed and completely exposed,
    he moved among, as well as in front of the advancing troops, giving aid to the
    wounded, assisting in their evacuation, giving words of encouragement, and administering
    the last rites to the dying. When a wounded paratrooper was standing in shock
    in front of the assaulting forces, Chaplain Watters ran forward, picked the man
    up on his shoulders and carried him to safety. As the troopers battled to the
    first enemy entrenchment, Chaplain Watters ran through the intense enemy fire
    to the front of the entrenchment to aid a fallen comrade. A short time later,
    the paratroopers pulled back in preparation for a second assault. Chaplain Watters
    exposed himself to both friendly and enemy fire between the 2 forces in order
    to recover 2 wounded soldiers. Later, when the battalion was forced to pull back
    into a perimeter, Chaplain Watters noticed that several wounded soldiers were
    Lying outside the newly formed perimeter. Without hesitation and ignoring attempts
    to restrain him, Chaplain Watters left the perimeter three times in the face of
    small arms, automatic weapons, and mortar fire to carry and to assist the injured
    troopers to safety. Satisfied that all of the wounded were inside the perimeter,
    he began aiding the medics--applying field bandages to open wounds, obtaining
    and serving food and water, giving spiritual and mental strength and comfort.
    During his ministering, he moved out to the perimeter from position to position
    redistributing food and water, and tending to the needs of his men. Chaplain Watters
    was giving aid to the wounded when he himself was mortally wounded. Chaplain Watters'
    unyielding perseverance and selfless devotion to his comrades was in keeping with
    the highest traditions of the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:11Z'
- month: 11
  day: 20
  year: 1967
  title: Private First Class Carlos James Lozada earns Medal of Honor (posthumous)
  body: "<p>On November 20, 1967, Private First Class Carlos James Lozada was serving
    as a machine gunner with 1st platoon, Company A, in the battle of Dak To, as part
    of a 4-man early warning outpost 35 meters from his company's lines. At 1400 hours
    a North Vietnamese Army company approached along a well defined trail. Lozada
    alerted his comrades and opened fire on the enemy within 10 meters of the outpost,
    killing at least 20 North Vietnamese soldiers and disrupting their initial attack.
    He stayed in his exposed position despite his comrades' pleas to withdraw.</p><p>When
    the enemy also struck the forward west flank of Company A and the company was
    ordered to withdraw, Lozada told his comrades to move back while he stayed to
    cover them, with the enemy converging on 3 sides of his position. He kept firing
    until he was mortally wounded and had to be carried during the withdrawal. The
    citation states that his action served as an example to his comrades through the
    4-day battle that followed.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Carlos James Lozada (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Private First Class Lozada, U.S. Army,
    distinguished himself at the risk of his life above and beyond the call of duty
    in the battle of Dak To. While serving as a machine gunner with 1st platoon, Company
    A, Private First Class Lozada was part of a 4-man early warning outpost, located
    35 meters from his company's lines. At 1400 hours a North Vietnamese Army company
    rapidly approached the outpost along a well defined trail. Private First Class
    Lozada alerted his comrades and commenced firing at the enemy who were within
    10 meters of the outpost. His heavy and accurate machine gun fire killed at least
    20 North Vietnamese soldiers and completely disrupted their initial attack. Private
    First Class Lozada remained in an exposed position and continued to pour deadly
    fire upon the enemy despite the urgent pleas of his comrades to withdraw. The
    enemy continued their assault, attempting to envelop the outpost. At the same
    time enemy forces launched a heavy attack on the forward west flank of Company
    A with the intent to cut them off from their battalion. Company A was given the
    order to withdraw. Private First Class Lozada apparently realized that if he abandoned
    his position there would be nothing to hold back the surging North Vietnamese
    soldiers and that the entire company withdrawal would be jeopardized. He called
    for his comrades to move back and that he would stay and provide cover for them.
    He made this decision realizing that the enemy was converging on 3 sides of his
    position and only meters away, and a delay in withdrawal meant almost certain
    death. Private First Class Lozada continued to deliver a heavy, accurate volume
    of suppressive fire against the enemy until he was mortally wounded and had to
    be carried during the withdrawal. His heroic deed served as an example and an
    inspiration to his comrades throughout the ensuing 4-day battle. Private First
    Class Lozada's actions are in the highest traditions of the U.S. Army and reflect
    great credit upon himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 12
  day: 6
  year: 1967
  title: Chaplain (Capt.) Angelo J. Liteky earns Medal of Honor
  body: "<p>On December 6, 1967, Chaplain Angelo J. Liteky was serving with Company
    A, 4th Battalion, 12th Infantry, 199th Light Infantry Brigade, on a search and
    destroy operation when the company came under intense fire from a battalion size
    enemy force. Seeing 2 wounded men, he moved to within 15 meters of an enemy machine
    gun position, placing himself between the enemy and the wounded, and dragged them
    to the landing zone during a lull. The company rallied and returned fire. Liteky
    then moved upright through the fire, giving last rites to the dying and evacuating
    the wounded. He crawled to one trapped man, rolled him onto his chest, and pushed
    back to the landing zone on his elbows and heels; he freed another man from thorny
    underbrush and carried him out. Under fire, he stood and directed the medivac
    helicopters in and out.</p><p>The fighting continued until the unit was relieved
    on the morning of 7 December 1967. Despite wounds in the neck and foot, Liteky
    had carried over 20 men to the landing zone.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Angelo J. Liteky (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: Chaplain Liteky distinguished himself by exceptional heroism while
    serving with Company A, 4th Battalion, 12th Infantry, 199th Light Infantry Brigade.
    He was participating in a search and destroy operation when Company A came under
    intense fire from a battalion size enemy force. Momentarily stunned from the immediate
    encounter that ensued, the men hugged the ground for cover. Observing 2 wounded
    men, Chaplain Liteky moved to within 15 meters of an enemy machine gun position
    to reach them, placing himself between the enemy and the wounded men. When there
    was a brief respite in the fighting, he managed to drag them to the relative safety
    of the landing zone. Inspired by his courageous actions, the company rallied and
    began placing a heavy volume of fire upon the enemy's positions. In a magnificent
    display of courage and leadership, Chaplain Liteky began moving upright through
    the enemy fire, administering last rites to the dying and evacuating the wounded.
    Noticing another trapped and seriously wounded man, Chaplain Liteky crawled to
    his aid. Realizing that the wounded man was too heavy to carry, he rolled on his
    back, placed the man on his chest and through sheer determination and fortitude
    crawled back to the landing zone using his elbows and heels to push himself along.
    pausing for breath momentarily, he returned to the action and came upon a man
    entangled in the dense, thorny underbrush. Once more intense enemy fire was directed
    at him, but Chaplain Liteky stood his ground and calmly broke the vines and carried
    the man to the landing zone for evacuation. On several occasions when the landing
    zone was under small arms and rocket fire, Chaplain Liteky stood up in the face
    of hostile fire and personally directed the medivac helicopters into and out of
    the area. With the wounded safely evacuated, Chaplain Liteky returned to the perimeter,
    constantly encouraging and inspiring the men. Upon the unit's relief on the morning
    of 7 December 1967, it was discovered that despite painful wounds in the neck
    and foot, Chaplain Liteky had personally carried over 20 men to the landing zone
    for evacuation during the savage fighting. Through his indomitable inspiration
    and heroic actions, Chaplain Liteky saved the lives of a number of his comrades
    and enabled the company to repulse the enemy. Chaplain Liteky's actions reflect
    great credit upon himself and were in keeping with the highest traditions of the
    U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 12
  day: 8
  year: 1967
  title: Colonel Donald Gilbert Cook earns Medal of Honor (posthumous)
  body: "<p>On December 8, 1967, the period covered by the citation of Colonel (then
    Captain) Donald Gilbert Cook came to a close. The citation covers his internment
    as a Prisoner of War by the Viet Cong in the Republic of Vietnam from 31 December
    1964 to 8 December 1967. Although he was not in fact the senior prisoner, Cook
    established himself as such, knowing it would bring harsher treatment for himself.
    He gave more needy men his medicine and drug allowance and nursed them, risking
    infection from contagious diseases while his own health deteriorated.</p><p>Cook
    refused to stray from the Code of Conduct and would not negotiate for his own
    release or better treatment, frustrating Viet Cong attempts to break his spirit
    and passing that resolve on to the other prisoners. He knew his refusals would
    prevent his release before the end of the war and that his chances of prolonged
    survival were small. The citation states that he put the interests of his comrades
    before his own well-being and, eventually, his life.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Donald Gilbert Cook (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while interned as a Prisoner of War by the Viet Cong
    in the Republic of Vietnam during the period 31 December 1964 to 8 December 1967.
    Despite the fact that by so doing he would bring about harsher treatment for himself,
    Colonel (then Captain) Cook established himself as the senior prisoner, even though
    in actuality he was not. Repeatedly assuming more than his share of their health,
    Colonel Cook willingly and unselfishly put the interests of his comrades before
    that of his own well-being and, eventually, his life. Giving more needy men his
    medicine and drug allowance while constantly nursing them, he risked infection
    from contagious diseases while in a rapidly deteriorating state of health. This
    unselfish and exemplary conduct, coupled with his refusal to stray even the slightest
    from the Code of Conduct, earned him the deepest respect from not only his fellow
    prisoners, but his captors as well. Rather than negotiate for his own release
    or better treatment, he steadfastly frustrated attempts by the Viet Cong to break
    his indomitable spirit. and passed this same resolve on to the men whose well-being
    he so closely associated himself. Knowing his refusals would prevent his release
    prior to the end of the war, and also knowing his chances for prolonged survival
    would be small in the event of continued refusal, he chose nevertheless to adhere
    to a Code of Conduct far above that which could be expected. His personal valor
    and exceptional spirit of loyalty in the face of almost certain death reflected
    the highest credit upon Colonel Cook, the Marine Corps, and the United States
    Naval Service.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 12
  day: 15
  year: 1967
  title: Sergeant Allen James Lynch earns Medal of Honor
  body: "<p>On December 15, 1967, Sergeant Allen James Lynch (then Sp4c.) was serving
    as a radio telephone operator with Company D in the forward element of an operation
    near the village of My An when his unit became heavily engaged with a numerically
    superior enemy force. He gave his commander information that the citation calls
    essential to the unit's actions. Seeing 3 wounded comrades exposed to enemy fire,
    he crossed 50 meters of open ground to treat them, cleared a nearby trench by
    killing 2 enemy soldiers at point blank range, and returned to the fire-swept
    area 3 times to carry the wounded into it.</p><p>When his company was forced to
    withdraw, Lynch stayed with the wounded. Alone, he held his position for 2 hours
    with his rifle and a grenade, stopping the advancing enemy just short of his trench
    and killing 5. He then crossed 70 meters of exposed terrain 5 times to move the
    wounded to a more secure area, and located the counterattacking friendly company
    to help direct the attack and evacuate the 3 casualties.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Allen James Lynch (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sergeant. Lynch (then Sp4c.) distinguished
    himself while serving as a radio telephone operator with Company D. While serving
    in the forward element on an operation near the village of My An, his unit became
    heavily engaged with a numerically superior enemy force. Quickly and accurately
    assessing the situation, Sergeant. Lynch provided his commander with information
    which subsequently proved essential to the unit's successful actions. Observing
    3 wounded comrades Lying exposed to enemy fire, Sergeant. Lynch dashed across
    50 meters of open ground through a withering hail of enemy fire to administer
    aid. Reconnoitering a nearby trench for a covered position to protect the wounded
    from intense hostile fire, he killed 2 enemy soldiers at point blank range. With
    the trench cleared, he unhesitatingly returned to the fire-swept area 3 times
    to carry the wounded men to safety. When his company was forced to withdraw by
    the superior firepower of the enemy, Sergeant. Lynch remained to aid his comrades
    at the risk of his life rather than abandon them. Alone, he defended his isolated
    position for 2 hours against the advancing enemy. Using only his rifle and a grenade,
    he stopped them just short of his trench, killing 5. Again, disregarding his safety
    in the face of withering hostile fire, he crossed 70 meters of exposed terrain
    5 times to carry his wounded comrades to a more secure area. Once he had assured
    their comfort and safety, Sergeant. Lynch located the counterattacking friendly
    company to assist in directing the attack and evacuating the 3 casualties. His
    gallantry at the risk of his life is in the highest traditions of the military
    service, Sergeant. Lynch has reflected great credit on himself, the 12th Cavalry,
    and the U.S. Army. Back to Campaign Index   Top of page
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 12
  day: 21
  year: 1967
  title: Corporal Larry E. Smedley earns Medal of Honor (posthumous)
  body: "<p>On December 21, 1967, Corporal Larry E. Smedley, a squad leader with Company
    D, was in an ambush position at the mouth of Happy Valley, near Phouc Ninh (2)
    in Quang Nam Province, where he had led his 6-man squad on the evenings of 20-21
    December 1967. That night the squad saw an estimated 100 Viet Cong and North Vietnamese
    Army regulars carrying 122mm rocket launchers and mortars moving toward Hill 41
    to attack the Danang complex. Smedley radioed for a reaction force, moved his
    men to a better position, and led an attack on the larger enemy force.</p><p>An
    enemy machinegun on the squad's left flank inflicted several casualties, and a
    rifle grenade wounded Smedley in the right foot and knocked him down. He got up,
    encouraged his men, and led a charge on the machinegun with rifle fire and grenades
    until he was struck again. Weak from loss of blood, he rose and attacked the position
    alone, destroying the machinegun before he was struck in the chest and fell mortally
    wounded.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Larry E. Smedley (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a squad leader with company D, in
    connection with operations against the enemy. On the evenings of 20-21 December
    1967, Corporal. Smedley led his 6-man squad to an ambush site at the mouth of
    Happy Valley, near Phouc Ninh (2) in Quang Nam Province. Later that night an estimated
    100 Viet Cong and North Vietnamese Army regulars, carrying 122mm rocket launchers
    and mortars, were observed moving toward Hill 41. Realizing this was a significant
    enemy move to launch an attack on the vital Danang complex, Corporal. Smedley
    immediately took sound and courageous action to stop the enemy threat. After he
    radioed for a reaction force, he skillfully maneuvered his men to a more advantageous
    position and led an attack on the numerically superior enemy force. A heavy volume
    of fire from an enemy machinegun positioned on the left flank of the squad inflicted
    several casualties on Corporal. Smedley's unit. Simultaneously, an enemy rifle
    grenade exploded nearby, wounding him in the right foot and knocking him to the
    ground. Corporal. Smedley disregarded this serious injury and valiantly struggled
    to his feet, shouting words of encouragement to his men. He fearlessly led a charge
    against the enemy machinegun emplacement, firing his rifle and throwing grenades,
    until he was again struck by enemy fire and knocked to the ground. Gravely wounded
    and weak from loss of blood, he rose and commenced a l-man assault against the
    enemy position. Although his aggressive and singlehanded attack resulted in the
    destruction of the machinegun, he was struck in the chest by enemy fire and fell
    mortally wounded. Corporal. Smedley's inspiring and courageous actions, bold initiative,
    and selfless devotion to duty in the face of certain death were in keeping with
    the highest traditions of the Marine Corps and the U.S. Naval Service. He gallantly
    gave his life for his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 1
  day: 6
  year: 1968
  title: Corporal Jerry Wayne Wickam earns Medal of Honor (posthumous)
  body: "<p>On January 6, 1968, Corporal Jerry Wayne Wickam was serving with Troop
    F on a reconnaissance in force mission southwest of Loc Ninh when the lead element
    came under heavy rocket, automatic weapons, and small arms fire from a concealed
    enemy bunker complex. Wickam leaped from his armored vehicle, assaulted one bunker,
    and threw a grenade into it, killing 2 enemy soldiers. While removing a body from
    the bunker with another soldier, he heard an enemy grenade being charged, warned
    his comrade, and pushed him clear of the blast. When a second bunker was found
    he ran through enemy fire to fire into it, killing one soldier, and captured 1
    Viet Cong who later provided information on enemy activity in the Loc Ninh area.</p><p>After
    the patrol withdrew and an air strike was conducted, Wickam led his men back to
    evaluate the strike. They were attacked again. He charged the bunker directing
    the fire, allowing his men to find cover, and destroyed it with a grenade, killing
    2 Viet Cong. Moments later he was mortally wounded by enemy fire.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Jerry Wayne Wickam (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Corporal. Wickam, distinguished himself
    while serving with Troop F. Troop F was conducting a reconnaissance in force mission
    southwest of Loc Ninh when the lead element of the friendly force was subjected
    to a heavy barrage of rocket, automatic weapons, and small arms fire from a well
    concealed enemy bunker complex. Disregarding the intense fire, Corporal. Wickam
    leaped from his armored vehicle and assaulted one of the enemy bunkers and threw
    a grenade into it, killing 2 enemy soldiers. He moved into the bunker, and with
    the aid of another soldier, began to remove the body of one Viet Cong when he
    detected the sound of an enemy grenade being charged. Corporal. Wickam warned
    his comrade and physically pushed him away from the grenade thus protecting him
    from the force of the blast. When a second Viet Cong bunker was discovered, he
    ran through a hail of enemy fire to deliver deadly fire into the bunker, killing
    one enemy soldier. He also captured 1 Viet Cong who later provided valuable information
    on enemy activity in the Loc Ninh area. After the patrol withdrew and an air strike
    was conducted, Corporal. Wickam led his men back to evaluate the success of the
    strike. They were immediately attacked again by enemy fire. Without hesitation,
    he charged the bunker from which the fire was being directed, enabling the remainder
    of his men to seek cover. He threw a grenade inside of the enemy's position killing
    2 Viet Cong and destroying the bunker. Moments later he was mortally wounded by
    enemy fire. Corporal. Wickam's extraordinary heroism at the cost of his life were
    in keeping with the highest traditions of the military service and reflect great
    credit upon himself and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
- month: 1
  day: 6
  year: 1968
  title: Major Patrick Henry Brady earns Medal of Honor
  body: "<p>On January 6, 1968, Major Patrick Henry Brady, commanding a UH-1H ambulance
    helicopter, volunteered to rescue wounded men from a heavily defended, fog-covered
    site in enemy held territory. He descended through fog and smoke, hovered along
    a valley trail, and turned his ship sideways to blow the fog away with his rotor
    backwash. Under close-range enemy fire he found the small site, landed, and evacuated
    2 badly wounded South Vietnamese soldiers. Called to a second fog-covered site
    where American casualties lay 50 meters from the enemy, he made 4 flights and
    rescued all the wounded.</p><p>On his third mission Brady landed at a site surrounded
    by the enemy; his controls were partially shot away on his first entry, and he
    returned minutes later for the remaining injured. In a replacement aircraft he
    landed in an enemy minefield to reach a trapped platoon; a mine wounded 2 crewmembers
    and damaged the ship, but he flew 6 severely injured patients to medical aid.
    Over the day he used 3 helicopters to evacuate 51 seriously wounded men.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Patrick Henry Brady (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty, Maj. Brady distinguished himself while
    serving in the Republic of Vietnam commanding a UH-1H ambulance helicopter, volunteered
    to rescue wounded men from a site in enemy held territory which was reported to
    be heavily defended and to be blanketed by fog. To reach the site he descended
    through heavy fog and smoke and hovered slowly along a valley trail, turning his
    ship sideward to blow away the fog with the backwash from his rotor blades. Despite
    the unchallenged, close-range enemy fire, he found the dangerously small site,
    where he successfully landed and evacuated 2 badly wounded South Vietnamese soldiers.
    He was then called to another area completely covered by dense fog where American
    casualties lay only 50 meters from the enemy. Two aircraft had previously been
    shot down and others had made unsuccessful attempts to reach this site earlier
    in the day. With unmatched skill and extraordinary courage, Maj. Brady made 4
    flights to this embattled landing zone and successfully rescued all the wounded.
    On his third mission of the day Maj. Brady once again landed at a site surrounded
    by the enemy. The friendly ground force, pinned down by enemy fire, had been unable
    to reach and secure the landing zone. Although his aircraft had been badly damaged
    and his controls partially shot away during his initial entry into this area,
    he returned minutes later and rescued the remaining injured. Shortly thereafter,
    obtaining a replacement aircraft, Maj. Brady was requested to land in an enemy
    minefield where a platoon of American soldiers was trapped. A mine detonated near
    his helicopter, wounding 2 crewmembers and damaging his ship. In spite of this,
    he managed to fly 6 severely injured patients to medical aid. Throughout that
    day Maj. Brady utilized 3 helicopters to evacuate a total of 51 seriously wounded
    men, many of whom would have perished without prompt medical treatment. Maj. Brady's
    bravery was in the highest traditions of the military service and reflects great
    credit upon himself and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:22:25Z'
