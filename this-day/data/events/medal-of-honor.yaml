- month: 5
  day: 13
  year: 1969
  title: Major Kern W. Dunagan earns Medal of Honor
  body: "<p>On May 13, 1969, Major (then Captain) Kern W. Dunagan, commanding officer
    of Company A, was leading an attack to relieve pressure on the battalion's forward
    support base when his company came under intense fire from a well-entrenched enemy
    battalion. He repeatedly exposed himself to locate enemy positions, direct supporting
    artillery, and position his men. That evening he was seriously wounded in an enemy
    mortar attack but refused to leave the battlefield, supervising the evacuation
    of dead and wounded and leading his command as it disengaged.</p><p>The action
    continued through May 14. Dunagan twice risked heavy fire to rescue critically
    wounded men and was again seriously wounded. On the evening of May 14 he extricated
    his command and reached an adjacent friendly unit. Learning that a 6-man party
    from his company was under fire and had not reached the new perimeter, he went
    back, found one soldier critically wounded, and carried him on his shoulders to
    the friendly perimeter. He was evacuated only after all his wounded had been treated
    and removed.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Kern W. Dunagan (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Maj. (then Capt.) Dunagan distinguished
    himself during the period May 13 and 14, 1969, while serving as commanding officer,
    Company A. On May 13, 1969, Maj. Dunagan was leading an attack to relieve pressure
    on the battalion's forward support base when his company came under intense fire
    from a well-entrenched enemy battalion. Despite continuous hostile fire from a
    numerically superior force, Maj. Dunagan repeatedly and fearlessly exposed himself
    in order to locate enemy positions, direct friendly supporting artillery, and
    position the men of his company. In the early evening, while directing an element
    of his unit into perimeter guard, he was seriously wounded during an enemy mortar
    attack, but he refused to leave the battlefield and continued to supervise the
    evacuation of dead and wounded and to lead his command in the difficult task of
    disengaging from an aggressive enemy. In spite of painful wounds and extreme fatigue,
    Maj. Dunagan risked heavy fire on 2 occasions to rescue critically wounded men.
    He was again seriously wounded. Undaunted, he continued to display outstanding
    courage, professional competence, and leadership and successfully extricated his
    command from its untenable position on the evening of May 14. Having maneuvered
    his command into contact with an adjacent friendly unit, he learned that a 6-man
    party from his company was under fire and had not reached the new perimeter. Maj.
    Dunagan unhesitatingly went back and searched for his men. Finding 1 soldier critically
    wounded, Maj. Dunagan, ignoring his wounds, lifted the man to his shoulders and
    carried him to the comparative safety of the friendly perimeter. Before permitting
    himself to be evacuated, he insured all of his wounded received emergency treatment
    and were removed from the area. Throughout the engagement, Maj. Dunagan's actions
    gave great inspiration to his men and were directly responsible for saving the
    lives of many of his fellow soldiers. Maj. Dunagan's extraordinary heroism above
    and beyond the call of duty, are in the highest traditions of the U.S. Army and
    reflect great credit on him, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 5
  day: 13
  year: 1969
  title: Specialist Five James C. McCloughan earns Medal of Honor
  body: "<p>On May 13, 1969, Private First Class James C. McCloughan, a combat medic
    with Company C, 3d Battalion, 21st Infantry, 196th Light Infantry Brigade, Americal
    Division, air assaulted with his company into an area near Tam Ky and Nui Yon
    Hill. He ran 100 meters through heavy fire to rescue a comrade too injured to
    move. When 2d Platoon was ambushed by a large North Vietnamese Army force, he
    led two Americans into a trench, was wounded by rocket propelled grenade shrapnel,
    ignored a direct order to stay back, and entered the kill zone four more times
    to extract wounded.</p><p>The action continued through May 15. On May 14 he was
    wounded a second time while aiding two Soldiers in a rice paddy, then repeatedly
    entered the crossfire to extract wounded as two North Vietnamese Army companies
    and 700 Viet Cong soldiers attacked Company C from three sides. On May 15 he knocked
    out a rocket propelled grenade position with a grenade, kept two critically wounded
    Soldiers alive through the night, and organized the wounded for evacuation at
    daylight.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, James C. McCloughan (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Private First Class James C. McCloughan
    distinguished himself by acts of gallantry and intrepidity at the risk of his
    life above and beyond the call of duty from May 13 - 15, 1969, while serving as
    a combat medic with Company C, 3d Battalion, 21st Infantry, 196th Light Infantry
    Brigade, Americal Division. The company air assaulted into an area near Tam Ky
    and Nui Yon Hill. On May 13th, with complete disregard for his life, he ran 100
    meters in an open field through heavy fire to rescue a comrade too injured to
    move and carried him to safety. That same day, 2d Platoon was ordered to search
    the area near Nui Yon Hill when the platoon was ambushed by a large North Vietnamese
    Army force and sustained heavy casualties. With complete disregard for his life
    and personal safety, Private First Class McCloughan led two Americans into the
    safety of a trench while being wounded by shrapnel from a rocket propelled grenade.
    He ignored a direct order to stay back and braved an enemy assault while moving
    into the “kill zone” on four more occasions to extract wounded comrades. He treated
    the injured, prepared the evacuation, and though bleeding heavily from shrapnel
    wounds on his head and body, refused evacuation to safety in order to remain at
    the battle site with his fellow Soldiers who were heavily outnumbered by North
    Vietnamese Army forces. On May 14th, the platoon was again ordered to move out
    towards Nui Yon Hill. Private First Class McCloughan was wounded a second time
    by small arms fire and shrapnel from a rocket propelled grenade while rendering
    aid to two Soldiers in an open rice paddy. In the final phases of the attack,
    two companies from the 2d North Vietnamese Army Division and an element of 700
    soldiers from a Viet Cong regiment descended upon Company C’s position on three
    sides. Private First Class McCloughan, again with complete disregard for his life,
    went into the crossfire numerous times throughout the battle to extract wounded
    Soldiers, while also fighting the enemy. His relentless and courageous actions
    inspired and motivated his comrades to fight for their survival. When supplies
    ran low, Private First Class McCloughan volunteered to hold a blinking strobe
    light in an open area as a marker for a nighttime resupply drop. He remained steadfast
    while bullets landed all around him and rocket propelled grenades flew over his
    prone, exposed body. During the morning darkness of May 15th, Private First Class
    McCloughan knocked out a rocket propelled grenade position with a grenade, fought
    and eliminated enemy soldiers, treated numerous casualties, kept two critically
    wounded Soldiers alive during the night, and organized the dead and wounded for
    evacuation at daylight. His timely and courageous actions were instrumental in
    saving the lives of his fellow Soldiers. Private First Class McCloughan’s personal
    heroism, professional competence, and devotion to duty are in keeping with the
    highest traditions of the military service and reflect great credit upon himself,
    the Americal Division, and the United States Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 5
  day: 14
  year: 1969
  title: Private First Class Daniel John Shea earns Medal of Honor (posthumous)
  body: "<p>On May 14, 1969, Private First Class Daniel John Shea, Headquarters and
    Headquarters Company, 3d Battalion, was a medical aidman with Company C on a combat
    patrol mission. As the lead platoon crossed a rice paddy, a large enemy force
    in ambush positions opened fire with mortars, grenades and automatic weapons.
    Under crossfire from 3 sides, the platoon withdrew to a small island in the paddy
    and set up a defensive perimeter.</p><p>With a number of his comrades down, Shea
    dashed from the defensive position to assist the wounded. Under the fire sweeping
    the open paddy, he made 4 trips to tend wounded soldiers and carry them to the
    platoon position. Seeing a fifth wounded comrade directly in front of an enemy
    strong point, he ran to him, was grievously wounded on reaching him, tended him,
    and began moving him back toward the perimeter. As he neared the platoon position,
    Shea was mortally wounded by a burst of enemy fire. He saved the lives of several
    fellow soldiers.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Daniel John Shea (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Private First Class Shea, Headquarters
    and Headquarters Company, 3d Battalion, distinguished himself while serving as
    a medical aidman with Company C, 3d Battalion, during a combat patrol mission.
    As the lead platoon of the company was crossing a rice paddy, a large enemy force
    in ambush positions opened fire with mortars, grenades and automatic weapons.
    Under heavy crossfire from 3 sides, the platoon withdrew to a small island in
    the paddy to establish a defensive perimeter. Private First Class Shea, seeing
    that a number of his comrades had fallen in the initial hail of fire, dashed from
    the defensive position to assist the wounded. With complete disregard for his
    safety and braving the intense hostile fire sweeping the open rice paddy, Private
    First Class Shea made 4 trips to tend wounded soldiers and to carry them to the
    safety of the platoon position. Seeing a fifth wounded comrade directly in front
    of one of the enemy strong points, Private First Class Shea ran to his assistance.
    As he reached the wounded man, Private First Class Shea was grievously wounded.
    Disregarding his welfare, Private First Class Shea tended his wounded comrade
    and began to move him back to the safety of the defensive perimeter. As he neared
    the platoon position, Private First Class Shea was mortally wounded by a burst
    of enemy fire. By his heroic actions Private First Class Shea saved the lives
    of several of his fellow soldiers. Private First Class Shea's gallantry in action
    at the cost of his life were in keeping with the highest traditions of the military
    service and reflect great credit upon himself, his unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 5
  day: 21
  year: 1969
  title: Specialist Four Santiago J. Erevia earns Medal of Honor
  body: "<p>On May 21, 1969, Specialist Four Santiago J. Erevia, a radio telephone
    operator in Company C, 1st Battalion (Airmobile), 501st Infantry, 101st Airborne
    Division (Airmobile), was on a search and clear mission near Tam Ky, Republic
    of Vietnam. After the platoon breached an insurgent perimeter, he was designated
    to give first aid to several casualties while the platoon moved forward. He then
    came under intense fire from four bunkers to his left front.</p><p>Erevia crawled
    from one wounded man to another in full view of the enemy gunners, gathering ammunition.
    Armed with two M-16 rifles and several hand grenades, he charged the enemy positions
    behind his own suppressive fire. At the first bunker he dropped a grenade inside,
    mortally wounding the occupant and destroying it, then eliminated the next two
    positions the same way. With his grenades exhausted and still under fire from
    the fourth bunker, he charged behind the fire of his rifles and silenced the occupant
    at point blank range. His actions saved the lives of the wounded and relieved
    the Company Command Post.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Santiago J. Erevia (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: 'For conspicuous gallantry and intrepidity at the risk of his life
    above and beyond the call of duty: Specialist Four Santiago J. Erevia distinguished
    himself by acts of gallantry and intrepidity above and beyond the call of duty
    while serving as a radio telephone operator in Company C, 1st Battalion (Airmobile),
    501st Infantry, 101st Airborne Division (Airmobile) during search and clear mission
    near Tam Ky, Republic of Vietnam on May 21, 1969. After breaching an insurgent
    perimeter, Specialist Four Erevia was designated by his platoon leader to render
    first aid to several casualties, and the rest of the platoon moved forward. As
    he was doing so, he came under intense hostile fire from four bunkers to his left
    front. Although he could have taken cover with the rest of the element, he chose
    a retaliatory course of action. With heavy enemy fire directed at him, he moved
    in full view of the hostile gunners as he proceeded to crawl from one wounded
    man to another, gathering ammunition. Armed with two M-16 rifles and several hand
    grenades, he charged toward the enemy positions behind the suppressive fire of
    the two rifles. Under very intense fire, he continued to advance on the insurgents
    until he was near the first bunker. Disregarding the enemy fire, he pulled the
    pin from a hand grenade and advanced on the bunker, leveling suppressive fire
    until he could drop the grenade into the bunker, mortally wounding the insurgent
    and destroying the fortification. Without hesitation, he employed identical tactics
    as he proceeded to eliminate the next two enemy positions. With the destruction
    of the third bunker, Specialist Four Erevia had exhausted his supply of hand grenades.
    Still under intense fire from the fourth position, he courageously charged forward
    behind the fire emitted by his M-16 rifles. Arriving at the very edge of the bunker,
    he silenced the occupant within the fortification at point blank range. Through
    his heroic actions the lives of the wounded were saved and the members of the
    Company Command Post were relieved from a very precarious situation. His exemplary
    performance in the face of overwhelming danger was an inspiration to his entire
    company and contributed immeasurably to the success of the mission. Specialist
    Four Erevia’s conspicuous gallantry, extraordinary heroism, and intrepidity at
    the risk of his own life, above and beyond the call of duty, were in keeping with
    the highest traditions of military service and reflect great credit upon himself,
    his unit, and the United States Army. Citation represents Soldier''s rank at time
    of action. For more information on Specialist Four Santiago J. Erevia visit: https://www.army.mil/medalofhonor/valor24/recipients/erevia/'
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 5
  day: 24
  year: 1969
  title: Staff Sergeant James Leroy Bondsteel earns Medal of Honor
  body: "<p>On May 24, 1969, Staff Sergeant James Leroy Bondsteel was serving as a
    platoon sergeant with Company A near the village of Lang Sau. Company A was sent
    to assist a friendly unit under intense fire from a North Vietnamese Battalion
    in a fortified base camp. Bondsteel organized his platoon into combat teams and
    spearheaded the attack, destroying 4 enemy occupied bunkers. He then ran some
    200 meters under heavy fire to an adjoining platoon that had begun to falter,
    rallied it, assisted its wounded, and returned to his own sector with needed munitions.</p><p>At
    the front again, he destroyed 4 more bunkers and a machine gun. Wounded by an
    enemy grenade, he refused medical attention and neutralized 2 more bunkers. He
    then ran to the aid of a severely wounded officer, struck down an enemy soldier
    threatening the officer's life, and led his men through the entrenched enemy until
    the company was relieved. Over the 4-hour battle he destroyed 10 enemy bunkers
    and accounted for a large toll of the enemy, including 2 key enemy commanders.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, James Leroy Bondsteel (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. S/Sergeant. Bondsteel distinguished
    himself while serving as a platoon sergeant with Company A, near the village of
    Lang Sau. Company A was directed to assist a friendly unit which was endangered
    by intense fire from a North Vietnamese Battalion located in a heavily fortified
    base camp. S/Sergeant. Bondsteel quickly organized the men of his platoon into
    effective combat teams and spearheaded the attack by destroying 4 enemy occupied
    bunkers. He then raced some 200 meters under heavy enemy fire to reach an adjoining
    platoon which had begun to falter. After rallying this unit and assisting their
    wounded, S/Sergeant. Bondsteel returned to his own sector with critically needed
    munitions. Without pausing he moved to the forefront and destroyed 4 enemy occupied
    bunkers and a machine gun which had threatened his advancing platoon. Although
    painfully wounded by an enemy grenade, S/Sergeant. Bondsteel refused medical attention
    and continued his assault by neutralizing 2 more enemy bunkers nearby. While searching
    one of these emplacements S/Sergeant. Bondsteel narrowly escaped death when an
    enemy soldier detonated a grenade at close range. Shortly thereafter, he ran to
    the aid of a severely wounded officer and struck down an enemy soldier who was
    threatening the officer's life. S/Sergeant. Bondsteel then continued to rally
    his men and led them through the entrenched enemy until his company was relieved.
    His exemplary leadership and great personal courage throughout the 4-hour battle
    ensured the success of his own and nearby units, and resulted in the saving of
    numerous lives of his fellow soldiers. By individual acts of bravery he destroyed
    10 enemy bunkers and accounted for a large toll of the enemy, including 2 key
    enemy commanders. His extraordinary heroism at the risk of his life was in the
    highest traditions of the military service and reflect great credit on him, his
    unit, and the U.S. Army.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 5
  day: 27
  year: 1969
  title: Private First Class Jimmy W. Phipps earns Medal of Honor (posthumous)
  body: "<p>On May 27, 1969, Private First Class Jimmy W. Phipps, a combat engineer
    with Company B, was a member of a 2-man combat engineer demolition team assigned
    to locate and destroy enemy artillery ordnance and concealed firing devices. After
    expending his explosives and blasting caps, he discovered a 175mm high explosive
    artillery round in a rice paddy. Suspecting the enemy had attached a secondary
    explosive device, he warned other marines in the area to move to covered positions
    and prepared to destroy the round with a hand grenade.</p><p>As he was attaching
    the grenade to a stake beside the round, the fuse of the enemy's secondary device
    ignited. His assistant and the platoon commander were within a few meters of him,
    and the explosion could have killed all 3 men. Phipps grasped the hand grenade
    to his chest and dived forward to cover the enemy explosive and the artillery
    round with his body, shielding his companions and absorbing the full impact. He
    was killed, and the 2 marines were saved.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Jimmy W. Phipps (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations26.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity at the risk of his life above
    and beyond the call of duty while serving as a combat engineer with Company B
    in connection with combat operations against the enemy. Private First Class Phipps
    was a member of a 2-man combat engineer demolition team assigned to locate and
    destroy enemy artillery ordnance and concealed firing devices. After he had expended
    all of his explosives and blasting caps, Private First Class Phipps discovered
    a 175mm high explosive artillery round in a rice paddy. Suspecting that the enemy
    had attached the artillery round to a secondary explosive device, he warned other
    marines in the area to move to covered positions and prepared to destroy the round
    with a hand grenade. As he was attaching the hand grenade to a stake beside the
    artillery round, the fuse of the enemy's secondary explosive device ignited. Realizing
    that his assistant and the platoon commander were both within a few meters of
    him and that the imminent explosion could kill all 3 men, Private First Class
    Phipps grasped the hand grenade to his chest and dived forward to cover the enemy's
    explosive and the artillery round with his body, thereby shielding his companions
    from the detonation while absorbing the full and tremendous impact with his body.
    Private First Class Phipps' indomitable courage, inspiring initiative, and selfless
    devotion to duty saved the lives of 2 marines and upheld the highest traditions
    of the Marine Corps and the U.S. Naval Service. He gallantly gave his life for
    his country.
  summarized_by: Claude Fable 5.1
  summarized_at: '2026-10-25T14:23:12Z'
- month: 5
  day: 27
  year: 1969
  title: Sergeant Charles Clinton Fleek earns Medal of Honor (posthumous)
  body: "<p>On May 27, 1969, Sergeant Charles Clinton Fleek was serving as a squad
    leader in Company C during an ambush operation. His unit was deployed in ambush
    locations when a large enemy force approached the position. The leading enemy
    element sensed the ambush, halted, and started to withdraw. Fleek opened fire
    at once and directed the fire of his men on the numerically superior enemy force.</p><p>During
    the battle that followed, an enemy soldier threw a grenade into the squad position.
    Realizing that his men had not seen it, and although he was in a position to seek
    cover, Fleek shouted a warning to his comrades and threw himself onto the grenade,
    absorbing its blast. The citation states that his action saved the lives or prevented
    the injury of at least 8 of his fellow soldiers.</p>"
  photo_url:
  photo_alt:
  references:
  - label: Medal of Honor citation, Charles Clinton Fleek (U.S. Army, army.mil)
    url: https://www.army.mil/medalofhonor/citations25.html
  status: approved
  source_text: For conspicuous gallantry and intrepidity in action at the risk of
    his life above and beyond the call of duty. Sergeant. Fleek distinguished himself
    while serving as a squad leader in Company C, during an ambush operation. Sergeant.
    Fleek's unit was deployed in ambush locations when a large enemy force approached
    the position. Suddenly, the leading enemy element, sensing the ambush, halted
    and started to withdraw. Reacting instantly, Sergeant. Fleek opened fire and directed
    the effective fire of his men upon the numerically superior enemy force. During
    the fierce battle that followed, an enemy soldier threw a grenade into the squad
    position. Realizing that his men had not seen the grenade, Sergeant. Fleek, although
    in a position to seek cover, shouted a warning to his comrades and threw himself
    onto the grenade, absorbing its blast. His gallant action undoubtedly saved the
    lives or prevented the injury of at least 8 of his fellow soldiers. Sergeant.
    Fleek's gallantry and willing self-sacrifice were in keeping with the highest
    traditions of the military service and reflect great credit on himself, his unit,
    and the U.S. Army.
  summarized_by: Claude Fable 5.1
