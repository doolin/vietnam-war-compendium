- month: 7
  day: 20
  year: 1964
  title: "Three VC companies attack Cái Bè"
  body: "<p>On July 20, 1964, three VC companies from the 261st, 263rd, and 514th Battalions attacked Cái Bè, killing 12 Popular Force soldiers, ten women and 30 children.</p>\n<p>The ARVN deployed five battalions to engage the VC. The 6th and 8th Airborne Battalions saw intense fighting and lost 13 killed and 52 wounded. VC losses were 46 killed and 12 captured.</p>"
