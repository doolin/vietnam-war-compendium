  year: 1964
  title: "VC ambush a Ranger convoy on Highway 13"
  body: "<p>On July 13, 1964, the VC ambushed an ARVN Ranger convoy on Highway 13 in Bình Long Province, 45 miles north of Saigon. The Rangers were moving to support another Ranger unit. Sixteen Rangers and three U.S. advisers were killed, and 19 Rangers were missing.</p>\n"
