- month: 7
  day: 15
  year: 1966
  title: "Marines open the Ngan Valley assault of Operation Hastings"
  body: "<p>On July 15, 1966, the Marine penetration of the Ngan Valley began in Operation Hastings. Allied commanders believed the 90th NVA Regiment was using the valley as a major infiltration route into Quang Tri. A-4 Skyhawks from MAG-12 and F4-B Phantoms from MAG-11 bombed and napalmed the two helicopter landing zones. After 20 minutes of artillery preparation fire, 20 CH-46 Sea Knight helicopters brought the first wave of the 3d Battalion, 4th Marines into Landing Zone Crow, five miles northeast of the Rockpile.</p>\n<p>The Marines met no initial resistance, but the landing zone was small. Two helicopters collided and crashed, and a third hit a tree trying to avoid them; two Marines were killed and seven injured. That evening the North Vietnamese shot down another troop-laden helicopter near Lieutenant Colonel Vale's CP, killing 13 men and injuring three others. Thereafter the Marines called the Ngan Valley \"Helicopter Valley.\"</p>\n"
  photo_url: null
  photo_alt: null
  references:
    - label: "Shulimson, \"U.S. Marines in Vietnam: An Expanding War 1966\", History and Museums Division, Headquarters, U.S. Marine Corps, 1982, pp. 163–165"
      url: "https://www.usmcu.edu/Portals/218/US%20Marines%20in%20Vietnam%20An%20Expanding%20War%201966%20%20PCN%2019000308600.pdf"
    - label: "Wikipedia, \"1966 in the Vietnam War\", revision 1380091905 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1966_in_the_Vietnam_War&oldid=1380091905"
  status: "draft"
  source_text: "[Shulimson, An Expanding War 1966, p. 163 (PDF p. 177)] After studying the available intelligence based o n\nthe air and ground reconnaissance, the allied commanders determined that the 90th NVA Regiment ,\nestimated at a strength of 1,500 men was using th e\nNgan Valley as one of its major infiltration routes in to Quang Tri .\n[...]\nEnglish's concept of operations called for a two battalion helicopter assault in the Ngan Valley .\nLieutenant Colonel Vale's 3d Battalion, 4th Marine s\nwas to land in the southwestern sector of the valle y\n[Shulimson, An Expanding War 1966, p. 164 (PDF p. 178)] On the morning of 15 July, the Marine penetration of the Ngan Valley began . A-4 Skyhawks fro m\nMAG-12 joined F4-B Phantoms from MAG-11 ,\nbombing and napalming the two helicopter landing\nzones .* Once the Marine attack aircraft had completed their bombing runs, Morrow's artillery fire d\nan opening salvo at 0725 on Landing Zone Crow, th e\nobjective of the 3d Battalion, 4th Marines . After 2 0\nminutes of preparation fire, 20 CH-46 Sea Knigh t\nhelicopters from HMM-164 and -165 brought th e\nfirst wave of Marines into Crow, five miles northeas t\nof the Rockpile .\nAlthough the Marines met no initial resistance i n\nthe landing zone, small arms fire and the terrain ;\ntook their toll of men and machines . The landing\nzone was small ; two helicopters collided and crash ed . A third CH-46 hit a tree while trying to avoid th e\nfirst two . As a result of these collisions, two Marine s\nwere dead and seven were injured . All three\nhelicopters were too badly damaged for recovery an d\nwould have to be destroyed . Later that evening, th e\nNorth Vietnamese shot down another troop-lade n\nhelicopter, which fell near Lieutenant Colonel Vale's\n[Shulimson, An Expanding War 1966, p. 165 (PDF p. 179)] CP, killing 13 men and injuring three others .\nThereafter, the Marines referred to the Ngan Valley\nas \"Helicopter Valley .\"13*\n[Wikipedia, 1966_in_the_Vietnam_War, rev 1380091905] Operation Hastings was conducted by the 3rd Marine Division and ARVN 1st Division to push the PAVN 324B Division back across the DMZ. The operation resulted in 700+ PAVN killed and 17 captured and 126 Marines and 21 ARVN killed.\n"
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T18:00:00Z"
- month: 7
  day: 16
  year: 1970
  title: "7th Marines open Operation Pickens Forest"
  body: "<p>On July 16, 1970, D-Day for Operation Pickens Forest, CH-46s and CH-53s of MAG-16 carried Marines, artillery, and supplies into the Thu Bon River Valley southwest of Da Nang. Two battalions of the 7th Marines, under Lieutenant Colonel Charles G. Cooper and Lieutenant Colonel Vincent A. Albers, Jr., set out to locate and destroy NVA forces, supplies, and installations in the highlands.</p>\n<p>Company C, 1st Battalion, 5th Marines, took position on Fire Support Base Defiant at about 0800, and Battery G's howitzers followed. Other companies landed at FSB Mace, near FSB Dart, and along the Thu Bon. The enemy offered no opposition, and by 1500 the entire attack force was in its planned positions.</p>\n<p>The operation ended on August 24. The 7th Marines killed 99 North Vietnamese and Viet Cong at a cost of four Marines dead and 51 wounded.</p>\n"
  photo_url: null
  photo_alt: null
  references:
    - label: "Cosmas, \"U.S. Marines in Vietnam: Vietnamization and Redeployment, 1970–1971\", History and Museums Division, Headquarters, U.S. Marine Corps, 1986, pp. 72–77"
      url: "https://www.usmcu.edu/Portals/218/US%20Marines%20In%20Vietnam%20Vietmanization%20and%20Redeployment%201970-1971%20PCN%2019000309600.pdf"
    - label: "Wikipedia, \"1970 in the Vietnam War\", revision 1377614479 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1970_in_the_Vietnam_War&oldid=1377614479"
  status: "draft"
  source_text: "[Cosmas, Vietnamization and Redeployment 1970–1971, p. 72 (PDF p. 87)] Pickens Forest would be what the 1st Marine Division defined as a Category III operation, \"designe d\nto locate and destroy NVA forces, supplies and installations in the highlands before they can interfer e\nwith pacification . . . .\n[...]\nThe scheme of maneuver centered around a triangle of hilltop fire support bases (FSBs) : Defiant, jus t\n[...]\nThe 7th Marines committed two of its battalions\nto the operation, the 1st under Lieutenant Colone l\nCharles G. Cooper and the 2d under Lieutenant Colonel Vincent A . Albers, Jr.\n[...]\nEarly in the morning of 16 July, D-Day for Picken s\nForest, CH-46s and CH-53s of MAG-16 loaded wit h\nMarines, artillery, and supplies descended on their initial objectives . At about 0800, the Pacifier unit, Company C, 1st Battalion, 5th Marines, took position o n\nFSB Defiant . Thirty minutes later, the first thre e\nhowitzers of Battery G were landed, followed shortl y\nby the rest of the battery and Colonel Derning' s\nregimental command post . About at the same time ,\nCompany B of the 1st Battalion dropped into LZ Blue jay just north of Defiant on the west bank of the Th u\nBon, and Company E, 2d Battalion, deployed at LZ\n[Cosmas, Vietnamization and Redeployment 1970–1971, p. 73 (PDF p. 88)] THE SUMMER CAMPAIGN IN QUANG NAM, JULY SEPTEMBER 1970\n[...]\nThree Marines of Company B, 1st Battalion, 7th Marines search the high grass in th e\nThu Bon River Valley southwest of Da Nang for the enemy during Operation Picken s\nForest . Starting in early July 1970, Pickens Forest was the first named operation of the year .\nStarling, about two miles south of Defiant on the east\nside of the river .\nAbout 0930, the 1st Battalion command group with\nCompanies C and D and four mortars of Battery W\nbegan landing at FSB Mace, while the 2d Battalio n\nCP and four more mortars of Battery W occupied Dart ,\nand Companies F and G landed just to the south in\nLZ Robin to achieve surprise.\n[...]\nBy\n1500 on the 16th, the entire attack force, brought i n\nby helicopters, had moved into its planned positions .\n[...]\nAs the Marines had expected, the enemy offered n o\nopposition to their landings .\n[Cosmas, Vietnamization and Redeployment 1970–1971, p. 76 (PDF p. 91)] As previously planned, the CP and all four companies were airlifted back to the 7th Marines' TAOR o n\nthe 24th while the artillery displaced to rejoin thei r\nparent units at FSB Ross and LZ Baldy. With these\nmovements, Operation Pickens Forest came to an end .\n[Cosmas, Vietnamization and Redeployment 1970–1971, p. 77 (PDF p. 92)] 3,500,000 pounds of cargo for the 7th Marines betwee n\n16 July and 24 August .\n[...]\nDuring Pickens Forest, the 7th Marines killed a total of 99 North Vietnamese and Viet Cong at a cos t\nof four Marines dead and 51 wounded .\n[Wikipedia, 1970_in_the_Vietnam_War, rev 1377614479] The 1st Marine Division launched Operation Pickens Forest to attack PAVN base areas in the mountains of Quảng Nam Province. The operation resulted in 99 PAVN killed; Marine losses were four killed.\n"
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T18:00:00Z"
- month: 7
  day: 17
  year: 1973
  title: "Schlesinger testifies to 3500 bombing raids into Cambodia"
  body: "<p>On July 17, 1973, Secretary of Defense James Schlesinger testified before the U.S. Senate Armed Forces Committee, which had begun hearings the day before into the secret bombing of Cambodia during 1969-70. Schlesinger testified that 3500 bombing raids had been launched into Cambodia to protect American troops by targeting NVA positions.</p>\n<p>The extent of Nixon's secret bombing campaign angered many in Congress and resulted in the first call for Nixon's impeachment. U.S. bombing activities in Cambodia were halted on August 14, 1973, in accordance with the Congressional ban resulting from the Case-Church amendment.</p>"
