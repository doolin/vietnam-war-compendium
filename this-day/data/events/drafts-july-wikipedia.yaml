- month: 7
  day: 31
  year: 1967
  title: "Gallup poll finds 52% disapprove of Johnson's handling of the war"
  body: "<p>On July 31, 1967, a Gallup poll showed that 52% of the U.S. public disapproved of Johnson's handling of the war. The poll found that 56% thought the U.S. was losing ground or stalled, and 42% thought it was a mistake to have sent troops into South Vietnam.</p>"
