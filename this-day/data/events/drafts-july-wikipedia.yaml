  source_text: "[Wikipedia, 1965_in_the_Vietnam_War, rev 1370279555] The VC again attacked Ba Gia. Before dawn they wheeled 75mm howitzers up to the post's perimeter. The guns blasted the fort as several battalions swept over the parapet. The VC quickly overran the garrison — an infantry battalion, a scout company, and a 105mm platoon before allied air power could arrive. ARVN losses were 21 dead, 88 missing and 224 infantry weapons and two howitzers lost.\n"
