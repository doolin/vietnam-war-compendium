- month: 7
  day: 21
  year: 1966
  title: "1st Brigade, 101st Airborne opens Operation JOHN PAUL JONES"
  body: "<p>On July 21, 1966, the 1st Brigade, 101st Airborne Division, began Operation JOHN PAUL JONES in Phu Yen Province. In Phase I, General Pearson's men secured Vung Ro Pass and Highway 1 to protect engineer parties constructing a new port at Vung Ro Bay, which was to relieve some of the logistical strain on nearby Tuy Hoa. The operation was the first test of Pearson's small-unit \"semi-guerrilla tactics,\" which emphasized night operations and long-range reconnaissance patrols.</p>\n<p>By month's end, convinced there were few enemy forces in the area, Pearson moved most of the brigade north to Tuy Hoa to protect the rice harvest. Later phases, opened by B-52 strikes on August 2, met light resistance or found nothing. Frustrated by the lack of results, Pearson ended the operation on September 5. Small engagements produced a tally of 209 enemy killed by body count and another 135 by estimate. American casualties totaled 23 killed and 132 wounded.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Carland, \"Combat Operations: Stemming the Tide, May 1965 to October 1966\", Center of Military History, United States Army, 1999, pp. 250-253"
