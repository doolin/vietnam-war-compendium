- month: 7
  day: 29
  year: 1972
  title: "Air Force Phantom crews down two MIG-21s"
  body: "<p>On July 29, 1972, U.S. Air Force crews destroyed two MIG-21s over North Vietnam. Lt. Col. Carl G. Baily and his weapon systems officer, Capt. Jeffrey S. Feinstein, of the 13th TFS, 432d TRW, were flying lead in a four-ship F-4 MIGCAP formation protecting forces attacking targets on the Northeast Railway near Kep airfield. Baily fired AIM-7 missiles at a MIG in a descending turn, and two of them burst into a large fireball. It was Feinstein's fourth aerial victory.</p>\n<p>A second crew, Lt. Col. Gene E. Taft and his WSO, Capt. Stanley M. Imaye, of the 4th TFS, 366th TFW, also destroyed a MIG-21 that morning. Escorting a chaff force in an F-4E, they maneuvered behind a MIG that had got in firing position behind two F-4s and fired one AIM-7; the MIG's wing appeared to separate and it rolled uncontrollably. Turning away, the crew saw an F-4 out of control, on fire, in an inverted flat spin; two good chutes were noted before it impacted on a mountainside.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Futrell, \"United States Air Force in Southeast Asia 1965-1973: Aces and Aerial Victories\", Air University, Headquarters USAF, 1976, pp. 99-102"
      url: "https://media.defense.gov/2010/Sep/21/2001329821/-1/-1/0/AFD-100921-010.pdf"
    - label: "Wikipedia, \"1972 in the Vietnam War\", revision 1372115736 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1972_in_the_Vietnam_War&oldid=1372115736"
  status: "draft"
  source_text: "[Futrell, Aces and Aerial Victories, p. 99] Baily and Feinstein repeated their performance on\n29 July with another MIG-2 1. They were flying lead\nin a four-ship F-4 MIGCAP formation which was\nsent into North Vietnam during the early morning\nhours to protect forces attacking targets on the\nNortheast Railway near Kep airfield. Feinstein describes his fourth aerial victory:\n\n[Futrell, Aces and Aerial Victories, p. 99, of 18 July] This one fell victim to Lt. Col. Carl G.\nBaily and his WSO, Capt. Jeffrey S. Feinstein, of\nthe 13th TFS, 432d TRW.\n\n[Futrell, Aces and Aerial Victories, p. 100] At about 4 miles, Lieutenant Kirchner and Captain Rogers had visual contact with a silver MIG\nand called his position in front of the flight as the\nMIG went into a descending turn. At 02192,\nColonel Baily began firing AIM-7 missiles. The\nfirst missile did not ignite. The second and third\nmissiles ripple-fired at 0219:lOZ at 2% miles\nrange, guided down and to the left, bursting into a\nlarge fireball at 0219:15Z.\n\n[Futrell, Aces and Aerial Victories, pp. 100-101] The same morning Lt. Col. Gene E.Taft and his\nWSO, Capt. Stanley M. Imaye of the 4th TFS,\n366th TFW, also destroyed a MIG-21. Flying an\nF 4 E , they were escorting a chaff force deep into\nNorth Vietnam when surface-to-air missiles and\nMIG-21's threatened the strike force. The two chaff\nflights withdrew from the strike area while the two\nF 4 escort flights engaged the MIG's. One got in\nfiring position behind two of the F 4 ' s , and Taft and\nImaye maneuvered their aircraft behind the MIG\nbefore he could fire.\n...\nOne AIM-7 left the aircraft and\ntracked smoothly to the MIG. Missile detonation\nwas observed and simultaneously the MIG's wing\nappeared to separate, fire was observed out of the\nwing, and the MIG rolled uncontrollably. No\nchute was observed. No impact was observed.\nAfter detonation occurred, our flight rolled off in\na fairly tight descending turn. After approximately 150\" of turn, an F-4 was observed, out of\ncontrol, on fire, in an inverted flat spin on the\ninside of our aircraft. Approximately 5 seconds\nlater two good chutes were noted, and the aircraft\nimpacted on a mountainside.\n\n[Futrell, Aces and Aerial Victories, p. 102] There\nwas a competition being waged between Ritchie and\nFeinstein, and the latter had tallied his fourth MIG\nvictory on 29 July.\n\n[Wikipedia, 1972_in_the_Vietnam_War, rev 1372115736] USAF jets shot down two VPAF MiG-21s."
  summarized_by: "Claude Opus 5.5"
