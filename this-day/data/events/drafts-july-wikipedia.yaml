- month: 7
  day: 5
  year: 1965
  title: "VC overrun the Ba Gia garrison"
  body: "<p>On July 5, 1965, the VC again attacked Ba Gia. Before dawn they wheeled 75mm howitzers up to the post's perimeter. The guns blasted the fort as several battalions swept over the parapet. The VC quickly overran the garrison, an infantry battalion, a scout company, and a 105mm platoon, before allied air power could arrive.</p>\n<p>ARVN losses were 21 dead and 88 missing. The garrison also lost 224 infantry weapons and two howitzers.</p>\n"
