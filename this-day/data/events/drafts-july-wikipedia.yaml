  status: "draft"
  source_text: "[Wikipedia, 1968_in_the_Vietnam_War, rev 1370342410] Trương Đình Dzu an unsuccessful candidate in the 1967 Presidential election was sentenced to five years imprisonment by a Special Military Court for proposing the formation of a coalition government to end the war."
