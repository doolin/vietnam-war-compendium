  source_text: "[Carland, Stemming the Tide, p. 250] The changing troop s ituation on th e coast, although promis in g, did\nlittl e to a lter th e mi ss ion of the unit responsib le for Phu Yen Provinceth e 1st Brigade, 101st Airborne Divis ion. Although sa ti sfied w ith hi s\nunit's kills s ince January, when it ha d arr ived to protec t the rice h arvest,\nGenera l Pearson believed that he need ed to acqu ire ta rgets more efficientl y a nd to react more qu ick ly when ever the en em y appeared. He\nwa nted hi s men to use sma ll unit \"se mi -g uerrilla tac tics\" tha t emph asized night opera tions and the agg ress ive e mploymen t of long-range\nreconnaissance patrols to find the Viet Con g and North Vietnamese.\n\n[Carland, Stemming the Tide, p. 251] The test o f Genera l Pearson 's ideas came during the 1st Brigade's\ntwo major opera ti ons in the s ummer and fall . The first, JOH N PAU LJONES,\nhad three objectives and three phases. Phase I commenced on 21 July,\nwhen Pearson's m en sec ured Vung Ro Pass and Highway 1 to protect\nengineer parties cons tru cting a new port at Vung Ro Bay. MACV wanted\nthe new facility to relieve some of the logistical s tra in on nearby Tuy\nHoa, particularly when the northeast m onsoon buffeted the coas t. But\nby m onth's end Pearson was convinced tha t there were few enemy forces\nin the area, so he slipped most of the brigade northward to Tuy Hoa,\nfreeing the South Korean 2d Marine Brigade for its shift into I Corps.\nHis para troopers would protect the next rice harvest in the Tuy Hoa\nValley.\n\n[Carland, Stemming the Tide, p. 252] Phase II of JOHN PAUL JONES bega n on 2 Aug us t, w hen B-52s hit the\nmountains west and southwes t of the tow n o f Song Ca u abo ut fo rty\nkilom ete rs north of Tu y H oa. Twenty minutes a fte r the last explosion\nLt. Co l. Fra nk L. Di etrich 's 2d Ba ttalion , 502d Infantry, scoured the terrain but, finding n o en em y, re turn ed to base the n ex t d ay. On the eighth\nmore B-52s p ounded susp ected emplace ments w es t of the Sp ecia l Forces\nca mp a t Don g Tre. Th e sm oke h ad n o t ye t clea red w h en Lt. Col. Joseph\nE. Co llins' 1s t Ba ttalion, 327th Infantry, he li coptered to the n orthern\np orti on o f the ta rget area and swept so uth, m eeting light resista nce a nd\ncapturing eight prisoners, including a captain from the 5th PAV N Divisio n.\n\n[Carland, Stemming the Tide, pp. 252-253] Begin ning on 17 A ug us t, they searched the a dj acent Ky Lo Va lley and th e area\na round Don g Tre, but fo und little.\n...\nMI KE force formed a cordon to the so uth and so uthwes t. Once again th ey\n\nfound nothing. Frustrated by the lack of results, Pea rson te rmina ted J OHN\nPAU LJ ONES on 5 SeptemberS\nDespite his disappointment, Pea rson 's stay-behind ta ctics had res u lted in enough s mall en gagements during the operation to tally 209\nen e my killed by body count and another 135 by es timate, many of la tter\nfrom ail' s trikes. American casualti es totaled 23 killed and 132 wounded.\n\n[Wikipedia, 1966_in_the_Vietnam_War, rev 1380091905] Operation John Paul Jones was conducted by the 1st Brigade, 101st Airborne Division in Phú Yên Province. The operation resulted in 209 VC and 23 U.S. killed."
