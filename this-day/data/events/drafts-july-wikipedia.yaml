  status: "draft"
  source_text: "[Whitlow, The Advisory and Combat Assistance Era, 1954–1964, p. 157 (PDF p. 167); two-column OCR text, lines reassembled in reading order, each line verbatim]\nelement was called upon to helilift urgently needed\nreinforcements to the Nam Dong CIDG camp\nwhich had come under heavy Communist attack.\nSituated in south central Thua Thien Province\nat a point where two prominent mountain valleys\nconverge, Nam Dong held special strategic appeal\nto both sides engaged in the struggle for South\nVietnam. It sat astride natural infiltration routes\nfrom Laos into the lowlands around Da Nang and\nPhu Bai and also protected some 5,000 Montagnard\ntribesmen who occupied a string of villages along\nthe valley floor. The camp and the villages were\ndefended by only a handful of U.S. Special Forces\npersonnel and three CIDG companies, none of\nwhich could muster more than 90 men. Its status\n[...]\nNam Dong's hour of crisis came shortly after\nmidnight on 7 July when the Communists launched\na large-scale ground assault against the barbed\nwire-enclosed main camp. Shortly after 0400, with\nhis position holding out against heavy mortar and\nmachine gun fire, Captain Roger H. Donlon, the\nSpecial Forces officer in charge, radioed for assist-\nance. Two hours later, six Marine helicopters,\nloaded with U.S. Special Forces and South Vietna-\nmese personnel, launched from Da Nang for the\n[...]\nIntense enemy mortar and ground fire at Nam\nDong initially prevented the six HU—34Ds from\nlanding the reinforcements, whereupon Colonel\n[Whitlow, The Advisory and Combat Assistance Era, 1954–1964, p. 158 (PDF p. 168)]\nground fire to diminish somewhat. At 0945, a\nflight of 18 Marine helicopters, led by Lieutenant\nColonel Curtis and escorted by four UH—1B gunships and two VNAF Skyraiders, began landing\na 93-man relief force which had been collected\nearlier from Da Nang and An Diem. Evacuation\n[...]\nreturn trip. By then, the battle was finished. Two\nAmericans, one Australian advisor, and 55 South\nVietnamese had been killed. Captain Donlon, who\nearned the first Medal of Honor awarded for action\nin Vietnam, and 64 other defenders had been\nwounded. The Viet Cong, who had failed to\neliminate the Nam Dong outpost, left 62 bodies on\nthe battlefield.*\n[Wikipedia, 1964_in_the_Vietnam_War, rev 1370342430] The Battle of Nam Dong was fought when the VC attacked the Nam Dong CIDG camp in an attempt to overrun it. The VC lost 62 killed, the ARVN 57 killed, the U.S. two killed and Australian Warrant Officer Class Two Kevin Conway was killed, the first Australian battle casualty of the war.\n"
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T18:00:00Z"
- month: 7
  day: 9
  year: 1966
  title: "Viet Cong strike a bait convoy on the Minh Thanh Road"
  body: "<p>On July 9, 1966, Task Force DRAGOON left An Loc airfield at 0700 for Minh Thanh. General DePuy, certain that a Viet Cong spy or sympathizer on the Binh Long province chief's staff was leaking information, had made sure the staff heard that construction equipment would move to Minh Thanh airfield that day. The task force, Company B, 1st of the 2d Infantry, and Troops B and C, 1st of the 4th Cavalry, was the bait.</p>\n<p>Around 1100 Troop C bumped into an L-shaped ambush about four kilometers from the Minh Thanh Rubber Plantation. Most of the 272d Regiment had deployed along the L's stem, north of the road. Artillery, air strikes, and gunships hit both sides of the road. By 1230 the Viet Cong realized a successful assault was impossible, and an hour later they were withdrawing.</p>\n<p>The 1st Division killed 238 Viet Cong by body count. The enemy killed 25 Americans, wounded 113, and destroyed four armored personnel carriers, two helicopters, and a tank.</p>\n"
