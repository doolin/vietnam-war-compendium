- month: 7
  day: 25
  year: 1969
  title: "Nixon tells newsmen in Guam that Asian nations must handle their own defense"
  body: "<p>On July 25, 1969, President Richard Nixon spoke informally with newsmen in Guam, in remarks given for attribution but not direct quotation. Asked about U.S. military relationships in Asia, he said the United States should be emphatic on two points with its Asian friends: that it would keep its treaty commitments, such as with Thailand under SEATO, and that, except for the threat of a major power involving nuclear weapons, the United States would encourage and expect problems of internal security and military defense to be increasingly handled by the Asian nations themselves.</p>\n<p>Nixon said the United States should continue to play a significant role in Asia but must avoid policies that made Asian countries so dependent on it that it was dragged into conflicts such as the one in Vietnam. He cited advice he received in 1964 from Ayub Khan, then President of Pakistan, that the role of the United States in countries with internal subversion was \"to help them fight the war but not fight the war for them.\"</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Richard Nixon, \"Informal Remarks in Guam With Newsmen\", The American Presidency Project, UC-Santa Barbara, July 25, 1969"
      url: "https://www.presidency.ucsb.edu/documents/informal-remarks-guam-with-newsmen"
    - label: "Wikipedia, \"1969 in the Vietnam War\", revision 1370279610 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1969_in_the_Vietnam_War&oldid=1370279610"
  status: "draft"
  source_text: "[Nixon, Informal Remarks in Guam With Newsmen, American Presidency Project, header and item 1] Richard Nixon\n\n37th President of the United States: 1969 ‐ 1974\n\nInformal Remarks in Guam With Newsmen\n\nJuly 25, 1969\n\nTHE PRESIDENT. [1.] As Ron Ziegler [Press Secretary] has already told you, the remarks today will be for attribution but not direct quotation, and for background.\n\n[Nixon, Informal Remarks in Guam With Newsmen, item 2] So, what I am trying to suggest is this: As we look at Asia, it poses, in my view, over the long haul, looking down to the end of the century, the greatest threat to the peace of the world, and, for that reason the United States should continue to play a significant role.\n...\nAt this time, the political and economic plans that they are gradually developing are very hopeful. We will give assistance to those plans. We, of course, will keep the treaty commitments that we have.\n\nBut as far as our role is concerned, we must avoid that kind of policy that will make countries in Asia so dependent upon us that we are dragged into conflicts such as the one that we have in Vietnam.\n\n[Nixon, Informal Remarks in Guam With Newsmen, item 4] Q. Mr. President, sir, on the question of U.S. military relationships in Asia, if I may ask a hypothetical question: If a leader of one of the countries with which we have had close military relationships, either through SEATO or in Vietnam, should say, \"Well, you are pulling out of Vietnam with your troops, we can read in the newspapers. How can we know that you will remain to play a significant role as you say you wish to do in security arrangements in Asia?\" What kind of an approach can you take to that question?\n...\nHowever, I believe that the time has come when the United States, in our relations with all of our Asian friends, be quite emphatic on two points: One, that we will keep our treaty commitments, our treaty commitments, for example, with Thailand under SEATO; but, two, that as far as the problems of internal security are concerned, as far as the problems of military defense, except for the threat of a major power involving nuclear weapons, that the United States is going to encourage and has a right to expect that this problem will be increasingly handled by, and the responsibility for it taken by, the Asian nations themselves.\n\n[Nixon, Informal Remarks in Guam With Newsmen, item 10] Let me put it this way. I recall in 1964 some advice that I got from Ayub Khan, who was then the President of Pakistan. This was before the United States had any significant troop commitment in Vietnam. I asked him what his view was as to what our role should be. He said, \"Well, the role of the United States in Vietnam or the Philippines or Thailand or any of these countries which have internal subversion is to help them fight the war but not fight the war for them.\"\n\n[Wikipedia, 1969_in_the_Vietnam_War, rev 1370279610] What would become known as the \"Nixon Doctrine\" was outlined for the first time in an informal press conference with reporters who had accompanied Nixon to Guam during his Asian tour. In remarks later published, but given at the time \"for attribution but not direct quotation\", Nixon said, \"I believe that the time has come when the United States, in our relations with all of our Asian friends, be quite emphatic on two points: One, that we will keep our treaty commitments... but, two, that as far as the problems of internal security are concerned, as far as the problems of military defense... that the United States is going to encourage and has a right to expect that... the responsibility for it taken by, the Asian nations themselves.\""
