      url: "https://en.wikipedia.org/w/index.php?title=1973_in_the_Vietnam_War&oldid=1380647415"
  status: "draft"
  source_text: "[The History Place, The Vietnam War, the Bitter End 1969-1975, 1973 entries] July 16, 1973 - The U.S. Senate Armed Forces\nCommittee begins hearings into the secret bombing of Cambodia during 1969-70.\n\nJuly 17, 1973 - Secretary of Defense James\nSchlesinger testifies before the Armed Forces Committee that 3500 bombing\nraids were launched into Cambodia to protect American troops by targeting\nNVA positions. The extent of Nixon's secret bombing campaign angers many\nin Congress and results in the first call for Nixon's impeachment.\n\nAugust 14, 1973 - U.S. bombing activities\nin Cambodia are halted in accordance with the Congressional ban resulting\nfrom the Case-Church amendment.\n\n[Wikipedia, 1973_in_the_Vietnam_War, rev 1380647415] Secretary of Defense James Schlesinger testified before the U.S. Congress that 3,500 American bombing raids had been carried out against Cambodia in 1969 and 1970. The raids had been conducted secretly and their extent had not been known until this testimony."
  summarized_by: "Claude Opus 5.5"
