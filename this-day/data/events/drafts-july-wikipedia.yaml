- month: 7
  day: 7
  year: 1964
  title: "Communists assault the Nam Dong CIDG camp"
  body: "<p>On July 7, 1964, shortly after midnight, the Communists launched a large-scale ground assault against the barbed wire-enclosed main camp at Nam Dong, a CIDG camp in south central Thua Thien Province. The camp sat astride natural infiltration routes from Laos and was defended by only a handful of U.S. Special Forces personnel and three CIDG companies, none of which could muster more than 90 men.</p>\n<p>Shortly after 0400, with his position holding out against heavy mortar and machine gun fire, Captain Roger H. Donlon, the Special Forces officer in charge, radioed for assistance. Six Marine helicopters launched from Da Nang, but intense enemy mortar and ground fire kept them from landing the reinforcements. At 0945, 18 Marine helicopters began landing a 93-man relief force.</p>\n<p>Two Americans, one Australian advisor, and 55 South Vietnamese were killed. Donlon, who earned the first Medal of Honor awarded for action in Vietnam, and 64 other defenders were wounded. The Viet Cong left 62 bodies on the battlefield.</p>\n"
  photo_url: null
  photo_alt: null
  references:
    - label: "Whitlow, \"U.S. Marines in Vietnam: The Advisory and Combat Assistance Era, 1954–1964\", History and Museums Division, Headquarters, U.S. Marine Corps, 1977, pp. 157–158"
