- month: 7
  day: 10
  year: 1964
  title: "ARVN divisions try to trap two VC battalions"
  body: "<p>On July 10, 1964, the ARVN 5th and 7th Divisions launched an operation to clear two VC battalions from the heavily forested border of Hau Nghia and Long An Provinces. The 5th Division thrust southward from Duc Hoa along the Vàm Cỏ Đông River, while the 7th Division drove north from Bến Lức, to trap and destroy the VC between them.</p>\n<p>Late in the day, the two VC battalions pinned the 30th Ranger Battalion against the banks of the Varic Oriental River. The rangers received air support throughout the night. At 06:30 on July 11, 24 US Army helicopters delivered an infantry battalion, but the VC had already withdrawn.</p>\n<p>ARVN losses were nine killed and 27 wounded; US losses were two killed and three wounded. The allies killed 68 VC and captured 73 suspects.</p>\n"
