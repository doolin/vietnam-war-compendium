  year: 1968
  title: "Military court sentences Trương Đình Dzu to five years"
  body: "<p>On July 26, 1968, a Special Military Court sentenced Trương Đình Dzu, an unsuccessful candidate in the 1967 Presidential election, to five years imprisonment for proposing the formation of a coalition government to end the war.</p>"
