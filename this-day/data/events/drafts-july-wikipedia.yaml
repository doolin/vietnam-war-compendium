- month: 7
  day: 14
  year: 1967
  title: "Terrorists free inmates from a Quang Nam prison"
  body: "<p>On July 14, 1967, terrorists dressed in Vietnamese Army uniforms captured a prison in Quang Nam province. They released about 1,000 of the 1,200 inmates and executed 30 in the prison yard. Ten civilians were killed and 29 wounded as they fought their way out of the area.</p>\n"
