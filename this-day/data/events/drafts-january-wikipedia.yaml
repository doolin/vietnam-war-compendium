      url: "https://vva.vietnam.ttu.edu/images.php?img=/images/1683/168300010683.pdf"
    - label: "Wikipedia, \"1968 in the Vietnam War\", revision 1370342410 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1968_in_the_Vietnam_War&oldid=1370342410"
  status: "draft"
  source_text: "[155th Assault Helicopter Company, Combat After Action Report, 3 Feb 1968, p. 1, transcribed from scan] DEPARTMENT OF THE ARMY 155TH ASSAULT HELICOPTER COMPANY \"FLYING DRAGONS\" APO 96297 3 February 1968 SUBJECT: Combat After Action Report (AVBA-C-1)\n\n[155th Assault Helicopter Company, Combat After Action Report, 3 Feb 1968, p. 2, transcribed from scan] VC Attack on US Installations After Action Report (AVBA-C-1) 1. DTG: 040245 Jan 68 2. Unit or Units: 155th AHC, 165 TD, 185th RAC 3. Strength of Units (2 above): Approx. 550 - 600 4. Estimated number of Viet Cong: Unknown [...] 9. Estimate of weapons used by VC: 82mm Mortar; B-40 Rockets 10. Gunships and other reinforcements used: 1 Flareship; 2 Gunships\n\n[155th Assault Helicopter Company, Combat After Action Report, 3 Feb 1968, p. 3, transcribed from scan] 13. Distance at which action was initiated 3200 meter. 14. What was the duration of the attack? Approx. 5 - 8 minutes 15. Why was the engagement broken off? Installation defense was adequate YES Installation defense was inadequate NO VC stopped shooting and withdrew YES [...] 18. Unit having primary responsibility for defense of installation 155\n\n[155th Assault Helicopter Company, Combat After Action Report, 3 Feb 1968, p. 4, transcribed from scan] 8. A. Aircraft (1) 155 2 UH-1H, Destroyed 3 UH-1H, Extensive Damage 3 UH-1H, Moderate Damage 4 UH-1H, Minor Damage 2 UH-1H, (Dustoff) Minor Damage [...] B. Buildings (1) 155 Maintenance Hangar, Extensive Damage\n\n[155th Assault Helicopter Company, Combat After Action Report, 3 Feb 1968, p. 5, transcribed from scan] 16. One Flareship and 2 Gunships were airborne by 0250 to 0255 hours and remained aloft until approximately 0500 hours. Mortar crews fired H.E. and W.P. rounds from 0250 until 0410 hours (approximately 68 rounds), on preplanned concentrations: Results unknown. All personnel manned bunkers and berm positions from 0245 until 0800, expending heavy fire upon known and suspected enemy positions outside the compound; Negative results known at this time. Friendly casualties were non-existant. Maintained state of alert readiness until 0700 hours, 5 January 1968.\n\n[Wikipedia, 1968_in_the_Vietnam_War, rev 1370342410] A PAVN rocket and mortar attack on Ban Me Thuot East Airfield destroyed two UH-1s and severely damaged three others."
