- month: 1
  day: 2
  year: 1967
  title: "Operation Bolo downs seven MIG-21s"
  body: "<p>On January 2, 1967, U.S. Air Force Phantoms flew Operation Bolo, a ruse against North Vietnamese MIG-21 interceptors. The F-4Cs of the 8th Tactical Fighter Wing, designated the West Force, used F-105 tanker anchors, refueling altitudes, approach routes, airspeeds, and radio call signs to appear on North Vietnamese radars as a normal F-105 Rolling Thunder strike force. Col. Robin Olds, commanding the 8th TFW, led the operation.</p>\n<p>Poor weather over the target area delayed the mission one hour. The battle was fought within a 15-mile radius centered on Phuc Yen airfield, where for 15 minutes the Americans fought a high-speed duel with MIG-21 pilots. Cloud overcast kept the West Force from covering the airfields and let the MIGs disengage by diving into the clouds.</p>\n<p>Without the loss of a single American aircraft, Operation Bolo destroyed seven MIG-21s, nearly half of the North Vietnamese operational inventory at that time. \"We outflew, outshot and outfought them,\" Olds told newsmen.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Futrell, \"United States Air Force in Southeast Asia 1965-1973: Aces and Aerial Victories\", Air University, Headquarters USAF, 1976, pp. 37-42"
      url: "https://media.defense.gov/2010/Sep/21/2001329821/-1/-1/0/AFD-100921-010.pdf"
    - label: "Wikipedia, \"1967 in the Vietnam War\", revision 1370279584 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1967_in_the_Vietnam_War&oldid=1370279584"
  status: "draft"
  source_text: "[Futrell, Aces and Aerial Victories, p. 37 (PDF p. 51)] The fighter forces were drawn from the 355th, 388th, 8th, and 366th Tactical Fighter Wings. The 355th and 388th Wings, equipped with F-105 Thunderchiefs, were to fly regular Iron Hand strikes. The F-4C.s of the 8th TFW became the West Force and were charged with bringing the MIG’s up and covering suspected orbit areas as well as Phuc Yen and Gia Lam airfields.\n\n[Futrell, Aces and Aerial Victories, p. 37 (PDF p. 51)] The West Force used an elaborate ruse to make the Phantoms appear to the enemy as an F-105 Rolling Thunder* strike force. The F 4 C ’ s used F-105 tanker anchors, refueling altitudes, approach routes, approach altitudes, airspeeds, and radio call signs and communications to simulate a normal Thunderchief strike force. This was intended to deceive the enemy on N V N radars.\n\n[Futrell, Aces and Aerial Victories, p. 37 (PDF p. 51)] Based on this planning and on long-term weather prognostication, D-day was set for 2 January 1967. [...] On the 2nd, weather conditions over the target area were poor and considerable cloudiness and overcast was forecast. A 1-hour delay was instituted on the 2nd to await more favorable weather and then the mission proceeded on schedule.\n\n[Futrell, Aces and Aerial Victories, p. 38 (PDF p. 52)] The cloud overcast made it impossible for the West Force to cover the airfields, which would have prevented a MIG recovery. The cloud layer also gave the MIG’s an easy means to disengage from aerial combat by diving into the overcast for cover.\n\n[Futrell, Aces and Aerial Victories, p. 38 (PDF p. 52)] The entire battle was fought within a 15-mile radius centered on Phuc Yen airfield. For 15 minutes the Americans fought a high-speed duel with aggressive MIG-21 pilots.\n\n[Futrell, Aces and Aerial Victories, p. 41 (PDF p. 55)] Without the loss of a single American aircraft, Operation Bolo had accounted for the destruction of seven enemy MIG-21’s-nearly half of the North Vietnamese operational inventory at that time. [...] “We outflew, outshot and outfought them.” Colonel Olds told newsmen following the spectacular air battle.\n\n[Futrell, Aces and Aerial Victories, p. 42 (PDF p. 56), photo caption] Col. Robin Olds, commanding the 8th TFW, led Operation “Bolo,” in which USAF Phantoms downed seven M I G 3 I ’ s on 2 January 1967.\n\n[Wikipedia, 1967_in_the_Vietnam_War, rev 1370279584] Operation Bolo was a successful combat ruse by the United States Air Force (USAF) that resulted in the USAF shooting down seven Vietnam People's Air Force (VPAF) MiG-21 interceptors."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T12:00:00Z"
- month: 1
  day: 3
  year: 1975
  title: "Jackson amendment passes as Soviet aid bargain lapses"
  body: "<p>On January 3, 1975, the Jackson–Vanik amendment was passed. Senator Henry M. Jackson had been seriously jeopardizing the trade agreement with the Soviet Union by conditioning its passage on Soviet liberalization of Jewish emigration. By mid-December 1974 it had become clear that Jackson would get his way.</p>\n<p>Soviet cooperation in cutting back aid to North Vietnam had been directly tied to the secret trade and credits agreement negotiated by Nixon and Kissinger in 1972, which neither the U.S. nor the USSR had made public. The outcome fell far short of the trade status Kissinger had led the Soviets to expect, and they no longer felt compelled to abide by their side of the bargain.</p>\n<p>In the latter part of December 1974, General Viktor Kulikov, chief of the Soviet armed forces, flew to Hanoi to take part in the Politburo's deliberations. In the weeks following his visit, seaborne shipments of Soviet war materiel to North Vietnam increased fourfold in volume.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Hartsook, \"The Air Force in Southeast Asia: The End of U.S. Involvement 1973-1975\", Office of Air Force History, 1975, PDF p. 90"
      url: "https://media.defense.gov/2011/Mar/23/2001330102/-1/-1/0/AFD-110323-032.pdf"
    - label: "Wikipedia, \"1975 in the Vietnam War\", revision 1380222781 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1975_in_the_Vietnam_War&oldid=1380222781"
  status: "draft"
  source_text: "[Hartsook, The End of U.S. Involvement 1973-1975, PDF p. 90] (U) But in December 1974 all this changed. In the latter part of the month, General Viktor Kulikov, chief of the Soviet armed forces, flew to Hanoi to take part in the Politburo's deliberations. And in the weeks following his visit, seaborne shipments of Soviet war materiel to North Vietnam increased fourfold in volume as Moscow gave full aid and comfort to Hanoi in its final offen.iu\".98\n\n[Hartsook, The End of U.S. Involvement 1973-1975, PDF p. 90] (U) But the Soviets had another reason for increasing their aid to Hanoi. Their previous cooperation in cutting back aid to North Vietnam had been directly tied to the secret trade and credits agreement negotiated by Nixon and Kissinger in 1972. The whole force of these arran$ements had declined greatly with President Nixon's resignation in August 1974, and Senator Henry M. Jackson, in particular, was seriously jeopardizing the trade agreement by conditioning its passage on Soviet liberalization of Jewish emigration. When President Ford met Brezshnev in November at Vladivostok, Kissinger could--and did--still insist on the trade-agreement Vietnam bargain. But by mid-December, it had becorne clear that Senator Jackson would get his way, as occurred when his amendment was passed on January 3, 1975. So the Soviets had reason to cornplain that their original understandings had broken down.\n\n[Hartsook, The End of U.S. Involvement 1973-1975, PDF p. 90] This was a far cry from the ?rmost favored nationrr trade status Kissinger had led them to expect, and they no longer felt compelled to abide by their side of the bargain.*\n\n[Hartsook, The End of U.S. Involvement 1973-1975, PDF p. 90, footnote] Although these agreements were arrived at in 1972, neither the U.S. nor the USSR had ever made them public.\n\n[Wikipedia, 1975_in_the_Vietnam_War, rev 1380222781] The Jackson–Vanik amendment was signed into law in the U.S., its passage was a reason for increased Soviet military aid to North Vietnam as it abrogated secret Nixon administration trade commitments with the Soviet Union."
