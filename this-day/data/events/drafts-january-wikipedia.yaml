- month: 1
  day: 19
  year: 1963
  title: "Harkins issues MACV Comprehensive Plan"
  body: "<p>On January 19, 1963, General Harkins issued the final version of the Comprehensive Plan for South Vietnam, which Felt promptly endorsed. The Joint Chiefs of Staff had directed Harkins in July 1962 to develop the plan. It aimed to give the South Vietnamese armed forces \"the capability to defeat the current insurgency with US special military assistance\" and to provide an initial defense against overt invasion.</p>\n<p>MACV's planners wanted to expand South Vietnamese forces to a peak strength of 458,500 men by mid-1964, including a regular establishment of almost 240,000, the bulk of them in a 9-division army. The force was then to decline to 368,400 men in mid-1968. The Military Assistance Command and its service components were to reduce strength from 12,200 personnel in mid-1965 to 1,500 in mid-1968, and MACV headquarters was to go out of existence by 1 July 1966.</p>\n<p>The Joint Chiefs of Staff promptly accepted the plan. Secretary McNamara rejected it at his Honolulu conference in May 1963.</p>\n"
  photo_url: null
  photo_alt: null
  references:
    - label: "Cosmas, \"MACV: The Joint Command in the Years of Escalation, 1962-1967\", United States Army Center of Military History, 2006, pp. 79-81"
      url: "https://history.army.mil/html/books/091/91-6/CMH_Pub_91-6.pdf"
    - label: "Wikipedia, \"1963 in the Vietnam War\", revision 1370279475 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1963_in_the_Vietnam_War&oldid=1370279475"
  status: "draft"
  source_text: "[Cosmas, MACV: The Joint Command in the Years of Escalation, 1962-1967, p. 79 (PDF p. 100)] In addition to ordering the transfer of the Civilian Irregular Defense Program to MACV, McNamara at the July 1962 conference also instructed the Military Assistance Command to prepare plans for working itself out of a job. The defense secretary was impressed by General Harkins’ optimistic reports on the progress of the expanded assistance program.\n\n[Cosmas, MACV: The Joint Command in the Years of Escalation, 1962-1967, p. 80 (PDF p. 101)] Elaborating on this guidance, the Joint Chiefs of Staff on 26 July directed Harkins to develop a Comprehensive Plan for South Vietnam designed to bring that country’s armed forces, by the end of calendar year 1965, to “the strength necessary to exercise permanent and continued sovereignty over that part of Vietnam which lies below the demarcation line without the need for continued US special military assistance.”\n\n[Cosmas, MACV: The Joint Command in the Years of Escalation, 1962-1967, p. 80 (PDF p. 101)] During the remainder of 1962, the Military Assistance Command worked out the complex details of the Comprehensive Plan. The final version, which Harkins issued on 19 January 1963 and which Felt promptly endorsed, was aimed at giving the South Vietnamese armed forces “the capability to defeat the current insurgency with US special military assistance; defeat any new insurgency threat which may arise after phase down and withdrawal of US special assistance; and provide an initial defense against overt invasion until outside forces can be introduced.” To achieve this objective, the Military Assistance Command’s planners wanted to expand South Vietnamese forces to a peak strength of 458,500 men by mid-1964, including a regular establishment of almost 240,000, the bulk of them in a 9-division army. Thereafter, with the Viet Cong presumably going down in defeat, the RVNAF was to decline gradually to 368,400 men in mid-1968, primarily through demobilizing the territorials and Civilian Irregular Defense Groups. [...] As the South Vietnamese buildup progressed, the Military Assistance Command and its service components were to reduce strength from 12,200 personnel in mid-1965 to 1,500 in mid-1968. MACV headquarters itself was to go out of existence by 1 July 1966, leaving the MAAG again in charge of the remaining advisory and training effort.\n\n[Cosmas, MACV: The Joint Command in the Years of Escalation, 1962-1967, pp. 80-81 (PDF pp. 101-102)] The Joint Chiefs of Staff promptly accepted MACV’s Comprehensive Plan, but Secretary McNamara rejected it. At his Honolulu confer- ence in May 1963, McNamara declared the plan unsatisfactory in that it called for a post-1965 South Vietnamese force too large and too lavishly equipped for a small, poor nation to support.\n\n[Wikipedia, 1963_in_the_Vietnam_War, rev 1370279475] General Harkins presented his Comprehensive Plan for the war. He envisioned an increase in South Vietnamese forces (ARVN plus Civil Guard and Self Defense Corps) to 458,500 personnel by mid-1964 and thereafter to decrease, the war presumably winding down. Harkins foresaw that U.S. military personnel in South Vietnam would be reduced to 12,200 by mid 1965 and to 1,500 in mid 1968. MACV would be abolished by 1 July 1966.\n"
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T12:00:00Z"
- month: 1
  day: 20
  year: 1972
  title: "Abrams warns of major enemy offensive"
  body: "<p>On January 20, 1972, General Abrams, Commander, Military Assistance Command, Vietnam, sent a message to the Commander in Chief, Pacific, Admiral McCain, describing \"the impending enemy offensive against RVN.\" Abrams wrote that \"the enemy is preparing and positioning his forces for a major offensive\" and that \"there is no doubt that this is to be a major campaign.\" He expected the main effort against the B3 front in MR 2 and northern MR 1, and said the enemy would use MiG's, SAM's and AAA to complicate U.S. operations.</p>\n<p>Abrams reported indicators showing \"a willingness by Hanoi to commit four of the five reserve divisions held in NVN.\" He requested that standby authorities be approved now, including strikes on MiGs on the ground at Dong Hoi, Vinh and Quan Lang, on active GCI radars in NVN below 20 degrees north, and on enemy logistic support facilities below 18 degrees north.</p>\n<p>Ambassador Bunker concurred in the message. Moorer sent it to Laird and recommended that it be forwarded to the White House.</p>\n"
  photo_url: null
  photo_alt: null
  references:
    - label: "Office of the Historian, \"Foreign Relations of the United States, 1969–1976, Volume VIII, Vietnam, January–October 1972, Document 1\", U.S. Department of State"
      url: "https://history.state.gov/historicaldocuments/frus1969-76v08/d1#fn3"
    - label: "Wikipedia, \"1972 in the Vietnam War\", revision 1372115736 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1972_in_the_Vietnam_War&oldid=1372115736"
  status: "draft"
  source_text: "[FRUS 1969–1976, Vol. VIII, Document 1] 1. Message From the Commander, Military Assistance Command, Vietnam ( Abrams ) to the Commander in Chief, Pacific ( McCain ) 1\n\nSaigon , January 20, 1972, 0945Z .\n\n76221. Exclusive for Adm McCain . Deliver during waking hours. [...]\n\n1. ( TS ) The purpose of this message is to describe in the clearest possible manner the impending enemy offensive against RVN ; the impact of ongoing operations on the Commando Hunt interdiction campaign and the additional authorities that will be needed for the conduct of an effective defense in the coming period. 2. ( TS ) As pointed out in my assessment of the enemy situation submitted in Ref A and B, along with additional intelligence in para 3 [Page 2] below, the enemy is preparing and positioning his forces for a major offensive. [...] There is no doubt that this is to be a major campaign. We estimate that the main effort will be against the B3 front in RVN MR 2 and northern RVN MR 1, but this will be accompanied by a general increase in enemy activity in other areas of RVN . The enemy will use MiG ’s, SAM ’s and AAA to complicate our operations.\n\n[FRUS 1969–1976, Vol. VIII, Document 1, para 3.B] These indicators show a willingness by Hanoi to commit four of the five reserve divisions held in NVN , a commitment which has previously occurred only during Tet 1968 and during Lam Son 719 in March and April 1971.\n\n[FRUS 1969–1976, Vol. VIII, Document 1, para 5] Effective protection of our forces will require new operating authorities which must be in hand from the outset of the battle. I therefore request that the following standby authorities be approved now for use as needed throughout the battle. These authorities will be invoked as appropriate when the battle for northern RVN begins. A. Authority: Fighter aircraft may strike enemy MIG aircraft on the ground at Dong Hoi, Vinh and Quan Lang . [...] B. Authority: Fighter aircraft, including Iron Hand may strike active GCI radars in NVN below 20 degrees north . [...] D. Authority: Fighter aircraft may strike enemy logistic support facilities below 18 degrees north .\n\n[FRUS 1969–1976, Vol. VIII, Document 1, para 7 and source note] 7. Ambassador Bunker has seen this message and concurs. [...] When the message arrived, Moorer sent it to Laird and recommended that, “because of the importance of General Abrams ’ assessment,” the message should be forwarded to the White House.\n\n[Wikipedia, 1972_in_the_Vietnam_War, rev 1372115736] The head of MACV, General Creighton Abrams cabled Washington that \"the enemy [North Vietnam] is preparing and positioning his forces for a major offensive.... There is no doubt this is to be a major campaign.\" Abrams requested additional authority to use U.S. American air power to mount an effective defense.\n"
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T12:00:00Z"
- month: 1
  day: 21
  year: 1968
  title: "North Vietnamese open attack on Khe Sanh"
  body: "<p>On January 21, 1968, the North Vietnamese opened their attack on Khe Sanh in the small hours, launching a fierce assault on one of the Marines' hilltop outposts. The Marines held their ground in fighting that at times was hand-to-hand. A seven-hour rocket, mortar, and artillery barrage against Khe Sanh itself destroyed the Marines' principal ammunition dump, and the North Vietnamese overran the village of Khe Sanh outside the main perimeter. The defenders withdrew into the base fortifications, abandoning all outposts except the commanding hill positions.</p>\n<p>General Westmoreland announced that day that \"the anticipated enemy attack on Khe Sanh was initiated last evening\" and launched Operation NIAGARA, an air campaign of B–52 and tactical air strikes around Khe Sanh. Damage to the runway briefly closed the field to planes larger than C-123's. Later reinforcements brought the defenders to about 5,700 US Marines and 500 Vietnamese Rangers, facing an estimated 20,000–25,000 North Vietnamese.</p>\n"
  photo_url: null
  photo_alt: null
  references:
    - label: "Cosmas, \"The Joint Chiefs of Staff and The War in Vietnam 1960–1968, Part 3\", Office of Joint History, Office of the Chairman of the Joint Chiefs of Staff, 2009, p. 142"
      url: "https://www.jcs.mil/Portals/36/Documents/History/Vietnam/Vietnam_1960-1968_P003.pdf"
    - label: "Nalty, \"Air Power and the Fight for Khe Sanh\", Office of Air Force History, 1986, p. 43"
      url: "https://media.defense.gov/2010/May/26/2001330289/-1/-1/0/AFD-100526-029.pdf"
    - label: "Wikipedia, \"1968 in the Vietnam War\", revision 1370342410 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1968_in_the_Vietnam_War&oldid=1370342410"
  status: "draft"
  source_text: "[Cosmas, The Joint Chiefs of Staff and The War in Vietnam 1960–1968, Part 3, p. 142 (PDF p. 156)] The North Vietnamese opened their attack on Khe Sanh in the small hours of 21 January. They launched a fierce assault on one of the Marines’ hilltop outposts, but the Marines held their ground in fighting that at times was hand-to-hand. The enemy followed up with a seven-hour rocket, mortar, and artillery barrage against Khe Sanh itself that destroyed the Marines’ principal ammunition dump; and they overran the village of Khe Sanh outside the main perimeter. The Marine defenders, reinforced a few days earlier by a third battalion, withdrew into the base fortifications, abandoning all outposts except the commanding hill positions.32 General Westmoreland announced on 21 January that “the anticipated enemy attack on Khe Sanh was initiated last evening.” In response, he launched Operation NIAGARA, the air campaign to keep the enemy forces off balance. From then on, B–52s and tactical aircraft pounded suspected North Vietnamese troop concentrations, storage areas, and artillery positions around Khe Sanh. By 29 January, some 40 B–52 and 500 tactical air sorties were being flown each day as part of this campaign. [...] The III Marine Amphibious Force airlifted a fourth Marine battalion into Khe Sanh, followed several days later by an ARVN Ranger battalion. These reinforcements increased the number of defenders to about 5,700 US Marines and 500 Vietnamese Rangers. They faced an estimated 20,000–25,000 North Vietnamese.33\n\n[Nalty, Air Power and the Fight for Khe Sanh, p. 43 (PDF p. 54)] When the fight for Khe Sanh began, Air Force transports and Marine aerial tankers were able to land to unload their passengers and cargo. For a short time after destruction of the ammunition dump on 21 January, damage to the runway closed the field to planes larger than C-123's, but the Cl30's soon were back on the job.\n\n[Wikipedia, 1968_in_the_Vietnam_War, rev 1370342410] The long and bloody Battle of Khe Sanh began with an assault by the PAVN on Khe Sanh Combat Base in northwestern Quảng Trị Province. The combatants were elements of the U.S. III Marine Amphibious Force (III MAF) and the ARVN against two to three PAVN division-size elements. [...] The USAF began Operation Niagara to provide continuous air support during the siege.\n"
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T12:00:00Z"
- month: 1
  day: 23
  year: 1973
  title: "Nixon announces Paris peace agreement"
  body: "<p>On January 23, 1973, President Nixon announced that an agreement had been reached which would \"end the war and bring peace with honor.\" Kissinger and Le Duc Tho had resumed negotiations in Paris on January 8, and on January 9 all remaining differences between them were resolved. President Thieu, threatened by Nixon with a total cut-off of American aid to South Vietnam, unwillingly accepted the peace agreement, which still allowed North Vietnamese troops to remain in South Vietnam. Thieu labeled the terms \"tantamount to surrender\" for South Vietnam.</p>\n<p>The Paris Peace Accords were signed on January 27, 1973, by the U.S., North Vietnam, South Vietnam and the Viet Cong.</p>\n"
