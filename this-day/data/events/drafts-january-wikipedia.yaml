- month: 1
  day: 4
  year: 1968
  title: "Viet Cong shell 155th Assault Helicopter Company base"
  body: "<p>On January 4, 1968, at 0245 hours, the Viet Cong attacked the installation defended by the 155th Assault Helicopter Company at Ban Me Thuot East Airfield, using 82mm mortars and B-40 rockets. The company's after action report put the attack's duration at approximately five to eight minutes, after which the VC stopped shooting and withdrew.</p>\n<p>Two of the company's UH-1H helicopters were destroyed and three suffered extensive damage. Three more had moderate damage and four had minor damage, as did two Dustoff UH-1Hs. The maintenance hangar was extensively damaged.</p>\n<p>One flareship and two gunships were airborne by 0250 to 0255 hours, and mortar crews fired approximately 68 H.E. and W.P. rounds on preplanned concentrations. Personnel manned bunkers and berm positions until 0800. The report recorded no friendly casualties.</p>"
  photo_url: null
  photo_alt: null
  references:
