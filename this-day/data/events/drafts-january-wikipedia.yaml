  year: 1972
  title: "Nixon makes secret peace talks public"
  body: "<p>On January 25, 1972, President Nixon made public, in a television address, a plan for peace offered on behalf of the Governments of the United States and South Vietnam. He disclosed that he had sent Dr. Kissinger to Paris on August 4, 1969, to begin secret peace negotiations. Kissinger had traveled to Paris 12 times, meeting seven times with Le Duc Tho and Minister Xuan Thuy, and five times with Xuan Thuy alone.</p>\n<p>Under the plan, within six months of an agreement the United States would withdraw all U.S. and allied forces from South Vietnam, all prisoners of war would be exchanged, there would be a cease-fire throughout Indochina, and a new presidential election would be held in South Vietnam. President Thieu and Vice President Huong would be ready to resign one month before the election. Nixon said he had instructed Ambassador Porter to present the plan publicly at that Thursday's session of the Paris peace talks.</p>\n"
