  year: 1966
  title: "Time names Westmoreland Man of the Year"
  body: "<p>On January 7, 1966, Time magazine named General William Westmoreland, commander of Military Assistance Command, Vietnam, its Man of the Year. The magazine's cover for that date carried the title \"General Westmoreland, Man of the Year,\" with cover credit to Robert Berks.</p>"
