- month: 1
  day: 16
  year: 1964
  title: "Operation Phuong Hoang I meets heavy VC resistance"
  body: "<p>On January 16, 1964, Operation Phuong Hoang I in Thạnh Phú district was initially met with heavy VC resistance. The operation resulted in 85 VC killed and 72 captured. ARVN losses were 15 killed and 40 wounded. U.S. losses were four killed, six wounded, two missing, and two helicopters destroyed.</p>"
