  source_text: "[Nixon, Address to the Nation on Plan for Peace in Vietnam, January 25, 1972, Miller Center transcript] I have asked for this television time tonight to make public a plan for peace that can end the war in Vietnam.\n\nThe offer that I shall now present, on behalf of the Government of the United States and the Government of South Vietnam, with the full knowledge and approval of President Thieu, is both generous and far-reaching.\n\n[...] After consultation with Secretary of State Rogers, our Ambassador in Saigon, and our chief negotiator in Paris, and with the full knowledge and approval of President Thieu, I sent Dr. Kissinger to Paris as my personal representative on August 4, 1969, 30 months ago, to begin these secret peace negotiations.\n\nSince that time, Dr. Kissinger has traveled to Paris 12 times on these secret missions. He has met seven times with Le Duc Tho, one of Hanoi's top political leaders, and Minister Xuan Thuy, head of the North Vietnamese delegation to the Paris talks, and he has met with Minister Xuan Thuy five times alone.\n\n[...] That is why I have instructed Ambassador Porter to present our plan publicly at this Thursday's session of the Paris peace talks, along with alternatives to make it even more flexible.\n\n[...] Within six months of an agreement:\n\n&mdash;We shall withdraw all U.S. and allied forces from South Vietnam.\n\n&mdash;We shall exchange all prisoners of war.\n\n&mdash;There shall be a cease-fire throughout Indochina.\n\n&mdash;There shall be a new presidential election in South Vietnam.\n\n[...] Furthermore, President Thieu has informed me that within the framework of the agreement outlined above, he makes the following offer: He and Vice President Huong would be ready to resign one month before the new election.\n\n[Wikipedia, 1972_in_the_Vietnam_War, rev 1372115736] Nixon revealed that National Security Adviser Henry Kissinger had been meeting secretly with North Vietnamese representatives for more than 2 years. He also revealed the U.S. peace plan that had been proposed to Hanoi. Nixon proposed that, within six months of an agreement, all U.S. military be withdrawn from South Vietnam, POWs exchanged, an internationally supervised ceasefire implemented and a presidential election held in South Vietnam. Nixon did not demand the withdrawal of North Vietnamese military forces from South Vietnam. In a radio address, Thiệu endorsed the proposal, including the provision that he and the Vice President would resign one month before the presidential election.\n"
