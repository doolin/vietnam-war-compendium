  title: "Viet Minh take hold of Tchepone region after March 9 coup"
  body: "<p>On March 9, 1945, a coup took place, and following it the Viet Minh clamped their hold on the Tchepone region and its people.</p><p>Tchepone later became the site of Base Area 604, one of the North Vietnamese base areas in southern Laos serving the war in South Vietnam, alongside Base Area 611 east of Muong Nong and Base Area 612 between Sarvane and Ban Bac. Base Area 604 was the main logistic base during the Vietnam War; from there the coordination and distribution of supplies into the Republic of Vietnam's military regions was carried out.</p><p>Infiltration of Communist cadre from North to South Vietnam started in 1959, when the North Vietnamese decided to support and strengthen the guerrilla war in the South. In the north sector, the North Vietnamese were able to use old roads through the Keo Neua and Mu Gia passes, which had been improved during 1961 and 1962 under their aid agreements with Prince Souvannaphouma.</p>"
