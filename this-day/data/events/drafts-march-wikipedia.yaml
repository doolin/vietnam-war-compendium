- month: 3
  day: 27
  year: 1974
  title: "ARVN Rangers hold Duc Hue against NVA assault"
  body: "<p>On March 27, 1974, at 0300, two battalions of the NVA 6th Regiment, 5th Division, attacked the RVNAF base at Duc Hue, an ARVN fire-base in the Angel's Wing only five kilometers from the Svay Rieng border. The ARVN 83d Ranger Battalion defended the post. NVA 105-mm. artillery fired from across the border in Cambodia while recoilless rifles and 120-mm. mortars bombarded the garrison from closer ranges.</p>\n<p>Thirty ARVN Rangers died, but the infantry assault failed to break the position, and the two NVA battalions withdrew, leaving 95 dead on the battlefield. The NVA, assisted by the local K-7 Sapper Battalion, then blocked the only land access to the camp and continued the bombardment. The ARVN 25th Division committed a task force of two infantry battalions and a tank company to break the siege.</p>\n<p>With the threat to Duc Hue remaining, Lt. Gen. Pham Quoc Thuan, III Corps Commander, planned the ARVN sweep into Svay Rieng, which began on 27 April.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Le Gro, \"Vietnam from Ceasefire to Capitulation\", US Army Center of Military History, 1985, p. 93"
      url: "https://history.army.mil/html/books/090/90-29/CMH_Pub_90-29.pdf"
    - label: "Wikipedia, \"1974 in the Vietnam War\", revision 1374630748 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1974_in_the_Vietnam_War&oldid=1374630748"
  status: "draft"
  source_text: "[Le Gro, Vietnam from Ceasefire to Capitulation, p. 92] The southern tip of the Angel's Wing dipped toward an ARVN fire-base at Duc Hue, and the Svay Rieng border only five kilometers away nearly enveloped this exposed position.\n\n[Le Gro, Vietnam from Ceasefire to Capitulation, p. 93] Although units of the 6th and 174th Regiments of the 5th Division had fought in the Tri Phap battle, other battalions of these two regiments were in the Angel's Wing along with divisional art illery. South of Duc Hue, the K-7 Sapper Battalion of Long An was ready to strike. On 27 March at 0300 the attack began on the RVNAF base at Duc Hue. Defending against two battalions of the NY A 6th Regiment was the ARVN 83d Ranger Battalion. Across the border in Cambod ia NVA 10S-mm. arti llery fired at the defenders while recoilless rines and heavy mortars (12O-mm.) bombarded the garrison from closer ranges. Although 30 ARVN Rangers died, the NVA infantry assault failed to break the position; the two battalions of the 6th NVA Regiment were forced to wihdraw, leaving 95 dead on the battlefield, together with a large number of weapons. Under orders to maintain a loose siege of the Duc Hue post, the NVA, assisted by the local sapper battalion, blocked the only land access to the camp and continued the artillery bombardment but abandoned the idea of taking il by stonn. On the AR VN side. the 25th Division committed a task force consisting of a battalion of the 46th Infantry, a battalion of the 50th Infantry, and a tank company to break the siege. [...] As April wore on, the threat of renewed assaults on Duc Hue by the NV A 5th Division remained. [...] LI. Gen. Pham Quoc Thuan, III Corps Commander, determined that he must reduce the threat to his western nank and the Tay Ninh corridor while he had the opportunity to do so. [...] The details and timing of the operation were carefully safeguarded, and few, ifany, Americans in the U.S. Mission knew anything about it until 27 April when 45 sorties struck targets in Cambodia and known and suspected bases of the 5th NY A Division. These strikes began Phase I, [...] While Phase I of the ARYN sweep into Svay Rieng was getting started,"
  summarized_by: "Claude Opus 5.5"
