- month: 3
  day: 4
  year: 1968
  title: "Clifford committee proposes 22,000 reinforcements"
  body: "<p>On March 4, 1968, the committee headed by incoming Secretary of Defense Clark Clifford forwarded its recommendations to President Johnson. Johnson had appointed the task force on 28 February to examine afresh COMUSMACV's request for a 205,000-man reinforcement and the mobilization issue, as part of a major review of Vietnam policy and strategy.</p>\n<p>The committee proposed the immediate deployment of about 22,000 reinforcements over and above the Program Five level, which could be done from existing resources, and the mobilization of some 262,000 reservists to improve the strategic reserve. A decision on deploying the rest of the 205,000 was to be deferred, contingent upon a \"week-by-week\" review of the situation in South Vietnam. The committee proposed no new guidance for the ground campaign and reported itself divided on ROLLING THUNDER.</p>\n<p>On 5 March, at the President's direction, General Wheeler informed General Westmoreland that he was unlikely to receive any reinforcements beyond the 22,000 Clifford proposed.</p>"
