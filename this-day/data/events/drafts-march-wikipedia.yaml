- month: 3
  day: 7
  year: 1966
  title: "Two brigades open Operation SILVER CITY in War Zone D"
  body: "<p>On March 7, 1966, the 1st Division's 1st Brigade under Colonel Glotzbach moved southeast of Phuoc Vinh to its area of operations, called NEVADA, for Operation SILVER CITY. At the same time the 173d Airborne Brigade, commanded by Brig. Gen. Paul F. Smith, moved into its own area, code-named ARIZONA, which extended eastward from the Song Be into War Zone D. The goal was to destroy the headquarters of the B2 Front's Military Region 1 and to bring to battle its five major units, almost nine thousand men.</p>\n<p>On 16 March nearly two thousand soldiers of the 271st Regiment attacked Lt. Col. John J. Walsh's 2d Battalion, 503d Infantry, and left 303 dead behind. The Americans suffered 7 killed and 162 wounded.</p>\n<p>The 173d Airborne Brigade pulled back on 22 March, followed the next day by the 1st Brigade. In all, the two units had killed 353 Viet Cong soldiers and destroyed some three hundred seventy tons of rice. American losses came to 11 killed and 228 wounded.</p>"
