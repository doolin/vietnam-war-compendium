- month: 3
  day: 29
  year: 1971
  title: "North Vietnamese and Viet Cong storm Duc Duc"
  body: "<p>On March 29, 1971, at 0210, an estimated two battalions of the 38th Regiment, reinforced by two Viet Cong sapper battalions, stormed into Duc Duc, whose district headquarters lay just west of An Hoa in Quang Nam. Under cover of a mortar and rocket barrage, the North Vietnamese struck at the district headquarters compound while the sappers began destroying the nearby civilian hamlets. The defenders, the 412th Regional Force Company and the 123d Popular Force Platoon with a handful of U.S. Army advisors, were soon surrounded.</p>\n<p>The 1st MAW's Black Hammer helicopter patrol attacked targets around the compound for almost four hours until the North Vietnamese broke off the attack and fell back toward the Thu Bon River.</p>\n<p>In the attack and the two days of fighting that followed, the North Vietnamese lost at least 59 killed, and the defenders 20 dead and 26 wounded. In the blazing hamlets 103 South Vietnamese civilians died, 96 were injured, and 37 were kidnapped. At least 1,500 homes were demolished.</p>"
