- month: 3
  day: 18
  year: 1960
  title: "Washington conference urges advisers for provincial governments"
  body: "<p>On March 18, 1960, a military conference in Washington concluded that in South Vietnam \"military operations without a sound political bases will be only a temporary solution.\" The conference had been stimulated by a report from Edward Lansdale, a CIA operative and confidant of Diệm.</p>\n<p>The conference recommended that the U.S. assign advisers to Vietnamese provincial governments to attempt to overcome shortcomings of the government at the local as well as the national level. The recommendation had little immediate impact.</p>"
