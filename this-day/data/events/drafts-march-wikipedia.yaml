  status: "draft"
  source_text: "[Wikipedia, 1960_in_the_Vietnam_War, rev 1370279430] Stimulated by a report from CIA operative and Diệm confidant Edward Lansdale, a military conference in Washington concluded that in South Vietnam \"military operations without a sound political bases will be only a temporary solution.\" The conference recommended that the U.S. assign advisers to Vietnamese provincial governments to attempt to overcome shortcomings of the government at the local as well as the national level. The recommendation had little immediate impact."
