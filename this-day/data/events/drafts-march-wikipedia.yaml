    - label: "Wikipedia, \"1971 in the Vietnam War\", revision 1370279651 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1971_in_the_Vietnam_War&oldid=1370279651"
  status: "draft"
  source_text: "[Cosmas and Murray, Vietnamization and Redeployment, p. 231] The heaviest ground attack occurred at Duc Duc District Headquarters, just west of An Hoa on th e eastern bank of the Thu Bon River and within easy striking distance from Base Area 1127 5 Here, for th e first time since late 1970, Front 4 committed its sol e remaining North Vietnamese regular infantry unit, th e 38th Regiment. [...] At 0210 on 29 March, an estimated two battalion s of the 38th Regiment, consisting largely of wellequipped men fresh from North Vietnam, reinforce d by two Viet Cong sapper battalions, stormed into Du c Duc . Under cover of a mortar and rocket barrage, th e NVA struck directly at the district headquarters compound, while the sappers began systematically destroy ing the nearby civilian hamlets . Duc Duc's defenders, the 412th Regional Force Company and the 123 d Popular Force Platoon with a handful of U.S . Army advisors, fell back to the district headquarters compound and made a stand . Soon the North Vietnames e had them completely surrounded and enemy infantry had reached the perimeter defensive wire . [...] With the villages around Duc Duc in flames, a VC flag flying near the district headquarters, and the district compound under intense attack, the 1st MAW's Black Hammer helicopter patrol intervened with decisive effect.\n\n[Cosmas and Murray, Vietnamization and Redeployment, p. 232] The Black Hammer flight remained in action over Duc Duc for almost four hours . [...] Finally, the North Vietnamese broke off the attack and fel l back northwestward toward the Thu Bon River, [...] In the initial attack and the two days of fighting that followed, th e North Vietnamese lost at least 59 men killed, whil e the RFs and PFs who had defended the compoun d suffered 20 dead and 26 wounded . Tragically 10 3 South Vietnamese civilians had died in the blazin g hamlets; 96 more had been injured and 37 kidnapped . At least 1,500 homes had been demolished .\n\n[Cosmas and Murray, Vietnamization and Redeployment, p. 231] Campaign, it appeared the VC/NVA had decided to progressively increase the pressure against the GV N forces and, in general, the Vietnamese pacification effort as final withdrawal of Marines from Quang Nam neared ."
  summarized_by: "Claude Opus 5.5"
