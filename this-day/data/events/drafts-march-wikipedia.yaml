  status: "draft"
  source_text: "[Cosmas, The JCS and the War in Vietnam 1960–1968 Part 3, p. 161] On 28 February, he appointed a task force, headed by incoming Secretary of Defense Clark Clifford, to examine afresh the reinforcement and mobilization issue as part of a major review of Vietnam policy and strategy. The committee, which included General Wheeler as well as General Maxwell Taylor and representatives of the State, Defense, and Treasury Departments, was instructed to report to the President by 4 March on the military implications of five possible courses of action. The five courses of action were: 1) to honor COMUSMACV’s request as submitted;\n\n[Cosmas, The JCS and the War in Vietnam 1960–1968 Part 3, p. 162] The Clifford committee heard other influential voices in opposition to the 205,000-man reinforcement.\n\n[Cosmas, The JCS and the War in Vietnam 1960–1968 Part 3, p. 163] The Clifford committee forwarded its recommendations to the President on 4 March. The committee proposed the immediate deployment of about 22,000 reinforcements over and above the Program Five level, which could be done from existing resources. In addition, the administration should mobilize enough reservists, some 262,000, to improve the strategic reserve and make forces available to grant COMUSMACV’s full request if the President ultimately decided to do so. [...] That was as far, however, as the committee would go toward escalation. Beyond the 22,000 immediate reinforcements, a decision on deploying the rest of the 205,000 should be deferred, contingent upon a “week-by-week” review of the situation in South Vietnam. At the insistence of the Joint Chiefs of Staff, who opposed any imposition of military tactics on the field commander, the committee proposed no new guidance for the ground campaign.\n\n[Cosmas, The JCS and the War in Vietnam 1960–1968 Part 3, p. 164] On the question of ROLLING THUNDER, the committee reported itself divided. [...] On 5 March, at the President’s direction, General Wheeler informed General Westmoreland that he was unlikely to receive any reinforcements beyond the 22,000 Clifford proposed; in effect, the 205,000 request was dead."
  summarized_by: "Claude Opus 5.5"
