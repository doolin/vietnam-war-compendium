- month: 4
  day: 27
  year: 1969
  title: "25th Division unit repulses battalion assault near Trảng Bàng"
  body: "<p>On April 27, 1969, an estimated battalion of PAVN assaulted a night defensive position of a unit of the 2nd Brigade, 25th Infantry Division, 10 km northeast of Trảng Bàng. The attack was repulsed. PAVN/VC losses were 100 killed and one captured, and 32 individual and 23 crew-served weapons were captured. U.S. losses were ten killed.</p>"
