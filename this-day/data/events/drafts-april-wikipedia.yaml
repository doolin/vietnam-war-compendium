- month: 4
  day: 28
  year: 1970
  title: "Kien Tuong territorial forces raid the Crow's Nest"
  body: "<p>On April 28, 1970, territorial forces of Kien Tuong Province made another foray into the Crow's Nest area, supported by 9th Division artillery units positioned on the RVN side of the border. After two days of activities, all within three km inside Cambodia, the Kien Tuong territorial forces had killed 43 and captured two enemy while suffering two killed and 42 wounded.</p>\n<p>No U.S. advisers accompanied the ARVN forces into Cambodia, but U.S. command helicopters and gunships supported them, and U.S. medevac helicopters were authorized to fly into Cambodia to evacuate downed U.S. pilots. VNAF helicopters were responsible for evacuating ARVN soldiers wounded in Cambodia. The results of these raids were significant but limited by their scope and the relatively small forces committed, and to the JGS it was clear that a U.S./RVNAF operation penetrating deeper into Cambodia was needed.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Tran, \"The Cambodian Incursion\", United States Army Center of Military History, 1979, pp. 49–50"
      url: "https://apps.dtic.mil/dtic/tr/fulltext/u2/a324718.pdf"
    - label: "Wikipedia, \"1970 in the Vietnam War\", revision 1377614479 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1970_in_the_Vietnam_War&oldid=1377614479"
  status: "draft"
  source_text: "[Tran, The Cambodian Incursion, p. 49] On 28 April, territorial forces of Kien Tuong Province made another foray into the Crow's Nest area with the support of 9th Division artillery units positioned on the RVN side of the border. After two days of activities which all took place within a distance of three km inside Cambodia, the Kien Tuong territorial forces had killed 43 and captured two enemy, while suffering two killed and 42 wounded. As in the previous operation conducted by the 9th Division, no U.S. advisers had accompanied ARVN forces into Cambodia. But in both operations, ARVN forces were supported by U.S. command helicopters and gunships. During the incursion by the Kien Tuong territorial forces on 28 April, U.S. medevac helicopters were authorized to fly into Cambodia for the evacuation of downed U.S. pilots. VNAF helicopters, however, were responsible for the evacuation of ARVN soldiers wounded in Cambodia.\n\n[Tran, The Cambodian Incursion, p. 50] The results from these raids were significant, but were limited due to their scope and the relatively small forces committed. It was clear to the JGS that a U.S./RVNAF operation, which would penetrate deeper into Cambodia, was needed."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T15:30:00Z"
- month: 4
  day: 29
  year: 1970
  title: "ARVN task forces cross into Cambodia in TOAN THANG 42"
  body: "<p>On April 29, 1970, three ARVN task forces of III Corps crossed the border into Cambodia, opening Phase I of TOAN THANG 42 against the Angel's Wing area. On April 14 the JGS had directed III Corps to coordinate with the U.S. Field Force II on an operation to destroy and neutralize NVA bases in Svay Rieng Province of Cambodia, secure Route No. 1 for the ground repatriation of Vietnamese residents in Cambodia, clear enemy pressure, and assist Khmer forces.</p>\n<p>The task forces, designated 318, 225, and 333, combined armored cavalry squadrons, an infantry regiment of the 25th Division, and four ranger battalions of the 2d Ranger Group. After preparatory bombardments by tactical aircraft and artillery, TF 318 advanced westward along Route No. 1 while TF 225 and TF 333 moved west and south. In the first two days all three made heavy contact. The enemy, fighting from solid fortifications, inflicted 16 killed and 157 wounded on the ARVN forces and lost 84 killed and 65 weapons captured.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Tran, \"The Cambodian Incursion\", United States Army Center of Military History, 1979, pp. 42, 54, 56"
      url: "https://apps.dtic.mil/dtic/tr/fulltext/u2/a324718.pdf"
    - label: "Wikipedia, \"1970 in the Vietnam War\", revision 1377614479 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1970_in_the_Vietnam_War&oldid=1377614479"
  status: "draft"
  source_text: "[Tran, The Cambodian Incursion, p. 42] Designated as TOAN THANG 42, the operation plan was to be implemented in two phases. In Phase 1, beginning on 29 April 1970, III Corps forces were to attack the Angel's Wing area.\n\n[Tran, The Cambodian Incursion, p. 54] On 14 April 1970, therefore, the JGS directed III Corps to coordinate with the U.S. Field Force II for the initiation of an operation with the objectives of destroying and neutralizing NVA bases in Svay Rieng Province of Cambodia, securing Route No. 1 for the ground repatriation of Vietnamese residents in Cambodia,, clearing enemy pressure, and assisting Khmer forces in this area. [...] ARVN forces which were to participate in this operation consisted of two armored cavalry squadrons organic to III Corps, augmented by two others organic to the 25th and 5th Infantry Divisions respectively, one infantry regiment of the 25th Division, and four ranger battalions of the 2d Ranger Group which was organic to III Corps. These units were organized into infantry-armor task forces, designated 318, 225 and 333, and placed under the command of III Corps Headquarters.\n\n[Tran, The Cambodian Incursion, p. 56] On the morning of 29 April 1970, the ARVN task forces crossed the border after preparatory bombardments of target areas by tactical aircraft and artillery. TF 318 advanced westward along Route No. 1 while TF 225 and TF 333 moved west and south. During the first two days, all ARVN task forces made heavy contact with the enemy while advancing toward their objectives. [...] During the first two days of the operation, the enemy had put up a fierce resistance, inflicting on friendly forces .16 killed and 157 wounded. For his part, the enemy suffered 84 killed and 65 weapons captured. Friendly casualties were high because the enemy had solid fortifications and resisted stubbornly."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T15:30:00Z"
- month: 4
  day: 30
  year: 1966
  title: "1st of the 2d Infantry fires across the Cambodian border"
  body: "<p>On April 30, 1966, two battalions of Colonel Glotzbach's 1st Brigade, 1st Infantry Division, swept north along the east bank of the Rach Cai Bac river, the border between South Vietnam and Cambodia, during Operation BIRMINGHAM. That morning the Americans began to take fire both from across the river in Cambodia and from a hamlet named Lo Go on the Vietnamese side. Invoking its right of self-defense under MACV's rules of engagement, Lt. Col. Richard L. Prillaman's 1st of the 2d Infantry turned its guns on the border and silenced the Viet Cong.</p>\n<p>Prillaman's men and Lt. Col. William S. Hathaway's 2d of the 16th Infantry then concentrated on Lo Go. Hathaway's Company A enveloped the insurgents' eastern flank, killing 8 and destroying company-size fortifications. The Viet Cong, later identified as part of the C230 Battalion, withdrew in midafternoon. The Americans counted 54 enemy dead and estimated another 100 killed, at a cost of 6 killed and 9 wounded.</p>"
