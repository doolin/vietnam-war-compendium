- month: 4
  day: 20
  year: 1970
  title: "ARVN 9th Division strikes west of the Crow's Nest"
  body: "<p>On April 20, 1970, elements of the ARVN 9th Infantry Division attacked the area west of the Crow's Nest, about 6 km inside Cambodia, with the support of armor and artillery. The operation, code-named CUU LONG/SD9/06, was one of the limited operations that IV Corps coordinated with local Khmer authorities in areas adjacent to the border before April 30, 1970.</p>\n<p>The ARVN forces clashed violently with the enemy, killing 187 while suffering 24 dead and 111 wounded. They seized a cache of more than 1,000 assorted weapons and large quantities of ammunition. U.S. advisers were not permitted to accompany the ARVN units and remained in South Vietnam. Thirty CH-47 helicopter sorties carried captured weapons and ammunition back, but the ammunition cache was too large to haul out safely by helicopter, and the IV Corps Commander decided to destroy the remainder on the spot. The 9th Division returned to South Vietnam on April 23.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Tran, \"The Cambodian Incursion\", United States Army Center of Military History, 1979, pp. 48–49"
      url: "https://apps.dtic.mil/dtic/tr/fulltext/u2/a324718.pdf"
    - label: "Wikipedia, \"1970 in the Vietnam War\", revision 1377614479 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1970_in_the_Vietnam_War&oldid=1377614479"
  status: "draft"
  source_text: "[Tran, The Cambodian Incursion, p. 48] CUU LONG/SD9706 Prior to 30 April 1970, IV Corps coordinated with local Khmer authorities in areas adjacent to the RVN border for the conduct of limited operations. One of these operations was launched on 20 April 1970 when elements of the ARVN 9th Infantry Division attacked the area west of the Crow's Nest, about 6 km inside Cambodia, with the support of armor and artillery.\n\n[Tran, The Cambodian Incursion, p. 49] During this operation, which was code-named CUU LONG/SD9/06, our forces clashed violently with the enemy, killing 187 while suffering 24 dead and 111 wounded. Our forces also found and seized an important enemy weapon cache containing in excess of 1,000 assorted weapons and large quantities of ammunition. U.S. advisers were not permitted to accompany ARVN units during this operation; they all remained in South Vietnam, monitoring their units' progress and assisting with support. A total of 30 CH-47 helicopter sorties were used to carry captured weapons and ammunition back to the RVN. However, the ammunition cache was so large that it was impossible to transport all of it back safely by helicopters. Therefore, after 30 sorties, the IV Corps Commander decided to destroy the remainder on the spot. After three days of operation, the 9th Division returned to South Vietnam on 23 April."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T15:30:00Z"
- month: 4
  day: 22
  year: 1970
  title: "Nixon weighs Cambodia options with the NSC"
  body: "<p>On April 22, 1970, President Nixon met with the members of the National Security Council, among them Vice President Spiro Agnew, Secretary of Defense Melvin Laird, Secretary of State William Rogers, General Earle Wheeler, and Presidential Assistant Henry Kissinger. Nixon insisted that \"there should be no note taker,\" and apparently no record of the meeting was made.</p>\n<p>In his memoirs Kissinger recalled that the domestic reaction to action in Cambodia loomed heavily and that the council faced three options: current shallow operations, preferred by Laird and Rogers; attacking the sanctuaries with GVN troops and U.S. tactical and logistical support but no ground troops, his own preference; or an all-out U.S. and GVN attack, the choice of Bunker, Abrams, and the Joint Chiefs. Nixon announced his support for the second. Wheeler recommended that the South Vietnamese attack the Parrot's Beak. Agnew said he did not understand \"all the pussyfooting about\" and favored attacking the Parrot's Beak and the Fishhook with U.S. troops. Kissinger believed Agnew's stance accelerated Nixon's decision to go for the maximum option.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "United States Department of State, Office of the Historian, \"Foreign Relations of the United States, 1969–1976, Volume VI, Vietnam, January 1969–July 1970\", Document 248 (Editorial Note), pp. 849–850"
      url: "https://history.state.gov/historicaldocuments/frus1969-76v06/d248"
    - label: "Wikipedia, \"1970 in the Vietnam War\", revision 1377614479 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1970_in_the_Vietnam_War&oldid=1377614479"
  status: "draft"
  source_text: "[FRUS 1969–1976, vol. VI, doc. 248, Editorial Note, p. 849] On April 22, 1970, from 3:04 to 4:42 p.m., President Nixon met with the members of the National Security Council. The participants, in addition to the President, were Vice President Spiro Agnew , Secretary of Defense Melvin Laird , Secretary of State William Rogers , Chairman of the Joint Chiefs of Staff General Earle Wheeler (who resumed his duties in time to attend the meeting), Director of Central Intelligence Richard Helms , Presidential Assistant Henry Kissinger , and the Director of the Office of Emergency Preparedness, General George A. Lincoln . [...] The President also insisted that “there should be no note taker.” [...] No contemporary record of this meeting has been found and apparently none was made.\n\nIn his memoirs Kissinger provides a relatively full account of the meeting recalling that the National Security Council was faced with three options: current shallow operations (preferred by Laird and Rogers ), attacking the sanctuaries with GVN troops with U.S. tactical and logistical support but no ground troops ( Kissinger ’s preference), or all out U.S. and GVN attack on the sanctuaries (the choice of Bunker , Abrams , and the Joint Chiefs).\n\n[FRUS 1969–1976, vol. VI, doc. 248, Editorial Note, p. 850] Kissinger recalls that the domestic reaction to action in Cambodia loomed heavily during the meeting. [...] At this meeting Nixon broke his usual habit of not announcing his position until after the deliberations by announcing his support of GVN operations with U.S. support but not U.S. ground troops. Wheeler recommended that the South Vietnamese attack the Parrot’s Beak and then the discussion turned to what to do about the other sanctuaries with Laird and Rogers trying to limit the U.S. role. At this point, Kissinger recalls that Agnew stated that either the sanctuaries were worth attacking or were not. He did not understand “all the pussyfooting about.” He favored an attack on the Parrot’s Beak and the Fishhook including the use of U.S. troops. [...] Kissinger believes that Agnew ’s stance accelerated Nixon ’s decision to go for the maximum option. ( White House Years , pages 490–492)"
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T15:30:00Z"
- month: 4
  day: 23
  year: 1965
  title: "Time puts Lt. Col. Robinson Risner on its cover"
  body: "<p>On April 23, 1965, USAF Lieutenant Colonel James Robinson Risner, commander of the 67th Tactical Fighter Squadron, was featured on the cover of Time magazine. Risner had been assigned as commander of the squadron at Kadena Air Base, Okinawa, in August 1964, and flew the F-105 Thunderchief. While on temporary duty with the squadron at Korat Royal Thai Air Force Base, Thailand, he was shot down over North Vietnam in April 1965 and was rescued. In the Korean War he had flown more than 100 combat missions in F-86s and became the 20th jet ace, credited with eight enemy aircraft destroyed.</p>\n<p>Risner returned to duty and in September 1965 was shot down again over North Vietnam and captured. While held prisoner in Hanoi he served first as the senior ranking officer and later as vice commander of the 4th Allied Prisoner-of-War Wing. He was repatriated in February 1973.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "U.S. Air Force, \"Brigadier General Robinson Risner\" (official biography), af.mil, current as of January 1976"
      url: "https://www.af.mil/About-Us/Biographies/Display/Article/105823/brigadier-general-robinson-risner/"
    - label: "Wikipedia, \"1965 in the Vietnam War\", revision 1370279555 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1965_in_the_Vietnam_War&oldid=1370279555"
  status: "draft"
  source_text: "[Wikipedia, 1965_in_the_Vietnam_War, rev 1370279555] USAF Lieutenant Colonel James Robinson Risner commander of the 67th Tactical Fighter Squadron is featured on the cover of Time magazine. On 15 September Risner's F-105 was shot down over North Vietnam and he was captured and held as a prisoner of war until 12 February 1973.\n\n[U.S. Air Force, Brigadier General Robinson Risner biography, current as of January 1976] In May 1952 General Risner was assigned to the 336th Fighter Interceptor Squadron, 4th Fighter Wing, at Kimpo, Korea. While with the 336th Squadron, he flew more than 100 combat missions in F-86s against Mig-15s over North Korea. He is credited with eight enemy aircraft destroyed and became the 20th jet ace during the Korean War. [...] In August 1964 General Risner was assigned as commander of the 67th Tactical Fighter Squadron, Kadena Air Base, Okinawa, where he flew the F-105 Thunderchief. While on temporary duty with the 67th Tactical Fighter Squadron at Korat Royal Thai Air Force Base, Thailand, he was shot down over North Vietnam in April 1965 and was rescued. General Risner was returned to duty and in September 1965 was shot down again over North Vietnam and captured.\n\nWhile held prisoner in Hanoi, General Risner served first as the senior ranking officer and later as vice commander of the 4th Allied Prisoner-of-War Wing. He was repatriated in February 1973 and in July 1973 assigned to the 1st Tactical Fighter Wing, MacDill Air Force Base, Fla., where he became combat ready in the F-4."
  summarized_by: "Claude Opus 5.5"
