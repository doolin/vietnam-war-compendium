  year: 1975
  title: "Ford authorizes Operation Babylift"
  body: "<p>On April 3, 1975, faced with mounting evidence of the imminent fall of South Vietnam, President Gerald R. Ford authorized the evacuation of thousands of Vietnamese orphans, many fathered by American military personnel, to the United States. The evacuation became known as Operation Babylift. Ford later wrote that he directed that money from a $2 million special foreign aid children's fund be made available to fly two thousand South Vietnamese orphans to the United States, ordered American officials in Saigon to cut through any red tape, and told the Air Force to begin the flights.</p>\n<p>The first planeload of orphans bound for the United States crashed shortly after taking off from Saigon, killing more than 200 people, the majority of them children. On April 5, Ford greeted a chartered jet carrying 325 South Vietnamese children at San Francisco International Airport and joined volunteers carrying the children off the aircraft.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Gerald R. Ford Presidential Library & Museum, \"Operation Babylift\", topic guide"
      url: "https://www.fordlibrarymuseum.gov/library/exhibits/babylift/babylift.asp"
    - label: "Wikipedia, \"1975 in the Vietnam War\", revision 1380222781 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1975_in_the_Vietnam_War&oldid=1380222781"
  status: "draft"
  source_text: "[Ford Library, Operation Babylift, photo caption] A3860-28A. President Ford carries a Vietnamese baby from “Clipper 1742,\" one of the Operation Babylift planes that transported approximately 325 South Vietnamese orphans from Saigon to the United States. San Francisco International Airport. April 5, 1975.\n\n[Ford Library, Operation Babylift] Faced with mounting evidence of the imminent fall of South Vietnam, President Gerald R. Ford authorized the evacuation of thousands of Vietnamese orphans (many fathered by American military personnel) to the United States on April 3, 1975. This evacuation became known as Operation Babylift. Two days later he greeted a planeload of orphans at San Francisco International Airport.\n\n[Ford, A Time to Heal, p. 252, quoted on the Ford Library page] Early in April, I directed that money from a $2 million special foreign aid children's fund be made available to fly two thousand South Vietnamese orphans to the United States as soon as possible. I ordered American officials in Saigon to cut through any red tape that might stand in the way of the children's escape. Then I told our Air Force to begin those mercy flights as soon as possible.\n\n[Nessen, It Sure Looks Different from the Inside, p. 99, quoted on the Ford Library page] That night, after a second meeting with [Secretary of State Henry] Kissinger and [U.S. Army Chief of Staff Frederick] Weyand, the president flew to the San Francisco International Airport in a rainstorm to welcome a chartered jet bringing 325 South Vietnamese children to safety. [...] Ford joined other volunteers carrying the children off the fetid aircraft to ambulances and buses.\n\n[Weidenfeld, First Lady's Lady, pp. 112-113, entry of April 5, 1975, quoted on the Ford Library page] …The first planeload of South Vietnamese orphans, bound for the United States and adoption by American families, crashed shortly after taking off from Saigon yesterday. More than 200 people were killed, the majority of them children,"
