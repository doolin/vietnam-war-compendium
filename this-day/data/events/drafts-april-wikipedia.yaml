- month: 4
  day: 12
  year: 1975
  title: "Marines evacuate Phnom Penh in Operation Eagle Pull"
  body: "<p>On April 12, 1975, U.S. Marines carried out Operation Eagle Pull, the evacuation of Phnom Penh. Shortly after 0600, 12 CH-53s from HMH-462 launched from the USS Okinawa to carry 360 Marines and corpsmen of BLT 2/4 on the 130-mile journey to the Cambodian capital. The helicopters set down in Landing Zone Hotel, a soccer field in an apartment complex on the Mekong River's west bank, where large crowds of Cambodians confronted the Marines, most of them out of curiosity. The American Embassy officially closed at 0945, nearly an hour after the first helicopters landed.</p>\n<p>HMH-462 removed 287 evacuees, 84 of them U.S. citizens and 203 foreign nationals; the last aboard included Ambassador Dean and the acting president of the Khmer Republic, Saukham Khoy. HMH-463 then extracted the landing force. At approximately 1050, 107mm rocket fire began impacting near the zone, followed by 82mm mortar fire. The last element of BLT 2/4 left the zone at 1059. Neither the Marines nor any of the other participants sustained casualties.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "History and Museums Division, \"U.S. Marines in Vietnam: The Bitter End, 1973–1975\", Headquarters, U.S. Marine Corps, 1990, pp. 118–123"
      url: "https://www.usmcu.edu/Portals/218/U_S_%20Marines%20In%20Vietnam%20-%20The%20Bitter%20End%201973%20-%201975.pdf"
    - label: "Wikipedia, \"1975 in the Vietnam War\", revision 1380222781 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1975_in_the_Vietnam_War&oldid=1380222781"
  status: "draft"
  source_text: "[The Bitter End, p. 118, photo caption] A Marine helicopter gunner views Phnom Penh. The first helicopter from HMH-462 departed the USS Okinawa at 0607 on 12 April. beginning Operation Eagle Pull.\n\n[The Bitter End, p. 119] meant that HMH-462 would insert the landing force and extract the evacuees, and HMH-463, following in trail, would extract the landing force after all of the refugees had been rescued. [...] Shortly after 0600 on 12 April 1975, 12 CH-53s from HMH-462 launched from the deck of the Okinawa and ascended to their orbit stations above the task group. At 10-minute intervals, the helicopters returned to the deck of the Okinawa for loading. Elements of Companies F and H. and the command group embarked from the Okinawa while elements of Company G boarded their helicopters on the Vancouver. During the loading of 360 Marines and corpsmen, each helicopter topped off its fuel tanks and then waited for its turn to launch. [...] After the initial division left on its 130-mile journey to the\n\n[The Bitter End, p. 120, photo caption] Marines Jrom BLT 2/4 deploy to take up defensive positions aroundLanding Zone Hotel, a soccer field in an apartment comp/ex on the Mekong Rivers west bank in Phnom Penh.\n\n[The Bitter End, p. 121] Cambodian capital, each succeeding one followed at 10-minute intervals. [...] The American Embassy did not officially close until 0945, nearly an hour after the first helicopters landed. [...] Large crowds of Cambodians confronted the Marines, but for the most part they came out of curiosity and not to interfere. [...] HMH-462 actually removed 287, of which 84 were U.S. citizens and the rest, 203, foreign nationals.\n\n[The Bitter End, p. 122] Upon confirmation by the Embassy that the last citizens, including Ambassador Dean and the acting president of the Khmer Republic, Saukham Khoy. had safely boarded a HMH-462 helicopter, the squadron aircraft began extracting the landing force. At approximately 1050. 107mm rocket fire began impacting in the vicinity of Landing Zone Hotel. Less than 10 minutes later, the zone also received some 82mm mortar fire. [...] At 1059. the last element of BLT 2/4 left the zone\n\n[The Bitter End, p. 123] Neither the Marines nor any of the other participants sustained casualties."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T15:30:00Z"
- month: 4
  day: 15
  year: 1969
  title: "173d Airborne Brigade opens Operation Washington Green"
  body: "<p>On April 15, 1969, the 173d Airborne Brigade relinquished its role as a major United States reaction force in Vietnam and began Operation Washington Green in the four northern districts of Binh Dinh Province. The operation assigned the brigade the mission of conducting operations in support of GVN pacification under a \"Three Front Concept\": pursuing province and district pacification plans, upgrading the training, leadership, and combat effectiveness of all GVN forces in the area, and conducting combat operations that would complement pacification.</p>\n<p>US rifle companies were to collocate with Regional Force companies and conduct joint operations so that the territorial forces would \"learn by doing,\" and refugees were to be moved from overcrowded population centers and resettled, accompanied by security forces. In March 1969, intelligence sources estimated insurgent strength in the province at 5,000 Viet Cong.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Headquarters, 173d Airborne Brigade, \"Senior Officer Debriefing Report\", Department of the Army, 9 August 1970, pp. 8–9"
      url: "https://apps.dtic.mil/dtic/tr/fulltext/u2/512272.pdf"
    - label: "Wikipedia, \"1969 in the Vietnam War\", revision 1370279610 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1969_in_the_Vietnam_War&oldid=1370279610"
  status: "draft"
  source_text: "[173d Airborne Brigade, Senior Officer Debriefing Report, p. 8] OPERATION WASHINGTON GREEN . . On 15 April 1969 the 173d Airborne Brigade relinquished its role as a major United States reaction force in Vietnam to assume a new and challenging task in the four northern districts of Binh Dinh Province in AO Leo. The operation was named Washington Green and assigned the Brigade the mission of conducting operations in support of GVN Pacification. Involved were h wide variety of requirements, the principal of which form the so called \"Three Front Concept;\" these wero to be performed simultaneosly and included the pursuit of province and district pacification plans, the upgrading of the training, leadership, and combat effectiveness of all GVN forces operating in the AO, and finally the conduct of effectite combat operations that would complement, exploit, and further stabilize GVN agencies operating in support of pacification. [...] Next the refugees were to be moved from the overcrowded population centers along QLI and QL19 and resettled. They were to be accompanied by security forces which would protect the villages and deny the enemy access to the vital crop producing areas. [...] lurther, US rifle companies were to deploy to collocate with Regional Force (NF) companies and conduct joint operations. In this way the territorial Corces wore to \"learn by doing\".\n\n[173d Airborne Brigade, Senior Officer Debriefing Report, p. 9] It was into this atmosphere of communist dominance that the 173d Airborne Brigade entered in.,the ipring of 1969. In March of that year, intelligence sources estimated the insurgent strength to be 5,000 Viet Cong."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T15:30:00Z"
- month: 4
  day: 17
  year: 1963
  title: "Revised intelligence estimate declares Communist progress blunted"
  body: "<p>On April 17, 1963, the Board of National Estimates produced the final version of National Intelligence Estimate 53-63, whose first sentence read: \"We believe that Communist progress has been blunted and that the situation is improving.\" The estimate judged that the Viet Cong could be contained militarily and that further progress could be made in expanding the area of government control.</p>\n<p>The draft submitted on February 25 had warned that the struggle in South Vietnam \"at best will be protracted and costly,\" citing poor morale among the troops and obvious Communist penetration of the South Vietnamese military organization. At a United States Intelligence Board meeting on February 27, Director of Central Intelligence John A. McCone upbraided the Office of National Estimates for judgments that differed from those of \"the people who know Vietnam best\" and directed that their views be considered. Those officials, including Gen. Earle Wheeler, Adm. Harry Felt, and Gen. Paul Harkins, criticized the draft as too bleak. Over the objections of the Office of National Estimates staff, the Board bowed to the pressure.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Center for the Study of Intelligence, \"CIA and the Vietnam Policymakers: Three Episodes 1962-1968\", Episode 1, Central Intelligence Agency (Wayback Machine copy)"
      url: "https://web.archive.org/web/20070613042337/https://www.cia.gov/library/center-for-the-study-of-intelligence/csi-publications/books-and-monographs/cia-and-the-vietnam-policymakers-three-episodes-1962-1968/epis1.html"
    - label: "Wikipedia, \"1963 in the Vietnam War\", revision 1370279475 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1963_in_the_Vietnam_War&oldid=1370279475"
  status: "draft"
  source_text: "[CIA and the Vietnam Policymakers, Episode 1, epigraphs] The struggle in South Vietnam at best will be protracted and costly [because] very great weaknesses remain and will be difficult to surmount. Among these are lack of aggressive and firm leadership at all levels of command, poor morale among the troops, lack of trust between peasant and soldier, poor tactical use of available forces, a very inadequate intelligence system, and obvious Communist penetration of the South Vietnamese military organization. From the draft of NIE 53-63, \"Prospects in South Vietnam\" submitted by the Intelligence Community's representatives to the United States Intelligence Board, 25 February 1963 (1) [...] We believe that Communist progress has been blunted and that the situation is improving. . . . Improvements which have occurred during the past year now indicate that the Viet Cong can be contained militarily and that further progress can be made in expanding the area of government control and in creating greater security in the countryside. From that NIE's final version, 17 April 1963\n\n[CIA and the Vietnam Policymakers, Episode 1] In Washington, a significant distortion was, paradoxically, contributed by the Director of Central Intelligence himself, John A. McCone, [...] even though it had already diluted the even-darker working-level judgments of the Office of National Estimates (O/NE) staff and the Intelligence Community's representatives. McCone remanded their draft National Intelligence Estimate (NIE) and directed them to seek out the views of senior policymakers in a revised NIE.\n\n[CIA and the Vietnam Policymakers, Episode 1, In Washington] At the USIB meeting on 27 February 1963, before a room packed with Intelligence Community principals and staffers, DCI McCone upbraided O/NE Director Sherman Kent and his officers for having prepared an NIE whose judgments differed so widely from those of \"the people who know Vietnam best.\" McCone named a number of such officials (almost all of them senior policy advisers), and directed O/NE to see that their views were considered in a new, revised NIE. [...] These included the Army's Chief of Staff, Gen. Earle Wheeler; CINCPAC Adm. Harry Felt; MACV's Gen. Paul Harkins; [...] These \"people who knew Vietnam best\" were universally critical of the draft NIE. [...] All in all, the NIE's assessments were much too bleak. [...] In the end, however, the views of O/NE's staff members did not prevail. Over their objections the Board of National Estimates bowed to the pressure of the DCI and the draft's policymaking critics. On 17 April the Board produced a revised, final version of the Estimate whose first sentence flagged the change in tone which McCone's remanding had accomplished: \"We believe that Communist progress has been blunted and that the situation is improving.\""
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T15:30:00Z"
- month: 4
  day: 18
  year: 1966
  title: "Wild Weasels make first Shrike missile launch"
  body: "<p>On April 18, 1966, the AGM-45 Shrike missile was launched for the first time on a U.S. Air Force Wild Weasel mission. The missile had first been carried on a combat sortie on April 3, but a malfunction prevented launch. Starting on that date, after the F-100F's and F-105's were equipped with the Shrike, the Wild Weasel planes themselves began attacking Fan Song targets. If feasible, the lead aircraft made a dive delivery of the Shrike while the rest of the flight maneuvered for a homing run and attack.</p>\n<p>The Wild Weasel I missions, flown from Thailand beginning in December 1965, were part of the \"Iron Hand\" anti-SAM air campaign. An F-100F, with an electronic warfare officer in the back seat monitoring radar homing and warning equipment, attempted to home on SA-2 radar emissions and marked the target with rockets for the trailing F-105 killer aircraft. In April and May 1966 the weather improved, and five SAM installations were hit, three of them with heavy damage.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Wolk, \"USAF Plans and Policies R&D for Southeast Asia 1965-1967\", Office of Air Force History, 1969, pp. 31–33"
      url: "https://media.defense.gov/2011/Mar/22/2001330189/-1/-1/0/AFD-110322-017.pdf"
    - label: "Wikipedia, \"1966 in the Vietnam War\", revision 1380091905 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1966_in_the_Vietnam_War&oldid=1380091905"
  status: "draft"
  source_text: "[Wolk, USAF Plans and Policies R&D for Southeast Asia 1965-1967, p. 31] In late 1965, the appearance of a growing number of SA-2 installations prompted the Air Force to increase the number of Wild Weasel I aircraft to seven\n\n[Wolk, USAF Plans and Policies R&D for Southeast Asia 1965-1967, p. 32] The Wild Weasel I missions flown from Thailand beginning in December '1965 were part of the ttlron Handt' anti-SAM air campaign. [...] The F-100F radar homing and warning equipment was operated by an electronic warfare officer in the back seat of the aircraft. [...] The F-100F, as the hunter aircraft' attempted to home on SA-2 radar emissions by flying a planned track between 4, 500 and 15,000 feet while the electronic warfare officer monitored the special RHAW eguiprnent. [...] The F-105 killer aircraft trailed the Wild Weasel by about 15 seconds. After acquiring the target electronically, the F-100F would then attempt to acquire it visually and mark the target with rockets. Using the mark, the killer F-105's would deliver their ordnance.\n\n[Wolk, USAF Plans and Policies R&D for Southeast Asia 1965-1967, p. 33] Starting on 3 April 1966, after the F-100Frs (and the F-105rs) were equipped with the AGM-45 Shrike missile, the Wild Weasel planes themselves began attacking the Fan Song fire control \"\"dt.\". \" If feasible, a dive delivery of the Shrike rras made by the lead aircraft as the rest of the Weasel flight maneuvered as before for a homing run and attack. [...] Poor weather between 31 January and late March again interfered, although two SA-2 installations were attackedIn April and May the vueather improved and five SAM installations were hit with heavy damage inflicted on three of these sites.\n\n[Wolk, USAF Plans and Policies R&D for Southeast Asia 1965-1967, p. 33, footnote] * The missile was first caruled on a combat sorti.e on 3 April 1966, but a malfunction prevented launch. The first launch occurred on 18 April."
  summarized_by: "Claude Opus 5.5"
