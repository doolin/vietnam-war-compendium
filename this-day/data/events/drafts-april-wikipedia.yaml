    - label: "Wikipedia, \"1973 in the Vietnam War\", revision 1380647415 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1973_in_the_Vietnam_War&oldid=1380647415"
  status: "draft"
  source_text: "[Le Gro, Vietnam from Ceasefire to Capitulation, p. 36] Attempts by the ICCS, which was supposed to monitor shipments of all war materials into South Vietnam, to deploy to the border crossing points were efTectively thwarted by the Communists. One such efTort ended in tragedy on 7 April 1973 when two ICCS helicopters, nown under contract by Air America, were shot down along Route 9 in Quang Tri Province. en route to Lao Bao on the Laos frontier. One was hit by an SA-7 heat-seeking antiaircraft missile and crashed in the forest killing all nine passengers and crew. including a North Vietnamese officer who was suppose to be guiding the night over an approved course to Lao Bao. The other helicopter, hit by small arms and machine gun fire, made an emergency landing without casualties.\n\n[Le Gro, Vietnam from Ceasefire to Capitulation, p. 49, SA-7 tabulation] 7 Apr I Quang Tn I u n -I (ICCS), destroyed. 7 killed"
