- month: 4
  day: 7
  year: 1973
  title: "Missile downs ICCS helicopter on Route 9"
  body: "<p>On April 7, 1973, two ICCS helicopters, flown under contract by Air America, were shot down along Route 9 in Quang Tri Province while en route to Lao Bao on the Laos frontier. The ICCS was supposed to monitor shipments of all war materials into South Vietnam, and the Communists had thwarted its attempts to deploy to the border crossing points.</p>\n<p>One helicopter was hit by an SA-7 heat-seeking antiaircraft missile and crashed in the forest, killing all nine passengers and crew. Among the dead was a North Vietnamese officer who was supposed to be guiding the flight over an approved course to Lao Bao. The other helicopter, hit by small arms and machine gun fire, made an emergency landing without casualties.</p>"
  photo_url: null
  photo_alt: null
  references:
