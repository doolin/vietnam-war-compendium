- month: 8
  day: 3
  year: 1962
  title: "Australian Army Training Team Vietnam arrives in Saigon"
  body: "<p>On August 3, 1962, the first Australian troops committed to Vietnam arrived in Saigon. The group of 30 advisers was collectively known as the Australian Army Training Team Vietnam. Australia had announced on May 23, 1962, that it would send military instructors to Vietnam.</p>\n<p>As the conflict escalated, the commitment grew to involve the Australian Army, Navy and Air Force as well as civilian support. By the final withdrawal of the Australian Embassy Guard on July 1, 1973, approximately 60,000 Australian men and over 500 Australian women had served in the Vietnam War. More than 500 were killed or listed as missing presumed dead, and 3,131 were wounded.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Australian War Memorial, \"Vietnam, 1962-1975\", collection scope note, awm.gov.au"
      url: "https://www.awm.gov.au/collection/CN28"
    - label: "Wikipedia, \"1962 in the Vietnam War\", revision 1374503779 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1962_in_the_Vietnam_War&oldid=1374503779"
  status: "draft"
  source_text: "[Australian War Memorial, Vietnam, 1962-1975, scope note] Australia announced to send military instructors to Vietnam on 23 May 1962. The first Australian troops committed to Vietnam arrived in Saigon on 3 August 1962. This group of 30 advisers was collectively known as the Australian Army Training Team Vietnam. As the conflict escalated, so too did the pressure for an increased Australian commitment. This commitment grew to involve the Australian Army, Navy and Air Force as well as civilian support such as medical/surgical aid teams, war correspondents and officially sponsored entertainers. By the time of the final withdrawal of the Australian Embassy Guard on 1 July 1973, approximately 60,000 Australian men and over 500 Australian women had served in the Vietnam War. Of these, more than 500 were killed or listed as missing presumed dead, and 3,131 were wounded.\n\n[Wikipedia, 1962_in_the_Vietnam_War, rev 1374503779, entry for July 31] The Australian Army Training Team Vietnam arrived in South Vietnam beginning Australia's military commitment there."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T18:00:00Z"
- month: 8
  day: 4
  year: 1971
  title: "Court-martial of Col. Oran Henderson opens"
  body: "<p>On August 4, 1971, the court-martial of Col. Oran K. Henderson on charges arising from the killings of civilians in the South Vietnamese hamlet of Mylai 4 got under way at Fort Meade, Md., with the selection of a jury of two generals and five colonels. Henderson, the highest-ranking officer to be tried in the aftermath of the Mylai revelations, had commanded the 11th Infantry Brigade of the Americal Division at the time of the assault and watched the sweep from a command helicopter.</p>\n<p>He was accused of attempting to cover up the mass killings and of later lying about them before an official board of inquiry. The charges were dereliction of duty, failure to investigate allegations, and false swearing. At his arraignment he said, \"I am not guilty on all specifications and articles.\" The military judge, Col. Peter S. Wondolowski, recessed the court-martial until August 23 to give the defense and the prosecution time to summon and question witnesses.</p>\n"
  photo_url: null
  photo_alt: null
  references:
    - label: "Douglas Robinson, \"Court-Martial of Mylai Colonel Recessed After Jury Is Picked\", The New York Times, August 5, 1971, p. 6"
      url: "https://www.nytimes.com/1971/08/05/archives/courtmartial-of-mylai-colonel-recessed-after-jury-is-picked.html"
    - label: "Wikipedia, \"1971 in the Vietnam War\", revision 1370279651 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1971_in_the_Vietnam_War&oldid=1370279651"
  status: "draft"
  source_text: "[Robinson, New York Times, 5 Aug 1971, p. 6] FORT MEADE, Md., Aug. 4 The court‐martial of Col. Oran K. Henderson on charges arising from the killings of civilians in the South Vietnamese hamlet of Mylai 4 got under way today with selection of a seven‐mem ber jury of officers.\nColonel Henderson, the high est‐ranking officer to be tried in the aftermath of the Mylai revelations, is accused of at tempting to cover up the mass killings and of later lying about them before an official board of inquiry.\nAlthough a jury of two gen erals and five colonels was quickly seated today, the mili tary judge, Col. Peter S. Won dolowski, recessed the court martial until Aug. 23 to give the defense and the prosecution time to summon and question witnesses.\nColonel Henderson, 50 years old, was commander of the 11th infantry brigade of the America) Division at the time of the infantry assault on the hamlet; he watched the sweep from a command helicopter circling overhead.\nThe officer is charged with dereliction of duty, failure to investigate allegations of acts “though to he war crimes,” and false swearing in two ap pearances before a military hoard investigating the incident.\nToday, at his formal arraign ment, he said:\n“I am not guilty on all spe cifications and articles.”\nGeneral Koster was com mander of the Americal Divi sion and General Young was his assistant at the time of the Mylai incident.\n[Wikipedia, 1971_in_the_Vietnam_War, rev 1370279651] The court-martial began of Colonel Oran Henderson for his role in the Mỹ Lai massacre.\n"
  summarized_by: "Claude Opus 5.5"
