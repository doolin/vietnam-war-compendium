  source_text: "[Wikipedia, 1960_in_the_Vietnam_War, rev 1370279430] The U.S. government compiled a National Intelligence Estimate stating that support for the VC was increasing and that supplies and combatants were moving to them from North Vietnam overland and by sea. The Diệm government faced growing hostility. \"Criticism...focuses on Ngo family rule, especially the role of the President's brother Ngo Dinh Nhu and Madame Nhu, the pervasive influence of the Can Lao...[and if] these adverse trends....remain unchecked, they will almost certainly in time cause the collapse of Diệm's regime.\"\n"
