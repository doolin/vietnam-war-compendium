  year: 1963
  title: "Madame Nhu defends her criticism of Buddhist monks"
  body: "<p>On August 14, 1963, in a letter to The New York Times, Madame Nhu, sister-in-law of President Diệm, defended her strong criticisms of protesting Buddhist monks. She wrote, \"I would clap hands at seeing another monk barbecue show, for one can not be responsible for the madness of others.\"</p>\n"
