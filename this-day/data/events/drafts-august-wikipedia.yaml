  year: 1960
  title: "Intelligence estimate warns of collapse of Diệm regime"
  body: "<p>On August 23, 1960, the U.S. government compiled a National Intelligence Estimate stating that support for the VC was increasing and that supplies and combatants were moving to them from North Vietnam overland and by sea. The Diệm government faced growing hostility.</p>\n<p>\"Criticism...focuses on Ngo family rule, especially the role of the President's brother Ngo Dinh Nhu and Madame Nhu, the pervasive influence of the Can Lao,\" the estimate said. It warned that if \"these adverse trends....remain unchecked, they will almost certainly in time cause the collapse of Diệm's regime.\"</p>\n"
