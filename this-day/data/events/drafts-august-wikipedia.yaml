- month: 8
  day: 1
  year: 1966
  title: "Korean Marine advance echelon reaches Chu Lai"
  body: "<p>On August 1, 1966, the advance echelon of the 2d Korean Marine Brigade arrived in I Corps approximately three miles south of Chu Lai. The long-planned deployment of the brigade to I Corps somewhat alleviated the heavy strain that the new front along the DMZ, base defense, and pacification had placed on Marine manpower.</p>\n<p>The first echelons of the brigade arrived on August 18 and were assigned an area on the Batangan Peninsula in northern Quang Ngai Province, 17 miles southeast of the Chu Lai Airfield. By the end of the month the full brigade was established on the peninsula.</p>\n<p>General Walt, the III MAF commander, had coordinating authority over the Korean Brigade and no operational control. He and Brigadier General Lee Bong Chool, the Korean commander, formed a working arrangement that satisfied both sides.</p>\n"
  photo_url: null
  photo_alt: null
  references:
