  title: "Senate subcommittee opens hearings on the conduct of the war"
  body: "<p>On August 8, 1967, the Senate Preparedness Investigating Subcommittee began hearings on the conduct of the war. Military leaders testified that they were subject to undue restrictions from the civilian leadership, while McNamara testified that the bombing campaign was ineffective.</p>\n"
