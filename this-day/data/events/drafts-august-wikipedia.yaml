      url: "https://en.wikipedia.org/w/index.php?title=1964_in_the_Vietnam_War&oldid=1370342430"
  status: "draft"
  source_text: "[Wikipedia, 1964_in_the_Vietnam_War, rev 1370342430] Seven ARVN battalions, two armored cavalry troops, and naval forces tried to encircle the VC in Kien Hoa province's Ham Long District. In the ensuing battle, 7th Division artillery fired 3,222 rounds, and the RVNAF flew 10 fighter-bomber sorties. The allies killed 98 VC and captured 43 prisoners and 37 weapons. Agents reported that the VC buried another 200 dead and evacuated 300 wounded. ARVN losses were 17 killed and 45 wounded.\n"
  summarized_by: "Claude Opus 5.5"
