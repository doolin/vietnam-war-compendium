- month: 8
  day: 16
  year: 1966
  title: "House committee opens hearings on antiwar demonstrators"
  body: "<p>On August 16, 1966, the House Un-American Activities Committee began an investigation of Americans who had demonstrated against the war, seeking \"evidence that communist organizations were instigating their operations.\" Twelve demonstrators had been issued subpoenas to testify on activities such as urging donations to the VC.</p>\n<p>Eight people in attendance were forcibly removed from the hearing and arrested after they began shouting protests. Nine others were arrested outside the Capitol building for disturbance of the peace.</p>\n<p>The day before, U.S. District Judge Howard F. Corcoran had issued an injunction prohibiting the hearings from going forward, but a Court of Appeals order reversed the injunction, and the hearings took place as scheduled.</p>\n"
  photo_url: null
  photo_alt: null
  references:
    - label: "Wikipedia, \"1966 in the Vietnam War\", revision 1380091905 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1966_in_the_Vietnam_War&oldid=1380091905"
  status: "draft"
  source_text: "[Wikipedia, 1966_in_the_Vietnam_War, rev 1380091905] The House Un-American Activities Committee began an investigation of Americans who had demonstrated against the war, seeking \"evidence that communist organizations were instigating their operations\". Twelve demonstrators issued subpoenas to testify on activities such as urging donations to the VC. Eight people in attendance were forcibly removed from the hearing and arrested after they began shouting protests, while nine others were arrested outside the Capitol building for disturbance of the peace. U.S. District Judge Howard F. Corcoran had issued an injunction the day before, prohibiting the hearings from going forward, but a Court of Appeals order had reversed the injunction and the hearings took place as scheduled.\n"
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T18:00:00Z"
- month: 8
  day: 17
  year: 1971
  title: "Viet Cong mine sinks SS Green Bay at Qui Nhon"
  body: "<p>On August 17, 1971, a Viet Cong mine sank the freighter SS Green Bay at Qui Nhon, the largest merchant ship sunk during the war. The explosion injured two merchant mariners and ripped an 18-by-31-foot hole in the hull. The ship listed to starboard, capsized at the dock, and sank. Ultimately, the freighter had to be scrapped.</p>\n<p>Qui Nhon had seen earlier attacks. Sappers mined SS Americloud at a Delong Pier there on March 12, 1970; an explosion on March 21, 1971, blew a large hole in the starboard side of SS Robin Hood; and three months later Viet Cong sappers sank the fully loaded SS American Hawk at the same port. The enemy, in the history's words, \"scored their greatest coup\" with the Green Bay.</p>\n"
  photo_url: null
  photo_alt: null
  references:
    - label: "Mercogliano, \"Fourth Arm of Defense: Sealift and Maritime Logistics in the Vietnam War\", Naval History and Heritage Command, 2017, p. 56"
      url: "https://www.history.navy.mil/content/dam/nhhc/research/publications/publication-508-pdf/NHHC4thArmDefense_final_508.pdf"
    - label: "Wikipedia, \"1971 in the Vietnam War\", revision 1370279651 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1971_in_the_Vietnam_War&oldid=1370279651"
  status: "draft"
  source_text: "[Mercogliano, Fourth Arm of Defense, p. 56 (PDF page 62)] The upsurge began at 0456 on 12 March 1970, when sappers mined SS Americloud, which was tied to a Delong Pier at Qui Nhon. The explosion tore a huge hole in the ship’s hull, compelling tugs to move her away from the dock and into shallow water where she could be more easily refloated. Tugs took similar action on 22 September 1970 when the enemy exploded a device that badly damaged SS Americo, which was unloading ammunition at Cam Ranh. An explosion on 21 March 1971 at Qui Nhon blew a large hole in the starboard side of SS Robin Hood, requiring the ship’s departure from Vietnam for repairs. On 14 June at the same port three months later, Viet Cong sappers sank the fully loaded SS American Hawk in 33 feet of water.\nThe enemy scored their greatest coup with the 17 August 1971 attack in Qui Nhon against the freighter SS Green Bay, the largest merchant ship sunk during the war. The explosion injured two merchant mariners and ripped an 18-by-31-foot hole in the hull. The ship listed to starboard, capsized at the dock, and sank. Ultimately, the freighter had to be scrapped.\n[Mercogliano, Fourth Arm of Defense, p. 56 (PDF page 62), photo caption] SS Green Bay, sunk by a Viet Cong mine in August 1971, lists to port at the dock in Qui Nhon.\n[Wikipedia, 1971_in_the_Vietnam_War, rev 1370279651] VC sappers sank the SS Green Bay at port in Qui Nhơn, it was the largest merchant ship sunk during the war and ultimately had to be scrapped.\n"
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T18:00:00Z"
- month: 8
  day: 22
  year: 1964
  title: "ARVN encirclement in Kien Hoa kills 98 VC"
  body: "<p>On August 22, 1964, seven ARVN battalions, two armored cavalry troops, and naval forces tried to encircle the VC in Kien Hoa province's Ham Long District. In the ensuing battle, 7th Division artillery fired 3,222 rounds, and the RVNAF flew 10 fighter-bomber sorties.</p>\n<p>The allies killed 98 VC and captured 43 prisoners and 37 weapons. Agents reported that the VC buried another 200 dead and evacuated 300 wounded. ARVN losses were 17 killed and 45 wounded.</p>\n"
  photo_url: null
  photo_alt: null
  references:
