- month: 8
  day: 15
  year: 1967
  title: "General Loan arrests VC operatives bound for U.S. talks"
  body: "<p>On August 15, 1967, National Police chief General Nguyễn Ngọc Loan ordered the arrest of two VC operatives who were on their way to meet U.S. Embassy representatives as part of a secret initiative code-named Buttercup. On August 18 Loan advised the Americans of the arrest of Sau Ha and gave a CAS officer a copy of Sau Ha's letter.</p>\n<p>On November 4, Ambassador Bunker briefed President Thieu on the case, including a reply, approved in Saigon and Washington and reviewed by Loan, that expressed American willingness to cooperate in a prisoner exchange.</p>\n<p>On December 6, after leaks in the press, Bunker told Thieu that Loan, who had \"obviously been talking to the press,\" had \"in effect taken GVN policy into his own hands.\" Bunker said the United States had no intention of entering into talks with the NLF of which Thieu was not informed. Thieu replied that it was not possible now to release all the NLF prisoners Buttercup/1 had requested.</p>\n"
  photo_url: null
  photo_alt: null
  references:
    - label: "Office of the Historian, U.S. Department of State, \"Foreign Relations of the United States, 1964–1968, Volume V, Vietnam, 1967\", Document 383, Telegram From the Ambassador to Vietnam (Bunker) to Rostow, Rusk, McNamara, and Helms, November 4, 1967"
      url: "https://history.state.gov/historicaldocuments/frus1964-68v05/d383"
    - label: "Office of the Historian, U.S. Department of State, \"Foreign Relations of the United States, 1964–1968, Volume V, Vietnam, 1967\", Document 429, Telegram From the Ambassador to Vietnam (Bunker) to Rostow, Rusk, McNamara, and Helms, December 6, 1967"
      url: "https://history.state.gov/historicaldocuments/frus1964-68v05/d429"
    - label: "Wikipedia, \"1967 in the Vietnam War\", revision 1370279584 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1967_in_the_Vietnam_War&oldid=1370279584"
  status: "draft"
  source_text: "[Wikipedia, 1967_in_the_Vietnam_War, rev 1370279584] National Police chief General Nguyễn Ngọc Loan ordered the arrest of two VC operatives who were on their way to meet with U.S. Embassy representatives as part of a secret initiative code-named Buttercup. Loan's stand against such \"backdoor\" dealing, and his opposition to releasing one of the VC negotiators angered the Americans, and forced them to keep both him and the South Vietnamese better informed of diplomatic dealings involving their country.\n[FRUS 1964–68, Vol. V, Doc. 383, Saigon, November 4, 1967] CAS 456. In my meeting with President\nThieu this morning, I described the developments of the Buttercup case\nsince 18 August when General Loan\nadvised us of Sau Ha ’s arrest and\nprovided a CAS officer with a copy of\nSau Ha ’s letter. The President\nwas told of the arrangements worked out for the release of [ less than 1 line of source text not declassified ]\nand for his return to the VC zone to meet\nwith Buttercup/1 in order to transmit a reply which had been approved in\nSaigon and Washington and had been reviewed by General Loan , and which expressed American\nwillingness to cooperate in a prisoner exchange.\n[FRUS 1964–68, Vol. V, Doc. 429, Saigon, December 6, 1967] CAS 095. In my meeting with Thieu today I\nexpressed the desire to have a serious talk with him about the Buttercup\ncase, especially in view of the events of recent days. I noted the great\nimportance which President Johnson attached to this\nmatter and said that the recent leaks in the press have raised a serious\nquestion about our ability to work together closely and confidentially\non such matters in the future.\nNow, however,\nthe situation is confused and disrupted, perhaps the opportunity for\nmoving ahead has been destroyed by the actions of General Loan who has obviously been talking to\nthe press.\nWhile stressing the significance we attached to these matters, I\nemphasized that the U.S. Government has no intention of entering into\ntalks with the NLF of which he,\nPresident Thieu, is not informed; that responses to political overtures\nwould take place only after fullest consultation on both sides.\nIn this case a confidence has been violated by\nGeneral Loan who by his actions\nhad in effect taken GVN policy into his\nown hands and frustrated a matter of great sensitivity and importance to\nus all.\nThieu stated that he feared, in view of the unfortunate press\nrevelations, it was not possible now to release all of those on whom\naction had been requested by Buttercup/1.\n[FRUS 1964–68, Vol. V, Doc. 383, Saigon, November 4, 1967] that we wish to consider with President Thieu or his designee the\nrelease of NLF prisoners as requested by\nButtercup/1\n"
  summarized_by: "Claude Opus 5.5"
