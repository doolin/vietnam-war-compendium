- month: 8
  day: 5
  year: 1964
  title: "Pierce Arrow strikes hit torpedo boat bases"
  body: "<p>On August 5, 1964, in retaliation for the Tonkin Gulf Incident, U.S. carrier aircraft flew Operation Pierce Arrow, 64 strike sorties against the torpedo boat bases of Hon Gai, Loc Chao, Quảng Khê and Phuc Loi and the oil storage depot at Vinh.</p>\n<p>The U.S. lost two aircraft to anti-aircraft fire. Lieutenant Richard Sather was killed in his A-1 Skyraider. Lieutenant (junior grade) Everett Alvarez's A-4 Skyhawk was shot down, and he became the first U.S. Navy prisoner of war. He was held until February 12, 1973.</p>\n"
  photo_url: null
  photo_alt: null
  references:
    - label: "Wikipedia, \"1964 in the Vietnam War\", revision 1370342430 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1964_in_the_Vietnam_War&oldid=1370342430"
  status: "draft"
  source_text: "[Wikipedia, 1964_in_the_Vietnam_War, rev 1370342430] In retaliation for the Tonkin Gulf Incident, Operation Pierce Arrow consisted of 64 strike sorties of aircraft from the aircraft carriers and against the torpedo boat bases of Hon Gai, Loc Chao, Quảng Khê and Phuc Loi and the oil storage depot at Vinh. The U.S. lost two aircraft to anti-aircraft fire, Lieutenant Richard Sather was killed in his A-1 Skyraider while Lieutenant (junior grade) Everett Alvarez's A-4 Skyhawk was shot down and he became the first U.S. Navy Prisoner of War being held until 12 February 1973.\n"
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T18:00:00Z"
