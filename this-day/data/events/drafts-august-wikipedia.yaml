- month: 8
  day: 29
  year: 1965
  title: "Marines defeat Viet Cong company south of Da Nang"
  body: "<p>On August 29, 1965, the 1st Battalion, 9th Marines, operating south of Da Nang, defeated a Viet Cong company, killing 12, capturing 12 more, and dispersing the remainder.</p>\n<p>In mid-August the battalion had been released from duty as the airfield defense battalion and assigned to the area south of Marble Mountain bordering the South China Sea. Lieutenant Colonel Ludwig sent out small patrols to bait the VC; when they made contact, a mobile reaction force of Marines mounted on tanks, Ontos, and amtracs sped to the point of contact.</p>\n<p>The next day Huynh Ba Trinh, chief of Hoa Hai village, told the battalion intelligence officer that his villagers reported more than 30 of the enemy killed in the engagement. Trinh then asked the battalion to provide security for the villagers' rice harvest.</p>\n"
  photo_url: null
  photo_alt: null
  references:
    - label: "History and Museums Division, Headquarters U.S. Marine Corps, \"U.S. Marines in Vietnam: The Landing and the Buildup, 1965\", 1978, pp. 138–139"
      url: "https://www.usmcu.edu/Portals/218/U_S_%20Marines%20in%20Vietnam_The%20Landing%20and%20the%20Buildup%201965%20%20PCN%2019000307600.pdf"
    - label: "Wikipedia, \"1965 in the Vietnam War\", revision 1370279555 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1965_in_the_Vietnam_War&oldid=1370279555"
  status: "draft"
  source_text: "[The Landing and the Buildup, 1965, p. 138 (PDF page 154)] Seven of the PF units were assigned to the airfield defense battalion and the eighth to Lieutenant Colonel Ludwig's 1st Battalion, 9th Marines, operating south of Marble Mountain.\"\n[The Landing and the Buildup, 1965, p. 138 (PDF page 154)] The expansion of the 9th Marines TAOR into the populated area south of Da Nang during Operation RICE STRAW coincided with the autumn rice harvest and resulted in another task for the Marines, rice harvesting protection. The most publicized effort involved the 1st Battalion, 9th Marines along the eastern perimeter of the 9th Marines' area of operations.\n[The Landing and the Buildup, 1965, p. 139 (PDF page 155); OCR column text rejoined in reading order] In mid-August, the battalion was released from duty as the airfield defense battalion and was assigned to the area south of Marble Mountain bordering the South China Sea. Operating from a central base area, Lieutenant Colonel Ludwig sent out small patrols to bait the VC. When these units made contact, a mobile reaction force, composed of Marines mounted on tanks, Ontos, and amtracs, sped to the point of contact. At the same time, the battalion commander attempted to enlist each of the four village chiefs in his area of operations to support his efforts against the Viet Cong.'3t The chiefs were wary until the Americans proved themselves, which did not take long. On 29 August, the battalion defeated a Viet Cong company, killing 12, capturing 12 more, and dispersing the remainder.\nImpressed by this action, Huynh Ba Trinh, chief of Hoa Hai village, contacted the battalion intelligence officer the next day and reported that his villagers had told him that more than 30 of the enemy — had been killed in that engagement.tt Trinh then asked that the battalion provide security for the villagers when they began harvesting their rice on 10 September.\n[Wikipedia, 1965_in_the_Vietnam_War, rev 1370279555] The 1st Battalion, 9th Marines operating south of the Marble Mountains engaged a VC company killing 12 VC and capturing 12. Later intelligence revealed that the VC had actually lost 30 killed.\n"
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T18:00:00Z"
- month: 8
  day: 30
  year: 1970
  title: "Rockets destroy fuel tanks at Cam Ranh Bay"
  body: "<p>On August 30, 1970, 107-mm rockets struck the fuel tanks at Cam Ranh Bay. The official history of air base defense captioned a photograph of the scene as showing \"two of the five 420,000 gallon fuel tanks destroyed\" in the attack.</p>\n<p>Defense of Cam Ranh Bay fell to the Air Force, Army, Navy, and the Republic of Korea Army (ROKA). No joint defense plans for the base emerged until 1969, when a surge of enemy attacks supplied the stimulus. Subsequently, the enemy mounted 11 successful attacks against Cam Ranh Bay: 4 standoff, 4 sapper, and 3 standoff and sapper. These peaked on August 25, 1971, when the Communists exploded the Tri-Service Ammunition Storage Area.</p>\n"
  photo_url: null
  photo_alt: null
  references:
    - label: "Fox, \"Air Base Defense in the Republic of Vietnam 1961–1973\", Office of Air Force History, 1979, pp. 163–164"
      url: "http://www.afhso.af.mil/shared/media/document/AFD-100921-023.pdf"
    - label: "Wikipedia, \"1970 in the Vietnam War\", revision 1377614479 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1970_in_the_Vietnam_War&oldid=1377614479"
  status: "draft"
  source_text: "[Fox, Air Base Defense in the Republic of Vietnam 1961–1973, p. 163 (PDF page 173)] Navy ships offshore, Republic of Korea Army (ROKA) artillery, and USAF security police mortars.13 A further aid to air base defense was the joint defense plan, drawn up and agreed to by U.S. and allied commanders.\n[Fox, Air Base Defense in the Republic of Vietnam 1961–1973, p. 164 (PDF page 174)] At Cam Ranh Bay, for example, base defense fell to the Air Force, Army, Navy, and ROKA. No joint defense plans for the base emerged until 1969, when a surge of enemy attacks supplied the stimulus.15 Subsequently, the enemy mounted 11 successful attacks against Cam Ranh B a y 4 standoff, 4 sapper, and 3 standoff and sapper. These peaked on 25 August 1971 in one of the most spectacular standoff and sapper operations of the war. The Communists exploded the Tri-Service Ammunition Storage Area, blowing up 6,000 tons of munitions worth more than $10 million.\n[Fox, Air Base Defense in the Republic of Vietnam 1961–1973, p. 164 (PDF page 174), photo caption] Two of the five 420,000 gallon fuel tanks destroyed by 107-mm rockets at Cam Ranh Bay on 30 August 1970\n[Wikipedia, 1970_in_the_Vietnam_War, rev 1377614479] A PAVN/VC rocket attack on Cam Ranh Base destroyed two 420,000 gallon jet fuel storage tanks.\n"
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T18:00:00Z"
- month: 8
  day: 31
  year: 1963
  title: "CIA reports generals' coup is finished"
  body: "<p>On August 31, 1963, the CIA reported to Washington that \"this particular coup is finished.\" General Harkins said that ARVN generals \"were not ready\" to stage a coup.</p>\n<p>At a White House meeting, Vice President Lyndon Johnson said he had never been sympathetic with the proposal to change the government in South Vietnam by plotting with ARVN generals. Now that the generals had failed to organize a coup, he thought ties to the Diệm government ought to be reestablished as quickly as possible and the war against the VC carried forward. \"We must,\" he said, \"stop playing cops and robbers.\"</p>\n"
  photo_url: null
  photo_alt: null
  references:
    - label: "Wikipedia, \"1963 in the Vietnam War\", revision 1370279475 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1963_in_the_Vietnam_War&oldid=1370279475"
  status: "draft"
  source_text: "[Wikipedia, 1963_in_the_Vietnam_War, rev 1370279475] The CIA reported to Washington that \"this particular coup is finished.\" General Harkins said that ARVN generals \"were not ready\" to stage a coup. At a White House meeting, Vice President Lyndon Johnson said he had never been sympathetic with the proposal to change the government in South Vietnam by plotting with ARVN generals. Now that the generals had failed to organize a coup, he thought we ought to reestablish ties to the Diệm government as quickly as possible and get forward with the war against the VC. \"We must\", he said, \"stop playing cops and robbers.\"\n"
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T18:00:00Z"
