  year: 1969
  title: "Saigon reports 17 attacks on refugee centers"
  body: "<p>On August 13, 1969, officials in Saigon reported a total of 17 communist terror attacks on refugee centers in Quang Nam and Thua Thien provinces. The attacks left 23 persons dead and 75 injured, and a large number of homes were destroyed or damaged.</p>\n"
