    - label: "Wikipedia, \"1966 in the Vietnam War\", revision 1380091905 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1966_in_the_Vietnam_War&oldid=1380091905"
  status: "draft"
  source_text: "[Shulimson, An Expanding War 1966, p. 358 (PDF p. 372)] 1 Aug—The advance echelon of the 2d Korean Marine Brigade arrived in I Corps approximately three miles south of Chu Lai .\n[Shulimson, An Expanding War 1966, p. 222 (PDF p. 236)] The opening of the new front along the DM Z\ntogether with the heavy emphasis on base defens e\n[Shulimson, An Expanding War 1966, p. 223 (PDF p. 237)] and pacification in the southern TAORs placed a\nheavy strain on Marine manpower resources . This\nwas somewhat alleviated with the long-planne d\ndeployment of the 2d Korean Marine Brigade to I\nCorps . The first echelons of the Korean Brigade arrived on 18 August and were assigned a TAOR i n\nnorthern Quang Ngai Province on the Batanga n\nPeninsula, 17 miles southeast of the Chu Lai Air field . By the end of the month, the full brigade wa s\nestablished on the peninsula which was incorporate d\ninto the Chu Lai TAOR . The command relationship\nbetween the Koreans and the American Marines wa s\ndelicate . General Walt did not have operational control of the Korean Brigade, but he did have coordinating authority . Although the III MAF commander could not order the Koreans to do anything ,\nhe and Brigadier General Lee Bong Chool, the\nKorean Brigade commander, who had attended the\nMarine Corps Schools at Quantico, formed a working arrangement that satisfied both sides .29 *\n[Wikipedia, 1966_in_the_Vietnam_War, rev 1380091905] The Republic of Korea Marine Corps 2nd Marine Brigade began to arrive at Chu Lai Base Area.\n"
