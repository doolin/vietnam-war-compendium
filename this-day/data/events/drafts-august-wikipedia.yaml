- month: 8
  day: 27
  year: 1967
  title: "Pre-election attacks kill 46 in Can Tho"
  body: "<p>On August 27, 1967, a week before presidential and senate elections, terrorists stepped up their activities. A recoilless rifle and mortar attack on Can Tho killed 46 and injured 227.</p>\n<p>Ten people died and ten were injured in an attack on a Revolutionary Development team in Phuoc Long province. Mortar fire southeast of Ban Me Thuot, Darlac province, wounded fourteen civilians, including five children. Two civilians died and one was wounded in an attack on a hamlet in Binh Long province. Six civilians were kidnaped from Phuoc Hung village in Thua Thien province.</p>\n"
  photo_url: null
  photo_alt: null
  references:
    - label: "Pike, \"The Vietcong Strategy of Terror\", US Mission, Saigon, 1970, p. 107"
      url: "https://vva.vietnam.ttu.edu/images.php?img=/images/231/2311404008c.pdf"
    - label: "Wikipedia, \"1967 in the Vietnam War\", revision 1370279584 (CC BY-SA 4.0)"
