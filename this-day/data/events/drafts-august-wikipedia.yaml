  status: "draft"
  source_text: "[Pike, The Vietcong Strategy of Terror, p. 107 (PDF page 18)] August 27, 1967 - A week before presidential and senate elections, terrorists step up their activities. A recoilless rifle and mortar attack on Can Tho kills 46 and injure s 227. Ten die and ten are injured in an attack on a Revolutionary Development team in Phuoc Long province. Fourteen civilians, including five children, are wounded by mortar fire southeast of Ban Me Thuot, Darlac province. Two civilians die and one is wounded in an attack on a hamlet in Binh Long province. Six civilians are kidnaped from Phuoc Hung village in Thua Thien province.\n"
