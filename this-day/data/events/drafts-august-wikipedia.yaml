- month: 8
  day: 10
  year: 1961
  title: "First herbicide test run sprayed near Dak To"
  body: "<p>On August 10, 1961, the first test run of airborne herbicide spraying in Vietnam took place in a village north of Dak To. After about a year of testing, Operation Ranch Hand, the central component of the US military's herbicidal warfare initiative Operation Trail Dust, started properly in early 1962. The plan was to spray concentrated herbicides and defoliants over South Vietnam's jungles and mangroves, depriving the Viet Cong of both food and cover. The operation continued for a decade, until a final run on January 7, 1971.</p>\n<p>Over the course of the campaign, 19 million US gallons of chemicals were sprayed over South Vietnam and areas of Laos and Cambodia in 20,000 missions against 5 million acres of forest and 500,000 acres of food crops. The herbicides, mixed at 50 times the concentration used in ordinary agriculture, were mostly Agent Orange and Agent Blue, sprayed from modified C-123s that used the call sign \"Hades\".</p>\n"
  photo_url: null
  photo_alt: null
  references:
    - label: "The History Channel Australia & New Zealand, \"This Day in History - August 10, 1961 - First Herbicides Sprayed in Vietnam\", A&E Television Networks / Foxtel, 2016"
      url: "http://www.historychannel.com.au/classroom/day-in-history/746/first-herbicides-sprayed-in-vietnam"
    - label: "Wikipedia, \"1961 in the Vietnam War\", revision 1370279448 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1961_in_the_Vietnam_War&oldid=1370279448"
  status: "draft"
  source_text: "[History Channel AU, This Day in History, August 10, 1961] Operation Ranch Hand, the central component of the US military's highly controversial herbicidal warfare initiative Operation Trail Dust, occurred in rural parts of South Vietnam during the Vietnam War. The plan was to spray very concentrated herbicides and defoliants over the country's jungles and mangroves, thus depriving the Viet Cong resistance of both food and cover.\nThe first test run for the airbound spraying of herbicides took place on 10 August 1961 in a village north of Dak To in the Mekong Delta region, and after about a year of testing, Operation Ranch Hand really started properly in early 1962. It continued for a decade, until a final run on 7 January 1971, by which time the ecological and medical implications of using such dangerous defoliants and herbicides was becoming all too apparent.\nOver the course of the campaign, an extraordinary 19 million US gallons of chemicals were sprayed over South Vietnam (and also areas of Laos and Cambodia) in 20,000 missions that attacked 5 million acres of forest and 500,000 acres of food crops. A sortie of around 5 planes—modified C-123s using the rather ominous call sign of \"Hades\"—flew side by side in formation\nThey mixed their herbicides at 50 times the concentration used in ordinary agriculture, and mostly used Agent Orange (dichlorophenoxyacetic and trichlorophenoxyacetic acid) and Agent Blue (cacodylic acid)\n[Wikipedia, 1961_in_the_Vietnam_War, rev 1370279448] For the first time the United States used herbicides in the war. U.S. airplanes sprayed herbicides on forests near Dak To.\n"
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T18:00:00Z"
- month: 8
