      url: "https://en.wikipedia.org/w/index.php?title=1964_in_the_Vietnam_War&oldid=1370342430"
  status: "draft"
  source_text: "[Wikipedia, 1964_in_the_Vietnam_War, rev 1370342430, entry for December 13] A VC battalion captured two outposts simultaneously in Ba Xuyen province. Three territorial companies advanced in relief and engaged the VC in a fight that lasted into the afternoon. The VC broke contact when additional ARVN forces arrived. A hamlet chief and police chief died in the affair, as well as 18 other South Vietnamese, with 37 wounded and 54 missing. Seventy-nine individual and three crew-served weapons were also lost.\n"
  summarized_by: "Claude Opus 5.5"
