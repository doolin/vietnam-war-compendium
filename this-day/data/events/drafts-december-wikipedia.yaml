- month: 12
  day: 11
  year: 1964
  title: "South Vietnamese C-123B crashes into Monkey Mountain"
  body: "<p>On December 11, 1964, a South Vietnamese Air Force Fairchild C-123B-12-FA Provider, registration 55-4522, crashed into Monkey Mountain in evening darkness after departing Da Nang Air Base. All 38 occupants, South Vietnamese military personnel and two U.S. passengers, were killed, and the aircraft was destroyed. The crash site lay 10 km north of the base.</p><p>The same day, the VC D2 Regiment and a reinforcing unit, four battalions in all, assaulted Long My town in Chuong Thien Province. The territorial defenders held. After mauling a 21st Division battalion sent toward Long My, the VC attacked the town again and were again repelled. The ARVN lost 27 dead and 55 wounded; US losses were two dead, five wounded, and one missing.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Aviation Safety Network, \"Accident Fairchild C-123B-12-FA Provider 55-4522, Friday 11 December 1964\", Flight Safety Foundation"
      url: "https://aviation-safety.net/wikibase/193752"
    - label: "Wikipedia, \"1964 in the Vietnam War\", revision 1370342430 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1964_in_the_Vietnam_War&oldid=1370342430"
  status: "draft"
  source_text: "[Aviation Safety Network, wikibase 193752] Date: Friday 11 December 1964 Time: evening Type: Fairchild C-123B-12-FA Provider Owner/operator: South Vietnamese Air Force (SVAF) Registration: 55-4522 MSN: 20183 Fatalities: Fatalities: 38 / Occupants: 38 Other fatalities: 0 Aircraft damage: Destroyed, written off Category: Accident Location: 10 km N of Da Nang AB, SVN - Vietnam Phase: Unknown Nature: Military Departure airport: Da Nang AB Destination airport: Narrative: Crashed into Monkey Mountain in evening darkness. SVN military personnel and two US passengers.\n[Wikipedia, 1964_in_the_Vietnam_War, rev 1370342430] An RVNAF C-123B crashed into Monkey Mountain shortly after takeoff from Da Nang Air Base killing all 38 on board, including two U.S.\n[Wikipedia, 1964_in_the_Vietnam_War, rev 1370342430] The VC D2 Regiment along with a reinforcing unit, four battalions in all, assaulted Long My town in Chuong Thien Province. The territorial defenders held as the VC set three ambushes for the relief forces. After mauling a 21st Division battalion sent toward Long My, the VC returned to attack the town. Once again, the defenders repelled the enemy. Eighteen US and RVNAF A-1s participated in the fighting, with the VC shooting down one and damaging three. They also damaged five US Army helicopters. Allied pilots claimed they had killed 400 insurgents. The ARVN lost 27 dead and 55 wounded. US losses were two dead, five wounded, and one missing."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T12:00:00Z"
- month: 12
  day: 12
  year: 1968
  title: "Marines launch Operation Taylor Common in An Hoa Basin"
  body: "<p>On December 12, 1968, Task Force Yankee, a task organized force of the 1st Marine Division, began Operation Taylor Common, a search and destroy operation. The objective of the operation was to clear the An Hoa Basin, to neutralize the PAVN's Base Area 112, and to develop Fire Support Bases (FSBs) to interdict PAVN infiltration routes leading from the Laotian border.</p>\n<p>In all, the operation resulted in 1,398 PAVN killed and 29 captured, and in 183 Marines and 100 ARVN killed.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Wikipedia, \"1968 in the Vietnam War\", revision 1370342410 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1968_in_the_Vietnam_War&oldid=1370342410"
  status: "draft"
  source_text: "[Wikipedia, 1968_in_the_Vietnam_War, rev 1370342410, entry for December 12] Operation Taylor Common was a search and destroy operation conducted by Task Force Yankee, a task organized force of the 1st Marine Division. The objective was to clear the An Hoa Basin, neutralize the PAVN's Base Area 112 and develop Fire Support Bases (FSBs) to interdict PAVN infiltration routes leading from the Laotian border. The operation resulted in 1,398 PAVN killed and 29 captured and 183 Marines and 100 ARVN killed.\n"
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T12:00:00Z"
- month: 12
  day: 13
  year: 1964
  title: "VC battalion seizes two outposts in Ba Xuyen"
  body: "<p>On December 13, 1964, a VC battalion captured two outposts simultaneously in Ba Xuyen province. Three territorial companies advanced in relief of the outposts and engaged the VC in a fight that lasted into the afternoon. The VC broke contact when additional ARVN forces arrived.</p>\n<p>A hamlet chief and a police chief died in the affair, as did 18 other South Vietnamese. Thirty-seven South Vietnamese were wounded and 54 were missing. Seventy-nine individual weapons and three crew-served weapons were also lost.</p>"
  photo_url: null
