  source_text: "[usmm.org, SS Badger State Rocked by Blasts] Dec. 26, 1969 . A Vietnam-bound ammunition ship, carrying 8,900 bombs and rockets equal to 2,000 tons of TNT , was rocked by explosions and abandoned by her crew in rough seas 1,500 miles northeast of Hawaii.\n[usmm.org] Dec. 27 . Fourteen crewmen were picked up by a Greek ship, the Khian Star , ... A Navy spokesman said the Badger State was carrying the rockets and bombs for the Air Force at Danang, South Vietnam under contract to the Military Sea Transportation Service. The bombs included 2,000 pounders which were loaded at the Bangor (Washington) Naval Ammunition Depot . At daybreak rescue planes and ships found no sign of the 26 missing men,\n[usmm.org] The crew fought for 9 days to steady the cargo and several times changed course to find calm seas, but each roll of the ship caused the bombs to roll or slide striking each other or the ship's hull where wood sheathing had splintered away.\n[usmm.org] One of the bombs exploded and fire swept the ship.\n[usmm.org] The Badger State remained afire with bombs exploding for 10 days before sinking.\n[usmm.org, captain's intercept cable] 4. 33 Men were lowered to the sea in No. 1 Lifeboat. ... When she was abeam of No. 5 hatch one 2000 pound bomb fell in lifeboat capsizing it.\n[Wikipedia, 1969_in_the_Vietnam_War, rev 1370279610] The SS Badger State under contract to Military Sea Transportation Service and carrying a load of munitions bound for Da Nang had a bomb explode onboard causing a fire. The crew abandoned ship with 29 crewmen killed and the ship drifted before sinking on 5 January."
