- month: 12
  day: 4
  year: 1965
  title: "Viet Cong bomb Metropole Hotel in Saigon"
  body: "<p>On December 4, 1965, the Viet Cong bombed the U.S. servicemen's Metropole Hotel in Saigon. The bombing killed 9 persons, 1 U.S. Marine, 1 New Zealand artilleryman, and 7 South Vietnamese civilians, and injured 137, of whom 62 were civilians.</p><p>In a cable dated December 5, Henry Cabot Lodge, Jr., in Saigon, called the bombing the fourth such event during his service in Viet-Nam. He recommended that the United States inflict some punishment on North Viet-Nam, stated as a retaliation, and named possible targets including coal mines, textile mills, irrigation ditches, steel mills, and fertilizer factories. The cable was relayed to President Johnson in Texas on December 7. On December 8, the Department of State informed Lodge that it had approved a bombing attack on an isolated electric power plant north of Haiphong.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Office of the Historian, \"Foreign Relations of the United States, 1964–1968, Volume III, Vietnam, June–December 1965, Document 221\", U.S. Department of State"
      url: "https://history.state.gov/historicaldocuments/frus1964-68v03/d221"
    - label: "Wikipedia, \"1965 in the Vietnam War\", revision 1370279555 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1965_in_the_Vietnam_War&oldid=1370279555"
  status: "draft"
  source_text: "[FRUS 1964–1968, Vol. III, Document 221, Office of the Historian] 221. Telegram From the National Security Council Executive Secretary ( Smith ) to President Johnson , in Texas 1 Washington , December 7, 1965, 9:44 a.m. CAP 65830. Following is text of cable from Lodge , Saigon 2034. 2 Secretary Rusk has a copy in his briefing book: 1. The Viet Cong bombing of the Metropole, 3 with its toll of American, New Zealand and Vietnamese dead and wounded, is the fourth such event which has happened during my service in Viet-Nam.\n[FRUS 1964–1968, Vol. III, Document 221, p. 615] 2. I therefore recommend that we inflict some punishment on North Viet-Nam which we will state is a retaliation. It could be something which we intend to do anyway. 3. You in Washington are much better informed than I am but some possibilities which seem to me to be worthy are bombing coal mines, textile mills, irrigation ditches, the coastal waterway between South China and North Viet-Nam, steel mills, fertilizer factories and any other unmanned objectives. Lodge . 4\n[FRUS 1964–1968, Vol. III, Document 221, footnotes] Received at the LBJ Ranch at 9:07 a.m. ↩ Dated December 5. (Department of State, Central Files, POL 27 VIET S .) ↩ Reference is to the bombing of the U.S. servicemen’s Metropole Hotel on December 4 in which 9 persons were killed (1 U.S. Marine, 1 New Zealand artilleryman, and 7 South Vietnamese civilians) and 137 injured (of which 62 were civilians). ↩ In telegram 1595 to Saigon, December 8, the Department informed Lodge that it had approved a bombing attack on an isolated electric power plant north of Haiphong.\n[FRUS 1964–1968, Vol. III, Document 221, Persons] Johnson, Lyndon B. Lodge, Henry Cabot, Jr. Smith, Bromley\n[Wikipedia, 1965_in_the_Vietnam_War, rev 1370279555] The VC bombed the Metropole Bachelor Enlisted Quarters in Saigon killing seven Vietnamese civilians, one U.S. Marine and one New Zealand soldier and injuring 175 others. The VC claim to have killed 200 Americans."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T12:00:00Z"
- month: 12
  day: 5
  year: 1965
  title: "Marine platoon surprises VC on Trung Phan Peninsula"
  body: "<p>On December 5, 1965, a platoon from Company C, 1st Battalion, 7th Marines surprised 70 VC on the Trung Phan Peninsula, six miles southeast of the Chu Lai airfield. Sent to search Tuyet Diem (1) hamlet on the banks of the Moi River, the platoon had set an ambush 2,000 meters south of the hamlet. At 0300, four VC walked into the trap and were killed.</p><p>Fearing the noise had compromised his position, First Lieutenant Charles D. Jones, the platoon commander, sent two squads to the left and right of the village and led the third into the hamlet at 0600, catching the VC unaware. As the VC ran into the streets, the flanking squads took them under fire. The platoon killed 30 VC near the river and captured seven more. Several hours later, Lieutenant Colonel James P. Kelly, the battalion commander, sent Company A into the same area, where it killed eight VC and captured three more weapons.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "History and Museums Division, Headquarters U.S. Marine Corps, \"U.S. Marines in Vietnam: The Landing and the Buildup, 1965\", 1978, p. 131"
      url: "https://www.usmcu.edu/Portals/218/U_S_%20Marines%20in%20Vietnam_The%20Landing%20and%20the%20Buildup%201965%20%20PCN%2019000307600.pdf"
    - label: "Wikipedia, \"1965 in the Vietnam War\", revision 1370279555 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1965_in_the_Vietnam_War&oldid=1370279555"
  status: "draft"
  source_text: "[USMC, The Landing and the Buildup, 1965, p. 131; two-column text interleaved in the extraction, segments given in reading order] Aggressive small unit patrolling continued to pay dividends. On 5 December, a platoon from Company C, 1st Battalion, 7th Marines surprised 70 VC on the\n[ibid., p. 131] Trung Phan Peninsula, six miles southeast of the Chu Lai airfield. The platoon, operating from its company's combat base, had been assigned the mission of searching the Tuyet Diem (1) hamlet on the banks of the Moi River. The platoon had established an ambush site 2,000 meters south of the hamlet. At 0300, four VC walked into the trap and were killed by a burst of Marine fire. First Lieutenant Charles D. Jones, the platoon commander, fearing that the noise had compromised his position, ordered two of his squads to deploy to the left and right of the village while he led the third squad into the hamlet. At 0600 the 3d squad entered Tuyet Diem (1) and caught the VC completely unaware. According to one report: ''At that time it [the hamlet] became alive with VC. They ran into the streets, some of them naked; all of them carrying weapons, and of course the squads on the right and left took them under fire.''\n[ibid., p. 131] At the same time, the 3d Squad pushed the enemy toward the river where the platoon killed 30 VC and captured seven more. A search of the area turned up a squad leader's diary, three weapons, and a medical kit.\n[ibid., p. 131] Several hours later there was a sequel to this action. Lieutenant Colonel James P. Kelly, the bat-\n[ibid., p. 131] talion commander, ordered Company A to move into the same area. Kelly believed that there was a good\n[ibid., p. 131] chance that VC might still be there. He was correct, The Marines of Company A killed eight VC and captured three more weapons.\n[Wikipedia, 1965_in_the_Vietnam_War, rev 1370279555] Company C, 1st Battalion, 7th Marines engaged 70 VC on the Trung Phan peninsula 6 mi southeast of Chu Lai Air Base killing 38 VC and capturing seven."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T12:00:00Z"
- month: 12
  day: 7
  year: 1969
  title: "101st Airborne opens Operation Randolph Glen"
  body: "<p>On December 7, 1969, the 101st Airborne Division (Airmobile) began Operation Randolph Glen in Thua Thien Province. In coordination with the 1st Inf Div (ARVN), the division was to provide a protective shield on the periphery of the populated lowlands of the province and to support the goals of the 1970 Province Pacification and Development Plan. The ARVN division conducted operations to provide protection and security for the populated lowlands and located and destroyed enemy forces and base camps.</p><p>The operation officially ended on March 31, 1970, when infantry and artillery units repositioned to begin Operation Texas Star. The division reported 668 enemy killed (547 NVA and 121 VC), 19 prisoners, and 6 Hoi Chanh. U.S. losses were 123 killed, 163 wounded and evacuated, 84 with minor wounds, and 4 missing, the result of an aircraft crash on February 5, 1970.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Headquarters, 101st Airborne Division (Airmobile), \"Combat Operations After Action Report, Operation Randolph Glen\", 30 June 1970, p. 17, via DTIC"
      url: "http://www.dtic.mil/dtic/tr/fulltext/u2/509879.pdf"
    - label: "Wikipedia, \"1969 in the Vietnam War\", revision 1370279610 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1969_in_the_Vietnam_War&oldid=1370279610"
  status: "draft"
  source_text: "[101st Abn Div, AAR Operation Randolph Glen, p. 1 (PDF p. 5); transcribed from the scanned page, the text layer is unreadable OCR] 1. (U) Name of Operation: RANDOLPH GLEN. 2. (U) Date of operation: 7 December 1969 - 31 March 1970. 3. (U) Location: Thua Thien Province, RVN. 4. (U) Control Headquarters: 101st Airborne Division (Airmobile).\n[ibid., pp. 1-2 (PDF pp. 5-6), transcribed] (1) 1st Inf Div (ARVN), in operational coordination with the 101st Abn Div (Ambl), conducted operations to provide protection and security for the populated lowlands; located and destroyed enemy forces and base camps; and supported the pacification and development plans and programs in the division area of operation.\n[ibid., p. 2 (PDF p. 6), transcribed] (1) To provide, in coordination with the 1st Inf Div (ARVN), a protective shield on the periphery of the populated lowlands of Thua Thien Province. (2) To support, to the maximum extent possible, the accomplishment of the goals of the 1970 Province Pacification and Development Plan.\n[ibid., p. 16 (PDF p. 20), transcribed] Division Operation RANDOLPH GLEN officially terminated at 312400 March, with infantry and artillery units repositioned to begin Operation TEXAS STAR.\n[ibid., p. 17 (PDF p. 21), transcribed] b. Enemy losses: (1) KIA (BC): 668 (547 NVA, 121 VC) (2) PW: 19 (9 NVA, 10 VC) (3) Hoi Chanh: 6 ... c. Friendly losses: (1) US KIA: 123 (2) US WIA (evac): 163 (3) US WIA (minor): 84 (4) US MIA: 4* ... *Result of aircraft crash on 5 Feb 70; aircraft remains unlocated.\n[Wikipedia, 1969_in_the_Vietnam_War, rev 1370279610] Operation Randolph Glen was conducted by the 2nd Brigade, 101st Airborne Division and ARVN 1st Division to engage PAVN/VC units and interdict supply lines into the lowlands of Thừa Thiên Province. The operation results in 670 PAVN killed, U.S. losses are 123 killed and four missing."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T12:00:00Z"
- month: 12
  day: 9
  year: 1964
  title: "Insurgents overrun ARVN outpost near Tam Ky"
  body: "<p>On December 9, 1964, a large insurgent force attacked and overran an ARVN outpost four-and-a-half miles from Tam Ky, the provincial capital. ARVN units supported by U.S. Marine and Army helicopters responded quickly, killing 70 Communists and capturing 39 weapons.</p><p>The attack killed 8 ARVN soldiers and 1 U.S. advisor and wounded 20 ARVN soldiers and an Australian advisor. It came two days after U.S. Marine and Army helicopters airlifted 240 soldiers of the ARVN's 11th Ranger Battalion to attack a Viet Cong force in a village less than five miles from Da Nang, an operation that killed nine guerrillas and captured four.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Hoffman, \"The Path to War: U.S. Marine Corps Operations in Southeast Asia 1961 to 1965\", History Division, Marine Corps University, 2014, p. 86"
      url: "https://www.usmcu.edu/Portals/218/Vietnam_Path_To_War.pdf"
    - label: "Wikipedia, \"1964 in the Vietnam War\", revision 1370342430 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1964_in_the_Vietnam_War&oldid=1370342430"
  status: "draft"
  source_text: "[Hoffman, The Path to War, p. 86] For instance, on 1 November 1964, Communist forces mortared U.S. facilities at the Bien Hoa air base near Saigon, killing four American soldiers while destroying five Martin B-57 Canberra bombers and badly damaging eight others. On Christmas Day, insurgents bombed a U.S. officers’ quarters in Saigon, killing 2 Americans and wounding over 50 others.\n[Hoffman, The Path to War, p. 86] On 7 December, U.S. Marine and Army helicopters airlifted 240 soldiers of the ARVN’s 11th Ranger Battalion to attack a known Viet Cong force located in a village less than five miles from Da Nang. Although successful—nine guerrillas were killed and four others were captured—it was not lost on anyone that the Viet Cong were now bold enough to operate within five miles of one of South Vietnam’s major cities. In another demonstration of the Communists’ strength and audacity, a large insurgent force attacked and overran an ARVN outpost only four-and-a-half miles from the provincial capital of Tam Ky two days later. Although a quick response by ARVN units supported by U.S. Marine and Army helicopters resulted in 70 Communists killed and 39 weapons captured, the attack on the outpost was not without cost. In total, 8 ARVN soldiers and 1 U.S. advisor had been killed; 20 ARVN soldiers and an Australian advisor had been wounded; and the insurgents had demonstrated that they could attack and decimate a well-fortified government outpost within miles of a provincial capital.\n[Wikipedia, 1964_in_the_Vietnam_War, rev 1370342430] A VC battalion attacked and overran an ARVN outpost on Hill 159 8km southwest of Tam Kỳ and attacked an outpost at Ky Long 5km further west. An ARVN 2nd Division force, supported by US Marine and Army helicopters, counter-attacked Hill 159 forcing the VC to retreat. VC losses were 162 killed and two captured and five machineguns, a 57mm recoilless rifle, and 51 individual weapons captured. ARVN losses were 26 dead and 43 wounded, one US advisor was killed."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T12:00:00Z"
- month: 12
  day: 10
  year: 1966
  title: "Marine bomber hits own troops near Đông Hà"
  body: "<p>On December 10, 1966, sixteen U.S. Marines were killed and 11 others injured when a Marine bomber accidentally dropped two 250 pound bombs on them. The Marines were fighting near Đông Hà in Quảng Trị Province. They had come under a mortar attack and were firing their own 81 mm shells when the bombs either bounced off a ridge of boulders or fell about 300 yards from their intended target.</p><p>The same day, a taxi on Highway 29 in Phong Dinh Province ran over a mine. Five passengers, all women, were killed, and the driver was badly wounded.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Wikipedia, \"1966 in the Vietnam War\", revision 1380091905 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1966_in_the_Vietnam_War&oldid=1380091905"
  status: "draft"
  source_text: "[Wikipedia, 1966_in_the_Vietnam_War, rev 1380091905] Sixteen U.S. Marines were killed and 11 others injured when a Marine bomber accidentally dropped two 250 pound bombs on them. The Marines were fighting near Đông Hà in Quảng Trị Province, when they came under a mortar attack, and were firing their own 81 mm shells when the bombs \"either bounced off a ridge of boulders, or fell about 300 yd yards from their intended target.\"\n[Wikipedia, 1966_in_the_Vietnam_War, rev 1380091905] A taxi on Highway 29, Phong Dinh Province ran over a mine. Five passengers, all women, were killed and the driver badly wounded."
  summarized_by: "Claude Opus 5.5"
