  title: "49th Infantry battalions attack VC 506th Battalion"
  body: "<p>On December 28, 1964, two battalions of the 49th Infantry and three platoons of artillery attacked the VC 506th Battalion. VC losses were 25 killed, three wounded and 20 suspects captured. The ARVN had eight casualties.</p>"
