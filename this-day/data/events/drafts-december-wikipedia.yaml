- month: 12
  day: 14
  year: 1974
  title: "Pathet Lao believed to have executed Dean and Sharman"
  body: "<p>On December 14, 1974, Charles Dean and Neil Sharman were believed to have been executed while driving toward Vietnam with their Pathet Lao captors. Dean, a 24-year-old University of North Carolina graduate, and Sharman, of Australia, had been arrested by the communist Pathet Lao on September 4, 1974, during a trip down the Mekong River in Laos. They apparently were suspected of being spies, although the U.S. and Australian governments said they were tourists. They were held in a small, remote prison camp for three months.</p>\n<p>Although a civilian, Dean was considered by the U.S. government to have been a prisoner of war. In November 2003, a joint U.S.-Laotian team discovered remains, not yet positively identified, in a rice field in Bolikhamxai Province in central Laos, about 2.5 miles from the Vietnam border. Sharman's brother, Ian Sharman, told the Australian Herald Sun that the two men had been handcuffed, executed, and their bodies thrown into a bomb crater.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Associated Press, \"Pentagon Recovers Remains Believed to Be Howard Dean's Brother\", Fox News, 2003"
      url: "https://www.foxnews.com/story/pentagon-recovers-remains-believed-to-be-howard-deans-brother/"
    - label: "Wikipedia, \"1974 in the Vietnam War\", revision 1374630748 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1974_in_the_Vietnam_War&oldid=1374630748"
  status: "draft"
  source_text: "[Associated Press, \"Pentagon Recovers Remains Believed to Be Howard Dean's Brother\", Fox News, published November 18, 2003] WASHINGTON – Democratic presidential candidate&nbsp; Howard Dean ( search )&nbsp;said Tuesday that the search for the long-lost remains of his younger brother may be over with the discovery of bones, a sock, a pair of shoes and a bracelet buried in a Laotian rice field.\n[ibid.] Charles Dean has been missing since 1974, when the 24-year-old University of North Carolina graduate was traveling through Southeast Asia with a companion, Neil Sharman of Australia.\nA joint U.S.-Laotian team discovered remains earlier this month in Bolikhamxai Province in central Laos, said Larry Greer, spokesman for the Pentagon office in charge of POW and MIA issues. The remains have not been positively identified, but Dean said his family is confident they belong to his brother because of personal items found at the site.\n[ibid.] Sharman's brother, Ian Sharman, told the Australian Herald Sun on Tuesday that the two men had been handcuffed, executed, and their bodies thrown into a bomb crater.\n[ibid.] He and Sharman took off for Southeast Asia and were arrested by the communist Pathet Lao on Sept. 4, 1974, during a trip down the Mekong River in Laos. They apparently were suspected of being spies, although the U.S. and Australian governments said they were merely tourists and strongly protested their detention.\n[ibid.] The two men were held in a small, remote prison camp for three months before they were believed to have been executed on Dec. 14 while driving toward Vietnam with their captors.\nCharles Dean, although a civilian, was considered by the U.S. government to have been a prisoner of war.\n[ibid.] Based on accounts from local informants, the task force zeroed in on a flooded paddy field about 2.5 miles from the Vietnam border.\n[Wikipedia, 1974_in_the_Vietnam_War, rev 1374630748, entry for December 14] On or about this date the Pathet Lao executed Charles Dean and Neil Sharman, backpackers who were captured southeast of Vientiane on 4 September.\n"
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T12:00:00Z"
- month: 12
  day: 16
  year: 1965
  title: "Viet Cong attack Ba To reconnaissance patrol base"
  body: "<p>On December 16, 1965, Viet Cong troops attacked a reconnaissance patrol base on a hill near Ba To, a Special Forces camp 42 kilometers south-southwest of Quang Ngai. The 2d Platoon, 1st Force Reconnaissance Company, had been sent to Camp A-106 at Ba To on November 27. When dense fog cancelled the planned move back to the camp, the force of 81 Marine, Special Forces, CIDG, and Nung troops stayed on the same site for a third consecutive night.</p>\n<p>At 1900 the Viet Cong began walking mortar rounds across the base, and between 150 and 200 Viet Cong then attacked. The defenders broke up into small groups. Gunnery Sergeant Maurice J. Jacques led his Marines off the hill into the darkness, and after dawn they made their way back to Ba To.</p>\n<p>On December 21 a patrol found 14 bodies: three Marines, the Special Forces sergeant, the Vietnamese lieutenant patrol leader, and nine CIDG troops. After Ba To, force reconnaissance patrols went in together, stayed together, and came out together.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Jack Shulimson and Charles M. Johnson, \"U.S. Marines in Vietnam: The Landing and the Buildup, 1965\", History and Museums Division, Headquarters, U.S. Marine Corps, 1978, pp. 179-180"
      url: "https://www.usmcu.edu/Portals/218/U_S_%20Marines%20in%20Vietnam_The%20Landing%20and%20the%20Buildup%201965%20%20PCN%2019000307600.pdf"
    - label: "Wikipedia, \"1965 in the Vietnam War\", revision 1370279555 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1965_in_the_Vietnam_War&oldid=1370279555"
  status: "draft"
  source_text: "[Shulimson and Johnson, The Landing and the Buildup, 1965, p. 179] force company's capabilities. As a result, on 27\nNovember the 2d Platoon was returned to Ill MAF\n[...]\noperational control and sent to Special Forces Camp\nA-106 at Ba To, 42 kilometers south-southwest of\nQuang Ngai.\n[...]\nAt last force ''recon''\nwas going deep, but the 2d Platoon at Ba To was in\nfor a tough school session.\nAt 0530, 15 December three reconnaissance teams\n(20 Marines and CIDG troops), plus a 61-man base\ndefense reaction force, moved out ''to determine\nlocation, identity, strength, movement, and ar-\nmament of VC/PAVN units.\" More than 70\nCommunists were sighted during the next two days,\nbut the U.S.!Vietnamese reconnaissance force had\nmade a serious mistake. The patrol base had not been\nmoved for two nights. The only redeeming feature of\nthis situation was that the base was on a hill, the best\ndefensive terrain in the area.\nBy 1730 16 December all teams had returned to\nthe patrol base, but the planned move back to Ba To\nwas cancelled when dense fog settled over the camp.\nThe force of 81 Marine, Special Forces, CIDG, and\nNung troops was stuck in the same camp site for the\nthird consecutive night.\nAt 1900 the Viet Cong began walking mortar\nrounds across the patrol base. The Vietnamese\nlieutenant in charge of the patrol was mortally\nwounded and a U.S. Special Forces sergeant was hit.\nEnemy automatic weapons swept the hill position as\nthe mortar bombardment continued. Then the\nassault started. Between 150 to 200 Viet Cong attacked. Confusion swept through the mixed force of\ndefenders; they broke up into small groups. The\nMarines, now led by Gunnery Sergeant Maurice J.\nJacques, withdrew into a small perimeter, but of the\n13 Marines assigned to the patrol five were already\nmissing. In the perimeter, a Marine was hit, their\ncorpsman was seriously wounded, and a second\nMarine was killed. Jacques' Marines moved off the\nhill into the darkness. They hid in a clump of banana\ntrees, formed a defensive perimeter, and waited for\nthe dawn, hoping that aerial observers would spot\nthem in the morning Of the 13 Marines, 4 were still\nmissing and one was known to be dead.\nDawn came, but the fog persisted. There was no\npossibility of being seen from the air. The Marines\ntried to regain the trail back to Ba To, but enemy\n[p. 180] made, so Jacques decided to \"head for home.\"\nPutting the two Vietnamese stragglers out as the\npoint on the trail, the Marines moved out. They\n[...]\nreached Ba To without incident.\n[...]\nOn 21 December the two missing Marines were\nfound, dead. A patrol found 14 bodies: three\n[...]\nMarines, the Special Forces sergeant, the Viet-\n[...]\nnamese lieutenant patrol leader, and nine CIDG\ntroops.\nAs a result of the Ba To experience, and some\nother misadventures, a long standing force reconnaissance operational procedure was suspended.\nPrevious training practices had dictated that when a\nforce reconnaissance patrol was discovered it was to\nsplit up, each member evading on his own. After Ba\nTo, force patrols went in together, stayed together,\nand came out together.\n[Wikipedia, 1965_in_the_Vietnam_War, rev 1370279555, entry for December 16] 150-200 VC supported by mortars attacked an 81-strong Marine Reconnaissance, Special Forces, CIDG and Nung force on a hilltop position in Ba Tơ District. The defenders were forced to disperse and evade losing three Marines, one Special Forces and 10 CIDG killed.\n"
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T12:00:00Z"
- month: 12
  day: 17
  year: 1970
  title: "ARVN 1st Task Force opens Operation Hoang Dieu 101"
  body: "<p>On December 17, 1970, the ARVN 1st Task Force began Operation Hoang Dieu 101, a province-wide campaign of saturation patrolling in the lowlands of Quang Nam. The 51st ARVN Regiment was the principal infantry element of the 1st Task Force. An earlier Operation Hoang Dieu, launched by Lieutenant General Lam on October 22 and named after a 19th Century Vietnamese national hero born in Quang Nam, had continued into the first days of December.</p>\n<p>The operation ended on January 19, 1971. In the month-long effort, the South Vietnamese and cooperating U.S. and Korean Marine units claimed to have killed 538 North Vietnamese and Viet Cong and to have captured 87 prisoners and 171 weapons. Another 45 enemy surrendered under the Chieu Hoi program.</p>\n<p>After a pause during the Tet holidays, the 1st Task Force began Operation Hoang Dieu 103 on February 3, again emphasizing continuous patrols and ambushes around populated areas to block infiltration and kill or capture guerrillas.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Graham A. Cosmas and Terrence P. Murray, \"U.S. Marines in Vietnam: Vietnamization and Redeployment, 1970-1971\", History and Museums Division, Headquarters, U.S. Marine Corps, 1986, pp. 103, 213-214"
      url: "https://www.usmcu.edu/Portals/218/US%20Marines%20In%20Vietnam%20Vietmanization%20and%20Redeployment%201970-1971%20PCN%2019000309600.pdf"
    - label: "Wikipedia, \"1970 in the Vietnam War\", revision 1377614479 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1970_in_the_Vietnam_War&oldid=1377614479"
  status: "draft"
  source_text: "[Cosmas and Murray, Vietnamization and Redeployment, 1970-1971, p. 103] Lieutenant General Lam soon committed all th e\nARVN forces in Quang Nam to support pacification .\nOn 22 October, he launched Operation Hoang Dieu .\nConceived by Lam and named after a 19th Century\nVietnamese national hero* who had been born i n\nQuang Nam, the operation involved the 51st ARV N\nRegiment, the 1st Ranger Group, and the 2d and 3 d\nTroops of the 17th Armored Cavalry Squadron .\n[...]\nOperation Hoang Dieu initially was\nplanned to last 30 days . In fact, it continued through\nNovember and into the first days of December 3\n[Cosmas and Murray, p. 213, section heading] Operations in Quang Nam, January-February 1971\n[Cosmas and Murray, pp. 213-214] Deterrent operations were continuous and extensive . Throughout January and February, the South\nVietnamese regulars, RFs, and PFs in Quang Nam ,\nsupported by III MAF and South Korean Marines, at tempted to forestall enemy attacks by attacks of their\nown and to continue wearing down Communist military and political strength . The ARVN 1st Task Forc e\non 19 January ended its Operation Hoang Dieu 101 ,\na province-wide campaign of saturation patrolling i n\nthe lowlands that had begun on 17 December . In th e\nmonth-long effort, the South Vietnamese and cooperating U.S . and Korean Marine units claimed to hav e\nkilled 538 North Vietnamese and Viet Cong and to\nhave captured 87 prisoners and 171 weapons . Anothe r\n45 enemy had surrendered under the Chieu Hoi pro gram . After a pause during the Tet holidays, the 1s t\nTask Force on 3 February initiated Operation Hoan g\nDieu 103, again emphasizing continuous patrols an d\nambushes around populated areas to block infiltration and kill or capture guerrillas and members of the\nVCI . This effort involved most of the province RFs an d\nPFs, while the 51st ARVN Regiment, the principal infantry element of the 1st Task Force, deployed its fou r\nbattalions around Hill 55 and An Hoa. 1 5\n[Wikipedia, 1970_in_the_Vietnam_War, rev 1377614479, entry for December 17] The ARVN 1st Task Force conducted Operation Hoang Dieu 101, a province-wide campaign of saturation patrolling in the lowlands. In the month-long effort, the South Vietnamese and cooperating U.S. and Korean Marine units claimed to have killed 538 PAVN/VC and to have captured 87 prisoners and 171 weapons. Another 45 PAVN/VC surrendered as Chieu Hoi.\n"
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T12:00:00Z"
- month: 12
  day: 19
  year: 1966
  title: "Mobile Riverine Force troops begin arriving at Vung Tau"
  body: "<p>On December 19, 1966, the first elements of the Army's contribution to the Mobile Riverine Force (MRF) began arriving in Vung Tau. The Army component, the 2d Brigade, 9th Infantry Division, had been activated at Fort Riley, Kansas, in February 1966 and received 24 weeks of training before deployment. By the end of February 1967 the brigade included three infantry battalions, an artillery battalion, and a cavalry squadron.</p>\n<p>The Navy contribution was River Assault Flotilla (RIVFLOT) 1, headed by Captain Wade C. Wells, with two river assault squadrons, RAS 9 and RAS 11. The first Navy units of the MRF arrived at Vung Tau on Whitfield County (LST-1169) on January 7, 1967.</p>\n<p>General Westmoreland had decided in late 1965 to introduce American troops into the Mekong Delta. \"My conviction,\" he stated in a 1966 message to CINCPAC, \"is that enemy access to Delta resources must be terminated without delay.\"</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "John Darrell Sherwood, \"War in the Shallows: U.S. Navy Coastal and Riverine Warfare in Vietnam, 1965-1968\", Naval History and Heritage Command, 2015, pp. 167-174"
      url: "https://www.history.navy.mil/content/dam/nhhc/research/publications/publication-508-pdf/WITS_508.pdf"
    - label: "Wikipedia, \"1966 in the Vietnam War\", revision 1380091905 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1966_in_the_Vietnam_War&oldid=1380091905"
  status: "draft"
  source_text: "[Sherwood, War in the Shallows, pp. 167-168] Recognizing that something needed to be done, General Westmoreland decided in late\n1965 that American troops would be introduced in the area to cut off enemy main force units\n(which were operating mainly in I, II, and III Corps Tactical Zones) from the bread basket of\n[...]\nSouth Vietnam.22 “My conviction,” he stated in a 1966 message to CINCPAC, “is that enemy\naccess to Delta resources must be terminated without delay.”23\n[Sherwood, p. 168] As initially configured, the MDMAF, renamed the Mekong Delta Mobile Riverine Force, or\nMRF, would consist of a Mobile Riverine Base (MRB), based on a larger river, to accommodate\na brigade of troops and provide maintenance and logistics support for river assault operations.\n[Sherwood, p. 168] In February 1966, the 2d Brigade, 9th Infantry Division, was activated at Fort Riley, Kansas,\nfor deployment to Vietnam as part of the MRF. It consisted of 2,120 men organized into three\ninfantry battalions and one artillery battalion. The unit received 24 weeks of training prior to\ndeployment.\n[Sherwood, p. 172] In August 1966, Captain Wade C.\nWells was named the Navy component\ncommander of the MRF and the head of\nRiver Assault Flotilla (RIVFLOT) 1.\n[Sherwood, p. 174] The first elements of the Army’s contribution to the MRF began arriving in Vung Tau on\n19 December 1966. As initially configured, the 9th Infantry Division MRF component would\nconsist of the 2d Brigade—a force that by the end of February 1967 included three infantry\nbattalions, an artillery battalion, and a cavalry squadron plus various supply, medical, and\nmaintenance detachments.57 The Navy contribution would be RIVFLOT 1, comprising two river\nassault squadrons (RAS 9 and RAS 11), each with two river assault divisions under them.58\n[...]\nOn 7 January 1967 the first Navy units of the MRF arrived at Vung Tau on Whitfield County\n(LST-1169).59\n[Wikipedia, 1966_in_the_Vietnam_War, rev 1380091905, entry for December 19] The U.S. Army deployed its new Mobile Riverine Force into combat for the first time, with the 2nd Brigade of the 9th Infantry Division arriving at Vung Tau.\n"
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T12:00:00Z"
- month: 12
  day: 19
  year: 1966
  title: "3d Battalion, 26th Marines sets up in the Co Bi-Thanh Tan corridor"
  body: "<p>On December 19, 1966, the 3d Battalion, 26th Marines established its CP west of Route 1, some 3,000 meters south of Phong Dien, in the Co Bi-Thanh Tan sector of Thua Thien Province, the old Cherokee and Florida operating area 13 miles northwest of Hue. On 10 December, VC units had struck three South Vietnamese strongpoints, including the Phong Dien District Headquarters and the An Lao Bridge across the Bo River. On 17 December, General Kyle ordered the just-arrived battalion from Dong Ha into the corridor, and it travelled by truck with an attached artillery battery.</p>\n<p>After minor skirmishes during the first two days, the 802d VC Battalion attacked the Marine positions in the early morning hours of 22 and 23 December. On 23 December, General Kyle expanded the operation, now codenamed Chinook, reinforcing the 3d Battalion with the 2d Battalion, 26th Marines and ordering the 4th Marines Headquarters to take control of the units in Chinook. Operation Chinook continued into 1967.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Shulimson, Jack, \"U.S. Marines in Vietnam: An Expanding War, 1966\", History and Museums Division, Headquarters, U.S. Marine Corps, 1982, pp. 224–226"
      url: "https://www.usmcu.edu/Portals/218/US%20Marines%20in%20Vietnam%20An%20Expanding%20War%201966%20%20PCN%2019000308600.pdf"
    - label: "Wikipedia, \"1966 in the Vietnam War\", revision 1380091905 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1966_in_the_Vietnam_War&oldid=1380091905"
  status: "draft"
  source_text: "[Shulimson, An Expanding War 1966, p. 224] With a lull in Operation Prairie in the north , General Kyle, in mid-December, decided to move a battalion back into the Co Bi-Thanh Tan sector, th e old Cherokee and Florida operating area, 13 mile s northwest of Hue, and where the enemy was onc e more active . On 10 December, VC units in well-coordinated attacks struck three South Vietnamese strongpoints, including the Phong Die n District Headquarters and the An Lao Bridge across the Bo River . Suspecting that elements of the 6th NVA again were attempting to infiltrate from thei r mountain base areas into the coastal populate d region, General Kyle, on 17 December, ordered th e just-arrived 3d Battalion, 26th Marines from Don g Ha into the Co Bi-Thanh Tan corridor . Travelling by truck from Dong Ha and with an attached artiller y\n[Shulimson, An Expanding War 1966, p. 224, photo caption] Marines of Company I, 3d Battalion, 26th Marines check the identity cards of suspected Viet Cong . Th e battalion is participating in Operation Chinook during December 1966 in the old \"Florida\" area, the C o Bi-Thanh Tan sector in Thua Thien Province .\n[Shulimson, An Expanding War 1966, p. 225] battery, the 3d Battalion established, on 1 9 December, its CP west of Route 1, some 3,00 0 meters south of Phong Dien . After minor skirmishe s with the Marines during the first two days, th e enemy 802d VC Battalion launched two sizeable at tacks against the Marine positions in the early morning hours of 22 and 23 December . In both cases, th e enemy employed the same tactics ; a mortar barrage , followed by a ground probe of the Marine perimeter . The VC then would withdraw, taking most of thei r casualties with them . At this stage, 23 December, General Kyle electe d to expand the operation, now codenamed Chinook , in the Co Bi-Thanh Tan, even further . He reinforce d the 3d Battalion with the 2d Battalion, 26t h Marines, which moved from the Pawnee area int o the Chinook sector, north of the 0 Lau River . At th e same time, he ordered the 4th Marines Headquarter s to deploy from Prairie and take control of the unit s in Chinook .\n[Shulimson, An Expanding War 1966, p. 226] After III MAF convinced MACV that the enemy force presented a clear and present danger to th e Marines in Operation Chinook, Marine air and artillery bombarded the Communist troops . Operation Chinook continued into 1967 .\n[Wikipedia, 1966_in_the_Vietnam_War, rev 1380091905] Operation Chinook was a 4th Marines operation in Thừa Thiên Province. the operation resulted in 218 PAVN killed."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T13:30:00Z"
- month: 12
  day: 22
  year: 1965
  title: "Lieutenant convicted for antiwar protest sign"
  body: "<p>On December 22, 1965, Second Lieutenant Henry H. Howe, Jr., an Army Reserve officer on active duty with the 31st Engineer Battalion at Fort Bliss in El Paso, Texas, was convicted by a court-martial for joining an antiwar protest. On November 6, Howe, off duty and in civilian clothes, had joined a small demonstration in El Paso holding a piece of cardboard with writing on both sides; one side read \"End Johnson's facist aggression in Vietnam\".</p>\n<p>A five-officer panel deliberated for only about ten minutes before convicting Howe of using contemptuous words against the President, under Article 88 of the Uniform Code of Military Justice, and of conduct unbecoming an officer and a gentleman. He was sentenced to dismissal from the service, forfeiture of all pay and allowances, and two years in prison at hard labor. The sentence was later reduced to confinement for one year. A 2019 study described him as the only military member convicted of violating Article 88 for using contemptuous words against the President.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Weber, Jeremy S., \"The Curious Court-Martial of Henry Howe\", Tulsa Law Review, vol. 55, no. 1, 2019, pp. 110–118"
      url: "https://digitalcommons.law.utulsa.edu/cgi/viewcontent.cgi?article=3177&context=tlr"
    - label: "Wikipedia, \"1965 in the Vietnam War\", revision 1370279555 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1965_in_the_Vietnam_War&oldid=1370279555"
  status: "draft"
  source_text: "[Weber, The Curious Court-Martial of Henry Howe, 55 Tulsa L. Rev., p. 110] Howe remains to this day the only military member convicted of violating Article 88 of the UCMJ for using contemptuous words against the President of the United States, his conviction a result of his participation in an antiwar protest in 1965.\n[Weber, p. 110] He entered the Army immediately after graduation, and by 1965, he was an Army Reserve Second Lieutenant about a year into an active duty tour with the 31st Engineer Battalion at Fort Bliss in El Paso, Texas.\n[Weber, p. 110] By late 1965, the first stirrings of public opposition to the Vietnam War emerged. On November 6, 1965, this anti-war sentiment hit the Texas border town of El Paso, at least on a small scale.\n[Weber, p. 112] the protest itself appears to have been quite small; the El Paso Herald-Post numbered the demonstrators at about twenty-five while others pegged the number at closer to a dozen.\n[Weber, p. 112] As the small group of college students began to march, Howe joined in, holding a piece of cardboard with writing on both sides. ... Howe was not on duty and wore civilian clothes.\n[Weber, p. 114] Howe faced a preliminary hearing, having been charged with three violations of the UCMJ: using contemptuous words against the Pres ident, conduct unbecoming an officer and a gentleman, and public use of language disloyal to the United States with design to promote disloyalty and disaffection among the troops and civilian populace. ... granted a defense motion to dismiss the third charge, but the Army proceeded to a general court-martial on the contemptuous words and conduct unbecoming charges.\n[Weber, p. 117] Trial was scheduled right before Christmas 1965, less than two months after the El Paso demonstration.\n[Weber, pp. 117–118] A five-officer panel²one Colonel, one Major, one Captain, and two First Lieutenants²deliberated for only about ten minutes before convicting Howe of both charges. 74 He was sentenced to dismissal from the service, forfeiture of all pay and allowances, and two years in prison at hard labor.\n[Weber, p. 117, n. 71] Army Lieutenant Found Guilty of Contempt Toward President, ALAMOGORDO DAILY NEWS (N.M.), Dec. 22, 1965, at 1.\n[Wikipedia, 1965_in_the_Vietnam_War, rev 1370279555] Second lieutenant Henry Howe jr. was convicted by a court martial of breaching Article 88 of the Uniform Code of Military Justice for attending an antiwar protest in El Paso on 6 November in civilian clothes carrying a sign reading \"Let's have more than a choice between petty ignorant facists in 1968\" and \"End Johnson's facist aggression in Vietnam\". He was sentenced to dismissal from the service, forfeiture of all pay and two years of hard labor. The sentence was later reduced to confinement for one year."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T12:00:00Z"
- month: 12
  day: 23
  year: 1961
  title: "Army helicopters fly Operation Chopper"
  body: "<p>On December 23, 1961, U.S. Army H-21 helicopters flew the first airmobile combat action in Vietnam, Operation CHOPPER. Approximately 1,000 Vietnamese paratroopers were airlifted into a suspected Viet Cong headquarters complex about ten miles west of Saigon. The paratroopers captured an elusive underground radio transmitter after meeting only slight resistance from a surprised enemy.</p>\n<p>The helicopters had arrived twelve days earlier, when the USNS Card docked in downtown Saigon with 32 H-21 helicopters and 400 men of the 57th Transportation Company (Light Helicopter) from Fort Lewis, Wash., and the 8th Transportation Company (Light Helicopter) from Fort Bragg, N.C. Major George D. Hardesty, Jr. of the 8th and Major Robert J. Dillard of the 57th reported that their units had performed outstandingly under their first baptism of fire. Tolson wrote that the events of December 1961 prefaced a decade of unparalleled growth of airmobility.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Tolson, John J., \"Vietnam Studies: Airmobility, 1961–1971\", Department of the Army, 1973, p. 3"
      url: "https://history.army.mil/portals/143/Images/Publications/catalog/90-4.pdf"
    - label: "Wikipedia, \"1961 in the Vietnam War\", revision 1370279448 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1961_in_the_Vietnam_War&oldid=1370279448"
  status: "draft"
  source_text: "[Tolson, Airmobility 1961-1971, p. 3] On 11 December 1961 the United States aircraft carrier USNS Card docked in downtown Saigon with 32 U. S. Army H-21 helicopters and 400 men. The 57th Transportation Company (Light Helicopter) from Fort Lewis, Wash., and the 8th Transportation Company (Light Helicopter) from Fort Bragg, N. C., had arrived in Southeast Asia. This event had a two-fold significance: it was the first major symbol of United States combat power in Vietnam; and, it was the beginning of a new era of airmobility in the United States Army.\nJust twelve days later these helicopters were committed into the first airmobile combat action in Vietnam, Operation CHOPPER. Approximately 1,000 Vietnamese paratroopers were airlifted into a suspected Viet Cong headquarters complex about ten miles west of the Vietnamese capitol. The paratroopers captured an elusive underground radio transmitter after meeting only slight resistance from a surprised enemy. Major George D. Hardesty, Jr. of the 8th Transportation Company and Major Robert J. Dillard of the 57th could report that their units had performed outstandingly under their first baptism of fire.\nThe events of December 1961 prefaced a decade of unparalleled growth of airmobility. But they also were a culmination of many decisions during the preceding decade which allowed the President of the United States to exercise this option in support of the Government of Vietnam.\n[Wikipedia, 1961_in_the_Vietnam_War, rev 1370279448] Operation Chopper was the first combat operation for United States Army soldiers in Vietnam. U.S. pilots transported about 1,000 Army of the Republic of Vietnam (ARVN) paratroopers by helicopter to land and attack VC guerrillas about 10 mi west of Saigon. The operation was deemed a success."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T12:00:00Z"
- month: 12
  day: 24
  year: 1964
  title: "VC bomb the Brinks Hotel in Saigon"
  body: "<p>On December 24, 1964, the VC bombed the Brinks Hotel in Saigon, a Bachelor Officer Quarters for U.S. Army officers. Two VC operatives detonated a car bomb underneath the hotel. The explosion killed two American officers and injured approximately 60, including military personnel and Vietnamese civilians. So unsettled was the situation in South Vietnam that the U.S. could not immediately determine whether the attack was by the VC or by disenchanted South Vietnamese officials.</p>\n<p>The attack just missed the arrival of Bob Hope's entourage. On his first Christmas visit to South Vietnam, Hope and his 60-member troupe entertained 1,200 servicemen at Bien Hoa Air Base. The same day, Khánh issued a declaration of independence from \"foreign manipulation\" and explicitly accused Taylor of abusing his power.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Wikipedia, \"1964 in the Vietnam War\", revision 1370342430 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1964_in_the_Vietnam_War&oldid=1370342430"
  status: "draft"
  source_text: "[Wikipedia, 1964_in_the_Vietnam_War, rev 1370342430] On December 24, Khánh issued a declaration of independence from \"foreign manipulation\", and condemned \"colonialism\", explicitly accusing Taylor of abusing his power. In response to the strained relations, General Westmoreland requested CINCPAC to place a Marine Landing Force off Vũng Tàu, at the mouth of the Saigon River around 80 km southeast of the capital. Westmoreland also put American marines based at Subic Bay in the Philippines on notice.\nBob Hope made his first Christmas visit to South Vietnam, and he and his 60-member troupe entertained 1,200 servicemen at Bien Hoa Air Base. He opened by joking, \"Hello, advisers. Here I am in Bien Hoa... which is Vietnamese for 'Duck!!'\". Referring to his surroundings as \"Sniper Valley\", he said, \"As I flew in today, they gave us a 21-gun salute... Three of them were ours.\"\nThe Brinks Hotel in Saigon was bombed by the VC. Two VC operatives detonated a car bomb underneath the hotel, which was a Bachelor Officer Quarters for U.S. Army officers; the explosion killed two American officers and injured approximately 60, including military personnel and Vietnamese civilians. The attack just missed the arrival of Bob Hope's entourage. So unsettled was the situation in South Vietnam that the U.S. could not immediately determine whether the attack was by the VC or by disenchanted South Vietnamese officials."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T12:00:00Z"
- month: 12
  day: 25
  year: 1964
  title: "Deepe article quotes Taylor on Saigon's generals"
  body: "<p>On December 25, 1964, Beverly Deepe published an article under the title \"Taylor Rips Mask Off Khánh\", reporting remarks Taylor had made at a private briefing to US journalists. Angry with Deepe for airing Khánh's grievances, Taylor had excluded her from the briefing; two days earlier the New York Herald Tribune had published her exclusive interview with Khánh, in which Khánh criticized Taylor. Someone informed Deepe of what Taylor had said.</p>\n<p>In the article, Taylor was quoted as describing some South Vietnamese officers as borderline \"nuts\" and accusing many generals of staying in Saigon and allowing their junior officers to run the war as they saw fit. Deepe's article caused an uproar due to the tension between Taylor and the Vietnamese generals.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Wikipedia, \"1964 in the Vietnam War\", revision 1370342430 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1964_in_the_Vietnam_War&oldid=1370342430"
  status: "draft"
  source_text: "[Wikipedia, 1964_in_the_Vietnam_War, rev 1370342430, December 25] Angry with Deepe for airing Khánh's grievances, Taylor excluded her from a private briefing to the other US journalists. However, someone informed Deepe of what Taylor had said, and she published the remarks on December 25 under the title \"Taylor Rips Mask Off Khánh\". In this article, Taylor was quoted as describing some South Vietnamese officers as borderline \"nuts\" and accusing many generals of staying in Saigon and allowing their junior officers to run the war as they saw fit. Deepe's article caused an uproar due to the tension between Taylor and the Vietnamese generals.\n[Wikipedia, 1964_in_the_Vietnam_War, rev 1370342430, December 23] In an exclusive interview with Beverly Deepe published in the New York Herald Tribune on December 23, Khánh said \"if Taylor did not act more intelligently, Southeast Asia would be lost\" and added that Taylor's \"attitude during the last 48 hours—as far as my small head is concerned—has been beyond imagination\"."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T12:00:00Z"
- month: 12
  day: 26
  year: 1969
  title: "Munitions ship Badger State abandoned after explosions"
  body: "<p>On December 26, 1969, the Vietnam-bound ammunition ship SS Badger State, carrying 8,900 bombs and rockets equal to 2,000 tons of TNT, was rocked by explosions and abandoned by her crew in rough seas. She was carrying the rockets and bombs for the Air Force at Danang under contract to the Military Sea Transportation Service; they included 2,000 pounders loaded at the Bangor (Washington) Naval Ammunition Depot.</p>\n<p>The crew had fought for 9 days to steady the cargo as each roll of the ship sent bombs sliding into each other and the hull. One of the bombs exploded and fire swept the ship. A 2,000 pound bomb fell into the No. 1 Lifeboat, which carried 33 men, and capsized it. The next day the Greek ship Khian Star picked up fourteen crewmen, but rescuers found no sign of the 26 missing men. The Badger State remained afire for 10 days before sinking.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "American Merchant Marine at War, \"SS Badger State Rocked by Blasts\", usmm.org, compiled from The New York Times, Dec. 26, 1969 to Jan. 16, 1970"
      url: "http://www.usmm.org/badger_state.html"
    - label: "Wikipedia, \"1969 in the Vietnam War\", revision 1370279610 (CC BY-SA 4.0)"
