- month: 4
  day: 19
  year: 1964
  title: "Rusk, Wheeler, and William Bundy discuss OPLAN 37-64 with Lodge in Saigon"
  body: "<p>On April 19, 1964, Rusk, General Wheeler, and Assistant Secretary of State for Far Eastern Affairs William Bundy traveled to Saigon to discuss OPLAN 37–64 with Lodge. The discussions continued on April 20.</p><p>Graduated pressure, the strategy under discussion, depended on the assumption that the limited application of force would compel the North Vietnamese to the negotiating table and exact from them a favorable diplomatic settlement. In this view there was no need to pursue military victory, because negotiations would achieve the same political objectives with only the threat of more severe military action. The only question was \"when, not if, the enemy would be induced to negotiate.\"</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle locations 1918, 1920"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 1918] Graduated pressure depended on the assumption that the limited application of force would compel the North Vietnamese to the negotiating table and exact from them a favorable diplomatic settlement. There was no need to pursue military victory because negotiations would achieve the same political objectives with only the threat of more severe military action. [loc 1920] The only question was when, not if, the enemy would be induced to negotiate. On April 19 and 20, Rusk, General Wheeler, and Assistant Secretary of State for Far Eastern Affairs William Bundy traveled to Saigon to discuss OPLAN 37–64 with Lodge."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"

- month: 5
  day: 13
  year: 1964
  title: "Wall Street Journal editorial finds \"the lack of any plan\" in Vietnam"
  body: "<p>On May 13, 1964, an editorial in the Wall Street Journal titled \"Error Upon Error\" observed that \"it is almost impossible to figure out what is the U.S. strategy,\" and declared that \"the evidence indicates the lack of any plan.\"</p><p>Within the government, the military tried gradually to erode barriers to further action, while McNamara, suspicious of the military's behavior and eager to avoid increasing the troop strength in Vietnam, was determined to make the generals justify every request quantitatively, in writing. He ordered the MACV officers to base their requests on quantitative data so that his staff could test their validity.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle locations 1990, 1983, 1965"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 1990] A May 13 editorial in the Wall Street Journal titled “Error Upon Error” observed that “it is almost impossible to figure out what is the U.S. strategy,” and declared that “the evidence indicates the lack of any plan.” [loc 1983] The military tried gradually to erode barriers to further action, while McNamara, suspicious of the military’s behavior and eager to avoid increasing the troop strength in Vietnam, was determined to make the generals justify every request quantitatively, in writing. [loc 1965] He ordered the MACV officers to base their requests on quantitative data so his staff could test their validity."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"

- month: 5
  day: 19
  year: 1964
  title: "U.S. begins reconnaissance flights over Laos"
  body: "<p>On May 19, 1964, the United States began photo and reconnaissance flights over Laos to track the fighting between government forces and Pathet Lao guerrillas on the Plain of Jars.</p><p>On June 6 the Pathet Lao shot down a photo reconnaissance jet. The next day, June 7, another escort aircraft was shot down over Laos.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle locations 2111, 2132"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 2111] The United States had begun photo and reconnaissance flights over Laos on May 19 to track the fighting between government forces and Pathet Lao guerrillas on the Plain of Jars. On June 6 the Pathet Lao shot down a photo reconnaissance jet. [loc 2132] The next day, June 7, another escort aircraft was shot down over Laos."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"

- month: 5
  day: 25
  year: 1964
  title: "NSC Executive Committee refines graduated pressure memo"
  body: "<p>On May 25, 1964, the Executive Committee of the NSC prepared a memo entitled \"Basic Recommendations and Projected Course of Action on Southeast Asia,\" which refined McNamara's earlier memo on graduated pressure. The president agreed to call a meeting of government officials from Saigon and Washington in Honolulu from June 1 to 3.</p><p>On May 30, just prior to the Honolulu conference, the JCS met without Taylor present and prepared a memorandum expressing concern over the \"lack of definition, even a confusion in respect to objectives.\" The memorandum criticized the gradual options under consideration because they were based on a \"lesser objective\" of persuading rather than compelling the North Vietnamese to change their policy and terminate their \"subversive support.\"</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle locations 2030, 2040, 2058, 2063"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 2030] On May 25 the Executive Committee of the NSC prepared a memo entitled Basic Recommendations and Projected Course of Action on Southeast Asia, which refined McNamara’s earlier memo on graduated pressure. [loc 2040] The president agreed to call a meeting of government officials from Saigon and Washington in Honolulu from June 1 to 3. [loc 2058] May 30, just prior to the Honolulu conference, the JCS met without Taylor present and prepared a memorandum expressing concern over the “lack of definition, even a confusion in respect to objectives [loc 2063] The memorandum criticized the gradual options under consideration because they were based on a “lesser objective” of persuading rather than compelling the North Vietnamese to change their policy and terminate their “subversive support.”"
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"

