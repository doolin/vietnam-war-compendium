- month: 7
  day: 7
  year: 1964
  title: "Taylor arrives in Saigon and reorganizes the U.S. mission"
  body: "<p>On July 7, 1964, the day he arrived in Saigon, Taylor cabled that he was reorganizing operations in Saigon \"under direction of a U.S. Mission Council over which I will preside.\" He wasted no time exercising his broad license and promised to undertake a vigorous review of all mission activities.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle location 2280"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 2280] Taylor wasted no time exercising his broad license. He promised to undertake a vigorous review of all mission activities. On July 7, the day he arrived in Saigon, he cabled that he was reorganizing operations in Saigon “under direction of a U.S. Mission Council over which I will preside.”"
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"

- month: 7
  day: 22
  year: 1964
  title: "Joint Chiefs authorize DESOTO patrol in the Gulf of Tonkin"
  body: "<p>On July 22, 1964, the Joint Chiefs authorized a July 31 DESOTO patrol to assess North Vietnamese naval capability. Separately, on the night of July 30–31, under orders from General Westmoreland, four of the MAROPS patrol boats departed Danang for targets on the islands of Hon Me and Hon Nieu in the Gulf of Tonkin.</p><p>Maritime operations (MAROPS) involved teams of South Vietnamese sailors and saboteurs using small, high-speed motor boats commanded and crewed by U.S. Navy SEALs. Equipped with 40-mm cannons or 81-mm mortars, the boats either shelled their objectives or landed frogmen to plant explosives. After hitting their targets, the teams withdrew to their base in Danang, South Vietnam. Covert operations appealed to McNamara because they allowed him to apply carefully measured pressure against North Vietnam without jeopardizing the president's campaign.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle locations 2464, 2448, 2445"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 2464] On July 22 the Joint Chiefs authorized a July 31 DESOTO patrol to assess North Vietnamese naval capability. Separately, on the night of July 30–31, under orders from General Westmoreland, four of the MAROPS patrol boats departed Danang for targets on the islands of Hon Me and Hon Nieu in the Gulf of Tonkin. [loc 2448] Maritime operations (MAROPS) involved teams of South Vietnamese sailors and saboteurs using small, high-speed motor boats commanded and crewed by U.S. Navy SEALs. Equipped with 40-mm cannons or 81-mm mortars, the boats either shelled their objectives or landed frogmen to plant explosives. After hitting their targets, the teams withdrew to their base in Danang, South Vietnam. [loc 2445] Above all, covert operations appealed to McNamara because they allowed him to apply carefully measured pressure against North Vietnam without jeopardizing the president’s campaign."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"

- month: 8
  day: 2
  year: 1964
  title: "Torpedo boats attack the destroyer Maddox in the Gulf of Tonkin"
  body: "<p>On August 2, 1964, at 3:40 P.M. Saigon time, the CINCPAC, Admiral Sharp, sent a flash message to Admiral McDonald and the Joint Chiefs. He reported that three torpedo boats had attacked the Navy destroyer Maddox in the Gulf of Tonkin.</p><p>In the discussions that followed, Ball recommended that Forrestal work with McNamara's staff in the ISA division to develop some \"announceable rules for engagement that would appear fierce.\"</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle locations 2467, 2494"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 2467] At 3: 40 P.M. Saigon time on August 2, the CINCPAC, Admiral Sharp, sent a flash message to Admiral McDonald and the Joint Chiefs. He reported that three torpedo boats had attacked the Navy destroyer Maddox in the Gulf of Tonkin. [loc 2494] As an alternative Ball recommended that Forrestal work with McNamara’s staff in the ISA division to develop some “announceable rules for engagement that would appear fierce.”"
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"

- month: 8
  day: 3
  year: 1964
  title: "MAROPS boats shell North Vietnamese radar site and security post"
  body: "<p>On August 3, 1964, after midnight, two PT boats poured 770 rounds of high-explosive munitions into the North Vietnamese radar facility near Vinh Son. Another boat illuminated and shelled a security post near the mouth of the Ron River, leaving it in flames. Assistant Secretary of State William Bundy described such actions as \"inherently small and unimportant.\"</p><p>The raids were maritime operations (MAROPS), which involved teams of South Vietnamese sailors and saboteurs using small, high-speed motor boats commanded and crewed by U.S. Navy SEALs. Equipped with 40-mm cannons or 81-mm mortars, the boats either shelled their objectives or landed frogmen to plant explosives. After hitting their targets, the teams withdrew to their base in Danang, South Vietnam.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle locations 2530, 2448"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 2530] After midnight on August 3, two PT boats, in one of the many actions that Assistant Secretary of State William Bundy described as “inherently small and unimportant,” poured 770 rounds of high-explosive munitions into the North Vietnamese radar facility near Vinh Son. Another boat illuminated and shelled a security post near the mouth of the Ron River, leaving it in flames. [loc 2448] Maritime operations (MAROPS) involved teams of South Vietnamese sailors and saboteurs using small, high-speed motor boats commanded and crewed by U.S. Navy SEALs. Equipped with 40-mm cannons or 81-mm mortars, the boats either shelled their objectives or landed frogmen to plant explosives. After hitting their targets, the teams withdrew to their base in Danang, South Vietnam."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"

- month: 8
  day: 6
  year: 1964
  title: "Wheeler, McNamara, and Rusk appear before Senate committees"
  body: "<p>On August 6, 1964, General Wheeler accompanied McNamara and Rusk to a joint session of the Senate Foreign Relations and Armed Services Committees. The session came two days after the August 4 attack on the Maddox and Turner Joy, of which it was later said that \"there was a hell of a lot of confusion.\"</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle locations 2723, 2728"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 2723] On August 6 General Wheeler accompanied McNamara and Rusk to a joint session of the Senate Foreign Relations and Armed Services Committees. [loc 2728] “there was a hell of a lot of confusion” surrounding the August 4 attack on the Maddox and Turner Joy."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"

- month: 9
  day: 10
  year: 1964
  title: "Johnson signs NSAM 314"
  body: "<p>On September 10, 1964, the president signed NSAM 314, approving the resumption of U.S. naval patrols in the Gulf of Tonkin; 34A operations, including maritime raids, air drops, and leaflet operations; and planning for South Vietnamese cross-border air and ground operations into Laos.</p><p>LBJ would later delay or disapprove many of the actions that NSAM 314 ostensibly cleared for implementation.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle locations 3085, 3098"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 3085] On September 10, 1964, the president signed NSAM 314 approving the resumption of U.S. naval patrols in the Gulf of Tonkin, 34A operations (including maritime raids, air drops, and leaflet operations), and planning for South Vietnamese cross-border air and ground operations into Laos. [loc 3098] Despite these assurances, however, LBJ would later delay or disapprove many of the actions that NSAM 314 ostensibly cleared for implementation."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"

- month: 11
  day: 25
  year: 1964
  title: "New York Times editorial asks what has changed to justify a wider war"
  body: "<p>On November 25, 1964, a New York Times editorial reminded readers of the president's campaign remarks and suggested: \"If there is to be a new policy now, if an Asian war is to be converted into an American war, the country has a right to insist that it be told what has changed so profoundly in the past two months to justify it.\"</p><p>At the time, the president attempted to conceal from the American public the difficulties in the South Vietnamese armed forces and the gains in Viet Cong strength. On McNamara's recommendation, he removed from a draft of an official White House statement an announcement that the State Department would soon release a study of increased infiltration from North Vietnam.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle locations 3899, 3892, 3893"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 3899] A November 25 New York Times editorial reminded readers of the president’s campaign remarks and suggested: “If there is to be a new policy now, if an Asian war is to be converted into an American war, the country has a right to insist that it be told what has changed so profoundly in the past two months to justify it.” [loc 3892] The president attempted to conceal from the American public the difficulties in the South Vietnamese armed forces and the gains in Viet Cong strength. [loc 3893] On McNamara’s recommendation, he removed from a draft of an official White House statement an announcement that the State Department would soon release a study of increased infiltration from North Vietnam."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"

- month: 1
  day: 28
  year: 1965
  title: "Wheeler orders Sharp to resume DESOTO patrols"
  body: "<p>On January 28, 1965, General Wheeler ordered Admiral Sharp to resume DESOTO patrols on February 3; they would be the first since September of 1964.</p><p>Bundy and McNamara had told the president that the current policy was the \"worst course of action\" and condemned the United States to an \"essentially passive role which can only lead to eventual defeat and an invitation to get out in humiliating circumstances.\" On February 1 Johnson warned the Chiefs that any direct military pressure against North Vietnam could cause Chinese intervention.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle locations 4240, 4222, 4250"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 4240] On January 28, General Wheeler ordered Admiral Sharp to resume DESOTO patrols on February 3; they would be the first since September of 1964. [loc 4222] Bundy and McNamara told the president that the current policy was the “worst course of action” and condemned the United States to an “essentially passive role which can only lead to eventual defeat and an invitation to get out in humiliating circumstances.” [loc 4250] On February 1 Johnson warned the Chiefs that any direct military pressure against North Vietnam could cause Chinese intervention."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"

