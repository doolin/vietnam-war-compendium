- month: 2
  day: 10
  year: 1965
  title: "Viet Cong bomb American barracks at Qui Nhon"
  body: "<p>On February 10, 1965, Viet Cong terrorists bombed an American enlisted soldiers' barracks in the coastal city of Qui Nhon.</p><p>On February 7, 8, and 11, the United States launched 267 aircraft sorties against 491 buildings and destroyed only 47 of them. Operations at the North Vietnamese barracks continued unimpaired.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle locations 4374, 4383"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 4374] On February 10 Viet Cong terrorists bombed an American enlisted soldiers’ barracks in the coastal city of Qui Nhon. [loc 4383] On February 7, 8, and 11, the United States had launched 267 aircraft sorties against 491 buildings and had destroyed only 47 of them. Operations at the North Vietnamese barracks continued unimpaired."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"

- month: 2
  day: 18
  year: 1965
  title: "JCS issue the execute order for Rolling Thunder I"
  body: "<p>On February 18, 1965, one week after they submitted their compromise memo to McNamara, the JCS issued the execute order for Rolling Thunder I. United States and South Vietnamese aircraft were to strike a North Vietnamese naval base on February 20. The first Rolling Thunder mission was not conducted until March 2.</p><p>Various senior members of the Johnson administration and the military had differing objectives for the air campaign, including forcing Hanoi to negotiate, coercing Hanoi either to reduce its support for or \"call off the insurgency,\" interdicting supplies and infiltration into South Vietnam, \"punishing\" Hanoi, boosting morale in South Vietnam, destroying North Vietnamese military capabilities, and protecting U.S. credibility by posing as the \"good doctor\" trying his best to keep South Vietnam from succumbing to the disease of the Viet Cong insurgency.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle locations 4492, 4495, 4641, 4643"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 4492] On February 18, one week after they submitted their compromise memo to McNamara, the JCS issued the execute order for Rolling Thunder I. United States and South Vietnamese aircraft were to strike a North Vietnamese naval base on February 20. [loc 4495] The first Rolling Thunder mission was not conducted until March 2. [loc 4641] Various senior members of the Johnson administration and the military had differing objectives for the air campaign, including forcing Hanoi to negotiate, coercing Hanoi either to reduce its support for or “call off the insurgency,” interdicting supplies and infiltration into South Vietnam, “punishing” Hanoi, boosting morale in [loc 4643] South Vietnam, destroying North Vietnamese military capabilities, and protecting U.S. credibility by posing as the “good doctor” trying his best to keep South Vietnam from succumbing to the disease of the Viet Cong insurgency."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"

- month: 4
  day: 6
  year: 1965
  title: "Johnson approves more active use of Marine battalions"
  body: "<p>On April 6, 1965, in an NSAM, \"the president approved a change of mission for all Marine battalions deployed to Vietnam to permit their more active use under conditions to be established and approved by the Secretary of Defense in consultation with the Secretary of State.\"</p><p>McMaster judged that in the long run the change of mission that committed American troops to offensive combat was more significant than the deployment of additional troops, but that the former decision was easier to conceal from the American public in the short term.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle locations 5257, 5046"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 5257] In an NSAM issued on April 6, “the president approved a change of mission for all Marine battalions deployed to Vietnam to permit their more active use under conditions to be established and approved by the Secretary of Defense in consultation with the Secretary of State.” [loc 5046] In the long run the change of mission that committed American troops to offensive combat was more significant than the deployment of additional troops, but the former decision was easier to conceal from the American public in the short term."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"

- month: 4
  day: 8
  year: 1965
  title: "Johnson tells the Chiefs he expects results and will control the war from Washington"
  body: "<p>On April 8, 1965, the day after the Johns Hopkins speech, Johnson met with the JCS, McNamara, and Deputy Secretary of Defense Vance. The president was determined to avoid any discussion of the bombing of North Vietnam and made it clear to the Chiefs that he expected results in Vietnam even under the restrictions that he had placed on air and ground operations.</p><p>LBJ's eyes turned to Wheeler: \"You're graduates of the Military Academy and you should be able to give me an answer. I want you to come back here next Tuesday and tell me how we are going to kill more Viet Cong.\" He referred to recent press reports that the war had been controlled too tightly from Washington, and told the JCS that \"as long as I am Commander in Chief, I am going to control from Washington.\"</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle locations 5266, 5284, 5297"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 5266] Johnson arranged a meeting on April 8, 1965, the day after the Johns Hopkins speech, with the JCS, McNamara, and Deputy Secretary of Defense Vance. The president was determined to avoid any discussion of the bombing of North Vietnam and made it clear to the Chiefs that he expected results in Vietnam even under the restrictions that he had placed on air and ground operations. [loc 5284] LBJ’s eyes turned to Wheeler: “You’re graduates of the Military Academy and you should be able to give me an answer. I want you to come back here next Tuesday and tell me how we are going to kill more Viet Cong.” [loc 5297] He referred to recent press reports that the war had been controlled too tightly from Washington, and told the JCS that “as long as I am Commander in Chief, I am going to control from Washington.”"
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"

- month: 4
  day: 14
  year: 1965
  title: "Wheeler relays the president's April 13 decisions to CINCPAC and MACV"
  body: "<p>On April 14, 1965, General Wheeler sent a message to CINCPAC, MACV, and the Saigon embassy, detailing the decisions that the president had made in his April 13 meeting with the JCS. At that meeting the president had asked Wheeler, \"How many Viet Cong have we killed since you were here last time?\"</p><p>Ambassador Taylor obtained approval from the South Vietnamese government for the deployment the message ordered: \"DEPLOY 173D AIRBORNE BRIGADE AND NECESSARY SUPPORT ELEMENTS TO BIEN HOA-VUNG TAU AREA WITH THE INITIAL MISSION OF SECURITY OF US INSTALLATIONS AND FACILITIES. EXPAND INITIAL MISSION TO INCLUDE ENGAGEMENT IN COUNTERINSURGENCY COMBAT OPERATIONS.\"</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle locations 5437, 5300, 5439, 5440"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 5437] On April 14 he sent a message to CINCPAC, MACV, and the Saigon embassy, detailing the decisions that the president had made in his April 13 meeting with the JCS. [loc 5300] He asked Wheeler, “How many Viet Cong have we killed since you were here last time?” [loc 5439] Ambassador Taylor obtained approval from the South Vietnamese government: [loc 5440] DEPLOY 173D AIRBORNE BRIGADE AND NECESSARY SUPPORT ELEMENTS TO BIEN HOA-VUNG TAU AREA WITH THE INITIAL MISSION OF SECURITY OF US INSTALLATIONS AND FACILITIES. EXPAND INITIAL MISSION TO INCLUDE ENGAGEMENT IN COUNTERIN-SURGENCY COMBAT OPERATIONS."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"

- month: 5
  day: 8
  year: 1965
  title: "DCI Raborn warns Johnson the United States will be \"pinned down\""
  body: "<p>On May 8, 1965, DCI Raborn wrote to President Johnson predicting, based largely on the French experience of the war, that \"we will find ourselves pinned down, with little choice left among possible subsequent courses of action: i.e. disengagement at very high cost or broadening the conflict in quantum jumps.\"</p><p>McNamara and the president were aware of predictions that an expansion of the American effort on the ground would lead to a protracted, indecisive war that the United States would ultimately lose.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle locations 5706, 5704"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 5706] On May 8 DCI Raborn wrote to Johnson predicting—based largely on the French experience—that “we will find ourselves pinned down, with little choice left among possible subsequent courses of action: i.e. disengagement at very high cost or broadening the conflict in quantum jumps.” [loc 5704] McNamara and the president were aware of predictions that an expansion of the American effort on the ground would lead to a protracted, indecisive war that the United States would ultimately lose."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"

- month: 5
  day: 10
  year: 1965
  title: "Johnson approves bombing pause code-named Mayflower"
  body: "<p>On May 10, 1965, the president approved a five-to-seven-day bombing pause, code-named Mayflower. The Communist summer offensive began the next day, May 11.</p><p>The president and his advisers decided to resume Rolling Thunder on May 18.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle locations 5629, 5725, 5657"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 5629] On May 10 the president approved a five-to-seven-day bombing pause, code-named Mayflower. [loc 5725] The Communist summer offensive had begun on May 11. [loc 5657] the president and his advisers decided to resume Rolling Thunder on May 18."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"

- month: 6
  day: 11
  year: 1965
  title: "Quat cedes the Saigon government to the military"
  body: "<p>On June 11, 1965, Quat ceded the Saigon government to the military, and the eight-month interlude of civilian rule in South Vietnam ended, never to return.</p><p>The Communist summer offensive had begun on May 11. On June 7 General Westmoreland had sent a cable to CINCPAC requesting more American troops.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle locations 5732, 5725, 5758"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 5732] On June 11 Quat ceded the Saigon government to the military and the eight-month interlude of civilian rule in South Vietnam ended, never to return. [loc 5725] The Communist summer offensive had begun on May 11. [loc 5758] On June 7 General Westmoreland sent a cable to CINCPAC requesting more American troops"
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"

- month: 6
  day: 18
  year: 1965
  title: "Johnson approves the First Cavalry Division for South Vietnam"
  body: "<p>On June 18, 1965, the president formally approved a portion of Westmoreland's request. The air mobile First Cavalry Division (nine battalions, 23,000 troops) would be sent to South Vietnam. The request had come in a cable General Westmoreland sent to CINCPAC on June 7 asking for more American troops.</p><p>Despite his recognition that his advisers had \"no plan for victory militarily or diplomatically,\" Lyndon Johnson remained resolved to do only what was necessary to avoid defeat in Vietnam. To help the president steer the middle course, McNamara began to develop a program aimed at achieving a \"stalemate in Vietnam.\"</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle locations 5911, 5758, 5899, 5922"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 5911] On June 18 the president formally approved a portion of Westmoreland’s request. The air mobile First Cavalry Division (nine battalions, 23,000 troops) would be sent to South Vietnam. [loc 5758] On June 7 General Westmoreland sent a cable to CINCPAC requesting more American troops [loc 5899] Despite his recognition that his advisers had “no plan for victory militarily or diplomatically,” Lyndon Johnson remained resolved to do only what was necessary to avoid defeat in Vietnam. [loc 5922] To help the president steer the middle course, McNamara began to develop a program aimed at achieving a “stalemate in Vietnam.”"
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"

- month: 6
  day: 23
  year: 1965
  title: "Ball recommends cutting U.S. losses in Vietnam"
  body: "<p>On June 23, 1965, Ball recommended that the United States cut its losses in Vietnam.</p><p>Rusk predicted that pulling out of Vietnam would damage U.S. credibility, which \"is the pillar of peace throughout the world,\" and argued that such a diminution of American reputation would \"lead to our ruin and almost certainly to catastrophic war.\" McNamara wrote to LBJ that \"expanded military and political moves\" would convince North Vietnam and the Viet Cong \"that the odds are against their winning.\" By default, in McMaster's account, attrition had become the military strategy and stalemate was its objective.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle locations 5951, 5957, 5975"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 5951] On June 23 Ball recommended that the United States cut its losses in Vietnam. [loc 5957] Rusk, who predicted that pulling out of Vietnam would damage U.S. credibility, which “is the pillar of peace throughout the world.” Rusk argued that such a diminution of American reputation would “lead to our ruin and almost certainly to catastrophic war. [loc 5975] These “expanded military and political moves,” McNamara wrote to LBJ, would convince North Vietnam and the Viet Cong “that the odds are against their winning.” By default, attrition had become the military strategy and stalemate was its objective."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"

- month: 7
  day: 1
  year: 1965
  title: "McGeorge Bundy sends Johnson the competing Vietnam policy papers"
  body: "<p>On July 1, 1965, before the president met with his advisers, McGeorge Bundy sent him a memorandum to which he attached the Vietnam policy papers from McNamara and Ball, and from Rusk and William Bundy.</p><p>The authors had already staked out their positions. On June 23 Ball had recommended that the United States cut its losses in Vietnam. Rusk predicted that pulling out of Vietnam would damage U.S. credibility, which \"is the pillar of peace throughout the world,\" and argued that such a diminution of American reputation would \"lead to our ruin and almost certainly to catastrophic war.\" McNamara wrote to LBJ that \"expanded military and political moves\" would convince North Vietnam and the Viet Cong \"that the odds are against their winning.\"</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle locations 5993, 5951, 5957, 5975"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 5993] Before the president met with his advisers on July 1, McGeorge Bundy sent him a memorandum to which he attached the Vietnam policy papers from McNamara and Ball, and from Rusk and William Bundy. [loc 5951] On June 23 Ball recommended that the United States cut its losses in Vietnam. [loc 5957] Rusk, who predicted that pulling out of Vietnam would damage U.S. credibility, which “is the pillar of peace throughout the world.” Rusk argued that such a diminution of American reputation would “lead to our ruin and almost certainly to catastrophic war. [loc 5975] These “expanded military and political moves,” McNamara wrote to LBJ, would convince North Vietnam and the Viet Cong “that the odds are against their winning.”"
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"

- month: 7
  day: 8
  year: 1965
  title: "Johnson approves Westmoreland's full thirty-four battalions"
  body: "<p>On July 8, 1965, the president approved the deployment to South Vietnam of the full thirty-four battalions that Westmoreland had requested. McMaster records the approval as something later divulged rather than announced at the time.</p><p>Harold Johnson estimated that to guarantee a free and independent South Vietnam would take six to seven hundred thousand troops and five years of fighting.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle locations 6033, 6025"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 6033] He divulged that the president had, on July 8, approved the deployment to South Vietnam of the full thirty-four battalions that Westmoreland had requested. [loc 6025] Harold Johnson estimated that to guarantee a free and independent South Vietnam would take six to seven hundred thousand troops and five years of fighting."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"

- month: 7
  day: 2
  year: 1965
  title: "Wheeler charges Goodpaster committee to assess chances of winning"
  body: "<p>On July 2, 1965, as more U.S. Marines landed at Danang and Qui Nhon, Johnson met with his closest advisers. The same day, an ad hoc committee under Goodpaster's direction was charged by Wheeler with determining what \"assurance the U.S. can have of winning if we do everything we can.\" Greene would not discover the committee's existence until July 12.</p><p>In essence Goodpaster told McNamara that the United States would have to remove virtually all restrictions on the application of conventional military power to win in Vietnam. He also argued that the estimate should be based on the enemy's capabilities rather than on unrealistic assumptions concerning enemy intentions.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle locations 6048, 6004, 6090, 6096"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 6048] Greene would not discover until July 12 that, since July 2, an ad hoc committee under Goodpaster’s direction had been charged by Wheeler with determining what “assurance the U.S. can have of winning if we do everything we can.” [loc 6004] On July 2, as more U.S. Marines landed at Danang and Qui Nhon, Johnson met with his closest advisers. [loc 6090] In essence Goodpaster told McNamara that the United States would have to remove virtually all restrictions on the application of conventional military power to win in Vietnam. [loc 6096] He also argued that the estimate should be based on the enemy’s capabilities rather than on unrealistic assumptions concerning enemy intentions."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"

- month: 7
  day: 23
  year: 1965
  title: "JCS see domestic politics overwhelm their Vietnam planning"
  body: "<p>On July 23, 1965, a Friday, it had by nightfall become clear to the JCS that the president's domestic political priorities had overwhelmed the assumptions on which they had based Vietnam planning. The JCS and the service secretaries had met with the president the day before, on July 22.</p><p>One passage McMaster quotes from the period reads: \"We are about to fight a war we can't fight and win, the country we are trying to help is quitting. The failure on our own to fully realize what guerrilla war is like. We are sending conventional troops to do an unconventional job.\"</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle locations 6272, 6217, 6252"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 6272] By Friday night, July 23, it had finally become clear to the JCS that the president’s domestic political priorities had overwhelmed the assumptions on which they had based Vietnam planning. [loc 6217] The JCS and the service secretaries met with the president on July 22. [loc 6252] We are about to fight a war we can’t fight and win, the country we are trying to help is quitting. The failure on our own to fully realize what guerrilla war is like. We are sending conventional troops to do an unconventional job."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"

- month: 7
  day: 27
  year: 1965
  title: "Johnson works on the NSC and Congress before announcing his decision"
  body: "<p>On July 27, 1965, in the evening, before he made public his decision, President Johnson made one last effort to soften up his own NSC and selected members of Congress.</p><p>In McMaster's assessment, between November 1963 and July 1965 LBJ made the critical decisions that took the United States into war almost without realizing it.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "H.R. McMaster, Dereliction of Duty (1998), Kindle locations 6318, 6403"
      url: https://openlibrary.org/isbn/0060929081
  status: approved
  source_text: "[loc 6318] On the evening of July 27, before he made public his decision, President Johnson made one last effort to soften up his own NSC and selected members of Congress. [loc 6403] Between November 1963 and July 1965, LBJ made the critical decisions that took the United States into war almost without realizing it."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:26:48Z"
