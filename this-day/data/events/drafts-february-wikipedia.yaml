- month: 2
  day: 3
  year: 1962
  title: "Diem launches the Strategic Hamlet Program"
  body: "<p>On February 3, 1962, Diem formally launched the Strategic Hamlet Program by presidential decree. The abandonment of the earlier agroville program had paved the way for the strategic hamlet program, which Diem's brother, Ngo Dinh Nhu, supervised. Nhu developed the plan from many sources, using ideas from Vietnamese self-defense villages, British new villages in Malaya, and the Israeli kibbutz defense system.</p>\n<p>Nhu's primary objective was to create a strategic hamlet defense system in which the villagers organized themselves to fight the Viet Cong through \"people's guerrilla tactics.\" The villagers had to provide the funds and the labor to build the strategic hamlets, as well as people for self-defense forces. Despite U.S. opposition to British involvement, Sir Robert Thompson and the British Advisory Mission (BRIAM) had arrived in South Vietnam at Diem's request.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Curtis Peoples, \"The Use of the British Village Resettlement Model in Malaya and Vietnam\", 4th Triennial Vietnam Symposium, The Vietnam Center and Sam Johnson Vietnam Archive, Texas Tech University, 2002"
      url: "http://www.vietnam.ttu.edu/events/2002_Symposium/2002Papers_files/peoples.php"
    - label: "Wikipedia, \"1962 in the Vietnam War\", revision 1374503779 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1962_in_the_Vietnam_War&oldid=1374503779"
  status: "draft"
  source_text: "[Peoples, \"The Use of the British Village Resettlement Model in Malaya and Vietnam\", Texas Tech 2002 Symposium] According to Diem's brother Ngo Dinh Nhu, the significance of the program, a program, that he later declared he had not approved of, demonstrated that corv e labor could still be imposed on the peasants by the government and Viet Cong. [28] The abandonment of the agroville paved the way for the development of the strategic hamlet program, a program Nhu supervised.\n\n[Peoples, Texas Tech 2002 Symposium] Ngo Dinh Nhu commanded the plan to implement a nation-wide strategic hamlet program, which he developed from many sources. Nhu used ideas from Vietnamese self-defense villages, British new villages in Malaya, and the Israeli kibbutz defense system. [29] Nhu's primary objective was to create a strategic hamlet defense system in which the villagers organized themselves to fight the Viet Cong, via \"people's guerrilla tactics.\" [30] Nhu was adamant that the people take personal responsibility in developing the strategic hamlet program. Thus, the villagers had to provide funds and the labor to build the strategic hamlets, as well as people for self-defense forces.\n\n[Peoples, Texas Tech 2002 Symposium] Ambassador Dubrow clearly opposed British involvement. ... Despite the U.S opposition to British involvement, Sir Robert Thompson and the British Advisory Mission (BRIAM) arrived in South Vietnam at the request of Diem.\n\n[Peoples, Texas Tech 2002 Symposium] On 3 February 1962, Diem formally launched the Strategic Hamlet Program by presidential decree."
