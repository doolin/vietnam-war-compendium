- month: 2
  day: 12
  year: 1973
  title: "First freed POWs leave Hanoi in Operation Homecoming"
  body: "<p>On February 12, 1973, a C-141A Starlifter transport jet with a red cross on its tail lifted off from Hanoi, North Vietnam, carrying the first flight of 40 U.S. prisoners of war home through Operation Homecoming. By the day's end, three C-141A aircraft had lifted off from Hanoi, as well as a C-9A aircraft from Saigon, South Vietnam. Aboard the first flight were Air Force Tech. Sgt. James R. Cook, who saluted the U.S. colors from his stretcher, and Navy Cmdr. Everett Alvarez Jr., the first American pilot shot down in North Vietnam, who had spent eight-and-a-half years in captivity.</p>\n<p>Aeromedical teams tended the former POWs during the two-and-a-half hour flight to Clark Air Base in the Philippines, the first stop on their trip home. The mission included 54 C-141 flights between February 12 and April 4, 1973, returning 591 POWs to American soil.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "American Forces Press Service, \"Operation Homecoming for Vietnam POWs marks 40 years\", U.S. Air Force (af.mil), 2013"
      url: "https://www.af.mil/News/Article-Display/Article/109716/operation-homecoming-for-vietnam-pows-marks-40-years/"
    - label: "Wikipedia, \"1973 in the Vietnam War\", revision 1380647415 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1973_in_the_Vietnam_War&oldid=1380647415"
  status: "draft"
  source_text: "[American Forces Press Service, \"Operation Homecoming for Vietnam POWs marks 40 years\", af.mil, 12 Feb 2013, photo caption] Newly freed prisoners of war celebrate as their C-141A aircraft lifts off from Hanoi, North Vietnam, on Feb. 12, 1973, during Operation Homecoming. The mission included 54 C-141 flights between Feb. 12 and April 4, 1973, returning 591 POWs to American soil. (U.S. Air Force photo)\n\n[af.mil, 12 Feb 2013, article] WASHINGTON (AFNS) -- Forty years ago today, a C-141A Starlifter transport jet with a distinctive red cross on its tail lifted off from Hanoi, North Vietnam, and the first flight of 40 U.S. prisoners of war began their journey home through Operation Homecoming.\n\nBy the day's end, three C-141A aircraft would lift off from Hanoi, as well as a C-9A aircraft from Saigon, South Vietnam. In a steady flow of flights through late March 1973 under terms set through the Paris Peace Accords, 591 POWs returned to American soil.\n\nAir Force Tech. Sgt. James R. Cook, who suffered severe wounds when he bailed out of his stricken aircraft over North Vietnam in December 1972, saluted the U.S. colors from his stretcher as he was carried aboard the aircraft. Also on the first flight was Navy Cmdr. Everett Alvarez Jr., the first American pilot to be shot down in North Vietnam and a POW who spent eight-and-a-half years in captivity.\n\nAeromedical teams assigned to each aircraft tended to the former POWs during the two-and-a-half hour flight to Clark Air Base in the Philippines, the first stop on their trip home."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T12:00:00Z"
- month: 2
  day: 14
  year: 1965
  title: "VC raid An Luu village near Quang Tri"
  body: "<p>On February 14, 1965, VC troops destroyed the An Luu village headquarters, 5km northeast of Quang Tri. The next morning, a Popular Forces platoon set up a blocking position north of the village as an infantry battalion advanced from the south and six M113s moved in from the west.</p>\n<p>After failing to break out to the north, the VC took defensive positions along a stream, where the advancing infantry and M113s overran them. ARVN losses were one dead, three wounded, and one M113 damaged. VC losses were 37 killed, four captured, and 30 weapons lost.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Wikipedia, \"1965 in the Vietnam War\", revision 1370279555 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1965_in_the_Vietnam_War&oldid=1370279555"
  status: "draft"
  source_text: "[Wikipedia, 1965_in_the_Vietnam_War, rev 1370279555] VC troops destroyed An Luu village headquarters, 5km northeast of Quang Tri. The next morning, a Popular Forces platoon set up a blocking position north of the village as an infantry battalion advanced from the south and six M113s moved in from the west. After failing to break out to the north, the VC assumed defensive positions along a stream, only for the advancing infantry and M113s to overrun them. ARVN losses were one dead, three wounded, and one M113 damaged. VC losses were 37 killed, four captured and 30 weapons lost."
