- month: 2
  day: 8
  year: 1962
  title: "Admiral Felt activates Military Assistance Command, Vietnam"
  body: "<p>On February 8, 1962, Admiral Felt, commander in chief, Pacific (CINCPAC), formally activated the Military Assistance Command, Vietnam (MACV). At the peremptory direction of the State Department, Ambassador Frederick E. Nolting had obtained President Diem's consent to the American military reorganization five days earlier. Within less than a week, General Paul Harkins arrived in Saigon to take up his duties as MACV commander.</p>\n<p>The State Department had urged the title \"Military Assistance Command, Vietnam,\" to denote the continued advice-and-support character of American military activity in South Vietnam. Harkins' formal statement of authority from the Joint Chiefs of Staff directed him to work directly with President Diem and his commanders on military affairs, consult with the ambassador on \"US political and basic policy matters,\" keep the ambassador fully informed on his contacts with the South Vietnamese, and refer unresolved disagreements to Washington through the military chain of command.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Cosmas, \"MACV: The Joint Command in the Years of Escalation, 1962-1967\", United States Army Center of Military History, 2006, pp. 24-27"
      url: "https://history.army.mil/html/books/091/91-6/CMH_Pub_91-6.pdf"
    - label: "Wikipedia, \"1962 in the Vietnam War\", revision 1374503779 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1962_in_the_Vietnam_War&oldid=1374503779"
  status: "draft"
  source_text: "[Cosmas, MACV: The Years of Escalation, 1962-1967, p. 24] The State Department in effect bowed to McNamara's wishes. It held out only for acknowledgment of the ambassador's preeminence in general policy matters and urged that the title of the command be changed to \"Military Assistance Command, Vietnam,\" to denote the continued advice-and-support character of American military activity in South Vietnam.31 After a mid-December meeting in Honolulu attended by Rusk, McNamara, Ambassador to South Vietnam Frederick E. Nolting, and General McGarr, the two departments reached agreement on the main issues. Defense accepted State's proposed title for the headquarters, which henceforth was to be known as Military Assistance Command, Vietnam (MACV). ... Secretary McNamara transmitted this agreement to President Kennedy on 22 December, along with his nomination of General Paul Harkins as MACV commander. Kennedy early in January approved both the terms of reference and the selection of Harkins.32\n\n[Cosmas, MACV: The Years of Escalation, 1962-1967, pp. 26-27] Even before these final understandings were completed, the Military Assistance Command, Vietnam, went into operation. At the peremptory direction of the State Department, Ambassador Nolting obtained President Diem's consent to the American military reorganization on 3 February 1962. Five days later, Admiral Felt, commander in chief, Pacific (CINCPAC), formally activated the command. Within less than a week, General Harkins arrived in Saigon to take up his duties. Harkins' formal statement of authority from the Joint Chiefs of Staff reiterated the terms of the earlier State-Defense agreement. As COMUSMACV, he was to work directly with President Diem and his commanders on military affairs, consult with the ambassador on \"US political and basic policy matters,\" keep the ambassador fully informed on his contacts with the South Vietnamese, and refer unresolved disagreements to Washington through the military chain of command.37"
  summarized_by: "Claude Opus 5.5"
