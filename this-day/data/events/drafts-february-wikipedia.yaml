- month: 2
  day: 17
  year: 1965
  title: "Senator Church calls for a neutral South Vietnam"
  body: "<p>On February 17, 1965, Senator Frank Church said on the United States Senate floor that \"The Saigon government is losing its war, not for lack of equipment, but for lack of internal cohesion,\" and that the best solution would be the negotiation of a neutral South Vietnam. Several other prominent Democratic Party Senators, including George McGovern, supported Church's speech.</p>\n<p>Church's call for a neutral South Vietnam echoed similar statements by French President Charles de Gaulle, the Pope, and the Secretary General of the United Nations. Former President Eisenhower and several Republicans supported Johnson's policy, and Eisenhower advised Johnson not to negotiate from weakness.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Wikipedia, \"1965 in the Vietnam War\", revision 1370279555 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1965_in_the_Vietnam_War&oldid=1370279555"
  status: "draft"
  source_text: "[Wikipedia, 1965_in_the_Vietnam_War, rev 1370279555] On the United States Senate floor, Senator Frank Church said \"The Saigon government is losing its war, not for lack of equipment, but for lack of internal cohesion\" and the best solution would be the negotiation of a neutral South Vietnam. Church's speech was supported by several other prominent Democratic Party Senators, including George McGovern. Church's call for a neutral South Vietnam echoed similar statements by French President Charles de Gaulle, the Pope and the Secretary General of the United Nations. Former President Eisenhower and several Republicans supported Johnson's policy. Eisenhower advised Johnson not to negotiate from weakness."
