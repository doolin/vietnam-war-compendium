- month: 2
  day: 27
  year: 1970
  title: "Rockets damage aircraft at Bien Hoa Air Base"
  body: "<p>On February 27, 1970, rocket fragments tore into three A-37s, two F-100s, and a C-7 at Bien Hoa Air Base. Bien Hoa, hard hit by the Tet offensive two years earlier, was the target of five attacks that year that killed two and wounded at least seventy-four. The bombardments also inflicted severe material damage; a shelling on January 21 had damaged a C-123, a C-7, and a UH-1.</p>\n<p>The Viet Cong continued to harass Seventh Air Force bases during 1970. Tan Son Nhut, a prime target of the 1968 Tet offensive, was unscathed through 1970, whereas Phu Cat, Phan Rang, and Cam Ranh Bay, three air bases not hit during the Tet battles of 1968, came under attack.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Nalty, \"Air War over South Vietnam, 1968-1975\", The United States Air Force in Southeast Asia, Air Force History and Museums Program, 2000, pp. 244-246"
      url: "http://www.afhso.af.mil/shared/media/document/AFD-100924-004.pdf"
    - label: "Wikipedia, \"1970 in the Vietnam War\", revision 1377614479 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1970_in_the_Vietnam_War&oldid=1377614479"
  status: "draft"
  source_text: "[Nalty, Air War over South Vietnam, 1968-1975, p. 244] Heavy fighting proved infrequent, but the combat that did erupt on the ground remained confined to the border regions of South Vietnam. The Viet Cong, however, continued to harass Seventh Air Force bases. Tan Son Nhut, a prime target of the 1968 Tet offensive, was unscathed through 1970, whereas three air bases not hit during the Tet battles of 1968 came under attack. These were Phu Cat, shelled four times; Phan Rang, hit eleven times by rockets or grenades; and Cam Ranh Bay, subjected to seven attacks.\n\n[Nalty, Air War over South Vietnam, 1968-1975, p. 246] Bien Hoa, hard hit by the Tet offensive two years earlier, was the target of five attacks that killed two and wounded at least seventy-four. The bombardments also inflicted severe material damage: a shelling on January 21 damaged a C–123, a C–7, and a UH–1; and on February 27, rocket fragments tore into three A–37s, two F–100s, and a C–7.68\n\n[Wikipedia, 1970_in_the_Vietnam_War, rev 1377614479] A PAVN/VC rocket attack on Bien Hoa Air Base damaged three A-37s, two F-100s and a C-7. Two USAF personnel were killed in these attacks and 74 wounded."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T12:00:00Z"
- month: 2
  day: 29
  year: 1972
  title: "South Korea completes Marine brigade withdrawal"
  body: "<p>On February 29, 1972, South Korea completed the withdrawal of its 2nd Marine brigade from South Vietnam. Two Republic of Korea Army divisions totaling 36,000 men remained in South Vietnam.</p>"
