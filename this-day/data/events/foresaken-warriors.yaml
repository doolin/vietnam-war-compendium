- month: 1
  day: 5
  year: 1971
  title: "Cooper-Church amendment bars U.S. advisors from Cambodia"
  body: "<p>On January 5, 1971, the revised Cooper-Church amendment was enacted, forbidding the use of U.S. ground troops or advisors in Cambodia.</p><p>The South Vietnamese went into Cambodia without their advisors that month. On 13 January 1971, the 44th Ranger Battalion was ordered to move to Hong Nhu near the Cambodian border. The South Vietnamese named the January 1971 Cambodian operation Cuu Long 44-02, and D-day was set for 15 January 1971. The 44th Ranger Battalion withdrew from Cambodia on 22 January 1971 and returned to its base camp at Cai Rang.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Robert L. Tonsetic, Forsaken Warriors: The Story of an American Advisor with the South Vietnamese Rangers and Airborne (Casemate, 2009), Kindle locations 2217, 2219, 2221, 2228, 2305"
      url: https://openlibrary.org/works/OL27982066W
  status: approved
  source_text: "[loc 2217] On 13 January 1971, the 44th Ranger Battalion was ordered to move to Hong Nhu near the Cambodian border. [loc 2219] The South Vietnamese named the January 1971 Cambodian operation Cuu Long 44-02. [loc 2221] D-day for Cuu Long 44-02 was set for 15 January 1971. [loc 2228] The revised Cooper-Church amendment, enacted on 5 January 1971, forbade the use of U.S. ground troops or advisors in Cambodia. [loc 2305] The 44th Ranger Battalion withdrew from Cambodia on 22 January 1971 and returned to their base camp at Cai Rang."
  summarized_by: "Claude Fable 5.1"
