- month: 1
  day: 22
  year: 1971
  title: "44th Ranger Battalion withdraws from Cambodia"
  body: "<p>On January 22, 1971, the 44th Ranger Battalion withdrew from Cambodia and returned to its base camp at Cai Rang. The battalion had been ordered to move to Hong Nhu near the Cambodian border on 13 January, ahead of the operation the South Vietnamese named Cuu Long 44-02, whose D-day was set for 15 January 1971. Under the revised Cooper-Church amendment, enacted on 5 January 1971, no U.S. ground troops or advisors could go into Cambodia with it.</p><p>The battalion's stay at Cai Rang was short. On 26 January 1971 a new mission was passed to the 44th Ranger Battalion, and that day it was airlifted by CH-46 Sea Knight helicopters from Can Tho to the Solid Anchor base.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Robert L. Tonsetic, Forsaken Warriors: The Story of an American Advisor with the South Vietnamese Rangers and Airborne (Casemate, 2009), Kindle locations 2217, 2221, 2228, 2305, 2345, 2371"
