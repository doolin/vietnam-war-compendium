- month: 7
  day: 1
  year: 1971
  title: "Battalion Combat Assistance Teams scheduled to end"
  body: "<p>On July 1, 1971, all Battalion Combat Assistance Teams (BCATs) were, by schedule, to be phased out.</p><p>Author Robert L. Tonsetic had served on such a team with the 44th Ranger Battalion, which in January 1971 went into Cambodia without its advisors and then took up the mission at the Solid Anchor base. Before the phase-out date he moved to the airborne: his reporting date to the Vietnamese Airborne Division Detachment, Team 162, was 29 May 1971, and when he signed in at the Airborne Advisory Detachment at Tan Son Nhut Airbase he was told his assignment was Senior Advisor to the Airborne Division's 2d Battalion, the battalion that had defended Fire Support Base 30 during Operation Lam Son 719.</p>"
