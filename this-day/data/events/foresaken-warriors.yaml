- month: 9
  day: 26
  year: 1971
  title: "Tonsetic leaves 2d Airborne Battalion in War Zone D"
  body: "<p>On September 26, 1971, Robert L. Tonsetic left the 2d Airborne Battalion in War Zone D, ending his time as the battalion's Senior Advisor.</p><p>He had reported to the Vietnamese Airborne Division Detachment, Team 162, on 29 May 1971, and on signing in at the Airborne Advisory Detachment at Tan Son Nhut Airbase was told that his specific assignment was Senior Advisor to the Airborne Division's 2d Battalion. That battalion had defended Fire Support Base 30 during Operation Lam Son 719 and, after linking up with the 7th Airborne Battalion, fought as a rearguard during the withdrawal phase until the two units were extracted by helicopter on 20 March.</p>"
