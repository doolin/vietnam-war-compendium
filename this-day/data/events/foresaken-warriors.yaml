- month: 1
  day: 29
  year: 1971
  title: "Nixon approves Lam Son 719"
  body: "<p>On January 29, 1971, President Nixon gave his approval for the operation to proceed, and South Vietnamese troops moved to the border on 8 February.</p><p>The book's account of Operation Lam Son 719 follows. The first attack on the 3d Airborne Brigade's FSB 31 began around 1100 hours on 25 February, when the NVA opened with a mortar and artillery barrage that included fire from heavy 130mm field guns. The Airborne Division's 2d Battalion defended Fire Support Base 30 during the operation and, after linking up with the 7th Airborne Battalion, the two units fought as a rearguard during the withdrawal phase until they were extracted by helicopter on 20 March. Author Robert L. Tonsetic became the 2d Battalion's Senior Advisor later in 1971.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Robert L. Tonsetic, Forsaken Warriors: The Story of an American Advisor with the South Vietnamese Rangers and Airborne (Casemate, 2009), Kindle locations 3021, 3074, 3223, 3227"
      url: https://openlibrary.org/works/OL27982066W
  status: approved
  source_text: "[loc 3021] On 29 January 1971, President Nixon gave his approval for the operation to proceed, and South Vietnamese troops moved to the border on 8 February. [loc 3074] The first attack on the 3d Airborne Brigade’s FSB 31 began around 1100 hours on 25 February. The NVA opened with a murderous mortar and artillery barrage that included fire from heavy 130mm field guns. [loc 3223] I was told that my specific assignment was Senior Advisor to the Airborne Division’s 2d Battalion. This was the battalion that defended Fire Support Base 30 during Operation Lam Son 719. [loc 3227] After linking up with the 7th Airborne Battalion, the two units fought as a rearguard during the withdrawal phase of Lam Son 719, until they were extracted by helicopter on 20 March."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:27:14Z"

- month: 5
  day: 29
  year: 1971
  title: "Tonsetic reports to Airborne Division advisory Team 162"
  body: "<p>On May 29, 1971, Robert L. Tonsetic reported to the Vietnamese Airborne Division Detachment, Team 162. When he signed in at the Airborne Advisory Detachment at Tan Son Nhut Airbase, he was told that his specific assignment was Senior Advisor to the Airborne Division's 2d Battalion.</p><p>The 2d Battalion had defended Fire Support Base 30 during Operation Lam Son 719. After linking up with the 7th Airborne Battalion, the two units fought as a rearguard during the withdrawal phase until they were extracted by helicopter on 20 March. The division itself dated from 1 December 1965, when the Airborne Brigade was expanded to a divisional size unit and designated the ARVN high command's general reserve.</p><p>Tonsetic's move came as the Battalion Combat Assistance Teams (BCATs) with which he had served were scheduled to be phased out by 1 July 1971.</p>"
