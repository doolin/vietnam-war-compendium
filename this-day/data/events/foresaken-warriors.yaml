  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:27:14Z"

- month: 1
  day: 26
  year: 1971
  title: "44th Rangers airlifted to Solid Anchor base"
  body: "<p>On January 26, 1971, the mission at Solid Anchor was passed to the 44th Ranger Battalion, and the battalion was airlifted by CH-46 Sea Knight helicopters from Can Tho to the Solid Anchor base. The Rangers had returned to their base camp at Cai Rang from Cambodia only four days earlier, on 22 January. The Solid Anchor base had become functional by the end of October 1970.</p><p>The base came under fire during the battalion's stay. On the evening of 18 February the VC lobbed approximately 25 82mm rounds into the base, and the following day the 44th Ranger Battalion was ordered to conduct a riverine operation on the Rach Ong Dinh waterway. On the night of 28 February, the VC mortared the base again.</p>"
  photo_url: null
