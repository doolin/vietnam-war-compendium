- month: 9
  day: 2
  year: 1970
  title: "Advisor Tonsetic begins Vietnam tour"
  body: "<p>On September 2, 1970, in the evening, Robert L. Tonsetic was at the Hoa airbase, the first dated point in his account of his tour as an American advisor with South Vietnamese forces. By 21 October 1970 he was with the advisors of the 44th Ranger Battalion, which pulled off the mountain identified as Nui Ba Voi on U.S. maps early that morning.</p><p>Tonsetic had served in Southeast Asia before. He deployed with Company D of the 1st Special Forces Group from Fort Bragg in October 1966; the company was redesignated the 46th Special Forces Company during his tour, and in partnership with the Thai Special Forces its detachments spread throughout the country to quell a growing threat from Communist insurgents in the northeastern and southern regions. In early 1967, Lieutenant Colonel Kollat selected him for the Infantry Training Committee of a task force that trained the \"Queen's Cobras\" Regiment, the first Thai unit to deploy to Vietnam.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Robert L. Tonsetic, Forsaken Warriors: The Story of an American Advisor with the South Vietnamese Rangers and Airborne (Casemate, 2009), Kindle locations 166, 184, 332, 1421"
      url: https://openlibrary.org/works/OL27982066W
  status: approved
  source_text: "[loc 166] I deployed with Company D of the 1st Special Forces Group from Fort Bragg in October of 1966. The company was redesignated as the 46th Special Forces Company during my tour. In partnership with the Thai Special Forces, our detachments spread throughout the large country to quell a growing threat from Communist insurgents in the northeastern and southern regions of the country. [loc 184] In early 1967, Lieutenant Colonel Kollat was assigned to lead a Task Force that would train the first Thai unit to deploy to Vietnam, the “Queen’s Cobras” Regiment. LTC Kollat, the Task Force Slick Commander, selected me to become a member of the Task Force Infantry Training Committee. [loc 332] Hoa airbase on the evening of 2 September 1970. [loc 1421] Early on the morning of 21 October 1970, the 44th Ranger Battalion with its advisors pulled off the mountain identified as Nui Ba Voi on the U.S. maps."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:27:14Z"

