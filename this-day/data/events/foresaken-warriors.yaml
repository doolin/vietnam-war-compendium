- month: 1
  day: 15
  year: 1971
  title: "Operation Cuu Long 44-02 begins in Cambodia"
  body: "<p>On January 15, 1971, D-day arrived for Cuu Long 44-02, the name the South Vietnamese gave the January 1971 Cambodian operation. The 44th Ranger Battalion had been ordered to move to Hong Nhu near the Cambodian border two days earlier, on 13 January. Its American advisors stayed behind: the revised Cooper-Church amendment, enacted on 5 January 1971, forbade the use of U.S. ground troops or advisors in Cambodia.</p><p>On 17 January 1971, Cambodian forces supported by South Vietnamese Marine forces secured the strategically important Pic Nil Pass, while the Vietnamese 4th Armored Brigade cleared Route 4 as far north as Route 18, reopening Cambodia's lifeline to the sea. The 44th Ranger Battalion withdrew from Cambodia on 22 January 1971 and returned to its base camp at Cai Rang.</p>"
