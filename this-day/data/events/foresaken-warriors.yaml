- month: 1
  day: 14
  year: 1970
  title: "Camp Ba Xoai attacked in the Seven Mountains"
  body: "<p>On January 14, 1970, Camp Ba Xoai in the Delta's Seven Mountains area, near the Cambodian border, came under attack.</p><p>The book records the attack alongside the end of the U.S. Special Forces presence in the country. U.S. Special Forces officially ended their decade-long stay in Vietnam on 3 March 1971, when an honor guard boarded an aircraft at Nha Trang Airbase with the 5th Special Forces Group colors and flew home to Fort Bragg. General Abrams declined to attend the group's departure ceremony.</p>"
  photo_url: null
  photo_alt: null
  references:
