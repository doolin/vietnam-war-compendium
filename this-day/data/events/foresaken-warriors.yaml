- month: 1
  day: 13
  year: 1971
  title: "44th Ranger Battalion ordered to Hong Nhu on the Cambodian border"
  body: "<p>On January 13, 1971, the 44th Ranger Battalion was ordered to move to Hong Nhu near the Cambodian border. The move preceded the January 1971 Cambodian operation, which the South Vietnamese named Cuu Long 44-02; D-day was set for 15 January 1971.</p><p>The battalion's American advisors could not accompany it across the border. The revised Cooper-Church amendment, enacted on 5 January 1971, forbade the use of U.S. ground troops or advisors in Cambodia. The 44th Ranger Battalion withdrew from Cambodia on 22 January 1971 and returned to its base camp at Cai Rang.</p>"
