  source_text: "[loc 2920] My reporting date to the Vietnamese Airborne Division Detachment, Team 162, was 29 May 1971. [loc 3223] When I signed in at the Airborne Advisory Detachment at Tan Son Nhut Airbase, I was told that my specific assignment was Senior Advisor to the Airborne Division’s 2d Battalion. This was the battalion that defended Fire Support Base 30 during Operation Lam Son 719. [loc 3227] After linking up with the 7th Airborne Battalion, the two units fought as a rearguard during the withdrawal phase of Lam Son 719, until they were extracted by helicopter on 20 March. [loc 3665] After leaving the 2d Airborne Battalion in War Zone D on 26 September 1971,"
