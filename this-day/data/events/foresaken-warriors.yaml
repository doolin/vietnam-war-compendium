# Book: Forsaken Warriors: The Story of an American Advisor with the South Vietnamese Rangers and Airborne (Robert L. Tonsetic; Casemate, 2009)
# Highlights: /Users/daviddoolin/src/vietnam-war-compendium/kindle-highlights/foresaken-warriors.yaml
- month: 12
  day: 1
  year: 1965
  title: "ARVN Airborne Brigade expanded to division"
  body: "<p>On December 1, 1965, the Airborne Brigade was expanded to a divisional size unit and designated as the ARVN high command's general reserve.</p><p>Author Robert L. Tonsetic later served with the division. His reporting date to the Vietnamese Airborne Division Detachment, Team 162, was 29 May 1971, and when he signed in at the Airborne Advisory Detachment at Tan Son Nhut Airbase he was told his assignment was Senior Advisor to the Airborne Division's 2d Battalion. That battalion had defended Fire Support Base 30 during Operation Lam Son 719 and, after linking up with the 7th Airborne Battalion, the two units fought as a rearguard during the withdrawal phase until they were extracted by helicopter on 20 March.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Robert L. Tonsetic, Forsaken Warriors: The Story of an American Advisor with the South Vietnamese Rangers and Airborne (Casemate, 2009), Kindle locations 2920, 2942, 3223, 3227"
      url: https://openlibrary.org/works/OL27982066W
  status: approved
  source_text: "[loc 2920] My reporting date to the Vietnamese Airborne Division Detachment, Team 162, was 29 May 1971. [loc 2942] On 1 December 1965, the Airborne Brigade was expanded to a divisional size unit, and was designated as the ARVN high command’s general reserve. [loc 3223] When I signed in at the Airborne Advisory Detachment at Tan Son Nhut Airbase, I was told that my specific assignment was Senior Advisor to the Airborne Division’s 2d Battalion. This was the battalion that defended Fire Support Base 30 during Operation Lam Son 719. [loc 3227] After linking up with the 7th Airborne Battalion, the two units fought as a rearguard during the withdrawal phase of Lam Son 719, until they were extracted by helicopter on 20 March."
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:27:14Z"

- month: 7
  day: 30
  year: 1968
  title: "Mobile Riverine Force enters the U Minh Forest"
  body: "<p>On July 30, 1968, the U.S. Naval Assault Flotilla One transported troops from the 9th Infantry Division's 2d Brigade into the U Minh, taking advantage of a huge fire in the forest that spring. Except for a number of U.S. Navy SEAL missions into the forest, the 9th Infantry Division's Mobile Riverine Force was the only U.S. ground force to conduct operations in the U Minh.</p><p>Later that year, on 31 December 1968, a U.S. gunship team working in the U Minh spotted a figure in black pajamas running through a relatively open swampy area. The figure was Special Forces prisoner of war Nick Rowe.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Robert L. Tonsetic, Forsaken Warriors: The Story of an American Advisor with the South Vietnamese Rangers and Airborne (Casemate, 2009), Kindle locations 1683, 1689"
      url: https://openlibrary.org/works/OL27982066W
  status: approved
  source_text: "[loc 1683] Except for a number of U.S. Navy Seal missions into the forest, the only U.S. ground force to conduct operations in the U Minh was the 9th Infantry Division’s Mobile Riverine Force. Taking advantage of a huge fire in the spring of 1968, the U.S. Naval Assault Flotilla One transported troops from the 9th Division’s 2d Brigade into the U Minh on 30 July 1968. [loc 1689] On 31 December 1968, a U.S. gunship team working in the U Minh spotted a figure in black pajamas running through a relatively open swampy area. (Operator note: SF pow, Nick Rowe)"
  summarized_by: "Claude Fable 5.1"
  summarized_at: "2026-10-25T14:27:14Z"

