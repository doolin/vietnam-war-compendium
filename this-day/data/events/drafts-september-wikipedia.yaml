h en the last battalion in the o pe ra tion , Dietrich's, a lso departed.\" Th e ope ra tion produced 239 enem y killed by body co unt, a ll from the 18B a nd 95th Regi ments and the ind ependent 307tll PLAF Battalion. Ameri can casu alties were 27 killed a nd 169 wo und ed. ... While Phu Yen was important, the neighboring province of Binh Dinh remained the heart o f allied operations on th e II Corps coas t.\n\n[Wikipedia, 1966_in_the_Vietnam_War, rev 1380091905] Operation Seward was a harvest security operation conducted by the 1st Brigade, 101st Airborne Division in Phú Yên Province. The operation resulted in 239 PAVN/VC and 27 U.S. killed."
