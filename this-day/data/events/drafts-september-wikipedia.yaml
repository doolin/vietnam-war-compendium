- month: 9
  day: 8
  year: 1964
  title: "Generals' triumvirate installed to lead South Vietnam"
  body: "<p>On September 8, 1964, under American pressure, the Military Revolutionary Council installed a triumvirate of generals to lead South Vietnam until a civilian government could be permitted. The council was headed by Duong Van Minh and included Nguyen Khanh and Tran Thien Khiem.</p>"
