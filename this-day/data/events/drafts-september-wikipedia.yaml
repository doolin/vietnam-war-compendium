- month: 9
  day: 28
  year: 1964
  title: "Montagnard rebels release their last prisoners"
  body: "<p>On September 28, 1964, after negotiations, the last of the Montagnards in revolt released their prisoners. The revolt had broken out on September 19 near the Central Highland city of Ban Me Thuot. U.S. Special Forces soldiers had been training Montagnard soldiers under the CIDG program. U.S. Special Forces remained with the Montagnards to maintain calm, and the South Vietnamese government agreed to meet with the Montagnards to discuss their grievances.</p> <p>A few days later, a Montagnard congress demanded more autonomy for the Montagnards, including a 50,000-man Montagnard army trained by U.S. Special Forces rather than by the South Vietnamese or MAAG. MACV was displeased that the Montagnards showed more loyalty to the U.S. Special Forces than to South Vietnam.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Wikipedia, \"1964 in the Vietnam War\", revision 1370342430 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1964_in_the_Vietnam_War&oldid=1370342430"
  status: "draft"
  source_text: "[Wikipedia, 1964_in_the_Vietnam_War, rev 1370342430, September 28]\nAfter negotiations, the last of the Montagnards in revolt released their prisoners. U.S. Special Forces remained with the Montagnards to maintain calm. The South Vietnamese government agreed to meet with the Montagnards to discuss their grievances. A few days later, a Montagnard congress demanded more autonomy for the Montagnards, including a 50,000 man Montagnard army trained by U.S. Special Forces rather than South Vietnamese or the U.S. Military Advisory Assistance Group (MAAG). MACV was displeased that the Montagnard showed more loyalty to the U.S. Special Forces than to South Vietnam.\n\n[Wikipedia, 1964_in_the_Vietnam_War, rev 1370342430, September 19]\nA Montagnard revolt broke out in South Vietnam, near the Central Highland city of Ban Me Thuot. U.S. Special Forces soldiers had been training Montagnard soldiers under the CIDG program."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T18:30:00Z"
- month: 9
  day: 29
  year: 1967
  title: "Bunker dedicates new U.S. Embassy in Saigon"
  body: "<p>On September 29, 1967, U.S. Ambassador Ellsworth Bunker dedicated the new United States Embassy Chancery on Thong Nhut Boulevard in Saigon \"to the cause of peace\" and in memory of the nearly one million fighting men and more than 10,000 civilians who had served the United States in the Republic of Vietnam. Lieutenant General Nguyen Van Thieu, then Chief of State, Air Vice Marshal Nguyen Cao Ky, then Prime Minister, and Foreign Minister Tran Van Do were among the 200 guests. Deputy U.S. Ambassador Eugene M. Locke and General William C. Westmoreland stood at Bunker's side, and three U.S. Marines ran up the American flag.</p> <p>The six-story, US $2,600,000 building had been built over two years. President Lyndon B. Johnson had asked Congress for construction funds two days after the communists blew up a car loaded with explosives outside the old Chancery on March 30, 1965, killing 22. The building was sheathed in a sunscreen of 7,800 terrazzo blocks, designed to let in light and air and to act as a blast shield.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "\"US Embassy Design and Construction\", American Embassy Saigon, Marines and Civilians (saigonmac.org), pp. 1-4"
      url: "http://www.saigonmac.org/resources/Embassy+building+history.pdf"
    - label: "Wikipedia, \"1967 in the Vietnam War\", revision 1370279584 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1967_in_the_Vietnam_War&oldid=1370279584"
  status: "draft"
  source_text: "[US Embassy Design and Construction, p. 1]\nThe United States Embassy Chancery was built over a period of two\nyears by joint Vietnamese, American effort with materials from both\nVietnam and America. It stands today on Saigon's broad Thong Nhut\nBoulevard, in the words of U.S. Ambassador Ellsworth Bunker, “as a\nsymbol of our commitment to the Vietnamese people”.\nThe six-story, US $2,600,000 building was dedicated September 29, 1967,\n“to the cause of peace” and in memory of the nearly one million fighting\nmen and the more than 10,000 civilians who had served the United States\nin the Republic of Vietnam between 1954 and 1967.\n\n[US Embassy Design and Construction, p. 1]\nOn March 30, 1965, the communists blew up a car loaded with explosives\noutside the old Chancery. The explosion took 22 lives, including those of\nfour members of the U.S. Embassy staff, and injured 188. Two days later\nPresident Lyndon B. Johnson asked the U.S Congress for funds to begin\nconstruction of the new Chancery. The Congress voted its approval.\n\n[US Embassy Design and Construction, p. 2]\nFrom the first story to the roof, the\nentire building is sheathed in a protective sunscreen composed of 7,800\npolished white terrazzo blocks. Each block is 22 x 22 x 12 inches and each\nis split by two 1 x 15-inch apertures slanting inward to let in light and air\nand designed to act as a blast shield should the necessity arise.\n\n[US Embassy Design and Construction, p. 4]\nLieutenant General Nguyen Van Thieu, then Vietnam's Chief of State and\nChairman of the National Directory; Air Vice Marshal Nguyen Cao Ky,\nthen Prime Minister, and Foreign Minister Tran Van Do were among the\n200 guests attending the dedication ceremonies, At Ambassador Bunker's\nside were Deputy U. S. Ambassador Eugene M. Locke and General William\nC. Westmoreland, commander of U. S. forces in Vietnam. The simple but\nimpressive ceremony was concluded as three U.S Marines, immaculate in\ndress uniforms, ran up the American flag and a U.S. Army band struck up\n“The Star-Spangled Banner”.\n\n[Wikipedia, 1967_in_the_Vietnam_War, rev 1370279584]\nThe new U.S. Embassy opened in Saigon."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T18:30:00Z"
- month: 9
  day: 30
  year: 1968
  title: "New Jersey opens fire off the DMZ"
  body: "<p>On September 30, 1968, near the 17th Parallel, the battleship New Jersey fired her first shots in battle in over sixteen years. Firing against Communist targets in and near the Demilitarized Zone (DMZ), her big guns destroyed two gun positions and two supply areas. The next day she fired against targets north of the DMZ and rescued the crew of a spotting plane forced down at sea by antiaircraft fire.</p> <p>New Jersey had recommissioned at Philadelphia Naval Shipyard on April 6, 1968, Captain J. Edward Snyder in command, tailored for use as a heavy bombardment ship whose 16-inch guns were expected to reach targets in Vietnam inaccessible to smaller naval guns. Then the world's only active battleship, she touched at Pearl Harbor and Subic Bay before sailing on September 25 for her first tour of gunfire support duty along the Vietnamese coast. In her first two months on the gun line she directed nearly ten thousand rounds at Communist targets, over 3,000 of them 16-inch projectiles.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Naval History and Heritage Command, \"New Jersey II (BB-62)\", Dictionary of American Naval Fighting Ships, 2015"
      url: "https://www.history.navy.mil/research/histories/ship-histories/danfs/n/new-jersey-ii.html"
