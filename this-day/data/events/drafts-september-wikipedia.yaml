- month: 9
  day: 25
  year: 1968
  title: "CIDG defenders repulse sapper assault on Katum"
  body: "<p>On September 25, 1968, the 5th VC Sapper Battalion assaulted the SF CIDG camp at Katum in Tay Ninh Province. Just before 0300H the camp was hit by a rocket and mortar barrage, with over 100 RPGs fired into identified CIDG positions. Half an hour later the battalion attacked. Within 15 minutes the northwestern star point fell as VC flamethrowers and satchel charges were used to tear down bunkers. The camp's 105mm howitzers fired at point-blank range into the VC, and a prompt CIDG counterattack routed the remaining VC, ending the threat to Katum.</p> <p>The same battalion had assaulted the camp on August 18 in a battle that raged for ten hours, and through September the camp was subjected to constant artillery and rocket bombardment. Casualties were 14 CIDG and one civilian killed and 17 CIDG wounded; NVA losses were 61 confirmed dead plus 10 prisoners.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Vietnam Helicopter Pilots Association, \"Battle for Katum information for A-322 SF DET\", vhpa.org (citing Green Berets at War, p. 202)"
      url: "http://www.vhpa.org/KIA/panel/battle/68081820.HTM"
    - label: "Wikipedia, \"1968 in the Vietnam War\", revision 1370342410 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1968_in_the_Vietnam_War&oldid=1370342410"
  status: "draft"
  source_text: "[VHPA, Battle for Katum information for A-322 SF DET]\nFrom date 680818 to 680925\nA-322 SF DET was a US Army unit\nTay Ninh Province, III Corps, South Vietnam\nLocation, Katum SF Camp\nDescription: The 5th VC Sapper Battalion rocketed and then assaulted the SF CIDG camp. The VC, dressed in black shorts and camouflaged tunics, used automatic rifles, hand-held rocket launchers, and gas grenades as the penetrated the outer berm but were forced to retreat by overwhelming defensive firepower. They regrouped and surged forward again. The battle on the 18th raged for ten hours before the VC were defeated. Camp Katum was pounded by 82mm mortar shelling and 122mm rockets throughout the following week. During one ten-minute period, over 150 mortar rounds hit the compound. Initially the camp was reinforced by the 1st Battalion, 3d Mobile Strike Force. During the latter part of August and all through September, the camp was subjected to constant artillery and rocket bombardment. Just before 0300H on 25 September, the camp was blistered by a savage rocket and mortar barrage, with over 100 RPGs fired into identified CIDG positions. Half an hour later the 5th VC Sapper Battalion made another determined assault. Within 15 minutes the northwestern star point fell as VC flamethrowers and satchel charges were used to tear down bunkers. The camp's 105mm howitzers fired cannister charges at point-blank range into the VC. A prompt CIDG counterattack routed the remaining VC and the threat to Katum was ended. Casualties were KIA: 14 CIDG, 1 civilian; WIA: 17 CIDG and NVA loses were 61 confirmed dead plus 10 prisoners.\nThe source for this information was Green Berets at War P: 202\n\n[Wikipedia, 1968_in_the_Vietnam_War, rev 1370342410]\nThe VC attacked Katum Camp but the attack was repulsed at a cost of 14 CIDG killed and 61 VC killed and 10 captured."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T18:30:00Z"
- month: 9
  day: 27
  year: 1964
  title: "High National Council elects Sửu chairman"
  body: "<p>On September 27, 1964, the High National Council elected Phan Khắc Sửu as its chairman and Tran Van Huong as Prime Minister. The job of the council was to draft a new constitution.</p> <p>The U.S. had urged the creation of the council to reduce the visibility of the South Vietnamese military in the government. In the months ahead, Prime Minister Huong repressed Buddhist demonstrations.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Wikipedia, \"1964 in the Vietnam War\", revision 1370342430 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1964_in_the_Vietnam_War&oldid=1370342430"
  status: "draft"
  source_text: "[Wikipedia, 1964_in_the_Vietnam_War, rev 1370342430]\nThe High National Council elected Phan Khắc Sửu as its chairman and Tran Van Huong as Prime Minister. The job of the council was to draft a new constitution. The U.S. had urged the creation of the council to reduce the visibility of the South Vietnamese military in the government. Prime Minister Huong repressed Buddhist demonstrations in the months ahead."
  summarized_by: "Claude Opus 5.5"
