- month: 9
  day: 9
  year: 1972
  title: "DeBellevue scores fifth and sixth MIG kills"
  body: "<p>On September 9, 1972, during Linebacker strikes, a flight of four F-4D's on MIGCAP west of Hanoi shot down three MIG's. Capt. Calvin B. Tibbett and 1st Lt. William S. Hargrove in aircraft 3 destroyed the first, a MIG-21, with the 20-mm cannon after their AIM-9 missiles appeared not to guide.</p>\n<p>As the flight turned to withdraw, two MIG-19's attacked. Flight leader Capt. John A. Madden, Jr., and his WSO, Capt. Charles DeBellevue, fired an AIM-9 that struck the tail of one MIG-19, which spiraled down and hit the ground. Later investigation showed they were also the only aircrew to shoot at a MIG-19 that crashed and burned on the runway at Phuc Yen that day.</p>\n<p>The victories were Madden's first and second and DeBellevue's fifth and sixth, making him the leading MIG destroyer of the war. No one later matched his score. Captains Daleky and Murphy, in number 4 position, were hit by antiaircraft fire on the way out and were rescued from northern Laos.</p>"
  photo_url: null
  photo_alt: null
  references:
