- month: 9
  day: 3
  year: 1966
  title: "Mortar attack damages 77 helicopters at Camp Radcliff"
  body: "<p>On September 3, 1966, Camp Radcliff was mortared at night. At 2150 hours the first of 119 82mm mortar rounds started falling on and around the Golf Course heliport. The firing continued for about five minutes. Division Artillery fired the planned countermortar program and a total of 2,810 rounds.</p>\n<p>A small reconnaissance patrol outside the camp briefly contacted what was considered to have been the withdrawing enemy force, estimated at one platoon, and pursued it with mortar and artillery fire. A company of the 2d Battalion, 5th Cavalry landed by air assault that night but could not gain contact. The search continued for 48 hours. It found four 82mm mortar base plate impressions just outside the barrier wire northwest of the camp, but not the enemy force.</p>\n<p>Personnel casualties totaled four killed and 76 wounded. Seventy-seven helicopters were damaged, one by a direct hit.</p>"
