  photo_alt: null
  references:
    - label: "Wheeler, \"Paper Prepared by the Chairman of the Joint Chiefs of Staff (Wheeler)\", Foreign Relations of the United States, 1964-1968, Volume VII, Document 10, Office of the Historian, U.S. Department of State, 1968, pp. 27-30"
      url: "https://history.state.gov/historicaldocuments/frus1964-68v07/d10"
    - label: "Wikipedia, \"1968 in the Vietnam War\", revision 1370342410 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1968_in_the_Vietnam_War&oldid=1370342410"
  status: "draft"
  source_text: "[FRUS 1964-1968, Vol. VII, Document 10, pp. 27-30] 10. Paper Prepared by the Chairman of the Joint Chiefs of Staff ( Wheeler ) Washington , September 11, 1968 . CESSATION OF OFFENSIVE ACTIONS AND NVN\n1. It has been proposed that, in the near future, the President would make a nationally-televised speech in which he would state: a. Effective one week later, he was directing the cessation of all offensive actions against NVN . b. He assumed that the DRV would refrain from certain military actions and would, within 2-3 days after the cessation of US operations against NVN , engage in fruitful discussions leading to a just and honorable peace. (See para 2 below for a hard-core listing of these actions.) c. He assumed also that, during the intervening week, if the DRV found his assumptions unacceptable, they would so state. He would construe silence on their part to indicate consent.\n... b. The North Vietnamese do not have to say anything; they need only to refrain from doing certain things.\n... Comment : I am informed that there are ample and sound legal precedents for construing silence as consent. However, it is not clear to me that this is necessarily true in international law and, even if it is, there is no court to so construe, find, and take corrective action.\n... Free of all military pressure against NVN , they could (and, I believe, would) settle down for protracted negotiations (with us—not the GVN ), fully expectant that US war-weariness would prevent us from insisting on GVN participation, inevitably produce further concessions, and ultimately give them a Paris-type victory.\n... However, I am convinced that once we cease our offensive against NVN , the chances of resumption are most remote.\n... a. I know that it is militarily wrong to make concessions from a position of strength to an enemy showing signs of increasing strain and weakness; and b. On balance, I believe such a course to be equally unsound politically.\nWheeler\n[Source note] An attached note dated September 11 reads: “ Clark —Some days ago you asked me to think over an idea of yours relative to a cessation of bombing north of 17!. I have done so. The attached paper, which I wrote personally, sets forth the doubts & problems it raises for me. Bus.” Another attached note to Clifford from his military aide Robert Pursely dated October 17 reads: “Mr. Clifford : You handed the attached paper to Mr. Warnke some time ago. He now returns it, with the comment that he feels no action is indicated at this time. REP”\n\n[Wikipedia, 1968_in_the_Vietnam_War, rev 1370342410] Chairman of the Joint Chiefs of Staff General Wheeler advised President Johnson not to halt bombing of North Vietnam."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T18:30:00Z"
- month: 9
  day: 12
  year: 1972
  title: "388th TFW crews down three MIG-21's"
  body: "<p>On September 12, 1972, aircrews of the 388th TFW downed three MIG-21's. Two fell to a flight of four F-4E's escorting chaff flights northeast of Hanoi, near Kep airfield, after three or four MIG's attacked one of the chaff flights. Lt. Col. Lyle L. Beckers and 1st Lt. Thomas M. Griffin hit one MIG-21 with an AIM-9 and gunfire and last saw it in a steep descent, burning. Before they drove it off, its Atoll missile destroyed one of the chaff aircraft. Maj. Gary L. Retterbush and 1st Lt. Daniel L. Autrey downed another with about 350 rounds of 20-mm cannon after their missiles missed or failed to guide.</p>\n<p>Later in the day another 388th TFW flight was escorting a strike against the Tuan Quan railroad bridge when two MIG-21's attacked. Capt. Michael J. Mahaffey and 1st Lt. George I. Shields fired one AIM-9 that hit a MIG in the tail section. It was last seen in a spin about 20 nautical miles southwest of Yen Bai airfield.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Futrell, \"United States Air Force in Southeast Asia 1965-1973: Aces and Aerial Victories\", Air University, Headquarters USAF, 1976, pp. 105-106"
      url: "https://media.defense.gov/2010/Sep/21/2001329821/-1/-1/0/AFD-100921-010.pdf"
    - label: "Wikipedia, \"1972 in the Vietnam War\", revision 1372115736 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1972_in_the_Vietnam_War&oldid=1372115736"
  status: "draft"
  source_text: "[Futrell, Aces and Aerial Victories, p. 105] The events of the 9th were reenacted 3 days later when aircrews of the 388th TFW downed three MIG-21’s. Two were destroyed by aircrews in a flight of four F-4E’s escorting chaff flights northeast of Hanoi, in the vicinity of Kep airfield. Three or four MIG’s came in from 4 to 6 o’clock and attacked one of the chaff flights as it approached the target area. The lead F-4, crewed by Lt. Col. Lyle L. Beckers and 1st Lt. Thomas M. Griffin, observed a MIG aligning itself to the rear of the chaff flight from which point he could launch a missile. According to Becker’s account: I obtained an auto-acquisition lock-on and attempted to fire two AIM-7 missiles. The MIG-21 fired an Atoll missile at the chaff flight and broke straight down. I pursued and fired two AIM-9 missil&, one of which impacted the MIG’s left wing. Flames and smoke were observed coming from the left wing. I then selected guns and proceeded to fire 520 rounds of HEVtracer. Projectile impacts and additional fire were observed on the fuselage of the MIG. The MIG-21 was last observed in a steep descent, burning. An Atoll missile from the MIG, however, found its mark and destroyed one of the chaff aircraft before Beckers and his WSO could drive him off. Meanwhile, Maj. Gary L. Retterbush with 1st Lt. Daniel L. Autrey in the back seat of aircraft 2 attacked another MIG-2 1. “We turned into the MIG’s and accomplished a radar lock-on,’’ Retterbush reported. “Two AIM-7’s were fired but did not guide. Three AIM-9’s were fired, but missed by a matter of feet. We then closed on and downed a MIG-21 with 20-mm cannon, firing approximately 350 rounds.\n... Later in the day another F-4* flight from the 388th TFW escorted a strike flight in an attack against the Tuan Quan railroad bridge when two MIG-21’s attacked.\n\n[Futrell, Aces and Aerial Victories, p. 106] The number 2 aircraft, piloted by Capt. Michael J. Mahaffey, with 1st Lt. George I. Shields in the rear seat, had better luck with its ordnance during the engagement. As the flight leader was chasing the first MIG, a second MIG-21 dropped between the two F-4’s. ... We rolled right, tracked, and fired one AIM-9 which guided and impacted the MIG in the tail section, blowing off parts of the aircraft. The MIG went into a spin from 16,000 feet and more pieces fell off the aircraft. It was last seen in a spin below 8,000 feet, about 20 nautical miles southwest of Yen Bai airfield.\n\n[Wikipedia, 1972_in_the_Vietnam_War, rev 1372115736] USAF jets shot down three VPAF MiG-21s."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T18:30:00Z"
- month: 9
  day: 13
  year: 1966
  title: "1st Cavalry Division opens Operation THAYER I"
  body: "<p>On September 13, 1966, the 1st Cavalry Division began Operation THAYER I in northern Binh Dinh, after two days of B-52 strikes on suspected enemy concentrations near the Kim Son Valley. Early that morning two battalions of Col. Archie K. Hyle's 1st Brigade, the 1st Battalion, 12th Cavalry, and the 2d Battalion, 8th Cavalry, landed by helicopter unopposed south and southeast of the valley. Two battalions of Colonel Berenzweig's 2d Brigade, the 1st Battalion, 5th Cavalry, and the 2d Battalion, 12th Cavalry, landed to the north and northwest. Rain and mud delayed a fifth battalion, but all units were in place by the end of the next day.</p>\n<p>General Norton's plan called for uprooting enemy base areas in the valley. As they advanced, the Americans found caches of weapons and food, a hospital, an antipersonnel munitions factory, and bunkers, yet few enemy to fight. THAYER I ran until 1 October.</p>"
