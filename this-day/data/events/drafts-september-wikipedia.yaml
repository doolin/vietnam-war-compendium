- month: 9
  day: 15
  year: 1966
  title: "Marines land south of the DMZ in Deckhouse IV"
  body: "<p>On September 15, 1966, BLT 1/26, the Special Landing Force battalion under Lieutenant Colonel Anthony A. Monti, landed in the Con Thien-Gio Linh area to open Operation Deckhouse IV. At 0700 the first wave of Company A, in 11 LVTs from the USS Vancouver, secured Blue Beach, two miles south of the DMZ, without resistance. Forty minutes later the first heliborne elements landed from the Iwo Jima, again without opposition.</p>\n<p>At 1330 a platoon of the 3d Reconnaissance Battalion, attached to the BLT, ran into an NVA company five miles northeast of Dong Ha. Ground fire hit five helicopters sent to evacuate the outnumbered Marines. After the BLT's 107mm howtar battery and four F4Bs from MAG-11 struck the enemy, a second attempt extracted the patrol, which had one killed, six wounded, and one Marine unaccounted for.</p>\n<p>Deckhouse IV officially ended on 18 September, though the battalion stayed ashore until 24 September. In that time it killed at least 200 of the enemy at a cost of 203 casualties, including 36 killed.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Shulimson, \"U.S. Marines in Vietnam: An Expanding War 1966\", History and Museums Division, Headquarters, U.S. Marine Corps, 1982, pp. 188-189"
      url: "https://www.usmcu.edu/Portals/218/US%20Marines%20in%20Vietnam%20An%20Expanding%20War%201966%20%20PCN%2019000308600.pdf"
    - label: "Wikipedia, \"1966 in the Vietnam War\", revision 1380091905 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1966_in_the_Vietnam_War&oldid=1380091905"
  status: "draft"
  source_text: "[Shulimson, An Expanding War 1966, p. 188] On 3 September, he requested that Genera l Westmoreland obtain permission from the Seventh Fleet to use the Special Landing Force in the Co n Thien-Gio Linh area . 32 After General Westmorelan d acceded to the III MAF request, General Walt held a planning conference on 7 September at Da Nang , attended by representatives of the amphibious ready group and the SLF to work out the details . At tha t time, they changed D-day from 12 September to th e 15th . In effect, the SLF operation, Deckhouse IV,\n\n[Shulimson, An Expanding War 1966, p. 188] The operational concept provided for one company of BLT 1/26 (Lieutenant Colonel Anthony A . Monti) to land across Blue Beach, two miles south o f the DMZ, north of the Cua Viet River . Lieutenan t Colonel James D . McGough's HMM-363 was t o bring the other companies into landing zones further inland, west of Highway 1 . After the beachhea d was secured and the artillery unloaded, Company A was to join the rest of the battalion west of th e highway, six miles inland . The assault phase went almost without incident . At 0700 15 September, the first wave of Company A in 11 LVTs from the USS Vancouver (LPD 2) secure d Blue Beach without resistance . Forty minutes later , the first heliborne elements landed from the Iw o Jima (LPH 2) ; again no opposition . Later that day , HMM-363 lifted Company A and the artillery battery from the beach area to positions west of Route 1 , where they joined the rest of the battalion . Early that afternoon, the Marines experienced th e first serious contact with the NVA . At 1330, a platoon from the 3d Reconnaissance Battalion, attache d to the BLT for the operation, encountered a NV A company five miles northeast of Dong Ha while reconnoitering the southwestern portion of the objective area . The well-camouflaged NVA soldiers were moving down a trail in single file, and almos t bumped into the Marines . Both units opened fir e simultaneously . The reconnaissance Marines, vastl y outnumbered, called for help . Marine helicopters arrived to attempt an evacuation, but heavy groun d fire prevented them from landing . Five helicopters were hit and two crewmen were wounded in the abortive attempt . At this point, the Marines on the ground calle d for supporting arms . The 107mm howtar battery attached to BLT 1/26 pounded the area with continuous fire and four F4Bs from MAG-11 bombed ,\n\n[Shulimson, An Expanding War 1966, p. 188, footnote] On 5 August, BLT 1/26, which had sailed in new shipping from Sa n Diego, was designated the SLF battalion .\n\n[Shulimson, An Expanding War 1966, p. 189] strafed, and rocketed the enemy positions, allowing the helicopters to make a second attempt to extrac t the patrol . This time the extraction proceede d smoothly . During the two-hour engagement, the Marin e patrol suffered one killed, six wounded, and on e Marine unaccounted for .\n\n[Shulimson, An Expanding War 1966, p. 189] Althoug h Deckhouse IV officially ended on 18 September, th e battalion remained ashore and came under th e operational control of the 4th Marines until 2 4 September . The next day, the 25th, the battalio n reverted to its SLF role and left the DMZ sector . During the period the battalion was committed to operations ashore, it killed at least 200 of the enemy at a cost of 203 casualties including 36 killed .\n\n[Wikipedia, 1966_in_the_Vietnam_War, rev 1380091905] Operation Deckhouse IV was an operation conducted by the Special Landing Force (SLF) Battalion Landing Team (BLT) of 1st Battalion, 26th Marine Regiment in the eastern DMZ. The operation resulted in 200+ PAVN and 36 Marines killed."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T18:30:00Z"
- month: 9
  day: 16
  year: 1972
  title: "NVA regiment attacks Mo Duc District headquarters"
  body: "<p>On September 16, 1972, Mo Duc District headquarters in Quang Ngai Province came under heavy pressure from the 1st Regiment, 2d NVA Division, with mortar and rocket attacks followed by ground attacks. An American advisor was among the killed. Over 100 enemy were killed, and the defense held.</p>\n<p>The assault came a day after a 30-round mortar attack against Mo Duc that marked the beginning of the 2d NVA Division offensive in the province. Territorial reinforcements from the north met an enemy roadblock near the Song Ve bridge and did not reach Mo Duc. Landing Zone Dragon, just south of the town, fell into enemy hands by late afternoon.</p>\n<p>The following day enemy pressure on Mo Duc increased, and the 52d Regiment began attacking Ba To. American and VNAF gunships supported the defenders as bad weather hampered tactical air operations.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "United States Military Assistance Command, Vietnam, \"1972-3 Command History\", MACV, 15 July 1973, pp. 81-83"
      url: "https://vva.vietnam.ttu.edu/images.php?img=/images/1683/168300010830.pdf"
    - label: "Wikipedia, \"1972 in the Vietnam War\", revision 1372115736 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1972_in_the_Vietnam_War&oldid=1372115736"
  status: "draft"
  source_text: "[MACV, 1972-3 Command History, p. 81] An exceptio n to this was a 30-roun d mortar attack against Mo Duc on 15 Septem ber, which marked the beginni ng of the 2d NVA Division offensiv e in Quang Ngai Provinc e. (C) On 16 Septem ber Mo Duc District headqu arters came under heavy pressur e from the 1st Regiment, 2d NV A Division , with mortar and rocket attacks , followe d by ground attacks. An Americ an advisor was among the killed. Over 100 enemy were killed, and the defense held. Territo rial reinforceme nts from the north encount ered an enemy roadblo ck near the Song Ve bridge and did not reach Mo Duc. Landing Zone Dragon , just south of\n\n[MACV, 1972-3 Command History, p. 83] the town, fell into enemy hands by late afternoon. The following day enemy pressure increased at Mo Due and began at Due Pho from the 141st Regiment, 2d Division, and Ba To from the 52d Regiment. Bridges along Highway 1 were blown, and the enemy strongpoint near the Song Ve remained. American and VNAF gunships supported the defenders and were credited with inflicting heavy casualties as bad weather hampered tactical air operations.\n\n[Wikipedia, 1972_in_the_Vietnam_War, rev 1372115736] The PAVN attacked seven locations in Quảng Ngãi province with the 1st Regiment, 2nd Division attacking Mộ Đức District with mortars and rockets followed by a ground attack. The attack was repulsed with the loss of one U.S. adviser, 70 ARVN and over 600 PAVN killed."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T18:30:00Z"
- month: 9
  day: 19
  year: 1967
  title: "503rd Infantry begins Operation Bolling in Phú Yên"
  body: "<p>On September 19, 1967, the 503rd Infantry Regiment began Operation Bolling, a search and destroy and security operation in Phú Yên Province. The operation resulted in 683 PAVN killed and 59 captured, and 67 U.S. killed.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Wikipedia, \"1967 in the Vietnam War\", revision 1370279584 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1967_in_the_Vietnam_War&oldid=1370279584"
  status: "draft"
  source_text: "[Wikipedia, 1967_in_the_Vietnam_War, rev 1370279584] Operation Bolling was a search and destroy and security operation conducted by the 503rd Infantry Regiment in Phú Yên Province. The operation resulted in 683 PAVN killed and 59 captured and 67 U.S. killed."
