- month: 9
  day: 5
  year: 1966
  title: "Operation SEWARD opens around Tuy Hoa"
  body: "<p>On September 5, 1966, Operation SEWARD began early in the morning in Phu Yen. General Pearson used the same maneuver battalions that had carried out JOHN PAUL JONES. He placed Wasco's 2d of the 327th Infantry north of Tuy An and a company of Collins' 1st of the 327th Infantry in the Hieu Xuong Valley southwest of Tuy Hoa. Morley's 1st of the 22d Infantry was to secure the area between Vung Ro Bay and Tuy Hoa, and Dietrich's 2d of the 502d Infantry was to serve as a rapid-reaction force.</p>\n<p>The first eleven days brought small encounters. On September 17 a hundred or so insurgents assaulted Company B of the 2d of the 327th Infantry in a driving rain, killing 10 Americans, including the company commander.</p>\n<p>SEWARD ended at midnight on September 25. It produced 239 enemy killed by body count; American casualties were 27 killed and 169 wounded. By the third week in October the farmers around Tuy Hoa had harvested almost 90 percent of their rice crop with little enemy interference.</p>"
