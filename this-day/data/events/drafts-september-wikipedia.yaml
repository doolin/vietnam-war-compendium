  status: "draft"
  source_text: "[Carland, Stemming the Tide, p. 256] Larsen and the 1st Cavalry Division 's co mmander, Gen eral Norton , were already planning for jus t s uch a progra m\n\n[Carland, Stemming the Tide, p. 256, n. 16] 16 The Binh Dinh pa Cification campa ig n incl ud e d Ope ra tions TH AYH I ( 13 Sep tembe r- 1 Oc tober 1966), I RV ING (2-24 Oc tobe r 1966), TH ,W ER II (25 Octobe r 1966- 12 Feb ru ary 1967), and PERSI\"UNG (11 Februa ry 1967-21 Ja nuary 1968).\n\n[Carland, Stemming the Tide, p. 257] On 8 September Gen era l Norto n put hi s pl al1s into moti o n by iss uing OPLAN 23-66. It ca lled for di vis ion e le me nts to d epl oy into no rthern Binh Dinh to uproo t ene m y base a reas in th e Kim Son Va ll ey.\n\n[Carland, Stemming the Tide, p. 257] Preced ed by two d ays of B-52 s trikes on s uspected en em y concentrations nea r the Kim Son Valley, THAYER I began on 13 September. Early in the m o rning two ba ttalions fro m Col. Archie K. H yle's 1s t Bri gad e- Lt. Col. James T. Root's 1st Battalion, 12th Cava lry, and Co lon el Tackaberry's 2d Batta lion , 8th Cava lry-h elicoptered un opposed to land in g zon es so uth a nd so utheast of the va ll ey. At the same tlm e, two battalion s from Colo nel Be renzweig's 2d Briga d e-Lt. Col. Robert H . Siegris t'S 1s t Ba ttalion , 5th Ca valry, a nd Lt. Co l. Jay A. H a tch 's 2d Ba ttalion, 12th Cava lrylanded to the n orth and n orthwes t. Rain and mud d elayed the m ovem ent of a fifth ba ttalion, Lt. Col. William C. Lo uisell's 1s t Ba ttalion, 8th Cavalry, belo nging to Colo ne l H yle's bri ga d e, but a ll units were in place by the end of th e following day.\n\n[Carland, Stemming the Tide, p. 259] As they advanced, th e Americans enco untered sm all groups of en emy soldiers and found caches of weapons and food, a hospital, an antipersonnel munitions factory, a nd bunkers. Most were located on the eastern and so uthern slopes of the hills in the 1st Brigade's zone. Clearly, the 3d Division. maintained s ubs tantial bases in the a rea, yet no main force units were there. Although the Americans scoured the va lley's floor and searched a long likely escape routes, they found few enemy to fight.\n\n[Wikipedia, 1966_in_the_Vietnam_War, rev 1380091905] Operations Thayer, Irving and Thayer II were related operations carried out primarily by the 1st Cavalry Division, with support by the ARVN 22nd Division and the ROKA Capital Division, to eliminate PAVN/VC influence in Bình Định Province. The operations resulted in 2,669 PAVN/VC and 296 U.S. killed."
