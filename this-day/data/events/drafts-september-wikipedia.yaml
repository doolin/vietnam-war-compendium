- month: 9
  day: 22
  year: 1973
  title: "NVA 26th Regiment overruns Ranger camp at Plei Djereng"
  body: "<p>On September 22, 1973, the NVA 26th Regiment attacked Le Minh, the ARVN camp at Plei Djereng held by the 80th Ranger Border Defense Battalion. The camp sat astride Route 613, blocking free movement out of the Communist-controlled Plei Trap Valley. An NVA master sergeant who turned himself in on 16 September had warned of the attack, and that day only one company was inside the perimeter; the other two were patrolling outside the wire.</p>\n<p>About noon the regiment opened its assault with a heavy artillery bombardment of guns, mortars, and rockets, accompanied by T-54 tanks. Radio contact with the camp was lost, and the battalion commander was mortally wounded. Rain and poor visibility prevented VNAF support, and the corps commander attempted no reinforcement. Of 293 men in the battalion when the battle began, 200 were killed or captured.</p>\n<p>Rangers reported seeing 6 T-54 tanks; two days later VNAF pilots counted 10 and destroyed 3. President Thieu harshly rebuked the corps commander, Maj. Gen. Nguyen Van Toan, for not reacting to the advance warning.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Le Gro, \"Vietnam from Cease-Fire to Capitulation\", U.S. Army Center of Military History, 1985, pp. 54-55"
      url: "https://history.army.mil/html/books/090/90-29/CMH_Pub_90-29.pdf"
    - label: "Wikipedia, \"1973 in the Vietnam War\", revision 1380647415 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1973_in_the_Vietnam_War&oldid=1380647415"
  status: "draft"
  source_text: "[Le Gro, Vietnam from Cease-Fire to Capitulation, p. 54] Plei Djereng-Le Minh One of the few impediments to the steady projection of the NV A 's logistical corrido r down the length of the western highlands of South Vietnam was all ARVN camp at Plei Djereng, called Le Minh, manned by the BOth Ranger Border Defense Battalion. The position, situated astride Route 613 and blocking free movement from Communist·controlled Plei Trap Valley into the NVA logistical base at Quc Co and east to Pleiku, was an obvious enemy objective. (Map 9) There was ample warning of an impending attack. A master sergeant from an NV A reconnaissance company turned himself in to Thanh An District. P!eiku, on 16 September and said that the NVA 26th Regiment of the B3 Front would attack Plei Djereng before the end of September. Considerable reliance was attached to the master sergeant's reporl because his knowledge of the 26t h Regiment's order of battle confirmed other information previously collected. Armed with this intelligence, the battalion commander at Le Minh intensified his security operations around the camp. On 22 September. only one company was inside the camp perimeter together with several families belonging to the battalion; the other two were patrolling ou tside the wire, although they did not range far from the camp. About\n\n[Le Gro, Vietnam from Cease-Fire to Capitulation, p. 55; two-column OCR interleaved, fragments of the left column in order] noon the 26th NVA Regiment began an assault ... employing a heavy artillery bombardment including ... 122-mm. and 1300mm. guns, mortars, and rockets ... and accompanied by T -54 tanks. As the ballie raged ... through the afternoon. radio contact with the camp ... was lost, and the ballalion commander was mortally ... wounded. Rain and poor visibility prevented ... VNAF support. No reinforcement was attempted ... by the corps commander, ... Rangers reported seeing 6 T-54 tanks, while VNAF ... pilots after the attack counted 10 and destroyed 3. ... Out this was two days later; rain and poor visibility ... prevented the VNAF from providing support ... during the attack. Of 293 men in the 80th Ranger ... Border Defense Battalion when the baule began, ... 200 were killed or captured in this short, violent ... action. ... Until the attack on Le Minh, the corps command ... er, Maj. Gen. Nguyen Van Toan. ... President Thieu, visiting Pleiku ... harshly rebuked Gen- ... eral Toan for not reacting to the advance warning ... of the attack ... immediately proposed a plan to retake Le Minh.\n\n[Wikipedia, 1973_in_the_Vietnam_War, rev 1380647415] The PAVN 26th Regiment, 320th Division supported by artillery and tanks captured Plei Djereng Camp in the Central Highlands. 200 of the 293 Rangers at the camp were killed or captured during the battle. PAVN casualties are not known but the RVNAF claimed three T-54 tanks destroyed during the battle"
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T18:30:00Z"
- month: 9
  day: 23
  year: 1973
  title: "Kissinger takes office as Secretary of State"
  body: "<p>On September 23, 1973, Henry A. Kissinger began serving as Secretary of State. President Richard M. Nixon had appointed him on September 21. With the appointment he became the first person ever to serve as both Secretary of State and National Security Adviser, a position he had held since Nixon was sworn into office on January 20, 1969.</p>\n<p>Born Heinz Alfred Kissinger in Germany, he had immigrated to the United States with his family in 1938, served in the U.S. Army as a German interpreter during World War II, and joined the Harvard faculty before President-elect Nixon chose him as National Security Adviser in 1968. He entered the State Department two weeks before Egypt and Syria launched a surprise attack on Israel, and served as Secretary until January 20, 1977.</p>"
  photo_url: null
  photo_alt: null
  references:
    - label: "Office of the Historian, U.S. Department of State, \"Henry A. (Heinz Alfred) Kissinger\", Biographies of the Secretaries of State, history.state.gov"
      url: "https://history.state.gov/departmenthistory/people/kissinger-henry-a"
    - label: "Wikipedia, \"1973 in the Vietnam War\", revision 1380647415 (CC BY-SA 4.0)"
      url: "https://en.wikipedia.org/w/index.php?title=1973_in_the_Vietnam_War&oldid=1380647415"
  status: "draft"
  source_text: "[Office of the Historian, Biographies of the Secretaries of State: Henry A. (Heinz Alfred) Kissinger, Introduction] Henry Alfred Kissinger was appointed Secretary of State on September 21 by President Richard M. Nixon and served in the position from September 23, 1973 to January 20, 1977. With his appointment, he became the first person ever to serve as both Secretary of State and National Security Adviser, a position he had held since President Nixon was sworn into office on January 20, 1969.\n\n[Office of the Historian, Kissinger, Rise to Prominence] Kissinger was born as Heinz Alfred Kissinger in Germany. After the Nazis seized power, state sanctioned anti-Semitism made life for the Kissinger family, which was Jewish, very difficult. In 1938, Kissinger’s family immigrated to the United States and settled in New York, and Kissinger’s name was changed to Henry. During World War II, Kissinger became a naturalized citizen and served in the U.S. Army as a German interpreter. After the war, he attended Harvard University, earning a B.A. in 1950 and a Ph.D. in 1954. He stayed at Harvard to join the faculty and in 1957 he became the Associate Director of Harvard’s Department of Government and Center for International Affairs. ... In 1968, President-elect Richard Nixon chose Kissinger to be his National Security Adviser.\n\n[Office of the Historian, Kissinger, Influence on American Diplomacy] Kissinger entered the State Department just two weeks before Egypt and Syria launched a surprise attack on Israel.\n\n[Office of the Historian, Kissinger, From Principal Officers and Chiefs of Mission] Appointed: September 21, 1973 Entry on Duty: September 22, 1973 Termination of Appointment: January 20, 1977\n\n[Wikipedia, 1973_in_the_Vietnam_War, rev 1380647415] Henry Kissinger became United States Secretary of State replacing William P. Rogers."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T18:30:00Z"
- month: 9
  day: 24
  year: 1969
  title: "Mine kills 12 bus passengers on Highway 1"
  body: "<p>On September 24, 1969, a bus hit a mine on Highway 1, north of Duc Tho, Quang Ngai province. Twelve passengers were killed.</p>"
