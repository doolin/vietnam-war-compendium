  status: "draft"
  source_text: "[Futrell, Aces and Aerial Victories, pp. 103-104] During Linebacker strikes on 9 September, a flight of four F-4D’s on MIGCAP west of Hanoi shot down three MIG’s. Two were MIG-19’s downed by flight leader Capt. John A. Madden, Jr., and his WSO, Capt. Charles DeBellevue. For Madden, the victories constituted his first and second MIG kills, but for DeBellevue they were numbers five and six, moving him up as the leading MIG destroyer of the war. Before their MIG victories, however, Capt. Calvin B. Tibbett and 1st Lt. William S. Hargrove in aircraft 3 destroyed a MIG-21.\n... ment carefully and saw that the two AIM-7 missiles fired by Madden did not guide. Madden then cleared us to fire, since we were in a good position for an AIM-9 attack. We fired two AIM-9 missiles which appeared not to guide, closed to gun range, and fired the 20-mm cannon. The MIG-21 sustained numerous hits along the fuselage and left wing. The MIG pilot ejected, and the aircraft started a gentle roll and nosedown attitude toward the ground.\nAs the flight made a turn to withdraw, two MIG19’s swarmed in for an attack. DeBellevue describes the next two engagements:\n... We fired one AIM-9 missile, which detonated 25 feet from one of the ME-19’s. We then switched the attack to the other MIG-19 and one turn later we fired an AIM-9 at him. I observed the missile impact the tail of the MIG. The MIG continued normally for the next few seconds, then began a slow roll and spiraled downward, impacting the ground with a large\n\n[Futrell, Aces and Aerial Victories, pp. 104-105] fireball. Our altitude was approximately 1,500 feet at the moment of the MIG’s impact. Madden and DeBellevue returned to their base, thinking they had destroyed only the second MIG19. Only later did investigation reveal that they were the only aircrew to shoot at a MIG-19 which crashed and burned on the runway at Phuc Yen that day. Captains Daleky and Murphy, in number 4 position, were hit by antiaircraft fire as the flight left the battle area and headed back for Udorn. They were soon rescued from northern Laos, over which they were forced to bail out. ... Even without the extra kill, Captain DeBellewe was the Air Force’s second ace of the war. As events would later demonstrate, he emerged as the leading MIG-killer of the conflict, for no one later matched his score.\n\n[Wikipedia, 1972_in_the_Vietnam_War, rev 1372115736] USAF Captain Charles B. DeBellevue became the last and highest scoring U.S. ace of the war with his fifth and sixth MiG kills."
  summarized_by: "Claude Opus 5.5"
  summarized_at: "2026-10-26T18:30:00Z"
- month: 9
  day: 11
  year: 1968
  title: "Wheeler argues against halting attacks on the North"
  body: "<p>On September 11, 1968, the Chairman of the Joint Chiefs of Staff, General Wheeler, set down his doubts about a proposed cessation of all offensive actions against the North. Under the proposal, the President would announce in a nationally-televised speech that the cessation would take effect one week later, assume that the North Vietnamese would refrain from certain military actions and begin talks within 2-3 days, and construe their silence as consent.</p>\n<p>A note attached to the paper, addressed to Clifford, said it set forth the doubts and problems raised by his idea of a cessation of bombing. The paper questioned whether silence could be construed as consent in international law, expected protracted negotiations, and judged that once the offensive ceased, \"the chances of resumption are most remote.\" It concluded that \"it is militarily wrong to make concessions from a position of strength to an enemy showing signs of increasing strain and weakness.\"</p>\n<p>By October 17 Clifford had handed the paper to Warnke, who returned it, feeling that no action was indicated.</p>"
