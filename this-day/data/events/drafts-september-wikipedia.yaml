  source_text: "[U.S. Army, 3d Brigade, 1st Cavalry Division, After Action Report (3 Sep 66 Attack on Camp Radcliff), 17 September 1966, p. 1, transcribed from the scan] GENERAL: Camp Radcliff was mortared on the night of 3 September 1966. The mortar fire was concentrated on the Golf Course, and damaged parked helicopters as well as inflicting personnel casualties. The camp was alerted and Division Artillery fired the planned countermortar program.\nA small reconnaissance patrol outside of camp briefly contacted what is considered to have been the withdrawing enemy force which fired the mortars. The enemy force was estimated at one platoon. The patrol opened fire on and pursued the enemy with mortar and artillery fire. Based on this contact one company of the 2d Battalion, 5th Cavalry landed by air assault at night and tried to intercept the enemy. They were unable to gain contact, and another company sent out by air assault after daylight was also unable to make contact. The search for the enemy continued for 48 hours and discovered the mortar firing positions, but the enemy force was not found.\n\n[same, p. 2, transcribed from the scan] At 2150 hours the first of 119 82mm mortar rounds started falling on and around the Golf Course heliport at Camp Radcliff (Incl 2 photo of mortar strike area). The firing continued for about five minutes and simultaneously alerted the Division, Division Artillery, Third Brigade, and other major headquarters.\n\n[same, p. 3, transcribed from the scan] Four 82mm mortar base plate impressions were found in the ground at BR 453491, just outside of the barrier wire northwest of Camp Radcliff. 27 plastic fuze well covers and three unfired 82mm mortar rounds were lying nearby.\na. Personnel Casualties: Total 4 KIA and 76 WIA (4 KIA and 56 WIA from 15th TC Bn; 12 WIA from Division Artillery; and 8 from other units). (G-1)\nb. Seventy-seven helicopters were damaged (one by direct hit).\nc. Division Artillery fired 2398 rounds of 105mm, 400 rounds of 155mm, 11 rounds of 8\", and one round of 175mm; total 2810 rounds.\n\n[Wikipedia, 1966_in_the_Vietnam_War, rev 1380091905] A VC mortar attack on Camp Radcliff killed four U.S. and wounded 76 and damaged 77 helicopters."
